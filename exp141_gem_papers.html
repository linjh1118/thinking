antly enhance human productivity by reasoning, using tools, and executing complex tasks in diverse environments. However, current approaches to developing such agents remain costly and inefficient, as they typically require manually constructed task datasets and reinforcement learning (RL) pipelines with extensive random exploration. These limitations lead to prohibitively high data-construction costs, low exploration efficiency, and poor sample utilization. To address these challenges, we present AgentEvolver, a self-evolving agent system that leverages the semantic understanding and reasoning capabilities of LLMs to drive autonomous agent learning. AgentEvolver introduces three synergistic mechanisms: (i) self-questioning, which enables curiosity-driven task generation in novel environments, reducing dependence on handcrafted datasets; (ii) self-navigating, which improves exploration efficiency through experience reuse and hybrid policy guidance; and (iii) self-attributing, which enhances sample efficiency by assigning differentiated rewards to trajectory states and actions based on their contribution. By integrating these mechanisms into a unified framework, AgentEvolver enables scalable, cost-effective, and continual improvement of agent capabilities. Preliminary experiments indicate that AgentEvolver achieves more efficient exploration, better sample utilization, and faster adaptation compared to traditional RL-based baselines.", "authors": ["Authors:Yunpeng Zhai", "Shuchang Tao", "Cheng Chen", "Anni Zou", "Ziqian Chen"], "categories": ["Machine"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2511.10395", "pdf_url": "https://arxiv.org/pdf/2511.10395", "github_repo": "https://github.com/modelscope/AgentEvolver", "source": "github_org"}, {"id": "2511.10555", "date": "2025-11-13", "title": "A Style is Worth One Code: Unlocking Code-to-Style Image Generation with Discrete Style Space", "abstract": "Innovative visual stylization is a cornerstone of artistic creation, yet generating novel and consistent visual styles remains a significant challenge. Existing generative approaches typically rely on lengthy textual prompts, reference images, or parameter-efficient fine-tuning to guide style-aware image generation, but often struggle with style consistency, limited creativity, and complex style representations. In this paper, we affirm that a style is worth one numerical code by introducing the novel task, code-to-style image generation, which produces images with novel, consistent visual styles conditioned solely on a numerical style code. To date, this field has only been primarily explored by the industry (e.g., Midjourney), with no open-source research from the academic community. To fill this gap, we propose CoTyle, the first open-source method for this task. Specifically, we first train a discrete style codebook from a collection of images to extract style embeddings. These embeddings serve as conditions for a text-to-image diffusion model (T2I-DM) to generate stylistic images. Subsequently, we train an autoregressive style generator on the discrete style embeddings to model their distribution, allowing the synthesis of novel style embeddings. During inference, a numerical style code is mapped to a unique style embedding by the style generator, and this embedding guides the T2I-DM to generate images in the corresponding style. Unlike existing methods, our method offers unparalleled simplicity and diversity, unlocking a vast space of reproducible styles from minimal input. Extensive experiments validate that CoTyle effectively turns a numerical code into a style controller, demonstrating a style is worth one code.", "authors": ["Authors:Huijie Liu", "Shuhao Cui", "Haoxiang Cao", "Shuai Ma", "Kai Wu"], "categories": ["Computer"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2511.10555", "pdf_url": "https://arxiv.org/pdf/2511.10555", "github_repo": "https://github.com/kwai-kolors/CoTyle", "source": "github_org"}, {"id": "2511.10647", "date": "2025-11-13", "title": "Depth Anything 3: Recovering the Visual Space from Any Views", "abstract": "We present Depth Anything 3 (DA3), a model that predicts spatially consistent geometry from an arbitrary number of visual inputs, with or without known camera poses. In pursuit of minimal modeling, DA3 yields two key insights: a single plain transformer (e.g., vanilla DINO encoder) is sufficient as a backbone without architectural specialization, and a singular depth-ray prediction target obviates the need for complex multi-task learning. Through our teacher-student training paradigm, the model achieves a level of detail and generalization on par with Depth Anything 2 (DA2). We establish a new visual geometry benchmark covering camera pose estimation, any-view geometry and visual rendering. On this benchmark, DA3 sets a new state-of-the-art across all tasks, surpassing prior SOTA VGGT by an average of 44.3% in camera pose accuracy and 25.1% in geometric accuracy. Moreover, it outperforms DA2 in monocular depth estimation. All models are trained exclusively on public academic datasets.", "authors": ["Authors:Haotong Lin", "Sili Chen", "Junhao Liew", "Donny Y. Chen", "Zhenyu Li"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2511.10647", "pdf_url": "https://arxiv.org/pdf/2511.10647", "github_repo": "https://github.com/bytedance-seed/Depth-Anything-3", "source": "github_org"}, {"id": "2511.03601", "date": "2025-11-05", "title": "Step-Audio-EditX Technical Report", "abstract": "We present Step-Audio-EditX, the first open-source LLM-based audio model excelling at expressive and iterative audio editing encompassing emotion, speaking style, and paralinguistics alongside robust zero-shot text-to-speech (TTS) capabilities. Our core innovation lies in leveraging only large-margin synthetic data, which circumvents the need for embedding-based priors or auxiliary modules. This large-margin learning approach enables both iterative control and high expressivity across voices, and represents a fundamental pivot from the conventional focus on representation-level disentanglement. Evaluation results demonstrate that Step-Audio-EditX surpasses both MiniMax-2.6-hd and Doubao-Seed-TTS-2.0 in emotion editing and other fine-grained control tasks.", "authors": ["Authors:Chao Yan", "Boyong Wu", "Peng Yang", "Pengfei Tan", "Guoqiang Hu"], "categories": ["Computation"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2511.03601", "pdf_url": "https://arxiv.org/pdf/2511.03601", "github_repo": "https://github.com/stepfun-ai/Step-Audio-EditX", "source": "github_org"}, {"id": "2510.27234", "date": "2025-11-03", "title": "MoRE: 3D Visual Geometry Reconstruction Meets Mixture-of-Experts", "abstract": "Recent advances in language and vision have demonstrated that scaling up\nmodel capacity consistently improves performance across diverse tasks. In 3D\nvisual geometry reconstruction, large-scale training has likewise proven\neffective for learning versatile representations. However, further scaling of\n3D models is challenging due to the complexity of geometric supervision and the\ndiversity of 3D data. To overcome these limitations, we propose MoRE, a dense\n3D visual foundation model based on a Mixture-of-Experts (MoE) architecture\nthat dynamically routes features to task-specific experts, allowing them to\nspecialize in complementary data aspects and enhance both scalability and\nadaptability. Aiming to improve robustness under real-world conditions, MoRE\nincorporates a confidence-based depth refinement module that stabilizes and\nrefines geometric estimation. In addition, it integrates dense semantic\nfeatures with globally aligned 3D backbone representations for high-fidelity\nsurface normal prediction. MoRE is further optimized with tailored loss\nfunctions to ensure robust learning across diverse inputs and multiple\ngeometric tasks. Extensive experiments demonstrate that MoRE achieves\nstate-of-the-art performance across multiple benchmarks and supports effective\ndownstream applications without extra computation.", "authors": ["Jingnan Gao", "Zhe Wang", "Xianze Fang", "Xingyu Ren", "Zhuo Chen"], "categories": ["cs.CV"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2510.27234", "pdf_url": "https://arxiv.org/pdf/2510.27234", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.27632", "date": "2025-11-03", "title": "Sketch-to-Layout: Sketch-Guided Multimodal Layout Generation", "abstract": "Graphic layout generation is a growing research area focusing on generating\naesthetically pleasing layouts ranging from poster designs to documents. While\nrecent research has explored ways to incorporate user constraints to guide the\nlayout generation, these constraints often require complex specifications which\nreduce usability. We introduce an innovative approach exploiting user-provided\nsketches as intuitive constraints and we demonstrate empirically the\neffectiveness of this new guidance method, establishing the sketch-to-layout\nproblem as a promising research direction, which is currently under-explored.\nTo tackle the sketch-to-layout problem, we propose a multimodal\ntransformer-based solution using the sketch and the content assets as inputs to\nproduce high quality layouts. Since collecting sketch training data from human\nannotators to train our model is very costly, we introduce a novel and\nefficient method to synthetically generate training sketches at scale. We train\nand evaluate our model on three publicly available datasets: PubLayNet,\nDocLayNet and SlidesVQA, demonstrating that it outperforms state-of-the-art\nconstraint-based methods, while offering a more intuitive design experience. In\norder to facilitate future sketch-to-layout research, we release O(200k)\nsynthetically-generated sketches for the public datasets above. The datasets\nare available at https://github.com/google-deepmind/sketch_to_layout.", "authors": ["Riccardo Brioschi", "Aleksandr Alekseev", "Emanuele Nevali", "Berkay Döner", "Omar El Malki"], "categories": ["cs.CV", "cs.AI"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2510.27632", "pdf_url": "https://arxiv.org/pdf/2510.27632", "github_repo": "", "source": "daily_arxiv"}, {"id": "2511.01670", "date": "2025-11-03", "title": "SeaLLMs-Audio: Large Audio-Language Models for Southeast Asia", "abstract": "We introduce SeaLLMs-Audio, the first large audio-language model (LALM) tailored for multiple Southeast Asian (SEA) languages-Indonesian (id), Thai (th), and Vietnamese (vi)-alongside English (en) and Chinese (zh). Trained on a large-scale audio corpus, SeaLLMs-Audio exhibits strong performance across diverse audio-centric tasks, spanning fine-grained audio understanding and voice-based interaction. Its key features include: 1) Multilingual: the model primarily supports 5 languages, namely Indonesian, Thai, Vietnamese, English, and Chinese; 2) Multimodal: the model accepts flexible input modalities, including audio only, text only, as well as audio with text; 3) Multi-task: the model supports a wide range of tasks, including audio analysis tasks such as Audio Captioning, Automatic Speech Recognition, Speech-to-Text Translation, Speech Emotion Recognition, Speech Question Answering, and Speech Summarization. It also enables voice-based dialogue, including answering factual, mathematical, and general knowledge queries. As a significant step towards advancing audio LLMs in Southeast Asia, we expect SeaLLMs-Audio to benefit both the regional research community and industry. To automate LALM evaluation for Southeast Asia, we introduce SeaBench-Audio, a benchmark spanning multiple tasks. Experiments show that SeaLLMs-Audio achieves competitive performance compared with other LALMs on SEA languages.", "authors": ["Authors:Chaoqun Liu", "Mahani Aljunied", "Guizhen Chen", "Hou Pong Chan", "Weiwen Xu"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2511.01670", "pdf_url": "https://arxiv.org/pdf/2511.01670", "github_repo": "https://github.com/DAMO-NLP-SG/SeaLLMs-Audio", "source": "github_org"}, {"id": "2510.27606", "date": "2025-10-31", "title": "Spatial-SSRL: Enhancing Spatial Understanding via Self-Supervised Reinforcement Learning", "abstract": "Spatial understanding remains a weakness of Large Vision-Language Models (LVLMs). Existing supervised fine-tuning (SFT) and recent reinforcement learning with verifiable rewards (RLVR) pipelines depend on costly supervision, specialized tools, or constrained environments that limit scale. We introduce Spatial-SSRL, a self-supervised RL paradigm that derives verifiable signals directly from ordinary RGB or RGB-D images. Spatial-SSRL automatically formulates five pretext tasks that capture 2D and 3D spatial structure: shuffled patch reordering, flipped patch recognition, cropped patch inpainting, regional depth ordering, and relative 3D position prediction. These tasks provide ground-truth answers that are easy to verify and require no human or LVLM annotation. Training on our tasks substantially improves spatial reasoning while preserving general visual capabilities. On seven spatial understanding benchmarks in both image and video settings, Spatial-SSRL delivers average accuracy gains of 4.63% (3B) and 3.89% (7B) over the Qwen2.5-VL baselines. Our results show that simple, intrinsic supervision enables RLVR at scale and provides a practical route to stronger spatial intelligence in LVLMs.", "authors": ["Authors:Yuhong Liu", "Beichen Zhang", "Yuhang Zang", "Yuhang Cao", "Long Xing"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.27606", "pdf_url": "https://arxiv.org/pdf/2510.27606", "github_repo": "https://github.com/InternLM/Spatial-SSRL", "source": "github_org"}, {"id": "2510.26768", "date": "2025-10-30", "title": "AMO-Bench: Large Language Models Still Struggle in High School Math Competitions", "abstract": "We present AMO-Bench, an Advanced Mathematical reasoning benchmark with Olympiad level or even higher difficulty, comprising 50 human-crafted problems. Existing benchmarks have widely leveraged high school math competitions for evaluating mathematical reasoning capabilities of large language models (LLMs). However, many existing math competitions are becoming less effective for assessing top-tier LLMs due to performance saturation (e.g., AIME24/25). To address this, AMO-Bench introduces more rigorous challenges by ensuring all 50 problems are (1) cross-validated by experts to meet at least the International Mathematical Olympiad (IMO) difficulty standards, and (2) entirely original problems to prevent potential performance leakages from data memorization. Moreover, each problem in AMO-Bench requires only a final answer rather than a proof, enabling automatic and robust grading for evaluation. Experimental results across 26 LLMs on AMO-Bench show that even the best-performing model achieves only 52.4% accuracy on AMO-Bench, with most LLMs scoring below 40%. Beyond these poor performances, our further analysis reveals a promising scaling trend with increasing test-time compute on AMO-Bench. These results highlight the significant room for improving the mathematical reasoning in current LLMs. We release AMO-Bench to facilitate further research into advancing the reasoning abilities of language models. this https URL", "authors": ["Authors:Shengnan An", "Xunliang Cai", "Xuezhi Cao", "Xiaoyu Li", "Yehao Lin"], "categories": ["Computation"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2510.26768", "pdf_url": "https://arxiv.org/pdf/2510.26768", "github_repo": "https://github.com/meituan-longcat/AMO-Bench", "source": "github_org"}, {"id": "2510.24035", "date": "2025-10-28", "title": "GraphNet: A Large-Scale Computational Graph Dataset for Tensor Compiler Research", "abstract": "We introduce GraphNet, a dataset of 2.7K real-world deep learning computational graphs with rich metadata, spanning six major task categories across multiple deep learning frameworks. To evaluate tensor compiler performance on these samples, we propose the benchmark metric Speedup Score S(t), which jointly considers runtime speedup and execution correctness under tunable tolerance levels, offering a reliable measure of general optimization capability. Furthermore, we extend S(t) to the Error-aware Speedup Score ES(t), which incorporates error information and helps compiler developers identify key performance bottlenecks. In this report, we benchmark the default tensor compilers, CINN for PaddlePaddle and TorchInductor for PyTorch, on computer vision (CV) and natural language processing (NLP) samples to demonstrate the practicality of GraphNet. The full construction pipeline with graph extraction and compiler evaluation tools is available at this https URL .", "authors": ["Authors:Xinqi Li", "Yiqun Liu", "Shan Jiang", "Enrong Zheng", "Huaijin Zheng"], "categories": ["Machine"], "companies": ["Baidu"], "abs_url": "https://arxiv.org/abs/2510.24035", "pdf_url": "https://arxiv.org/pdf/2510.24035", "github_repo": "https://github.com/PaddlePaddle/GraphNet", "source": "github_org"}, {"id": "2510.24693", "date": "2025-10-28", "title": "STAR-Bench: Probing Deep Spatio-Temporal Reasoning as Audio 4D Intelligence", "abstract": "Despite rapid progress in Multi-modal Large Language Models and Large Audio-Language Models, existing audio benchmarks largely test semantics that can be recovered from text captions, masking deficits in fine-grained perceptual reasoning. We formalize audio 4D intelligence that is defined as reasoning over sound dynamics in time and 3D space, and introduce STAR-Bench to measure it. STAR-Bench combines a Foundational Acoustic Perception setting (six attributes under absolute and relative regimes) with a Holistic Spatio-Temporal Reasoning setting that includes segment reordering for continuous and discrete processes and spatial tasks spanning static localization, multi-source relations, and dynamic trajectories. Our data curation pipeline uses two methods to ensure high-quality samples. For foundational tasks, we use procedurally synthesized and physics-simulated audio. For holistic data, we follow a four-stage process that includes human annotation and final selection based on human performance. Unlike prior benchmarks where caption-only answering reduces accuracy slightly, STAR-Bench induces far larger drops (-31.5\\% temporal, -35.2\\% spatial), evidencing its focus on linguistically hard-to-describe cues. Evaluating 19 models reveals substantial gaps compared with humans and a capability hierarchy: closed-source models are bottlenecked by fine-grained perception, while open-source models lag across perception, knowledge, and reasoning. Our STAR-Bench provides critical insights and a clear path forward for developing future models with a more robust understanding of the physical world.", "authors": ["Authors:Zihan Liu", "Zhikang Niu", "Qiuyang Xiao", "Zhisheng Zheng", "Ruoqi Yuan"], "categories": ["Sound"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.24693", "pdf_url": "https://arxiv.org/pdf/2510.24693", "github_repo": "https://github.com/InternLM/StarBench", "source": "github_org"}, {"id": "2510.20888", "date": "2025-10-27", "title": "Video-As-Prompt: Unified Semantic Control for Video Generation", "abstract": "Unified, generalizable semantic control in video generation remains a\ncritical open challenge. Existing methods either introduce artifacts by\nenforcing inappropriate pixel-wise priors from structure-based controls, or\nrely on non-generalizable, condition-specific finetuning or task-specific\narchitectures. We introduce Video-As-Prompt (VAP), a new paradigm that reframes\nthis problem as in-context generation. VAP leverages a reference video as a\ndirect semantic prompt, guiding a frozen Video Diffusion Transformer (DiT) via\na plug-and-play Mixture-of-Transformers (MoT) expert. This architecture\nprevents catastrophic forgetting and is guided by a temporally biased position\nembedding that eliminates spurious mapping priors for robust context retrieval.\nTo power this approach and catalyze future research, we built VAP-Data, the\nlargest dataset for semantic-controlled video generation with over 100K paired\nvideos across 100 semantic conditions. As a single unified model, VAP sets a\nnew state-of-the-art for open-source methods, achieving a 38.7% user preference\nrate that rivals leading condition-specific commercial models. VAP's strong\nzero-shot generalization and support for various downstream applications mark a\nsignificant advance toward general-purpose, controllable video generation.", "authors": ["Yuxuan Bian", "Xin Chen", "Zenan Li", "Tiancheng Zhi", "Shen Sang"], "categories": ["cs.CV", "cs.AI"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2510.20888", "pdf_url": "https://arxiv.org/pdf/2510.20888", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.23538", "date": "2025-10-27", "title": "JanusCoder: Towards a Foundational Visual-Programmatic Interface for Code Intelligence", "abstract": "The scope of neural code intelligence is rapidly expanding beyond text-based source code to encompass the rich visual outputs that programs generate. This visual dimension is critical for advanced applications like flexible content generation and precise, program-driven editing of visualizations. However, progress has been impeded by the scarcity of high-quality multimodal code data, a bottleneck stemming from challenges in synthesis and quality assessment. To address these challenges, we make contributions from both a data and modeling perspective. We first introduce a complete synthesis toolkit that leverages reciprocal synergies between data modalities to efficiently produce a large-scale, high-quality corpus spanning from standard charts to complex interactive web UIs and code-driven animations. Leveraging this toolkit, we construct JanusCode-800K, the largest multimodal code corpus to date. This powers the training of our models, JanusCoder and JanusCoderV, which establish a visual-programmatic interface for generating code from textual instructions, visual inputs, or a combination of both. Our unified model is a departure from existing approaches that build specialized models for isolated tasks. Extensive experiments on both text-centric and vision-centric coding tasks demonstrate the superior performance of the JanusCoder series, with our 7B to 14B scale models approaching or even exceeding the performance of commercial models. Furthermore, extensive analysis provides key insights into harmonizing programmatic logic with its visual expression. Our code and checkpoints are available at this https URL .", "authors": ["Authors:Qiushi Sun", "Jingyang Gong", "Yang Liu", "Qiaosheng Chen", "Lei Li"], "categories": ["Artificial"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.23538", "pdf_url": "https://arxiv.org/pdf/2510.23538", "github_repo": "https://github.com/InternLM/JanusCoder", "source": "github_org"}, {"id": "2510.22200", "date": "2025-10-25", "title": "LongCat-Video Technical Report", "abstract": "Video generation is a critical pathway toward world models, with efficient long video inference as a key capability. Toward this end, we introduce LongCat-Video, a foundational video generation model with 13.6B parameters, delivering strong performance across multiple video generation tasks. It particularly excels in efficient and high-quality long video generation, representing our first step toward world models. Key features include: Unified architecture for multiple tasks: Built on the Diffusion Transformer (DiT) framework, LongCat-Video supports Text-to-Video, Image-to-Video, and Video-Continuation tasks with a single model; Long video generation: Pretraining on Video-Continuation tasks enables LongCat-Video to maintain high quality and temporal coherence in the generation of minutes-long videos; Efficient inference: LongCat-Video generates 720p, 30fps videos within minutes by employing a coarse-to-fine generation strategy along both the temporal and spatial axes. Block Sparse Attention further enhances efficiency, particularly at high resolutions; Strong performance with multi-reward RLHF: Multi-reward RLHF training enables LongCat-Video to achieve performance on par with the latest closed-source and leading open-source models. Code and model weights are publicly available to accelerate progress in the field.", "authors": ["Authors:Meituan LongCat Team: Xunliang Cai", "Qilong Huang", "Zhuoliang Kang", "Hongyu Li", "Shijun Liang"], "categories": ["Computer"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2510.22200", "pdf_url": "https://arxiv.org/pdf/2510.22200", "github_repo": "https://github.com/meituan-longcat/LongCat-Video", "source": "github_org"}, {"id": "2510.19400", "date": "2025-10-23", "title": "Seeing Across Views: Benchmarking Spatial Reasoning of Vision-Language Models in Robotic Scenes", "abstract": "Vision-language models (VLMs) are essential to Embodied AI, enabling robots\nto perceive, reason, and act in complex environments. They also serve as the\nfoundation for the recent Vision-Language-Action (VLA) models. Yet most\nevaluations of VLMs focus on single-view settings, leaving their ability to\nintegrate multi-view information underexplored. At the same time, multi-camera\nsetups are increasingly standard in robotic platforms, as they provide\ncomplementary perspectives to mitigate occlusion and depth ambiguity. Whether\nVLMs can effectively leverage such multi-view inputs for robotic reasoning\ntherefore remains an open question. To bridge this gap, we introduce\nMV-RoboBench, a benchmark specifically designed to evaluate the multi-view\nspatial reasoning capabilities of VLMs in robotic manipulation. MV-RoboBench\nconsists of 1.7k manually curated QA items across eight subtasks, divided into\ntwo primary categories: spatial understanding and robotic execution. We\nevaluate a diverse set of existing VLMs, including both open-source and\nclosed-source models, along with enhanced versions incorporating CoT-inspired\ntechniques. The results show that state-of-the-art models remain far below\nhuman performance, underscoring the substantial challenges VLMs face in\nmulti-view robotic perception. Additionally, our analysis uncovers two key\nfindings: (i) spatial intelligence and robotic task execution are positively\ncorrelated in multi-view robotic scenarios; and (ii) strong performance on\nexisting general-purpose single-view spatial understanding benchmarks does not\nreliably translate to success in the robotic spatial tasks assessed by our\nbenchmark. We release MV-RoboBench as an open resource to foster progress in\nspatially grounded VLMs and VLAs, providing not only data but also a\nstandardized evaluation protocol for multi-view embodied reasoning.", "authors": ["Zhiyuan Feng", "Zhaolu Kang", "Qijie Wang", "Zhiying Du", "Jiongrui Yan"], "categories": ["cs.CV"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2510.19400", "pdf_url": "https://arxiv.org/pdf/2510.19400", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.19557", "date": "2025-10-22", "title": "The Intricate Dance of Prompt Complexity, Quality, Diversity, and Consistency in T2I Models", "abstract": "Text-to-image (T2I) models offer great potential for creating virtually limitless synthetic data, a valuable resource compared to fixed and finite real datasets. Previous works evaluate the utility of synthetic data from T2I models on three key desiderata: quality, diversity, and consistency. While prompt engineering is the primary means of interacting with T2I models, the systematic impact of prompt complexity on these critical utility axes remains underexplored. In this paper, we first conduct synthetic experiments to motivate the difficulty of generalization with regard to prompt complexity and explain the observed difficulty with theoretical derivations. Then, we introduce a new evaluation framework that can compare the utility of real data and synthetic data, and present a comprehensive analysis of how prompt complexity influences the utility of synthetic data generated by commonly used T2I models. We conduct our study across diverse datasets, including CC12M, ImageNet-1k, and DCI, and evaluate different inference-time intervention methods. Our synthetic experiments show that generalizing to more general conditions is harder than the other way round, since the former needs an estimated likelihood that is not learned by diffusion models. Our large-scale empirical experiments reveal that increasing prompt complexity results in lower conditional diversity and prompt consistency, while reducing the synthetic-to-real distribution shift, which aligns with the synthetic experiments. Moreover, current inference-time interventions can augment the diversity of the generations at the expense of moving outside the support of real data. Among those interventions, prompt expansion, by deliberately using a pre-trained language model as a likelihood estimator, consistently achieves the highest performance in both image diversity and aesthetics, even higher than that of real data.", "authors": ["Authors:Zhang Xiaofeng", "Aaron Courville", "Michal Drozdzal", "Adriana Romero-Soriano"], "categories": ["Computer"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2510.19557", "pdf_url": "https://arxiv.org/pdf/2510.19557", "github_repo": "https://github.com/facebookresearch/synthetic_data_utility_prompt_complexity", "source": "github_org"}, {"id": "2510.18234", "date": "2025-10-21", "title": "DeepSeek-OCR: Contexts Optical Compression", "abstract": "We present DeepSeek-OCR as an initial investigation into the feasibility of compressing long contexts via optical 2D mapping. DeepSeek-OCR consists of two components: DeepEncoder and DeepSeek3B-MoE-A570M as the decoder. Specifically, DeepEncoder serves as the core engine, designed to maintain low activations under high-resolution input while achieving high compression ratios to ensure an optimal and manageable number of vision tokens. Experiments show that when the number of text tokens is within 10 times that of vision tokens (i.e., a compression ratio &lt; 10x), the model can achieve decoding (OCR) precision of 97%. Even at a compression ratio of 20x, the OCR accuracy still remains at about 60%. This shows considerable promise for research areas such as historical long-context compression and memory forgetting mechanisms in LLMs. Beyond this, DeepSeek-OCR also demonstrates high practical value. On OmniDocBench, it surpasses GOT-OCR2.0 (256 tokens/page) using only 100 vision tokens, and outperforms MinerU2.0 (6000+ tokens per page on average) while utilizing fewer than 800 vision tokens. In production, DeepSeek-OCR can generate training data for LLMs/VLMs at a scale of 200k+ pages per day (a single A100-40G). Codes and model weights are publicly accessible at this http URL .", "authors": ["Authors:Haoran Wei", "Yaofeng Sun", "Yukun Li"], "categories": ["Computer"], "companies": ["DeepSeek"], "abs_url": "https://arxiv.org/abs/2510.18234", "pdf_url": "https://arxiv.org/pdf/2510.18234", "github_repo": "https://github.com/deepseek-ai/DeepSeek-OCR", "source": "github_org"}, {"id": "2510.18915", "date": "2025-10-21", "title": "UNO-Bench: A Unified Benchmark for Exploring the Compositional Law Between Uni-modal and Omni-modal in Omni Models", "abstract": "Multimodal Large Languages models have been progressing from uni-modal understanding toward unifying visual, audio and language modalities, collectively termed omni models. However, the correlation between uni-modal and omni-modal remains unclear, which requires comprehensive evaluation to drive omni model&#39;s intelligence evolution. In this work, we introduce a novel, high-quality, and UNified Omni model benchmark, UNO-Bench. This benchmark is designed to effectively evaluate both UNi-modal and Omni-modal capabilities under a unified ability taxonomy, spanning 44 task types and 5 modality combinations. It includes 1250 human curated samples for omni-modal with 98% cross-modality solvability, and 2480 enhanced uni-modal samples. The human-generated dataset is well-suited to real-world scenarios, particularly within the Chinese context, whereas the automatically compressed dataset offers a 90% increase in speed and maintains 98% consistency across 18 public benchmarks. In addition to traditional multi-choice questions, we propose an innovative multi-step open-ended question format to assess complex reasoning. A general scoring model is incorporated, supporting 6 question types for automated evaluation with 95% accuracy. Experimental result shows the Compositional Law between omni-modal and uni-modal performance and the omni-modal capability manifests as a bottleneck effect on weak models, while exhibiting synergistic promotion on strong models.", "authors": ["Authors:Chen Chen", "ZeYang Hu", "Fengjiao Chen", "Liya Ma", "Jiaxing Liu"], "categories": ["Computation"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2510.18915", "pdf_url": "https://arxiv.org/pdf/2510.18915", "github_repo": "https://github.com/meituan-longcat/UNO-Bench", "source": "github_org"}, {"id": "2510.15870", "date": "2025-10-20", "title": "OmniVinci: Enhancing Architecture and Data for Omni-Modal Understanding LLM", "abstract": "Advancing machine intelligence requires developing the ability to perceive\nacross multiple modalities, much as humans sense the world. We introduce\nOmniVinci, an initiative to build a strong, open-source, omni-modal LLM. We\ncarefully study the design choices across model architecture and data curation.\nFor model architecture, we present three key innovations: (i) OmniAlignNet for\nstrengthening alignment between vision and audio embeddings in a shared\nomni-modal latent space; (ii) Temporal Embedding Grouping for capturing\nrelative temporal alignment between vision and audio signals; and (iii)\nConstrained Rotary Time Embedding for encoding absolute temporal information in\nomni-modal embeddings. We introduce a curation and synthesis pipeline that\ngenerates 24M single-modal and omni-modal conversations. We find that\nmodalities reinforce one another in both perception and reasoning. Our model,\nOmniVinci, outperforms Qwen2.5-Omni with +19.05 on DailyOmni (cross-modal\nunderstanding), +1.7 on MMAR (audio), and +3.9 on Video-MME (vision), while\nusing just 0.2T training tokens - a 6 times reduction compared to\nQwen2.5-Omni's 1.2T. We finally demonstrate omni-modal advantages in downstream\napplications spanning robotics, medical AI, and smart factory.", "authors": ["Hanrong Ye", "Chao-Han Huck Yang", "Arushi Goel", "Wei Huang", "Ligeng Zhu"], "categories": ["cs.CV", "cs.AI", "cs.CL"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2510.15870", "pdf_url": "https://arxiv.org/pdf/2510.15870", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.16281", "date": "2025-10-18", "title": "Do What You Say: Steering Vision-Language-Action Models via Runtime Reasoning-Action Alignment Verification", "abstract": "Reasoning Vision Language Action (VLA) models improve robotic instruction-following by generating step-by-step textual plans before low-level actions, an approach inspired by Chain-of-Thought (CoT) reasoning in language models. Yet even with a correct textual plan, the generated actions can still miss the intended outcomes in the plan, especially in out-of-distribution (OOD) scenarios. We formalize this phenomenon as a lack of embodied CoT faithfulness, and introduce a training-free, runtime policy steering method for reasoning-action alignment. Given a reasoning VLA&#39;s intermediate textual plan, our framework samples multiple candidate action sequences from the same model, predicts their outcomes via simulation, and uses a pre-trained Vision-Language Model (VLM) to select the sequence whose outcome best aligns with the VLA&#39;s own textual plan. Only executing action sequences that align with the textual reasoning turns our base VLA&#39;s natural action diversity from a source of error into a strength, boosting robustness to semantic and visual OOD perturbations and enabling novel behavior composition without costly re-training. We also contribute a reasoning-annotated extension of LIBERO-100, environment variations tailored for OOD evaluation, and demonstrate up to 15% performance gain over prior work on behavior composition tasks and scales with compute and data diversity. Project Website at: this https URL", "authors": ["Authors:Yilin Wu", "Anqi Li", "Tucker Hermans", "Fabio Ramos", "Andrea Bajcsy"], "categories": ["Robotics"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2510.16281", "pdf_url": "https://arxiv.org/pdf/2510.16281", "github_repo": "https://github.com/NVlabs/actalign", "source": "github_org"}, {"id": "2510.15227", "date": "2025-10-17", "title": "LongCat-Audio-Codec: An Audio Tokenizer and Detokenizer Solution Designed for Speech Large Language Models", "abstract": "This paper presents LongCat-Audio-Codec, an audio tokenizer and detokenizer solution designed for industrial grade end-to-end speech large language models. By leveraging a decoupled model architecture and a multistage training strategy, LongCat-Audio-Codec exhibits robust semantic modeling capabilities, flexible acoustic feature extraction capabilities, and low-latency streaming synthesis capabilities. It encodes speech at an ultra-low frame rate of 16.67 Hz, with a minimum bitrate of 0.43 kbps and a maximum bitrate of 0.87 kbps. Evaluation results demonstrate that LongCat-Audio-Codec achieves strong speech intelligibility and is capable of synthesizing highquality speech at low bitrate, thus effectively balancing coding efficiency and decoding quality. The inference code and model checkpoints of LongCat-Audio-Codec are available at: this https URL .", "authors": ["Authors:Xiaohan Zhao", "Hongyu Xiang", "Shengze Ye", "Song Li", "Zhengkun Tian"], "categories": ["Audio"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2510.15227", "pdf_url": "https://arxiv.org/pdf/2510.15227", "github_repo": "https://github.com/meituan-longcat/LongCat-Audio-Codec", "source": "github_org"}, {"id": "2510.15821", "date": "2025-10-17", "title": "Chronos-2: From Univariate to Universal Forecasting", "abstract": "Pretrained time series models have enabled inference-only forecasting systems that produce accurate predictions without task-specific training. However, existing approaches largely focus on univariate forecasting, limiting their applicability in real-world scenarios where multivariate data and covariates play a crucial role. We present Chronos-2, a pretrained model capable of handling univariate, multivariate, and covariate-informed forecasting tasks in a zero-shot manner. Chronos-2 employs a group attention mechanism that facilitates in-context learning (ICL) through efficient information sharing across multiple time series within a group, which may represent sets of related series, variates of a multivariate series, or targets and covariates in a forecasting task. These general capabilities are achieved through training on synthetic datasets that impose diverse multivariate structures on univariate series. Chronos-2 delivers state-of-the-art performance across three comprehensive benchmarks: fev-bench, GIFT-Eval, and Chronos Benchmark II. On fev-bench, which emphasizes multivariate and covariate-informed forecasting, Chronos-2&#39;s universal ICL capabilities lead to substantial improvements over existing models. On tasks involving covariates, it consistently outperforms baselines by a wide margin. Case studies in the energy and retail domains further highlight its practical advantages. The in-context learning capabilities of Chronos-2 establish it as a general-purpose forecasting model that can be used &#34;as is&#34; in real-world forecasting pipelines.", "authors": ["Authors:Abdul Fatir Ansari", "Oleksandr Shchur", "Jaris Küken", "Andreas Auer", "Boran Han"], "categories": ["Machine"], "companies": ["Amazon"], "abs_url": "https://arxiv.org/abs/2510.15821", "pdf_url": "https://arxiv.org/pdf/2510.15821", "github_repo": "https://github.com/amazon-science/chronos-forecasting", "source": "github_org"}, {"id": "2510.13291", "date": "2025-10-16", "title": "Higher Satisfaction, Lower Cost: A Technical Report on How LLMs Revolutionize Meituan's Intelligent Interaction Systems", "abstract": "Enhancing customer experience is essential for business success, particularly\nas service demands grow in scale and complexity. Generative artificial\nintelligence and Large Language Models (LLMs) have empowered intelligent\ninteraction systems to deliver efficient, personalized, and 24/7 support. In\npractice, intelligent interaction systems encounter several challenges: (1)\nConstructing high-quality data for cold-start training is difficult, hindering\nself-evolution and raising labor costs. (2) Multi-turn dialogue performance\nremains suboptimal due to inadequate intent understanding, rule compliance, and\nsolution extraction. (3) Frequent evolution of business rules affects system\noperability and transferability, constraining low-cost expansion and\nadaptability. (4) Reliance on a single LLM is insufficient in complex\nscenarios, where the absence of multi-agent frameworks and effective\ncollaboration undermines process completeness and service quality. (5) The\nopen-domain nature of multi-turn dialogues, lacking unified golden answers,\nhampers quantitative evaluation and continuous optimization. To address these\nchallenges, we introduce WOWService, an intelligent interaction system tailored\nfor industrial applications. With the integration of LLMs and multi-agent\narchitectures, WOWService enables autonomous task management and collaborative\nproblem-solving. Specifically, WOWService focuses on core modules including\ndata construction, general capability enhancement, business scenario\nadaptation, multi-agent coordination, and automated evaluation. Currently,\nWOWService is deployed on the Meituan App, achieving significant gains in key\nmetrics, e.g., User Satisfaction Metric 1 (USM 1) -27.53% and User Satisfaction\nMetric 2 (USM 2) +25.51%, demonstrating its effectiveness in capturing user\nneeds and advancing personalized service.", "authors": ["Xuxin Cheng", "Ke Zeng", "Zhiquan Cao", "Linyi Dai", "Wenxuan Gao"], "categories": ["cs.CL", "cs.AI"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2510.13291", "pdf_url": "https://arxiv.org/pdf/2510.13291", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.13747", "date": "2025-10-15", "title": "InteractiveOmni: A Unified Omni-modal Model for Audio-Visual Multi-turn Dialogue", "abstract": "We introduce InteractiveOmni, a unified and open-source omni-modal large language model for audio-visual multi-turn interaction, ranging from 4B to 8B parameters, designed to lead the field of lightweight models by offering comprehensive omni-modal understanding and speech generation capabilities. To achieve this, we integrate the vision encoder, audio encoder, large language model, and speech decoder into a unified model for understanding and generation tasks. We design a multi-stage training strategy to ensure robust cross-modal capabilities, including pre-training for omni-modal understanding, followed by post-training with speech conversation and audio-visual interaction. To enable human-like long-term conversational ability, we meticulously curate a multi-turn training dataset that enhances the model&#39;s ability to handle complex and multi-turn interactions. To effectively evaluate the multi-turn memory and speech interaction capabilities, we construct the multi-modal multi-turn memory benchmark and the multi-turn speech interaction benchmark. Experiments demonstrate that InteractiveOmni significantly outperforms leading open-source models and provides a more intelligent multi-turn audio-visual experience, particularly in its long-term memory capabilities. Notably, InteractiveOmni-4B is comparable to the much larger model like Qwen2.5-Omni-7B on general benchmarks, and it can retain 97% of the performance of the InteractiveOmni-8B while utilizing only 50% of the model size. Achieving state-of-the-art results against similarly sized models across image, audio, video understanding, and speech generation tasks, InteractiveOmni is an accessible, open-source foundation for next-generation intelligent interactive systems.", "authors": ["Authors:Wenwen Tong", "Hewei Guo", "Dongchuan Ran", "Jiangnan Chen", "Jiefan Lu"], "categories": ["Computer"], "companies": ["SenseTime"], "abs_url": "https://arxiv.org/abs/2510.13747", "pdf_url": "https://arxiv.org/pdf/2510.13747", "github_repo": "https://github.com/OpenSenseNova/InteractiveOmni", "source": "github_org"}, {"id": "2510.13802", "date": "2025-10-15", "title": "Trace Anything: Representing Any Video in 4D via Trajectory Fields", "abstract": "Effective spatio-temporal representation is fundamental to modeling, understanding, and predicting dynamics in videos. The atomic unit of a video, the pixel, traces a continuous 3D trajectory over time, serving as the primitive element of dynamics. Based on this principle, we propose representing any video as a Trajectory Field: a dense mapping that assigns a continuous 3D trajectory function of time to each pixel in every frame. With this representation, we introduce Trace Anything, a neural network that predicts the entire trajectory field in a single feed-forward pass. Specifically, for each pixel in each frame, our model predicts a set of control points that parameterizes a trajectory (i.e., a B-spline), yielding its 3D position at arbitrary query time instants. We trained the Trace Anything model on large-scale 4D data, including data from our new platform, and our experiments demonstrate that: (i) Trace Anything achieves state-of-the-art performance on our new benchmark for trajectory field estimation and performs competitively on established point-tracking benchmarks; (ii) it offers significant efficiency gains thanks to its one-pass paradigm, without requiring iterative optimization or auxiliary estimators; and (iii) it exhibits emergent abilities, including goal-conditioned manipulation, motion forecasting, and spatio-temporal fusion. Project page: this https URL .", "authors": ["Authors:Xinhang Liu", "Yuxi Xiao", "Donny Y. Chen", "Jiashi Feng", "Yu-Wing Tai"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2510.13802", "pdf_url": "https://arxiv.org/pdf/2510.13802", "github_repo": "https://github.com/bytedance-seed/TraceAnything", "source": "github_org"}, {"id": "2510.12126", "date": "2025-10-14", "title": "MetaCaptioner: Towards Generalist Visual Captioning with Open-source Suites", "abstract": "Generalist visual captioning goes beyond a simple appearance description task, but requires integrating a series of visual cues into a caption and handling various visual domains. In this task, current open-source models present a large performance gap with commercial ones, which limits various applications such as data synthesis. To bridge the gap, this paper proposes CapFlow, a novel multi-agent collaboration workflow. CapFlow demonstrates for the first time that, by capitalizing on open-source models, it is possible to achieve caption quality on par with GPT-4.1 in various domains with an 89.5% reduction in costs. By leveraging CapFlow as the data synthesizer, we produce high-quality visual captions from image and video domains at scale, and obtain a generalist visual captioner via fine-tuning, namely MetaCaptioner. Through extensive experiments, we show that MetaCaptioner not only achieves comparable captioning capabilities with commercial models but also reaches top-tier multimodal performance in the open-source community. We hope CapFlow and MetaCaptioner can benefit future multimodal research by providing a strong and cost-effective visual captioning solution.", "authors": ["Authors:Zhenxin Lei", "Zhangwei Gao", "Changyao Tian", "Erfei Cui", "Guanzhou Chen"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.12126", "pdf_url": "https://arxiv.org/pdf/2510.12126", "github_repo": "https://github.com/OpenGVLab/MetaCaptioner", "source": "github_org"}, {"id": "2510.13907", "date": "2025-10-14", "title": "LLM Prompt Duel Optimizer: Efficient Label-Free Prompt Optimization", "abstract": "Large language models (LLMs) are highly sensitive to prompts, but most automatic prompt optimization (APO) methods assume access to ground-truth references (e.g., labeled validation data) that are costly to obtain. We propose the Prompt Duel Optimizer (PDO), a sample-efficient framework for label-free prompt optimization based on pairwise preference feedback from an LLM judge. PDO casts prompt selection as a dueling-bandit problem and combines (i) Double Thompson Sampling to prioritize informative comparisons under a fixed judge budget, with (ii) top-performer guided mutation to expand the candidate pool while pruning weak prompts. Experiments on BIG-bench Hard (BBH) and MS MARCO show that PDO consistently identifies stronger prompts than label-free baselines, while offering favorable quality--cost trade-offs under constrained comparison budgets.", "authors": ["Authors:Yuanchen Wu", "Saurabh Verma", "Justin Lee", "Fangzhou Xiong", "Poppy Zhang"], "categories": ["Computation"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2510.13907", "pdf_url": "https://arxiv.org/pdf/2510.13907", "github_repo": "https://github.com/meta-llama/prompt-ops", "source": "github_org"}, {"id": "2510.09358", "date": "2025-10-13", "title": "Boosting Multi-modal Keyphrase Prediction with Dynamic Chain-of-Thought in Vision-Language Models", "abstract": "Multi-modal keyphrase prediction (MMKP) aims to advance beyond text-only\nmethods by incorporating multiple modalities of input information to produce a\nset of conclusive phrases. Traditional multi-modal approaches have been proven\nto have significant limitations in handling the challenging absence and unseen\nscenarios. Additionally, we identify shortcomings in existing benchmarks that\noverestimate model capability due to significant overlap in training tests. In\nthis work, we propose leveraging vision-language models (VLMs) for the MMKP\ntask. Firstly, we use two widely-used strategies, e.g., zero-shot and\nsupervised fine-tuning (SFT) to assess the lower bound performance of VLMs.\nNext, to improve the complex reasoning capabilities of VLMs, we adopt\nFine-tune-CoT, which leverages high-quality CoT reasoning data generated by a\nteacher model to finetune smaller models. Finally, to address the\n\"overthinking\" phenomenon, we propose a dynamic CoT strategy which adaptively\ninjects CoT data during training, allowing the model to flexibly leverage its\nreasoning capabilities during the inference stage. We evaluate the proposed\nstrategies on various datasets and the experimental results demonstrate the\neffectiveness of the proposed approaches. The code is available at\nhttps://github.com/bytedance/DynamicCoT.", "authors": ["Qihang Ma", "Shengyu Li", "Jie Tang", "Dingkang Yang", "Shaodong Chen"], "categories": ["cs.CV"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2510.09358", "pdf_url": "https://arxiv.org/pdf/2510.09358", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.11027", "date": "2025-10-13", "title": "Vlaser: Vision-Language-Action Model with Synergistic Embodied Reasoning", "abstract": "While significant research has focused on developing embodied reasoning capabilities using Vision-Language Models (VLMs) or integrating advanced VLMs into Vision-Language-Action (VLA) models for end-to-end robot control, few studies directly address the critical gap between upstream VLM-based reasoning and downstream VLA policy learning. In this work, we take an initial step toward bridging embodied reasoning with VLA policy learning by introducing Vlaser - a Vision-Language-Action Model with synergistic embodied reasoning capability, which is a foundational vision-language model designed to integrate high-level reasoning with low-level control for embodied agents. Built upon the high-quality Vlaser-6M dataset, Vlaser achieves state-of-the-art performance across a range of embodied reasoning benchmarks - including spatial reasoning, embodied grounding, embodied QA, and task planning. Furthermore, we systematically examine how different VLM initializations affect supervised VLA fine-tuning, offering novel insights into mitigating the domain shift between internet-scale pre-training data and embodied-specific policy learning data. Based on these insights, our approach achieves state-of-the-art results on the WidowX benchmark and competitive performance on the Google Robot benchmark.", "authors": ["Authors:Ganlin Yang", "Tianyi Zhang", "Haoran Hao", "Weiyun Wang", "Yibin Liu"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.11027", "pdf_url": "https://arxiv.org/pdf/2510.11027", "github_repo": "https://github.com/OpenGVLab/Vlaser", "source": "github_org"}, {"id": "2510.11606", "date": "2025-10-13", "title": "ExpVid: A Benchmark for Experiment Video Understanding &amp; Reasoning", "abstract": "Multimodal Large Language Models (MLLMs) hold promise for accelerating scientific discovery by interpreting complex experimental procedures. However, their true capabilities are poorly understood, as existing benchmarks neglect the fine-grained and long-horizon nature of authentic laboratory work, especially in wet-lab settings. To bridge this gap, we introduce ExpVid, the first benchmark designed to systematically evaluate MLLMs on scientific experiment videos. Curated from peer-reviewed video publications, ExpVid features a new three-level task hierarchy that mirrors the scientific process: (1) Fine-grained Perception of tools, materials, and actions; (2) Procedural Understanding of step order and completeness; and (3) Scientific Reasoning that connects the full experiment to its published conclusions. Our vision-centric annotation pipeline, combining automated generation with multi-disciplinary expert validation, ensures that tasks require visual grounding. We evaluate 19 leading MLLMs on ExpVid and find that while they excel at coarse-grained recognition, they struggle with disambiguating fine details, tracking state changes over time, and linking experimental procedures to scientific outcomes. Our results reveal a notable performance gap between proprietary and open-source models, particularly in high-order reasoning. ExpVid not only provides a diagnostic tool but also charts a roadmap for developing MLLMs capable of becoming trustworthy partners in scientific experimentation.", "authors": ["Authors:Yicheng Xu", "Yue Wu", "Jiashuo Yu", "Ziang Yan", "Tianxiang Jiang"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.11606", "pdf_url": "https://arxiv.org/pdf/2510.11606", "github_repo": "https://github.com/OpenGVLab/ExpVid", "source": "github_org"}, {"id": "2510.08565", "date": "2025-10-10", "title": "NaViL: Rethinking Scaling Properties of Native Multimodal Large Language Models under Data Constraints", "abstract": "Compositional training has been the de-facto paradigm in existing Multimodal\nLarge Language Models (MLLMs), where pre-trained vision encoders are connected\nwith pre-trained LLMs through continuous multimodal pre-training. However, the\nmultimodal scaling property of this paradigm remains difficult to explore due\nto the separated training. In this paper, we focus on the native training of\nMLLMs in an end-to-end manner and systematically study its design space and\nscaling property under a practical setting, i.e., data constraint. Through\ncareful study of various choices in MLLM, we obtain the optimal\nmeta-architecture that best balances performance and training cost. After that,\nwe further explore the scaling properties of the native MLLM and indicate the\npositively correlated scaling relationship between visual encoders and LLMs.\nBased on these findings, we propose a native MLLM called NaViL, combined with a\nsimple and cost-effective recipe. Experimental results on 14 multimodal\nbenchmarks confirm the competitive performance of NaViL against existing MLLMs.\nBesides that, our findings and results provide in-depth insights for the future\nstudy of native MLLMs.", "authors": ["Changyao Tian", "Hao Li", "Gen Luo", "Xizhou Zhu", "Weijie Su"], "categories": ["cs.CV"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2510.08565", "pdf_url": "https://arxiv.org/pdf/2510.08565", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.06239", "date": "2025-10-09", "title": "OpenStaxQA: A multilingual dataset based on open-source college textbooks", "abstract": "We present OpenStaxQA, an evaluation benchmark specific to college-level\neducational applications based on 43 open-source college textbooks in English,\nSpanish, and Polish, available under a permissive Creative Commons license. We\nfinetune and evaluate large language models (LLMs) with approximately 7 billion\nparameters on this dataset using quantized low rank adapters (QLoRa).\nAdditionally we also perform a zero-shot evaluation on the AI2 reasoning\nchallenge dev dataset in order to check if OpenStaxQA can lead to an improved\nperformance on other tasks. We also discuss broader impacts relevant to\ndatasets such as OpenStaxQA.", "authors": ["Pranav Gupta"], "categories": ["cs.CL"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2510.06239", "pdf_url": "https://arxiv.org/pdf/2510.06239", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.07318", "date": "2025-10-09", "title": "Artificial Hippocampus Networks for Efficient Long-Context Modeling", "abstract": "Long-sequence modeling faces a fundamental trade-off between the efficiency\nof compressive fixed-size memory in RNN-like models and the fidelity of\nlossless growing memory in attention-based Transformers. Inspired by the\nMulti-Store Model in cognitive science, we introduce a memory framework of\nartificial neural networks. Our method maintains a sliding window of the\nTransformer's KV cache as lossless short-term memory, while a learnable module\ntermed Artificial Hippocampus Network (AHN) recurrently compresses\nout-of-window information into a fixed-size compact long-term memory. To\nvalidate this framework, we instantiate AHNs using modern RNN-like\narchitectures, including Mamba2, DeltaNet, and Gated DeltaNet. Extensive\nexperiments on long-context benchmarks LV-Eval and InfiniteBench demonstrate\nthat AHN-augmented models consistently outperform sliding window baselines and\nachieve performance comparable or even superior to full-attention models, while\nsubstantially reducing computational and memory requirements. For instance,\naugmenting the Qwen2.5-3B-Instruct with AHNs reduces inference FLOPs by 40.5%\nand memory cache by 74.0%, while improving its average score on LV-Eval (128k\nsequence length) from 4.41 to 5.88. Code is available at:\nhttps://github.com/ByteDance-Seed/AHN.", "authors": ["Yunhao Fang", "Weihao Yu", "Shu Zhong", "Qinghao Ye", "Xuehan Xiong"], "categories": ["cs.CL", "cs.AI", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2510.07318", "pdf_url": "https://arxiv.org/pdf/2510.07318", "github_repo": "", "source": "daily_arxiv"}, {"id": "2510.08189", "date": "2025-10-09", "title": "R-Horizon: How Far Can Your Large Reasoning Model Really Go in Breadth and Depth?", "abstract": "Recent trends in test-time scaling for reasoning models (e.g., OpenAI o1, DeepSeek-R1) have led to remarkable improvements through long Chain-of-Thought (CoT). However, existing benchmarks mainly focus on immediate, single-horizon tasks, failing to adequately evaluate models&#39; ability to understand and respond to complex, long-horizon scenarios. To address this incomplete evaluation of Large Reasoning Models (LRMs), we propose R-HORIZON, a method designed to stimulate long-horizon reasoning behaviors in LRMs through query composition. Based on R-HORIZON, we construct a long-horizon reasoning benchmark, comprising complex multi-step reasoning tasks with interdependent problems that span long reasoning horizons. Through comprehensive evaluation of LRMs using the R-HORIZON benchmark, we find that even the most advanced LRMs suffer significant performance degradation. Our analysis reveals that LRMs exhibit limited effective reasoning length and struggle to allocate thinking budget across multiple problems appropriately. Recognizing these limitations, we use R-HORIZON to construct long-horizon reasoning data for reinforcement learning with verified rewards (RLVR). Compared to training with single-horizon data, RLVR with R-HORIZON not only substantially improves performance on the multi-horizon reasoning tasks, but also promotes accuracy on standard reasoning tasks, with an increase of 7.5 on AIME2024. These results position R-HORIZON as a scalable, controllable, and low-cost paradigm for enhancing and evaluating the long-horizon reasoning capabilities of LRMs.", "authors": ["Authors:Yi Lu", "Jianing Wang", "Linsen Guo", "Wei He", "Hongyin Tang"], "categories": ["Artificial"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2510.08189", "pdf_url": "https://arxiv.org/pdf/2510.08189", "github_repo": "https://github.com/meituan-longcat/R-HORIZON", "source": "github_org"}, {"id": "2510.06531", "date": "2025-10-08", "title": "Approximate maximum likelihood decoding with $K$ minimum weight matchings", "abstract": "The minimum weight matching (MWM) and maximum likelihood decoding (MLD) are two widely used and distinct decoding strategies for quantum error correction. For a given syndrome, the MWM decoder finds the most probable physical error corresponding to the MWM of the decoding graph, whereas MLD aims to find the most probable logical error. Although MLD is the optimal error correction strategy, it is typically more computationally expensive compared to the MWM decoder. In this work, we introduce an algorithm that approximates MLD with $K$ MWMs from the decoding graph. Taking the surface code subject to graphlike errors as an example, we show that it is possible to efficiently find the first $K$ MWMs by systematically modifying the original decoding graph followed by finding the MWMs of the modified graphs. For the case where the $X$ and $Z$ errors are correlated, despite the MWM of the decoding hypergraph cannot be found efficiently, we present a heuristic approach to approximate the MLD by finding the $K$ MWMs in the $X$ and $Z$ subgraphs. We benchmark the efficacy of our algorithm for the surface code subject to graphlike errors, the surface-square Gottesman-Kitaev-Preskill (GKP) code and surface-hexagonal GKP code subject to the Gaussian random displacement errors, showing that the fidelity approaches that of the exact MLD (for the first two cases) or the tensor-network decoder (for the last case) as $K$ increases.", "authors": ["Authors:Mao Lin"], "categories": ["Quantum"], "companies": ["Amazon"], "abs_url": "https://arxiv.org/abs/2510.06531", "pdf_url": "https://arxiv.org/pdf/2510.06531", "github_repo": "https://github.com/amazon-science/LatticeAlgorithms.jl", "source": "github_org"}, {"id": "2510.04206", "date": "2025-10-05", "title": "AgentRL: Scaling Agentic Reinforcement Learning with a Multi-Turn, Multi-Task Framework", "abstract": "Recent advances in large language models (LLMs) have sparked growing interest in building generalist agents that can learn through online interactions. However, applying reinforcement learning (RL) to train LLM agents in multi-turn, multi-task settings remains challenging due to lack of scalable infrastructure and stable training algorithms. In this work, we present the AgentRL framework for scalable multi-turn, multi-task agentic RL training. On the infrastructure side, AgentRL features a fully-asynchronous generation-training pipeline for efficient multi-turn RL. To support heterogeneous environment development in multi-task RL, we design a unified function-call based API interface, containerized environment development, and a centralized controller. On the algorithm side, we propose cross-policy sampling to encourage model exploration in multi-turn settings and task advantage normalization to stabilize multi-task training. Experiments show that AgentRL, trained on open LLMs across five agentic tasks, significantly outperforms GPT-5, Clause-Sonnet-4, DeepSeek-R1, and other open-source LLM agents. Multi-task training with AgentRL matches the best results among all task-specific models. AgentRL is open-sourced at this https URL . The algorithm and framework are adopted in building \\textsc{\\href{ this https URL }{AutoGLM}}.", "authors": ["Authors:Hanchen Zhang", "Xiao Liu", "Bowen Lv", "Xueqiao Sun", "Bohao Jing"], "categories": ["Artificial"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2510.04206", "pdf_url": "https://arxiv.org/pdf/2510.04206", "github_repo": "https://github.com/THUDM/AgentRL", "source": "github_org"}, {"id": "2509.26490", "date": "2025-09-30", "title": "VitaBench: Benchmarking LLM Agents with Versatile Interactive Tasks in Real-world Applications", "abstract": "As LLM-based agents are increasingly deployed in real-life scenarios, existing benchmarks fail to capture their inherent complexity of handling extensive information, leveraging diverse resources, and managing dynamic user interactions. To address this gap, we introduce VitaBench, a challenging benchmark that evaluates agents on versatile interactive tasks grounded in real-world settings. Drawing from daily applications in food delivery, in-store consumption, and online travel services, VitaBench presents agents with the most complex life-serving simulation environment to date, comprising 66 tools. Through a framework that eliminates domain-specific policies, we enable flexible composition of these scenarios and tools, yielding 100 cross-scenario tasks (main results) and 300 single-scenario tasks. Each task is derived from multiple real user requests and requires agents to reason across temporal and spatial dimensions, utilize complex tool sets, proactively clarify ambiguous instructions, and track shifting user intent throughout multi-turn conversations. Moreover, we propose a rubric-based sliding window evaluator, enabling robust assessment of diverse solution pathways in complex environments and stochastic interactions. Our comprehensive evaluation reveals that even the most advanced models achieve only 30% success rate on cross-scenario tasks, and less than 50% success rate on others. Overall, we believe VitaBench will serve as a valuable resource for advancing the development of AI agents in practical real-world applications. The code, dataset, and leaderboard are available at this https URL", "authors": ["Authors:Wei He", "Yueqing Sun", "Hongyan Hao", "Xueyuan Hao", "Zhikang Xia"], "categories": ["Computation"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2509.26490", "pdf_url": "https://arxiv.org/pdf/2509.26490", "github_repo": "https://github.com/meituan-longcat/vitabench", "source": "github_org"}, {"id": "2509.22647", "date": "2025-09-29", "title": "CapRL: Stimulating Dense Image Caption Capabilities via Reinforcement Learning", "abstract": "Image captioning is a fundamental task that bridges the visual and linguistic\ndomains, playing a critical role in pre-training Large Vision-Language Models\n(LVLMs). Current state-of-the-art captioning models are typically trained with\nSupervised Fine-Tuning (SFT), a paradigm that relies on expensive, non-scalable\ndata annotated by humans or proprietary models. This approach often leads to\nmodels that memorize specific ground-truth answers, limiting their generality\nand ability to generate diverse, creative descriptions. To overcome the\nlimitation of SFT, we propose applying the Reinforcement Learning with\nVerifiable Rewards (RLVR) paradigm to the open-ended task of image captioning.\nA primary challenge, however, is designing an objective reward function for the\ninherently subjective nature of what constitutes a \"good\" caption. We introduce\nCaptioning Reinforcement Learning (CapRL), a novel training framework that\nredefines caption quality through its utility: a high-quality caption should\nenable a non-visual language model to accurately answer questions about the\ncorresponding image. CapRL employs a decoupled two-stage pipeline where an LVLM\ngenerates a caption, and the objective reward is derived from the accuracy of a\nseparate, vision-free LLM answering Multiple-Choice Questions based solely on\nthat caption. As the first study to apply RLVR to the subjective image\ncaptioning task, we demonstrate that CapRL significantly enhances multiple\nsettings. Pretraining on the CapRL-5M caption dataset annotated by CapRL-3B\nresults in substantial gains across 12 benchmarks. Moreover, within the Prism\nFramework for caption quality evaluation, CapRL achieves performance comparable\nto Qwen2.5-VL-72B, while exceeding the baseline by an average margin of 8.4%.\nCode is available here: https://github.com/InternLM/CapRL.", "authors": ["Long Xing", "Xiaoyi Dong", "Yuhang Zang", "Yuhang Cao", "Jianze Liang"], "categories": ["cs.CV", "cs.AI", "cs.CL"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.22647", "pdf_url": "https://arxiv.org/pdf/2509.22647", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.22622", "date": "2025-09-29", "title": "LongLive: Real-time Interactive Long Video Generation", "abstract": "We present LongLive, a frame-level autoregressive (AR) framework for\nreal-time and interactive long video generation. Long video generation presents\nchallenges in both efficiency and quality. Diffusion and Diffusion-Forcing\nmodels can produce high-quality videos but suffer from low efficiency due to\nbidirectional attention. Causal attention AR models support KV caching for\nfaster inference, but often degrade in quality on long videos due to memory\nchallenges during long-video training. In addition, beyond static prompt-based\ngeneration, interactive capabilities, such as streaming prompt inputs, are\ncritical for dynamic content creation, enabling users to guide narratives in\nreal time. This interactive requirement significantly increases complexity,\nespecially in ensuring visual consistency and semantic coherence during prompt\ntransitions. To address these challenges, LongLive adopts a causal, frame-level\nAR design that integrates a KV-recache mechanism that refreshes cached states\nwith new prompts for smooth, adherent switches; streaming long tuning to enable\nlong video training and to align training and inference (train-long-test-long);\nand short window attention paired with a frame-level attention sink, shorten as\nframe sink, preserving long-range consistency while enabling faster generation.\nWith these key designs, LongLive fine-tunes a 1.3B-parameter short-clip model\nto minute-long generation in just 32 GPU-days. At inference, LongLive sustains\n20.7 FPS on a single NVIDIA H100, achieves strong performance on VBench in both\nshort and long videos. LongLive supports up to 240-second videos on a single\nH100 GPU. LongLive further supports INT8-quantized inference with only marginal\nquality loss.", "authors": ["Shuai Yang", "Wei Huang", "Ruihang Chu", "Yicheng Xiao", "Yuyang Zhao"], "categories": ["cs.CV"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2509.22622", "pdf_url": "https://arxiv.org/pdf/2509.22622", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.22624", "date": "2025-09-29", "title": "SPARK: Synergistic Policy And Reward Co-Evolving Framework", "abstract": "Recent Large Language Models (LLMs) and Large Vision-Language Models (LVLMs)\nincreasingly use Reinforcement Learning (RL) for post-pretraining, such as RL\nwith Verifiable Rewards (RLVR) for objective tasks and RL from Human Feedback\n(RLHF) for subjective tasks. However, RLHF incurs high costs and potential\nreward-policy mismatch due to reliance on human preferences, while RLVR still\nwastes supervision by discarding rollouts and correctness signals after each\nupdate. To address these challenges, we introduce the Synergistic Policy And\nReward Co-Evolving Framework (SPARK), an efficient, on-policy, and stable\nmethod that builds on RLVR. Instead of discarding rollouts and correctness\ndata, SPARK recycles this valuable information to simultaneously train the\nmodel itself as a generative reward model. This auxiliary training uses a mix\nof objectives, such as pointwise reward score, pairwise comparison, and\nevaluation conditioned on further-reflection responses, to teach the model to\nevaluate and improve its own responses. Our process eliminates the need for a\nseparate reward model and costly human preference data. SPARK creates a\npositive co-evolving feedback loop: improved reward accuracy yields better\npolicy gradients, which in turn produce higher-quality rollouts that further\nrefine the reward model. Our unified framework supports test-time scaling via\nself-reflection without external reward models and their associated costs. We\nshow that SPARK achieves significant performance gains on multiple LLM and LVLM\nmodels and multiple reasoning, reward models, and general benchmarks. For\nexample, SPARK-VL-7B achieves an average 9.7% gain on 7 reasoning benchmarks,\n12.1% on 2 reward benchmarks, and 1.5% on 8 general benchmarks over the\nbaselines, demonstrating robustness and broad generalization.", "authors": ["Ziyu Liu", "Yuhang Zang", "Shengyuan Ding", "Yuhang Cao", "Xiaoyi Dong"], "categories": ["cs.CV", "cs.LG"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.22624", "pdf_url": "https://arxiv.org/pdf/2509.22624", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.24910", "date": "2025-09-29", "title": "Learning Goal-Oriented Vision-and-Language Navigation with Self-Improving Demonstrations at Scale", "abstract": "Goal-oriented vision-language navigation requires robust exploration capabilities for agents to navigate to specified goals in unknown environments without step-by-step instructions. Existing methods tend to exclusively utilize shortest-path trajectories, lacking effective exploration priors for training navigation agents. To address the above challenges, we present SID, a goal-oriented vision-and-language navigation learning approach with Self-Improving Demonstrations. Specifically, SID learns an initial agent on the shortest-path data sampled from environments and then leverages this agent to generate novel exploration trajectories. The novel rollouts provide demonstrations with stronger exploration strategies to train a better agent, which in turn produces higher-quality agent demonstrations for the next round of training. We show that this iterative self-improving pipeline readily scales to new environments, and the resulting demonstrations are highly transferable, elevating the performance ceiling across a variety of vision-and-language navigation tasks. Extensive experiments demonstrate that SID significantly boosts the exploration capabilities and generalization of navigation agents. The resulting agent achieves new state-of-the-art performance on goal-oriented vision-and-language navigation benchmarks, including REVERIE, SOON as well as strong transferability to object-goal navigation and VLN-CE. It notably achieves a 50.9% success rate on the unseen validation splits of SOON, surpassing prior leading approaches by a margin of 13.9%.", "authors": ["Authors:Songze Li", "Zun Wang", "Gengze Zhou", "Jialu Li", "Xiangyu Zeng"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.24910", "pdf_url": "https://arxiv.org/pdf/2509.24910", "github_repo": "https://github.com/OpenGVLab/SID-VLN", "source": "github_org"}, {"id": "2509.25161", "date": "2025-09-29", "title": "Rolling Forcing: Autoregressive Long Video Diffusion in Real Time", "abstract": "Streaming video generation, as one fundamental component in interactive world models and neural game engines, aims to generate high-quality, low-latency, and temporally coherent long video streams. However, most existing work suffers from severe error accumulation that often significantly degrades the generated stream videos over long horizons. We design Rolling Forcing, a novel video generation technique that enables streaming long videos with minimal error accumulation. Rolling Forcing comes with three novel designs. First, instead of iteratively sampling individual frames, which accelerates error propagation, we design a joint denoising scheme that simultaneously denoises multiple frames with progressively increasing noise levels. This design relaxes the strict causality across adjacent frames, effectively suppressing error growth. Second, we introduce the attention sink mechanism into the long-horizon stream video generation task, which allows the model to keep key value states of initial frames as a global context anchor and thereby enhances long-term global consistency. Third, we design an efficient training algorithm that enables few-step distillation over largely extended denoising windows. This algorithm operates on non-overlapping windows and mitigates exposure bias conditioned on self-generated histories. Extensive experiments show that Rolling Forcing enables real-time streaming generation of multi-minute videos on a single GPU, with substantially reduced error accumulation.", "authors": ["Authors:Kunhao Liu", "Wenbo Hu", "Jiale Xu", "Ying Shan", "Shijian Lu"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2509.25161", "pdf_url": "https://arxiv.org/pdf/2509.25161", "github_repo": "https://github.com/TencentARC/RollingForcing", "source": "github_org"}, {"id": "2509.23045", "date": "2025-09-27", "title": "Kimi-Dev: Agentless Training as Skill Prior for SWE-Agents", "abstract": "Large Language Models (LLMs) are increasingly applied to software engineering (SWE), with SWE-bench as a key benchmark. Solutions are split into SWE-Agent frameworks with multi-turn interactions and workflow-based Agentless methods with single-turn verifiable steps. We argue these paradigms are not mutually exclusive: reasoning-intensive Agentless training induces skill priors, including localization, code edit, and self-reflection that enable efficient and effective SWE-Agent adaptation. In this work, we first curate the Agentless training recipe and present Kimi-Dev, an open-source SWE LLM achieving 60.4\\% on SWE-bench Verified, the best among workflow approaches. With additional SFT adaptation on 5k publicly-available trajectories, Kimi-Dev powers SWE-Agents to 48.6\\% pass@1, on par with that of Claude 3.5 Sonnet (241022 version). These results show that structured skill priors from Agentless training can bridge workflow and agentic frameworks for transferable coding agents.", "authors": ["Authors:Zonghan Yang", "Shengjie Wang", "Kelin Fu", "Wenyang He", "Weimin Xiong"], "categories": ["Artificial"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2509.23045", "pdf_url": "https://arxiv.org/pdf/2509.23045", "github_repo": "https://github.com/MoonshotAI/Kimi-Dev"
