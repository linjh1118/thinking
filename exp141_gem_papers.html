ights such as environmental-flow alerts, rainfall trends, reservoir levels, water accounting, and irrigation data. The system features guided multilingual interactions (English, Portuguese, French), transparent source referencing, automated calculations, and visualization capabilities. Evaluated using the RAGAS framework, WaterCopilot achieves an overall score of 0.8043, with high answer relevancy (0.8571) and context precision (0.8009). Key innovations include automated threshold-based alerts, integration with the LRB Digital Twin, and a scalable deployment pipeline hosted on AWS. While limitations in processing non-English technical documents and API latency remain, WaterCopilot establishes a replicable AI-augmented framework for enhancing water governance in data-scarce, transboundary contexts. The study demonstrates the potential of this AI assistant to support informed, timely decision-making and strengthen water security in complex river basins.", "authors": ["Keerththanan Vickneswaran", "Mariangel Garcia Andarcia", "Hugo Retief", "Chris Dickens", "Paulo Silva"], "categories": ["cs.AI"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2601.08559", "pdf_url": "https://arxiv.org/pdf/2601.08559", "github_repo": "", "source": "daily_arxiv"}, {"id": "2601.09668", "date": "2026-01-14", "title": "STEP3-VL-10B Technical Report", "abstract": "We present STEP3-VL-10B, a lightweight open-source foundation model designed to redefine the trade-off between compact efficiency and frontier-level multimodal intelligence. STEP3-VL-10B is realized through two strategic shifts: first, a unified, fully unfrozen pre-training strategy on 1.2T multimodal tokens that integrates a language-aligned Perception Encoder with a Qwen3-8B decoder to establish intrinsic vision-language synergy; and second, a scaled post-training pipeline featuring over 1k iterations of reinforcement learning. Crucially, we implement Parallel Coordinated Reasoning (PaCoRe) to scale test-time compute, allocating resources to scalable perceptual reasoning that explores and synthesizes diverse visual hypotheses. Consequently, despite its compact 10B footprint, STEP3-VL-10B rivals or surpasses models 10$\\times$-20$\\times$ larger (e.g., GLM-4.6V-106B, Qwen3-VL-235B) and top-tier proprietary flagships like Gemini 2.5 Pro and Seed-1.5-VL. Delivering best-in-class performance, it records 92.2% on MMBench and 80.11% on MMMU, while excelling in complex reasoning with 94.43% on AIME2025 and 75.95% on MathVision. We release the full model suite to provide the community with a powerful, efficient, and reproducible baseline.", "authors": ["Authors:Ailin Huang", "Chengyuan Yao", "Chunrui Han", "Fanqi Wan", "Hangyu Guo"], "categories": ["Computer"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2601.09668", "pdf_url": "https://arxiv.org/pdf/2601.09668", "github_repo": "https://github.com/stepfun-ai/Step3-VL-10B", "source": "github_org"}, {"id": "2601.05593", "date": "2026-01-09", "title": "PaCoRe: Learning to Scale Test-Time Compute with Parallel Coordinated Reasoning", "abstract": "We introduce Parallel Coordinated Reasoning (PaCoRe), a training-and-inference framework designed to overcome a central limitation of contemporary language models: their inability to scale test-time compute (TTC) far beyond sequential reasoning under a fixed context window. PaCoRe departs from the traditional sequential paradigm by driving TTC through massive parallel exploration coordinated via a message-passing architecture in multiple rounds. Each round launches many parallel reasoning trajectories, compacts their findings into context-bounded messages, and synthesizes these messages to guide the next round and ultimately produce the final answer. Trained end-to-end with large-scale, outcome-based reinforcement learning, the model masters the synthesis abilities required by PaCoRe and scales to multi-million-token effective TTC without exceeding context limits. The approach yields strong improvements across diverse domains, and notably pushes reasoning beyond frontier systems in mathematics: an 8B model reaches 94.5% on HMMT 2025, surpassing GPT-5&#39;s 93.2% by scaling effective TTC to roughly two million tokens. We open-source model checkpoints, training data, and the full inference pipeline to accelerate follow-up work.", "authors": ["Authors:Jingcheng Hu", "Yinmin Zhang", "Shijie Shang", "Xiaobo Yang", "Yue Peng"], "categories": ["Machine"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2601.05593", "pdf_url": "https://arxiv.org/pdf/2601.05593", "github_repo": "https://github.com/stepfun-ai/PaCoRe", "source": "github_org"}, {"id": "2601.06021", "date": "2026-01-09", "title": "Chaining the Evidence: Robust Reinforcement Learning for Deep Search Agents with Citation-Aware Rubric Rewards", "abstract": "Reinforcement learning (RL) has emerged as a critical technique for enhancing LLM-based deep search agents. However, existing approaches primarily rely on binary outcome rewards, which fail to capture the comprehensiveness and factuality of agents&#39; reasoning process, and often lead to undesirable behaviors such as shortcut exploitation and hallucinations. To address these limitations, we propose \\textbf{Citation-aware Rubric Rewards (CaRR)}, a fine-grained reward framework for deep search agents that emphasizes reasoning comprehensiveness, factual grounding, and evidence connectivity. CaRR decomposes complex questions into verifiable single-hop rubrics and requires agents to satisfy these rubrics by explicitly identifying hidden entities, supporting them with correct citations, and constructing complete evidence chains that link to the predicted answer. We further introduce \\textbf{Citation-aware Group Relative Policy Optimization (C-GRPO)}, which combines CaRR and outcome rewards for training robust deep search agents. Experiments show that C-GRPO consistently outperforms standard outcome-based RL baselines across multiple deep search benchmarks. Our analysis also validates that C-GRPO effectively discourages shortcut exploitation, promotes comprehensive, evidence-grounded reasoning, and exhibits strong generalization to open-ended deep research tasks. Our code and data are available at this https URL .", "authors": ["Authors:Jiajie Zhang", "Xin Lv", "Ling Feng", "Lei Hou", "Juanzi Li"], "categories": ["Computation"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2601.06021", "pdf_url": "https://arxiv.org/pdf/2601.06021", "github_repo": "https://github.com/THUDM/CaRR", "source": "github_org"}, {"id": "2601.05138", "date": "2026-01-08", "title": "VerseCrafter: Dynamic Realistic Video World Model with 4D Geometric Control", "abstract": "Video world models aim to simulate dynamic, real-world environments, yet existing methods struggle to provide unified and precise control over camera and multi-object motion, as videos inherently capture dynamics in the projected 2D image plane. To bridge this gap, we introduce VerseCrafter, a geometry-driven video world model that generates dynamic, realistic videos from a unified 4D geometric world state. Our approach is centered on a novel 4D Geometric Control representation, which encodes the world state as a static background point cloud and per-object 3D Gaussian trajectories. This representation captures each object&#39;s motion path and probabilistic 3D occupancy over time, providing a flexible, category-agnostic alternative to rigid bounding boxes and parametric models. We render 4D Geometric Control into 4D control maps for a pretrained video diffusion model, enabling high-fidelity, view-consistent video generation that faithfully follows the specified dynamics. To enable training at scale, we develop an automatic data engine and construct VerseControl4D, a real-world dataset of 35K training samples with automatically derived prompts and rendered 4D control maps. Extensive experiments show that VerseCrafter achieves superior visual quality and more accurate control over camera and multi-object motion than prior methods.", "authors": ["Authors:Sixiao Zheng", "Minghao Yin", "Wenbo Hu", "Xiaoyu Li", "Ying Shan"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2601.05138", "pdf_url": "https://arxiv.org/pdf/2601.05138", "github_repo": "https://github.com/TencentARC/VerseCrafter", "source": "github_org"}, {"id": "2601.03955", "date": "2026-01-07", "title": "ResTok: Learning Hierarchical Residuals in 1D Visual Tokenizers for Autoregressive Image Generation", "abstract": "Existing 1D visual tokenizers for autoregressive (AR) generation largely follow the design principles of language modeling, as they are built directly upon transformers whose priors originate in language, yielding single-hierarchy latent tokens and treating visual data as flat sequential token streams. However, this language-like formulation overlooks key properties of vision, particularly the hierarchical and residual network designs that have long been essential for convergence and efficiency in visual models. To bring &#34;vision&#34; back to vision, we propose the Residual Tokenizer (ResTok), a 1D visual tokenizer that builds hierarchical residuals for both image tokens and latent tokens. The hierarchical representations obtained through progressively merging enable cross-level feature fusion at each layer, substantially enhancing representational capacity. Meanwhile, the semantic residuals between hierarchies prevent information overlap, yielding more concentrated latent distributions that are easier for AR modeling. Cross-level bindings consequently emerge without any explicit constraints. To accelerate the generation process, we further introduce a hierarchical AR generator that substantially reduces sampling steps by predicting an entire level of latent tokens at once rather than generating them strictly token-by-token. Extensive experiments demonstrate that restoring hierarchical residual priors in visual tokenization significantly improves AR image generation, achieving a gFID of 2.34 on ImageNet-256 with only 9 sampling steps. Code is available at this https URL .", "authors": ["Authors:Xu Zhang", "Cheng Da", "Huan Yang", "Kun Gai", "Ming Lu"], "categories": ["Computer"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2601.03955", "pdf_url": "https://arxiv.org/pdf/2601.03955", "github_repo": "https://github.com/kwai-kolors/ResTok", "source": "github_org"}, {"id": "2512.24330", "date": "2026-01-01", "title": "SenseNova-MARS: Empowering Multimodal Agentic Reasoning and Search via Reinforcement Learning", "abstract": "While Vision-Language Models (VLMs) can solve complex tasks through agentic reasoning, their capabilities remain largely constrained to text-oriented chain-of-thought or isolated tool invocation. They fail to exhibit the human-like proficiency required to seamlessly interleave dynamic tool manipulation with continuous reasoning, particularly in knowledge-intensive and visually complex scenarios that demand coordinated external tools such as search and image cropping. In this work, we introduce SenseNova-MARS, a novel Multimodal Agentic Reasoning and Search framework that empowers VLMs with interleaved visual reasoning and tool-use capabilities via reinforcement learning (RL). Specifically, SenseNova-MARS dynamically integrates the image search, text search, and image crop tools to tackle fine-grained and knowledge-intensive visual understanding challenges. In the RL stage, we propose the Batch-Normalized Group Sequence Policy Optimization (BN-GSPO) algorithm to improve the training stability and advance the model's ability to invoke tools and reason effectively. To comprehensively evaluate the agentic VLMs on complex visual tasks, we introduce the HR-MMSearch benchmark, the first search-oriented benchmark composed of high-resolution images with knowledge-intensive and search-driven questions. Experiments demonstrate that SenseNova-MARS achieves state-of-the-art performance on open-source search and fine-grained image understanding benchmarks. Specifically, on search-oriented benchmarks, SenseNova-MARS-8B scores 67.84 on MMSearch and 41.64 on HR-MMSearch, surpassing proprietary models such as Gemini-3-Flash and GPT-5. SenseNova-MARS represents a promising step toward agentic VLMs by providing effective and robust tool-use capabilities. To facilitate further research in this field, we will release all code, models, and datasets.", "authors": ["Yong Xien Chng", "Tao Hu", "Wenwen Tong", "Xueheng Li", "Jiandong Chen"], "categories": ["cs.CV"], "companies": ["SenseTime"], "abs_url": "https://arxiv.org/abs/2512.24330", "pdf_url": "https://arxiv.org/pdf/2512.24330", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.23464", "date": "2025-12-30", "title": "HY-Motion 1.0: Scaling Flow Matching Models for Text-To-Motion Generation", "abstract": "We present HY-Motion 1.0, a series of state-of-the-art, large-scale, motion generation models capable of generating 3D human motions from textual descriptions. HY-Motion 1.0 represents the first successful attempt to scale up Diffusion Transformer (DiT)-based flow matching models to the billion-parameter scale within the motion generation domain, delivering instruction-following capabilities that significantly outperform current open-source benchmarks. Uniquely, we introduce a comprehensive, full-stage training paradigm -- including large-scale pretraining on over 3,000 hours of motion data, high-quality fine-tuning on 400 hours of curated data, and reinforcement learning from both human feedback and reward models -- to ensure precise alignment with the text instruction and high motion quality. This framework is supported by our meticulous data processing pipeline, which performs rigorous motion cleaning and captioning. Consequently, our model achieves the most extensive coverage, spanning over 200 motion categories across 6 major classes. We release HY-Motion 1.0 to the open-source community to foster future research and accelerate the transition of 3D human motion generation models towards commercial maturity.", "authors": ["Yuxin Wen", "Qing Shuai", "Di Kang", "Jing Li", "Cheng Wen"], "categories": ["cs.CV", "cs.AI", "cs.GR"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2512.23464", "pdf_url": "https://arxiv.org/pdf/2512.23464", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.23676", "date": "2025-12-30", "title": "Web World Models", "abstract": "Language agents increasingly require persistent worlds in which they can act, remember, and learn. Existing approaches sit at two extremes: conventional web frameworks provide reliable but fixed contexts backed by databases, while fully generative world models aim for unlimited environments at the expense of controllability and practical engineering. In this work, we introduce the Web World Model (WWM), a middle ground where world state and ``physics'' are implemented in ordinary web code to ensure logical consistency, while large language models generate context, narratives, and high-level decisions on top of this structured latent state. We build a suite of WWMs on a realistic web stack, including an infinite travel atlas grounded in real geography, fictional galaxy explorers, web-scale encyclopedic and narrative worlds, and simulation- and game-like environments. Across these systems, we identify practical design principles for WWMs: separating code-defined rules from model-driven imagination, representing latent state as typed web interfaces, and utilizing deterministic generation to achieve unlimited but structured exploration. Our results suggest that web stacks themselves can serve as a scalable substrate for world models, enabling controllable yet open-ended environments. Project Page: https://github.com/Princeton-AI2-Lab/Web-World-Models.", "authors": ["Jichen Feng", "Yifan Zhang", "Chenggong Zhang", "Yifu Lu", "Shilong Liu"], "categories": ["cs.AI", "cs.CL", "cs.CV"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2512.23676", "pdf_url": "https://arxiv.org/pdf/2512.23676", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.23966", "date": "2025-12-30", "title": "Efficient Context Scaling with LongCat ZigZag Attention", "abstract": "We introduce LongCat ZigZag Attention (LoZA), which is a sparse attention scheme designed to transform any existing full-attention models into sparse versions with rather limited compute budget. In long-context scenarios, LoZA can achieve significant speed-ups both for prefill-intensive (e.g., retrieval-augmented generation) and decode-intensive (e.g., tool-integrated reasoning) cases. Specifically, by applying LoZA to LongCat-Flash during mid-training, we serve LongCat-Flash-Exp as a long-context foundation model that can swiftly process up to 1 million tokens, enabling efficient long-term reasoning and long-horizon agentic capabilities.", "authors": ["Authors:Chen Zhang", "Yang Bai", "Jiahuan Li", "Anchun Gui", "Keheng Wang"], "categories": ["Computation"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2512.23966", "pdf_url": "https://arxiv.org/pdf/2512.23966", "github_repo": "https://github.com/meituan-longcat/Longcat-Flash-Thinking-ZigZag", "source": "github_org"}, {"id": "2512.24265", "date": "2025-12-30", "title": "Joint Selection for Large-Scale Pre-Training Data via Policy Gradient-based Mask Learning", "abstract": "A fine-grained data recipe is crucial for pre-training large language models, as it can significantly enhance training efficiency and model performance. One important ingredient in the recipe is to select samples based on scores produced by defined rules, LLM judgment, or statistical information in embeddings, which can be roughly categorized into quality and diversity metrics. Due to the high computational cost when applied to trillion-scale token pre-training datasets such as FineWeb and DCLM, these two or more types of metrics are rarely considered jointly in a single selection process. However, in our empirical study, selecting samples based on quality metrics exhibit severe diminishing returns during long-term pre-training, while selecting on diversity metrics removes too many valuable high-quality samples, both of which limit pre-trained LLMs&#39; capabilities. Therefore, we introduce DATAMASK, a novel and efficient joint learning framework designed for large-scale pre-training data selection that can simultaneously optimize multiple types of metrics in a unified process, with this study focusing specifically on quality and diversity metrics. DATAMASK approaches the selection process as a mask learning problem, involving iterative sampling of data masks, computation of policy gradients based on predefined objectives with sampled masks, and updating of mask sampling logits. Through policy gradient-based optimization and various acceleration enhancements, it significantly reduces selection time by 98.9% compared to greedy algorithm, enabling our study to explore joint learning within trillion-scale tokens. With DATAMASK, we select a subset of about 10% from the 15 trillion-token FineWeb dataset, termed FineWeb-Mask. Evaluated across 12 diverse tasks, we achieves significant improvements of 3.2% on a 1.5B dense model and 1.9% on a 7B MoE model.", "authors": ["Authors:Ziqing Fan", "Yuqiao Xian", "Yan Sun", "Li Shen"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2512.24265", "pdf_url": "https://arxiv.org/pdf/2512.24265", "github_repo": "https://github.com/bytedance-seed/DATAMASK", "source": "github_org"}, {"id": "2512.20491", "date": "2025-12-23", "title": "Step-DeepResearch Technical Report", "abstract": "As LLMs shift toward autonomous agents, Deep Research has emerged as a pivotal metric. However, existing academic benchmarks like BrowseComp often fail to meet real-world demands for open-ended research, which requires robust skills in intent recognition, long-horizon decision-making, and cross-source verification. To address this, we introduce Step-DeepResearch, a cost-effective, end-to-end agent. We propose a Data Synthesis Strategy Based on Atomic Capabilities to reinforce planning and report writing, combined with a progressive training path from agentic mid-training to SFT and RL. Enhanced by a Checklist-style Judger, this approach significantly improves robustness. Furthermore, to bridge the evaluation gap in the Chinese domain, we establish ADR-Bench for realistic deep research scenarios. Experimental results show that Step-DeepResearch (32B) scores 61.4% on Scale AI Research Rubrics. On ADR-Bench, it significantly outperforms comparable models and rivals SOTA closed-source models like OpenAI and Gemini DeepResearch. These findings prove that refined training enables medium-sized models to achieve expert-level capabilities at industry-leading cost-efficiency.", "authors": ["Authors:Chen Hu", "Haikuo Du", "Heng Wang", "Lin Lin", "Mingrui Chen"], "categories": ["Computation"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2512.20491", "pdf_url": "https://arxiv.org/pdf/2512.20491", "github_repo": "https://github.com/stepfun-ai/StepDeepResearch", "source": "github_org"}, {"id": "2512.20557", "date": "2025-12-23", "title": "Learning to Reason in 4D: Dynamic Spatial Understanding for Vision Language Models", "abstract": "Vision-language models (VLM) excel at general understanding yet remain weak at dynamic spatial reasoning (DSR), i.e., reasoning about the evolvement of object geometry and relationship in 3D space over time, largely due to the scarcity of scalable 4D-aware training resources. To bridge this gap across aspects of dataset, benchmark and model, we introduce DSR Suite. First, we propose an automated pipeline that generates multiple-choice question-answer pairs from in-the-wild videos for DSR. By leveraging modern vision foundation models, the pipeline extracts rich geometric and motion information, including camera poses, local point clouds, object masks, orientations, and 3D trajectories. These geometric cues enable the construction of DSR-Train for learning and further human-refined DSR-Bench for evaluation. Compared with previous works, our data emphasize (i) in-the-wild video sources, (ii) object- and scene-level 3D requirements, (iii) viewpoint transformations, (iv) multi-object interactions, and (v) fine-grained, procedural answers. Beyond data, we propose a lightweight Geometry Selection Module (GSM) to seamlessly integrate geometric priors into VLMs, which condenses question semantics and extracts question-relevant knowledge from pretrained 4D reconstruction priors into a compact set of geometry tokens. This targeted extraction avoids overwhelming the model with irrelevant knowledge. Experiments show that integrating DSR-Train and GSM into Qwen2.5-VL-7B significantly enhances its dynamic spatial reasoning capability, while maintaining accuracy on general video understanding benchmarks.", "authors": ["Authors:Shengchao Zhou", "Yuxin Chen", "Yuying Ge", "Wei Huang", "Jiehong Lin"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2512.20557", "pdf_url": "https://arxiv.org/pdf/2512.20557", "github_repo": "https://github.com/TencentARC/DSR_Suite", "source": "github_org"}, {"id": "2512.20617", "date": "2025-12-23", "title": "SpatialTree: How Spatial Abilities Branch Out in MLLMs", "abstract": "Cognitive science suggests that spatial ability develops progressively-from perception to reasoning and interaction. Yet in multimodal LLMs (MLLMs), this hierarchy remains poorly understood, as most studies focus on a narrow set of tasks. We introduce SpatialTree, a cognitive-science-inspired hierarchy that organizes spatial abilities into four levels: low-level perception (L1), mental mapping (L2), simulation (L3), and agentic competence (L4). Based on this taxonomy, we construct the first capability-centric hierarchical benchmark, thoroughly evaluating mainstream MLLMs across 27 sub-abilities. The evaluation results reveal a clear structure: L1 skills are largely orthogonal, whereas higher-level skills are strongly correlated, indicating increasing interdependency. Through targeted supervised fine-tuning, we uncover a surprising transfer dynamic-negative transfer within L1, but strong cross-level transfer from low- to high-level abilities with notable synergy. Finally, we explore how to improve the entire hierarchy. We find that naive RL that encourages extensive &#34;thinking&#34; is unreliable: it helps complex reasoning but hurts intuitive perception. We propose a simple auto-think strategy that suppresses unnecessary deliberation, enabling RL to consistently improve performance across all levels. By building SpatialTree, we provide a proof-of-concept framework for understanding and systematically scaling spatial abilities in MLLMs.", "authors": ["Authors:Yuxi Xiao", "Longfei Li", "Shen Yan", "Xinhang Liu", "Sida Peng"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2512.20617", "pdf_url": "https://arxiv.org/pdf/2512.20617", "github_repo": "https://github.com/bytedance-seed/SpatialTree", "source": "github_org"}, {"id": "2512.20806", "date": "2025-12-23", "title": "Safety Alignment of LMs via Non-cooperative Games", "abstract": "Ensuring the safety of language models (LMs) while maintaining their usefulness remains a critical challenge in AI alignment. Current approaches rely on sequential adversarial training: generating adversarial prompts and fine-tuning LMs to defend against them. We introduce a different paradigm: framing safety alignment as a non-zero-sum game between an Attacker LM and a Defender LM trained jointly via online reinforcement learning. Each LM continuously adapts to the other&#39;s evolving strategies, driving iterative improvement. Our method uses a preference-based reward signal derived from pairwise comparisons instead of point-wise scores, providing more robust supervision and potentially reducing reward hacking. Our RL recipe, AdvGame, shifts the Pareto frontier of safety and utility, yielding a Defender LM that is simultaneously more helpful and more resilient to adversarial attacks. In addition, the resulting Attacker LM converges into a strong, general-purpose red-teaming agent that can be directly deployed to probe arbitrary target models.", "authors": ["Authors:Anselm Paulus", "Ilia Kulikov", "Brandon Amos", "Rémi Munos", "Ivan Evtimov"], "categories": ["Artificial"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2512.20806", "pdf_url": "https://arxiv.org/pdf/2512.20806", "github_repo": "https://github.com/facebookresearch/advgame", "source": "github_org"}, {"id": "2512.16899", "date": "2025-12-20", "title": "Multimodal RewardBench 2: Evaluating Omni Reward Models for Interleaved Text and Image", "abstract": "Reward models (RMs) are essential for training large language models (LLMs), but remain underexplored for omni models that handle interleaved image and text sequences. We introduce Multimodal RewardBench 2 (MMRB2), the first comprehensive benchmark for reward models on multimodal understanding and (interleaved) generation. MMRB2 spans four tasks: text-to-image, image editing, interleaved generation, and multimodal reasoning (\"thinking-with-images\"), providing 1,000 expert-annotated preference pairs per task from 23 models and agents across 21 source tasks. MMRB2 is designed with: (1) practical but challenging prompts; (2) responses from state-of-the-art models and agents; and (3) preference pairs with strong human-expert consensus, curated via an ensemble filtering strategy. Using MMRB2, we study existing judges for each subtask, including multimodal LLM-as-a-judge and models trained with human preferences. The latest Gemini 3 Pro attains 75-80% accuracy. GPT-5 and Gemini 2.5 Pro reach 66-75% accuracy, compared to >90% for humans, yet surpass the widely used GPT-4o (59%). The best performing open-source model Qwen3-VL-32B achieves similar accuracies as Gemini 2.5 Flash (64%). We also show that MMRB2 performance strongly correlates with downstream task success using Best-of-N sampling and conduct an in-depth analysis that shows key areas to improve the reward models going forward.", "authors": ["Yushi Hu", "Reyhane Askari-Hemmat", "Melissa Hall", "Emily Dinan", "Luke Zettlemoyer"], "categories": ["cs.CL", "cs.CV"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2512.16899", "pdf_url": "https://arxiv.org/pdf/2512.16899", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.16874", "date": "2025-12-20", "title": "Pixel Seal: Adversarial-only training for invisible image and video watermarking", "abstract": "Invisible watermarking is essential for tracing the provenance of digital content. However, training state-of-the-art models remains notoriously difficult, with current approaches often struggling to balance robustness against true imperceptibility. This work introduces Pixel Seal, which sets a new state-of-the-art for image and video watermarking. We first identify three fundamental issues of existing methods: (i) the reliance on proxy perceptual losses such as MSE and LPIPS that fail to mimic human perception and result in visible watermark artifacts; (ii) the optimization instability caused by conflicting objectives, which necessitates exhaustive hyperparameter tuning; and (iii) reduced robustness and imperceptibility of watermarks when scaling models to high-resolution images and videos. To overcome these issues, we first propose an adversarial-only training paradigm that eliminates unreliable pixel-wise imperceptibility losses. Second, we introduce a three-stage training schedule that stabilizes convergence by decoupling robustness and imperceptibility. Third, we address the resolution gap via high-resolution adaptation, employing JND-based attenuation and training-time inference simulation to eliminate upscaling artifacts. We thoroughly evaluate the robustness and imperceptibility of Pixel Seal on different image types and across a wide range of transformations, and show clear improvements over the state-of-the-art. We finally demonstrate that the model efficiently adapts to video via temporal watermark pooling, positioning Pixel Seal as a practical and scalable solution for reliable provenance in real-world image and video settings.", "authors": ["Tomáš Souček", "Pierre Fernandez", "Hady Elsahar", "Sylvestre-Alvise Rebuffi", "Valeriu Lacatusu"], "categories": ["cs.CV", "cs.AI", "cs.CR", "cs.LG"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2512.16874", "pdf_url": "https://arxiv.org/pdf/2512.16874", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.15776", "date": "2025-12-19", "title": "Emergence: Overcoming Privileged Information Bias in Asymmetric Embodied Agents via Active Querying", "abstract": "Large Language Models (LLMs) act as powerful reasoning engines but struggle with \"symbol grounding\" in embodied environments, particularly when information is asymmetrically distributed. We investigate the Privileged Information Bias (or \"Curse of Knowledge\"), where a knowledgeable \"Leader\" agent fails to guide a sensor-limited \"Follower\" due to a lack of Theory of Mind. To quantify this phenomenon, we propose a novel Asymmetric Assistive Reasoning framework within AI2-THOR. Our experiments reveal a significant \"Success Gap\": while the Leader successfully perceives the target in 35.0% of episodes, the collaborative team succeeds only 17.0% of the time, implying that nearly 50% of feasible plans fail solely due to communicative grounding errors. We demonstrate that a \"Pull-based\" protocol (active querying) is significantly more robust than standard \"Push-based\" instruction, with successful episodes featuring 2x the frequency of clarification requests. This research isolates the mechanism of active uncertainty reduction as a prerequisite for safe human-AI and robot-robot collaboration.", "authors": ["Shaun Baek", "Sam Liu", "Joseph Ukpong"], "categories": ["cs.AI", "cs.MA", "cs.RO"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2512.15776", "pdf_url": "https://arxiv.org/pdf/2512.15776", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.17260", "date": "2025-12-19", "title": "Seed-Prover 1.5: Mastering Undergraduate-Level Theorem Proving via Learning from Experience", "abstract": "Large language models have recently made significant progress to generate rigorous mathematical proofs. In contrast, utilizing LLMs for theorem proving in formal languages (such as Lean) remains challenging and computationally expensive, particularly when addressing problems at the undergraduate level and beyond. In this work, we present \\textbf{Seed-Prover 1.5}, a formal theorem-proving model trained via large-scale agentic reinforcement learning, alongside an efficient test-time scaling (TTS) workflow. Through extensive interactions with Lean and other tools, the model continuously accumulates experience during the RL process, substantially enhancing the capability and efficiency of formal theorem proving. Furthermore, leveraging recent advancements in natural language proving, our TTS workflow efficiently bridges the gap between natural and formal languages. Compared to state-of-the-art methods, Seed-Prover 1.5 achieves superior performance with a smaller compute budget. It solves \\textbf{88\\% of PutnamBench} (undergraduate-level), \\textbf{80\\% of Fate-H} (graduate-level), and \\textbf{33\\% of Fate-X} (PhD-level) problems. Notably, using our system, we solved \\textbf{11 out of 12 problems} from Putnam 2025 within 9 hours. Our findings suggest that scaling learning from experience, driven by high-quality formal feedback, holds immense potential for the future of formal mathematical reasoning.", "authors": ["Authors:Jiangjie Chen", "Wenxiang Chen", "Jiacheng Du", "Jinyi Hu", "Zhicheng Jiang"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2512.17260", "pdf_url": "https://arxiv.org/pdf/2512.17260", "github_repo": "https://github.com/bytedance-seed/Seed-Prover", "source": "github_org"}, {"id": "2512.15715", "date": "2025-12-18", "title": "In Pursuit of Pixel Supervision for Visual Pre-training", "abstract": "At the most basic level, pixels are the source of the visual information through which we perceive the world. Pixels contain information at all levels, ranging from low-level attributes to high-level concepts. Autoencoders represent a classical and long-standing paradigm for learning representations from pixels or other raw inputs. In this work, we demonstrate that autoencoder-based self-supervised learning remains competitive today and can produce strong representations for downstream tasks, while remaining simple, stable, and efficient. Our model, codenamed \"Pixio\", is an enhanced masked autoencoder (MAE) with more challenging pre-training tasks and more capable architectures. The model is trained on 2B web-crawled images with a self-curation strategy with minimal human curation. Pixio performs competitively across a wide range of downstream tasks in the wild, including monocular depth estimation (e.g., Depth Anything), feed-forward 3D reconstruction (i.e., MapAnything), semantic segmentation, and robot learning, outperforming or matching DINOv3 trained at similar scales. Our results suggest that pixel-space self-supervised learning can serve as a promising alternative and a complement to latent-space approaches.", "authors": ["Lihe Yang", "Shang-Wen Li", "Yang Li", "Xinjie Lei", "Dong Wang"], "categories": ["cs.CV"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2512.15715", "pdf_url": "https://arxiv.org/pdf/2512.15715", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.15603", "date": "2025-12-17", "title": "Qwen-Image-Layered: Towards Inherent Editability via Layer Decomposition", "abstract": "Recent visual generative models often struggle with consistency during image editing due to the entangled nature of raster images, where all visual content is fused into a single canvas. In contrast, professional design tools employ layered representations, allowing isolated edits while preserving consistency. Motivated by this, we propose \\textbf{Qwen-Image-Layered}, an end-to-end diffusion model that decomposes a single RGB image into multiple semantically disentangled RGBA layers, enabling \\textbf{inherent editability}, where each RGBA layer can be independently manipulated without affecting other content. To support variable-length decomposition, we introduce three key components: (1) an RGBA-VAE to unify the latent representations of RGB and RGBA images; (2) a VLD-MMDiT (Variable Layers Decomposition MMDiT) architecture capable of decomposing a variable number of image layers; and (3) a Multi-stage Training strategy to adapt a pretrained image generation model into a multilayer image decomposer. Furthermore, to address the scarcity of high-quality multilayer training images, we build a pipeline to extract and annotate multilayer images from Photoshop documents (PSD). Experiments demonstrate that our method significantly surpasses existing approaches in decomposition quality and establishes a new paradigm for consistent image editing. Our code and models are released on \\href{ this https URL }{ this https URL }", "authors": ["Authors:Shengming Yin", "Zekai Zhang", "Zecheng Tang", "Kaiyuan Gao", "Xiao Xu"], "categories": ["Computer"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2512.15603", "pdf_url": "https://arxiv.org/pdf/2512.15603", "github_repo": "https://github.com/QwenLM/Qwen-Image-Layered", "source": "github_org"}, {"id": "2512.14008", "date": "2025-12-16", "title": "Sparse-LaViDa: Sparse Multimodal Discrete Diffusion Language Models", "abstract": "Masked Discrete Diffusion Models (MDMs) have achieved strong performance across a wide range of multimodal tasks, including image understanding, generation, and editing. However, their inference speed remains suboptimal due to the need to repeatedly process redundant masked tokens at every sampling step. In this work, we propose Sparse-LaViDa, a novel modeling framework that dynamically truncates unnecessary masked tokens at each inference step to accelerate MDM sampling. To preserve generation quality, we introduce specialized register tokens that serve as compact representations for the truncated tokens. Furthermore, to ensure consistency between training and inference, we design a specialized attention mask that faithfully matches the truncated sampling procedure during training. Built upon the state-of-the-art unified MDM LaViDa-O, Sparse-LaViDa achieves up to a 2x speedup across diverse tasks including text-to-image generation, image editing, and mathematical reasoning, while maintaining generation quality.", "authors": ["Authors:Shufan Li", "Jiuxiang Gu", "Kangning Liu", "Zhe Lin", "Zijun Wei"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2512.14008", "pdf_url": "https://arxiv.org/pdf/2512.14008", "github_repo": "https://github.com/adobe-research/Sparse-LaViDa", "source": "github_org"}, {"id": "2512.14698", "date": "2025-12-16", "title": "TimeLens: Rethinking Video Temporal Grounding with Multimodal LLMs", "abstract": "This paper does not introduce a novel method but instead establishes a straightforward, incremental, yet essential baseline for video temporal grounding (VTG), a core capability in video understanding. While multimodal large language models (MLLMs) excel at various video understanding tasks, the recipes for optimizing them for VTG remain under-explored. In this paper, we present TimeLens, a systematic investigation into building MLLMs with strong VTG ability, along two primary dimensions: data quality and algorithmic design. We first expose critical quality issues in existing VTG benchmarks and introduce TimeLens-Bench, comprising meticulously re-annotated versions of three popular benchmarks with strict quality criteria. Our analysis reveals dramatic model re-rankings compared to legacy benchmarks, confirming the unreliability of prior evaluation standards. We also address noisy training data through an automated re-annotation pipeline, yielding TimeLens-100K, a large-scale, high-quality training dataset. Building on our data foundation, we conduct in-depth explorations of algorithmic design principles, yielding a series of meaningful insights and effective yet efficient practices. These include interleaved textual encoding for time representation, a thinking-free reinforcement learning with verifiable rewards (RLVR) approach as the training paradigm, and carefully designed recipes for RLVR training. These efforts culminate in TimeLens models, a family of MLLMs with state-of-the-art VTG performance among open-source models and even surpass proprietary models such as GPT-5 and Gemini-2.5-Flash. All codes, data, and models will be released to facilitate future research.", "authors": ["Authors:Jun Zhang", "Teng Wang", "Yuying Ge", "Yixiao Ge", "Xinhao Li"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2512.14698", "pdf_url": "https://arxiv.org/pdf/2512.14698", "github_repo": "https://github.com/TencentARC/TimeLens", "source": "github_org"}, {"id": "2512.13687", "date": "2025-12-15", "title": "Towards Scalable Pre-training of Visual Tokenizers for Generation", "abstract": "The quality of the latent space in visual tokenizers (e.g., VAEs) is crucial for modern generative models. However, the standard reconstruction-based training paradigm produces a latent space that is biased towards low-level information, leading to a foundation flaw: better pixel-level accuracy does not lead to higher-quality generation. This implies that pouring extensive compute into visual tokenizer pre-training translates poorly to improved performance in generation. We identify this as the ``pre-training scaling problem`` and suggest a necessary shift: to be effective for generation, a latent space must concisely represent high-level semantics. We present VTP, a unified visual tokenizer pre-training framework, pioneering the joint optimization of image-text contrastive, self-supervised, and reconstruction losses. Our large-scale study reveals two principal findings: (1) understanding is a key driver of generation, and (2) much better scaling properties, where generative performance scales effectively with compute, parameters, and data allocated to the pretraining of the visual tokenizer. After large-scale pre-training, our tokenizer delivers a competitive profile (78.2 zero-shot accuracy and 0.36 rFID on ImageNet) and 4.1 times faster convergence on generation compared to advanced distillation methods. More importantly, it scales effectively: without modifying standard DiT training specs, solely investing more FLOPS in pretraining VTP achieves 65.8\\% FID improvement in downstream generation, while conventional autoencoder stagnates very early at 1/10 FLOPS. Our pre-trained models are available at this https URL .", "authors": ["Authors:Jingfeng Yao", "Yuda Song", "Yucong Zhou", "Xinggang Wang"], "categories": ["Computer"], "companies": ["MiniMax"], "abs_url": "https://arxiv.org/abs/2512.13687", "pdf_url": "https://arxiv.org/pdf/2512.13687", "github_repo": "https://github.com/minimax-ai/VTP", "source": "github_org"}, {"id": "2512.10685", "date": "2025-12-12", "title": "Sharp Monocular View Synthesis in Less Than a Second", "abstract": "We present SHARP, an approach to photorealistic view synthesis from a single image. Given a single photograph, SHARP regresses the parameters of a 3D Gaussian representation of the depicted scene. This is done in less than a second on a standard GPU via a single feedforward pass through a neural network. The 3D Gaussian representation produced by SHARP can then be rendered in real time, yielding high-resolution photorealistic images for nearby views. The representation is metric, with absolute scale, supporting metric camera movements. Experimental results demonstrate that SHARP delivers robust zero-shot generalization across datasets. It sets a new state of the art on multiple datasets, reducing LPIPS by 25-34% and DISTS by 21-43% versus the best prior model, while lowering the synthesis time by three orders of magnitude. Code and weights are provided at https://github.com/apple/ml-sharp", "authors": ["Lars Mescheder", "Wei Dong", "Shiwei Li", "Xuyang Bai", "Marcel Santos"], "categories": ["cs.CV", "cs.LG"], "companies": ["Apple"], "abs_url": "https://arxiv.org/abs/2512.10685", "pdf_url": "https://arxiv.org/pdf/2512.10685", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.05941", "date": "2025-12-08", "title": "Zoom in, Click out: Unlocking and Evaluating the Potential of Zooming for GUI Grounding", "abstract": "Grounding is a fundamental capability for building graphical user interface (GUI) agents. Although existing approaches rely on large-scale bounding box supervision, they still face various challenges, such as cross-platform generalization, complex layout analysis, and fine-grained element localization. In this paper, we investigate zoom as a strong yet underexplored prior for GUI grounding, and propose a training-free method, ZoomClick. By characterizing four key properties of zoom (i.e., pre-zoom, depth, shrink size, minimal crop size), we unlock its full capabilities for dynamic spatial focusing and adaptive context switching. Experiments demonstrate that our method significantly boosts the performance of both general vision-language and specialized GUI grounding models, achieving state-of-the-art results on several mainstream benchmarks; for example, UI-Venus-72B attains a 73.1% success rate on ScreenSpot-Pro. Furthermore, we present GUIZoom-Bench, a benchmark for evaluating model adaptability to zoom, aiming to inspire future research on improving zoom for further training and test-time scaling in GUI grounding tasks.", "authors": ["Zhiyuan Jiang", "Shenghao Xie", "Wenyi Li", "Wenqiang Zu", "Peihang Li"], "categories": ["cs.CV", "cs.AI", "cs.CL"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2512.05941", "pdf_url": "https://arxiv.org/pdf/2512.05941", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.07584", "date": "2025-12-08", "title": "LongCat-Image Technical Report", "abstract": "We introduce LongCat-Image, a pioneering open-source and bilingual (Chinese-English) foundation model for image generation, designed to address core challenges in multilingual text rendering, photorealism, deployment efficiency, and developer accessibility prevalent in current leading models. 1) We achieve this through rigorous data curation strategies across the pre-training, mid-training, and SFT stages, complemented by the coordinated use of curated reward models during the RL phase. This strategy establishes the model as a new state-of-the-art (SOTA), delivering superior text-rendering capabilities and remarkable photorealism, and significantly enhancing aesthetic quality. 2) Notably, it sets a new industry standard for Chinese character rendering. By supporting even complex and rare characters, it outperforms both major open-source and commercial solutions in coverage, while also achieving superior accuracy. 3) The model achieves remarkable efficiency through its compact design. With a core diffusion model of only 6B parameters, it is significantly smaller than the nearly 20B or larger Mixture-of-Experts (MoE) architectures common in the field. This ensures minimal VRAM usage and rapid inference, significantly reducing deployment costs. Beyond generation, LongCat-Image also excels in image editing, achieving SOTA results on standard benchmarks with superior editing consistency compared to other open-source works. 4) To fully empower the community, we have established the most comprehensive open-source ecosystem to date. We are releasing not only multiple model versions for text-to-image and image editing, including checkpoints after mid-training and post-training stages, but also the entire toolchain of training procedure. We believe that the openness of LongCat-Image will provide robust support for developers and researchers, pushing the frontiers of visual content creation.", "authors": ["Authors:Meituan LongCat Team: Hanghang Ma", "Haoxian Tan", "Jiale Huang", "Junqiang Wu", "Jun-Yan He"], "categories": ["Computer"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2512.07584", "pdf_url": "https://arxiv.org/pdf/2512.07584", "github_repo": "https://github.com/meituan-longcat/LongCat-Image", "source": "github_org"}, {"id": "2512.05111", "date": "2025-12-04", "title": "ARM-Thinker: Reinforcing Multimodal Generative Reward Models with Agentic Tool Use and Visual Reasoning", "abstract": "Reward models are critical for aligning vision-language systems with human preferences, yet current approaches suffer from hallucination, weak visual grounding, and an inability to use tools for verification, limiting their reliability on complex multimodal reasoning tasks. We present ARM-Thinker, an A}gentic multimodal Reward Model that autonomously invokes external tools (e.g., image cropping, doc page retrieval) to ground judgments in verifiable evidence, replacing static, non-interactive reward scoring. This enables the model to verify fine-grained visual details, cross-reference multi-page evidence, and validate reasoning claims, which are capabilities absent in existing reward models. We train ARM-Thinker with multi-stage reinforcement learning, jointly optimizing tool-calling decisions and judgment accuracy. To evaluate agentic reward modeling, we introduce ARMBench-VL, comprising three benchmarks that assess fine-grained visual grounding (image-level tools), multi-page document understanding (retrieval tools), and instruction following (text-level verification). ARM-Thinker achieves +16.2% average improvement on reward modeling benchmarks, +9.6% on tool-use tasks, and outperforms baselines on multimodal math and logical reasoning benchmarks. Our results demonstrate that agentic capabilities significantly enhance both accuracy and interpretability of reward models.", "authors": ["Authors:Shengyuan Ding", "Xinyu Fang", "Ziyu Liu", "Yuhang Zang", "Yuhang Cao"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2512.05111", "pdf_url": "https://arxiv.org/pdf/2512.05111", "github_repo": "https://github.com/InternLM/ARM-Thinker", "source": "github_org"}, {"id": "2512.04084", "date": "2025-12-03", "title": "SimFlow: Simplified and End-to-End Training of Latent Normalizing Flows", "abstract": "Normalizing Flows (NFs) learn invertible mappings between the data and a Gaussian distribution. Prior works usually suffer from two limitations. First, they add random noise to training samples or VAE latents as data augmentation, introducing complex pipelines including extra noising and denoising steps. Second, they use a pretrained and frozen VAE encoder, resulting in suboptimal reconstruction and generation quality. In this paper, we find that the two issues can be solved in a very simple way: just fixing the variance (which would otherwise be predicted by the VAE encoder) to a constant (e.g., 0.5). On the one hand, this method allows the encoder to output a broader distribution of tokens and the decoder to learn to reconstruct clean images from the augmented token distribution, avoiding additional noise or denoising design. On the other hand, fixed variance simplifies the VAE evidence lower bound, making it stable to train an NF with a VAE jointly. On the ImageNet $256 \\times 256$ generation task, our model SimFlow obtains a gFID score of 2.15, outperforming the state-of-the-art method STARFlow (gFID 2.40). Moreover, SimFlow can be seamlessly integrated with the end-to-end representation alignment (REPA-E) method and achieves an improved gFID of 1.91, setting a new state of the art among NFs.", "authors": ["Authors:Qinyu Zhao", "Guangting Zheng", "Tao Yang", "Rui Zhu", "Xingjian Leng"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2512.04084", "pdf_url": "https://arxiv.org/pdf/2512.04084", "github_repo": "https://github.com/bytedance-seed/SimFlow", "source": "github_org"}, {"id": "2512.04222", "date": "2025-12-03", "title": "ReasonX: MLLM-Guided Intrinsic Image Decomposition", "abstract": "Intrinsic image decomposition aims to separate images into physical components such as albedo, depth, normals, and illumination. While recent diffusion- and transformer-based models benefit from paired supervision from synthetic datasets, their generalization to diverse, real-world scenarios remains challenging. We propose ReasonX, a novel framework that leverages a multimodal large language model (MLLM) as a perceptual judge providing relative intrinsic comparisons, and uses these comparisons as GRPO rewards for fine-tuning intrinsic decomposition models on unlabeled, in-the-wild images. Unlike RL methods for generative models, our framework aligns conditional intrinsic predictors by rewarding agreement between the judge&#39;s relational assessments and analytically derived relations from the model&#39;s outputs. ReasonX is model-agnostic and can be applied to different intrinsic predictors. Across multiple base architectures and modalities, ReasonX yields significant improvements, including 9-25% WHDR reduction on IIW albedo and up to 46% depth accuracy gains on ETH3D, highlighting the promise of MLLM-guided comparative supervision to bridge low- and high-level vision reasoning.", "authors": ["Authors:Alara Dirik", "Tuanfeng Wang", "Duygu Ceylan", "Stefanos Zafeiriou", "Anna Frühstück"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2512.04222", "pdf_url": "https://arxiv.org/pdf/2512.04222", "github_repo": "https://github.com/adobe-research/ReasonX", "source": "github_org"}, {"id": "2512.04324", "date": "2025-12-03", "title": "DAComp: Benchmarking Data Agents across the Full Data Intelligence Lifecycle", "abstract": "Real-world enterprise data intelligence workflows encompass data engineering that turns raw sources into analytical-ready tables and data analysis that convert those tables into decision-oriented insights. We introduce DAComp, a benchmark of 210 tasks that mirrors these complex workflows. Data engineering (DE) tasks require repository-level engineering on industrial schemas, including designing and building multi-stage SQL pipelines from scratch and evolving existing systems under evolving requirements. Data analysis (DA) tasks pose open-ended business problems that demand strategic planning, exploratory analysis through iterative coding, interpretation of intermediate results, and the synthesis of actionable recommendations. Engineering tasks are scored through execution-based, multi-metric evaluation. Open-ended tasks are assessed by a reliable, experimentally validated LLM-judge, which is guided by hierarchical, meticulously crafted rubrics. Our experiments reveal that even state-of-the-art agents falter on DAComp. Performance on DE tasks is particularly low, with success rates under 20%, exposing a critical bottleneck in holistic pipeline orchestration, not merely code generation. Scores on DA tasks also average below 40%, highlighting profound deficiencies in open-ended reasoning and demonstrating that engineering and analysis are distinct capabilities. By clearly diagnosing these limitations, DAComp provides a rigorous and realistic testbed to drive the development of truly capable autonomous data agents for enterprise settings. Our data and code are available at this https URL", "authors": ["Authors:Fangyu Lei", "Jinxiang Meng", "Yiming Huang", "Junjie Zhao", "Yitong Zhang"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2512.04324", "pdf_url": "https://arxiv.org/pdf/2512.04324", "github_repo": "https://github.com/bytedance-seed/DAComp", "source": "github_org"}, {"id": "2511.22625", "date": "2025-12-02", "title": "REASONEDIT: Towards Reasoning-Enhanced Image Editing Models", "abstract": "Recent advances in image editing models have shown remarkable progress. A common architectural design couples a multimodal large language model (MLLM) encoder with a diffusion decoder, as seen in systems such as Step1X-Edit and Qwen-Image-Edit, where the MLLM encodes both the reference image and the instruction but remains frozen during training. In this work, we demonstrate that unlocking the reasoning capabilities of MLLM can further push the boundaries of editing models. Specifically, we explore two reasoning mechanisms, thinking and reflection, which enhance instruction understanding and editing accuracy. Based on that, our proposed framework enables image editing in a thinking-editing-reflection loop: the thinking mechanism leverages the world knowledge of MLLM to interpret abstract instructions, while the reflection reviews editing results, automatically corrects unintended manipulations, and identifies the stopping round. Extensive experiments demonstrate that our reasoning approach achieves significant performance gains, with improvements of ImgEdit (+4.3%), GEdit (+4.7%), and Kris (+8.2%) when initializing our DiT from the Step1X-Edit (ReasonEdit-S), and also outperforms previous open-source methods on both GEdit and Kris when integrated with Qwen-Image-Edit (ReasonEdit-Q).", "authors": ["Fukun Yin", "Shiyu Liu", "Yucheng Han", "Zhibo Wang", "Peng Xing"], "categories": ["cs.CV"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2511.22625", "pdf_url": "https://arxiv.org/pdf/2511.22625", "github_repo": "", "source": "daily_arxiv"}, {"id": "2512.01311", "date": "2025-12-01", "title": "CuES: A Curiosity-driven and Environment-grounded Synthesis Framework for Agentic RL", "abstract": "Large language model based agents are increasingly deployed in complex, tool augmented environments. While reinforcement learning provides a principled mechanism for such agents to improve through interaction, its effectiveness critically depends on the availability of structured training tasks. In many realistic settings, however, no such tasks exist a challenge we term task scarcity, which has become a key bottleneck for scaling agentic RL. Existing approaches typically assume predefined task collections, an assumption that fails in novel environments where tool semantics and affordances are initially unknown. To address this limitation, we formalize the problem of Task Generation for Agentic RL, where an agent must learn within a given environment that lacks predefined tasks. We propose CuES, a Curiosity driven and Environment grounded Synthesis framework that autonomously generates diverse, executable, and meaningful tasks directly from the environment structure and affordances, without relying on handcrafted seeds or external corpora. CuES drives exploration through intrinsic curiosity, abstracts interaction patterns into reusable task schemas, and refines them through lightweight top down guidance and memory based quality control. Across three representative environments, AppWorld, BFCL, and WebShop, CuES produces task distributions that match or surpass manually curated datasets in both diversity and executability, yielding substantial downstream policy improvements. These results demonstrate that curiosity driven, environment grounded task generation provides a scalable foundation for agents that not only learn how to act, but also learn what to learn. The code is available at this https URL .", "authors": ["Authors:Shinji Mai", "Yunpeng Zhai", "Ziqian Chen", "Cheng Chen", "Anni Zou"], "categories": ["Artificial"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2512.01311", "pdf_url": "https://arxiv.org/pdf/2512.01311", "github_repo": "https://github.com/modelscope/AgentEvolver", "source": "github_org"}, {"id": "2512.01342", "date": "2025-12-01", "title": "InternVideo-Next: Towards General Video Foundation Models without Video-Text Supervision", "abstract": "Large-scale video-text pretraining achieves strong performance but depends on noisy, synthetic captions with limited semantic coverage, often overlooking implicit world knowledge such as object motion, 3D geometry, and physical cues. In contrast, masked video modeling (MVM) directly exploits spatiotemporal structures but trails text-supervised methods on general tasks. We find this gap arises from overlooked architectural issues: pixel-level reconstruction struggles with convergence and its low-level requirement often conflicts with semantics, while latent prediction often encourages shortcut learning. To address these, we disentangle the traditional encoder-decoder design into an Encoder-Predictor-Decoder (EPD) framework, where the predictor acts as a latent world model, and propose InternVideo-Next, a two-stage pretraining scheme that builds a semantically consistent yet detail-preserving latent space for this world model. First, conventional linear decoder in pixel MVM enforces the predictor output latent to be linearly projected to, thus separable in pixel space, causing the conflict with semantic abstraction. Our Stage 1 proposes a conditional diffusion decoder and injects reliable image-level semantic priors to enhance semantics and convergence, thus bridging pixel-level fidelity with high-level semantic abstraction. Stage 2 further learns world knowledge by predicting frozen Stage 1 targets within this space, mitigating shortcut learning. Trained on public, unlabeled videos, InternVideo-Next achieves state-of-the-art results across benchmarks and provides a scalable path toward general video representation learning.", "authors": ["Authors:Chenting Wang", "Yuhan Zhu", "Yicheng Xu", "Jiange Yang", "Lang Lin"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2512.01342", "pdf_url": "https://arxiv.org/pdf/2512.01342", "github_repo": "https://github.com/OpenGVLab/InternVideo", "source": "github_org"}, {"id": "2512.00752", "date": "2025-11-30", "title": "Charts Are Not Images: On the Challenges of Scientific Chart Editing", "abstract": "Generative models, such as diffusion and autoregressive approaches, have demonstrated impressive capabilities in editing natural images. However, applying these tools to scientific charts rests on a flawed assumption: a chart is not merely an arrangement of pixels but a visual representation of structured data governed by a graphical grammar. Consequently, chart editing is not a pixel-manipulation task but a structured transformation problem. To address this fundamental mismatch, we introduce \\textit{FigEdit}, a large-scale benchmark for scientific figure editing comprising over 30,000 samples. Grounded in real-world data, our benchmark is distinguished by its diversity, covering 10 distinct chart types and a rich vocabulary of complex editing instructions. The benchmark is organized into five distinct and progressively challenging tasks: single edits, multi edits, conversational edits, visual-guidance-based edits, and style transfer. Our evaluation of a range of state-of-the-art models on this benchmark reveals their poor performance on scientific figures, as they consistently fail to handle the underlying structured transformations required for valid edits. Furthermore, our analysis indicates that traditional evaluation metrics (e.g., SSIM, PSNR) have limitations in capturing the semantic correctness of chart edits. Our benchmark demonstrates the profound limitations of pixel-level manipulation and provides a robust foundation for developing and evaluating future structure-aware models. By releasing \\textit{FigEdit} ( this https URL ), we aim to enable systematic progress in structure-aware figure editing, provide a common ground for fair comparison, and encourage future research on models that understand both the visual and semantic layers of scientific charts.", "authors": ["Authors:Shawn Li", "Ryan Rossi", "Sungchul Kim", "Sunav Choudhary", "Franck Dernoncourt"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2512.00752", "pdf_url": "https://arxiv.org/pdf/2512.00752", "github_repo": "https://github.com/adobe-research/figure-editing", "source": "github_org"}, {"id": "2511.22475", "date": "2025-11-27", "title": "Adversarial Flow Models", "abstract": "We present adversarial flow models, a class of generative models that belongs to both the adversarial and flow families. Our method supports native one-step and multi-step generation and is trained with an adversarial objective. Unlike traditional GANs, in which the generator learns an arbitrary transport map between the noise and data distributions, our generator is encouraged to learn a deterministic noise-to-data mapping. This significantly stabilizes adversarial training. Unlike consistency-based methods, our model directly learns one-step or few-step generation without having to learn the intermediate timesteps of the probability flow for propagation. This preserves model capacity and avoids error accumulation. Under the same 1NFE setting on ImageNet-256px, our B/2 model approaches the performance of consistency-based XL/2 models, while our XL/2 model achieves a new best FID of 2.38. We additionally demonstrate end-to-end training of 56-layer and 112-layer models without any intermediate supervision, achieving FIDs of 2.08 and 1.94 with a single forward pass and surpassing the corresponding 28-layer 2NFE and 4NFE counterparts with equal compute and parameters. The code is available at this https URL", "authors": ["Authors:Shanchuan Lin", "Ceyuan Yang", "Zhijie Lin", "Hao Chen", "Haoqi Fan"], "categories": ["Machine"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2511.22475", "pdf_url": "https://arxiv.org/pdf/2511.22475", "github_repo": "https://github.com/bytedance-seed/Adversarial-Flow-Models", "source": "github_org"}, {"id": "2511.21631", "date": "2025-11-26", "title": "Qwen3-VL Technical Report", "abstract": "We introduce Qwen3-VL, the most capable vision-language model in the Qwen series to date, achieving superior performance across a broad range of multimodal benchmarks. It natively supports interleaved contexts of up to 256K tokens, seamlessly integrating text, images, and video. The model family includes both dense (2B/4B/8B/32B) and mixture-of-experts (30B-A3B/235B-A22B) variants to accommodate diverse latency-quality trade-offs. Qwen3-VL delivers three core pillars: (i) markedly stronger pure-text understanding, surpassing comparable text-only backbones in several cases; (ii) robust long-context comprehension with a native 256K-token window for both text and interleaved multimodal inputs, enabling faithful retention, retrieval, and cross-referencing across long documents and videos; and (iii) advanced multimodal reasoning across single-image, multi-image, and video tasks, demonstrating leading performance on comprehensive evaluations such as MMMU and visual-math benchmarks (e.g., MathVista and MathVision). Architecturally, we introduce three key upgrades: (i) an enhanced interleaved-MRoPE for stronger spatial-temporal modeling across images and video; (ii) DeepStack integration, which effectively leverages multi-level ViT features to tighten vision-language alignment; and (iii) text-based time alignment for video, evolving from T-RoPE to explicit textual timestamp alignment for more precise temporal grounding. Under comparable token budgets and latency constraints, Qwen3-VL achieves superior performance in both dense and Mixture-of-Experts (MoE) architectures. We envision Qwen3-VL serving as a foundational engine for image-grounded reasoning, agentic decision-making, and multimodal code intelligence in real-world workflows.", "authors": ["Authors:Shuai Bai", "Yuxuan Cai", "Ruizhe Chen", "Keqin Chen", "Xionghui Chen"], "categories": ["Computer"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2511.21631", "pdf_url": "https://arxiv.org/pdf/2511.21631", "github_repo": "https://github.com/QwenLM/Qwen3-VL", "source": "github_org"}, {"id": "2511.20272", "date": "2025-11-25", "title": "VKnowU: Evaluating Visual Knowledge Understanding in Multimodal LLMs", "abstract": "While Multimodal Large Language Models (MLLMs) have become adept at recognizing objects, they often lack the intuitive, human-like understanding of the world&#39;s underlying physical and social principles. This high-level vision-grounded semantics, which we term visual knowledge, forms a bridge between perception and reasoning, yet remains an underexplored area in current MLLMs. To systematically evaluate this capability, we present VKnowU, a comprehensive benchmark featuring 1,680 questions in 1,249 videos, covering 8 core types of visual knowledge spanning both world-centric (e.g., intuitive physics) and human-centric (e.g., subjective intentions). Evaluation of 23 SOTA MLLMs reveals that leading models still fall short of human performance, with particularly notable gaps in the world-centric. To bridge this gap, we introduce a new dataset, VKnowQA, and VideoKnow+, a baseline model that explicitly incorporates visual knowledge into MLLMs. VideoKnow+ follows a structured See-Think-Answer paradigm and adopts reinforcement learning with visual knowledge reward, achieving a +3.7% improvement on VKnowU and consistent gains on MVBench, Video-MME, and MMVU. Our work highlights visual knowledge as a missing cornerstone for developing more generalizable MLLMs that can not only see but also truly understand our physical and social worlds.", "authors": ["Authors:Tianxiang Jiang", "Sheng Xia", "Yicheng Xu", "Linquan Wu", "Xiangyu Zeng"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2511.20272", "pdf_url": "https://arxiv.org/pdf/2511.20272", "github_repo": "https://github.com/OpenGVLab/VKnowU", "source": "github_org"}, {"id": "2511.18333", "date": "2025-11-23", "title": "ConsistCompose: Unified Multimodal Layout Control for Image Composition", "abstract": "Unified multimodal models that couple visual understanding with image generation have advanced rapidly, yet most systems still focus on visual grounding-aligning language with image regions-while their generative counterpart, linguistic-embedded layout-grounded generation (LELG) for layout-controllable multi-instance generation, remains underexplored and limits precise compositional control. We present ConsistCompose, a unified multimodal framework that embeds layout coordinates directly into language prompts, enabling layout-controlled multi-instance image generation from Interleaved Image-Text within a single generative interface. We further construct ConsistCompose3M, a 3.4M multi-instance generation dataset with layout and identity annotations (2.6M text-guided and 0.8M image-guided data pairs) that provides large-scale supervision for layout-conditioned generation. Within this framework, LELG is instantiated through instance-coordinate binding prompts and coordinate-aware classifier-free guidance, which translate linguistic layout cues into precise spatial control without task-specific branches. Experiments on COCO-Position and MS-Bench show that ConsistCompose substantially improves spatial accuracy over layout-controlled baselines while preserving identity fidelity and competitive general multimodal understanding, establishing a unified paradigm for layout-controllable multimodal image generation.", "authors": ["Authors:Xuanke Shi", "Boxuan Li", "Xiaoyang Han", "Zhongang Cai", "Lei Yang"], "categories": ["Computer"], "companies": ["SenseTime"], "abs_url": "https://arxiv.org/abs/2511.18333", "pdf_url": "https://arxiv.org/pdf/2511.18333", "github_repo": "https://github.com/OpenSenseNova/ConsistCompose", "source": "github_org"}, {"id": "2511.15703", "date": "2025-11-19", "title": "Think Visually, Reason Textually: Vision-Language Synergy in ARC", "abstract": "Abstract reasoning from minimal examples remains a core unsolved problem for frontier foundation models such as GPT-5 and Grok 4. These models still fail to infer structured transformation rules from a handful of examples, which is a key hallmark of human intelligence. The Abstraction and Reasoning Corpus for Artificial General Intelligence (ARC-AGI) provides a rigorous testbed for this capability, demanding conceptual rule induction and transfer to novel tasks. Most existing methods treat ARC-AGI as a purely textual reasoning task, overlooking the fact that humans rely heavily on visual abstraction when solving such puzzles. However, our pilot experiments reveal a paradox: naively rendering ARC-AGI grids as images degrades performance due to imprecise rule execution. This leads to our central hypothesis that vision and language possess complementary strengths across distinct reasoning stages: vision supports global pattern abstraction and verification, whereas language specializes in symbolic rule formulation and precise execution. Building on this insight, we introduce two synergistic strategies: (1) Vision-Language Synergy Reasoning (VLSR), which decomposes ARC-AGI into modality-aligned subtasks; and (2) Modality-Switch Self-Correction (MSSC), which leverages vision to verify text-based reasoning for intrinsic error correction. Extensive experiments demonstrate that our approach yields up to a 4.33\\% improvement over text-only baselines across diverse flagship models and multiple ARC-AGI tasks. Our findings suggest that unifying visual abstraction with linguistic reasoning is a crucial step toward achieving generalizable, human-like intelligence in future foundation models. Source code is released at this https URL .", "authors": ["Authors:Beichen Zhang", "Yuhang Zang", "Xiaoyi Dong", "Yuhang Cao", "Haodong Duan"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2511.15703", "pdf_url": "https://arxiv.org/pdf/2511.15703", "github_repo": "https://github.com/InternLM/ARC-VL", "source": "github_org"}, {"id": "2511.14349", "date": "2025-11-18", "title": "ARC-Chapter: Structuring Hour-Long Videos into Navigable Chapters and Hierarchical Summaries", "abstract": "The proliferation of hour-long videos (e.g., lectures, podcasts, documentaries) has intensified demand for efficient content structuring. However, existing approaches are constrained by small-scale training with annotations that are typical short and coarse, restricting generalization to nuanced transitions in long videos. We introduce ARC-Chapter, the first large-scale video chaptering model trained on over million-level long video chapters, featuring bilingual, temporally grounded, and hierarchical chapter annotations. To achieve this goal, we curated a bilingual English-Chinese chapter dataset via a structured pipeline that unifies ASR transcripts, scene texts, visual captions into multi-level annotations, from short title to long summaries. We demonstrate clear performance improvements with data scaling, both in data volume and label intensity. Moreover, we design a new evaluation metric termed GRACE, which incorporates many-to-one segment overlaps and semantic similarity, better reflecting real-world chaptering flexibility. Extensive experiments demonstrate that ARC-Chapter establishes a new state-of-the-art by a significant margin, outperforming the previous best by 14.0% in F1 score and 11.3% in SODA score. Moreover, ARC-Chapter shows excellent transferability, improving the state-of-the-art on downstream tasks like dense video captioning on YouCook2.", "authors": ["Authors:Junfu Pu", "Teng Wang", "Yixiao Ge", "Yuying Ge", "Chen Li"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2511.14349", "pdf_url": "https://arxiv.org/pdf/2511.14349", "github_repo": "https://github.com/TencentARC/ARC-Chapter", "source": "github_org"}, {"id": "2511.13719", "date": "2025-11-17", "title": "Scaling Spatial Intelligence with Multimodal Foundation Models", "abstract": "Despite remarkable progress, multimodal foundation models still exhibit surprising deficiencies in spatial intelligence. In this work, we explore scaling up multimodal foundation models to cultivate spatial intelligence within the SenseNova-SI family, built upon established multimodal foundations including visual understanding models (i.e., Qwen3-VL and InternVL3) and unified understanding and generation models (i.e., Bagel). We take a principled approach to constructing high-performing and robust spatial intelligence by systematically curating SenseNova-SI-8M: eight million diverse data samples under a rigorous taxonomy of spatial capabilities. SenseNova-SI demonstrates unprecedented performance across a broad range of spatial intelligence benchmarks: 68.8% on VSI-Bench, 43.3% on MMSI, 85.7% on MindCube, 54.7% on ViewSpatial, 47.7% on SITE, 63.9% on BLINK, 55.5% on 3DSR, and 72.0% on EmbSpatial, while maintaining strong general multimodal understanding (e.g., 84.9% on MMBench-En). More importantly, we analyze the impact of data scaling, discuss early signs of emergent generalization capabilities enabled by diverse data training, analyze the risk of overfitting and language shortcuts, present a preliminary study on spatial chain-of-thought reasoning, and validate the potential downstream application. All newly trained multimodal foundation models are publicly released.", "authors": ["Authors:Zhongang Cai", "Ruisi Wang", "Chenyang Gu", "Fanyi Pu", "Junxiang Xu"], "categories": ["Computer"], "companies": ["SenseTime"], "abs_url": "https://arxiv.org/abs/2511.13719", "pdf_url": "https://arxiv.org/pdf/2511.13719", "github_repo": "https://github.com/OpenSenseNova/SenseNova-SI", "source": "github_org"}, {"id": "2511.11413", "date": "2025-11-14", "title": "Multicalibration yields better matchings", "abstract": "Consider the problem of finding the best matching in a weighted graph where we only have access to predictions of the actual stochastic weights, based on an underlying context. If the predictor is the Bayes optimal one, then computing the best matching based on the predicted weights is optimal. However, in practice, this perfect information scenario is not realistic. Given an imperfect predictor, a suboptimal decision rule may compensate for the induced error and thus outperform the standard optimal rule. In this paper, we propose multicalibration as a way to address this problem. This fairness notion requires a predictor to be unbiased on each element of a family of protected sets of contexts. Given a class of matching algorithms $\\mathcal C$ and any predictor $\\gamma$ of the edge-weights, we show how to construct a specific multicalibrated predictor $\\hat \\gamma$, with the following property. Picking the best matching based on the output of $\\hat \\gamma$ is competitive with the best decision rule in $\\mathcal C$ applied onto the original predictor $\\gamma$. We complement this result by providing sample complexity bounds.", "authors": ["Authors:Riccardo Colini Baldeschi", "Simone Di Gregorio", "Simone Fioravanti", "Federico Fusco", "Ido Guy"], "categories": ["Machine"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2511.11413", "pdf_url": "https://arxiv.org/pdf/2511.11413", "github_repo": "https://github.com/facebookresearch/multicalibration_for_matching", "source": "github_org"}, {"id": "2511.10395", "date": "2025-11-13", "title": "AgentEvolver: Towards Efficient Self-Evolving Agent System", "abstract": "Autonomous agents powered by large language models (LLMs) have the potential to signific
