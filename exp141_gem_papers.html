"https://arxiv.org/abs/2504.17397", "pdf_url": "https://arxiv.org/pdf/2504.17397", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.17761", "date": "2025-04-25", "title": "Step1X-Edit: A Practical Framework for General Image Editing", "abstract": "In recent years, image editing models have witnessed remarkable and rapid\ndevelopment. The recent unveiling of cutting-edge multimodal models such as\nGPT-4o and Gemini2 Flash has introduced highly promising image editing\ncapabilities. These models demonstrate an impressive aptitude for fulfilling a\nvast majority of user-driven editing requirements, marking a significant\nadvancement in the field of image manipulation. However, there is still a large\ngap between the open-source algorithm with these closed-source models. Thus, in\nthis paper, we aim to release a state-of-the-art image editing model, called\nStep1X-Edit, which can provide comparable performance against the closed-source\nmodels like GPT-4o and Gemini2 Flash. More specifically, we adopt the\nMultimodal LLM to process the reference image and the user's editing\ninstruction. A latent embedding has been extracted and integrated with a\ndiffusion image decoder to obtain the target image. To train the model, we\nbuild a data generation pipeline to produce a high-quality dataset. For\nevaluation, we develop the GEdit-Bench, a novel benchmark rooted in real-world\nuser instructions. Experimental results on GEdit-Bench demonstrate that\nStep1X-Edit outperforms existing open-source baselines by a substantial margin\nand approaches the performance of leading proprietary models, thereby making\nsignificant contributions to the field of image editing.", "authors": ["Shiyu Liu", "Yucheng Han", "Peng Xing", "Fukun Yin", "Rui Wang"], "categories": ["cs.CV"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2504.17761", "pdf_url": "https://arxiv.org/pdf/2504.17761", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.18425", "date": "2025-04-25", "title": "Kimi-Audio Technical Report", "abstract": "We present Kimi-Audio, an open-source audio foundation model that excels in audio understanding, generation, and conversation. We detail the practices in building Kimi-Audio, including model architecture, data curation, training recipe, inference deployment, and evaluation. Specifically, we leverage a 12.5Hz audio tokenizer, design a novel LLM-based architecture with continuous features as input and discrete tokens as output, and develop a chunk-wise streaming detokenizer based on flow matching. We curate a pre-training dataset that consists of more than 13 million hours of audio data covering a wide range of modalities including speech, sound, and music, and build a pipeline to construct high-quality and diverse post-training data. Initialized from a pre-trained LLM, Kimi-Audio is continual pre-trained on both audio and text data with several carefully designed tasks, and then fine-tuned to support a diverse of audio-related tasks. Extensive evaluation shows that Kimi-Audio achieves state-of-the-art performance on a range of audio benchmarks including speech recognition, audio understanding, audio question answering, and speech conversation. We release the codes, model checkpoints, as well as the evaluation toolkits in this https URL .", "authors": ["Authors:KimiTeam", "Ding Ding", "Zeqian Ju", "Yichong Leng", "Songxiang Liu"], "categories": ["Audio"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2504.18425", "pdf_url": "https://arxiv.org/pdf/2504.18425", "github_repo": "https://github.com/MoonshotAI/Kimi-Audio", "source": "github_org"}, {"id": "2504.18428", "date": "2025-04-25", "title": "PolyMath: Evaluating Mathematical Reasoning in Multilingual Contexts", "abstract": "In this paper, we introduce PolyMath, a multilingual mathematical reasoning benchmark covering 18 languages and 4 easy-to-hard difficulty levels. Our benchmark ensures difficulty comprehensiveness, language diversity, and high-quality translation, making it a highly discriminative multilingual mathematical benchmark in the era of reasoning LLMs. We conduct a comprehensive evaluation for advanced LLMs and find that even Qwen-3-235B-A22B-Thinking and Gemini-2.5-pro, achieve only 54.6 and 52.2 benchmark scores, with about 40% accuracy under the highest level From a language perspective, our benchmark reveals several key challenges of LLMs in multilingual reasoning: (1) Reasoning performance varies widely across languages for current LLMs; (2) Input-output language consistency is low in reasoning LLMs and may be correlated with performance; (3) The thinking length differs significantly by language for current LLMs. Additionally, we demonstrate that controlling the output language in the instructions has the potential to affect reasoning performance, especially for some low-resource languages, suggesting a promising direction for improving multilingual capabilities in LLMs.", "authors": ["Authors:Yiming Wang", "Pei Zhang", "Jialong Tang", "Haoran Wei", "Baosong Yang"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2504.18428", "pdf_url": "https://arxiv.org/pdf/2504.18428", "github_repo": "https://github.com/QwenLM/PolyMath", "source": "github_org"}, {"id": "2504.15271", "date": "2025-04-21", "title": "Eagle 2.5: Boosting Long-Context Post-Training for Frontier Vision-Language Models", "abstract": "We introduce Eagle 2.5, a family of frontier vision-language models (VLMs) for long-context multimodal learning. Our work addresses the challenges in long video comprehension and high-resolution image understanding, introducing a generalist framework for both tasks. The proposed training framework incorporates Automatic Degrade Sampling and Image Area Preservation, two techniques that preserve contextual integrity and visual details. The framework also includes numerous efficiency optimizations in the pipeline for long-context data training. Finally, we propose Eagle-Video-110K, a novel dataset that integrates both story-level and clip-level annotations, facilitating long-video understanding. Eagle 2.5 demonstrates substantial improvements on long-context multimodal benchmarks, providing a robust solution to the limitations of existing VLMs. Notably, our best model Eagle 2.5-8B achieves 72.4% on Video-MME with 512 input frames, matching the results of top-tier commercial model such as GPT-4o and large-scale open-source models like Qwen2.5-VL-72B and InternVL2.5-78B.", "authors": ["Authors:Guo Chen", "Zhiqi Li", "Shihao Wang", "Jindong Jiang", "Yicheng Liu"], "categories": ["Computer"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2504.15271", "pdf_url": "https://arxiv.org/pdf/2504.15271", "github_repo": "https://github.com/NVlabs/Eagle", "source": "github_org"}, {"id": "2504.12395", "date": "2025-04-18", "title": "InstantCharacter: Personalize Any Characters with a Scalable Diffusion Transformer Framework", "abstract": "Current learning-based subject customization approaches, predominantly\nrelying on U-Net architectures, suffer from limited generalization ability and\ncompromised image quality. Meanwhile, optimization-based methods require\nsubject-specific fine-tuning, which inevitably degrades textual\ncontrollability. To address these challenges, we propose InstantCharacter, a\nscalable framework for character customization built upon a foundation\ndiffusion transformer. InstantCharacter demonstrates three fundamental\nadvantages: first, it achieves open-domain personalization across diverse\ncharacter appearances, poses, and styles while maintaining high-fidelity\nresults. Second, the framework introduces a scalable adapter with stacked\ntransformer encoders, which effectively processes open-domain character\nfeatures and seamlessly interacts with the latent space of modern diffusion\ntransformers. Third, to effectively train the framework, we construct a\nlarge-scale character dataset containing 10-million-level samples. The dataset\nis systematically organized into paired (multi-view character) and unpaired\n(text-image combinations) subsets. This dual-data structure enables\nsimultaneous optimization of identity consistency and textual editability\nthrough distinct learning pathways. Qualitative experiments demonstrate the\nadvanced capabilities of InstantCharacter in generating high-fidelity,\ntext-controllable, and character-consistent images, setting a new benchmark for\ncharacter-driven image generation. Our source code is available at\nhttps://github.com/Tencent/InstantCharacter.", "authors": ["Jiale Tao", "Yanbing Zhang", "Qixun Wang", "Yiji Cheng", "Haofan Wang"], "categories": ["cs.CV"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2504.12395", "pdf_url": "https://arxiv.org/pdf/2504.12395", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.13816", "date": "2025-04-18", "title": "Analyzing LLMs&#39; Knowledge Boundary Cognition Across Languages Through the Lens of Internal Representations", "abstract": "While understanding the knowledge boundaries of LLMs is crucial to prevent hallucination, research on the knowledge boundaries of LLMs has predominantly focused on English. In this work, we present the first study to analyze how LLMs recognize knowledge boundaries across different languages by probing their internal representations when processing known and unknown questions in multiple languages. Our empirical studies reveal three key findings: 1) LLMs&#39; perceptions of knowledge boundaries are encoded in the middle to middle-upper layers across different languages. 2) Language differences in knowledge boundary perception follow a linear structure, which motivates our proposal of a training-free alignment method that effectively transfers knowledge boundary perception ability across languages, thereby helping reduce hallucination risk in low-resource languages; 3) Fine-tuning on bilingual question pair translation further enhances LLMs&#39; recognition of knowledge boundaries across languages. Given the absence of standard testbeds for cross-lingual knowledge boundary analysis, we construct a multilingual evaluation suite comprising three representative types of knowledge boundary data. Our code and datasets are publicly available at this https URL .", "authors": ["Authors:Chenghao Xiao", "Hou Pong Chan", "Hao Zhang", "Mahani Aljunied", "Lidong Bing"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2504.13816", "pdf_url": "https://arxiv.org/pdf/2504.13816", "github_repo": "https://github.com/DAMO-NLP-SG/LLM-Multilingual-Knowledge-Boundaries", "source": "github_org"}, {"id": "2504.11844", "date": "2025-04-17", "title": "Evaluating the Goal-Directedness of Large Language Models", "abstract": "To what extent do LLMs use their capabilities towards their given goal? We\ntake this as a measure of their goal-directedness. We evaluate\ngoal-directedness on tasks that require information gathering, cognitive\neffort, and plan execution, where we use subtasks to infer each model's\nrelevant capabilities. Our evaluations of LLMs from Google DeepMind, OpenAI,\nand Anthropic show that goal-directedness is relatively consistent across\ntasks, differs from task performance, and is only moderately sensitive to\nmotivational prompts. Notably, most models are not fully goal-directed. We hope\nour goal-directedness evaluations will enable better monitoring of LLM\nprogress, and enable more deliberate design choices of agentic properties in\nLLMs.", "authors": ["Tom Everitt", "Cristina Garbacea", "Alexis Bellot", "Jonathan Richens", "Henry Papadatos"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2504.11844", "pdf_url": "https://arxiv.org/pdf/2504.11844", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.12186", "date": "2025-04-17", "title": "CoMotion: Concurrent Multi-person 3D Motion", "abstract": "We introduce an approach for detecting and tracking detailed 3D poses of\nmultiple people from a single monocular camera stream. Our system maintains\ntemporally coherent predictions in crowded scenes filled with difficult poses\nand occlusions. Our model performs both strong per-frame detection and a\nlearned pose update to track people from frame to frame. Rather than match\ndetections across time, poses are updated directly from a new input image,\nwhich enables online tracking through occlusion. We train on numerous image and\nvideo datasets leveraging pseudo-labeled annotations to produce a model that\nmatches state-of-the-art systems in 3D pose estimation accuracy while being\nfaster and more accurate in tracking multiple people through time. Code and\nweights are provided at https://github.com/apple/ml-comotion", "authors": ["Alejandro Newell", "Peiyun Hu", "Lahav Lipson", "Stephan R. Richter", "Vladlen Koltun"], "categories": ["cs.CV", "cs.LG"], "companies": ["Apple"], "abs_url": "https://arxiv.org/abs/2504.12186", "pdf_url": "https://arxiv.org/pdf/2504.12186", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.10861", "date": "2025-04-16", "title": "Ai2 Scholar QA: Organized Literature Synthesis with Attribution", "abstract": "Retrieval-augmented generation is increasingly effective in answering\nscientific questions from literature, but many state-of-the-art systems are\nexpensive and closed-source. We introduce Ai2 Scholar QA, a free online\nscientific question answering application. To facilitate research, we make our\nentire pipeline public: as a customizable open-source Python package and\ninteractive web app, along with paper indexes accessible through public APIs\nand downloadable datasets. We describe our system in detail and present\nexperiments analyzing its key design decisions. In an evaluation on a recent\nscientific QA benchmark, we find that Ai2 Scholar QA outperforms competing\nsystems.", "authors": ["Amanpreet Singh", "Joseph Chee Chang", "Chloe Anastasiades", "Dany Haddad", "Aakanksha Naik"], "categories": ["cs.CL"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2504.10861", "pdf_url": "https://arxiv.org/pdf/2504.10861", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.11094", "date": "2025-04-15", "title": "Evaluation Report on MCP Servers", "abstract": "With the rise of LLMs, a large number of Model Context Protocol (MCP) services have emerged since the end of 2024. However, the effectiveness and efficiency of MCP servers have not been well studied. To study these questions, we propose an evaluation framework, called MCPBench. We selected several widely used MCP server and conducted an experimental evaluation on their accuracy, time, and token usage. Our experiments showed that the most effective MCP, Bing Web Search, achieved an accuracy of 64%. Importantly, we found that the accuracy of MCP servers can be substantially enhanced by involving declarative interface. This research paves the way for further investigations into optimized MCP implementations, ultimately leading to better AI-driven applications and data retrieval solutions.", "authors": ["Authors:Zhiling Luo", "Xiaorong Shi", "Xuanrui Lin", "Jinyang Gao"], "categories": ["Information"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2504.11094", "pdf_url": "https://arxiv.org/pdf/2504.11094", "github_repo": "https://github.com/modelscope/MCPBench", "source": "github_org"}, {"id": "2504.11354", "date": "2025-04-15", "title": "Kimina-Prover Preview: Towards Large Formal Reasoning Models with Reinforcement Learning", "abstract": "We introduce Kimina-Prover Preview, a large language model that pioneers a novel reasoning-driven exploration paradigm for formal theorem proving, as showcased in this preview release. Trained with a large-scale reinforcement learning pipeline from Qwen2.5-72B, Kimina-Prover demonstrates strong performance in Lean 4 proof generation by employing a structured reasoning pattern we term \\textit{formal reasoning pattern}. This approach allows the model to emulate human problem-solving strategies in Lean, iteratively generating and refining proof steps. Kimina-Prover sets a new state-of-the-art on the miniF2F benchmark, reaching 80.7% with pass@8192. Beyond improved benchmark performance, our work yields several key insights: (1) Kimina-Prover exhibits high sample efficiency, delivering strong results even with minimal sampling (pass@1) and scaling effectively with computational budget, stemming from its unique reasoning pattern and RL training; (2) we demonstrate clear performance scaling with model size, a trend previously unobserved for neural theorem provers in formal mathematics; (3) the learned reasoning style, distinct from traditional search algorithms, shows potential to bridge the gap between formal verification and informal mathematical intuition. We open source distilled versions with 1.5B and 7B parameters of Kimina-Prover", "authors": ["Authors:Haiming Wang", "Mert Unsal", "Xiaohan Lin", "Mantas Baksys", "Junqi Liu"], "categories": ["Artificial"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2504.11354", "pdf_url": "https://arxiv.org/pdf/2504.11354", "github_repo": "https://github.com/MoonshotAI/Kimina-Prover-Preview", "source": "github_org"}, {"id": "2504.11409", "date": "2025-04-15", "title": "Minitron-SSM: Efficient Hybrid Language Model Compression through Group-Aware SSM Pruning", "abstract": "Hybrid LLM architectures that combine Attention and State Space Models (SSMs) achieve state-of-the-art accuracy and runtime performance. Recent work has demonstrated that applying compression and distillation to Attention-only models yields smaller, more accurate models at a fraction of the training cost. In this work, we explore the effectiveness of compressing Hybrid architectures. We introduce a novel group-aware pruning strategy that preserves the structural integrity of SSM blocks and their sequence modeling capabilities. Furthermore, we demonstrate the necessity of such SSM pruning to achieve improved accuracy and inference speed compared to traditional approaches. Our compression recipe combines SSM, FFN, embedding dimension, and layer pruning, followed by knowledge distillation-based retraining, similar to the MINITRON technique. Using this approach, we compress the Nemotron-H 8B Hybrid model down to 4B parameters with up to 40x fewer training tokens. The resulting model surpasses the accuracy of similarly-sized models while achieving 2x faster inference, significantly advancing the Pareto frontier.", "authors": ["Authors:Ali Taghibakhshi", "Sharath Turuvekere Sreenivas", "Saurav Muralidharan", "Marcin Chochowski", "Yashaswi Karnati"], "categories": ["Computation"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2504.11409", "pdf_url": "https://arxiv.org/pdf/2504.11409", "github_repo": "https://github.com/NVlabs/Minitron", "source": "github_org"}, {"id": "2504.10414", "date": "2025-04-14", "title": "HUMOTO: A 4D Dataset of Mocap Human Object Interactions", "abstract": "We present Human Motions with Objects (HUMOTO), a high-fidelity dataset of human-object interactions for motion generation, computer vision, and robotics applications. Featuring 735 sequences (7,875 seconds at 30 fps), HUMOTO captures interactions with 63 precisely modeled objects and 72 articulated parts. Our innovations include a scene-driven LLM scripting pipeline creating complete, purposeful tasks with natural progression, and a mocap-and-camera recording setup to effectively handle occlusions. Spanning diverse activities from cooking to outdoor picnics, HUMOTO preserves both physical accuracy and logical task flow. Professional artists rigorously clean and verify each sequence, minimizing foot sliding and object penetrations. We also provide benchmarks compared to other datasets. HUMOTO&#39;s comprehensive full-body motion and simultaneous multi-object interactions address key data-capturing challenges and provide opportunities to advance realistic human-object interaction modeling across research domains with practical applications in animation, robotics, and embodied AI systems. Project: this https URL .", "authors": ["Authors:Jiaxin Lu", "Chun-Hao Paul Huang", "Uttaran Bhattacharya", "Qixing Huang", "Yi Zhou"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2504.10414", "pdf_url": "https://arxiv.org/pdf/2504.10414", "github_repo": "https://github.com/adobe-research/humoto", "source": "github_org"}, {"id": "2504.10462", "date": "2025-04-14", "title": "The Scalability of Simplicity: Empirical Analysis of Vision-Language Learning with a Single Transformer", "abstract": "This paper introduces SAIL, a single transformer unified multimodal large language model (MLLM) that integrates raw pixel encoding and language decoding within a singular architecture. Unlike existing modular MLLMs, which rely on a pre-trained vision transformer (ViT), SAIL eliminates the need for a separate vision encoder, presenting a more minimalist architecture design. Instead of introducing novel architectural components, SAIL adapts mix-attention mechanisms and multimodal positional encodings to better align with the distinct characteristics of visual and textual modalities. We systematically compare SAIL&#39;s properties-including scalability, cross-modal information flow patterns, and visual representation capabilities-with those of modular MLLMs. By scaling both training data and model size, SAIL achieves performance comparable to modular MLLMs. Notably, the removal of pretrained ViT components enhances SAIL&#39;s scalability and results in significantly different cross-modal information flow patterns. Moreover, SAIL demonstrates strong visual representation capabilities, achieving results on par with ViT-22B in vision tasks such as semantic segmentation. Code and models are available at this https URL .", "authors": ["Authors:Weixian Lei", "Jiacong Wang", "Haochen Wang", "Xiangtai Li", "Jun Hao Liew"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2504.10462", "pdf_url": "https://arxiv.org/pdf/2504.10462", "github_repo": "https://github.com/bytedance-seed/SAIL", "source": "github_org"}, {"id": "2504.09014", "date": "2025-04-11", "title": "MSCCL++: Rethinking GPU Communication Abstractions for AI Inference", "abstract": "AI applications increasingly run on fast-evolving, heterogeneous hardware to maximize performance, but general-purpose libraries lag in supporting these features. Performance-minded programmers often build custom communication stacks that are fast but error-prone and non-portable. This paper introduces MSCCL++, a design methodology for developing high-performance, portable communication kernels. It provides (1) a low-level, performance-preserving primitive interface that exposes minimal hardware abstractions while hiding the complexities of synchronization and consistency, (2) a higher-level DSL for application developers to implement workload-specific communication algorithms, and (3) a library of efficient algorithms implementing the standard collective API, enabling adoption by users with minimal expertise. Compared to state-of-the-art baselines, MSCCL++ achieves geomean speedups of $1.7\\times$ (up to $5.4\\times$) for collective communication and $1.2\\times$ (up to $1.38\\times$) for AI inference workloads. MSCCL++ is in production of multiple AI services provided by Microsoft Azure, and has also been adopted by RCCL, the GPU collective communication library maintained by AMD. MSCCL++ is open source and available at this https URL . Our two years of experience with MSCCL++ suggests that its abstractions are robust, enabling support for new hardware features, such as multimem, within weeks of development.", "authors": ["Authors:Changho Hwang", "Peng Cheng", "Roshan Dathathri", "Abhinav Jangda", "Saeed Maleki"], "categories": ["Distributed,"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2504.09014", "pdf_url": "https://arxiv.org/pdf/2504.09014", "github_repo": "https://github.com/meituan-longcat/mscclpp", "source": "github_org"}, {"id": "2504.07491", "date": "2025-04-10", "title": "Kimi-VL Technical Report", "abstract": "We present Kimi-VL, an efficient open-source Mixture-of-Experts (MoE) vision-language model (VLM) that offers advanced multimodal reasoning, long-context understanding, and strong agent capabilities - all while activating only 2.8B parameters in its language decoder (Kimi-VL-A3B). Kimi-VL demonstrates strong performance across challenging domains: as a general-purpose VLM, Kimi-VL excels in multi-turn agent tasks (e.g., OSWorld), matching flagship models. Furthermore, it exhibits remarkable capabilities across diverse challenging vision language tasks, including college-level image and video comprehension, OCR, mathematical reasoning, and multi-image understanding. In comparative evaluations, it effectively competes with cutting-edge efficient VLMs such as GPT-4o-mini, Qwen2.5-VL-7B, and Gemma-3-12B-IT, while surpassing GPT-4o in several key domains. Kimi-VL also advances in processing long contexts and perceiving clearly. With a 128K extended context window, Kimi-VL can process diverse long inputs, achieving impressive scores of 64.5 on LongVideoBench and 35.1 on MMLongBench-Doc. Its native-resolution vision encoder, MoonViT, further allows it to see and understand ultra-high-resolution visual inputs, achieving 83.2 on InfoVQA and 34.5 on ScreenSpot-Pro, while maintaining lower computational cost for common tasks. Building upon Kimi-VL, we introduce an advanced long-thinking variant: Kimi-VL-Thinking-2506. Developed through long chain-of-thought (CoT) supervised fine-tuning (SFT) and reinforcement learning (RL), the latest model exhibits strong long-horizon reasoning capabilities (64.0 on MMMU, 46.3 on MMMU-Pro, 56.9 on MathVision, 80.1 on MathVista, 65.2 on VideoMMMU) while obtaining robust general abilities. Code and models are publicly accessible at this https URL .", "authors": ["Authors:Kimi Team: Angang Du", "Bohong Yin", "Bowei Xing", "Bowen Qu", "Bowen Wang"], "categories": ["Computer"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2504.07491", "pdf_url": "https://arxiv.org/pdf/2504.07491", "github_repo": "https://github.com/MoonshotAI/Kimi-VL", "source": "github_org"}, {"id": "2504.06958", "date": "2025-04-09", "title": "VideoChat-R1: Enhancing Spatio-Temporal Perception via Reinforcement Fine-Tuning", "abstract": "Reinforcement Learning (RL) benefits Large Language Models (LLMs) for complex reasoning. Inspired by this, we explore integrating spatio-temporal specific rewards into Multimodal Large Language Models (MLLMs) to address the unique challenges of video understanding, such as long-range temporal associations. This paper investigates how rule-based rewards, particularly temporal ones, can improve video reasoning and their generalizability. Our study proposes Reinforcement Fine-Tuning (RFT) as a data-efficient method to enhance video reasoning on specific tasks without sacrificing original capabilities. Through joint RFT on multiple spatio-temporal perception tasks, we developed VideoChat-R1, a powerful Video MLLM. VideoChat-R1 achieves state-of-the-art spatio-temporal perception, demonstrating significant improvements in tasks like temporal grounding (+31.8) and object tracking (+31.2), while also improving general QA benchmarks. The enhanced perception and preserved chat abilities contribute to a more reliable video dialogue system, leading to our ``Temporal Clue-driven Reasoning&#34; inference schema. This work provides a foundation for developing robust, real-world video comprehension agents.", "authors": ["Authors:Xinhao Li", "Ziang Yan", "Desen Meng", "Lu Dong", "Xiangyu Zeng"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2504.06958", "pdf_url": "https://arxiv.org/pdf/2504.06958", "github_repo": "https://github.com/OpenGVLab/VideoChat-R1", "source": "github_org"}, {"id": "2504.03970", "date": "2025-04-08", "title": "VideoComp: Advancing Fine-Grained Compositional and Temporal Alignment in Video-Text Models", "abstract": "We introduce VideoComp, a benchmark and learning framework for advancing\nvideo-text compositionality understanding, aimed at improving vision-language\nmodels (VLMs) in fine-grained temporal alignment. Unlike existing benchmarks\nfocused on static image-text compositionality or isolated single-event videos,\nour benchmark targets alignment in continuous multi-event videos. Leveraging\nvideo-text datasets with temporally localized event captions (e.g.\nActivityNet-Captions, YouCook2), we construct two compositional benchmarks,\nActivityNet-Comp and YouCook2-Comp. We create challenging negative samples with\nsubtle temporal disruptions such as reordering, action word replacement,\npartial captioning, and combined disruptions. These benchmarks comprehensively\ntest models' compositional sensitivity across extended, cohesive video-text\nsequences. To improve model performance, we propose a hierarchical pairwise\npreference loss that strengthens alignment with temporally accurate pairs and\ngradually penalizes increasingly disrupted ones, encouraging fine-grained\ncompositional learning. To mitigate the limited availability of densely\nannotated video data, we introduce a pretraining strategy that concatenates\nshort video-caption pairs to simulate multi-event sequences. We evaluate\nvideo-text foundational models and large multimodal models (LMMs) on our\nbenchmark, identifying both strengths and areas for improvement in\ncompositionality. Overall, our work provides a comprehensive framework for\nevaluating and enhancing model capabilities in achieving fine-grained,\ntemporally coherent video-text alignment.", "authors": ["Dahun Kim", "AJ Piergiovanni", "Ganesh Mallya", "Anelia Angelova"], "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.IR"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2504.03970", "pdf_url": "https://arxiv.org/pdf/2504.03970", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.03219", "date": "2025-04-07", "title": "From ChatGPT to DeepSeek AI: A Comprehensive Analysis of Evolution, Deviation, and Future Implications in AI-Language Models", "abstract": "The rapid advancement of artificial intelligence (AI) has reshaped the field\nof natural language processing (NLP), with models like OpenAI ChatGPT and\nDeepSeek AI. Although ChatGPT established a strong foundation for\nconversational AI, DeepSeek AI introduces significant improvements in\narchitecture, performance, and ethical considerations. This paper presents a\ndetailed analysis of the evolution from ChatGPT to DeepSeek AI, highlighting\ntheir technical differences, practical applications, and broader implications\nfor AI development. To assess their capabilities, we conducted a case study\nusing a predefined set of multiple choice questions in various domains,\nevaluating the strengths and limitations of each model. By examining these\naspects, we provide valuable insight into the future trajectory of AI, its\npotential to transform industries, and key research directions for improving\nAI-driven language models.", "authors": ["Simrandeep Singh", "Shreya Bansal", "Abdulmotaleb El Saddik", "Mukesh Saini"], "categories": ["cs.CV"], "companies": ["DeepSeek"], "abs_url": "https://arxiv.org/abs/2504.03219", "pdf_url": "https://arxiv.org/pdf/2504.03219", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.02160", "date": "2025-04-04", "title": "Less-to-More Generalization: Unlocking More Controllability by In-Context Generation", "abstract": "Although subject-driven generation has been extensively explored in image\ngeneration due to its wide applications, it still has challenges in data\nscalability and subject expansibility. For the first challenge, moving from\ncurating single-subject datasets to multiple-subject ones and scaling them is\nparticularly difficult. For the second, most recent methods center on\nsingle-subject generation, making it hard to apply when dealing with\nmulti-subject scenarios. In this study, we propose a highly-consistent data\nsynthesis pipeline to tackle this challenge. This pipeline harnesses the\nintrinsic in-context generation capabilities of diffusion transformers and\ngenerates high-consistency multi-subject paired data. Additionally, we\nintroduce UNO, which consists of progressive cross-modal alignment and\nuniversal rotary position embedding. It is a multi-image conditioned\nsubject-to-image model iteratively trained from a text-to-image model.\nExtensive experiments show that our method can achieve high consistency while\nensuring controllability in both single-subject and multi-subject driven\ngeneration.", "authors": ["Shaojin Wu", "Mengqi Huang", "Wenxu Wu", "Yufeng Cheng", "Fei Ding"], "categories": ["cs.CV", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2504.02160", "pdf_url": "https://arxiv.org/pdf/2504.02160", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.02107", "date": "2025-04-04", "title": "TiC-LM: A Web-Scale Benchmark for Time-Continual LLM Pretraining", "abstract": "Large Language Models (LLMs) trained on historical web data inevitably become\noutdated. We investigate evaluation strategies and update methods for LLMs as\nnew data becomes available. We introduce a web-scale dataset for time-continual\npretraining of LLMs derived from 114 dumps of Common Crawl (CC) - orders of\nmagnitude larger than previous continual language modeling benchmarks. We also\ndesign time-stratified evaluations across both general CC data and specific\ndomains (Wikipedia, StackExchange, and code documentation) to assess how well\nvarious continual learning methods adapt to new data while retaining past\nknowledge. Our findings demonstrate that, on general CC data, autoregressive\nmeta-schedules combined with a fixed-ratio replay of older data can achieve\ncomparable held-out loss to re-training from scratch, while requiring\nsignificantly less computation (2.6x). However, the optimal balance between\nincorporating new data and replaying old data differs as replay is crucial to\navoid forgetting on generic web data but less so on specific domains.", "authors": ["Jeffrey Li", "Mohammadreza Armandpour", "Iman Mirzadeh", "Sachin Mehta", "Vaishaal Shankar"], "categories": ["cs.LG", "cs.CL"], "companies": ["Apple"], "abs_url": "https://arxiv.org/abs/2504.02107", "pdf_url": "https://arxiv.org/pdf/2504.02107", "github_repo": "", "source": "daily_arxiv"}, {"id": "2503.24376", "date": "2025-04-01", "title": "Exploring the Effect of Reinforcement Learning on Video Understanding: Insights from SEED-Bench-R1", "abstract": "Recent advancements in Chain of Thought (COT) generation have significantly\nimproved the reasoning capabilities of Large Language Models (LLMs), with\nreinforcement learning (RL) emerging as an effective post-training approach.\nMultimodal Large Language Models (MLLMs) inherit this reasoning potential but\nremain underexplored in tasks requiring both perception and logical reasoning.\nTo address this, we introduce SEED-Bench-R1, a benchmark designed to\nsystematically evaluate post-training methods for MLLMs in video understanding.\nIt includes intricate real-world videos and complex everyday planning tasks in\nthe format of multiple-choice questions, requiring sophisticated perception and\nreasoning. SEED-Bench-R1 assesses generalization through a three-level\nhierarchy: in-distribution, cross-environment, and cross-environment-task\nscenarios, equipped with a large-scale training dataset with easily verifiable\nground-truth answers. Using Qwen2-VL-Instruct-7B as a base model, we compare RL\nwith supervised fine-tuning (SFT), demonstrating RL's data efficiency and\nsuperior performance on both in-distribution and out-of-distribution tasks,\neven outperforming SFT on general video understanding benchmarks like\nLongVideoBench. Our detailed analysis reveals that RL enhances visual\nperception but often produces less logically coherent reasoning chains. We\nidentify key limitations such as inconsistent reasoning and overlooked visual\ncues, and suggest future improvements in base model reasoning, reward modeling,\nand RL robustness against noisy signals.", "authors": ["Yi Chen", "Yuying Ge", "Rui Wang", "Yixiao Ge", "Lu Qiu"], "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2503.24376", "pdf_url": "https://arxiv.org/pdf/2503.24376", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.01014", "date": "2025-04-01", "title": "AnimeGamer: Infinite Anime Life Simulation with Next Game State Prediction", "abstract": "Recent advancements in image and video synthesis have opened up new promise in generative games. One particularly intriguing application is transforming characters from anime films into interactive, playable entities. This allows players to immerse themselves in the dynamic anime world as their favorite characters for life simulation through language instructions. Such games are defined as infinite game since they eliminate predetermined boundaries and fixed gameplay rules, where players can interact with the game world through open-ended language and experience ever-evolving storylines and environments. Recently, a pioneering approach for infinite anime life simulation employs large language models (LLMs) to translate multi-turn text dialogues into language instructions for image generation. However, it neglects historical visual context, leading to inconsistent gameplay. Furthermore, it only generates static images, failing to incorporate the dynamics necessary for an engaging gaming experience. In this work, we propose AnimeGamer, which is built upon Multimodal Large Language Models (MLLMs) to generate each game state, including dynamic animation shots that depict character movements and updates to character states, as illustrated in Figure 1. We introduce novel action-aware multimodal representations to represent animation shots, which can be decoded into high-quality video clips using a video diffusion model. By taking historical animation shot representations as context and predicting subsequent representations, AnimeGamer can generate games with contextual consistency and satisfactory dynamics. Extensive evaluations using both automated metrics and human evaluations demonstrate that AnimeGamer outperforms existing methods in various aspects of the gaming experience. Codes and checkpoints are available at this https URL .", "authors": ["Authors:Junhao Cheng", "Yuying Ge", "Yixiao Ge", "Jing Liao", "Ying Shan"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2504.01014", "pdf_url": "https://arxiv.org/pdf/2504.01014", "github_repo": "https://github.com/TencentARC/AnimeGamer", "source": "github_org"}, {"id": "2504.01016", "date": "2025-04-01", "title": "GeometryCrafter: Consistent Geometry Estimation for Open-world Videos with Diffusion Priors", "abstract": "Despite remarkable advancements in video depth estimation, existing methods exhibit inherent limitations in achieving geometric fidelity through the affine-invariant predictions, limiting their applicability in reconstruction and other metrically grounded downstream tasks. We propose GeometryCrafter, a novel framework that recovers high-fidelity point map sequences with temporal coherence from open-world videos, enabling accurate 3D/4D reconstruction, camera parameter estimation, and other depth-based applications. At the core of our approach lies a point map Variational Autoencoder (VAE) that learns a latent space agnostic to video latent distributions for effective point map encoding and decoding. Leveraging the VAE, we train a video diffusion model to model the distribution of point map sequences conditioned on the input videos. Extensive evaluations on diverse datasets demonstrate that GeometryCrafter achieves state-of-the-art 3D accuracy, temporal consistency, and generalization capability.", "authors": ["Authors:Tian-Xing Xu", "Xiangjun Gao", "Wenbo Hu", "Xiaoyu Li", "Song-Hai Zhang"], "categories": ["Graphics"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2504.01016", "pdf_url": "https://arxiv.org/pdf/2504.01016", "github_repo": "https://github.com/TencentARC/GeometryCrafter", "source": "github_org"}, {"id": "2503.22674", "date": "2025-03-31", "title": "QuestBench: Can LLMs ask the right question to acquire information in reasoning tasks?", "abstract": "Recently, a large amount of work has focused on improving large language\nmodels' (LLMs') performance on reasoning benchmarks such as math and logic.\nHowever, past work has largely assumed that tasks are well-defined. In the real\nworld, queries to LLMs are often underspecified, only solvable through\nacquiring missing information. We formalize this as a constraint satisfaction\nproblem (CSP) with missing variable assignments. Using a special case of this\nformalism where only one necessary variable assignment is missing, we can\nrigorously evaluate an LLM's ability to identify the minimal necessary question\nto ask and quantify axes of difficulty levels for each problem. We present\nQuestBench, a set of underspecified reasoning tasks solvable by asking at most\none question, which includes: (1) Logic-Q: Logical reasoning tasks with one\nmissing proposition, (2) Planning-Q: PDDL planning problems with initial states\nthat are partially-observed, (3) GSM-Q: Human-annotated grade school math\nproblems with one missing variable assignment, and (4) GSME-Q: a version of\nGSM-Q where word problems are translated into equations by human annotators.\nThe LLM is tasked with selecting the correct clarification question(s) from a\nlist of options. While state-of-the-art models excel at GSM-Q and GSME-Q, their\naccuracy is only 40-50% on Logic-Q and Planning-Q. Analysis demonstrates that\nthe ability to solve well-specified reasoning problems may not be sufficient\nfor success on our benchmark: models have difficulty identifying the right\nquestion to ask, even when they can solve the fully specified version of the\nproblem. Furthermore, in the Planning-Q domain, LLMs tend not to hedge, even\nwhen explicitly presented with the option to predict ``not sure.'' This\nhighlights the need for deeper investigation into models' information\nacquisition capabilities.", "authors": ["Belinda Z. Li", "Been Kim", "Zi Wang"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2503.22674", "pdf_url": "https://arxiv.org/pdf/2503.22674", "github_repo": "", "source": "daily_arxiv"}, {"id": "2503.20215", "date": "2025-03-26", "title": "Qwen2.5-Omni Technical Report", "abstract": "In this report, we present Qwen2.5-Omni, an end-to-end multimodal model designed to perceive diverse modalities, including text, images, audio, and video, while simultaneously generating text and natural speech responses in a streaming manner. To enable the streaming of multimodal information inputs, both audio and visual encoders utilize a block-wise processing approach. To synchronize the timestamps of video inputs with audio, we organize the audio and video sequentially in an interleaved manner and propose a novel position embedding approach, named TMRoPE(Time-aligned Multimodal RoPE). To concurrently generate text and speech while avoiding interference between the two modalities, we propose \\textbf{Thinker-Talker} architecture. In this framework, Thinker functions as a large language model tasked with text generation, while Talker is a dual-track autoregressive model that directly utilizes the hidden representations from the Thinker to produce audio tokens as output. Both the Thinker and Talker models are designed to be trained and inferred in an end-to-end manner. For decoding audio tokens in a streaming manner, we introduce a sliding-window DiT that restricts the receptive field, aiming to reduce the initial package delay. Qwen2.5-Omni is comparable with the similarly sized Qwen2.5-VL and outperforms Qwen2-Audio. Furthermore, Qwen2.5-Omni achieves state-of-the-art performance on multimodal benchmarks like Omni-Bench. Notably, Qwen2.5-Omni&#39;s performance in end-to-end speech instruction following is comparable to its capabilities with text inputs, as evidenced by benchmarks such as MMLU and GSM8K. As for speech generation, Qwen2.5-Omni&#39;s streaming Talker outperforms most existing streaming and non-streaming alternatives in robustness and naturalness.", "authors": ["Authors:Jin Xu", "Zhifang Guo", "Jinzheng He", "Hangrui Hu", "Ting He"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2503.20215", "pdf_url": "https://arxiv.org/pdf/2503.20215", "github_repo": "https://github.com/QwenLM/Qwen2.5-Omni", "source": "github_org"}, {"id": "2503.16983", "date": "2025-03-24", "title": "Enabling Versatile Controls for Video Diffusion Models", "abstract": "Despite substantial progress in text-to-video generation, achieving precise\nand flexible control over fine-grained spatiotemporal attributes remains a\nsignificant unresolved challenge in video generation research. To address these\nlimitations, we introduce VCtrl (also termed PP-VCtrl), a novel framework\ndesigned to enable fine-grained control over pre-trained video diffusion models\nin a unified manner. VCtrl integrates diverse user-specified control\nsignals-such as Canny edges, segmentation masks, and human keypoints-into\npretrained video diffusion models via a generalizable conditional module\ncapable of uniformly encoding multiple types of auxiliary signals without\nmodifying the underlying generator. Additionally, we design a unified control\nsignal encoding pipeline and a sparse residual connection mechanism to\nefficiently incorporate control representations. Comprehensive experiments and\nhuman evaluations demonstrate that VCtrl effectively enhances controllability\nand generation quality. The source code and pre-trained models are publicly\navailable and implemented using the PaddlePaddle framework at\nhttp://github.com/PaddlePaddle/PaddleMIX/tree/develop/ppdiffusers/examples/ppvctrl.", "authors": ["Xu Zhang", "Hao Zhou", "Haoming Qin", "Xiaobin Lu", "Jiaxing Yan"], "categories": ["cs.CV", "cs.AI"], "companies": ["Baidu"], "abs_url": "https://arxiv.org/abs/2503.16983", "pdf_url": "https://arxiv.org/pdf/2503.16983", "github_repo": "", "source": "daily_arxiv"}, {"id": "2503.17213", "date": "2025-03-24", "title": "PP-DocLayout: A Unified Document Layout Detection Model to Accelerate Large-Scale Data Construction", "abstract": "Document layout analysis is a critical preprocessing step in document\nintelligence, enabling the detection and localization of structural elements\nsuch as titles, text blocks, tables, and formulas. Despite its importance,\nexisting layout detection models face significant challenges in generalizing\nacross diverse document types, handling complex layouts, and achieving\nreal-time performance for large-scale data processing. To address these\nlimitations, we present PP-DocLayout, which achieves high precision and\nefficiency in recognizing 23 types of layout regions across diverse document\nformats. To meet different needs, we offer three models of varying scales.\nPP-DocLayout-L is a high-precision model based on the RT-DETR-L detector,\nachieving 90.4% mAP@0.5 and an end-to-end inference time of 13.4 ms per page on\na T4 GPU. PP-DocLayout-M is a balanced model, offering 75.2% mAP@0.5 with an\ninference time of 12.7 ms per page on a T4 GPU. PP-DocLayout-S is a\nhigh-efficiency model designed for resource-constrained environments and\nreal-time applications, with an inference time of 8.1 ms per page on a T4 GPU\nand 14.5 ms on a CPU. This work not only advances the state of the art in\ndocument layout analysis but also provides a robust solution for constructing\nhigh-quality training data, enabling advancements in document intelligence and\nmultimodal AI systems. Code and models are available at\nhttps://github.com/PaddlePaddle/PaddleX .", "authors": ["Ting Sun", "Cheng Cui", "Yuning Du", "Yi Liu"], "categories": ["cs.CV", "cs.AI"], "companies": ["Baidu"], "abs_url": "https://arxiv.org/abs/2503.17213", "pdf_url": "https://arxiv.org/pdf/2503.17213", "github_repo": "", "source": "daily_arxiv"}, {"id": "2503.16418", "date": "2025-03-21", "title": "InfiniteYou: Flexible Photo Recrafting While Preserving Your Identity", "abstract": "Achieving flexible and high-fidelity identity-preserved image generation\nremains formidable, particularly with advanced Diffusion Transformers (DiTs)\nlike FLUX. We introduce InfiniteYou (InfU), one of the earliest robust\nframeworks leveraging DiTs for this task. InfU addresses significant issues of\nexisting methods, such as insufficient identity similarity, poor text-image\nalignment, and low generation quality and aesthetics. Central to InfU is\nInfuseNet, a component that injects identity features into the DiT base model\nvia residual connections, enhancing identity similarity while maintaining\ngeneration capabilities. A multi-stage training strategy, including pretraining\nand supervised fine-tuning (SFT) with synthetic single-person-multiple-sample\n(SPMS) data, further improves text-image alignment, ameliorates image quality,\nand alleviates face copy-pasting. Extensive experiments demonstrate that InfU\nachieves state-of-the-art performance, surpassing existing baselines. In\naddition, the plug-and-play design of InfU ensures compatibility with various\nexisting methods, offering a valuable contribution to the broader community.", "authors": ["Liming Jiang", "Qing Yan", "Yumin Jia", "Zichuan Liu", "Hao Kang"], "categories": ["cs.CV", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2503.16418", "pdf_url": "https://arxiv.org/pdf/2503.16418", "github_repo": "", "source": "daily_arxiv"}, {"id": "2503.14237", "date": "2025-03-18", "title": "Make Your Training Flexible: Towards Deployment-Efficient Video Models", "abstract": "Popular video training methods mainly operate on a fixed number of tokens sampled from a predetermined spatiotemporal grid, resulting in sub-optimal accuracy-computation trade-offs due to inherent video redundancy. They also lack adaptability to varying computational budgets for downstream tasks, hindering applications of the most competitive model in real-world scenes. We thus propose a new test setting, Token Optimization, for maximized input information across budgets, which optimizes the size-limited set of input tokens through token selection from more suitably sampled videos. To this end, we propose a novel augmentation tool termed Flux. By making the sampling grid flexible and leveraging token selection, it is easily adopted in most popular video training frameworks, boosting model robustness with nearly no additional cost. We integrate Flux in large-scale video pre-training, and the resulting FluxViT establishes new state-of-the-art results across extensive tasks at standard costs. Notably, with 1/4 tokens only, it can still match the performance of previous state-of-the-art models with Token Optimization, yielding nearly 90\\% savings. All models and data are available at this https URL .", "authors": ["Authors:Chenting Wang", "Kunchang Li", "Tianxiang Jiang", "Xiangyu Zeng", "Yi Wang"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2503.14237", "pdf_url": "https://arxiv.org/pdf/2503.14237", "github_repo": "https://github.com/OpenGVLab/FluxViT", "source": "github_org"}, {"id": "2503.14494", "date": "2025-03-18", "title": "Deeply Supervised Flow-Based Generative Models", "abstract": "Flow based generative models have charted an impressive path across multiple visual generation tasks by adhering to a simple principle: learning velocity representations of a linear interpolant. However, we observe that training velocity solely from the final layer output underutilizes the rich inter layer representations, potentially impeding model convergence. To address this limitation, we introduce DeepFlow, a novel framework that enhances velocity representation through inter layer communication. DeepFlow partitions transformer layers into balanced branches with deep supervision and inserts a lightweight Velocity Refiner with Acceleration (VeRA) block between adjacent branches, which aligns the intermediate velocity features within transformer blocks. Powered by the improved deep supervision via the internal velocity alignment, DeepFlow converges 8 times faster on ImageNet with equivalent performance and further reduces FID by 2.6 while halving training time compared to previous flow based models without a classifier free guidance. DeepFlow also outperforms baselines in text to image generation tasks, as evidenced by evaluations on MSCOCO and zero shot GenEval.", "authors": ["Authors:Inkyu Shin", "Chenglin Yang", "Liang-Chieh Chen"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2503.14494", "pdf_url": "https://arxiv.org/pdf/2503.14494", "github_repo": "https://github.com/bytedance-seed/DeepFlow", "source": "github_org"}, {"id": "2503.14734", "date": "2025-03-18", "title": "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots", "abstract": "General-purpose robots need a versatile body and an intelligent mind. Recent advancements in humanoid robots have shown great promise as a hardware platform for building generalist autonomy in the human world. A robot foundation model, trained on massive and diverse data sources, is essential for enabling the robots to reason about novel situations, robustly handle real-world variability, and rapidly learn new tasks. To this end, we introduce GR00T N1, an open foundation model for humanoid robots. GR00T N1 is a Vision-Language-Action (VLA) model with a dual-system architecture. The vision-language module (System 2) interprets the environment through vision and language instructions. The subsequent diffusion transformer module (System 1) generates fluid motor actions in real time. Both modules are tightly coupled and jointly trained end-to-end. We train GR00T N1 with a heterogeneous mixture of real-robot trajectories, human videos, and synthetically generated datasets. We show that our generalist robot model GR00T N1 outperforms the state-of-the-art imitation learning baselines on standard simulation benchmarks across multiple robot embodiments. Furthermore, we deploy our model on the Fourier GR-1 humanoid robot for language-conditioned bimanual manipulation tasks, achieving strong performance with high data efficiency.", "authors": ["Authors:NVIDIA: Johan Bjorck", "Fernando Castañeda", "Nikita Cherniadev", "Xingye Da", "Runyu Ding"], "categories": ["Robotics"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2503.14734", "pdf_url": "https://arxiv.org/pdf/2503.14734", "github_repo": "https://github.com/NVlabs/Eagle", "source": "github_org"}];
const COMPANIES = [{"name": "ByteDance", "count": 47}, {"name": "Shanghai AI Lab", "count": 40}, {"name": "Alibaba", "count": 30}, {"name": "Tencent", "count": 30}, {"name": "Meituan", "count": 26}, {"name": "Meta", "count": 18}, {"name": "NVIDIA", "count": 16}, {"name": "Stepfun", "count": 15}, {"name": "Adobe", "count": 15}, {"name": "Microsoft", "count": 14}, {"name": "Zhipu", "count": 12}, {"name": "Google", "count": 9}, {"name": "Kuaishou", "count": 8}, {"name": "Moonshot", "count": 8}, {"name": "Allen AI", "count": 7}, {"name": "MiniMax", "count": 6}, {"name": "SenseTime", "count": 6}, {"name": "IBM", "count": 5}, {"name": "Baidu", "count": 4}, {"name": "OpenAI", "count": 4}, {"name": "DeepSeek", "count": 4}, {"name": "Amazon", "count": 4}, {"name": "Apple", "count": 3}, {"name": "Huawei", "count": 1}];
const COLORS = {"ByteDance": "#ee334a", "Shanghai AI Lab": "#0891B2", "Alibaba": "#FF6600", "Tencent": "#0066CC", "Meituan": "#F5A623", "Meta": "#0668E1", "NVIDIA": "#76B900", "Stepfun": "#10B981", "Adobe": "#FF0000", "Microsoft": "#00BCF2", "Zhipu": "#6C47FF", "Google": "#4285F4", "Kuaishou": "#FF4400", "Moonshot": "#FF8C00", "Allen AI": "#E55C30", "MiniMax": "#7C3AED", "SenseTime": "#00A6D6", "IBM": "#0062FF", "Baidu": "#2932E1", "OpenAI": "#10a37f", "DeepSeek": "#1A6EFF", "Amazon": "#FF9900", "Apple": "#555", "Huawei": "#CF0A2C"};

let selCo = new Set();
let srcFilter = 'all';

function buildSidebar() {
  const c = document.getElementById('co-chips');
  COMPANIES.forEach(function(item) {
    const col = COLORS[item.name] || '#6b7280';
    const el = document.createElement('span');
    el.className = 'chip on';
    el.dataset.co = item.name;
    el.style.background = col;
    el.style.borderColor = col;
    el.style.color = '#fff';
    el.textContent = item.name + ' (' + item.count + ')';
    el.addEventListener('click', function() { togCo(item.name); });
    c.appendChild(el);
  });

  document.getElementById('src-chips').addEventListener('click', function(e) {
    const chip = e.target.closest('[data-src]');
    if (!chip) return;
    srcFilter = chip.dataset.src;
    document.querySelectorAll('[data-src]').forEach(function(el) { el.classList.remove('on'); });
    chip.classList.add('on');
    render();
  });
}

function togCo(val) {
  if (selCo.size === 1 && selCo.has(val)) { selCo.clear(); }
  else { selCo.clear(); selCo.add(val); }
  syncCoChips();
  render();
}

function syncCoChips() {
  document.querySelectorAll('#co-chips .chip').forEach(function(el) {
    const on = selCo.size === 0 || selCo.has(el.dataset.co);
    el.classList.toggle('on', on);
    const col = COLORS[el.dataset.co] || '#6b7280';
    if (on) { el.style.background = col; el.style.borderColor = col; el.style.color = '#fff'; }
    else { el.style.background = '#fff'; el.style.borderColor = '#d1d5db'; el.style.color = '#374151'; }
  });
  document.getElementById('co-reset-btn').style.display = selCo.size ? 'inline' : 'none';
}

function resetCo() { selCo.clear(); syncCoChips(); render(); }

function getFiltered() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  return PAPERS.filter(function(p) {
    if (selCo.size > 0 && !p.companies.some(function(c) { return selCo.has(c); })) return false;
    if (srcFilter !== 'all' && p.source !== srcFilter) return false;
    if (q) {
      const hay = (p.title + ' ' + p.abstract + ' ' + p.authors.join(' ')).toLowerCase();
      if (!q.split(' ').every(function(w) { return hay.includes(w); })) return false;
    }
    return true;
  });
}

function h(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function render() {
  const sort = document.getElementById('sort-sel').value;
  let data = getFiltered();
  if (sort === 'date') data.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
  else if (sort === 'company') data.sort(function(a, b) { return (a.companies[0] || '').localeCompare(b.companies[0] || ''); });
  else data.sort(function(a, b) { return a.title.localeCompare(b.title); });

  document.getElementById('cnt').textContent = '共 ' + data.length + ' 篇';
  const list = document.getElementById('paper-list');

  if (!data.length) { list.innerHTML = '<div class="empty">没有匹配的论文</div>'; return; }

  list.innerHTML = '';
  data.forEach(function(p, idx) {
    const mainCo = p.companies[0] || '';
    const coCol = COLORS[mainCo] || '#6b7280';

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;
    card.style.borderLeftColor = coCol;

    const coTags = p.companies.map(function(c) {
      const col = COLORS[c] || '#6b7280';
      return '<span class="tag tag-co" style="background:' + col + '">' + h(c) + '</span>';
    }).join('');
    const catTags = p.categories.slice(0, 3).map(function(c) {
      return '<span class="tag tag-cat">' + h(c) + '</span>';
    }).join('');
    const dateTag = p.date ? '<span class="tag tag-date">' + h(p.date) + '</span>' : '';
    const ghTag = p.github_repo ? '<span class="tag tag-gh">GitHub</span>' : '';
    const srcBadge = p.source === 'github_org'
      ? '<span class="source-badge">via GitHub Org</span>'
      : '<span class="source-badge">via daily-arXiv</span>';
    const authorsHtml = p.authors.length
      ? '<div class="authors">' + h(p.authors.slice(0, 4).join(', ')) + (p.authors.length > 4 ? ' …' : '') + '</div>'
      : '';
    const ghLink = p.github_repo
      ? '<a class="link-btn" style="background:#15803d" href="' + h(p.github_repo) + '" target="_blank">GitHub</a>'
      : '';

    card.innerHTML =
      '<div class="card-header">'
      + '<div class="card-title">' + h(p.title) + '</div>'
      + '<div class="card-meta">' + coTags + catTags + dateTag + ghTag + srcBadge + '</div>'
      + '</div>'
      + '<div class="card-body">'
      + '<div class="abstract">' + h(p.abstract) + '</div>'
      + authorsHtml
      + '<div class="link-row">'
      + '<a class="link-btn" style="background:#1e3a5f" href="' + h(p.abs_url) + '" target="_blank">arXiv</a>'
      + '<a class="link-btn" style="background:#6b7280" href="' + h(p.pdf_url) + '" target="_blank">PDF</a>'
      + ghLink
      + '</div>'
      + '</div>';

    card.querySelector('.card-header').addEventListener('click', function() {
      card.classList.toggle('expanded');
    });

    list.appendChild(card);
  });
}

buildSidebar();
render();
</script>
</body>
</html>
