frameworks typically entangle model definition with parallel logic, incurring limited scalability and substantial engineering overhead for end-to-end omni-modal training. We present VeOmni, a modular and efficient training framework to accelerate the development of omni-modal LLMs. VeOmni introduces model-centric distributed recipes that decouples communication from computation, enabling efficient 3D parallelism on omni-modal LLMs. VeOmni also features a flexible configuration interface supporting seamless integration of new modalities with minimal code change. Using VeOmni, a omni-modal mixture-of-experts (MoE) model with 30B parameters can be trained with over 2,800 tokens/sec/GPU throughput and scale to 160K context lengths via 3D parallelism on 128 GPUs, showcasing its superior efficiency and scalability for training large omni-modal LLMs.", "authors": ["Authors:Qianli Ma", "Yaowei Zheng", "Zhelun Shi", "Zhongkai Zhao", "Bin Jia"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.02317", "pdf_url": "https://arxiv.org/pdf/2508.02317", "github_repo": "https://github.com/bytedance-seed/VeOmni", "source": "github_org"}, {"id": "2508.01464", "date": "2025-08-02", "title": "Can3Tok: Canonical 3D Tokenization and Latent Modeling of Scene-Level 3D Gaussians", "abstract": "3D generation has made significant progress, however, it still largely remains at the object-level. Feedforward 3D scene-level generation has been rarely explored due to the lack of models capable of scaling-up latent representation learning on 3D scene-level data. Unlike object-level generative models, which are trained on well-labeled 3D data in a bounded canonical space, scene-level generations with 3D scenes represented by 3D Gaussian Splatting (3DGS) are unbounded and exhibit scale inconsistency across different scenes, making unified latent representation learning for generative purposes extremely challenging. In this paper, we introduce Can3Tok, the first 3D scene-level variational autoencoder (VAE) capable of encoding a large number of Gaussian primitives into a low-dimensional latent embedding, which effectively captures both semantic and spatial information of the inputs. Beyond model design, we propose a general pipeline for 3D scene data processing to address scale inconsistency issue. We validate our method on the recent scene-level 3D dataset DL3DV-10K, where we found that only Can3Tok successfully generalizes to novel 3D scenes, while compared methods fail to converge on even a few hundred scene inputs during training and exhibit zero generalization ability during inference. Finally, we demonstrate image-to-3DGS and text-to-3DGS generation as our applications to demonstrate its ability to facilitate downstream generation tasks.", "authors": ["Authors:Quankai Gao", "Iliyan Georgiev", "Tuanfeng Y. Wang", "Krishna Kumar Singh", "Ulrich Neumann"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2508.01464", "pdf_url": "https://arxiv.org/pdf/2508.01464", "github_repo": "https://github.com/adobe-research/Can3Tok", "source": "github_org"}, {"id": "2507.23143", "date": "2025-08-01", "title": "X-NeMo: Expressive Neural Motion Reenactment via Disentangled Latent Attention", "abstract": "We propose X-NeMo, a novel zero-shot diffusion-based portrait animation\npipeline that animates a static portrait using facial movements from a driving\nvideo of a different individual. Our work first identifies the root causes of\nthe key issues in prior approaches, such as identity leakage and difficulty in\ncapturing subtle and extreme expressions. To address these challenges, we\nintroduce a fully end-to-end training framework that distills a 1D\nidentity-agnostic latent motion descriptor from driving image, effectively\ncontrolling motion through cross-attention during image generation. Our\nimplicit motion descriptor captures expressive facial motion in fine detail,\nlearned end-to-end from a diverse video dataset without reliance on pretrained\nmotion detectors. We further enhance expressiveness and disentangle motion\nlatents from identity cues by supervising their learning with a dual GAN\ndecoder, alongside spatial and color augmentations. By embedding the driving\nmotion into a 1D latent vector and controlling motion via cross-attention\nrather than additive spatial guidance, our design eliminates the transmission\nof spatial-aligned structural clues from the driving condition to the diffusion\nbackbone, substantially mitigating identity leakage. Extensive experiments\ndemonstrate that X-NeMo surpasses state-of-the-art baselines, producing highly\nexpressive animations with superior identity resemblance. Our code and models\nare available for research.", "authors": ["Xiaochen Zhao", "Hongyi Xu", "Guoxian Song", "You Xie", "Chenxu Zhang"], "categories": ["cs.CV"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2507.23143", "pdf_url": "https://arxiv.org/pdf/2507.23143", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.00414", "date": "2025-08-01", "title": "Cognitive Kernel-Pro: A Framework for Deep Research Agents and Agent Foundation Models Training", "abstract": "General AI Agents are increasingly recognized as foundational frameworks for the next generation of artificial intelligence, enabling complex reasoning, web interaction, coding, and autonomous research capabilities. However, current agent systems are either closed-source or heavily reliant on a variety of paid APIs and proprietary tools, limiting accessibility and reproducibility for the research community. In this work, we present \\textbf{Cognitive Kernel-Pro}, a fully open-source and (to the maximum extent) free multi-module agent framework designed to democratize the development and evaluation of advanced AI agents. Within Cognitive Kernel-Pro, we systematically investigate the curation of high-quality training data for Agent Foundation Models, focusing on the construction of queries, trajectories, and verifiable answers across four key domains: web, file, code, and general reasoning. Furthermore, we explore novel strategies for agent test-time reflection and voting to enhance agent robustness and performance. We evaluate Cognitive Kernel-Pro on GAIA, achieving state-of-the-art results among open-source and free agents. Notably, our 8B-parameter open-source model surpasses previous leading systems such as WebDancer and WebSailor, establishing a new performance standard for accessible, high-capability AI agents. Code is available at this https URL", "authors": ["Authors:Tianqing Fang", "Zhisong Zhang", "Xiaoyang Wang", "Rui Wang", "Can Qin"], "categories": ["Artificial"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2508.00414", "pdf_url": "https://arxiv.org/pdf/2508.00414", "github_repo": "https://github.com/Tencent/CognitiveKernel-Pro", "source": "github_org"}, {"id": "2507.23726", "date": "2025-07-31", "title": "Seed-Prover: Deep and Broad Reasoning for Automated Theorem Proving", "abstract": "LLMs have demonstrated strong mathematical reasoning abilities by leveraging reinforcement learning with long chain-of-thought, yet they continue to struggle with theorem proving due to the lack of clear supervision signals when solely using natural language. Dedicated domain-specific languages like Lean provide clear supervision via formal verification of proofs, enabling effective training through reinforcement learning. In this work, we propose \\textbf{Seed-Prover}, a lemma-style whole-proof reasoning model. Seed-Prover can iteratively refine its proof based on Lean feedback, proved lemmas, and self-summarization. To solve IMO-level contest problems, we design three test-time inference strategies that enable both deep and broad reasoning. Seed-Prover proves $78.1\\%$ of formalized past IMO problems, saturates MiniF2F, and achieves over 50\\% on PutnamBench, outperforming the previous state-of-the-art by a large margin. To address the lack of geometry support in Lean, we introduce a geometry reasoning engine \\textbf{Seed-Geometry}, which outperforms previous formal geometry engines. We use these two systems to participate in IMO 2025 and fully prove 5 out of 6 problems. This work represents a significant advancement in automated mathematical reasoning, demonstrating the effectiveness of formal verification with long chain-of-thought reasoning.", "authors": ["Authors:Luoxin Chen", "Jinming Gu", "Liankai Huang", "Wenhao Huang", "Zhicheng Jiang"], "categories": ["Artificial"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2507.23726", "pdf_url": "https://arxiv.org/pdf/2507.23726", "github_repo": "https://github.com/bytedance-seed/Seed-Prover", "source": "github_org"}, {"id": "2507.21340", "date": "2025-07-30", "title": "StructText: A Synthetic Table-to-Text Approach for Benchmark Generation with Multi-Dimensional Evaluation", "abstract": "Extracting structured information from text, such as key-value pairs that\ncould augment tabular data, is quite useful in many enterprise use cases.\nAlthough large language models (LLMs) have enabled numerous automated pipelines\nfor converting natural language into structured formats, there is still a lack\nof benchmarks for evaluating their extraction quality, especially in specific\ndomains or focused documents specific to a given organization. Building such\nbenchmarks by manual annotations is labour-intensive and limits the size and\nscalability of the benchmarks. In this work, we present StructText, an\nend-to-end framework for automatically generating high-fidelity benchmarks for\nkey-value extraction from text using existing tabular data. It uses available\ntabular data as structured ground truth, and follows a two-stage\n``plan-then-execute'' pipeline to synthetically generate corresponding\nnatural-language text. To ensure alignment between text and structured source,\nwe introduce a multi-dimensional evaluation strategy that combines (a)\nLLM-based judgments on factuality, hallucination, and coherence and (b)\nobjective extraction metrics measuring numeric and temporal accuracy. We\nevaluated the proposed method on 71,539 examples across 49 datasets. Results\nreveal that while LLMs achieve strong factual accuracy and avoid hallucination,\nthey struggle with narrative coherence in producing extractable text. Notably,\nmodels presume numerical and temporal information with high fidelity yet this\ninformation becomes embedded in narratives that resist automated extraction. We\nrelease a framework, including datasets, evaluation tools, and baseline\nextraction systems, to support continued research.", "authors": ["Satyananda Kashyap", "Sola Shirai", "Nandana Mihindukulasooriya", "Horst Samulowitz"], "categories": ["cs.CL", "cs.AI", "cs.DB", "cs.IR"], "companies": ["IBM"], "abs_url": "https://arxiv.org/abs/2507.21340", "pdf_url": "https://arxiv.org/pdf/2507.21340", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.20199", "date": "2025-07-29", "title": "StepFun-Prover Preview: Let's Think and Verify Step by Step", "abstract": "We present StepFun-Prover Preview, a large language model designed for formal\ntheorem proving through tool-integrated reasoning. Using a reinforcement\nlearning pipeline that incorporates tool-based interactions, StepFun-Prover can\nachieve strong performance in generating Lean 4 proofs with minimal sampling.\nOur approach enables the model to emulate human-like problem-solving strategies\nby iteratively refining proofs based on real-time environment feedback. On the\nminiF2F-test benchmark, StepFun-Prover achieves a pass@1 success rate of\n$70.0\\%$. Beyond advancing benchmark performance, we introduce an end-to-end\ntraining framework for developing tool-integrated reasoning models, offering a\npromising direction for automated theorem proving and Math AI assistant.", "authors": ["Shijie Shang", "Ruosi Wan", "Yue Peng", "Yutong Wu", "Xiong-hui Chen"], "categories": ["cs.AI"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2507.20199", "pdf_url": "https://arxiv.org/pdf/2507.20199", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.20534", "date": "2025-07-28", "title": "Kimi K2: Open Agentic Intelligence", "abstract": "We introduce Kimi K2, a Mixture-of-Experts (MoE) large language model with 32 billion activated parameters and 1 trillion total parameters. We propose the MuonClip optimizer, which improves upon Muon with a novel QK-clip technique to address training instability while enjoying the advanced token efficiency of Muon. Based on MuonClip, K2 was pre-trained on 15.5 trillion tokens with zero loss spike. During post-training, K2 undergoes a multi-stage post-training process, highlighted by a large-scale agentic data synthesis pipeline and a joint reinforcement learning (RL) stage, where the model improves its capabilities through interactions with real and synthetic environments. Kimi K2 achieves state-of-the-art performance among open-source non-thinking models, with strengths in agentic capabilities. Notably, K2 obtains 66.1 on Tau2-Bench, 76.5 on ACEBench (En), 65.8 on SWE-Bench Verified, and 47.3 on SWE-Bench Multilingual -- surpassing most open and closed-sourced baselines in non-thinking settings. It also exhibits strong capabilities in coding, mathematics, and reasoning tasks, with a score of 53.7 on LiveCodeBench v6, 49.5 on AIME 2025, 75.1 on GPQA-Diamond, and 27.1 on OJBench, all without extended thinking. These results position Kimi K2 as one of the most capable open-source large language models to date, particularly in software engineering and agentic tasks. We release our base and post-trained model checkpoints to facilitate future research and applications of agentic intelligence.", "authors": ["Authors:Kimi Team: Yifan Bai", "Yiping Bao", "Y. Charles", "Cheng Chen", "Guanduo Chen"], "categories": ["Machine"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2507.20534", "pdf_url": "https://arxiv.org/pdf/2507.20534", "github_repo": "https://github.com/MoonshotAI/Kimi-K2", "source": "github_org"}, {"id": "2507.20939", "date": "2025-07-28", "title": "ARC-Hunyuan-Video-7B: Structured Video Comprehension of Real-World Shorts", "abstract": "Real-world user-generated short videos, especially those distributed on platforms such as WeChat Channel and TikTok, dominate the mobile internet. However, current large multimodal models lack essential temporally-structured, detailed, and in-depth video comprehension capabilities, which are the cornerstone of effective video search and recommendation, as well as emerging video applications. Understanding real-world shorts is actually challenging due to their complex visual elements, high information density in both visuals and audio, and fast pacing that focuses on emotional expression and viewpoint delivery. This requires advanced reasoning to effectively integrate multimodal information, including visual, audio, and text. In this work, we introduce ARC-Hunyuan-Video, a multimodal model that processes visual, audio, and textual signals from raw video inputs end-to-end for structured comprehension. The model is capable of multi-granularity timestamped video captioning and summarization, open-ended video question answering, temporal video grounding, and video reasoning. Leveraging high-quality data from an automated annotation pipeline, our compact 7B-parameter model is trained through a comprehensive regimen: pre-training, instruction fine-tuning, cold start, reinforcement learning (RL) post-training, and final instruction fine-tuning. Quantitative evaluations on our introduced benchmark ShortVid-Bench and qualitative comparisons demonstrate its strong performance in real-world video comprehension, and it supports zero-shot or fine-tuning with a few samples for diverse downstream applications. The real-world production deployment of our model has yielded tangible and measurable improvements in user engagement and satisfaction, a success supported by its remarkable efficiency, with stress tests indicating an inference time of just 10 seconds for a one-minute video on H20 GPU.", "authors": ["Authors:Yuying Ge", "Yixiao Ge", "Chen Li", "Teng Wang", "Junfu Pu"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2507.20939", "pdf_url": "https://arxiv.org/pdf/2507.20939", "github_repo": "https://github.com/TencentARC/ARC-Hunyuan-Video-7B", "source": "github_org"}, {"id": "2507.19427", "date": "2025-07-25", "title": "Step-3 is Large yet Affordable: Model-system Co-design for Cost-effective Decoding", "abstract": "Large language models (LLMs) face low hardware efficiency during decoding, especially for long-context reasoning tasks. This paper introduces Step-3, a 321B-parameter VLM with hardware-aware model-system co-design optimized for minimizing decoding costs. Step-3 innovates in two key dimensions: (1) A novel Multi-Matrix Factorization Attention (MFA) mechanism that significantly reduces both KV cache size and computation while maintaining high attention expressiveness, and (2) Attention-FFN Disaggregation (AFD), a distributed inference system that decouples attention and Feed-Forward Network (FFN) layers into specialized subsystems. This co-design achieves unprecedented cost efficiency: Step-3 significantly reduces theoretical decoding costs compared with models like DeepSeek-V3 and Qwen3 MoE 235B, with the gains widening at longer context. Step-3 achieves low cost while activating 38B parameters per token (more than DeepSeek-V3 and Qwen3 MoE 235B), demonstrating that hardware-aligned attention arithmetic intensity, MoE sparsity, and AFD are critical to cost-effectiveness. We perform a head-to-head comparison with DeepSeek-V3 in its favorable scenarios. Our implementation on Hopper GPUs achieves a decoding throughput of up to 4,039 tokens per second per GPU under 50ms TPOT SLA (4K context, FP8, no MTP). It is higher than DeepSeek-V3&#39;s 2,324 in the same setup and sets a new Pareto frontier for LLM decoding.", "authors": ["Authors:StepFun: Bin Wang", "Bojun Wang", "Changyi Wan", "Guanzhe Huang", "Hanpeng Hu"], "categories": ["Machine"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2507.19427", "pdf_url": "https://arxiv.org/pdf/2507.19427", "github_repo": "https://github.com/stepfun-ai/Step3", "source": "github_org"}, {"id": "2507.16947", "date": "2025-07-24", "title": "AI-based Clinical Decision Support for Primary Care: A Real-World Study", "abstract": "We evaluate the impact of large language model-based clinical decision\nsupport in live care. In partnership with Penda Health, a network of primary\ncare clinics in Nairobi, Kenya, we studied AI Consult, a tool that serves as a\nsafety net for clinicians by identifying potential documentation and clinical\ndecision-making errors. AI Consult integrates into clinician workflows,\nactivating only when needed and preserving clinician autonomy. We conducted a\nquality improvement study, comparing outcomes for 39,849 patient visits\nperformed by clinicians with or without access to AI Consult across 15 clinics.\nVisits were rated by independent physicians to identify clinical errors.\nClinicians with access to AI Consult made relatively fewer errors: 16% fewer\ndiagnostic errors and 13% fewer treatment errors. In absolute terms, the\nintroduction of AI Consult would avert diagnostic errors in 22,000 visits and\ntreatment errors in 29,000 visits annually at Penda alone. In a survey of\nclinicians with AI Consult, all clinicians said that AI Consult improved the\nquality of care they delivered, with 75% saying the effect was \"substantial\".\nThese results required a clinical workflow-aligned AI Consult implementation\nand active deployment to encourage clinician uptake. We hope this study\ndemonstrates the potential for LLM-based clinical decision support tools to\nreduce errors in real-world settings and provides a practical framework for\nadvancing responsible adoption.", "authors": ["Robert Korom", "Sarah Kiptinness", "Najib Adan", "Kassim Said", "Catherine Ithuli"], "categories": ["cs.CL"], "companies": ["OpenAI"], "abs_url": "https://arxiv.org/abs/2507.16947", "pdf_url": "https://arxiv.org/pdf/2507.16947", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.16229", "date": "2025-07-23", "title": "Voice-based AI Agents: Filling the Economic Gaps in Digital Health Delivery", "abstract": "The integration of voice-based AI agents in healthcare presents a\ntransformative opportunity to bridge economic and accessibility gaps in digital\nhealth delivery. This paper explores the role of large language model\n(LLM)-powered voice assistants in enhancing preventive care and continuous\npatient monitoring, particularly in underserved populations. Drawing insights\nfrom the development and pilot study of Agent PULSE (Patient Understanding and\nLiaison Support Engine) -- a collaborative initiative between IBM Research,\nCleveland Clinic Foundation, and Morehouse School of Medicine -- we present an\neconomic model demonstrating how AI agents can provide cost-effective\nhealthcare services where human intervention is economically unfeasible. Our\npilot study with 33 inflammatory bowel disease patients revealed that 70\\%\nexpressed acceptance of AI-driven monitoring, with 37\\% preferring it over\ntraditional modalities. Technical challenges, including real-time\nconversational AI processing, integration with healthcare systems, and privacy\ncompliance, are analyzed alongside policy considerations surrounding\nregulation, bias mitigation, and patient autonomy. Our findings suggest that\nAI-driven voice agents not only enhance healthcare scalability and efficiency\nbut also improve patient engagement and accessibility. For healthcare\nexecutives, our cost-utility analysis demonstrates huge potential savings for\nroutine monitoring tasks, while technologists can leverage our framework to\nprioritize improvements yielding the highest patient impact. By addressing\ncurrent limitations and aligning AI development with ethical and regulatory\nframeworks, voice-based AI agents can serve as a critical entry point for\nequitable, sustainable digital healthcare solutions.", "authors": ["Bo Wen", "Chen Wang", "Qiwei Han", "Raquel Norel", "Julia Liu"], "categories": ["cs.AI", "cs.CY", "cs.HC", "cs.SE"], "companies": ["IBM"], "abs_url": "https://arxiv.org/abs/2507.16229", "pdf_url": "https://arxiv.org/pdf/2507.16229", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.16632", "date": "2025-07-22", "title": "Step-Audio 2 Technical Report", "abstract": "This paper presents Step-Audio 2, an end-to-end multi-modal large language model designed for industry-strength audio understanding and speech conversation. By integrating a latent audio encoder and reasoning-centric reinforcement learning (RL), Step-Audio 2 achieves promising performance in automatic speech recognition (ASR) and audio understanding. To facilitate genuine end-to-end speech conversation, Step-Audio 2 incorporates the generation of discrete audio tokens into language modeling, significantly enhancing its responsiveness to paralinguistic information such as speaking styles and emotions. To effectively leverage the rich textual and acoustic knowledge in real-world data, Step-Audio 2 integrates retrieval-augmented generation (RAG) and is able to call external tools such as web search to mitigate hallucination and audio search to switch timbres. Trained on millions of hours of speech and audio data, Step-Audio 2 delivers intelligence and expressiveness across diverse conversational scenarios. Evaluation results demonstrate that Step-Audio 2 achieves state-of-the-art performance on various audio understanding and conversational benchmarks compared to other open-source and commercial solutions. Please visit this https URL for more information.", "authors": ["Authors:Boyong Wu", "Chao Yan", "Chen Hu", "Cheng Yi", "Chengli Feng"], "categories": ["Computation"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2507.16632", "pdf_url": "https://arxiv.org/pdf/2507.16632", "github_repo": "https://github.com/stepfun-ai/Step-Audio2", "source": "github_org"}, {"id": "2507.15225", "date": "2025-07-21", "title": "Solving Formal Math Problems by Decomposition and Iterative Reflection", "abstract": "General-purpose Large Language Models (LLMs) have achieved remarkable success in intelligence, performing comparably to human experts on complex reasoning tasks such as coding and mathematical reasoning. However, generating formal proofs in specialized languages like Lean 4 remains a significant challenge for these models, limiting their application in complex theorem proving and automated verification. Current approaches typically require specializing models through fine-tuning on dedicated formal corpora, incurring high costs for data collection and training. In this work, we introduce \\textbf{Delta Prover}, an agent-based framework that orchestrates the interaction between a general-purpose LLM and the Lean 4 proof environment. Delta Prover leverages the reflection and reasoning capabilities of general-purpose LLMs to interactively construct formal proofs in Lean 4, circumventing the need for model specialization. At its core, the agent integrates two novel, interdependent components: an algorithmic framework for reflective decomposition and iterative proof repair, and a custom Domain-Specific Language (DSL) built upon Lean 4 for streamlined subproblem management. \\textbf{Delta Prover achieves a state-of-the-art 95.9\\% success rate on the miniF2F-test benchmark, surpassing all existing approaches, including those requiring model specialization.} Furthermore, Delta Prover exhibits a significantly stronger test-time scaling law compared to standard Best-of-N proof strategies. Crucially, our findings demonstrate that general-purpose LLMs, when guided by an effective agentic structure, possess substantial untapped theorem-proving capabilities. This presents a computationally efficient alternative to specialized models for robust automated reasoning in formal environments.", "authors": ["Authors:Yichi Zhou", "Jianqiu Zhao", "Yongxin Zhang", "Bohan Wang", "Siran Wang"], "categories": ["Artificial"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2507.15225", "pdf_url": "https://arxiv.org/pdf/2507.15225", "github_repo": "https://github.com/bytedance-seed/Seed-Prover", "source": "github_org"}, {"id": "2507.14675", "date": "2025-07-19", "title": "Docopilot: Improving Multimodal Models for Document-Level Understanding", "abstract": "Despite significant progress in multimodal large language models (MLLMs), their performance on complex, multi-page document comprehension remains inadequate, largely due to the lack of high-quality, document-level datasets. While current retrieval-augmented generation (RAG) methods offer partial solutions, they suffer from issues, such as fragmented retrieval contexts, multi-stage error accumulation, and extra time costs of retrieval. In this work, we present a high-quality document-level dataset, Doc-750K, designed to support in-depth understanding of multimodal documents. This dataset includes diverse document structures, extensive cross-page dependencies, and real question-answer pairs derived from the original documents. Building on the dataset, we develop a native multimodal model, Docopilot, which can accurately handle document-level dependencies without relying on RAG. Experiments demonstrate that Docopilot achieves superior coherence, accuracy, and efficiency in document understanding tasks and multi-turn interactions, setting a new baseline for document-level multimodal understanding. Data, code, and models are released at this https URL", "authors": ["Authors:Yuchen Duan", "Zhe Chen", "Yusong Hu", "Weiyun Wang", "Shenglong Ye"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2507.14675", "pdf_url": "https://arxiv.org/pdf/2507.14675", "github_repo": "https://github.com/OpenGVLab/Docopilot", "source": "github_org"}, {"id": "2507.13618", "date": "2025-07-18", "title": "Seed-X: Building Strong Multilingual Translation LLM with 7B Parameters", "abstract": "Multilingual translation stands as a challenging task for large language models (LLMs) to handle intricate language patterns and stilted translations that arise in automated translations. In this paper, we introduce Seed-X, a family of open-source LLMs comprising instruct and reasoning models, pushing the limits of translation capability with 7B parameter size. The base model is pre-trained on a diverse, high-quality dataset encompassing both monolingual and bilingual content across 28 languages, harnessing the full potential of multilingual data. The instruct model is then finetuned to translate by Chain-of-Thought (CoT) reasoning and further enhanced through reinforcement learning (RL) to achieve better generalization across diverse language pairs. Seed-X achieves performance comparable to leading closed-source models, including Gemini-2.5 and GPT-4o, across 28 languages, and significantly outperforms larger open-source models in both automatic metrics and human evaluations. We share the best practices through our optimization process, and make the parameter public available for advancing translation research and applications.", "authors": ["Authors:Shanbo Cheng", "Yu Bao", "Qian Cao", "Luyang Huang", "Liyan Kang"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2507.13618", "pdf_url": "https://arxiv.org/pdf/2507.13618", "github_repo": "https://github.com/bytedance-seed/Seed-X-7B", "source": "github_org"}, {"id": "2507.12566", "date": "2025-07-16", "title": "Mono-InternVL-1.5: Towards Cheaper and Faster Monolithic Multimodal Large Language Models", "abstract": "This paper focuses on monolithic Multimodal Large Language Models (MLLMs), which integrate visual encoding and language decoding into a single model. Existing structures and pre-training strategies for monolithic MLLMs often suffer from unstable optimization and catastrophic forgetting. To address these challenges, our key idea is to embed a new visual parameter space into a pre-trained LLM, enabling stable learning of visual knowledge from noisy data via delta tuning. Based on this principle, we first introduce Mono-InternVL, an advanced monolithic MLLM that incorporates a set of visual experts through a multimodal mixture-of-experts architecture. In addition, we design an innovative Endogenous Visual Pre-training (EViP) for Mono-InternVL to maximize its visual capabilities via progressive learning. Mono-InternVL achieves competitive performance against existing MLLMs but also leads to relatively expensive data cost. Therefore, we further present Mono-InternVL-1.5, a cheaper and stronger monolithic MLLM equipped with an improved EViP (EViP++). EViP++ introduces additional visual attention experts to Mono-InternVL-1.5 and re-organizes the pre-training process in an efficient manner. During inference, it includes a fused CUDA kernel to speed up its MoE operations. With these designs, Mono-InternVL-1.5 significantly reduces training and inference costs, while still maintaining competitive performance with Mono-InternVL. To evaluate our approach, we conduct extensive experiments across 15 benchmarks. Results demonstrate that Mono-InternVL outperforms existing monolithic MLLMs on 12 out of 15 benchmarks, e.g., +114-point improvement over Emu3 on OCRBench. Compared to its modular counterpart, i.e., InternVL-1.5, Mono-InternVL-1.5 achieves similar multimodal performance while reducing first-token latency by up to 69%. Code and models are released at this https URL .", "authors": ["Authors:Gen Luo", "Wenhan Dou", "Wenhao Li", "Zhaokai Wang", "Xue Yang"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2507.12566", "pdf_url": "https://arxiv.org/pdf/2507.12566", "github_repo": "https://github.com/OpenGVLab/Mono-InternVL", "source": "github_org"}, {"id": "2507.07451", "date": "2025-07-11", "title": "RLEP: Reinforcement Learning with Experience Replay for LLM Reasoning", "abstract": "Reinforcement learning (RL) for large language models is an energy-intensive\nendeavor: training can be unstable, and the policy may gradually drift away\nfrom its pretrained weights. We present \\emph{RLEP}\\, -- \\,Reinforcement\nLearning with Experience rePlay\\, -- \\,a two-phase framework that first\ncollects verified trajectories and then replays them during subsequent\ntraining. At every update step, the policy is optimized on mini-batches that\nblend newly generated rollouts with these replayed successes. By replaying\nhigh-quality examples, RLEP steers the model away from fruitless exploration,\nfocuses learning on promising reasoning paths, and delivers both faster\nconvergence and stronger final performance. On the Qwen2.5-Math-7B base model,\nRLEP reaches baseline peak accuracy with substantially fewer updates and\nultimately surpasses it, improving accuracy on AIME-2024 from 38.2% to 39.9%,\non AIME-2025 from 19.8% to 22.3%, and on AMC-2023 from 77.0% to 82.2%. Our\ncode, datasets, and checkpoints are publicly available at\nhttps://github.com/Kwai-Klear/RLEP to facilitate reproducibility and further\nresearch.", "authors": ["Hongzhi Zhang", "Jia Fu", "Jingyuan Zhang", "Kai Fu", "Qi Wang"], "categories": ["cs.CL"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2507.07451", "pdf_url": "https://arxiv.org/pdf/2507.07451", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.07966", "date": "2025-07-11", "title": "Scaling RL to Long Videos", "abstract": "We introduce a full-stack framework that scales up reasoning in\nvision-language models (VLMs) to long videos, leveraging reinforcement\nlearning. We address the unique challenges of long video reasoning by\nintegrating three critical components: (1) a large-scale dataset,\nLongVideo-Reason, comprising 52K long video QA pairs with high-quality\nreasoning annotations across diverse domains such as sports, games, and vlogs;\n(2) a two-stage training pipeline that extends VLMs with chain-of-thought\nsupervised fine-tuning (CoT-SFT) and reinforcement learning (RL); and (3) a\ntraining infrastructure for long video RL, named Multi-modal Reinforcement\nSequence Parallelism (MR-SP), which incorporates sequence parallelism and a\nvLLM-based engine tailored for long video, using cached video embeddings for\nefficient rollout and prefilling. In experiments, LongVILA-R1-7B achieves\nstrong performance on long video QA benchmarks such as VideoMME. It also\noutperforms Video-R1-7B and even matches Gemini-1.5-Pro across temporal\nreasoning, goal and purpose reasoning, spatial reasoning, and plot reasoning on\nour LongVideo-Reason-eval benchmark. Notably, our MR-SP system achieves up to\n2.1x speedup on long video RL training. LongVILA-R1 demonstrates consistent\nperformance gains as the number of input video frames scales. LongVILA-R1 marks\na firm step towards long video reasoning in VLMs. In addition, we release our\ntraining system for public availability that supports RL training on various\nmodalities (video, text, and audio), various models (VILA and Qwen series), and\neven image and video generation models. On a single A100 node (8 GPUs), it\nsupports RL training on hour-long videos (e.g., 3,600 frames / around 256k\ntokens).", "authors": ["Yukang Chen", "Wei Huang", "Baifeng Shi", "Qinghao Hu", "Hanrong Ye"], "categories": ["cs.CV", "cs.AI", "cs.CL"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2507.07966", "pdf_url": "https://arxiv.org/pdf/2507.07966", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.08605", "date": "2025-07-11", "title": "Machine Learning for Sustainable Rice Production: Region-Scale Monitoring of Water-Saving Practices in Punjab, India", "abstract": "Rice cultivation supplies half the world&#39;s population with staple food, while also being a major driver of freshwater depletion--consuming roughly a quarter of global freshwater--and accounting for approx. 48% of greenhouse gas emissions from croplands. In regions like Punjab, India, where groundwater levels are plummeting at 41.6 cm/year, adopting water-saving rice farming practices is critical. Direct-Seeded Rice (DSR) and Alternate Wetting and Drying (AWD) can cut irrigation water use by 20-40% without hurting yields, yet lack of spatial data on adoption impedes effective adaptation policy and climate action. We present a machine learning framework to bridge this data gap by monitoring sustainable rice farming at scale. In collaboration with agronomy experts and a large-scale farmer training program, we obtained ground-truth data from 1,400 fields across Punjab. Leveraging this partnership, we developed a novel dimensional classification approach that decouples sowing and irrigation practices, achieving F1 scores of 0.8 and 0.74 respectively, solely employing Sentinel-1 satellite imagery. Explainability analysis reveals that DSR classification is robust while AWD classification depends primarily on planting schedule differences, as Sentinel-1&#39;s 12-day revisit frequency cannot capture the higher frequency irrigation cycles characteristic of AWD practices. Applying this model across 3 million fields reveals spatial heterogeneity in adoption at the state level, highlighting gaps and opportunities for policy targeting. Our district-level adoption rates correlate well with government estimates (Spearman&#39;s $\\rho$=0.69 and Rank Biased Overlap=0.77). This study provides policymakers and sustainability programs a powerful tool to track practice adoption, inform targeted interventions, and drive data-driven policies for water conservation and climate mitigation at regional scale.", "authors": ["Authors:Ando Shah", "Rajveer Singh", "Akram Zaytar", "Girmaw Abebe Tadesse", "Caleb Robinson"], "categories": ["Machine"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2507.08605", "pdf_url": "https://arxiv.org/pdf/2507.08605", "github_repo": "https://github.com/microsoft/rice-irrigation-mapping-s1s2", "source": "github_org"}, {"id": "2507.03112", "date": "2025-07-08", "title": "RLVER: Reinforcement Learning with Verifiable Emotion Rewards for Empathetic Agents", "abstract": "Large language models (LLMs) excel at logical and algorithmic reasoning, yet\ntheir emotional intelligence (EQ) still lags far behind their cognitive\nprowess. While reinforcement learning from verifiable rewards (RLVR) has\nadvanced in other domains, its application to dialogue-especially for emotional\nintelligence-remains underexplored. In this work, we introduce RLVER, the first\nend-to-end reinforcement learning framework that leverages verifiable emotion\nrewards from simulated users to cultivate higher-order empathetic abilities in\nLLMs. Within this framework, self-consistent affective simulated users engage\nin dialogue rollouts and produce deterministic emotion scores during\nconversations, serving as reward signals to guide the LLM's learning.\nFine-tuning publicly available Qwen2.5-7B-Instruct model with PPO boosts its\nSentient-Benchmark score from 13.3 to 79.2 while largely preserving\nmathematical and coding competence. Extensive experiments reveal that: (i)\nRLVER consistently improves multiple dialogue capabilities; (ii) Thinking and\nnon-thinking models show distinct trends--thinking models excel in empathy and\ninsight, while non-thinking models favor action; (iii) GRPO often yields stable\ngains, while PPO can push certain capabilities to a higher ceiling; (iv) More\nchallenging environments are not always better-moderate ones can yield stronger\noutcomes. Our results show that RLVER is a practical route toward emotionally\nintelligent and broadly capable language agents.", "authors": ["Peisong Wang", "Ruotian Ma", "Bang Zhang", "Xingyu Chen", "Zhiwei He"], "categories": ["cs.CL", "cs.AI", "cs.CY"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2507.03112", "pdf_url": "https://arxiv.org/pdf/2507.03112", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.03578", "date": "2025-07-08", "title": "SciVid: Cross-Domain Evaluation of Video Models in Scientific Applications", "abstract": "In recent years, there has been a proliferation of spatiotemporal foundation\nmodels in different scientific disciplines. While promising, these models are\noften domain-specific and are only assessed within the particular applications\nfor which they are designed. Given that many tasks can be represented as video\nmodeling problems, video foundation models (ViFMs) hold considerable promise as\ngeneral-purpose domain-agnostic approaches. However, it is not known whether\nthe knowledge acquired on large-scale but potentially out-of-domain data can be\neffectively transferred across diverse scientific disciplines, and if a single,\npretrained ViFM can be competitive with domain-specific baselines. To address\nthis, we introduce SciVid, a comprehensive benchmark comprising five\n*Sci*entific *Vid*eo tasks, across medical computer vision, animal behavior,\nand weather forecasting. We adapt six leading ViFMs to SciVid using simple\ntrainable readout modules, establishing strong baselines and demonstrating the\npotential for effective transfer learning. Specifically, we show that\nstate-of-the-art results can be obtained in several applications by leveraging\nthe general-purpose representations from ViFM backbones. Furthermore, our\nresults reveal the limitations of existing ViFMs, and highlight opportunities\nfor the development of generalizable models for high-impact scientific\napplications. We release our code at https://github.com/google-deepmind/scivid\nto facilitate further research in the development of ViFMs.", "authors": ["Yana Hasson", "Pauline Luc", "Liliane Momeni", "Maks Ovsjanikov", "Guillaume Le Moing"], "categories": ["cs.CV", "cs.AI", "cs.LG"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2507.03578", "pdf_url": "https://arxiv.org/pdf/2507.03578", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.05197", "date": "2025-07-07", "title": "Pre-Trained Policy Discriminators are General Reward Models", "abstract": "We offer a novel perspective on reward modeling by formulating it as a policy discriminator, which quantifies the difference between two policies to generate a reward signal, guiding the training policy towards a target policy with desired behaviors. Based on this conceptual insight, we propose a scalable pre-training method named Policy Discriminative Learning (POLAR), which trains a reward model (RM) to discern identical policies and discriminate different ones. Unlike traditional reward modeling methods relying on absolute preferences, POLAR captures the relative difference between one policy and an arbitrary target policy, which is a scalable, high-level optimization objective suitable for modeling generic ranking relationships. Leveraging the POLAR pre-training paradigm, we present a series of RMs with parameter scales from 1.8B to 7B. Empirical results show that POLAR substantially outperforms traditional non-pre-trained methods, significantly enhancing RM performance. For instance, POLAR-7B could improve preference accuracy from 54.8% to 81.0% on STEM tasks and from 57.9% to 85.5% on creative writing tasks compared to SOTA baselines. POLAR also shows robust generalization capabilities in RLHF using Reinforcement Fine-tuning (RFT), providing reliable reward signals and markedly enhancing policy performance--improving LLaMa3.1-8B from an average of 47.36% to 56.33% and Qwen2.5-32B from 64.49% to 70.47% on 20 benchmarks. Moreover, scaling experiments reveal a clear power-law relationship between computation and performance, supported by linear correlation coefficients approaching 0.99. The impressive performance, strong generalization, and scaling properties suggest that POLAR is a promising direction for developing general and strong reward models.", "authors": ["Authors:Shihan Dou", "Shichun Liu", "Yuming Yang", "Yicheng Zou", "Yunhua Zhou"], "categories": ["Computation"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2507.05197", "pdf_url": "https://arxiv.org/pdf/2507.05197", "github_repo": "https://github.com/InternLM/POLAR", "source": "github_org"}, {"id": "2507.02554", "date": "2025-07-05", "title": "AI Research Agents for Machine Learning: Search, Exploration, and Generalization in MLE-bench", "abstract": "AI research agents are demonstrating great potential to accelerate scientific\nprogress by automating the design, implementation, and training of machine\nlearning models. We focus on methods for improving agents' performance on\nMLE-bench, a challenging benchmark where agents compete in Kaggle competitions\nto solve real-world machine learning problems. We formalize AI research agents\nas search policies that navigate a space of candidate solutions, iteratively\nmodifying them using operators. By designing and systematically varying\ndifferent operator sets and search policies (Greedy, MCTS, Evolutionary), we\nshow that their interplay is critical for achieving high performance. Our best\npairing of search strategy and operator set achieves a state-of-the-art result\non MLE-bench lite, increasing the success rate of achieving a Kaggle medal from\n39.6% to 47.7%. Our investigation underscores the importance of jointly\nconsidering the search strategy, operator design, and evaluation methodology in\nadvancing automated machine learning.", "authors": ["Edan Toledo", "Karen Hambardzumyan", "Martin Josifoski", "Rishi Hazra", "Nicolas Baldwin"], "categories": ["cs.AI", "cs.LG"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2507.02554", "pdf_url": "https://arxiv.org/pdf/2507.02554", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.01949", "date": "2025-07-03", "title": "Kwai Keye-VL Technical Report", "abstract": "While Multimodal Large Language Models (MLLMs) demonstrate remarkable\ncapabilities on static images, they often fall short in comprehending dynamic,\ninformation-dense short-form videos, a dominant medium in today's digital\nlandscape. To bridge this gap, we introduce \\textbf{Kwai Keye-VL}, an\n8-billion-parameter multimodal foundation model engineered for leading-edge\nperformance in short-video understanding while maintaining robust\ngeneral-purpose vision-language abilities. The development of Keye-VL rests on\ntwo core pillars: a massive, high-quality dataset exceeding 600 billion tokens\nwith a strong emphasis on video, and an innovative training recipe. This recipe\nfeatures a four-stage pre-training process for solid vision-language alignment,\nfollowed by a meticulous two-phase post-training process. The first\npost-training stage enhances foundational capabilities like instruction\nfollowing, while the second phase focuses on stimulating advanced reasoning. In\nthis second phase, a key innovation is our five-mode ``cold-start'' data\nmixture, which includes ``thinking'', ``non-thinking'', ``auto-think'', ``think\nwith image'', and high-quality video data. This mixture teaches the model to\ndecide when and how to reason. Subsequent reinforcement learning (RL) and\nalignment steps further enhance these reasoning capabilities and correct\nabnormal model behaviors, such as repetitive outputs. To validate our approach,\nwe conduct extensive evaluations, showing that Keye-VL achieves\nstate-of-the-art results on public video benchmarks and remains highly\ncompetitive on general image-based tasks (Figure 1). Furthermore, we develop\nand release the \\textbf{KC-MMBench}, a new benchmark tailored for real-world\nshort-video scenarios, where Keye-VL shows a significant advantage.", "authors": ["Kwai Keye Team", "Biao Yang", "Bin Wen", "Changyi Liu", "Chenglong Chu"], "categories": ["cs.CV"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2507.01949", "pdf_url": "https://arxiv.org/pdf/2507.01949", "github_repo": "", "source": "daily_arxiv"}, {"id": "2507.01926", "date": "2025-07-02", "title": "IC-Custom: Diverse Image Customization via In-Context Learning", "abstract": "Image customization, a crucial technique for industrial media production, aims to generate content that is consistent with reference images. However, current approaches conventionally separate image customization into position-aware and position-free customization paradigms and lack a universal framework for diverse customization, limiting their applications across various scenarios. To overcome these limitations, we propose IC-Custom, a unified framework that seamlessly integrates position-aware and position-free image customization through in-context learning. IC-Custom concatenates reference images with target images to a polyptych, leveraging DiT&#39;s multi-modal attention mechanism for fine-grained token-level interactions. We propose the In-context Multi-Modal Attention (ICMA) mechanism, which employs learnable task-oriented register tokens and boundary-aware positional embeddings to enable the model to effectively handle diverse tasks and distinguish between inputs in polyptych configurations. To address the data gap, we curated a 12K identity-consistent dataset with 8K real-world and 4K high-quality synthetic samples, avoiding the overly glossy, oversaturated look typical of synthetic data. IC-Custom supports various industrial applications, including try-on, image insertion, and creative IP customization. Extensive evaluations on our proposed ProductBench and the publicly available DreamBench demonstrate that IC-Custom significantly outperforms community workflows, closed-source models, and state-of-the-art open-source approaches. IC-Custom achieves about 73\\% higher human preference across identity consistency, harmony, and text alignment metrics, while training only 0.4\\% of the original model parameters. Project page: this https URL", "authors": ["Authors:Yaowei Li", "Xiaoyu Li", "Zhaoyang Zhang", "Yuxuan Bian", "Gan Liu"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2507.01926", "pdf_url": "https://arxiv.org/pdf/2507.01926", "github_repo": "https://github.com/TencentARC/IC-Custom", "source": "github_org"}, {"id": "2506.23971", "date": "2025-07-01", "title": "UMA: A Family of Universal Models for Atoms", "abstract": "The ability to quickly and accurately compute properties from atomic\nsimulations is critical for advancing a large number of applications in\nchemistry and materials science including drug discovery, energy storage, and\nsemiconductor manufacturing. To address this need, Meta FAIR presents a family\nof Universal Models for Atoms (UMA), designed to push the frontier of speed,\naccuracy, and generalization. UMA models are trained on half a billion unique\n3D atomic structures (the largest training runs to date) by compiling data\nacross multiple chemical domains, e.g. molecules, materials, and catalysts. We\ndevelop empirical scaling laws to help understand how to increase model\ncapacity alongside dataset size to achieve the best accuracy. The UMA small and\nmedium models utilize a novel architectural design we refer to as mixture of\nlinear experts that enables increasing model capacity without sacrificing\nspeed. For example, UMA-medium has 1.4B parameters but only ~50M active\nparameters per atomic structure. We evaluate UMA models on a diverse set of\napplications across multiple domains and find that, remarkably, a single model\nwithout any fine-tuning can perform similarly or better than specialized\nmodels. We are releasing the UMA code, weights, and associated data to\naccelerate computational workflows and enable the community to continue to\nbuild increasingly capable AI models.", "authors": ["Brandon M. Wood", "Misko Dzamba", "Xiang Fu", "Meng Gao", "Muhammed Shuaibi"], "categories": ["cs.LG"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2506.23971", "pdf_url": "https://arxiv.org/pdf/2506.23971", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.23858", "date": "2025-07-01", "title": "VMoBA: Mixture-of-Block Attention for Video Diffusion Models", "abstract": "The quadratic complexity of full attention mechanisms poses a significant\nbottleneck for Video Diffusion Models (VDMs) aiming to generate long-duration,\nhigh-resolution videos. While various sparse attention methods have been\nproposed, many are designed as training-free inference accelerators or do not\noptimally capture the unique spatio-temporal characteristics inherent in video\ndata when trained natively. This paper introduces Video Mixture of Block\nAttention (VMoBA), a novel sparse attention mechanism specifically adapted for\nVDMs. Motivated by an in-depth analysis of attention patterns within\npre-trained video transformers, which revealed strong spatio-temporal locality,\nvarying query importance, and head-specific concentration levels, VMoBA\nenhances the original MoBA framework with three key modifications: (1) a\nlayer-wise recurrent block partition scheme (1D-2D-3D) to dynamically adapt to\ndiverse spatio-temporal attention patterns and improve efficiency; (2) global\nblock selection to prioritize the most salient query-key block interactions\nacross an entire attention head; and (3) threshold-based block selection to\ndynamically determine the number of attended blocks based on their cumulative\nsimilarity. Extensive experiments demonstrate that VMoBA significantly\naccelerates the training of VDMs on longer sequences, achieving 2.92x FLOPs and\n1.48x latency speedup, while attaining comparable or even superior generation\nquality to full attention. Furthermore, VMoBA exhibits competitive performance\nin training-free inference, offering 2.40x FLOPs and 1.35x latency speedup for\nhigh-res video generation.", "authors": ["Jianzong Wu", "Liang Hou", "Haotian Yang", "Xin Tao", "Ye Tian"], "categories": ["cs.CV"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2506.23858", "pdf_url": "https://arxiv.org/pdf/2506.23858", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.21718", "date": "2025-06-30", "title": "Performance Prediction for Large Systems via Text-to-Text Regression", "abstract": "In many industries, predicting metric outcomes of large systems is a\nfundamental problem, driven largely by traditional tabular regression. However,\nsuch methods struggle on complex systems data in the wild such as configuration\nfiles or system logs, where feature engineering is often infeasible. We propose\ntext-to-text regression as a general, scalable alternative. For predicting\nresource efficiency on Borg, Google's massive compute cluster scheduling\nsystem, a 60M parameter encoder-decoder, trained from random initialization,\nachieves up to a near perfect 0.99 (0.9 average) rank correlation across the\nentire fleet, and 100x lower MSE than tabular approaches. The model also easily\nadapts to new tasks in only 500 few-shot examples and captures the densities of\ncomplex outcome distributions. Ablation studies highlight the importance of\nusing encoders, increasing sequence length, and the model's inherent\nuncertainty quantification. These findings pave the way for universal\nsimulators of real-world outcomes.", "authors": ["Yash Akhauri", "Bryan Lewandowski", "Cheng-Hsi Lin", "Adrian N. Reyes", "Grant C. Forbes"], "categories": ["cs.LG", "cs.AI", "cs.PF", "cs.SE"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2506.21718", "pdf_url": "https://arxiv.org/pdf/2506.21718", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.22716", "date": "2025-06-28", "title": "BEST-Route: Adaptive LLM Routing with Test-Time Optimal Compute", "abstract": "Large language models (LLMs) are powerful tools but are often expensive to deploy at scale. LLM query routing mitigates this by dynamically assigning queries to models of varying cost and quality to obtain a desired trade-off. Prior query routing approaches generate only one response from the selected model and a single response from a small (inexpensive) model was often not good enough to beat a response from a large (expensive) model due to which they end up overusing the large model and missing out on potential cost savings. However, it is well known that for small models, generating multiple responses and selecting the best can enhance quality while remaining cheaper than a single large-model response. We leverage this idea to propose BEST-Route, a novel routing framework that chooses a model and the number of responses to sample from it based on query difficulty and the quality thresholds. Experiments on real-world datasets demonstrate that our method reduces costs by up to 60% with less than 1% performance drop.", "authors": ["Authors:Dujian Ding", "Ankur Mallick", "Shaokun Zhang", "Chi Wang", "Daniel Madrigal"], "categories": ["Machine"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2506.22716", "pdf_url": "https://arxiv.org/pdf/2506.22716", "github_repo": "https://github.com/microsoft/best-route-llm", "source": "github_org"}, {"id": "2506.21416", "date": "2025-06-27", "title": "XVerse: Consistent Multi-Subject Control of Identity and Semantic Attributes via DiT Modulation", "abstract": "Achieving fine-grained control over subject identity and semantic attributes\n(pose, style, lighting) in text-to-image generation, particularly for multiple\nsubjects, often undermines the editability and coherence of Diffusion\nTransformers (DiTs). Many approaches introduce artifacts or suffer from\nattribute entanglement. To overcome these challenges, we propose a novel\nmulti-subject controlled generation model XVerse. By transforming reference\nimages into offsets for token-specific text-stream modulation, XVerse allows\nfor precise and independent control for specific subject without disrupting\nimage latents or features. Consequently, XVerse offers high-fidelity, editable\nmulti-subject image synthesis with robust control over individual subject\ncharacteristics and semantic attributes. This advancement significantly\nimproves personalized and complex scene generation capabilities.", "authors": ["Bowen Chen", "Mengyi Zhao", "Haomiao Sun", "Li Chen", "Xu Wang"], "categories": ["cs.CV"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.21416", "pdf_url": "https://arxiv.org/pdf/2506.21416", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.19398", "date": "2025-06-24", "title": "ClearerVoice-Studio: Bridging Advanced Speech Processing Research and Practical Deployment", "abstract": "This paper introduces ClearerVoice-Studio, an open-source, AI-powered speech processing toolkit designed to bridge cutting-edge research and practical application. Unlike broad platforms like SpeechBrain and ESPnet, ClearerVoice-Studio focuses on interconnected speech tasks of speech enhancement, separation, super-resolution, and multimodal target speaker extraction. A key advantage is its state-of-the-art pretrained models, including FRCRN with 3 million uses and MossFormer with 2.5 million uses, optimized for real-world scenarios. It also offers model optimization tools, multi-format audio support, the SpeechScore evaluation toolkit, and user-friendly interfaces, catering to researchers, developers, and end-users. Its rapid adoption attracting 3000 GitHub stars and 239 forks highlights its academic and industrial impact. This paper details ClearerVoice-Studio&#39;s capabilities, architectures, training strategies, benchmarks, community impact, and future plan. Source code is available at this https URL .", "authors": ["Authors:Shengkui Zhao", "Zexu Pan", "Bin Ma"], "categories": ["Sound"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2506.19398", "pdf_url": "https://arxiv.org/pdf/2506.19398", "github_repo": "https://github.com/modelscope/ClearerVoice-Studio", "source": "github_org"}, {"id": "2506.16141", "date": "2025-06-23", "title": "GRPO-CARE: Consistency-Aware Reinforcement Learning for Multimodal Reasoning", "abstract": "Recent reinforcement learning approaches, such as outcome-supervised GRPO,\nhave advanced Chain-of-Thought reasoning in large language models (LLMs), yet\ntheir adaptation to multimodal LLMs (MLLMs) is unexplored. To address the lack\nof rigorous evaluation for MLLM post-training methods, we introduce\nSEED-Bench-R1, a benchmark with complex real-world videos requiring balanced\nperception and reasoning. It offers a large training set and evaluates\ngeneralization across three escalating challenges: in-distribution,\ncross-environment, and cross-environment-task scenarios. Using SEED-Bench-R1,\nwe find that standard GRPO, while improving answer accuracy, often reduces\nlogical coherence between reasoning steps and answers, with only a 57.9%\nconsistency rate. This stems from reward signals focusing solely on final\nanswers, encouraging shortcuts, and strict KL penalties limiting exploration.To\naddress this, we propose GRPO-CARE, a consistency-aware RL framework optimizing\nboth answer correctness and reasoning coherence without explicit supervision.\nGRPO-CARE introduces a two-tiered reward: (1) a base reward for answer\ncorrectness, and (2) an adaptive consistency bonus, computed by comparing the\nmodel's reasoning-to-answer likelihood (via a slowly-evolving reference model)\nagainst group peers.This dual mechanism amplifies rewards for reasoning paths\nthat are both correct and logically consistent. Replacing KL penalties with\nthis adaptive bonus, GRPO-CARE outperforms standard GRPO on SEED-Bench-R1,\nachieving a 6.7% performance gain on the hardest evaluation level and a 24.5%\nimprovement in consistency. It also shows strong transferability, improving\nmodel performance across diverse video understanding benchmarks. Our work\ncontributes a systematically designed benchmark and a generalizable\npost-training framework, advancing the development of more interpretable and\nrobust MLLMs.", "authors": ["Yi Chen", "Yuying Ge", "Rui Wang", "Yixiao Ge", "Junhao Cheng"], "categories": ["cs.CV", "cs.AI", "cs.CL", "cs.LG"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2506.16141", "pdf_url": "https://arxiv.org/pdf/2506.16141", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.18841", "date": "2025-06-23", "title": "LongWriter-Zero: Mastering Ultra-Long Text Generation via Reinforcement Learning", "abstract": "Ultra-long generation by large language models (LLMs) is a widely demanded scenario, yet it remains a significant challenge due to their maximum generation length limit and overall quality degradation as sequence length increases. Previous approaches, exemplified by LongWriter, typically rely on &#39;&#39;teaching&#39;&#39;, which involves supervised fine-tuning (SFT) on synthetic long-form outputs. However, this strategy heavily depends on synthetic SFT data, which is difficult and costly to construct, often lacks coherence and consistency, and tends to be overly artificial and structurally monotonous. In this work, we propose an incentivization-based approach that, starting entirely from scratch and without relying on any annotated or synthetic data, leverages reinforcement learning (RL) to foster the emergence of ultra-long, high-quality text generation capabilities in LLMs. We perform RL training starting from a base model, similar to R1-Zero, guiding it to engage in reasoning that facilitates planning and refinement during the writing process. To support this, we employ specialized reward models that steer the LLM towards improved length control, writing quality, and structural formatting. Experimental evaluations show that our LongWriter-Zero model, trained from Qwen2.5-32B, consistently outperforms traditional SFT methods on long-form writing tasks, achieving state-of-the-art results across all metrics on WritingBench and Arena-Write, and even surpassing 100B+ models such as DeepSeek R1 and Qwen3-235B. We open-source our data and model checkpoints under this https URL", "authors": ["Authors:Yuhao Wu", "Yushi Bai", "Zhiqiang Hu", "Roy Ka-Wei Lee", "Juanzi Li"], "categories": ["Computation"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2506.18841", "pdf_url": "https://arxiv.org/pdf/2506.18841", "github_repo": "https://github.com/THUDM/LongWriter", "source": "github_org"}, {"id": "2506.15442", "date": "2025-06-19", "title": "Hunyuan3D 2.1: From Images to High-Fidelity 3D Assets with Production-Ready PBR Material", "abstract": "3D AI-generated content (AIGC) is a passionate field that has significantly\naccelerated the creation of 3D models in gaming, film, and design. Despite the\ndevelopment of several groundbreaking models that have revolutionized 3D\ngeneration, the field remains largely accessible only to researchers,\ndevelopers, and designers due to the complexities involved in collecting,\nprocessing, and training 3D models. To address these challenges, we introduce\nHunyuan3D 2.1 as a case study in this tutorial. This tutorial offers a\ncomprehensive, step-by-step guide on processing 3D data, training a 3D\ngenerative model, and evaluating its performance using Hunyuan3D 2.1, an\nadvanced system for producing high-resolution, textured 3D assets. The system\ncomprises two core components: the Hunyuan3D-DiT for shape generation and the\nHunyuan3D-Paint for texture synthesis. We will explore the entire workflow,\nincluding data preparation, model architecture, training strategies, evaluation\nmetrics, and deployment. By the conclusion of this tutorial, you will have the\nknowledge to finetune or develop a robust 3D generative model suitable for\napplications in gaming, virtual reality, and industrial design.", "authors": ["Team Hunyuan3D", "Shuhui Yang", "Mingxin Yang", "Yifei Feng", "Xin Huang"], "categories": ["cs.CV", "cs.AI"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2506.15442", "pdf_url": "https://arxiv.org/pdf/2506.15442", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.13585", "date": "2025-06-17", "title": "MiniMax-M1: Scaling Test-Time Compute Efficiently with Lightning Attention", "abstract": "We introduce MiniMax-M1, the world's first open-weight, large-scale\nhybrid-attention reasoning model. MiniMax-M1 is powered by a hybrid\nMixture-of-Experts (MoE) architecture combined with a lightning attention\nmechanism. The model is developed based on our previous MiniMax-Text-01 model,\nwhich contains a total of 456 billion parameters with 45.9 billion parameters\nactivated per token. The M1 model natively supports a context length of 1\nmillion tokens, 8x the context size of DeepSeek R1. Furthermore, the lightning\nattention mechanism in MiniMax-M1 enables efficient scaling of test-time\ncompute. These properties make M1 particularly suitable for complex tasks that\nrequire processing long inputs and thinking extensively. MiniMax-M1 is trained\nusing large-scale reinforcement learning (RL) on diverse problems including\nsandbox-based, real-world software engineering environments. In addition to\nM1's inherent efficiency advantage for RL training, we propose CISPO, a novel\nRL algorithm to further enhance RL efficiency. CISPO clips importance sampling\nweights rather than token updates, outperforming other competitive RL variants.\nCombining hybrid-attention and CISPO enables MiniMax-M1's full RL training on\n512 H800 GPUs to complete in only three weeks, with a rental cost of just\n$534,700. We release two versions of MiniMax-M1 models with 40K and 80K\nthinking budgets respectively, where the 40K model represents an intermediate\nphase of the 80K training. Experiments on standard benchmarks show that our\nmodels are comparable or superior to strong open-weight models such as the\noriginal DeepSeek-R1 and Qwen3-235B, with particular strengths in complex\nsoftware engineering, tool utilization, and long-context tasks. We publicly\nrelease MiniMax-M1 at https://github.com/MiniMax-AI/MiniMax-M1.", "authors": ["MiniMax", ":", "Aili Chen", "Aonian Li", "Bangwei Gong"], "categories": ["cs.CL", "cs.LG"], "companies": ["MiniMax"], "abs_url": "https://arxiv.org/abs/2506.13585", "pdf_url": "https://arxiv.org/pdf/2506.13585", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.10182", "date": "2025-06-13", "title": "Improving Personalized Search with Regularized Low-Rank Parameter Updates", "abstract": "Personalized vision-language retrieval seeks to recognize new concepts (e.g.\n\"my dog Fido\") from only a few examples. This task is challenging because it\nrequires not only learning a new concept from a few images, but also\nintegrating the personal and general knowledge together to recognize the\nconcept in different contexts. In this paper, we show how to effectively adapt\nthe internal representation of a vision-language dual encoder model for\npersonalized vision-language retrieval. We find that regularized low-rank\nadaption of a small set of parameters in the language encoder's final layer\nserves as a highly effective alternative to textual inversion for recognizing\nthe personal concept while preserving general knowledge. Additionally, we\nexplore strategies for combining parameters of multiple learned personal\nconcepts, finding that parameter addition is effective. To evaluate how well\ngeneral knowledge is preserved in a finetuned representation, we introduce a\nmetric that measures image retrieval accuracy based on captions generated by a\nvision language model (VLM). Our approach achieves state-of-the-art accuracy on\ntwo benchmarks for personalized image retrieval with natural language queries -\nDeepFashion2 and ConCon-Chi - outperforming the prior art by 4%-22% on personal\nretrievals.", "authors": ["Fiona Ryan", "Josef Sivic", "Fabian Caba Heilbron", "Judy Hoffman", "James M. Rehg"], "categories": ["cs.CV"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2506.10182", "pdf_url": "https://arxiv.org/pdf/2506.10182", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.09980", "date": "2025-06-12", "title": "Efficient Part-level 3D Object Generation via Dual Volume Packing", "abstract": "Recent progress in 3D object generation has greatly improved both the quality\nand efficiency. However, most existing methods generate a single mesh with all\nparts fused together, which limits the ability to edit or manipulate individual\nparts. A key challenge is that different objects may have a varying number of\nparts. To address this, we propose a new end-to-end framework for part-level 3D\nobject generation. Given a single input image, our method generates\nhigh-quality 3D objects with an arbitrary number of complete and semantically\nmeaningful parts. We introduce a dual volume packing strategy that organizes\nall parts into two complementary volumes, allowing for the creation of complete\nand interleaved parts that assemble into the final object. Experiments show\nthat our model achieves better quality, diversity, and generalization than\nprevious image-based part-level generation methods.", "authors": ["Jiaxiang Tang", "Ruijie Lu", "Zhaoshuo Li", "Zekun Hao", "Xuan Li"], "categories": ["cs.CV"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2506.09980", "pdf_url": "https://arxiv.org/pdf/2506.09980", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.10857", "date": "2025-06-12", "title": "VRBench: A Benchmark for Multi-Step Reasoning in Long Narrative Videos", "abstract": "We present VRBench, the first long narrative video benchmark crafted for evaluating large models&#39; multi-step reasoning capabilities, addressing limitations in existing evaluations that overlook temporal reasoning and procedural validity. It comprises 960 long videos (with an average duration of 1.6 hours), along with 8,243 human-labeled multi-step question-answering pairs and 25,106 reasoning steps with timestamps. These videos are curated via a multi-stage filtering process including expert inter-rater reviewing to prioritize plot coherence. We develop a human-AI collaborative framework that generates coherent reasoning chains, each requiring multiple temporally grounded steps, spanning seven types (e.g., event attribution, implicit inference). VRBench designs a multi-phase evaluation pipeline that assesses models at both the outcome and process levels. Apart from the MCQs for the final results, we propose a progress-level LLM-guided scoring metric to evaluate the quality of the reasoning chain from multiple dimensions comprehensively. Through extensive evaluations of 12 LLMs and 19 VLMs on VRBench, we undertake a thorough analysis and provide valuable insights that advance the field of multi-step reasoning.", "authors": ["Authors:Jiashuo Yu", "Yue Wu", "Meng Chu", "Zhifei Ren", "Zizheng Huang"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2506.10857", "pdf_url": "https://arxiv.org/pdf/2506.10857", "github_repo": "https://github.com/OpenGVLab/VRBench", "source": "github_org"}, {"id": "2506.10941", "date": "2025-06-12", "title": "VINCIE: Unlocking In-context Image Editing from Video", "abstract": "In-context image editing aims to modify images based on a contextual sequence comprising text and previously generated images. Existing methods typically depend on task-specific pipelines and expert models (e.g., segmentation and inpainting) to curate training data. In this work, we explore whether an in-context image editing model can be learned directly from videos. We introduce a scalable approach to annotate videos as interleaved multimodal sequences. To effectively learn from this data, we design a block-causal diffusion transformer trained on three proxy tasks: next-image prediction, current segmentation prediction, and next-segmentation prediction. Additionally, we propose a novel multi-turn image editing benchmark to advance research in this area. Extensive experiments demonstrate that our model exhibits strong in-context image editing capabilities and achieves state-of-the-art results on two multi-turn image editing benchmarks. Despite being trained exclusively on videos, our model also shows promising abilities in multi-concept composition, story generation, and chain-of-editing applications.", "authors": ["Authors:Leigang Qu", "Feng Cheng", "Ziyan Yang", "Qi Zhao", "Shanchuan Lin"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.10941", "pdf_url": "https://arxiv.org/pdf/2506.10941", "github_repo": "https://github.com/bytedance-seed/VINCIE", "source": "github_org"}, {"id": "2506.09990", "date": "2025-06-11", "title": "Chain-of-Action: Trajectory Autoregressive Modeling for Robotic Manipulation", "abstract": "We present Chain-of-Action (CoA), a novel visuo-motor policy paradigm built upon Trajectory Autoregressive Modeling. Unlike conventional approaches that predict next step action(s) forward, CoA generates an entire trajectory by explicit backward reasoning with task-specific goals through an action-level Chain-of-Thought (CoT) process. This process is unified within a single autoregressive structure: (1) the first token corresponds to a stable keyframe action that encodes the task-specific goals; and (2) subsequent action tokens are generated autoregressively, conditioned on the initial keyframe and previously predicted actions. This backward action reasoning enforces a global-to-local structure, allowing each local action to be tightly constrained by the final goal. To further realize the action reasoning structure, CoA incorporates four complementary designs: continuous action token representation; dynamic stopping for variable-length trajectory generation; reverse temporal ensemble; and multi-token prediction to balance action chunk modeling with global structure. As a result, CoA gives strong spatial generalization capabilities while preserving the flexibility and simplicity of a visuo-motor policy. Empirically, we observe CoA achieves the state-of-the-art performance across 60 RLBench tasks and 8 real-world manipulation tasks.", "authors": ["Authors:Wenbo Zhang", "Tianrun Hu", "Hanbo Zhang", "Yanyuan Qiao", "Yuchu Qin"], "categories": ["Robotics"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.09990", "pdf_url": "https://arxiv.org/pdf/2506.09990", "github_repo": "https://github.com/bytedance-seed/Chain-of-Action", "source": "github_org"}, {"id": "2506.07636", "date": "2025-06-09", "title": "SWE-Dev: Building Software Engineering Agents with Training and Inference Scaling", "abstract": "Large language models (LLMs) have advanced rapidly from conversational problem solving to addressing real-world tasks involving tool use, such as software engineering (SWE). Recent LLM-powered toolkits, such as OpenAI Codex and Cursor, have offered end-to-end automation of the software development process. However, building effective SWE agents remains challenging due to the lack of high-quality training data and effective test cases. To address this issue, we present SWE-Dev, an SWE agent built upon open-source LLMs. First, we develop a robust pipeline to synthesize test cases for patch evaluation. Second, we scale up agent trajectories to construct the training data for building SWE-Dev. Experiments on the SWE-bench-Verified benchmark show that the SWE-Dev models can achieve top performance among all open SWE agents. Specifically, the success rates of the SWE-Dev 7B and 32B parameter models reach 23.4% and 36.6%, respectively, outperforming state-of-the-art open-source models. All code, models, and datasets are publicly available at this https URL .", "authors": ["Authors:Haoran Wang", "Zhenyu Hou", "Yao Wei", "Jie Tang", "Yuxiao Dong"], "categories": ["Artificial"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2506.07636", "pdf_url": "https://arxiv.org/pdf/2506.07636", "github_repo": "https://github.com/THUDM/SWE-Dev", "source": "github_org"}, {"id": "2506.05083", "date": "2025-06-06", "title": "SeedEdit 3.0: Fast and High-Quality Generative Image Editing", "abstract": "We introduce SeedEdit 3.0, in companion with our T2I model Seedream 3.0 [22],\nwhich significantly improves over our previous version [27] in both aspects of\nedit instruction following and image content (e.g., ID/IP) preservation on real\nimage inputs. Additional to model upgrading with T2I, in this report, we\npresent several key improvements. First, we develop an enhanced data curation\npipeline with a meta-info paradigm and meta-info embedding strategy that help\nmix images from multiple data sources. This allows us to scale editing data\neffectively, and meta information is helpfult to connect VLM with diffusion\nmodel more closely. Second, we introduce a joint learning pipeline for\ncomputing a diffusion loss and a reward loss. Finally, we evaluate SeedEdit 3.0\non our testing benchmarks, for real image editing, where it achieves a best\ntrade-off between multiple aspects, yielding a high usability rate of 56.1%,\ncompared to SeedEdit 1.6 (38.4%), GPT4o (37.1%) and Gemini 2.0 (30.3%).", "authors": ["Peng Wang", "Yichun Shi", "Xiaochen Lian", "Zhonghua Zhai", "Xin Xia"], "categories": ["cs.CV"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.05083", "pdf_url": "https://arxiv.org/pdf/2506.05083", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.06235", "date": "2025-06-06", "title": "Optimizing Cloud-to-GPU Throughput for Deep Learning With Earth Observation Data", "abstract": "Training deep learning models on petabyte-scale Earth observation (EO) data requires separating compute resources from data storage. However, standard PyTorch data loaders cannot keep modern GPUs utilized w
