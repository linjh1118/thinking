hub_repo": "https://github.com/meituan-longcat/LongCat-Next", "source": "github_org"}, {"id": "2603.27064", "date": "2026-03-28", "title": "ChartNet: A Million-Scale, High-Quality Multimodal Dataset for Robust Chart Understanding", "abstract": "Understanding charts requires models to jointly reason over geometric visual patterns, structured numerical data, and natural language -- a capability where current vision-language models (VLMs) remain limited. We introduce ChartNet, a high-quality, million-scale multimodal dataset designed to advance chart interpretation and reasoning. ChartNet leverages a novel code-guided synthesis pipeline to generate 1.5 million diverse chart samples spanning 24 chart types and 6 plotting libraries. Each sample consists of five aligned components: plotting code, rendered chart image, data table, natural language summary, and question-answering with reasoning, providing fine-grained cross-modal alignment. To capture the full spectrum of chart comprehension, ChartNet additionally includes specialized subsets encompassing human annotated data, real-world data, safety, and grounding. Moreover, a rigorous quality-filtering pipeline ensures visual fidelity, semantic accuracy, and diversity across chart representations. Fine-tuning on ChartNet consistently improves results across benchmarks, demonstrating its utility as large-scale supervision for multimodal models. As the largest open-source dataset of its kind, ChartNet aims to support the development of foundation models with robust and generalizable capabilities for data visualization understanding. The dataset is publicly available at this https URL", "authors": ["Authors:Jovana Kondic", "Pengyuan Li", "Dhiraj Joshi", "Isaac Sanchez", "Ben Wiesel"], "categories": ["Computer"], "companies": ["IBM"], "abs_url": "https://arxiv.org/abs/2603.27064", "pdf_url": "https://arxiv.org/pdf/2603.27064", "github_repo": "https://github.com/ibm-granite/granite-vision-models", "source": "github_org"}, {"id": "2603.25001", "date": "2026-03-26", "title": "Rethinking Failure Attribution in Multi-Agent Systems: A Multi-Perspective Benchmark and Evaluation", "abstract": "Failure attribution is essential for diagnosing and improving multi-agent systems (MAS), yet existing benchmarks and methods largely assume a single deterministic root cause for each failure. In practice, MAS failures often admit multiple plausible attributions due to complex inter-agent dependencies and ambiguous execution trajectories. We revisit MAS failure attribution from a multi-perspective standpoint and propose multi-perspective failure attribution, a practical paradigm that explicitly accounts for attribution ambiguity. To support this setting, we introduce MP-Bench, the first benchmark designed for multi-perspective failure attribution in MAS, along with a new evaluation protocol tailored to this paradigm. Through extensive experiments, we find that prior conclusions suggesting LLMs struggle with failure attribution are largely driven by limitations in existing benchmark designs. Our results highlight the necessity of multi-perspective benchmarks and evaluation protocols for realistic and reliable MAS debugging.", "authors": ["Authors:Yeonjun In", "Mehrab Tanjim", "Jayakumar Subramanian", "Sungchul Kim", "Uttaran Bhattacharya"], "categories": ["Artificial"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2603.25001", "pdf_url": "https://arxiv.org/pdf/2603.25001", "github_repo": "https://github.com/adobe-research/multi-agent-eval-bench", "source": "github_org"}, {"id": "2603.25040", "date": "2026-03-26", "title": "Intern-S1-Pro: Scientific Multimodal Foundation Model at Trillion Scale", "abstract": "We introduce Intern-S1-Pro, the first one-trillion-parameter scientific multimodal foundation model. Scaling to this unprecedented size, the model delivers a comprehensive enhancement across both general and scientific domains. Beyond stronger reasoning and image-text understanding capabilities, its intelligence is augmented with advanced agent capabilities. Simultaneously, its scientific expertise has been vastly expanded to master over 100 specialized tasks across critical science fields, including chemistry, materials, life sciences, and earth sciences. Achieving this massive scale is made possible by the robust infrastructure support of XTuner and LMDeploy, which facilitates highly efficient Reinforcement Learning (RL) training at the 1-trillion parameter level while ensuring strict precision consistency between training and inference. By seamlessly integrating these advancements, Intern-S1-Pro further fortifies the fusion of general and specialized intelligence, working as a Specializable Generalist, demonstrating its position in the top tier of open-source models for general capabilities, while outperforming proprietary models in the depth of specialized scientific tasks.", "authors": ["Authors:Yicheng Zou", "Dongsheng Zhu", "Lin Zhu", "Tong Zhu", "Yunhua Zhou"], "categories": ["Machine"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2603.25040", "pdf_url": "https://arxiv.org/pdf/2603.25040", "github_repo": "https://github.com/InternLM/Intern-S1", "source": "github_org"}, {"id": "2603.19461", "date": "2026-03-23", "title": "Hyperagents", "abstract": "Self-improving AI systems aim to reduce reliance on human engineering by learning to improve their own learning and problem-solving processes. Existing approaches to self-improvement rely on fixed, handcrafted meta-level mechanisms, fundamentally limiting how fast such systems can improve. The Darwin Gödel Machine (DGM) demonstrates open-ended self-improvement in coding by repeatedly generating and evaluating self-modified variants. Because both evaluation and self-modification are coding tasks, gains in coding ability can translate into gains in self-improvement ability. However, this alignment does not generally hold beyond coding domains. We introduce \\textbf{hyperagents}, self-referential agents that integrate a task agent (which solves the target task) and a meta agent (which modifies itself and the task agent) into a single editable program. Crucially, the meta-level modification procedure is itself editable, enabling metacognitive self-modification, improving not only the task-solving behavior, but also the mechanism that generates future improvements. We instantiate this framework by extending DGM to create DGM-Hyperagents (DGM-H), eliminating the assumption of domain-specific alignment between task performance and self-modification skill to potentially support self-accelerating progress on any computable task. Across diverse domains, the DGM-H improves performance over time and outperforms baselines without self-improvement or open-ended exploration, as well as prior self-improving systems. Furthermore, the DGM-H improves the process by which it generates new agents (e.g., persistent memory, performance tracking), and these meta-level improvements transfer across domains and accumulate across runs. DGM-Hyperagents offer a glimpse of open-ended AI systems that do not merely search for better solutions, but continually improve their search for how to improve.", "authors": ["Jenny Zhang", "Bingchen Zhao", "Wannan Yang", "Jakob Foerster", "Jeff Clune"], "categories": ["cs.AI"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2603.19461", "pdf_url": "https://arxiv.org/pdf/2603.19461", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.21065", "date": "2026-03-22", "title": "LongCat-Flash-Prover: Advancing Native Formal Reasoning via Agentic Tool-Integrated Reinforcement Learning", "abstract": "We introduce LongCat-Flash-Prover, a flagship 560-billion-parameter open-source Mixture-of- Experts (MoE) model that advances Native Formal Reasoning in Lean4 through agentic tool-integrated reasoning (TIR). We decompose the native formal reasoning task into three independent formal capabilities, i.e., auto-formalization, sketching, and proving. To facilitate these capabilities, we propose a Hybrid-Experts Iteration Framework to expand high-quality task trajectories, including generating a formal statement based on a given informal problem, producing a whole-proof directly from the statement, or a lemma-style sketch. During agentic RL, we present a Hierarchical Importance Sampling Policy Optimization (HisPO) algorithm, which aims to stabilize the MoE model training on such long-horizon tasks. It employs a gradient masking strategy that accounts for the policy staleness and the inherent train-inference engine discrepancies at both sequence and token levels. Additionally, we also incorporate theorem consistency and legality detection mechanisms to eliminate reward hacking issues. Extensive evaluations show that our LongCat-Flash-Prover sets a new state-of-the-art for open-weights models in both auto-formalization and theorem proving. Demonstrating remarkable sample efficiency, it achieves a 97.1% pass rate on MiniF2F-Test using only 72 inference budget per problem. On more challenging benchmarks, it solves 70.8% of ProverBench and 41.5% of PutnamBench with no more than 220 attempts per problem, significantly outperforming existing open-weights baselines.", "authors": ["Authors:Jianing Wang", "Jianfei Zhang", "Qi Guo", "Linsen Guo", "Rumei Li"], "categories": ["Artificial"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2603.21065", "pdf_url": "https://arxiv.org/pdf/2603.21065", "github_repo": "https://github.com/meituan-longcat/LongCat-Flash-Prover", "source": "github_org"}, {"id": "2603.16870", "date": "2026-03-17", "title": "Demystifying Video Reasoning", "abstract": "Recent advances in video generation have revealed an unexpected phenomenon: diffusion-based video models exhibit non-trivial reasoning capabilities. Prior work attributes this to a Chain-of-Frames (CoF) mechanism, where reasoning is assumed to unfold sequentially across video frames. In this work, we challenge this assumption and uncover a fundamentally different mechanism. We show that reasoning in video models instead primarily emerges along the diffusion denoising steps. Through qualitative analysis and targeted probing experiments, we find that models explore multiple candidate solutions in early denoising steps and progressively converge to a final answer, a process we term Chain-of-Steps (CoS). Beyond this core mechanism, we identify several emergent reasoning behaviors critical to model performance: (1) working memory, enabling persistent reference; (2) self-correction and enhancement, allowing recovery from incorrect intermediate solutions; and (3) perception before action, where early steps establish semantic grounding and later steps perform structured manipulation. During a diffusion step, we further uncover self-evolved functional specialization within Diffusion Transformers, where early layers encode dense perceptual structure, middle layers execute reasoning, and later layers consolidate latent representations. Motivated by these insights, we present a simple training-free strategy as a proof-of-concept, demonstrating how reasoning can be improved by ensembling latent trajectories from identical models with different random seeds. Overall, our work provides a systematic understanding of how reasoning emerges in video generation models, offering a foundation to guide future research in better exploiting the inherent reasoning dynamics of video models as a new substrate for intelligence.", "authors": ["Authors:Ruisi Wang", "Zhongang Cai", "Fanyi Pu", "Junxiang Xu", "Wanqi Yin"], "categories": ["Computer"], "companies": ["SenseTime"], "abs_url": "https://arxiv.org/abs/2603.16870", "pdf_url": "https://arxiv.org/pdf/2603.16870", "github_repo": "https://github.com/OpenSenseNova/Demystifying_Video_Reasoning", "source": "github_org"}, {"id": "2603.12893", "date": "2026-03-16", "title": "Finite Difference Flow Optimization for RL Post-Training of Text-to-Image Models", "abstract": "Reinforcement learning (RL) has become a standard technique for post-training diffusion-based image synthesis models, as it enables learning from reward signals to explicitly improve desirable aspects such as image quality and prompt alignment. In this paper, we propose an online RL variant that reduces the variance in the model updates by sampling paired trajectories and pulling the flow velocity in the direction of the more favorable image. Unlike existing methods that treat each sampling step as a separate policy action, we consider the entire sampling process as a single action. We experiment with both high-quality vision language models and off-the-shelf quality metrics for rewards, and evaluate the outputs using a broad set of metrics. Our method converges faster and yields higher output quality and prompt alignment than previous approaches.", "authors": ["David McAllister", "Miika Aittala", "Tero Karras", "Janne Hellsten", "Angjoo Kanazawa"], "categories": ["cs.CV", "cs.AI", "cs.LG", "cs.NE"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2603.12893", "pdf_url": "https://arxiv.org/pdf/2603.12893", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.13224", "date": "2026-03-16", "title": "Visual-ERM: Reward Modeling for Visual Equivalence", "abstract": "Vision-to-code tasks require models to reconstruct structured visual inputs, such as charts, tables, and SVGs, into executable or structured representations with high visual fidelity. While recent Large Vision Language Models (LVLMs) achieve strong results via supervised fine-tuning, reinforcement learning remains challenging due to misaligned reward signals. Existing rewards either rely on textual rules or coarse visual embedding similarity, both of which fail to capture fine-grained visual discrepancies and are vulnerable to reward hacking. We propose Visual Equivalence Reward Model (Visual-ERM), a multimodal generative reward model that provides fine-grained, interpretable, and task-agnostic feedback to evaluate vision-to-code quality directly in the rendered visual space. Integrated into RL, Visual-ERM improves Qwen3-VL-8B-Instruct by +8.4 on chart-to-code and yields consistent gains on table and SVG parsing (+2.7, +4.1 on average), and further strengthens test-time scaling via reflection and revision. We also introduce VisualCritic-RewardBench (VC-RewardBench), a benchmark for judging fine-grained image-to-image discrepancies on structured visual data, where Visual-ERM at 8B decisively outperforms Qwen3-VL-235B-Instruct and approaches leading closed-source models. Our results suggest that fine-grained visual reward supervision is both necessary and sufficient for vision-to-code RL, regardless of task specificity.", "authors": ["Ziyu Liu", "Shengyuan Ding", "Xinyu Fang", "Xuanlang Dai", "Penghui Yang"], "categories": ["cs.CV", "cs.AI"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2603.13224", "pdf_url": "https://arxiv.org/pdf/2603.13224", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.15031", "date": "2026-03-16", "title": "Attention Residuals", "abstract": "Residual connections with PreNorm are standard in modern LLMs, yet they accumulate all layer outputs with fixed unit weights. This uniform aggregation causes uncontrolled hidden-state growth with depth, progressively diluting each layer&#39;s contribution. We propose Attention Residuals (AttnRes), which replaces this fixed accumulation with softmax attention over preceding layer outputs, allowing each layer to selectively aggregate earlier representations with learned, input-dependent weights. To address the memory and communication overhead of attending over all preceding layer outputs for large-scale model training, we introduce Block AttnRes, which partitions layers into blocks and attends over block-level representations, reducing the memory footprint while preserving most of the gains of full AttnRes. Combined with cache-based pipeline communication and a two-phase computation strategy, Block AttnRes becomes a practical drop-in replacement for standard residual connections with minimal overhead. Scaling law experiments confirm that the improvement is consistent across model sizes, and ablations validate the benefit of content-dependent depth-wise selection. We further integrate AttnRes into the Kimi Linear architecture (48B total / 3B activated parameters) and pre-train on 1.4T tokens, where AttnRes mitigates PreNorm dilution, yielding more uniform output magnitudes and gradient distribution across depth, and improves downstream performance across all evaluated tasks.", "authors": ["Authors:Kimi Team: Guangyu Chen", "Yu Zhang", "Jianlin Su", "Weixin Xu", "Siyuan Pan"], "categories": ["Computation"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2603.15031", "pdf_url": "https://arxiv.org/pdf/2603.15031", "github_repo": "https://github.com/MoonshotAI/Attention-Residuals", "source": "github_org"}, {"id": "2603.11601", "date": "2026-03-13", "title": "See, Symbolize, Act: Grounding VLMs with Spatial Representations for Better Gameplay", "abstract": "Vision-Language Models (VLMs) excel at describing visual scenes, yet struggle to translate perception into precise, grounded actions. We investigate whether providing VLMs with both the visual frame and the symbolic representation of the scene can improve their performance in interactive environments. We evaluate three state-of-the-art VLMs across Atari games, VizDoom, and AI2-THOR, comparing frame-only, frame with self-extracted symbols, frame with ground-truth symbols, and symbol-only pipelines. Our results indicate that all models benefit when the symbolic information is accurate. However, when VLMs extract symbols themselves, performance becomes dependent on model capability and scene complexity. We further investigate how accurately VLMs can extract symbolic information from visual inputs and how noise in these symbols affects decision-making and gameplay performance. Our findings reveal that symbolic grounding is beneficial in VLMs only when symbol extraction is reliable, and highlight perception quality as a central bottleneck for future VLM-based agents.", "authors": ["Ashish Baghel", "Paras Chopra"], "categories": ["cs.AI"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2603.11601", "pdf_url": "https://arxiv.org/pdf/2603.11601", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.12201", "date": "2026-03-12", "title": "IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse", "abstract": "Long-context agentic workflows have emerged as a defining use case for large language models, making attention efficiency critical for both inference speed and serving cost. Sparse attention addresses this challenge effectively, and DeepSeek Sparse Attention (DSA) is a representative production-grade solution: a lightweight lightning indexer selects the top-k most relevant tokens per query, reducing core attention from $O(L^2)$ to $O(Lk)$. However, the indexer itself retains $O(L^2)$ complexity and must run independently at every layer, despite the fact that the resulting top-k selections are highly similar across consecutive layers. We present IndexCache, which exploits this cross-layer redundancy by partitioning layers into a small set of Full layers that run their own indexers and a majority of Shared layers that simply reuse the nearest Full layer&#39;s top-k indices. We propose two complementary approaches to determine and optimize this configuration. Training-free IndexCache applies a greedy search algorithm that selects which layers to retain indexers by directly minimizing language modeling loss on a calibration set, requiring no weight updates. Training-aware IndexCache introduces a multi-layer distillation loss that trains each retained indexer against the averaged attention distributions of all layers it serves, enabling even simple interleaved patterns to match full-indexer accuracy. Experimental results on a 30B DSA model show that IndexCache can remove 75% of indexer computations with negligible quality degradation, achieving up to 1.82$\\times$ prefill speedup and 1.48$\\times$ decode speedup compared to standard DSA. These positive results are further confirmed by our preliminary experiments on the production-scale GLM-5 model (Figure 1).", "authors": ["Authors:Yushi Bai", "Qian Dong", "Ting Jiang", "Xin Lv", "Zhengxiao Du"], "categories": ["Computation"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2603.12201", "pdf_url": "https://arxiv.org/pdf/2603.12201", "github_repo": "https://github.com/THUDM/IndexCache", "source": "github_org"}, {"id": "2603.12252", "date": "2026-03-12", "title": "EndoCoT: Scaling Endogenous Chain-of-Thought Reasoning in Diffusion Models", "abstract": "Recently, Multimodal Large Language Models (MLLMs) have been widely integrated into diffusion frameworks primarily as text encoders to tackle complex tasks such as spatial reasoning. However, this paradigm suffers from two critical limitations: (i) MLLMs text encoder exhibits insufficient reasoning depth. Single-step encoding fails to activate the Chain-of-Thought process, which is essential for MLLMs to provide accurate guidance for complex tasks. (ii) The guidance remains invariant during the decoding process. Invariant guidance during decoding prevents DiT from progressively decomposing complex instructions into actionable denoising steps, even with correct MLLM encodings. To this end, we propose Endogenous Chain-of-Thought (EndoCoT), a novel framework that first activates MLLMs&#39; reasoning potential by iteratively refining latent thought states through an iterative thought guidance module, and then bridges these states to the DiT&#39;s denoising process. Second, a terminal thought grounding module is applied to ensure the reasoning trajectory remains grounded in textual supervision by aligning the final state with ground-truth answers. With these two components, the MLLM text encoder delivers meticulously reasoned guidance, enabling the DiT to execute it progressively and ultimately solve complex tasks in a step-by-step manner. Extensive evaluations across diverse benchmarks (e.g., Maze, TSP, VSP, and Sudoku) achieve an average accuracy of 92.1%, outperforming the strongest baseline by 8.3 percentage points. The code and dataset are publicly available at this https URL .", "authors": ["Authors:Xuanlang Dai", "Yujie Zhou", "Long Xing", "Jiazi Bu", "Xilin Wei"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2603.12252", "pdf_url": "https://arxiv.org/pdf/2603.12252", "github_repo": "https://github.com/InternLM/EndoCoT", "source": "github_org"}, {"id": "2603.09877", "date": "2026-03-11", "title": "InternVL-U: Democratizing Unified Multimodal Models for Understanding, Reasoning, Generation and Editing", "abstract": "Unified multimodal models (UMMs) that integrate understanding, reasoning, generation, and editing face inherent trade-offs between maintaining strong semantic comprehension and acquiring powerful generation capabilities. In this report, we present InternVL-U, a lightweight 4B-parameter UMM that democratizes these capabilities within a unified framework. Guided by the principles of unified contextual modeling and modality-specific modular design with decoupled visual representations, InternVL-U integrates a state-of-the-art Multimodal Large Language Model (MLLM) with a specialized MMDiT-based visual generation head. To further bridge the gap between aesthetic generation and high-level intelligence, we construct a comprehensive data synthesis pipeline targeting high-semantic-density tasks, such as text rendering and scientific reasoning, under a reasoning-centric paradigm that leverages Chain-of-Thought (CoT) to better align abstract user intent with fine-grained visual generation details. Extensive experiments demonstrate that InternVL-U achieves a superior performance - efficiency balance. Despite using only 4B parameters, it consistently outperforms unified baseline models with over 3x larger scales such as BAGEL (14B) on various generation and editing tasks, while retaining strong multimodal understanding and reasoning capabilities.", "authors": ["Changyao Tian", "Danni Yang", "Guanzhou Chen", "Erfei Cui", "Zhaokai Wang"], "categories": ["cs.CV"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2603.09877", "pdf_url": "https://arxiv.org/pdf/2603.09877", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.08398", "date": "2026-03-10", "title": "Revealing Behavioral Plasticity in Large Language Models: A Token-Conditional Perspective", "abstract": "In this work, we reveal that Large Language Models (LLMs) possess intrinsic behavioral plasticity-akin to chameleons adapting their coloration to environmental cues-that can be exposed through token-conditional generation and stabilized via reinforcement learning. Specifically, by conditioning generation on carefully selected token prefixes sampled from responses exhibiting desired behaviors, LLMs seamlessly adapt their behavioral modes at inference time (e.g., switching from step-by-step reasoning to direct answering) without retraining. Based on this insight, we propose Token-Conditioned Reinforcement Learning (ToCoRL), a principled framework that leverages RL to internalize this chameleon-like plasticity, transforming transient inference-time adaptations into stable and learnable behavioral patterns. ToCoRL guides exploration with token-conditional generation and keep enhancing exploitation, enabling emergence of appropriate behaviors. Extensive experiments show that ToCoRL enables precise behavioral control without capability degradation. Notably, we show that large reasoning models, while performing strongly on complex mathematics, can be effectively adapted to excel at factual question answering, which was a capability previously hindered by their step-by-step reasoning patterns.", "authors": ["Liyuan Mao", "Le Yu", "Jing Zhou", "Chujie Zheng", "Bowen Yu"], "categories": ["cs.CL", "cs.AI", "cs.LG"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2603.08398", "pdf_url": "https://arxiv.org/pdf/2603.08398", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.06569", "date": "2026-03-09", "title": "Penguin-VL: Exploring the Efficiency Limits of VLM with LLM-based Vision Encoders", "abstract": "Vision Language Model (VLM) development has largely relied on scaling model size, which hinders deployment on compute-constrained mobile and edge devices such as smartphones and robots. In this work, we explore the performance limits of compact (e.g., 2B and 8B) VLMs. We challenge the prevailing practice that state-of-the-art VLMs must rely on vision encoders initialized via massive contrastive pretraining (e.g., CLIP/SigLIP). We identify an objective mismatch: contrastive learning, optimized for discrimination, enforces coarse and category-level invariances that suppress fine-grained visual cues needed for dense captioning and complex VLM reasoning. To address this issue, we present Penguin-VL, whose vision encoder is initialized from a text-only LLM. Our experiments reveal that Penguin-Encoder serves as a superior alternative to traditional contrastive pretraining, unlocking a higher degree of visual fidelity and data efficiency for multimodal understanding. Across various image and video benchmarks, Penguin-VL achieves performance comparable to leading VLMs (e.g., Qwen3-VL) in mathematical reasoning and surpasses them in tasks such as document understanding, visual knowledge, and multi-perspective video understanding. Notably, these gains are achieved with a lightweight architecture, demonstrating that improved visual representation rather than model scaling is the primary driver of performance. Our ablations show that Penguin-Encoder consistently outperforms contrastive-pretrained encoders, preserving fine-grained spatial and temporal cues that are critical for dense perception and complex reasoning. This makes it a strong drop-in alternative for compute-efficient VLMs and enables high performance in resource-constrained settings. Code: https://github.com/tencent-ailab/Penguin-VL", "authors": ["Boqiang Zhang", "Lei Ke", "Ruihan Yang", "Qi Gao", "Tianyuan Qu"], "categories": ["cs.CV"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2603.06569", "pdf_url": "https://arxiv.org/pdf/2603.06569", "github_repo": "", "source": "daily_arxiv"}, {"id": "2603.07392", "date": "2026-03-08", "title": "Can Large Language Models Keep Up? Benchmarking Online Adaptation to Continual Knowledge Streams", "abstract": "LLMs operating in dynamic real-world contexts often encounter knowledge that evolves continuously or emerges incrementally. To remain accurate and effective, models must adapt to newly arriving information on the fly. We introduce Online Adaptation to Continual Knowledge Streams(OAKS) to evaluate this capability, establishing a benchmark for online adaptation over streaming, continually updating knowledge. Specifically, the benchmark is structured as a sequence of fine-grained context chunks where facts change dynamically across time intervals. OAKS comprises two datasets: OAKS-BABI and OAKS-Novel, where individual facts evolve multiple times across context chunks. These datasets include dense annotations to measure whether models track changes accurately. Evaluating 14 models with varied inference approaches, we observe significant limitations in current methodologies. Both state-of-the-art models and agentic memory systems fail to adapt robustly on OAKS, demonstrating delays in state-tracking and susceptibility to distraction within streaming environments.", "authors": ["Authors:Jiyeon Kim", "Hyunji Lee", "Dylan Zhou", "Sue Hyun Park", "Seunghyun Yoon"], "categories": ["Computation"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2603.07392", "pdf_url": "https://arxiv.org/pdf/2603.07392", "github_repo": "https://github.com/adobe-research/OAKS", "source": "github_org"}, {"id": "2603.05493", "date": "2026-03-05", "title": "cuRoboV2: Dynamics-Aware Motion Generation with Depth-Fused Distance Fields for High-DoF Robots", "abstract": "Effective robot autonomy requires motion generation that is safe, feasible, and reactive. Current methods are fragmented: fast planners output physically unexecutable trajectories, reactive controllers struggle with high-fidelity perception, and existing solvers fail on high-DoF systems. We present cuRoboV2, a unified framework with three key innovations: (1) B-spline trajectory optimization that enforces smoothness and torque limits; (2) a GPU-native TSDF/ESDF perception pipeline that generates dense signed distance fields covering the full workspace, unlike existing methods that only provide distances within sparsely allocated blocks, up to 10x faster and in 8x less memory than the state-of-the-art at manipulation scale, with up to 99% collision recall; and (3) scalable GPU-native whole-body computation, namely topology-aware kinematics, differentiable inverse dynamics, and map-reduce self-collision, that achieves up to 61x speedup while also extending to high-DoF humanoids (where previous GPU implementations fail). On benchmarks, cuRoboV2 achieves 99.7% success under 3kg payload (where baselines achieve only 72--77%), 99.6% collision-free IK on a 48-DoF humanoid (where prior methods fail entirely), and 89.5% retargeting constraint satisfaction (vs. 61% for PyRoki); these collision-free motions yield locomotion policies with 21% lower tracking error than PyRoki and 12x lower cross-seed variance than GMR. A ground-up codebase redesign for discoverability enabled LLM coding assistants to author up to 73% of new modules, including hand-optimized CUDA kernels, demonstrating that well-structured robotics code can unlock productive human-LLM collaboration. Together, these advances provide a unified, dynamics-aware motion generation stack that scales from single-arm manipulators to full humanoids. Code is available at this https URL .", "authors": ["Authors:Balakumar Sundaralingam", "Adithyavairavan Murali", "Stan Birchfield"], "categories": ["Robotics"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2603.05493", "pdf_url": "https://arxiv.org/pdf/2603.05493", "github_repo": "https://github.com/NVlabs/curobo", "source": "github_org"}, {"id": "2603.03985", "date": "2026-03-04", "title": "RIVER: A Real-Time Interaction Benchmark for Video LLMs", "abstract": "The rapid advancement of multimodal large language models has demonstrated impressive capabilities, yet nearly all operate in an offline paradigm, hindering real-time interactivity. Addressing this gap, we introduce the Real-tIme Video intERaction Bench (RIVER Bench), designed for evaluating online video comprehension. RIVER Bench introduces a novel framework comprising Retrospective Memory, Live-Perception, and Proactive Anticipation tasks, closely mimicking interactive dialogues rather than responding to entire videos at once. We conducted detailed annotations using videos from diverse sources and varying lengths, and precisely defined the real-time interactive format. Evaluations across various model categories reveal that while offline models perform well in single question-answering tasks, they struggle with real-time processing. Addressing the limitations of existing models in online video interaction, especially their deficiencies in long-term memory and future perception, we proposed a general improvement method that enables models to interact with users more flexibly in real time. We believe this work will significantly advance the development of real-time interactive video understanding models and inspire future research in this emerging field. Datasets and code are publicly available at this https URL .", "authors": ["Authors:Yansong Shi", "Qingsong Zhao", "Tianxiang Jiang", "Xiangyu Zeng", "Yi Wang"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2603.03985", "pdf_url": "https://arxiv.org/pdf/2603.03985", "github_repo": "https://github.com/OpenGVLab/RIVER", "source": "github_org"}, {"id": "2603.04291", "date": "2026-03-04", "title": "CubeComposer: Spatio-Temporal Autoregressive 4K 360° Video Generation from Perspective Video", "abstract": "Generating high-quality 360° panoramic videos from perspective input is one of the crucial applications for virtual reality (VR), whereby high-resolution videos are especially important for immersive experience. Existing methods are constrained by computational limitations of vanilla diffusion models, only supporting $\\leq$ 1K resolution native generation and relying on suboptimal post super-resolution to increase resolution. We introduce CubeComposer, a novel spatio-temporal autoregressive diffusion model that natively generates 4K-resolution 360° videos. By decomposing videos into cubemap representations with six faces, CubeComposer autoregressively synthesizes content in a well-planned spatio-temporal order, reducing memory demands while enabling high-resolution output. Specifically, to address challenges in multi-dimensional autoregression, we propose: (1) a spatio-temporal autoregressive strategy that orchestrates 360° video generation across cube faces and time windows for coherent synthesis; (2) a cube face context management mechanism, equipped with a sparse context attention design to improve efficiency; and (3) continuity-aware techniques, including cube-aware positional encoding, padding, and blending to eliminate boundary seams. Extensive experiments on benchmark datasets demonstrate that CubeComposer outperforms state-of-the-art methods in native resolution and visual quality, supporting practical VR application scenarios. Project page: this https URL", "authors": ["Authors:Lingen Li", "Guangzhi Wang", "Xiaoyu Li", "Zhaoyang Zhang", "Qi Dou"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2603.04291", "pdf_url": "https://arxiv.org/pdf/2603.04291", "github_repo": "https://github.com/TencentARC/CubeComposer", "source": "github_org"}, {"id": "2603.02573", "date": "2026-03-03", "title": "Track4World: Feedforward World-centric Dense 3D Tracking of All Pixels", "abstract": "Estimating the 3D trajectory of every pixel from a monocular video is crucial and promising for a comprehensive understanding of the 3D dynamics of videos. Recent monocular 3D tracking works demonstrate impressive performance, but are limited to either tracking sparse points on the first frame or a slow optimization-based framework for dense tracking. In this paper, we propose a feedforward model, called Track4World, enabling an efficient holistic 3D tracking of every pixel in the world-centric coordinate system. Built on the global 3D scene representation encoded by a VGGT-style ViT, Track4World applies a novel 3D correlation scheme to simultaneously estimate the pixel-wise 2D and 3D dense flow between arbitrary frame pairs. The estimated scene flow, along with the reconstructed 3D geometry, enables subsequent efficient 3D tracking of every pixel of this video. Extensive experiments on multiple benchmarks demonstrate that our approach consistently outperforms existing methods in 2D/3D flow estimation and 3D tracking, highlighting its robustness and scalability for real-world 4D reconstruction tasks.", "authors": ["Authors:Jiahao Lu", "Jiayi Xu", "Wenbo Hu", "Ruijie Zhu", "Chengfeng Zhao"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2603.02573", "pdf_url": "https://arxiv.org/pdf/2603.02573", "github_repo": "https://github.com/TencentARC/Track4World", "source": "github_org"}, {"id": "2602.21201", "date": "2026-02-25", "title": "Aletheia tackles FirstProof autonomously", "abstract": "We report the performance of Aletheia (Feng et al., 2026b), a mathematics research agent powered by Gemini 3 Deep Think, on the inaugural FirstProof challenge. Within the allowed timeframe of the challenge, Aletheia autonomously solved 6 problems (2, 5, 7, 8, 9, 10) out of 10 according to majority expert assessments; we note that experts were not unanimous on Problem 8 (only). For full transparency, we explain our interpretation of FirstProof and disclose details about our experiments as well as our evaluation. Raw prompts and outputs are available at https://github.com/google-deepmind/superhuman/tree/main/aletheia.", "authors": ["Tony Feng", "Junehyuk Jung", "Sang-hyun Kim", "Carlo Pagano", "Sergei Gukov"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2602.21201", "pdf_url": "https://arxiv.org/pdf/2602.21201", "github_repo": "", "source": "daily_arxiv"}, {"id": "2602.15989", "date": "2026-02-19", "title": "SAM 3D Body: Robust Full-Body Human Mesh Recovery", "abstract": "We introduce SAM 3D Body (3DB), a promptable model for single-image full-body 3D human mesh recovery (HMR) that demonstrates state-of-the-art performance, with strong generalization and consistent accuracy in diverse in-the-wild conditions. 3DB estimates the human pose of the body, feet, and hands. It is the first model to use a new parametric mesh representation, Momentum Human Rig (MHR), which decouples skeletal structure and surface shape. 3DB employs an encoder-decoder architecture and supports auxiliary prompts, including 2D keypoints and masks, enabling user-guided inference similar to the SAM family of models. We derive high-quality annotations from a multi-stage annotation pipeline that uses various combinations of manual keypoint annotation, differentiable optimization, multi-view geometry, and dense keypoint detection. Our data engine efficiently selects and processes data to ensure data diversity, collecting unusual poses and rare imaging conditions. We present a new evaluation dataset organized by pose and appearance categories, enabling nuanced analysis of model behavior. Our experiments demonstrate superior generalization and substantial improvements over prior methods in both qualitative user preference studies and traditional quantitative analysis. Both 3DB and MHR are open-source.", "authors": ["Xitong Yang", "Devansh Kukreja", "Don Pinkus", "Anushka Sagar", "Taosha Fan"], "categories": ["cs.CV"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2602.15989", "pdf_url": "https://arxiv.org/pdf/2602.15989", "github_repo": "", "source": "daily_arxiv"}, {"id": "2602.14721", "date": "2026-02-16", "title": "WebWorld: A Large-Scale World Model for Web Agent Training", "abstract": "Web agents require massive trajectories to generalize, yet real-world training is constrained by network latency, rate limits, and safety risks. We introduce \\textbf{WebWorld} series, the first open-web simulator trained at scale. While existing simulators are restricted to closed environments with thousands of trajectories, WebWorld leverages a scalable data pipeline to train on 1M+ open-web interactions, supporting reasoning, multi-format data, and long-horizon simulations of 30+ steps. For intrinsic evaluation, we introduce WebWorld-Bench with dual metrics spanning nine dimensions, where WebWorld achieves simulation performance comparable to Gemini-3-Pro. For extrinsic evaluation, Qwen3-14B trained on WebWorld-synthesized trajectories improves by +9.2\\% on WebArena, reaching performance comparable to GPT-4o. WebWorld enables effective inference-time search, outperforming GPT-5 as a world model. Beyond web simulation, WebWorld exhibits cross-domain generalization to code, GUI, and game environments, providing a replicable recipe for world model construction.", "authors": ["Authors:Zikai Xiao", "Jianhong Tu", "Chuhang Zou", "Yuxin Zuo", "Zhi Li"], "categories": ["Artificial"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2602.14721", "pdf_url": "https://arxiv.org/pdf/2602.14721", "github_repo": "https://github.com/QwenLM/WebWorld", "source": "github_org"}, {"id": "2602.13949", "date": "2026-02-15", "title": "Experiential Reinforcement Learning", "abstract": "Reinforcement learning has become the central approach for language models (LMs) to learn from environmental reward or feedback. In practice, the environmental feedback is usually sparse and delayed. Learning from such signals is challenging, as LMs must implicitly infer how observed failures should translate into behavioral changes for future iterations. We introduce Experiential Reinforcement Learning (ERL), a training paradigm that embeds an explicit experience-reflection-consolidation loop into the reinforcement learning process. Given a task, the model generates an initial attempt, receives environmental feedback, and produces a reflection that guides a refined second attempt, whose success is reinforced and internalized into the base policy. This process converts feedback into structured behavioral revision, improving exploration and stabilizing optimization while preserving gains at deployment without additional inference cost. Across sparse-reward control environments and agentic reasoning benchmarks, ERL consistently improves learning efficiency and final performance over strong reinforcement learning baselines, achieving gains of up to +81% in complex multi-step environments and up to +11% in tool-using reasoning tasks. These results suggest that integrating explicit self-reflection into policy training provides a practical mechanism for transforming feedback into durable behavioral improvement.", "authors": ["Authors:Taiwei Shi", "Sihao Chen", "Bowen Jiang", "Linxin Song", "Longqi Yang"], "categories": ["Machine"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2602.13949", "pdf_url": "https://arxiv.org/pdf/2602.13949", "github_repo": "https://github.com/microsoft/experiential_rl", "source": "github_org"}, {"id": "2602.10874", "date": "2026-02-12", "title": "C-MOP: Integrating Momentum and Boundary-Aware Clustering for Enhanced Prompt Evolution", "abstract": "Automatic prompt optimization is a promising direction to boost the performance of Large Language Models (LLMs). However, existing methods often suffer from noisy and conflicting update signals. In this research, we propose C-MOP (Cluster-based Momentum Optimized Prompting), a framework that stabilizes optimization via Boundary-Aware Contrastive Sampling (BACS) and Momentum-Guided Semantic Clustering (MGSC). Specifically, BACS utilizes batch-level information to mine tripartite features--Hard Negatives, Anchors, and Boundary Pairs--to precisely characterize the typical representation and decision boundaries of positive and negative prompt samples. To resolve semantic conflicts, MGSC introduces a textual momentum mechanism with temporal decay that distills persistent consensus from fluctuating gradients across iterations. Extensive experiments demonstrate that C-MOP consistently outperforms SOTA baselines like PromptWizard and ProTeGi, yielding average gains of 1.58% and 3.35%. Notably, C-MOP enables a general LLM with 3B activated parameters to surpass a 70B domain-specific dense LLM, highlighting its effectiveness in driving precise prompt evolution. The code is available at https://github.com/huawei-noah/noah-research/tree/master/C-MOP.", "authors": ["Binwei Yan", "Yifei Fu", "Mingjian Zhu", "Hanting Chen", "Mingxuan Yuan"], "categories": ["cs.CL"], "companies": ["Huawei"], "abs_url": "https://arxiv.org/abs/2602.10874", "pdf_url": "https://arxiv.org/pdf/2602.10874", "github_repo": "", "source": "daily_arxiv"}, {"id": "2602.10604", "date": "2026-02-11", "title": "Step 3.5 Flash: Open Frontier-Level Intelligence with 11B Active Parameters", "abstract": "We introduce Step 3.5 Flash, a sparse Mixture-of-Experts (MoE) model that bridges frontier-level agentic intelligence and computational efficiency. We focus on what matters most when building agents: sharp reasoning and fast, reliable execution. Step 3.5 Flash pairs a 196B-parameter foundation with 11B active parameters for efficient inference. It is optimized with interleaved 3:1 sliding-window/full attention and Multi-Token Prediction (MTP-3) to reduce the latency and cost of multi-round agentic interactions. To reach frontier-level intelligence, we design a scalable reinforcement learning framework that combines verifiable signals with preference feedback, while remaining stable under large-scale off-policy training, enabling consistent self-improvement across mathematics, code, and tool use. Step 3.5 Flash demonstrates strong performance across agent, coding, and math tasks, achieving 85.4% on IMO-AnswerBench, 86.4% on LiveCodeBench-v6 (2024.08-2025.05), 88.2% on tau2-Bench, 69.0% on BrowseComp (with context management), and 51.0% on Terminal-Bench 2.0, comparable to frontier models such as GPT-5.2 xHigh and Gemini 3.0 Pro. By redefining the efficiency frontier, Step 3.5 Flash provides a high-density foundation for deploying sophisticated agents in real-world industrial environments.", "authors": ["Authors:Ailin Huang", "Ang Li", "Aobo Kong", "Bin Wang", "Binxing Jiao"], "categories": ["Computation"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2602.10604", "pdf_url": "https://arxiv.org/pdf/2602.10604", "github_repo": "https://github.com/stepfun-ai/Step-3.5-Flash", "source": "github_org"}, {"id": "2602.10718", "date": "2026-02-11", "title": "SnapMLA: Efficient Long-Context MLA Decoding via Hardware-Aware FP8 Quantized Pipelining", "abstract": "While FP8 attention has shown substantial promise in innovations like FlashAttention-3, its integration into the decoding phase of the DeepSeek Multi-head Latent Attention (MLA) architecture presents notable challenges. These challenges include numerical heterogeneity arising from the decoupling of positional embeddings, misalignment of quantization scales in FP8 PV GEMM, and the need for optimized system-level support. In this paper, we introduce SnapMLA, an FP8 MLA decoding framework optimized to improve long-context efficiency through the following hardware-aware algorithm-kernel co-optimization techniques: (i) RoPE-Aware Per-Token KV Quantization: Motivated by our analysis of the heterogeneous quantization sensitivity inherent to the MLA KV cache, this approach preserves the RoPE part in high precision. Furthermore, per-token granularity is employed to align with the autoregressive decoding process and maintain quantization accuracy. (ii) Quantized PV Computation Pipeline Reconstruction: Addresses the misalignment of quantization scales in FP8 PV computation caused by the shared KV structure of the MLA. (iii) End-to-End Dataflow Optimization: Establishes an efficient data read-and-write workflow using specialized kernels, ensuring streamlined data flow and improved performance. Extensive experiments on state-of-the-art MLA LLMs show that SnapMLA achieves up to a 1.91x improvement in throughput on long-output decoding workloads while maintaining near-parity benchmark quality compared with the BF16 baseline on the evaluated reasoning and code-generation benchmarks. Code is available at this https URL .", "authors": ["Authors:Yifan Zhang", "Zunhai Su", "Shuhao Hu", "Rui Yang", "Wei Wu"], "categories": ["Machine"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2602.10718", "pdf_url": "https://arxiv.org/pdf/2602.10718", "github_repo": "https://github.com/meituan-longcat/SGLang-FluentLLM", "source": "github_org"}, {"id": "2602.08235", "date": "2026-02-09", "title": "When Benign Inputs Lead to Severe Harms: Eliciting Unsafe Unintended Behaviors of Computer-Use Agents", "abstract": "Although computer-use agents (CUAs) hold significant potential to automate increasingly complex OS workflows, they can demonstrate unsafe unintended behaviors that deviate from expected outcomes even under benign input contexts. However, exploration of this risk remains largely anecdotal, lacking concrete characterization and automated methods to proactively surface long-tail unintended behaviors under realistic CUA scenarios. To fill this gap, we introduce the first conceptual and methodological framework for unintended CUA behaviors, by defining their key characteristics, automatically eliciting them, and analyzing how they arise from benign inputs. We propose AutoElicit: an agentic framework that iteratively perturbs benign instructions using CUA execution feedback, and elicits severe harms while keeping perturbations realistic and benign. Using AutoElicit, we surface hundreds of harmful unintended behaviors from state-of-the-art CUAs such as Claude 4.5 Haiku and Opus. We further evaluate the transferability of human-verified successful perturbations, identifying persistent susceptibility to unintended behaviors across various other frontier CUAs. This work establishes a foundation for systematically analyzing unintended behaviors in realistic computer-use settings.", "authors": ["Authors:Jaylen Jones", "Zhehao Zhang", "Yuting Ning", "Eric Fosler-Lussier", "Pierre-Luc St-Charles"], "categories": ["Computation"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2602.08235", "pdf_url": "https://arxiv.org/pdf/2602.08235", "github_repo": "https://github.com/meituan/EvoCUA", "source": "github_org"}, {"id": "2602.08961", "date": "2026-02-09", "title": "MotionCrafter: Dense Geometry and Motion Reconstruction with a 4D VAE", "abstract": "We present MotionCrafter, a framework that leverages video generators to jointly reconstruct 4D geometry and estimate dense motion from a monocular video. The key idea is a joint representation of dense 3D point maps and 3D scene flows in a shared coordinate system, together with a 4D VAE tailored to learn this representation effectively. Unlike prior work that strictly aligns 3D values and latents with RGB VAE latents-despite their fundamentally different distributions-we show that such alignment is unnecessary and can hurt performance. Instead, we propose a new data normalization and VAE training strategy that better transfers diffusion priors and greatly improves reconstruction quality. Extensive experiments on multiple datasets show that MotionCrafter achieves state-of-the-art performance in both geometry reconstruction and dense scene flow estimation, delivering 38.64% and 25.0% improvements in geometry and motion reconstruction, respectively, all without any post-optimization. Project page: this https URL", "authors": ["Authors:Ruijie Zhu", "Jiahao Lu", "Wenbo Hu", "Xiaoguang Han", "Jianfei Cai"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2602.08961", "pdf_url": "https://arxiv.org/pdf/2602.08961", "github_repo": "https://github.com/TencentARC/MotionCrafter", "source": "github_org"}, {"id": "2602.09007", "date": "2026-02-09", "title": "GEBench: Benchmarking Image Generation Models as GUI Environments", "abstract": "Recent advancements in image generation models have enabled the prediction of future Graphical User Interface (GUI) states based on user instructions. However, existing benchmarks primarily focus on general domain visual fidelity, leaving the evaluation of state transitions and temporal coherence in GUI-specific contexts underexplored. To address this gap, we introduce GEBench, a comprehensive benchmark for evaluating dynamic interaction and temporal coherence in GUI generation. GEBench comprises 700 carefully curated samples spanning five task categories, covering both single-step interactions and multi-step trajectories across real-world and fictional scenarios, as well as grounding point localization. To support systematic evaluation, we propose GE-Score, a novel five-dimensional metric that assesses Goal Achievement, Interaction Logic, Content Consistency, UI Plausibility, and Visual Quality. Extensive evaluations on current models indicate that while they perform well on single-step transitions, they struggle significantly with maintaining temporal coherence and spatial grounding over longer interaction sequences. Our findings identify icon interpretation, text rendering, and localization precision as critical bottlenecks. This work provides a foundation for systematic assessment and suggests promising directions for future research toward building high-fidelity generative GUI environments. The code is available at: this https URL .", "authors": ["Authors:Haodong Li", "Jingwei Wu", "Quan Sun", "Guopeng Li", "Juanxi Tian"], "categories": ["Artificial"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2602.09007", "pdf_url": "https://arxiv.org/pdf/2602.09007", "github_repo": "https://github.com/stepfun-ai/GEBench", "source": "github_org"}, {"id": "2602.05085", "date": "2026-02-06", "title": "Locas: Your Models are Principled Initializers of Locally-Supported Parametric Memories", "abstract": "In this paper, we aim to bridge test-time-training with a new type of parametric memory that can be flexibly offloaded from or merged into model parameters. We present Locas, a Locally-Supported parametric memory that shares the design of FFN blocks in modern transformers, allowing it to be flexibly permanentized into the model parameters while supporting efficient continual learning. We discuss two major variants of Locas: one with a conventional two-layer MLP design that has a clearer theoretical guarantee; the other one shares the same GLU-FFN structure with SOTA LLMs, and can be easily attached to existing models for both parameter-efficient and computation-efficient continual learning. Crucially, we show that proper initialization of such low-rank sideway-FFN-style memories -- performed in a principled way by reusing model parameters, activations and/or gradients -- is essential for fast convergence, improved generalization, and catastrophic forgetting prevention. We validate the proposed memory mechanism on the PG-19 whole-book language modeling and LoCoMo long-context dialogue question answering tasks. With only 0.02\\% additional parameters in the lowest case, Locas-GLU is capable of storing the information from past context while maintaining a much smaller context window. In addition, we also test the model's general capability loss after memorizing the whole book with Locas, through comparative MMLU evaluation. Results show the promising ability of Locas to permanentize past context into parametric knowledge with minimized catastrophic forgetting of the model's existing internal knowledge.", "authors": ["Sidi Lu", "Zhenwen Liang", "Dongyang Ma", "Yan Wang", "Haitao Mi"], "categories": ["cs.CL"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2602.05085", "pdf_url": "https://arxiv.org/pdf/2602.05085", "github_repo": "", "source": "daily_arxiv"}, {"id": "2602.06556", "date": "2026-02-06", "title": "LIBERO-X: Robustness Litmus for Vision-Language-Action Models", "abstract": "Reliable benchmarking is critical for advancing Vision-Language-Action (VLA) models, as it reveals their generalization, robustness, and alignment of perception with language-driven manipulation tasks. However, existing benchmarks often provide limited or misleading assessments due to insufficient evaluation protocols that inadequately capture real-world distribution shifts. This work systematically rethinks VLA benchmarking from both evaluation and data perspectives, introducing LIBERO-X, a benchmark featuring: 1) A hierarchical evaluation protocol with progressive difficulty levels targeting three core capabilities: spatial generalization, object recognition, and task instruction understanding. This design enables fine-grained analysis of performance degradation under increasing environmental and task complexity; 2) A high-diversity training dataset collected via human teleoperation, where each scene supports multiple fine-grained manipulation objectives to bridge the train-evaluation distribution gap. Experiments with representative VLA models reveal significant performance drops under cumulative perturbations, exposing persistent limitations in scene comprehension and instruction grounding. By integrating hierarchical evaluation with diverse training data, LIBERO-X offers a more reliable foundation for assessing and advancing VLA development.", "authors": ["Authors:Guodong Wang", "Chenkai Zhang", "Qingjie Liu", "Jinjin Zhang", "Jiancheng Cai"], "categories": ["Computer"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2602.06556", "pdf_url": "https://arxiv.org/pdf/2602.06556", "github_repo": "https://github.com/meituan/LIBERO-X", "source": "github_org"}, {"id": "2602.04649", "date": "2026-02-04", "title": "Outcome Accuracy is Not Enough: Aligning the Reasoning Process of Reward Models", "abstract": "Generative Reward Models (GenRMs) and LLM-as-a-Judge exhibit deceptive alignment by producing correct judgments for incorrect reasons, as they are trained and evaluated to prioritize Outcome Accuracy, which undermines their ability to generalize during RLHF. We introduce Rationale Consistency, a fine-grained metric that quantifies the alignment between the model&#39;s reasoning process and human judgment. Our evaluation of frontier models reveals that rationale consistency effectively discriminates among state-of-the-art models and detects deceptive alignment, while outcome accuracy falls short in both respects. To mitigate this gap, we introduce a hybrid signal that combines rationale consistency with outcome accuracy for GenRM training. Our training method achieves state-of-the-art performance on RM-Bench (87.1%) and JudgeBench (82%), surpassing outcome-only baselines by an average of 5%. Using RM during RLHF, our method effectively improves performance as demonstrated on Arena Hard v2, notably yielding a 7% improvement in creative writing tasks. Further analysis confirms that our method escapes the deceptive alignment trap, effectively reversing the decline in rationale consistency observed in outcome-only training.", "authors": ["Authors:Binghai Wang", "Yantao Liu", "Yuxuan Liu", "Tianyi Tang", "Shenzhi Wang"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2602.04649", "pdf_url": "https://arxiv.org/pdf/2602.04649", "github_repo": "https://github.com/QwenLM/RationaleRM", "source": "github_org"}, {"id": "2602.03085", "date": "2026-02-03", "title": "The Trigger in the Haystack: Extracting and Reconstructing LLM Backdoor Triggers", "abstract": "Detecting whether a model has been poisoned is a longstanding problem in AI security. In this work, we present a practical scanner for identifying sleeper agent-style backdoors in causal language models. Our approach relies on two key findings: first, sleeper agents tend to memorize poisoning data, making it possible to leak backdoor examples using memory extraction techniques. Second, poisoned LLMs exhibit distinctive patterns in their output distributions and attention heads when backdoor triggers are present in the input. Guided by these observations, we develop a scalable backdoor scanning methodology that assumes no prior knowledge of the trigger or target behavior and requires only inference operations. Our scanner integrates naturally into broader defensive strategies and does not alter model performance. We show that our method recovers working triggers across multiple backdoor scenarios and a broad range of models and fine-tuning methods.", "authors": ["Authors:Blake Bullwinkel", "Giorgio Severi", "Keegan Hines", "Amanda Minnich", "Ram Shankar Siva Kumar"], "categories": ["Cryptography"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2602.03085", "pdf_url": "https://arxiv.org/pdf/2602.03085", "github_repo": "https://github.com/microsoft/llm-backdoor-scanner", "source": "github_org"}, {"id": "2602.02660", "date": "2026-02-02", "title": "MARS: Modular Agent with Reflective Search for Automated AI Research", "abstract": "A critical bottleneck in automating AI research is the execution of complex machine learning engineering (MLE) tasks. MLE differs from general software engineering due to computationally expensive evaluation (e.g., model training) and opaque performance attribution. Current LLM-based agents struggle here, often generating monolithic scripts that ignore execution costs and causal factors. We introduce MARS (Modular Agent with Reflective Search), a framework optimized for autonomous AI research. MARS relies on three pillars: (1) Budget-Aware Planning via cost-constrained Monte Carlo Tree Search (MCTS) to explicitly balance performance with execution expense; (2) Modular Construction, employing a &#34;Design-Decompose-Implement&#34; pipeline to manage complex research repositories; and (3) Comparative Reflective Memory, which addresses credit assignment by analyzing solution differences to distill high-signal insights. MARS achieves state-of-the-art performance among open-source frameworks on MLE-Bench under comparable settings, maintaining competitiveness with the global leaderboard&#39;s top methods. Furthermore, the system exhibits qualitative &#34;Aha!&#34; moments, where 63% of all utilized lessons originate from cross-branch transfer, demonstrating that the agent effectively generalizes insights across search paths.", "authors": ["Authors:Jiefeng Chen", "Bhavana Dalvi Mishra", "Jaehyun Nam", "Rui Meng", "Tomas Pfister"], "categories": ["Artificial"], "companies": ["OpenAI"], "abs_url": "https://arxiv.org/abs/2602.02660", "pdf_url": "https://arxiv.org/pdf/2602.02660", "github_repo": "https://github.com/openai/mle-bench", "source": "github_org"}, {"id": "2602.02909", "date": "2026-02-02", "title": "Reasoning about Reasoning: BAPO Bounds on Chain-of-Thought Token Complexity in LLMs", "abstract": "Inference-time scaling via chain-of-thought (CoT) reasoning is a major driver of state-of-the-art LLM performance, but it comes with substantial latency and compute costs. We address a fundamental theoretical question: how many reasoning tokens are required to solve a problem as input size grows? By extending the bounded attention prefix oracle (BAPO) model--an abstraction of LLMs that quantifies the information flow required to solve a task--we prove lower bounds on the CoT tokens required for three canonical BAPO-hard tasks: binary majority, triplet matching, and graph reachability. We show that each requires $\\Omega(n)$ reasoning tokens when the input size is $n$. We complement these results with matching or near-matching upper bounds via explicit constructions. Finally, our experiments with frontier reasoning models show approximately linear reasoning token scaling on these tasks and failures when constrained to smaller reasoning budgets, consistent with our theoretical lower bounds. Together, our results identify fundamental bottlenecks in inference-time compute through CoT and offer a principled tool for analyzing optimal reasoning length.", "authors": ["Authors:Kiran Tomlinson", "Tobias Schnabel", "Adith Swaminathan", "Jennifer Neville"], "categories": ["Artificial"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2602.02909", "pdf_url": "https://arxiv.org/pdf/2602.02909", "github_repo": "https://github.com/microsoft/bapo-cot", "source": "github_org"}, {"id": "2601.21337", "date": "2026-01-30", "title": "Qwen3-ASR Technical Report", "abstract": "In this report, we introduce Qwen3-ASR family, which includes two powerful all-in-one speech recognition models and a novel non-autoregressive speech forced alignment model. Qwen3-ASR-1.7B and Qwen3-ASR-0.6B are ASR models that support language identification and ASR for 52 languages and dialects. Both of them leverage large-scale speech training data and the strong audio understanding ability of their foundation model Qwen3-Omni. We conduct comprehensive internal evaluation besides the open-sourced benchmarks as ASR models might differ little on open-sourced benchmark scores but exhibit significant quality differences in real-world scenarios. The experiments reveal that the 1.7B version achieves SOTA performance among open-sourced ASR models and is competitive with the strongest proprietary APIs while the 0.6B version offers the best accuracy-efficiency trade-off. Qwen3-ASR-0.6B can achieve an average TTFT as low as 92ms and transcribe 2000 seconds speech in 1 second at a concurrency of 128. Qwen3-ForcedAligner-0.6B is an LLM based NAR timestamp predictor that is able to align text-speech pairs in 11 languages. Timestamp accuracy experiments show that the proposed model outperforms the three strongest force alignment models and takes more advantages in efficiency and versatility. To further accelerate the community research of ASR and audio understanding, we release these models under the Apache 2.0 license.", "authors": ["Xian Shi", "Xiong Wang", "Zhifang Guo", "Yongqi Wang", "Pei Zhang"], "categories": ["cs.CL", "cs.SD", "eess.AS"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2601.21337", "pdf_url": "https://arxiv.org/pdf/2601.21337", "github_repo": "", "source": "daily_arxiv"}, {"id": "2601.21468", "date": "2026-01-29", "title": "MemOCR: Layout-Aware Visual Memory for Efficient Long-Horizon Reasoning", "abstract": "Long-horizon agentic reasoning necessitates effectively compressing growing interaction histories into a limited context window. Most existing memory systems serialize history as text, where token-level cost is uniform and scales linearly with length, often spending scarce budget on low-value details. To this end, we introduce MemOCR, a multimodal memory agent that improves long-horizon reasoning under tight context budgets by allocating memory space with adaptive information density through visual layout. Concretely, MemOCR maintains a structured rich-text memory (e.g., headings, highlights) and renders it into an image that the agent consults for memory access, visually prioritizing crucial evidence while aggressively compressing auxiliary details. To ensure robustness across varying memory budgets, we train MemOCR with reinforcement learning under budget-aware objectives that expose the agent to diverse compression levels. Across long-context multi-hop and single-hop question-answering benchmarks, MemOCR outperforms strong text-based baselines and achieves more effective context utilization under extreme budgets.", "authors": ["Authors:Yaorui Shi", "Shugui Liu", "Yu Yang", "Wenyu Mao", "Yuxin Chen"], "categories": ["Artificial"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2601.21468", "pdf_url": "https://arxiv.org/pdf/2601.21468", "github_repo": "https://github.com/meituan/MemOCR", "source": "github_org"}, {"id": "2601.20552", "date": "2026-01-28", "title": "DeepSeek-OCR 2: Visual Causal Flow", "abstract": "We present DeepSeek-OCR 2 to investigate the feasibility of a novel encoder-DeepEncoder V2-capable of dynamically reordering visual tokens upon image semantics. Conventional vision-language models (VLMs) invariably process visual tokens in a rigid raster-scan order (top-left to bottom-right) with fixed positional encoding when fed into LLMs. However, this contradicts human visual perception, which follows flexible yet semantically coherent scanning patterns driven by inherent logical structures. Particularly for images with complex layouts, human vision exhibits causally-informed sequential processing. Inspired by this cognitive mechanism, DeepEncoder V2 is designed to endow the encoder with causal reasoning capabilities, enabling it to intelligently reorder visual tokens prior to LLM-based content interpretation. This work explores a novel paradigm: whether 2D image understanding can be effectively achieved through two-cascaded 1D causal reasoning structures, thereby offering a new architectural approach with the potential to achieve genuine 2D reasoning. Codes and model weights are publicly accessible at this http URL .", "authors": ["Authors:Haoran Wei", "Yaofeng Sun", "Yukun Li"], "categories": ["Computer"], "companies": ["DeepSeek"], "abs_url": "https://arxiv.org/abs/2601.20552", "pdf_url": "https://arxiv.org/pdf/2601.20552", "github_repo": "https://github.com/deepseek-ai/DeepSeek-OCR-2", "source": "github_org"}, {"id": "2602.02537", "date": "2026-01-28", "title": "WorldVQA: Measuring Atomic World Knowledge in Multimodal Large Language Models", "abstract": "We introduce WorldVQA, a benchmark designed to evaluate the atomic visual world knowledge of Multimodal Large Language Models (MLLMs). Unlike current evaluations, which often conflate visual knowledge retrieval with reasoning, WorldVQA decouples these capabilities to strictly measure &#34;what the model memorizes.&#34; The benchmark assesses the atomic capability of grounding and naming visual entities across a stratified taxonomy, spanning from common head-class objects to long-tail rarities. We expect WorldVQA to serve as a rigorous test for visual factuality, thereby establishing a standard for assessing the encyclopedic breadth and hallucination rates of current and next-generation frontier models.", "authors": ["Authors:Runjie Zhou", "Youbo Shao", "Haoyu Lu", "Bowei Xing", "Tongtong Bai"], "categories": ["Computer"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2602.02537", "pdf_url": "https://arxiv.org/pdf/2602.02537", "github_repo": "https://github.com/MoonshotAI/WorldVQA", "source": "github_org"}, {"id": "2601.17237", "date": "2026-01-24", "title": "C-RADIOv4 (Tech Report)", "abstract": "By leveraging multi-teacher distillation, agglomerative vision backbones provide a unified student model that retains and improves the distinct capabilities of multiple teachers. In this tech report, we describe the most recent release of the C-RADIO family of models, C-RADIOv4, which builds upon AM-RADIO/RADIOv2.5 in design, offering strong improvements on key downstream tasks at the same computational complexity. We release -SO400M (412M params), and -H (631M) model variants, both trained with an updated set of teachers: SigLIP2, DINOv3, and SAM3. In addition to improvements on core metrics and new capabilities from imitating SAM3, the C-RADIOv4 model family further improves any-resolution support, brings back the ViTDet option for drastically enhanced efficiency at high-resolution, and comes with a permissive license.", "authors": ["Authors:Mike Ranzinger", "Greg Heinrich", "Collin McCarthy", "Jan Kautz", "Andrew Tao"], "categories": ["Computer"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2601.17237", "pdf_url": "https://arxiv.org/pdf/2601.17237", "github_repo": "https://github.com/NVlabs/RADIO", "source": "github_org"}, {"id": "2601.16140", "date": "2026-01-23", "title": "Learning to Watermark in the Latent Space of Generative Models", "abstract": "Existing approaches for watermarking AI-generated images often rely on post-hoc methods applied in pixel space, introducing computational overhead and potential visual artifacts. In this work, we explore latent space watermarking and introduce DistSeal, a unified approach for latent watermarking that works across both diffusion and autoregressive models. Our approach works by training post-hoc watermarking models in the latent space of generative models. We demonstrate that these latent watermarkers can be effectively distilled either into the generative model itself or into the latent decoder, enabling in-model watermarking. The resulting latent watermarks achieve competitive robustness while offering similar imperceptibility and up to 20x speedup compared to pixel-space baselines. Our experiments further reveal that distilling latent watermarkers outperforms distilling pixel-space ones, providing a solution that is both more efficient and more robust.", "authors": ["Sylvestre-Alvise Rebuffi", "Tuan Tran", "Valeriu Lacatusu", "Pierre Fernandez", "Tomáš Souček"], "categories": ["cs.CV", "cs.AI", "cs.CR"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2601.16140", "pdf_url": "https://arxiv.org/pdf/2601.16140", "github_repo": "", "source": "daily_arxiv"}, {"id": "2601.15621", "date": "2026-01-22", "title": "Qwen3-TTS Technical Report", "abstract": "In this report, we present the Qwen3-TTS series, a family of advanced multilingual, controllable, robust, and streaming text-to-speech models. Qwen3-TTS supports state-of-the-art 3-second voice cloning and description-based control, allowing both the creation of entirely novel voices and fine-grained manipulation over the output speech. Trained on over 5 million hours of speech data spanning 10 languages, Qwen3-TTS adopts a dual-track LM architecture for real-time synthesis, coupled with two speech tokenizers: 1) Qwen-TTS-Tokenizer-25Hz is a single-codebook codec emphasizing semantic content, which offers seamlessly integration with Qwen-Audio and enables streaming waveform reconstruction via a block-wise DiT. 2) Qwen-TTS-Tokenizer-12Hz achieves extreme bitrate reduction and ultra-low-latency streaming, enabling immediate first-packet emission ($97\\,\\mathrm{ms}$) through its 12.5 Hz, 16-layer multi-codebook design and a lightweight causal ConvNet. Extensive experiments indicate state-of-the-art performance across diverse objective and subjective benchmark (e.g., TTS multilingual test set, InstructTTSEval, and our long speech test set). To facilitate community research and development, we release both tokenizers and models under the Apache 2.0 license.", "authors": ["Authors:Hangrui Hu", "Xinfa Zhu", "Ting He", "Dake Guo", "Bin Zhang"], "categories": ["Sound"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2601.15621", "pdf_url": "https://arxiv.org/pdf/2601.15621", "github_repo": "https://github.com/QwenLM/Qwen3-TTS", "source": "github_org"}, {"id": "2601.15892", "date": "2026-01-22", "title": "Stable-DiffCoder: Pushing the Frontier of Code Diffusion Large Language Model", "abstract": "Diffusion-based language models (DLLMs) offer non-sequential, block-wise generation and richer data reuse compared to autoregressive (AR) models, but existing code DLLMs still lag behind strong AR baselines under comparable budgets. We revisit this setting in a controlled study and introduce Stable-DiffCoder, a block diffusion code model that reuses the Seed-Coder architecture, data, and training pipeline. To enable efficient knowledge learning and stable training, we incorporate a block diffusion continual pretraining (CPT) stage enhanced by a tailored warmup and block-wise clipped noise schedule. Under the same data and architecture, Stable-DiffCoder overall outperforms its AR counterpart on a broad suite of code benchmarks. Moreover, relying only on the CPT and supervised fine-tuning stages, Stable-DiffCoder achieves stronger performance than a wide range of \\~8B ARs and DLLMs, demonstrating that diffusion-based training can improve code modeling quality beyond AR training alone. Moreover, diffusion-based any-order modeling improves structured code modeling for editing and reasoning, and through data augmentation, benefits low-resource coding languages.", "authors": ["Authors:Chenghao Fan", "Wen Heng", "Bo Li", "Sichen Liu", "Yuxuan Song"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2601.15892", "pdf_url": "https://arxiv.org/pdf/2601.15892", "github_repo": "https://github.com/bytedance-seed/Stable-DiffCoder", "source": "github_org"}, {"id": "2601.10343", "date": "2026-01-15", "title": "OctoBench: Benchmarking Scaffold-Aware Instruction Following in Repository-Grounded Agentic Coding", "abstract": "Modern coding scaffolds turn LLMs into capable software agents, but their ability to follow scaffold-specified instructions remains under-examined, especially when constraints are heterogeneous and persist across interactions. To fill this gap, we introduce OctoBench, which benchmarks scaffold-aware instruction following in repository-grounded agentic coding. OctoBench includes 34 environments and 217 tasks instantiated under three scaffold types, and is paired with 7,098 objective checklist items. To disentangle solving the task from following the rules, we provide an automated observation-and-scoring toolkit that captures full trajectories and performs fine-grained checks. Experiments on eight representative models reveal a systematic gap between task-solving and scaffold-aware compliance, underscoring the need for training and evaluation that explicitly targets heterogeneous instruction following. We release the benchmark to support reproducible benchmarking and to accelerate the development of more scaffold-aware coding agents.", "authors": ["Authors:Deming Ding", "Shichun Liu", "Enhui Yang", "Jiahang Lin", "Ziying Chen"], "categories": ["Computation"], "companies": ["MiniMax"], "abs_url": "https://arxiv.org/abs/2601.10343", "pdf_url": "https://arxiv.org/pdf/2601.10343", "github_repo": "https://github.com/minimax-ai/mini-vela", "source": "github_org"}, {"id": "2601.08559", "date": "2026-01-14", "title": "WaterCopilot: An AI-Driven Virtual Assistant for Water Management", "abstract": "Sustainable water resource management in transboundary river basins is challenged by fragmented data, limited real-time access, and the complexity of integrating diverse information sources. This paper presents WaterCopilot-an AI-driven virtual assistant developed through collaboration between the International Water Management Institute (IWMI) and Microsoft Research for the Limpopo River Basin (LRB) to bridge these gaps through a unified, interactive platform. Built on Retrieval-Augmented Generation (RAG) and tool-calling architectures, WaterCopilot integrates static policy documents and real-time hydrological data via two custom plugins: the iwmi-doc-plugin, which enables semantic search over indexed documents using Azure AI Search, and the iwmi-api-plugin, which queries live databases to deliver dynamic ins
