hen streaming GeoTIFF files directly from cloud storage. In this work, we benchmark GeoTIFF loading throughput from both cloud object storage and local SSD, systematically testing different loader configurations and data parameters. We focus on tile-aligned reads and worker thread pools, using Bayesian optimization to find optimal settings for each storage type. Our optimized configurations increase remote data loading throughput by 20x and local throughput by 4x compared to default settings. On three public EO benchmarks, models trained with optimized remote loading achieve the same accuracy as local training within identical time budgets. We improve validation IoU by 6-15% and maintain 85-95% GPU utilization versus 0-30% with standard configurations. Code is publicly available at this https URL", "authors": ["Authors:Akram Zaytar", "Caleb Robinson", "Girmaw Abebe Tadesse", "Tammy Glazer", "Gilles Hacheme"], "categories": ["Computer"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2506.06235", "pdf_url": "https://arxiv.org/pdf/2506.06235", "github_repo": "https://github.com/microsoft/pytorch-cloud-geotiff-optimization", "source": "github_org"}, {"id": "2506.04779", "date": "2025-06-05", "title": "MMSU: A Massive Multi-task Spoken Language Understanding and Reasoning Benchmark", "abstract": "Speech inherently contains rich acoustic information that extends far beyond the textual language. In real-world spoken language understanding, effective interpretation often requires integrating semantic meaning (e.g., content), paralinguistic features (e.g., emotions, speed, pitch) and phonological characteristics (e.g., prosody, intonation, rhythm), which are embedded in speech. While recent multimodal Speech Large Language Models (SpeechLLMs) have demonstrated remarkable capabilities in processing audio information, their ability to perform fine-grained perception and complex reasoning in natural speech remains largely unexplored. To address this gap, we introduce MMSU, a comprehensive benchmark designed specifically for understanding and reasoning in spoken language. MMSU comprises 5,000 meticulously curated audio-question-answer triplets across 47 distinct tasks. To ground our benchmark in linguistic theory, we systematically incorporate a wide range of linguistic phenomena, including phonetics, prosody, rhetoric, syntactics, semantics, and paralinguistics. Through a rigorous evaluation of 14 advanced SpeechLLMs, we identify substantial room for improvement in existing models, highlighting meaningful directions for future optimization. MMSU establishes a new standard for comprehensive assessment of spoken language understanding, providing valuable insights for developing more sophisticated human-AI speech interaction systems. MMSU benchmark is available at this https URL . Evaluation Code is available at this https URL .", "authors": ["Authors:Dingdong Wang", "Junan Li", "Jincenzi Wu", "Dongchao Yang", "Xueyuan Chen"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2506.04779", "pdf_url": "https://arxiv.org/pdf/2506.04779", "github_repo": "https://github.com/QwenLM/Qwen2.5-Omni", "source": "github_org"}, {"id": "2506.05176", "date": "2025-06-05", "title": "Qwen3 Embedding: Advancing Text Embedding and Reranking Through Foundation Models", "abstract": "In this work, we introduce the Qwen3 Embedding series, a significant advancement over its predecessor, the GTE-Qwen series, in text embedding and reranking capabilities, built upon the Qwen3 foundation models. Leveraging the Qwen3 LLMs&#39; robust capabilities in multilingual text understanding and generation, our innovative multi-stage training pipeline combines large-scale unsupervised pre-training with supervised fine-tuning on high-quality datasets. Effective model merging strategies further ensure the robustness and adaptability of the Qwen3 Embedding series. During the training process, the Qwen3 LLMs serve not only as backbone models but also play a crucial role in synthesizing high-quality, rich, and diverse training data across multiple domains and languages, thus enhancing the training pipeline. The Qwen3 Embedding series offers a spectrum of model sizes (0.6B, 4B, 8B) for both embedding and reranking tasks, addressing diverse deployment scenarios where users can optimize for either efficiency or effectiveness. Empirical evaluations demonstrate that the Qwen3 Embedding series achieves state-of-the-art results across diverse benchmarks. Notably, it excels on the multilingual evaluation benchmark MTEB for text embedding, as well as in various retrieval tasks, including code retrieval, cross-lingual retrieval and multilingual retrieval. To facilitate reproducibility and promote community-driven research and development, the Qwen3 Embedding models are publicly available under the Apache 2.0 license.", "authors": ["Authors:Yanzhao Zhang", "Mingxin Li", "Dingkun Long", "Xin Zhang", "Huan Lin"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2506.05176", "pdf_url": "https://arxiv.org/pdf/2506.05176", "github_repo": "https://github.com/QwenLM/Qwen3-Embedding", "source": "github_org"}, {"id": "2506.03107", "date": "2025-06-04", "title": "ByteMorph: Benchmarking Instruction-Guided Image Editing with Non-Rigid Motions", "abstract": "Editing images with instructions to reflect non-rigid motions, camera\nviewpoint shifts, object deformations, human articulations, and complex\ninteractions, poses a challenging yet underexplored problem in computer vision.\nExisting approaches and datasets predominantly focus on static scenes or rigid\ntransformations, limiting their capacity to handle expressive edits involving\ndynamic motion. To address this gap, we introduce ByteMorph, a comprehensive\nframework for instruction-based image editing with an emphasis on non-rigid\nmotions. ByteMorph comprises a large-scale dataset, ByteMorph-6M, and a strong\nbaseline model built upon the Diffusion Transformer (DiT), named ByteMorpher.\nByteMorph-6M includes over 6 million high-resolution image editing pairs for\ntraining, along with a carefully curated evaluation benchmark ByteMorph-Bench.\nBoth capture a wide variety of non-rigid motion types across diverse\nenvironments, human figures, and object categories. The dataset is constructed\nusing motion-guided data generation, layered compositing techniques, and\nautomated captioning to ensure diversity, realism, and semantic coherence. We\nfurther conduct a comprehensive evaluation of recent instruction-based image\nediting methods from both academic and commercial domains.", "authors": ["Di Chang", "Mingdeng Cao", "Yichun Shi", "Bo Liu", "Shengqu Cai"], "categories": ["cs.CV"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.03107", "pdf_url": "https://arxiv.org/pdf/2506.03107", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.03524", "date": "2025-06-04", "title": "Seed-Coder: Let the Code Model Curate Data for Itself", "abstract": "Code data in large language model (LLM) pretraining is recognized crucial not only for code-related tasks but also for enhancing general intelligence of LLMs. Current open-source LLMs often heavily rely on human effort to produce their code pretraining data, such as employing hand-crafted filtering rules tailored to individual programming languages, or using human-annotated data to train quality filters. However, these approaches are inherently limited in scalability, prone to subjective biases, and costly to extend and maintain across diverse programming languages. To address these challenges, we introduce Seed-Coder, a series of open-source LLMs comprising base, instruct and reasoning models of 8B size, minimizing human involvement in data construction. Our code pretraining data is produced by a model-centric data pipeline, which predominantly leverages LLMs for scoring and filtering code data. The instruct model is further trained via supervised fine-tuning and preference optimization, and the reasoning model leverages Long-Chain-of-Thought (LongCoT) reinforcement learning to improve multi-step code reasoning. Seed-Coder achieves state-of-the-art results among open-source models of similar size and even surpasses some much larger models, demonstrating superior performance in code generation, code completion, code editing, code reasoning, and software engineering tasks.", "authors": ["Authors:ByteDance Seed", "Yuyu Zhang", "Jing Su", "Yifan Sun", "Chenguang Xi"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.03524", "pdf_url": "https://arxiv.org/pdf/2506.03524", "github_repo": "https://github.com/bytedance-seed/Seed-Coder", "source": "github_org"}, {"id": "2506.00448", "date": "2025-06-03", "title": "Fact-Controlled Diagnosis of Hallucinations in Medical Text Summarization", "abstract": "Hallucinations in large language models (LLMs) during summarization of\npatient-clinician dialogues pose significant risks to patient care and clinical\ndecision-making. However, the phenomenon remains understudied in the clinical\ndomain, with uncertainty surrounding the applicability of general-domain\nhallucination detectors. The rarity and randomness of hallucinations further\ncomplicate their investigation. In this paper, we conduct an evaluation of\nhallucination detection methods in the medical domain, and construct two\ndatasets for the purpose: A fact-controlled Leave-N-out dataset -- generated by\nsystematically removing facts from source dialogues to induce hallucinated\ncontent in summaries; and a natural hallucination dataset -- arising\norganically during LLM-based medical summarization. We show that general-domain\ndetectors struggle to detect clinical hallucinations, and that performance on\nfact-controlled hallucinations does not reliably predict effectiveness on\nnatural hallucinations. We then develop fact-based approaches that count\nhallucinations, offering explainability not available with existing methods.\nNotably, our LLM-based detectors, which we developed using fact-controlled\nhallucinations, generalize well to detecting real-world clinical\nhallucinations. This research contributes a suite of specialized metrics\nsupported by expert-annotated datasets to advance faithful clinical\nsummarization systems.", "authors": ["Suhas BN", "Han-Chin Shing", "Lei Xu", "Mitch Strong", "Jon Burnsky"], "categories": ["cs.CL"], "companies": ["Amazon"], "abs_url": "https://arxiv.org/abs/2506.00448", "pdf_url": "https://arxiv.org/pdf/2506.00448", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.01943", "date": "2025-06-03", "title": "Learning Video Generation for Robotic Manipulation with Collaborative Trajectory Control", "abstract": "Recent advances in video diffusion models have demonstrated strong potential\nfor generating robotic decision-making data, with trajectory conditions further\nenabling fine-grained control. However, existing trajectory-based methods\nprimarily focus on individual object motion and struggle to capture\nmulti-object interaction crucial in complex robotic manipulation. This\nlimitation arises from multi-feature entanglement in overlapping regions, which\nleads to degraded visual fidelity. To address this, we present RoboMaster, a\nnovel framework that models inter-object dynamics through a collaborative\ntrajectory formulation. Unlike prior methods that decompose objects, our core\nis to decompose the interaction process into three sub-stages: pre-interaction,\ninteraction, and post-interaction. Each stage is modeled using the feature of\nthe dominant object, specifically the robotic arm in the pre- and\npost-interaction phases and the manipulated object during interaction, thereby\nmitigating the drawback of multi-object feature fusion present during\ninteraction in prior work. To further ensure subject semantic consistency\nthroughout the video, we incorporate appearance- and shape-aware latent\nrepresentations for objects. Extensive experiments on the challenging Bridge V2\ndataset, as well as in-the-wild evaluation, demonstrate that our method\noutperforms existing approaches, establishing new state-of-the-art performance\nin trajectory-controlled video generation for robotic manipulation.", "authors": ["Xiao Fu", "Xintao Wang", "Xian Liu", "Jianhong Bai", "Runsen Xu"], "categories": ["cs.CV"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2506.01943", "pdf_url": "https://arxiv.org/pdf/2506.01943", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.02672", "date": "2025-06-03", "title": "EvaLearn: Quantifying the Learning Capability and Efficiency of LLMs via Sequential Problem Solving", "abstract": "We introduce EvaLearn, a pioneering benchmark designed to evaluate large language models (LLMs) on their learning capability and efficiency in challenging tasks, a critical, yet underexplored aspect of model potential. EvaLearn contains 648 challenging problems across six task types, grouped into 182 sequences, each sequence dedicated to one task type. Diverging from most existing benchmarks that evaluate models in parallel, EvaLearn requires models to solve problems sequentially, allowing them to leverage the experience gained from previous solutions. EvaLearn provides five comprehensive automated metrics to evaluate models and quantify their learning capability and efficiency. We extensively benchmark nine frontier models and observe varied performance profiles: some models, such as Claude-3.7-sonnet, start with moderate initial performance but exhibit strong learning ability, while some models struggle to benefit from experience and may even show negative transfer. Moreover, we investigate model performance under two learning settings and find that instance-level rubrics and teacher-model feedback further facilitate model learning. Importantly, we observe that current LLMs with stronger static abilities do not show a clear advantage in learning capability across all tasks, highlighting that EvaLearn evaluates a new dimension of model performance. We hope EvaLearn provides a novel evaluation perspective for assessing LLM potential and understanding the gap between models and human capabilities, promoting the development of deeper and more dynamic evaluation approaches. All datasets, the automatic evaluation framework, and the results studied in this paper are available at the GitHub repository.", "authors": ["Authors:Shihan Dou", "Ming Zhang", "Chenhao Huang", "Jiayi Chen", "Feng Chen"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2506.02672", "pdf_url": "https://arxiv.org/pdf/2506.02672", "github_repo": "https://github.com/bytedance-seed/EvaLearn", "source": "github_org"}, {"id": "2506.01937", "date": "2025-06-02", "title": "RewardBench 2: Advancing Reward Model Evaluation", "abstract": "Reward models are used throughout the post-training of language models to capture nuanced signals from preference data and provide a training target for optimization across instruction following, reasoning, safety, and more domains. The community has begun establishing best practices for evaluating reward models, from the development of benchmarks that test capabilities in specific skill areas to others that test agreement with human preferences. At the same time, progress in evaluation has not been mirrored by the effectiveness of reward models in downstream tasks -- simpler direct alignment algorithms are reported to work better in many cases. This paper introduces RewardBench 2, a new multi-skill reward modeling benchmark designed to bring new, challenging data for accuracy-based reward model evaluation -- models score about 20 points on average lower on RewardBench 2 compared to the first RewardBench -- while being highly correlated with downstream performance. Compared to most other benchmarks, RewardBench 2 sources new human prompts instead of existing prompts from downstream evaluations, facilitating more rigorous evaluation practices. In this paper, we describe our benchmark construction process and report how existing models perform on it, while quantifying how performance on the benchmark correlates with downstream use of the models in both inference-time scaling algorithms, like best-of-N sampling, and RLHF training algorithms like proximal policy optimization.", "authors": ["Authors:Saumya Malik", "Valentina Pyatkin", "Sander Land", "Jacob Morrison", "Noah A. Smith"], "categories": ["Computation"], "companies": ["Allen AI"], "abs_url": "https://arxiv.org/abs/2506.01937", "pdf_url": "https://arxiv.org/pdf/2506.01937", "github_repo": "https://github.com/allenai/reward-bench", "source": "github_org"}, {"id": "2505.22938", "date": "2025-05-30", "title": "Fast Isotropic Median Filtering", "abstract": "Median filtering is a cornerstone of computational image processing. It\nprovides an effective means of image smoothing, with minimal blurring or\nsoftening of edges, invariance to monotonic transformations such as gamma\nadjustment, and robustness to noise and outliers. However, known algorithms\nhave all suffered from practical limitations: the bit depth of the image data,\nthe size of the filter kernel, or the kernel shape itself. Square-kernel\nimplementations tend to produce streaky cross-hatching artifacts, and nearly\nall known efficient algorithms are in practice limited to square kernels. We\npresent for the first time a method that overcomes all of these limitations.\nOur method operates efficiently on arbitrary bit-depth data, arbitrary kernel\nsizes, and arbitrary convex kernel shapes, including circular shapes.", "authors": ["Ben Weiss"], "categories": ["cs.CV", "cs.DS"], "companies": ["Google"], "abs_url": "https://arxiv.org/abs/2505.22938", "pdf_url": "https://arxiv.org/pdf/2505.22938", "github_repo": "", "source": "daily_arxiv"}, {"id": "2506.00123", "date": "2025-05-30", "title": "Visual Embodied Brain: Let Multimodal Large Language Models See, Think, and Control in Spaces", "abstract": "The remarkable progress of Multimodal Large Language Models (MLLMs) has attracted increasing attention to extend them to physical entities like legged robot. This typically requires MLLMs to not only grasp multimodal understanding abilities, but also integrate visual-spatial reasoning and physical interaction capabilities. Nevertheless,existing methods struggle to unify these capabilities due to their fundamental this http URL this paper, we present the Visual Embodied Brain (VeBrain), a unified framework for perception, reasoning, and control in real world. VeBrain reformulates robotic control into common text-based MLLM tasks in the 2D visual space, thus unifying the objectives and mapping spaces of different tasks. Then, a novel robotic adapter is proposed to convert textual control signals from MLLMs to motion policies of real robots. From the data perspective, we further introduce VeBrain-600k, a high-quality instruction dataset encompassing various capabilities of VeBrain. In VeBrain-600k, we take hundreds of hours to collect, curate and annotate the data, and adopt multimodal chain-of-thought(CoT) to mix the different capabilities into a single conversation. Extensive experiments on 13 multimodal benchmarks and 5 spatial intelligence benchmarks demonstrate the superior performance of VeBrain to existing MLLMs like Qwen2.5-VL. When deployed to legged robots and robotic arms, VeBrain shows strong adaptability, flexibility, and compositional capabilities compared to existing methods. For example, compared to Qwen2.5-VL, VeBrain not only achieves substantial gains on MMVet by +5.6%, but also excels in legged robot tasks with +50% average gains.", "authors": ["Authors:Gen Luo", "Ganlin Yang", "Ziyang Gong", "Guanzhou Chen", "Haonan Duan"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2506.00123", "pdf_url": "https://arxiv.org/pdf/2506.00123", "github_repo": "https://github.com/OpenGVLab/VeBrain", "source": "github_org"}, {"id": "2505.22338", "date": "2025-05-29", "title": "Text2Grad: Reinforcement Learning from Natural Language Feedback", "abstract": "Traditional RLHF optimizes language models with coarse, scalar rewards that\nmask the fine-grained reasons behind success or failure, leading to slow and\nopaque learning. Recent work augments RL with textual critiques through\nprompting or reflection, improving interpretability but leaving model\nparameters untouched. We introduce Text2Grad, a reinforcement-learning paradigm\nthat turns free-form textual feedback into span-level gradients. Given human\n(or programmatic) critiques, Text2Grad aligns each feedback phrase with the\nrelevant token spans, converts these alignments into differentiable reward\nsignals, and performs gradient updates that directly refine the offending\nportions of the model's policy. This yields precise, feedback-conditioned\nadjustments instead of global nudges. Text2Grad is realized through three\ncomponents: (1) a high-quality feedback-annotation pipeline that pairs\ncritiques with token spans; (2) a fine-grained reward model that predicts\nspan-level reward on answer while generating explanatory critiques; and (3) a\nspan-level policy optimizer that back-propagates natural-language gradients.\nAcross summarization, code generation, and question answering, Text2Grad\nconsistently surpasses scalar-reward RL and prompt-only baselines, providing\nboth higher task metrics and richer interpretability. Our results demonstrate\nthat natural-language feedback, when converted to gradients, is a powerful\nsignal for fine-grained policy optimization. The code for our method is\navailable at https://github.com/microsoft/Text2Grad", "authors": ["Hanyang Wang", "Lu Wang", "Chaoyun Zhang", "Tianjun Mao", "Si Qin"], "categories": ["cs.CL", "cs.AI"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2505.22338", "pdf_url": "https://arxiv.org/pdf/2505.22338", "github_repo": "", "source": "daily_arxiv"}, {"id": "2505.23762", "date": "2025-05-29", "title": "ZeroGUI: Automating Online GUI Learning at Zero Human Cost", "abstract": "The rapid advancement of large Vision-Language Models (VLMs) has propelled the development of pure-vision-based GUI Agents, capable of perceiving and operating Graphical User Interfaces (GUI) to autonomously fulfill user instructions. However, existing approaches usually adopt an offline learning framework, which faces two core limitations: (1) heavy reliance on high-quality manual annotations for element grounding and action supervision, and (2) limited adaptability to dynamic and interactive environments. To address these limitations, we propose ZeroGUI, a scalable, online learning framework for automating GUI Agent training at Zero human cost. Specifically, ZeroGUI integrates (i) VLM-based automatic task generation to produce diverse training goals from the current environment state, (ii) VLM-based automatic reward estimation to assess task success without hand-crafted evaluation functions, and (iii) two-stage online reinforcement learning to continuously interact with and learn from GUI environments. Experiments on two advanced GUI Agents (UI-TARS and Aguvis) demonstrate that ZeroGUI significantly boosts performance across OSWorld and AndroidLab environments. The code is available at this https URL .", "authors": ["Authors:Chenyu Yang", "Shiqian Su", "Shi Liu", "Xuan Dong", "Yue Yu"], "categories": ["Artificial"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2505.23762", "pdf_url": "https://arxiv.org/pdf/2505.23762", "github_repo": "https://github.com/OpenGVLab/ZeroGUI", "source": "github_org"}, {"id": "2505.21374", "date": "2025-05-28", "title": "Video-Holmes: Can MLLM Think Like Holmes for Complex Video Reasoning?", "abstract": "Recent advances in CoT reasoning and RL post-training have been reported to\nenhance video reasoning capabilities of MLLMs. This progress naturally raises a\nquestion: can these models perform complex video reasoning in a manner\ncomparable to human experts? However, existing video benchmarks primarily\nevaluate visual perception and grounding abilities, with questions that can be\nanswered based on explicit prompts or isolated visual cues. Such benchmarks do\nnot fully capture the intricacies of real-world reasoning, where humans must\nactively search for, integrate, and analyze multiple clues before reaching a\nconclusion. To address this issue, we present Video-Holmes, a benchmark\ninspired by the reasoning process of Sherlock Holmes, designed to evaluate the\ncomplex video reasoning capabilities of MLLMs. Video-Holmes consists of 1,837\nquestions derived from 270 manually annotated suspense short films, which spans\nseven carefully designed tasks. Each task is constructed by first identifying\nkey events and causal relationships within films, and then designing questions\nthat require models to actively locate and connect multiple relevant visual\nclues scattered across different video segments. Our comprehensive evaluation\nof state-of-the-art MLLMs reveals that, while these models generally excel at\nvisual perception, they encounter substantial difficulties with integrating\ninformation and often miss critical clues. For example, the best-performing\nmodel, Gemini-2.5-Pro, achieves an accuracy of only 45%, with most models\nscoring below 40%. We aim that Video-Holmes can serve as a \"Holmes-test\" for\nmultimodal reasoning, motivating models to reason more like humans and\nemphasizing the ongoing challenges in this field. The benchmark is released in\nhttps://github.com/TencentARC/Video-Holmes.", "authors": ["Junhao Cheng", "Yuying Ge", "Teng Wang", "Yixiao Ge", "Jing Liao"], "categories": ["cs.CV"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2505.21374", "pdf_url": "https://arxiv.org/pdf/2505.21374", "github_repo": "", "source": "daily_arxiv"}, {"id": "2505.22944", "date": "2025-05-28", "title": "ATI: Any Trajectory Instruction for Controllable Video Generation", "abstract": "We propose a unified framework for motion control in video generation that seamlessly integrates camera movement, object-level translation, and fine-grained local motion using trajectory-based inputs. In contrast to prior methods that address these motion types through separate modules or task-specific designs, our approach offers a cohesive solution by projecting user-defined trajectories into the latent space of pre-trained image-to-video generation models via a lightweight motion injector. Users can specify keypoints and their motion paths to control localized deformations, entire object motion, virtual camera dynamics, or combinations of these. The injected trajectory signals guide the generative process to produce temporally consistent and semantically aligned motion sequences. Our framework demonstrates superior performance across multiple video motion control tasks, including stylized motion effects (e.g., motion brushes), dynamic viewpoint changes, and precise local motion manipulation. Experiments show that our method provides significantly better controllability and visual quality compared to prior approaches and commercial solutions, while remaining broadly compatible with various state-of-the-art video generation backbones. Project page: this https URL .", "authors": ["Authors:Angtian Wang", "Haibin Huang", "Jacob Zhiyuan Fang", "Yiding Yang", "Chongyang Ma"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2505.22944", "pdf_url": "https://arxiv.org/pdf/2505.22944", "github_repo": "https://github.com/bytedance/ATI", "source": "github_org"}, {"id": "2505.17540", "date": "2025-05-26", "title": "RePrompt: Reasoning-Augmented Reprompting for Text-to-Image Generation via Reinforcement Learning", "abstract": "Despite recent progress in text-to-image (T2I) generation, existing models\noften struggle to faithfully capture user intentions from short and\nunder-specified prompts. While prior work has attempted to enhance prompts\nusing large language models (LLMs), these methods frequently generate stylistic\nor unrealistic content due to insufficient grounding in visual semantics and\nreal-world composition. Inspired by recent advances in reasoning for language\nmodel, we propose RePrompt, a novel reprompting framework that introduces\nexplicit reasoning into the prompt enhancement process via reinforcement\nlearning. Instead of relying on handcrafted rules or stylistic rewrites, our\nmethod trains a language model to generate structured, self-reflective prompts\nby optimizing for image-level outcomes. The tailored reward models assesse the\ngenerated images in terms of human preference, semantic alignment, and visual\ncomposition, providing indirect supervision to refine prompt generation. Our\napproach enables end-to-end training without human-annotated data. Experiments\non GenEval and T2I-Compbench show that RePrompt significantly boosts spatial\nlayout fidelity and compositional generalization across diverse T2I backbones,\nestablishing new state-of-the-art results.", "authors": ["Mingrui Wu", "Lu Wang", "Pu Zhao", "Fangkai Yang", "Jianjin Zhang"], "categories": ["cs.CV", "cs.AI"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2505.17540", "pdf_url": "https://arxiv.org/pdf/2505.17540", "github_repo": "", "source": "daily_arxiv"}, {"id": "2505.17826", "date": "2025-05-26", "title": "Trinity-RFT: A General-Purpose and Unified Framework for Reinforcement Fine-Tuning of Large Language Models", "abstract": "Trinity-RFT is a general-purpose, flexible and scalable framework designed\nfor reinforcement fine-tuning (RFT) of large language models. It is built with\na decoupled design, consisting of (1) an RFT-core that unifies and generalizes\nsynchronous/asynchronous, on-policy/off-policy, and online/offline modes of\nRFT, (2) seamless integration for agent-environment interaction with high\nefficiency and robustness, and (3) systematic data pipelines optimized for RFT.\nTrinity-RFT can be easily adapted for diverse application scenarios, and serves\nas a unified platform for exploring advanced reinforcement learning paradigms.\nThis technical report outlines the vision, features, design and implementations\nof Trinity-RFT, accompanied by extensive examples demonstrating the utility and\nuser-friendliness of the proposed framework.", "authors": ["Xuchen Pan", "Yanxi Chen", "Yushuo Chen", "Yuchang Sun", "Daoyuan Chen"], "categories": ["cs.LG", "cs.CL", "cs.DC"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2505.17826", "pdf_url": "https://arxiv.org/pdf/2505.17826", "github_repo": "", "source": "daily_arxiv"}, {"id": "2505.19641", "date": "2025-05-26", "title": "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond", "abstract": "Recent advances such as OpenAI-o1 and DeepSeek R1 have demonstrated the potential of Reinforcement Learning (RL) to enhance reasoning abilities in Large Language Models (LLMs). While open-source replication efforts have primarily focused on mathematical and coding domains, methods and resources for developing general reasoning capabilities remain underexplored. This gap is partly due to the challenge of collecting diverse and verifiable reasoning data suitable for RL. We hypothesize that logical reasoning is critical for developing general reasoning capabilities, as logic forms a fundamental building block of reasoning. In this work, we present SynLogic, a data synthesis framework and dataset that generates diverse logical reasoning data at scale, encompassing 35 diverse logical reasoning tasks. The SynLogic approach enables controlled synthesis of data with adjustable difficulty and quantity. Importantly, all examples can be verified by simple rules, making them ideally suited for RL with verifiable rewards. In our experiments, we validate the effectiveness of RL training on the SynLogic dataset based on 7B and 32B models. SynLogic leads to state-of-the-art logical reasoning performance among open-source datasets, surpassing DeepSeek-R1-Distill-Qwen-32B by 6 points on BBEH. Furthermore, mixing SynLogic data with mathematical and coding tasks improves the training efficiency of these domains and significantly enhances reasoning generalization. Notably, our mixed training model outperforms DeepSeek-R1-Zero-Qwen-32B across multiple benchmarks. These findings position SynLogic as a valuable resource for advancing the broader reasoning capabilities of LLMs. We open-source both the data synthesis pipeline and the SynLogic dataset at this https URL .", "authors": ["Authors:Junteng Liu", "Yuanxiang Fan", "Zhuo Jiang", "Han Ding", "Yongyi Hu"], "categories": ["Artificial"], "companies": ["MiniMax"], "abs_url": "https://arxiv.org/abs/2505.19641", "pdf_url": "https://arxiv.org/pdf/2505.19641", "github_repo": "https://github.com/minimax-ai/SynLogic", "source": "github_org"}, {"id": "2505.17478", "date": "2025-05-23", "title": "ConfRover: Simultaneous Modeling of Protein Conformation and Dynamics via Autoregression", "abstract": "Understanding protein dynamics is critical for elucidating their biological functions. The increasing availability of molecular dynamics (MD) data enables the training of deep generative models to efficiently explore the conformational space of proteins. However, existing approaches either fail to explicitly capture the temporal dependencies between conformations or do not support direct generation of time-independent samples. To address these limitations, we introduce ConfRover, an autoregressive model that simultaneously learns protein conformation and dynamics from MD trajectories, supporting both time-dependent and time-independent sampling. At the core of our model is a modular architecture comprising: (i) an encoding layer, adapted from protein folding models, that embeds protein-specific information and conformation at each time frame into a latent space; (ii) a temporal module, a sequence model that captures conformational dynamics across frames; and (iii) an SE(3) diffusion model as the structure decoder, generating conformations in continuous space. Experiments on ATLAS, a large-scale protein MD dataset of diverse structures, demonstrate the effectiveness of our model in learning conformational dynamics and supporting a wide range of downstream tasks. ConfRover is the first model to sample both protein conformations and trajectories within a single framework, offering a novel and flexible approach for learning from protein MD data. Project website: this https URL .", "authors": ["Authors:Yuning Shen", "Lihao Wang", "Huizhuo Yuan", "Yan Wang", "Bangji Yang"], "categories": ["Machine"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2505.17478", "pdf_url": "https://arxiv.org/pdf/2505.17478", "github_repo": "https://github.com/bytedance-seed/ConfRover", "source": "github_org"}, {"id": "2505.18129", "date": "2025-05-23", "title": "One RL to See Them All: Visual Triple Unified Reinforcement Learning", "abstract": "Reinforcement learning (RL) is becoming an important direction for post-training vision-language models (VLMs), but public training methodologies for unified multimodal RL remain much less mature, especially for heterogeneous reasoning and perception-heavy tasks. We propose V-Triune, a Visual Triple Unified Reinforcement Learning methodology for unified multimodal RL. It organizes training around three coordinated abstractions: Sample-Level Reward Routing, Verifier-Level Outcome Verification, and Source-Level Diagnostics. Within this methodology, Dynamic IoU provides localization-specific reward shaping that avoids reward ambiguity under loose thresholds and reward sparsity under strict ones. Built on V-Triune, we develop Orsta (7B, 32B), a family of models jointly trained on eight reasoning and perception tasks. Under matched budgets, unified training matches or outperforms specialist mixtures. The final Orsta models improve over their backbones on MEGA-Bench, compare favorably with strong multi-task RL-VLM baselines, and transfer these gains to a broad set of downstream benchmarks. These results show that unified RL can improve both reasoning and perception within a single VLM RL this http URL V-Triune system, along with the Orsta models, is publicly available at this https URL .", "authors": ["Authors:Yan Ma", "Linge Du", "Xuyang Shen", "Shaoxiang Chen", "Pengfei Li"], "categories": ["Computer"], "companies": ["MiniMax"], "abs_url": "https://arxiv.org/abs/2505.18129", "pdf_url": "https://arxiv.org/pdf/2505.18129", "github_repo": "https://github.com/minimax-ai/One-RL-to-See-Them-All", "source": "github_org"}, {"id": "2505.14302", "date": "2025-05-20", "title": "Scaling Law for Quantization-Aware Training", "abstract": "Large language models (LLMs) demand substantial computational and memory resources, creating deployment challenges. Quantization-aware training (QAT) addresses these challenges by reducing model precision while maintaining performance. However, the scaling behavior of QAT, especially at 4-bit precision (W4A4), is not well understood. Existing QAT scaling laws often ignore key factors such as the number of training tokens and quantization granularity, which limits their applicability. This paper proposes a unified scaling law for QAT that models quantization error as a function of model size, training data volume, and quantization group size. Through 268 QAT experiments, we show that quantization error decreases as model size increases, but rises with more training tokens and coarser quantization granularity. To identify the sources of W4A4 quantization error, we decompose it into weight and activation components. Both components follow the overall trend of W4A4 quantization error, but with different sensitivities. Specifically, weight quantization error increases more rapidly with more training tokens. Further analysis shows that the activation quantization error in the FC2 layer, caused by outliers, is the primary bottleneck of W4A4 QAT quantization error. By applying mixed-precision quantization to address this bottleneck, we demonstrate that weight and activation quantization errors can converge to similar levels. Additionally, with more training data, weight quantization error eventually exceeds activation quantization error, suggesting that reducing weight quantization error is also important in such scenarios. These findings offer key insights for improving QAT research and development.", "authors": ["Authors:Mengzhao Chen", "Chaoyi Zhang", "Jing Liu", "Yutao Zeng", "Zeyue Xue"], "categories": ["Machine"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2505.14302", "pdf_url": "https://arxiv.org/pdf/2505.14302", "github_repo": "https://github.com/OpenGVLab/OmniQuant", "source": "github_org"}, {"id": "2505.14640", "date": "2025-05-20", "title": "VideoEval-Pro: Robust and Realistic Long Video Understanding Evaluation", "abstract": "Large multimodal models (LMMs) have recently emerged as a powerful tool for long video understanding (LVU), prompting the development of standardized LVU benchmarks to evaluate their performance. However, our investigation reveals a rather sober lesson for existing LVU benchmarks. First, most existing benchmarks rely heavily on multiple-choice questions (MCQs), whose evaluation results are inflated due to the possibility of guessing the correct answer; Second, a significant portion of questions in these benchmarks have strong priors to allow models to answer directly without even reading the input video. For example, Gemini-1.5-Pro can achieve over 50\\% accuracy given a random frame from a long video on Video-MME. We also observe that increasing the number of frames does not necessarily lead to improvement on existing benchmarks, which is counterintuitive. As a result, the validity and robustness of current LVU benchmarks are undermined, impeding a faithful assessment of LMMs&#39; long-video understanding capability. To tackle this problem, we propose VideoEval-Pro, a realistic LVU benchmark containing questions with open-ended short-answer, which truly require understanding the entire video. VideoEval-Pro assesses both segment-level and full-video understanding through perception and reasoning tasks. By evaluating 21 proprietary and open-source video LMMs, we conclude the following findings: (1) video LMMs show drastic performance ($&gt;$25\\%) drops on open-ended questions compared with MCQs; (2) surprisingly, higher MCQ scores do not lead to higher open-ended scores on VideoEval-Pro; (3) compared to other MCQ benchmarks, VideoEval-Pro benefits more from increasing the number of input frames. Our results show that VideoEval-Pro offers a more realistic and reliable measure of long video understanding, providing a clearer view of progress in this domain.", "authors": ["Authors:Wentao Ma", "Weiming Ren", "Yiming Jia", "Zhuofeng Li", "Ping Nie"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2505.14640", "pdf_url": "https://arxiv.org/pdf/2505.14640", "github_repo": "https://github.com/OpenGVLab/VideoChat-Flash", "source": "github_org"}, {"id": "2505.14683", "date": "2025-05-20", "title": "Emerging Properties in Unified Multimodal Pretraining", "abstract": "Unifying multimodal understanding and generation has shown impressive capabilities in cutting-edge proprietary systems. In this work, we introduce BAGEL, an open-source foundational model that natively supports multimodal understanding and generation. BAGEL is a unified, decoder-only model pretrained on trillions of tokens curated from large-scale interleaved text, image, video, and web data. When scaled with such diverse multimodal interleaved data, BAGEL exhibits emerging capabilities in complex multimodal reasoning. As a result, it significantly outperforms open-source unified models in both multimodal generation and understanding across standard benchmarks, while exhibiting advanced multimodal reasoning abilities such as free-form image manipulation, future frame prediction, 3D manipulation, and world navigation. In the hope of facilitating further opportunities for multimodal research, we share the key findings, pretraining details, data creation protocal, and release our code and checkpoints to the community. The project page is at this https URL", "authors": ["Authors:Chaorui Deng", "Deyao Zhu", "Kunchang Li", "Chenhui Gou", "Feng Li"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2505.14683", "pdf_url": "https://arxiv.org/pdf/2505.14683", "github_repo": "https://github.com/bytedance-seed/Bagel", "source": "github_org"}, {"id": "2505.13031", "date": "2025-05-19", "title": "MindOmni: Unleashing Reasoning Generation in Vision Language Models with RGPO", "abstract": "Recent text-to-image systems face limitations in handling multimodal inputs and complex reasoning tasks. We introduce MindOmni, a unified multimodal large language model that addresses these challenges by incorporating reasoning generation through reinforcement learning. MindOmni leverages a three-phase training strategy: i) design of a unified vision language model with a decoder-only diffusion module, ii) supervised fine-tuning with Chain-of-Thought (CoT) instruction data, and iii) our proposed Reasoning Generation Policy Optimization (RGPO) algorithm, utilizing multimodal feedback to effectively guide policy updates. Experimental results demonstrate that MindOmni outperforms existing models, achieving impressive performance on both understanding and generation benchmarks, meanwhile showcasing advanced fine-grained reasoning generation capabilities, especially with mathematical reasoning instruction. All codes will be made public at this https URL", "authors": ["Authors:Yicheng Xiao", "Lin Song", "Yukang Chen", "Yingmin Luo", "Yuxin Chen"], "categories": ["Artificial"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2505.13031", "pdf_url": "https://arxiv.org/pdf/2505.13031", "github_repo": "https://github.com/TencentARC/MindOmni", "source": "github_org"}, {"id": "2505.10475", "date": "2025-05-15", "title": "Parallel Scaling Law for Language Models", "abstract": "It is commonly believed that scaling language models should commit a significant space or time cost, by increasing the parameters (parameter scaling) or output tokens (inference-time scaling). We introduce the third and more inference-efficient scaling paradigm: increasing the model&#39;s parallel computation during both training and inference time. We apply $P$ diverse and learnable transformations to the input, execute forward passes of the model in parallel, and dynamically aggregate the $P$ outputs. This method, namely parallel scaling (ParScale), scales parallel computation by reusing existing parameters and can be applied to any model structure, optimization procedure, data, or task. We theoretically propose a new scaling law and validate it through large-scale pre-training, which shows that a model with $P$ parallel streams is similar to scaling the parameters by $O(\\log P)$ while showing superior inference efficiency. For example, ParScale can use up to 22$\\times$ less memory increase and 6$\\times$ less latency increase compared to parameter scaling that achieves the same performance improvement. It can also recycle an off-the-shelf pre-trained model into a parallelly scaled one by post-training on a small amount of tokens, further reducing the training budget. The new scaling law we discovered potentially facilitates the deployment of more powerful models in low-resource scenarios, and provides an alternative perspective for the role of computation in machine learning.", "authors": ["Authors:Mouxiang Chen", "Binyuan Hui", "Zeyu Cui", "Jiaxi Yang", "Dayiheng Liu"], "categories": ["Machine"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2505.10475", "pdf_url": "https://arxiv.org/pdf/2505.10475", "github_repo": "https://github.com/QwenLM/ParScale", "source": "github_org"}, {"id": "2505.10527", "date": "2025-05-15", "title": "WorldPM: Scaling Human Preference Modeling", "abstract": "Motivated by scaling laws in language modeling that demonstrate how test loss scales as a power law with model and dataset sizes, we find that similar laws exist in preference modeling. We propose World Preference Modeling$ (WorldPM) to emphasize this scaling potential, where World Preference embodies a unified representation of human preferences. In this paper, we collect preference data from public forums covering diverse user communities, and conduct extensive training using 15M-scale data across models ranging from 1.5B to 72B parameters. We observe distinct patterns across different evaluation metrics: (1) Adversarial metrics (ability to identify deceptive features) consistently scale up with increased training data and base model size; (2) Objective metrics (objective knowledge with well-defined answers) show emergent behavior in larger language models, highlighting WorldPM&#39;s scalability potential; (3) Subjective metrics (subjective preferences from a limited number of humans or AI) do not demonstrate scaling trends. Further experiments validate the effectiveness of WorldPM as a foundation for preference fine-tuning. Through evaluations on 7 benchmarks with 20 subtasks, we find that WorldPM broadly improves the generalization performance across human preference datasets of varying sizes (7K, 100K and 800K samples), with performance gains exceeding 5% on many key subtasks. Integrating WorldPM into our internal RLHF pipeline, we observe significant improvements on both in-house and public evaluation sets, with notable gains of 4% to 8% in our in-house evaluations.", "authors": ["Authors:Binghai Wang", "Runji Lin", "Keming Lu", "Le Yu", "Zhenru Zhang"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2505.10527", "pdf_url": "https://arxiv.org/pdf/2505.10527", "github_repo": "https://github.com/QwenLM/WorldPM", "source": "github_org"}, {"id": "2505.08775", "date": "2025-05-14", "title": "HealthBench: Evaluating Large Language Models Towards Improved Human Health", "abstract": "We present HealthBench, an open-source benchmark measuring the performance\nand safety of large language models in healthcare. HealthBench consists of\n5,000 multi-turn conversations between a model and an individual user or\nhealthcare professional. Responses are evaluated using conversation-specific\nrubrics created by 262 physicians. Unlike previous multiple-choice or\nshort-answer benchmarks, HealthBench enables realistic, open-ended evaluation\nthrough 48,562 unique rubric criteria spanning several health contexts (e.g.,\nemergencies, transforming clinical data, global health) and behavioral\ndimensions (e.g., accuracy, instruction following, communication). HealthBench\nperformance over the last two years reflects steady initial progress (compare\nGPT-3.5 Turbo's 16% to GPT-4o's 32%) and more rapid recent improvements (o3\nscores 60%). Smaller models have especially improved: GPT-4.1 nano outperforms\nGPT-4o and is 25 times cheaper. We additionally release two HealthBench\nvariations: HealthBench Consensus, which includes 34 particularly important\ndimensions of model behavior validated via physician consensus, and HealthBench\nHard, where the current top score is 32%. We hope that HealthBench grounds\nprogress towards model development and applications that benefit human health.", "authors": ["Rahul K. Arora", "Jason Wei", "Rebecca Soskin Hicks", "Preston Bowman", "Joaquin Quiñonero-Candela"], "categories": ["cs.CL"], "companies": ["OpenAI"], "abs_url": "https://arxiv.org/abs/2505.08775", "pdf_url": "https://arxiv.org/pdf/2505.08775", "github_repo": "", "source": "daily_arxiv"}, {"id": "2505.09343", "date": "2025-05-14", "title": "Insights into DeepSeek-V3: Scaling Challenges and Reflections on Hardware for AI Architectures", "abstract": "The rapid scaling of large language models (LLMs) has unveiled critical limitations in current hardware architectures, including constraints in memory capacity, computational efficiency, and interconnection bandwidth. DeepSeek-V3, trained on 2,048 NVIDIA H800 GPUs, demonstrates how hardware-aware model co-design can effectively address these challenges, enabling cost-efficient training and inference at scale. This paper presents an in-depth analysis of the DeepSeek-V3/R1 model architecture and its AI infrastructure, highlighting key innovations such as Multi-head Latent Attention (MLA) for enhanced memory efficiency, Mixture of Experts (MoE) architectures for optimized computation-communication trade-offs, FP8 mixed-precision training to unlock the full potential of hardware capabilities, and a Multi-Plane Network Topology to minimize cluster-level network overhead. Building on the hardware bottlenecks encountered during DeepSeek-V3&#39;s development, we engage in a broader discussion with academic and industry peers on potential future hardware directions, including precise low-precision computation units, scale-up and scale-out convergence, and innovations in low-latency communication fabrics. These insights underscore the critical role of hardware and model co-design in meeting the escalating demands of AI workloads, offering a practical blueprint for innovation in next-generation AI systems.", "authors": ["Authors:Chenggang Zhao", "Chengqi Deng", "Chong Ruan", "Damai Dai", "Huazuo Gao"], "categories": ["Distributed,"], "companies": ["DeepSeek"], "abs_url": "https://arxiv.org/abs/2505.09343", "pdf_url": "https://arxiv.org/pdf/2505.09343", "github_repo": "https://github.com/deepseek-ai/open-infra-index", "source": "github_org"}, {"id": "2505.09388", "date": "2025-05-14", "title": "Qwen3 Technical Report", "abstract": "In this work, we present Qwen3, the latest version of the Qwen model family. Qwen3 comprises a series of large language models (LLMs) designed to advance performance, efficiency, and multilingual capabilities. The Qwen3 series includes models of both dense and Mixture-of-Expert (MoE) architectures, with parameter scales ranging from 0.6 to 235 billion. A key innovation in Qwen3 is the integration of thinking mode (for complex, multi-step reasoning) and non-thinking mode (for rapid, context-driven responses) into a unified framework. This eliminates the need to switch between different models--such as chat-optimized models (e.g., GPT-4o) and dedicated reasoning models (e.g., QwQ-32B)--and enables dynamic mode switching based on user queries or chat templates. Meanwhile, Qwen3 introduces a thinking budget mechanism, allowing users to allocate computational resources adaptively during inference, thereby balancing latency and performance based on task complexity. Moreover, by leveraging the knowledge from the flagship models, we significantly reduce the computational resources required to build smaller-scale models, while ensuring their highly competitive performance. Empirical evaluations demonstrate that Qwen3 achieves state-of-the-art results across diverse benchmarks, including tasks in code generation, mathematical reasoning, agent tasks, etc., competitive against larger MoE models and proprietary models. Compared to its predecessor Qwen2.5, Qwen3 expands multilingual support from 29 to 119 languages and dialects, enhancing global accessibility through improved cross-lingual understanding and generation capabilities. To facilitate reproducibility and community-driven research and development, all Qwen3 models are publicly accessible under Apache 2.0.", "authors": ["Authors:An Yang", "Anfeng Li", "Baosong Yang", "Beichen Zhang", "Binyuan Hui"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2505.09388", "pdf_url": "https://arxiv.org/pdf/2505.09388", "github_repo": "https://github.com/QwenLM/Qwen3", "source": "github_org"}, {"id": "2505.08699", "date": "2025-05-13", "title": "Granite-speech: open-source speech-aware LLMs with strong English ASR capabilities", "abstract": "Granite-speech LLMs are compact and efficient speech language models specifically designed for English ASR and automatic speech translation (AST). The models were trained by modality aligning the 2B and 8B parameter variants of granite-3.3-instruct to speech on publicly available open-source corpora containing audio inputs and text targets consisting of either human transcripts for ASR or automatically generated translations for AST. Comprehensive benchmarking shows that on English ASR, which was our primary focus, they outperform several competitors&#39; models that were trained on orders of magnitude more proprietary data, and they keep pace on English-to-X AST for major European languages, Japanese, and Chinese. The speech-specific components are: a conformer acoustic encoder using block attention and self-conditioning trained with connectionist temporal classification, a windowed query-transformer speech modality adapter used to do temporal downsampling of the acoustic embeddings and map them to the LLM text embedding space, and LoRA adapters to further fine-tune the text LLM. Granite-speech-3.3 operates in two modes: in speech mode, it performs ASR and AST by activating the encoder, projector, and LoRA adapters; in text mode, it calls the underlying granite-3.3-instruct model directly (without LoRA), essentially preserving all the text LLM capabilities and safety. Both models are freely available on HuggingFace ( this https URL and this https URL ) and can be used for both research and commercial purposes under a permissive Apache 2.0 license.", "authors": ["Authors:George Saon", "Avihu Dekel", "Alexander Brooks", "Tohru Nagano", "Abraham Daniels"], "categories": ["Audio"], "companies": ["IBM"], "abs_url": "https://arxiv.org/abs/2505.08699", "pdf_url": "https://arxiv.org/pdf/2505.08699", "github_repo": "https://github.com/ibm-granite/granite-speech-models", "source": "github_org"}, {"id": "2505.07747", "date": "2025-05-12", "title": "Step1X-3D: Towards High-Fidelity and Controllable Generation of Textured 3D Assets", "abstract": "While generative artificial intelligence has advanced significantly across text, image, audio, and video domains, 3D generation remains comparatively underdeveloped due to fundamental challenges such as data scarcity, algorithmic limitations, and ecosystem fragmentation. To this end, we present Step1X-3D, an open framework addressing these challenges through: (1) a rigorous data curation pipeline processing &gt;5M assets to create a 2M high-quality dataset with standardized geometric and textural properties; (2) a two-stage 3D-native architecture combining a hybrid VAE-DiT geometry generator with an diffusion-based texture synthesis module; and (3) the full open-source release of models, training code, and adaptation modules. For geometry generation, the hybrid VAE-DiT component produces TSDF representations by employing perceiver-based latent encoding with sharp edge sampling for detail preservation. The diffusion-based texture synthesis module then ensures cross-view consistency through geometric conditioning and latent-space synchronization. Benchmark results demonstrate state-of-the-art performance that exceeds existing open-source methods, while also achieving competitive quality with proprietary solutions. Notably, the framework uniquely bridges the 2D and 3D generation paradigms by supporting direct transfer of 2D control techniques~(e.g., LoRA) to 3D synthesis. By simultaneously advancing data quality, algorithmic fidelity, and reproducibility, Step1X-3D aims to establish new standards for open research in controllable 3D asset generation.", "authors": ["Authors:Weiyu Li", "Xuanyang Zhang", "Zheng Sun", "Di Qi", "Hao Li"], "categories": ["Computer"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2505.07747", "pdf_url": "https://arxiv.org/pdf/2505.07747", "github_repo": "https://github.com/stepfun-ai/Step1X-3D", "source": "github_org"}, {"id": "2505.07062", "date": "2025-05-11", "title": "Seed1.5-VL Technical Report", "abstract": "We present Seed1.5-VL, a vision-language foundation model designed to advance general-purpose multimodal understanding and reasoning. Seed1.5-VL is composed with a 532M-parameter vision encoder and a Mixture-of-Experts (MoE) LLM of 20B active parameters. Despite its relatively compact architecture, it delivers strong performance across a wide spectrum of public VLM benchmarks and internal evaluation suites, achieving the state-of-the-art performance on 38 out of 60 public benchmarks. Moreover, in agent-centric tasks such as GUI control and gameplay, Seed1.5-VL outperforms leading multimodal systems, including OpenAI CUA and Claude 3.7. Beyond visual and video understanding, it also demonstrates strong reasoning abilities, making it particularly effective for multimodal reasoning challenges such as visual puzzles. We believe these capabilities will empower broader applications across diverse tasks. In this report, we mainly provide a comprehensive review of our experiences in building Seed1.5-VL across model design, data construction, and training at various stages, hoping that this report can inspire further research. Seed1.5-VL is now accessible at this https URL (Volcano Engine Model ID: doubao-1-5-thinking-vision-pro-250428)", "authors": ["Authors:Dong Guo", "Faming Wu", "Feida Zhu", "Fuxing Leng", "Guang Shi"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2505.07062", "pdf_url": "https://arxiv.org/pdf/2505.07062", "github_repo": "https://github.com/bytedance-seed/Seed1.5-VL", "source": "github_org"}, {"id": "2505.06120", "date": "2025-05-09", "title": "LLMs Get Lost In Multi-Turn Conversation", "abstract": "Large Language Models (LLMs) are conversational interfaces. As such, LLMs have the potential to assist their users not only when they can fully specify the task at hand, but also to help them define, explore, and refine what they need through multi-turn conversational exchange. Although analysis of LLM conversation logs has confirmed that underspecification occurs frequently in user instructions, LLM evaluation has predominantly focused on the single-turn, fully-specified instruction setting. In this work, we perform large-scale simulation experiments to compare LLM performance in single- and multi-turn settings. Our experiments confirm that all the top open- and closed-weight LLMs we test exhibit significantly lower performance in multi-turn conversations than single-turn, with an average drop of 39% across six generation tasks. Analysis of 200,000+ simulated conversations decomposes the performance degradation into two components: a minor loss in aptitude and a significant increase in unreliability. We find that LLMs often make assumptions in early turns and prematurely attempt to generate final solutions, on which they overly rely. In simpler terms, we discover that *when LLMs take a wrong turn in a conversation, they get lost and do not recover*.", "authors": ["Authors:Philippe Laban", "Hiroaki Hayashi", "Yingbo Zhou", "Jennifer Neville"], "categories": ["Computation"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2505.06120", "pdf_url": "https://arxiv.org/pdf/2505.06120", "github_repo": "https://github.com/microsoft/lost_in_conversation", "source": "github_org"}, {"id": "2505.05335", "date": "2025-05-08", "title": "FLAM: Frame-Wise Language-Audio Modeling", "abstract": "Recent multi-modal audio-language models (ALMs) excel at text-audio retrieval but struggle with frame-wise audio understanding. Prior works use temporal-aware labels or unsupervised training to improve frame-wise capabilities, but they still lack fine-grained labeling capability to pinpoint when an event occurs. While traditional sound event detection models can precisely localize events, they are limited to pre-defined categories, making them ineffective for real-world scenarios with out-of-distribution events. In this work, we introduce FLAM, an open-vocabulary contrastive audio-language model capable of localizing specific sound events. FLAM employs a memory-efficient and calibrated frame-wise objective with logit adjustment to address spurious correlations, such as event dependencies and label imbalances during training. To enable frame-wise supervision, we leverage a large-scale dataset with diverse audio events, LLM-generated captions and simulation. Experimental results and case studies demonstrate that FLAM significantly improves the open-vocabulary localization capability while maintaining strong performance in global retrieval and downstream tasks.", "authors": ["Authors:Yusong Wu", "Christos Tsirigotis", "Ke Chen", "Cheng-Zhi Anna Huang", "Aaron Courville"], "categories": ["Sound"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2505.05335", "pdf_url": "https://arxiv.org/pdf/2505.05335", "github_repo": "https://github.com/adobe-research/openflam", "source": "github_org"}, {"id": "2505.05422", "date": "2025-05-08", "title": "TokLIP: Marry Visual Tokens to CLIP for Multimodal Comprehension and Generation", "abstract": "Pioneering token-based works such as Chameleon and Emu3 have established a foundation for multimodal unification but face challenges of high training computational overhead and limited comprehension performance due to a lack of high-level semantics. In this paper, we introduce TokLIP, a visual tokenizer that enhances comprehension by semanticizing vector-quantized (VQ) tokens and incorporating CLIP-level semantics while enabling end-to-end multimodal autoregressive training with standard VQ tokens. TokLIP integrates a low-level discrete VQ tokenizer with a ViT-based token encoder to capture high-level continuous semantics. Unlike previous approaches (e.g., VILA-U) that discretize high-level features, TokLIP disentangles training objectives for comprehension and generation, allowing the direct application of advanced VQ tokenizers without the need for tailored quantization operations. Our empirical results demonstrate that TokLIP achieves exceptional data efficiency, empowering visual tokens with high-level semantic understanding while enhancing low-level generative capacity, making it well-suited for autoregressive Transformers in both comprehension and generation tasks. The code and models are available at this https URL .", "authors": ["Authors:Haokun Lin", "Teng Wang", "Yixiao Ge", "Yuying Ge", "Zhichao Lu"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2505.05422", "pdf_url": "https://arxiv.org/pdf/2505.05422", "github_repo": "https://github.com/TencentARC/TokLIP", "source": "github_org"}, {"id": "2505.02370", "date": "2025-05-06", "title": "SuperEdit: Rectifying and Facilitating Supervision for Instruction-Based Image Editing", "abstract": "Due to the challenges of manually collecting accurate editing data, existing\ndatasets are typically constructed using various automated methods, leading to\nnoisy supervision signals caused by the mismatch between editing instructions\nand original-edited image pairs. Recent efforts attempt to improve editing\nmodels through generating higher-quality edited images, pre-training on\nrecognition tasks, or introducing vision-language models (VLMs) but fail to\nresolve this fundamental issue. In this paper, we offer a novel solution by\nconstructing more effective editing instructions for given image pairs. This\nincludes rectifying the editing instructions to better align with the\noriginal-edited image pairs and using contrastive editing instructions to\nfurther enhance their effectiveness. Specifically, we find that editing models\nexhibit specific generation attributes at different inference steps,\nindependent of the text. Based on these prior attributes, we define a unified\nguide for VLMs to rectify editing instructions. However, there are some\nchallenging editing scenarios that cannot be resolved solely with rectified\ninstructions. To this end, we further construct contrastive supervision signals\nwith positive and negative instructions and introduce them into the model\ntraining using triplet loss, thereby further facilitating supervision\neffectiveness. Our method does not require the VLM modules or pre-training\ntasks used in previous work, offering a more direct and efficient way to\nprovide better supervision signals, and providing a novel, simple, and\neffective solution for instruction-based image editing. Results on multiple\nbenchmarks demonstrate that our method significantly outperforms existing\napproaches. Compared with previous SOTA SmartEdit, we achieve 9.19%\nimprovements on the Real-Edit benchmark with 30x less training data and 13x\nsmaller model size.", "authors": ["Ming Li", "Xin Gu", "Fan Chen", "Xiaoying Xing", "Longyin Wen"], "categories": ["cs.CV", "cs.AI", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2505.02370", "pdf_url": "https://arxiv.org/pdf/2505.02370", "github_repo": "", "source": "daily_arxiv"}, {"id": "2505.03171", "date": "2025-05-06", "title": "CombiBench: Benchmarking LLM Capability for Combinatorial Mathematics", "abstract": "Neurosymbolic approaches integrating large language models with formal reasoning have recently achieved human-level performance on mathematics competition problems in algebra, geometry and number theory. In comparison, combinatorics remains a challenging domain, characterized by a lack of appropriate benchmarks and theorem libraries. To address this gap, we introduce CombiBench, a comprehensive benchmark comprising 100 combinatorial problems, each formalized in Lean~4 and paired with its corresponding informal statement. The problem set covers a wide spectrum of difficulty levels, ranging from middle school to IMO and university level, and span over ten combinatorial topics. CombiBench is suitable for testing IMO solving capabilities since it includes all IMO combinatorial problems since 2000 (except IMO 2004 P3 as its statement contain an images). Furthermore, we provide a comprehensive and standardized evaluation framework, dubbed Fine-Eval (for $\\textbf{F}$ill-in-the-blank $\\textbf{in}$ L$\\textbf{e}$an Evaluation), for formal mathematics. It accommodates not only proof-based problems but also, for the first time, the evaluation of fill-in-the-blank questions. Using Fine-Eval as the evaluation method and Kimina Lean Server as the backend, we benchmark several LLMs on CombiBench and observe that their capabilities for formally solving combinatorial problems remain limited. Among all models tested (none of which has been trained for this particular task), Kimina-Prover attains the best results, solving 7 problems (out of 100) under both ``with solution&#39;&#39; and ``without solution&#39;&#39; scenarios. We open source the benchmark dataset alongside with the code of the proposed evaluation method at this https URL .", "authors": ["Authors:Junqi Liu", "Xiaohan Lin", "Jonas Bayer", "Yael Dillies", "Weijie Jiang"], "categories": ["Artificial"], "companies": ["Moonshot"], "abs_url": "https://arxiv.org/abs/2505.03171", "pdf_url": "https://arxiv.org/pdf/2505.03171", "github_repo": "https://github.com/MoonshotAI/CombiBench", "source": "github_org"}, {"id": "2504.20168", "date": "2025-04-30", "title": "MICE for CATs: Model-Internal Confidence Estimation for Calibrating Agents with Tools", "abstract": "Tool-using agents that act in the world need to be both useful and safe.\nWell-calibrated model confidences can be used to weigh the risk versus reward\nof potential actions, but prior work shows that many models are poorly\ncalibrated. Inspired by interpretability literature exploring the internals of\nmodels, we propose a novel class of model-internal confidence estimators (MICE)\nto better assess confidence when calling tools. MICE first decodes from each\nintermediate layer of the language model using logitLens and then computes\nsimilarity scores between each layer's generation and the final output. These\nfeatures are fed into a learned probabilistic classifier to assess confidence\nin the decoded output. On the simulated trial and error (STE) tool-calling\ndataset using Llama3 models, we find that MICE beats or matches the baselines\non smoothed expected calibration error. Using MICE confidences to determine\nwhether to call a tool significantly improves over strong baselines on a new\nmetric, expected tool-calling utility. Further experiments show that MICE is\nsample-efficient, can generalize zero-shot to unseen APIs, and results in\nhigher tool-calling utility in scenarios with varying risk levels. Our code is\nopen source, available at https://github.com/microsoft/mice_for_cats.", "authors": ["Nishant Subramani", "Jason Eisner", "Justin Svegliato", "Benjamin Van Durme", "Yu Su"], "categories": ["cs.CL", "cs.AI", "cs.LG"], "companies": ["Microsoft"], "abs_url": "https://arxiv.org/abs/2504.20168", "pdf_url": "https://arxiv.org/pdf/2504.20168", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.20595", "date": "2025-04-30", "title": "ReasonIR: Training Retrievers for Reasoning Tasks", "abstract": "We present ReasonIR-8B, the first retriever specifically trained for general\nreasoning tasks. Existing retrievers have shown limited gains on reasoning\ntasks, in part because existing training datasets focus on short factual\nqueries tied to documents that straightforwardly answer them. We develop a\nsynthetic data generation pipeline that, for each document, our pipeline\ncreates a challenging and relevant query, along with a plausibly related but\nultimately unhelpful hard negative. By training on a mixture of our synthetic\ndata and existing public data, ReasonIR-8B achieves a new state-of-the-art of\n29.9 nDCG@10 without reranker and 36.9 nDCG@10 with reranker on BRIGHT, a\nwidely-used reasoning-intensive information retrieval (IR) benchmark. When\napplied to RAG tasks, ReasonIR-8B improves MMLU and GPQA performance by 6.4%\nand 22.6% respectively, relative to the closed-book baseline, outperforming\nother retrievers and search engines. In addition, ReasonIR-8B uses test-time\ncompute more effectively: on BRIGHT, its performance consistently increases\nwith longer and more information-rich rewritten queries; it continues to\noutperform other retrievers when combined with an LLM reranker. Our training\nrecipe is general and can be easily extended to future LLMs; to this end, we\nopen-source our code, data, and model.", "authors": ["Rulin Shao", "Rui Qiao", "Varsha Kishore", "Niklas Muennighoff", "Xi Victoria Lin"], "categories": ["cs.AI", "cs.CL", "cs.IR", "cs.LG"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2504.20595", "pdf_url": "https://arxiv.org/pdf/2504.20595", "github_repo": "", "source": "daily_arxiv"}, {"id": "2504.21356", "date": "2025-04-30", "title": "Nexus-Gen: Unified Image Understanding, Generation, and Editing via Prefilled Autoregression in Shared Embedding Space", "abstract": "Unified multimodal generative models aim to integrate image understanding and generation abilities, offering significant advantages in harnessing multimodal corpora, particularly interleaved text-image data. However, existing unified models exhibit limitations in image synthesis quality, autoregressive error accumulation, and image editing capability. In this work, we propose Nexus-Gen, a novel architecture that unifies image understanding, generation, and editing tasks in a shared image embedding space. This shared space serves as a bridge for the autoregressive and diffusion models, which seamlessly integrates their complementary strengths in cross-modal modeling. To mitigate the severe error accumulation during autoregressive embedding prediction, we propose a novel prefilled autoregression strategy that aligns training-inference dynamics by prefilling input sequences with learnable embeddings. After multi-stage and multi-task training on our constructed large-scale dataset with 26.3 million samples, Nexus-Gen achieves state-of-the-art performance on the evaluation benchmarks spanning image understanding, generation and editing tasks. All models, datasets, and source codes are released in this https URL to facilitate further advancements across the field.", "authors": ["Authors:Hong Zhang", "Zhongjie Duan", "Xingjun Wang", "Yuze Zhao", "Weiyi Lu"], "categories": ["Computer"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2504.21356", "pdf_url": "https://arxiv.org/pdf/2504.21356", "github_repo": "https://github.com/modelscope/Nexus-Gen", "source": "github_org"}, {"id": "2504.20042", "date": "2025-04-28", "title": "CompleteMe: Reference-based Human Image Completion", "abstract": "Recent methods for human image completion can reconstruct plausible body shapes but often fail to preserve unique details, such as specific clothing patterns or distinctive accessories, without explicit reference images. Even state-of-the-art reference-based inpainting approaches struggle to accurately capture and integrate fine-grained details from reference images. To address this limitation, we propose CompleteMe, a novel reference-based human image completion framework. CompleteMe employs a dual U-Net architecture combined with a Region-focused Attention (RFA) Block, which explicitly guides the model&#39;s attention toward relevant regions in reference images. This approach effectively captures fine details and ensures accurate semantic correspondence, significantly improving the fidelity and consistency of completed images. Additionally, we introduce a challenging benchmark specifically designed for evaluating reference-based human image completion tasks. Extensive experiments demonstrate that our proposed method achieves superior visual quality and semantic consistency compared to existing techniques. Project page: this https URL", "authors": ["Authors:Yu-Ju Tsai", "Brian Price", "Qing Liu", "Luis Figueroa", "Daniil Pakhomov"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2504.20042", "pdf_url": "https://arxiv.org/pdf/2504.20042", "github_repo": "https://github.com/adobe-research/CompleteMe", "source": "github_org"}, {"id": "2504.19298", "date": "2025-04-27", "title": "AndroidGen: Building an Android Language Agent under Data Scarcity", "abstract": "Large language models have opened up a world of possibilities for various NLP tasks, sparking optimism for the future. Despite their potential, LLMs have yet to be widely used as agents on real mobile devices. The main challenge is the need for high-quality data sources. Time constraints and labor intensity often hinder human annotation. On the other hand, existing LLMs exhibit inadequate completion rates and need a robust data filtration strategy. Given these challenges, we develop a framework called AndroidGen to enhance the capabilities of LLM-based agents under data scarcity. In addition, we leverage AndroidGen to collect trajectories given human tasks and train open-source LLMs on these trajectories to develop an open-source mobile agent without manually labeled trajectories. We extensively evaluate AndroidGen with AndroidWorld, AitW, and various popular applications, demonstrating its improvements and revealing potential areas for future improvement. Code, model, and data are available at this https URL .", "authors": ["Authors:Hanyu Lai", "Junjie Gao", "Xiao Liu", "Yifan Xu", "Shudan Zhang"], "categories": ["Computation"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2504.19298", "pdf_url": "https://arxiv.org/pdf/2504.19298", "github_repo": "https://github.com/THUDM/AndroidGen", "source": "github_org"}, {"id": "2504.17397", "date": "2025-04-25", "title": "Fine-tune Smarter, Not Harder: Parameter-Efficient Fine-Tuning for Geospatial Foundation Models", "abstract": "Earth observation (EO) is crucial for monitoring environmental changes,\nresponding to disasters, and managing natural resources. In this context,\nfoundation models facilitate remote sensing image analysis to retrieve relevant\ngeoinformation accurately and efficiently. However, as these models grow in\nsize, fine-tuning becomes increasingly challenging due to the associated\ncomputational resources and costs, limiting their accessibility and\nscalability. Furthermore, full fine-tuning can lead to forgetting pre-trained\nfeatures and even degrade model generalization. To address this,\nParameter-Efficient Fine-Tuning (PEFT) techniques offer a promising solution.\nIn this paper, we conduct extensive experiments with various foundation model\narchitectures and PEFT techniques to evaluate their effectiveness on five\ndifferent EO datasets. Our results provide a comprehensive comparison, offering\ninsights into when and how PEFT methods support the adaptation of pre-trained\ngeospatial models. We demonstrate that PEFT techniques match or even exceed\nfull fine-tuning performance and enhance model generalisation to unseen\ngeographic regions, while reducing training time and memory requirements.\nAdditional experiments investigate the effect of architecture choices such as\nthe decoder type or the use of metadata, suggesting UNet decoders and\nfine-tuning without metadata as the recommended configuration. We have\nintegrated all evaluated foundation models and techniques into the open-source\npackage TerraTorch to support quick, scalable, and cost-effective model\nadaptation.", "authors": ["Francesc Marti-Escofet", "Benedikt Blumenstiel", "Linus Scheibenreif", "Paolo Fraccaro", "Konrad Schindler"], "categories": ["cs.CV"], "companies": ["IBM"], "abs_url":
