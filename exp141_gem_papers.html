, "source": "github_org"}, {"id": "2509.21100", "date": "2025-09-25", "title": "VideoChat-R1.5: Visual Test-Time Scaling to Reinforce Multimodal Reasoning by Iterative Perception", "abstract": "Inducing reasoning in multimodal large language models (MLLMs) is critical for achieving human-level perception and understanding. Existing methods mainly leverage LLM reasoning to analyze parsed visuals, often limited by static perception stages. This paper introduces Visual Test-Time Scaling (VTTS), a novel approach to enhance MLLMs&#39; reasoning via iterative perception during inference. VTTS mimics humans&#39; hierarchical attention by progressively refining focus on high-confidence spatio-temporal regions, guided by updated textual predictions. Specifically, VTTS employs an Iterative Perception (ITP) mechanism, incorporating reinforcement learning with spatio-temporal supervision to optimize reasoning. To support this paradigm, we also present VTTS-80K, a dataset tailored for iterative perception. These designs allows a MLLM to enhance its performance by increasing its perceptual compute. Extensive experiments validate VTTS&#39;s effectiveness and generalization across diverse tasks and benchmarks. Our newly introduced Videochat-R1.5 model has achieved remarkable improvements, with an average increase of over 5\\%, compared to robust baselines such as Qwen2.5VL-3B and -7B, across more than 15 benchmarks that encompass video conversation, video reasoning, and spatio-temporal perception.", "authors": ["Authors:Ziang Yan", "Xinhao Li", "Yinan He", "Zhengrong Yue", "Xiangyu Zeng"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.21100", "pdf_url": "https://arxiv.org/pdf/2509.21100", "github_repo": "https://github.com/OpenGVLab/VideoChat-R1", "source": "github_org"}, {"id": "2509.21519", "date": "2025-09-25", "title": "Provable Scaling Laws of Feature Emergence from Learning Dynamics of Grokking", "abstract": "While the phenomenon of grokking, i.e., delayed generalization, has been studied extensively, it remains an open problem whether there is a mathematical framework that characterizes what kind of features will emerge, how and in which conditions it happens, and is closely related to the gradient dynamics of the training, for complex structured inputs. We propose a novel framework, named $\\mathbf{Li}_2$, that captures three key stages for the grokking behavior of 2-layer nonlinear networks: (I) Lazy learning, (II) independent feature learning and (III) interactive feature learning. At the lazy learning stage, top layer overfits to random hidden representation and the model appears to memorize, and at the same time, the backpropagated gradient $G_F$ from the top layer now carries information about the target label, with a specific structure that enables each hidden node to learn their representation independently. Interestingly, the independent dynamics follows exactly the gradient ascent of an energy function $E$, and its local maxima are precisely the emerging features. We study whether these local-optima induced features are generalizable, their representation power, and how they change on sample size, in group arithmetic tasks. When hidden nodes start to interact in the later stage of learning, we provably show how $G_F$ changes to focus on missing features that need to be learned. Our study sheds lights on roles played by key hyperparameters such as weight decay, learning rate and sample sizes in grokking, leads to provable scaling laws of feature emergence, memorization and generalization, and reveals why recent optimizers such as Muon can be effective, from the first principles of gradient dynamics. Our analysis can be extended to multi-layers. The code is available at this https URL .", "authors": ["Authors:Yuandong Tian"], "categories": ["Machine"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2509.21519", "pdf_url": "https://arxiv.org/pdf/2509.21519", "github_repo": "https://github.com/facebookresearch/luckmatters", "source": "github_org"}, {"id": "2509.20317", "date": "2025-09-24", "title": "SIM-CoT: Supervised Implicit Chain-of-Thought", "abstract": "Implicit Chain-of-Thought (CoT) methods offer a token-efficient alternative to explicit CoT reasoning in Large Language Models (LLMs), but a persistent performance gap has limited their adoption. We identify a core latent instability issue when scaling the computational budget of implicit CoT: as the number of reasoning tokens increases, training often becomes unstable and collapses. Our analysis shows that this instability arises from latent representations becoming homogeneous and losing semantic diversity, caused by insufficient step-level supervision in current implicit CoT methods. To address this, we propose SIM-CoT, a plug-and-play training module that introduces step-level supervision to stabilize and enrich the latent reasoning space. SIM-CoT employs an auxiliary decoder during training to align each implicit token with its corresponding explicit reasoning step, ensuring latent states capture distinct and meaningful information. The auxiliary decoder is removed at inference, preserving the efficiency of implicit CoT with no added overhead. It also provides interpretability by projecting each latent token onto an explicit reasoning vocabulary, enabling per-step visualization and diagnosis. SIM-CoT significantly improves both in-domain accuracy and out-of-domain stability of implicit CoT methods, boosting Coconut by +8.2\\% on GPT-2 and CODI by +3.0\\% on LLaMA-3.1 8B. It further surpasses the explicit CoT baseline on GPT-2 by 2.1\\% with 2.3$\\times$ greater token efficiency, while closing the performance gap on larger models like LLaMA-3.1 8B. Code: this https URL", "authors": ["Authors:Xilin Wei", "Xiaoran Liu", "Yuhang Zang", "Xiaoyi Dong", "Yuhang Cao"], "categories": ["Computation"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.20317", "pdf_url": "https://arxiv.org/pdf/2509.20317", "github_repo": "https://github.com/InternLM/SIM-CoT", "source": "github_org"}, {"id": "2509.20360", "date": "2025-09-24", "title": "EditVerse: Unifying Image and Video Editing and Generation with In-Context Learning", "abstract": "Recent advances in foundation models highlight a clear trend toward unification and scaling, showing emergent capabilities across diverse domains. While image generation and editing have rapidly transitioned from task-specific to unified frameworks, video generation and editing remain fragmented due to architectural limitations and data scarcity. In this work, we introduce EditVerse, a unified framework for image and video generation and editing within a single model. By representing all modalities, i.e., text, image, and video, as a unified token sequence, EditVerse leverages self-attention to achieve robust in-context learning, natural cross-modal knowledge transfer, and flexible handling of inputs and outputs with arbitrary resolutions and durations. To address the lack of video editing training data, we design a scalable data pipeline that curates 232K video editing samples and combines them with large-scale image and video datasets for joint training. Furthermore, we present EditVerseBench, the first benchmark for instruction-based video editing covering diverse tasks and resolutions. Extensive experiments and user studies demonstrate that EditVerse achieves state-of-the-art performance, surpassing existing open-source and commercial models, while exhibiting emergent editing and generation abilities across modalities.", "authors": ["Authors:Xuan Ju", "Tianyu Wang", "Yuqian Zhou", "He Zhang", "Qing Liu"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2509.20360", "pdf_url": "https://arxiv.org/pdf/2509.20360", "github_repo": "https://github.com/adobe-research/EditVerse", "source": "github_org"}, {"id": "2509.18883", "date": "2025-09-23", "title": "Introducing LongCat-Flash-Thinking: A Technical Report", "abstract": "We present LongCat-Flash-Thinking, an efficient 560-billion-parameter open-source Mixture-of-Experts (MoE) reasoning model. Its advanced capabilities are cultivated through a meticulously crafted training process, beginning with long Chain-of-Thought (CoT) data cold-start and culminating in large-scale Reinforcement Learning (RL). We first employ a well-designed cold-start training strategy, which significantly enhances the reasoning potential and equips the model with specialized skills in both formal and agentic reasoning. Then, a core innovation is our domain-parallel training scheme, which decouples optimization across distinct domains (e.g., STEM, Code, Agentic) and subsequently fuses the resulting expert models into a single, nearly Pareto-optimal model. This entire process is powered by our Dynamic ORchestration for Asynchronous rollout (DORA) system, a large-scale RL framework that delivers a greater than threefold training speedup over synchronous methods on tens of thousands of accelerators. As a result, LongCat-Flash-Thinking achieves state-of-the-art performance among open-source models on a suite of complex reasoning tasks. The model exhibits exceptional efficiency in agentic reasoning, reducing average token consumption by 64.5% (from 19, 653 to 6, 965) on AIME-25, without degrading task accuracy. We release LongCat-Flash-Thinking to promote further advances in reasoning systems and agentic AI research.", "authors": ["Authors:Meituan LongCat Team", "Anchun Gui", "Bei Li", "Bingyang Tao", "Bole Zhou"], "categories": ["Artificial"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2509.18883", "pdf_url": "https://arxiv.org/pdf/2509.18883", "github_repo": "https://github.com/meituan-longcat/LongCat-Flash-Thinking", "source": "github_org"}, {"id": "2509.19244", "date": "2025-09-23", "title": "Lavida-O: Elastic Large Masked Diffusion Models for Unified Multimodal Understanding and Generation", "abstract": "We propose Lavida-O, a unified Masked Diffusion Model (MDM) for multimodal understanding and generation. Unlike existing multimodal MDMs such as MMaDa and Muddit which only support simple image-level understanding tasks and low-resolution image generation, Lavida-O presents a single framework that enables image-level understanding, object grounding, image editing, and high-resolution (1024px) text-to-image synthesis. Lavida-O incorporates a novel Elastic Mixture-of-Transformers (Elastic-MoT) architecture that couples a lightweight generation branch with a larger understanding branch, supported by token compression, universal text conditioning and stratified sampling for efficient and high-quality generation. Lavida-O further incorporates planning and iterative self-reflection in image generation and editing tasks, seamlessly boosting generation quality with its understanding capabilities. Lavida-O achieves state-of-the-art performance on a wide range of benchmarks including RefCOCO object grounding, GenEval text-to-image generation, and ImgEdit image editing, outperforming existing autoregressive models and continuous diffusion models such as Qwen2.5-VL and FluxKontext-dev, while offering considerable speedup at inference. These advances establish Lavida-O as a new paradigm for scalable multimodal reasoning and generation.", "authors": ["Authors:Shufan Li", "Jiuxiang Gu", "Kangning Liu", "Zhe Lin", "Zijun Wei"], "categories": ["Computer"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2509.19244", "pdf_url": "https://arxiv.org/pdf/2509.19244", "github_repo": "https://github.com/adobe-research/LaVida-O", "source": "github_org"}, {"id": "2509.17437", "date": "2025-09-22", "title": "GeoPQA: Bridging the Visual Perception Gap in MLLMs for Geometric Reasoning", "abstract": "Recent advancements in reinforcement learning (RL) have enhanced the reasoning abilities of large language models (LLMs), yet the impact on multimodal LLMs (MLLMs) is limited. Particularly in vision-intensive tasks like geometric reasoning, MLLMs hallucinate frequently, leading to inaccurate reasoning. We attribute this to the perceptual bottleneck in MLLMs, which caps the benefits of reasoning training. To quantify this, we design a Geo-Perception Question-Answering (GeoPQA) benchmark, targeting basic geometric concepts and spatial relationships. Experiments on GeoPQA reveal significant shortcomings of MLLMs in visual perception, which constrain RL reward signals for effective training. To address this bottleneck, we propose a two-stage RL training framework by first enhancing the visual perception of geometric structures, then fostering reasoning capabilities. Applied to Qwen2.5-VL-3B-Instruct, our two-stage training improves geometric reasoning by 9.7% and geometric problem solving by 9.1%, compared to the direct reasoning training approach. Our method also generalizes to other vision-intensive domains like figure understanding, highlighting the importance of perceptual grounding in effective MLLM reasoning.", "authors": ["Authors:Guizhen Chen", "Weiwen Xu", "Hao Zhang", "Hou Pong Chan", "Deli Zhao"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2509.17437", "pdf_url": "https://arxiv.org/pdf/2509.17437", "github_repo": "https://github.com/DAMO-NLP-SG/GeoPQA", "source": "github_org"}, {"id": "2509.17765", "date": "2025-09-22", "title": "Qwen3-Omni Technical Report", "abstract": "We present Qwen3-Omni, a single multimodal model that, for the first time, maintains state-of-the-art performance across text, image, audio, and video without any degradation relative to single-modal counterparts. Qwen3-Omni matches the performance of same-sized single-modal models within the Qwen series and excels particularly on audio tasks. Across 36 audio and audio-visual benchmarks, Qwen3-Omni achieves open-source SOTA on 32 benchmarks and overall SOTA on 22, outperforming strong closed-source models such as Gemini-2.5-Pro, Seed-ASR, and GPT-4o-Transcribe. Qwen3-Omni adopts a Thinker-Talker MoE architecture that unifies perception and generation across text, images, audio, and video, yielding fluent text and natural real-time speech. It supports text interaction in 119 languages, speech understanding in 19 languages, and speech generation in 10 languages. To reduce first-packet latency in streaming synthesis, Talker autoregressively predicts discrete speech codecs using a multi-codebook scheme. Leveraging the representational capacity of these codebooks, we replace computationally intensive block-wise diffusion with a lightweight causal ConvNet, enabling streaming from the first codec frame. In cold-start settings, Qwen3-Omni achieves a theoretical end-to-end first-packet latency of 234 ms. To further strengthen multimodal reasoning, we introduce a Thinking model that explicitly reasons over inputs from any modality. Since the research community currently lacks a general-purpose audio captioning model, we fine-tuned Qwen3-Omni-30B-A3B to obtain Qwen3-Omni-30B-A3B-Captioner, which produces detailed, low-hallucination captions for arbitrary audio inputs. Qwen3-Omni-30B-A3B, Qwen3-Omni-30B-A3B-Thinking, and Qwen3-Omni-30B-A3B-Captioner are publicly released under the Apache 2.0 license.", "authors": ["Authors:Jin Xu", "Zhifang Guo", "Hangrui Hu", "Yunfei Chu", "Xiong Wang"], "categories": ["Computation"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2509.17765", "pdf_url": "https://arxiv.org/pdf/2509.17765", "github_repo": "https://github.com/QwenLM/Qwen3-Omni", "source": "github_org"}, {"id": "2509.15208", "date": "2025-09-19", "title": "Geometric Image Synchronization with Deep Watermarking", "abstract": "Synchronization is the task of estimating and inverting geometric\ntransformations (e.g., crop, rotation) applied to an image. This work\nintroduces SyncSeal, a bespoke watermarking method for robust image\nsynchronization, which can be applied on top of existing watermarking methods\nto enhance their robustness against geometric transformations. It relies on an\nembedder network that imperceptibly alters images and an extractor network that\npredicts the geometric transformation to which the image was subjected. Both\nnetworks are end-to-end trained to minimize the error between the predicted and\nground-truth parameters of the transformation, combined with a discriminator to\nmaintain high perceptual quality. We experimentally validate our method on a\nwide variety of geometric and valuemetric transformations, demonstrating its\neffectiveness in accurately synchronizing images. We further show that our\nsynchronization can effectively upgrade existing watermarking methods to\nwithstand geometric transformations to which they were previously vulnerable.", "authors": ["Pierre Fernandez", "Tomáš Souček", "Nikola Jovanović", "Hady Elsahar", "Sylvestre-Alvise Rebuffi"], "categories": ["cs.CV"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2509.15208", "pdf_url": "https://arxiv.org/pdf/2509.15208", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.15110", "date": "2025-09-18", "title": "TDRM: Smooth Reward Models with Temporal Difference for LLM RL and Inference", "abstract": "Reward models are central to both reinforcement learning (RL) with language models and inference-time verification. However, existing reward models often lack temporal consistency, leading to ineffective policy updates and unstable RL training. We introduce TDRM, a method for learning smoother and more reliable reward models by minimizing temporal differences (TD) for training-time reinforcement learning and inference-time verification. Experiments show that TD-trained process reward models (PRMs) improve performance across Best-of-N (up to 6.6%) and tree-search (up to 23.7%) settings. When combined with Reinforcement Learning with Verifiable Rewards (RLVR), TD-trained PRMs lead to more data-efficient RL -- achieving comparable performance with just 2.5k data to what baseline methods require 50.1k data to attain -- and yield higher-quality language model policies in 8 model variants (5 series), e.g., Qwen2.5-(0.5B, 1,5B), GLM4-9B-0414, GLM-Z1-9B-0414, Qwen2.5-Math-(1.5B, 7B), and DeepSeek-R1-Distill-Qwen-(1.5B, 7B). We release all code at this https URL .", "authors": ["Authors:Dan Zhang", "Min Cai", "Jonathan Light", "Ziniu Hu", "Yisong Yue"], "categories": ["Machine"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2509.15110", "pdf_url": "https://arxiv.org/pdf/2509.15110", "github_repo": "https://github.com/THUDM/TDRM", "source": "github_org"}, {"id": "2509.15221", "date": "2025-09-18", "title": "ScaleCUA: Scaling Open-Source Computer Use Agents with Cross-Platform Data", "abstract": "Vision-Language Models (VLMs) have enabled computer use agents (CUAs) that operate GUIs autonomously, showing great potential, yet progress is limited by the lack of large-scale, open-source computer use data and foundation models. In this work, we introduce ScaleCUA, a step toward scaling open-source CUAs. It offers a large-scale dataset spanning 6 operating systems and 3 task domains, built via a closed-loop pipeline uniting automated agents with human experts. Trained on this scaled-up data, ScaleCUA can operate seamlessly across platforms. Specifically, it delivers strong gains over baselines (+26.6 on WebArena-Lite-v2, +10.7 on ScreenSpot-Pro) and sets new state-of-the-art results (94.4% on MMBench-GUI L1-Hard, 60.6% on OSWorld-G, 47.4% on WebArena-Lite-v2). These findings underscore the power of data-driven scaling for general-purpose computer use agents. We will release data, models, and code to advance future research: this https URL .", "authors": ["Authors:Zhaoyang Liu", "Jingjing Xie", "Zichen Ding", "Zehao Li", "Bowen Yang"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.15221", "pdf_url": "https://arxiv.org/pdf/2509.15221", "github_repo": "https://github.com/OpenGVLab/ScaleCUA", "source": "github_org"}, {"id": "2509.14232", "date": "2025-09-17", "title": "GenExam: A Multidisciplinary Text-to-Image Exam", "abstract": "Exams are a fundamental test of expert-level intelligence and require integrated understanding, reasoning, and generation. Existing exam-style benchmarks mainly focus on understanding and reasoning tasks, and current generation benchmarks emphasize the illustration of world knowledge and visual concepts, neglecting the evaluation of rigorous drawing exams. We introduce GenExam, the first benchmark for multidisciplinary text-to-image exams, featuring 1,000 samples across 10 subjects with exam-style prompts organized under a four-level taxonomy. Each problem is equipped with ground-truth images and fine-grained scoring points to enable a precise evaluation of semantic correctness and visual plausibility. Experiments on 17 text-to-image and unified models demonstrate the great challenge of GenExam and the huge gap where open-source models consistently lag behind the leading closed-source ones. By framing image generation as an exam, GenExam offers a rigorous assessment of models&#39; ability to integrate understanding, reasoning, and generation, providing insights for on the path to intelligent generative models. Our benchmark and evaluation code are released at this https URL .", "authors": ["Authors:Zhaokai Wang", "Penghao Yin", "Xiangyu Zhao", "Changyao Tian", "Yu Qiao"], "categories": ["Computer"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2509.14232", "pdf_url": "https://arxiv.org/pdf/2509.14232", "github_repo": "https://github.com/OpenGVLab/GenExam", "source": "github_org"}, {"id": "2509.08940", "date": "2025-09-12", "title": "Discovering Divergent Representations between Text-to-Image Models", "abstract": "In this paper, we investigate when and how visual representations learned by\ntwo different generative models diverge. Given two text-to-image models, our\ngoal is to discover visual attributes that appear in images generated by one\nmodel but not the other, along with the types of prompts that trigger these\nattribute differences. For example, \"flames\" might appear in one model's\noutputs when given prompts expressing strong emotions, while the other model\ndoes not produce this attribute given the same prompts. We introduce CompCon\n(Comparing Concepts), an evolutionary search algorithm that discovers visual\nattributes more prevalent in one model's output than the other, and uncovers\nthe prompt concepts linked to these visual differences. To evaluate CompCon's\nability to find diverging representations, we create an automated data\ngeneration pipeline to produce ID2, a dataset of 60 input-dependent\ndifferences, and compare our approach to several LLM- and VLM-powered\nbaselines. Finally, we use CompCon to compare popular text-to-image models,\nfinding divergent representations such as how PixArt depicts prompts mentioning\nloneliness with wet streets and Stable Diffusion 3.5 depicts African American\npeople in media professions. Code at: https://github.com/adobe-research/CompCon", "authors": ["Lisa Dunlap", "Joseph E. Gonzalez", "Trevor Darrell", "Fabian Caba Heilbron", "Josef Sivic"], "categories": ["cs.CV"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2509.08940", "pdf_url": "https://arxiv.org/pdf/2509.08940", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.10446", "date": "2025-09-12", "title": "DeepDive: Advancing Deep Search Agents with Knowledge Graphs and Multi-Turn RL", "abstract": "Augmenting large language models (LLMs) with browsing tools substantially improves their potential as deep search agents to solve complex, real-world tasks. Yet, open LLMs still perform poorly in such settings due to limited long-horizon reasoning capacity with browsing tools and the lack of sufficiently difficult supervised data. To address these challenges, we present DeepDive to advance deep search agents. First, we propose a strategy to automatically synthesize complex, difficult, and hard-to-find questions from open knowledge graphs. Second, we apply end-to-end multi-turn reinforcement learning (RL) to enhance LLMs&#39; long-horizon reasoning with deep search. To encourage diversity and reduce redundancy, we design a redundancy penalty that discourages repeated similar queries. Experiments show that DeepDive-32B achieves a new open-source competitive result on BrowseComp, outperforming WebSailor, DeepSeek-R1-Browse, and Search-o1. We demonstrate that multi-turn RL training improves deep search ability and significantly contributes to the performance improvements across multiple benchmarks. We observe that DeepDive enables test-time scaling of tool calls and parallel sampling. All datasets, models, and code are publicly available at this https URL .", "authors": ["Authors:Rui Lu", "Zhenyu Hou", "Zihan Wang", "Hanchen Zhang", "Xiao Liu"], "categories": ["Computation"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2509.10446", "pdf_url": "https://arxiv.org/pdf/2509.10446", "github_repo": "https://github.com/THUDM/DeepDive", "source": "github_org"}, {"id": "2509.08826", "date": "2025-09-11", "title": "RewardDance: Reward Scaling in Visual Generation", "abstract": "Reward Models (RMs) are critical for improving generation models via\nReinforcement Learning (RL), yet the RM scaling paradigm in visual generation\nremains largely unexplored. It primarily due to fundamental limitations in\nexisting approaches: CLIP-based RMs suffer from architectural and input\nmodality constraints, while prevalent Bradley-Terry losses are fundamentally\nmisaligned with the next-token prediction mechanism of Vision-Language Models\n(VLMs), hindering effective scaling. More critically, the RLHF optimization\nprocess is plagued by Reward Hacking issue, where models exploit flaws in the\nreward signal without improving true quality. To address these challenges, we\nintroduce RewardDance, a scalable reward modeling framework that overcomes\nthese barriers through a novel generative reward paradigm. By reformulating the\nreward score as the model's probability of predicting a \"yes\" token, indicating\nthat the generated image outperforms a reference image according to specific\ncriteria, RewardDance intrinsically aligns reward objectives with VLM\narchitectures. This alignment unlocks scaling across two dimensions: (1) Model\nScaling: Systematic scaling of RMs up to 26 billion parameters; (2) Context\nScaling: Integration of task-specific instructions, reference examples, and\nchain-of-thought (CoT) reasoning. Extensive experiments demonstrate that\nRewardDance significantly surpasses state-of-the-art methods in text-to-image,\ntext-to-video, and image-to-video generation. Crucially, we resolve the\npersistent challenge of \"reward hacking\": Our large-scale RMs exhibit and\nmaintain high reward variance during RL fine-tuning, proving their resistance\nto hacking and ability to produce diverse, high-quality outputs. It greatly\nrelieves the mode collapse problem that plagues smaller models.", "authors": ["Jie Wu", "Yu Gao", "Zilyu Ye", "Ming Li", "Liang Li"], "categories": ["cs.CV"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2509.08826", "pdf_url": "https://arxiv.org/pdf/2509.08826", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.09660", "date": "2025-09-11", "title": "Steering MoE LLMs via Expert (De)Activation", "abstract": "Mixture-of-Experts (MoE) in Large Language Models (LLMs) routes each token through a subset of specialized Feed-Forward Networks (FFN), known as experts. We present SteerMoE, a framework to steer MoE models by detecting and controlling behavior-associated experts. We detect key experts by comparing how often they activate between paired inputs that demonstrate opposite behaviors (e.g., safe vs. unsafe). By selectively activating or deactivating such experts during inference, we control behaviors like faithfulness and safety without fine-tuning. Across 11 benchmarks and 6 LLMs, our steering raises safety by up to +20% and faithfulness by +27%. Alternatively, unsafe steering drops safety by -41% alone, and -100% when combined with existing jailbreak methods, bypassing all safety guardrails. Overall, SteerMoE offers a lightweight, effective, and widely applicable test-time control, while revealing unique vulnerabilities in MoE LLMs. this https URL", "authors": ["Authors:Mohsen Fayyaz", "Ali Modarressi", "Hanieh Deilamsalehy", "Franck Dernoncourt", "Ryan Rossi"], "categories": ["Computation"], "companies": ["Adobe"], "abs_url": "https://arxiv.org/abs/2509.09660", "pdf_url": "https://arxiv.org/pdf/2509.09660", "github_repo": "https://github.com/adobe-research/SteerMoE", "source": "github_org"}, {"id": "2509.18119", "date": "2025-09-10", "title": "MobileRL: Online Agentic Reinforcement Learning for Mobile GUI Agents", "abstract": "Building general-purpose graphical user interface (GUI) agents has become increasingly promising with the progress in vision language models. However, developing effective mobile GUI agents with reinforcement learning (RL) remains challenging due to the heavy-tailed distribution of task difficulty and the inefficiency of large-scale environment sampling. We present an online agentic reinforcement learning framework MobileRL to enhance GUI agents in mobile environments. Its core component is the Difficulty-ADAptive GRPO (ADAGRPO) algorithm. In ADAGRPO, we design difficulty-adaptive positive replay and failure curriculum filtering to adapt the model to different task difficulties. We introduce the shortest-path reward adjustment strategy to reshape rewards concerning the task length in multi-turn agentic tasks. Those strategies jointly stabilize RL training, improve sample efficiency, and generate strong performance across diverse mobile apps and tasks. We apply MOBILERL to two open models (Qwen2.5-VL-7B-Instruct and GLM-4.1V-9B-Base). The resultant MOBILERL-9B model achieves state-of-the-art results in terms of success rates on both AndroidWorld (80.2%) and AndroidLab (53.6%). The MOBILERL framework is open-sourced at: this https URL .", "authors": ["Authors:Yifan Xu", "Xiao Liu", "Xinghan Liu", "Jiaqi Fu", "Hanchen Zhang"], "categories": ["Machine"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2509.18119", "pdf_url": "https://arxiv.org/pdf/2509.18119", "github_repo": "https://github.com/THUDM/MobileRL", "source": "github_org"}, {"id": "2509.06818", "date": "2025-09-09", "title": "UMO: Scaling Multi-Identity Consistency for Image Customization via Matching Reward", "abstract": "Recent advancements in image customization exhibit a wide range of\napplication prospects due to stronger customization capabilities. However,\nsince we humans are more sensitive to faces, a significant challenge remains in\npreserving consistent identity while avoiding identity confusion with\nmulti-reference images, limiting the identity scalability of customization\nmodels. To address this, we present UMO, a Unified Multi-identity Optimization\nframework, designed to maintain high-fidelity identity preservation and\nalleviate identity confusion with scalability. With \"multi-to-multi matching\"\nparadigm, UMO reformulates multi-identity generation as a global assignment\noptimization problem and unleashes multi-identity consistency for existing\nimage customization methods generally through reinforcement learning on\ndiffusion models. To facilitate the training of UMO, we develop a scalable\ncustomization dataset with multi-reference images, consisting of both\nsynthesised and real parts. Additionally, we propose a new metric to measure\nidentity confusion. Extensive experiments demonstrate that UMO not only\nimproves identity consistency significantly, but also reduces identity\nconfusion on several image customization methods, setting a new\nstate-of-the-art among open-source methods along the dimension of identity\npreserving. Code and model: https://github.com/bytedance/UMO", "authors": ["Yufeng Cheng", "Wenxu Wu", "Shaojin Wu", "Mengqi Huang", "Fei Ding"], "categories": ["cs.CV", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2509.06818", "pdf_url": "https://arxiv.org/pdf/2509.06818", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.06493", "date": "2025-09-08", "title": "Scaling up Multi-Turn Off-Policy RL and Multi-Agent Tree Search for LLM Step-Provers", "abstract": "The integration of Large Language Models (LLMs) into automated theorem proving has shown immense promise, yet is fundamentally constrained by challenges in scaling up both training-time reinforcement learning (RL) and inference-time compute. This paper introduces \\texttt{BFS-Prover-V2}, a system designed to address this dual scaling problem. We present two primary innovations. The first is a novel multi-turn off-policy RL framework for continually improving the performance of LLM step-prover at training time. This framework, inspired by the principles of AlphaZero, utilizes a multi-stage expert iteration pipeline featuring adaptive tactic-level data filtering and periodic retraining to surmount the performance plateaus that typically curtail long-term RL in LLM-based agents. The second innovation is a planner-enhanced multi-agent search architecture that scales reasoning capabilities at inference time. This architecture employs a general reasoning model as a high-level planner to iteratively decompose complex theorems into a sequence of simpler subgoals. This hierarchical approach substantially reduces the search space, enabling a team of parallel prover agents to collaborate efficiently by leveraging a shared proof cache. We demonstrate that this dual approach to scaling yields state-of-the-art results on established formal mathematics benchmarks. \\texttt{BFS-Prover-V2} achieves 95.08\\% and 41.4\\% on the MiniF2F and ProofNet test sets respectively. While demonstrated in the domain of formal mathematics, the RL and inference techniques presented in this work are of broader interest and may be applied to other domains requiring long-horizon multi-turn reasoning and complex search.", "authors": ["Authors:Ran Xin", "Zeyu Zheng", "Yanchen Nie", "Kun Yuan", "Xia Xiao"], "categories": ["Artificial"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2509.06493", "pdf_url": "https://arxiv.org/pdf/2509.06493", "github_repo": "https://github.com/bytedance-seed/BFS-Prover-V2", "source": "github_org"}, {"id": "2509.01563", "date": "2025-09-03", "title": "Kwai Keye-VL 1.5 Technical Report", "abstract": "In recent years, the development of Large Language Models (LLMs) has\nsignificantly advanced, extending their capabilities to multimodal tasks\nthrough Multimodal Large Language Models (MLLMs). However, video understanding\nremains a challenging area due to the dynamic and information-dense nature of\nvideos. Existing models struggle with the trade-off between spatial resolution\nand temporal coverage when processing video content. We present Keye-VL-1.5,\nwhich addresses fundamental challenges in video comprehension through three key\ninnovations. First, we introduce a novel Slow-Fast video encoding strategy that\ndynamically allocates computational resources based on inter-frame similarity,\nprocessing key frames with significant visual changes at higher resolution\n(Slow pathway) while handling relatively static frames with increased temporal\ncoverage at lower resolution (Fast pathway). Second, we implement a progressive\nfour-stage pre-training methodology that systematically extends the model's\ncontext length from 8K to 128K tokens, enabling processing of longer videos and\nmore complex visual content. Third, we develop a comprehensive post-training\npipeline focusing on reasoning enhancement and human preference alignment,\nincorporating a 5-step chain-of-thought data construction process, iterative\nGSPO-based reinforcement learning with progressive prompt hinting for difficult\ncases, and alignment training. Through extensive evaluation on public\nbenchmarks and rigorous internal human assessment, Keye-VL-1.5 demonstrates\nsignificant improvements over existing models, particularly excelling in video\nunderstanding tasks while maintaining competitive performance on general\nmultimodal benchmarks.", "authors": ["Biao Yang", "Bin Wen", "Boyang Ding", "Changyi Liu", "Chenglong Chu"], "categories": ["cs.CV"], "companies": ["Kuaishou"], "abs_url": "https://arxiv.org/abs/2509.01563", "pdf_url": "https://arxiv.org/pdf/2509.01563", "github_repo": "", "source": "daily_arxiv"}, {"id": "2509.02460", "date": "2025-09-02", "title": "GenCompositor: Generative Video Compositing with Diffusion Transformer", "abstract": "Video compositing combines live-action footage to create video production, serving as a crucial technique in video creation and film production. Traditional pipelines require intensive labor efforts and expert collaboration, resulting in lengthy production cycles and high manpower costs. To address this issue, we automate this process with generative models, called generative video compositing. This new task strives to adaptively inject identity and motion information of foreground video to the target video in an interactive manner, allowing users to customize the size, motion trajectory, and other attributes of the dynamic elements added in final video. Specifically, we designed a novel Diffusion Transformer (DiT) pipeline based on its intrinsic properties. To maintain consistency of the target video before and after editing, we revised a light-weight DiT-based background preservation branch with masked token injection. As to inherit dynamic elements from other sources, a DiT fusion block is proposed using full self-attention, along with a simple yet effective foreground augmentation for training. Besides, for fusing background and foreground videos with different layouts based on user control, we developed a novel position embedding, named Extended Rotary Position Embedding (ERoPE). Finally, we curated a dataset comprising 61K sets of videos for our new task, called VideoComp. This data includes complete dynamic elements and high-quality target videos. Experiments demonstrate that our method effectively realizes generative video compositing, outperforming existing possible solutions in fidelity and consistency. Project is available at this https URL", "authors": ["Authors:Shuzhou Yang", "Xiaoyu Li", "Xiaodong Cun", "Guangzhi Wang", "Lingen Li"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2509.02460", "pdf_url": "https://arxiv.org/pdf/2509.02460", "github_repo": "https://github.com/TencentARC/GenCompositor", "source": "github_org"}, {"id": "2509.01322", "date": "2025-09-01", "title": "LongCat-Flash Technical Report", "abstract": "We introduce LongCat-Flash, a 560-billion-parameter Mixture-of-Experts (MoE) language model designed for both computational efficiency and advanced agentic capabilities. Stemming from the need for scalable efficiency, LongCat-Flash adopts two novel designs: (a) Zero-computation Experts, which enables dynamic computational budget allocation and activates 18.6B-31.3B (27B on average) per token depending on contextual demands, optimizing resource usage. (b) Shortcut-connected MoE, which enlarges the computation-communication overlap window, demonstrating notable gains in inference efficiency and throughput compared to models of a comparable scale. We develop a comprehensive scaling framework for large models that combines hyperparameter transfer, model-growth initialization, a multi-pronged stability suite, and deterministic computation to achieve stable and reproducible training. Notably, leveraging the synergy among scalable architectural design and infrastructure efforts, we complete model training on more than 20 trillion tokens within 30 days, while achieving over 100 tokens per second (TPS) for inference at a cost of \\$0.70 per million output tokens. To cultivate LongCat-Flash towards agentic intelligence, we conduct a large-scale pre-training on optimized mixtures, followed by targeted mid- and post-training on reasoning, code, and instructions, with further augmentation from synthetic data and tool use tasks. Comprehensive evaluations demonstrate that, as a non-thinking foundation model, LongCat-Flash delivers highly competitive performance among other leading models, with exceptional strengths in agentic tasks. The model checkpoint of LongCat-Flash is open-sourced to foster community research. LongCat Chat: this https URL Hugging Face: this https URL GitHub: this https URL", "authors": ["Authors:Meituan LongCat Team", "Bayan", "Bei Li", "Bingye Lei", "Bo Wang"], "categories": ["Computation"], "companies": ["Meituan"], "abs_url": "https://arxiv.org/abs/2509.01322", "pdf_url": "https://arxiv.org/pdf/2509.01322", "github_repo": "https://github.com/meituan-longcat/LongCat-Flash-Chat", "source": "github_org"}, {"id": "2509.00244", "date": "2025-08-29", "title": "Universal Deep Research: Bring Your Own Model and Strategy", "abstract": "Deep research tools are among the most impactful and most commonly encountered agentic systems today. We observe, however, that each deep research agent introduced so far is hard-coded to carry out a particular research strategy using a fixed choice of tools. We introduce Universal Deep Research (UDR), a generalist agentic system that wraps around any language model and enables the user to create, edit, and refine their own entirely custom deep research strategies without any need for additional training or finetuning. To showcase the generality of our system, we equip UDR with example minimal, expansive, and intensive research strategies, and provide a user interface to facilitate experimentation with the system.", "authors": ["Authors:Peter Belcak", "Pavlo Molchanov"], "categories": ["Artificial"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2509.00244", "pdf_url": "https://arxiv.org/pdf/2509.00244", "github_repo": "https://github.com/NVlabs/UniversalDeepResearch", "source": "github_org"}, {"id": "2508.18783", "date": "2025-08-27", "title": "Controllable Conversational Theme Detection Track at DSTC 12", "abstract": "Conversational analytics has been on the forefront of transformation driven\nby the advances in Speech and Natural Language Processing techniques. Rapid\nadoption of Large Language Models (LLMs) in the analytics field has taken the\nproblems that can be automated to a new level of complexity and scale. In this\npaper, we introduce Theme Detection as a critical task in conversational\nanalytics, aimed at automatically identifying and categorizing topics within\nconversations. This process can significantly reduce the manual effort involved\nin analyzing expansive dialogs, particularly in domains like customer support\nor sales. Unlike traditional dialog intent detection, which often relies on a\nfixed set of intents for downstream system logic, themes are intended as a\ndirect, user-facing summary of the conversation's core inquiry. This\ndistinction allows for greater flexibility in theme surface forms and\nuser-specific customizations. We pose Controllable Conversational Theme\nDetection problem as a public competition track at Dialog System Technology\nChallenge (DSTC) 12 -- it is framed as joint clustering and theme labeling of\ndialog utterances, with the distinctive aspect being controllability of the\nresulting theme clusters' granularity achieved via the provided user preference\ndata. We give an overview of the problem, the associated dataset and the\nevaluation metrics, both automatic and human. Finally, we discuss the\nparticipant teams' submissions and provide insights from those. The track\nmaterials (data and code) are openly available in the GitHub repository.", "authors": ["Igor Shalyminov", "Hang Su", "Jake Vincent", "Siffi Singh", "Jason Cai"], "categories": ["cs.CL"], "companies": ["Amazon"], "abs_url": "https://arxiv.org/abs/2508.18783", "pdf_url": "https://arxiv.org/pdf/2508.18783", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.18966", "date": "2025-08-27", "title": "USO: Unified Style and Subject-Driven Generation via Disentangled and Reward Learning", "abstract": "Existing literature typically treats style-driven and subject-driven\ngeneration as two disjoint tasks: the former prioritizes stylistic similarity,\nwhereas the latter insists on subject consistency, resulting in an apparent\nantagonism. We argue that both objectives can be unified under a single\nframework because they ultimately concern the disentanglement and\nre-composition of content and style, a long-standing theme in style-driven\nresearch. To this end, we present USO, a Unified Style-Subject Optimized\ncustomization model. First, we construct a large-scale triplet dataset\nconsisting of content images, style images, and their corresponding stylized\ncontent images. Second, we introduce a disentangled learning scheme that\nsimultaneously aligns style features and disentangles content from style\nthrough two complementary objectives, style-alignment training and\ncontent-style disentanglement training. Third, we incorporate a style\nreward-learning paradigm denoted as SRL to further enhance the model's\nperformance. Finally, we release USO-Bench, the first benchmark that jointly\nevaluates style similarity and subject fidelity across multiple metrics.\nExtensive experiments demonstrate that USO achieves state-of-the-art\nperformance among open-source models along both dimensions of subject\nconsistency and style similarity. Code and model:\nhttps://github.com/bytedance/USO", "authors": ["Shaojin Wu", "Mengqi Huang", "Yufeng Cheng", "Wenxu Wu", "Jiahe Tian"], "categories": ["cs.CV", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.18966", "pdf_url": "https://arxiv.org/pdf/2508.18966", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.19576", "date": "2025-08-27", "title": "ReST-RL: Achieving Accurate Code Reasoning of LLMs with Optimized Self-Training and Decoding", "abstract": "With respect to improving the reasoning accuracy of LLMs, the representative reinforcement learning (RL) method GRPO faces failure due to insignificant reward variance, while verification methods based on process reward models (PRMs) suffer from difficulties with training data acquisition and verification effectiveness. To tackle these problems, this paper introduces ReST-RL, a unified LLM RL paradigm that significantly improves LLM&#39;s code reasoning ability by combining an improved GRPO algorithm with a meticulously designed test time decoding method assisted by a value model (VM). As the first stage of policy reinforcement, ReST-GRPO adopts an optimized ReST algorithm to filter and assemble high-value training data, increasing the reward variance of GRPO sampling, thus improving the effectiveness and efficiency of training. After the basic reasoning ability of LLM policy has been improved, we further propose a test time decoding optimization method called VM-MCTS. Through Monte-Carlo Tree Search (MCTS), we collect accurate value targets with no annotation required, on which VM training is based. When decoding, the VM is deployed by an adapted MCTS algorithm to provide precise process signals as well as verification scores, assisting the LLM policy to achieve high reasoning accuracy. We conduct extensive experiments on coding problems to verify the validity of the proposed RL paradigm. Upon comparison, our approach significantly outperforms other reinforcement training baselines (e.g., naive GRPO and ReST-DPO), as well as decoding and verification baselines (e.g., PRM-BoN and ORM-MCTS) on well-known coding benchmarks of various levels (e.g., APPS, BigCodeBench, and HumanEval), indicating its power to strengthen the reasoning ability of LLM policies. Codes for our project can be found at this https URL .", "authors": ["Authors:Sining Zhoubian", "Dan Zhang", "Jie Tang"], "categories": ["Artificial"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2508.19576", "pdf_url": "https://arxiv.org/pdf/2508.19576", "github_repo": "https://github.com/THUDM/ReST-RL", "source": "github_org"}, {"id": "2508.18860", "date": "2025-08-26", "title": "C-Flat++: Towards a More Efficient and Powerful Framework for Continual Learning", "abstract": "Balancing sensitivity to new tasks and stability for retaining past knowledge is crucial in continual learning (CL). Recently, sharpness-aware minimization has proven effective in transfer learning and has also been adopted in continual learning (CL) to improve memory retention and learning efficiency. However, relying on zeroth-order sharpness alone may favor sharper minima over flatter ones in certain settings, leading to less robust and potentially suboptimal solutions. In this paper, we propose \\textbf{C}ontinual \\textbf{Flat}ness (\\textbf{C-Flat}), a method that promotes flatter loss landscapes tailored for CL. C-Flat offers plug-and-play compatibility, enabling easy integration with minimal modifications to the code pipeline. Besides, we present a general framework that integrates C-Flat into all major CL paradigms and conduct comprehensive comparisons with loss-minima optimizers and flat-minima-based CL methods. Our results show that C-Flat consistently improves performance across a wide range of settings. In addition, we introduce C-Flat++, an efficient yet effective framework that leverages selective flatness-driven promotion, significantly reducing the update cost required by C-Flat. Extensive experiments across multiple CL methods, datasets, and scenarios demonstrate the effectiveness and efficiency of our proposed approaches. Code is available at this https URL .", "authors": ["Authors:Wei Li", "Hangjie Yuan", "Zixiang Zhao", "Yifan Zhu", "Aojun Lu"], "categories": ["Machine"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2508.18860", "pdf_url": "https://arxiv.org/pdf/2508.18860", "github_repo": "https://github.com/THUDM/INFTY", "source": "github_org"}, {"id": "2508.15763", "date": "2025-08-21", "title": "Intern-S1: A Scientific Multimodal Foundation Model", "abstract": "In recent years, a plethora of open-source foundation models have emerged, achieving remarkable progress in some widely attended fields, with performance being quite close to that of closed-source models. However, in high-value but more challenging scientific professional fields, either the fields still rely on expert models, or the progress of general foundation models lags significantly compared to those in popular areas, far from sufficient for transforming scientific research and leaving substantial gap between open-source models and closed-source models in these scientific domains. To mitigate this gap and explore a step further toward Artificial General Intelligence (AGI), we introduce Intern-S1, a specialized generalist equipped with general understanding and reasoning capabilities with expertise to analyze multiple science modal data. Intern-S1 is a multimodal Mixture-of-Experts (MoE) model with 28 billion activated parameters and 241 billion total parameters, continually pre-trained on 5T tokens, including over 2.5T tokens from scientific domains. In the post-training stage, Intern-S1 undergoes offline and then online reinforcement learning (RL) in InternBootCamp, where we propose Mixture-of-Rewards (MoR) to synergize the RL training on more than 1000 tasks simultaneously. Through integrated innovations in algorithms, data, and training systems, Intern-S1 achieved top-tier performance in online RL training. On comprehensive evaluation benchmarks, Intern-S1 demonstrates competitive performance on general reasoning tasks among open-source models and significantly outperforms open-source models in scientific domains, surpassing closed-source state-of-the-art models in professional tasks, such as molecular synthesis planning, reaction condition prediction, predicting thermodynamic stabilities for crystals. Our models are available at this https URL .", "authors": ["Authors:Lei Bai", "Zhongrui Cai", "Yuhang Cao", "Maosong Cao", "Weihan Cao"], "categories": ["Machine"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2508.15763", "pdf_url": "https://arxiv.org/pdf/2508.15763", "github_repo": "https://github.com/InternLM/Intern-S1", "source": "github_org"}, {"id": "2508.14444", "date": "2025-08-20", "title": "NVIDIA Nemotron Nano 2: An Accurate and Efficient Hybrid Mamba-Transformer Reasoning Model", "abstract": "We introduce Nemotron-Nano-9B-v2, a hybrid Mamba-Transformer language model designed to increase throughput for reasoning workloads while achieving state-of-the-art accuracy compared to similarly-sized models. Nemotron-Nano-9B-v2 builds on the Nemotron-H architecture, in which the majority of the self-attention layers in the common Transformer architecture are replaced with Mamba-2 layers, to achieve improved inference speed when generating the long thinking traces needed for reasoning. We create Nemotron-Nano-9B-v2 by first pre-training a 12-billion-parameter model (Nemotron-Nano-12B-v2-Base) on 20 trillion tokens using an FP8 training recipe. After aligning Nemotron-Nano-12B-v2-Base, we employ the Minitron strategy to compress and distill the model with the goal of enabling inference on up to 128k tokens on a single NVIDIA A10G GPU (22GiB of memory, bfloat16 precision). Compared to existing similarly-sized models (e.g., Qwen3-8B), we show that Nemotron-Nano-9B-v2 achieves on-par or better accuracy on reasoning benchmarks while achieving up to 6x higher inference throughput in reasoning settings like 8k input and 16k output tokens. We are releasing Nemotron-Nano-9B-v2, Nemotron-Nano12B-v2-Base, and Nemotron-Nano-9B-v2-Base checkpoints along with the majority of our pre- and post-training datasets on Hugging Face.", "authors": ["Authors:NVIDIA: Aarti Basant", "Abhijit Khairnar", "Abhijit Paithankar", "Abhinav Khattar", "Adithya Renduchintala"], "categories": ["Computation"], "companies": ["NVIDIA"], "abs_url": "https://arxiv.org/abs/2508.14444", "pdf_url": "https://arxiv.org/pdf/2508.14444", "github_repo": "https://github.com/NVlabs/Minitron", "source": "github_org"}, {"id": "2508.14040", "date": "2025-08-19", "title": "ComputerRL: Scaling End-to-End Online Reinforcement Learning for Computer Use Agents", "abstract": "We introduce ComputerRL, a framework for autonomous desktop intelligence that enables agents to operate complex digital workspaces skillfully. ComputerRL features the API-GUI paradigm, which unifies programmatic API calls and direct GUI interaction to address the inherent mismatch between machine agents and human-centric desktop environments. Scaling end-to-end RL training is crucial for improvement and generalization across diverse desktop tasks; however, it remains challenging due to environmental inefficiency and instability during extended training. To support scalable and robust training, we develop a distributed RL infrastructure capable of orchestrating thousands of parallel virtual desktop environments to accelerate large-scale online RL. Furthermore, we propose Entropulse, a training strategy that alternates reinforcement learning with supervised fine-tuning, effectively mitigating entropy collapse during extended training runs. We employ ComputerRL on open models GLM-4-9B-0414 and GLM-4.1V-9B-Thinking, and evaluate them on the OSWorld benchmark. The AutoGLM-OS-9B achieves a new state-of-the-art accuracy of 48.9%, demonstrating significant improvements for general agents in desktop automation. Our code and the new OfficeWorld benchmark are available at this https URL . The algorithm and framework are adopted in building AutoGLM (Liu et al., 2024b).", "authors": ["Authors:Hanyu Lai", "Xiao Liu", "Yanxiao Zhao", "Han Xu", "Hanchen Zhang"], "categories": ["Artificial"], "companies": ["Zhipu"], "abs_url": "https://arxiv.org/abs/2508.14040", "pdf_url": "https://arxiv.org/pdf/2508.14040", "github_repo": "https://github.com/THUDM/ComputerRL", "source": "github_org"}, {"id": "2508.10711", "date": "2025-08-15", "title": "NextStep-1: Toward Autoregressive Image Generation with Continuous Tokens at Scale", "abstract": "Prevailing autoregressive (AR) models for text-to-image generation either\nrely on heavy, computationally-intensive diffusion models to process continuous\nimage tokens, or employ vector quantization (VQ) to obtain discrete tokens with\nquantization loss. In this paper, we push the autoregressive paradigm forward\nwith NextStep-1, a 14B autoregressive model paired with a 157M flow matching\nhead, training on discrete text tokens and continuous image tokens with\nnext-token prediction objectives. NextStep-1 achieves state-of-the-art\nperformance for autoregressive models in text-to-image generation tasks,\nexhibiting strong capabilities in high-fidelity image synthesis. Furthermore,\nour method shows strong performance in image editing, highlighting the power\nand versatility of our unified approach. To facilitate open research, we will\nrelease our code and models to the community.", "authors": ["NextStep Team", "Chunrui Han", "Guopeng Li", "Jingwei Wu", "Quan Sun"], "categories": ["cs.CV"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2508.10711", "pdf_url": "https://arxiv.org/pdf/2508.10711", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.10881", "date": "2025-08-14", "title": "ToonComposer: Streamlining Cartoon Production with Generative Post-Keyframing", "abstract": "Traditional cartoon and anime production involves keyframing, inbetweening, and colorization stages, which require intensive manual effort. Despite recent advances in AI, existing methods often handle these stages separately, leading to error accumulation and artifacts. For instance, inbetweening approaches struggle with large motions, while colorization methods require dense per-frame sketches. To address this, we introduce ToonComposer, a generative model that unifies inbetweening and colorization into a single post-keyframing stage. ToonComposer employs a sparse sketch injection mechanism to provide precise control using keyframe sketches. Additionally, it uses a cartoon adaptation method with the spatial low-rank adapter to tailor a modern video foundation model to the cartoon domain while keeping its temporal prior intact. Requiring as few as a single sketch and a colored reference frame, ToonComposer excels with sparse inputs, while also supporting multiple sketches at any temporal location for more precise motion control. This dual capability reduces manual workload and improves flexibility, empowering artists in real-world scenarios. To evaluate our model, we further created PKBench, a benchmark featuring human-drawn sketches that simulate real-world use cases. Our evaluation demonstrates that ToonComposer outperforms existing methods in visual quality, motion consistency, and production efficiency, offering a superior and more flexible solution for AI-assisted cartoon production.", "authors": ["Authors:Lingen Li", "Guangzhi Wang", "Zhaoyang Zhang", "Yaowei Li", "Xiaoyu Li"], "categories": ["Computer"], "companies": ["Tencent"], "abs_url": "https://arxiv.org/abs/2508.10881", "pdf_url": "https://arxiv.org/pdf/2508.10881", "github_repo": "https://github.com/TencentARC/ToonComposer", "source": "github_org"}, {"id": "2508.10898", "date": "2025-08-14", "title": "Puppeteer: Rig and Animate Your 3D Models", "abstract": "Modern interactive applications increasingly demand dynamic 3D content, yet the transformation of static 3D models into animated assets constitutes a significant bottleneck in content creation pipelines. While recent advances in generative AI have revolutionized static 3D model creation, rigging and animation continue to depend heavily on expert intervention. We present Puppeteer, a comprehensive framework that addresses both automatic rigging and animation for diverse 3D objects. Our system first predicts plausible skeletal structures via an auto-regressive transformer that introduces a joint-based tokenization strategy for compact representation and a hierarchical ordering methodology with stochastic perturbation that enhances bidirectional learning capabilities. It then infers skinning weights via an attention-based architecture incorporating topology-aware joint attention that explicitly encodes inter-joint relationships based on skeletal graph distances. Finally, we complement these rigging advances with a differentiable optimization-based animation pipeline that generates stable, high-fidelity animations while being computationally more efficient than existing approaches. Extensive evaluations across multiple benchmarks demonstrate that our method significantly outperforms state-of-the-art techniques in both skeletal prediction accuracy and skinning quality. The system robustly processes diverse 3D content, ranging from professionally designed game assets to AI-generated shapes, producing temporally coherent animations that eliminate the jittering issues common in existing methods.", "authors": ["Authors:Chaoyue Song", "Xiu Li", "Fan Yang", "Zhongcong Xu", "Jiacheng Wei"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.10898", "pdf_url": "https://arxiv.org/pdf/2508.10898", "github_repo": "https://github.com/bytedance-seed/Puppeteer", "source": "github_org"}, {"id": "2508.09505", "date": "2025-08-13", "title": "Verify Distributed Deep Learning Model Implementation Refinement with Iterative Relation Inference", "abstract": "Distributed machine learning training and inference is common today because today&#39;s large models require more memory and compute than can be provided by a single GPU. Distributed models are generally produced by programmers who take a sequential model specification and apply several distribution strategies to distribute state and computation across GPUs. Unfortunately, bugs can be introduced in the process, and a distributed model implementation&#39;s outputs might differ from the sequential model&#39;s outputs. In this paper, we describe an approach to statically identify such bugs by checking model refinement, that is, can the sequential model&#39;s outputs be reconstructed from the distributed model&#39;s outputs? Our approach, implemented in GraphGuard, uses iterative rewriting to prove model refinement. Our approach can scale to today&#39;s large models and deployments: we evaluate it using GPT and Llama-3. Further, it provides actionable output that aids in bug localization.", "authors": ["Authors:Zhanghan Wang", "Ding Ding", "Hang Zhu", "Haibin Lin", "Aurojit Panda"], "categories": ["Distributed,"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.09505", "pdf_url": "https://arxiv.org/pdf/2508.09505", "github_repo": "https://github.com/bytedance-seed/entangle", "source": "github_org"}, {"id": "2508.09736", "date": "2025-08-13", "title": "Seeing, Listening, Remembering, and Reasoning: A Multimodal Agent with Long-Term Memory", "abstract": "We introduce M3-Agent, a novel multimodal agent framework equipped with long-term memory. Like humans, M3-Agent can process real-time visual and auditory inputs to build and update episodic and semantic memories, gradually accumulating world knowledge. Its memory is organized in an entity-centric, multimodal manner, enabling deeper and more consistent understanding of the environment. Given an instruction, M3-Agent autonomously performs multi-turn reasoning and retrieves relevant memories to complete tasks. To evaluate memory effectiveness and memory-based reasoning in multimodal agents, we develop M3-Bench, a long-video question answering benchmark comprising 100 newly recorded robot-perspective videos (M3-Bench-robot) and 920 diverse web-sourced videos (M3-Bench-web). We annotate QA pairs designed to test capabilities essential for agent applications, such as person understanding, general knowledge extraction, and cross-modal reasoning. Experimental results show that M3-Agent, trained via reinforcement learning, outperforms the strongest baseline, a prompting agent using Gemini-1.5-pro and GPT-4o, achieving 6.7%, 7.7%, and 5.3% higher accuracy on M3-Bench-robot, M3-Bench-web and VideoMME-long, respectively. Our work advances multimodal agents toward more human-like long-term memory and provides insights for their practical design. Model, code and data are available at this https URL .", "authors": ["Authors:Lin Long", "Yichen He", "Wentao Ye", "Yiyuan Pan", "Yuan Lin"], "categories": ["Computer"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.09736", "pdf_url": "https://arxiv.org/pdf/2508.09736", "github_repo": "https://github.com/bytedance-seed/m3-agent", "source": "github_org"}, {"id": "2508.08575", "date": "2025-08-12", "title": "Bridging Quantum Mechanics to Organic Liquid Properties via a Universal Force Field", "abstract": "Molecular dynamics (MD) simulations are essential tools for unraveling atomistic insights into the structure and dynamics of condensed-phase systems. However, the universal and accurate prediction of macroscopic properties from ab initio calculations remains a significant challenge, often hindered by the trade-off between computational cost and simulation accuracy. Here, we present ByteFF-Pol, a graph neural network (GNN)-parameterized polarizable force field, trained exclusively on high-level quantum mechanics (QM) data. Leveraging physically-motivated force field forms and training strategies, ByteFF-Pol exhibits exceptional performance in predicting thermodynamic and transport properties for a wide range of small-molecule liquids and electrolytes, outperforming state-of-the-art (SOTA) classical and machine learning force fields. The zero-shot prediction capability of ByteFF-Pol bridges the gap between microscopic QM calculations and macroscopic liquid properties, enabling the exploration of previously intractable chemical spaces. This advancement holds transformative potential for applications such as electrolyte design and custom-tailored solvent, representing a pivotal step toward data-driven materials discovery.", "authors": ["Authors:Tianze Zheng", "Xingyuan Xu", "Zhi Wang", "Zhenze Yang", "Yuanheng Wang"], "categories": ["Computational"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.08575", "pdf_url": "https://arxiv.org/pdf/2508.08575", "github_repo": "https://github.com/bytedance-seed/byteff2", "source": "github_org"}, {"id": "2508.08636", "date": "2025-08-12", "title": "InternBootcamp Technical Report: Boosting LLM Reasoning with Verifiable Task Scaling", "abstract": "Large language models (LLMs) have revolutionized artificial intelligence by enabling complex reasoning capabilities. While recent advancements in reinforcement learning (RL) have primarily focused on domain-specific reasoning tasks (e.g., mathematics or code generation), real-world reasoning scenarios often require models to handle diverse and complex environments that narrow-domain benchmarks cannot fully capture. To address this gap, we present InternBootcamp, an open-source framework comprising 1000+ domain-diverse task environments specifically designed for LLM reasoning research. Our codebase offers two key functionalities: (1) automated generation of unlimited training/testing cases with configurable difficulty levels, and (2) integrated verification modules for objective response evaluation. These features make InternBootcamp fundamental infrastructure for RL-based model optimization, synthetic data generation, and model evaluation. Although manually developing such a framework with enormous task coverage is extremely cumbersome, we accelerate the development procedure through an automated agent workflow supplemented by manual validation protocols, which enables the task scope to expand rapidly. % With these bootcamps, we further establish Bootcamp-EVAL, an automatically generated benchmark for comprehensive performance assessment. Evaluation reveals that frontier models still underperform in many reasoning tasks, while training with InternBootcamp provides an effective way to significantly improve performance, leading to our 32B model that achieves state-of-the-art results on Bootcamp-EVAL and excels on other established benchmarks. In particular, we validate that consistent performance gains come from including more training tasks, namely \\textbf{task scaling}, over two orders of magnitude, offering a promising route towards capable reasoning generalist.", "authors": ["Authors:Peiji Li", "Jiasheng Ye", "Yongkang Chen", "Yichuan Ma", "Zijie Yu"], "categories": ["Computation"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2508.08636", "pdf_url": "https://arxiv.org/pdf/2508.08636", "github_repo": "https://github.com/InternLM/InternBootcamp", "source": "github_org"}, {"id": "2508.07999", "date": "2025-08-11", "title": "WideSearch: Benchmarking Agentic Broad Info-Seeking", "abstract": "From professional research to everyday planning, many tasks are bottlenecked by wide-scale information seeking, which is more repetitive than cognitively complex. With the rapid development of Large Language Models (LLMs), automated search agents powered by LLMs offer a promising solution to liberate humans from this tedious work. However, the capability of these agents to perform such &#34;wide-context&#34; collection reliably and completely remains largely unevaluated due to a lack of suitable benchmarks. To bridge this gap, we introduce WideSearch, a new benchmark engineered to evaluate agent reliability on these large-scale collection tasks. The benchmark features 200 manually curated questions (100 in English, 100 in Chinese) from over 15 diverse domains, grounded in real user queries. Each task requires agents to collect large-scale atomic information, which could be verified one by one objectively, and arrange it into a well-organized output. A rigorous five-stage quality control pipeline ensures the difficulty, completeness, and verifiability of the dataset. We benchmark over 10 state-of-the-art agentic search systems, including single-agent, multi-agent frameworks, and end-to-end commercial systems. Most systems achieve overall success rates near 0\\%, with the best performer reaching just 5\\%. However, given sufficient time, cross-validation by multiple human testers can achieve a near 100\\% success rate. These results demonstrate that present search agents have critical deficiencies in large-scale information seeking, underscoring urgent areas for future research and development in agentic search. Our dataset, evaluation pipeline, and benchmark results have been publicly released at this https URL", "authors": ["Authors:Ryan Wong", "Jiawei Wang", "Junjie Zhao", "Li Chen", "Yan Gao"], "categories": ["Computation"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.07999", "pdf_url": "https://arxiv.org/pdf/2508.07999", "github_repo": "https://github.com/bytedance-seed/WideSearch", "source": "github_org"}, {"id": "2508.04440", "date": "2025-08-07", "title": "StepFun-Formalizer: Unlocking the Autoformalization Potential of LLMs through Knowledge-Reasoning Fusion", "abstract": "Autoformalization aims to translate natural-language mathematical statements\ninto a formal language. While LLMs have accelerated progress in this area,\nexisting methods still suffer from low accuracy. We identify two key abilities\nfor effective autoformalization: comprehensive mastery of formal-language\ndomain knowledge, and reasoning capability of natural language problem\nunderstanding and informal-formal alignment. Without the former, a model cannot\nidentify the correct formal objects; without the latter, it struggles to\ninterpret real-world contexts and map them precisely into formal expressions.\nTo address these gaps, we introduce ThinkingF, a data synthesis and training\npipeline that improves both abilities. First, we construct two datasets: one by\ndistilling and selecting large-scale examples rich in formal knowledge, and\nanother by generating informal-to-formal reasoning trajectories guided by\nexpert-designed templates. We then apply SFT and RLVR with these datasets to\nfurther fuse and refine the two abilities. The resulting 7B and 32B models\nexhibit both comprehensive formal knowledge and strong informal-to-formal\nreasoning. Notably, StepFun-Formalizer-32B achieves SOTA BEq@1 scores of 40.5%\non FormalMATH-Lite and 26.7% on ProverBench, surpassing all prior\ngeneral-purpose and specialized models.", "authors": ["Yutong Wu", "Di Huang", "Ruosi Wan", "Yue Peng", "Shijie Shang"], "categories": ["cs.CL", "cs.AI", "cs.LG"], "companies": ["Stepfun"], "abs_url": "https://arxiv.org/abs/2508.04440", "pdf_url": "https://arxiv.org/pdf/2508.04440", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.05618", "date": "2025-08-07", "title": "Learning to Reason for Factuality", "abstract": "Reasoning Large Language Models (R-LLMs) have significantly advanced complex reasoning tasks but often struggle with factuality, generating substantially more hallucinations than their non-reasoning counterparts on long-form factuality benchmarks. However, extending online Reinforcement Learning (RL), a key component in recent R-LLM advancements, to the long-form factuality setting poses several unique challenges due to the lack of reliable verification methods. Previous work has utilized automatic factuality evaluation frameworks such as FActScore to curate preference data in the offline RL setting, yet we find that directly leveraging such methods as the reward in online RL leads to reward hacking in multiple ways, such as producing less detailed or relevant responses. We propose a novel reward function that simultaneously considers the factual precision, response detail level, and answer relevance, and applies online RL to learn high quality factual reasoning. Evaluated on six long-form factuality benchmarks, our factual reasoning model achieves an average reduction of 23.1 percentage points in hallucination rate, a 23% increase in answer detail level, and no degradation in the overall response helpfulness.", "authors": ["Authors:Xilun Chen", "Ilia Kulikov", "Vincent-Pierre Berges", "Barlas Oğuz", "Rulin Shao"], "categories": ["Computation"], "companies": ["Meta"], "abs_url": "https://arxiv.org/abs/2508.05618", "pdf_url": "https://arxiv.org/pdf/2508.05618", "github_repo": "https://github.com/facebookresearch/factual_reasoning", "source": "github_org"}, {"id": "2508.16584", "date": "2025-08-07", "title": "TMA-Adaptive FP8 Grouped GEMM: Eliminating Padding Requirements in Low-Precision Training and Inference on Hopper", "abstract": "Current FP8 grouped GEMM implementations require padding each group to a fixed alignment (e.g., 128), incurring memory and computational overhead. We propose \\textit{TMA-Adaptive FP8 Grouped GEMM}, which eliminates padding by dynamically adapting to variable group dimensions via (1) a TMA descriptor pool with $\\log_2(block_M)$ preconfigured descriptors to handle all residual row cases through dynamic runtime selection and dual-phase load-store operations, achieving comprehensive coverage with minimal overhead, and (2) TMA-alignment-aware management to satisfy 16-byte global memory alignment and 128-byte shared memory alignment. Experiments demonstrate 1.7\\% to 20.4\\% speed up with up to 23.8\\% memory reduction compared to padding operation plus state-of-the-art FP8 grouped GEMM, while maintaining full numerical equivalence for valid data. The source code is publicly available at an anonymous repository: this https URL .", "authors": ["Authors:Zhongling Su", "Rong Fu", "Weihan Cao", "Jianfei Gao", "Minxi Jin"], "categories": ["Hardware"], "companies": ["Shanghai AI Lab"], "abs_url": "https://arxiv.org/abs/2508.16584", "pdf_url": "https://arxiv.org/pdf/2508.16584", "github_repo": "https://github.com/InternLM/AdaptiveGEMM", "source": "github_org"}, {"id": "2508.02193", "date": "2025-08-05", "title": "Seed Diffusion: A Large-Scale Diffusion Language Model with High-Speed Inference", "abstract": "We present Seed Diffusion Preview, a large-scale language model based on\ndiscrete-state diffusion, offering remarkably fast inference speed. Thanks to\nnon-sequential, parallel generation, discrete diffusion models provide a\nnotable speedup to mitigate the inherent latency of token-by-token decoding, as\ndemonstrated recently (e.g., Mercury Coder, Gemini Diffusion). Seed Diffusion\nPreview achieves an inference speed of 2,146 token/s over H20 GPUs while\nmaintaining competitive performance across a sweep of standard code evaluation\nbenchmarks, significantly faster than contemporary Mercury and Gemini\nDiffusion, establishing new state of the art on the speed-quality Pareto\nfrontier for code models.", "authors": ["Yuxuan Song", "Zheng Zhang", "Cheng Luo", "Pengyang Gao", "Fan Xia"], "categories": ["cs.CL", "cs.LG"], "companies": ["ByteDance"], "abs_url": "https://arxiv.org/abs/2508.02193", "pdf_url": "https://arxiv.org/pdf/2508.02193", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.02324", "date": "2025-08-05", "title": "Qwen-Image Technical Report", "abstract": "We present Qwen-Image, an image generation foundation model in the Qwen\nseries that achieves significant advances in complex text rendering and precise\nimage editing. To address the challenges of complex text rendering, we design a\ncomprehensive data pipeline that includes large-scale data collection,\nfiltering, annotation, synthesis, and balancing. Moreover, we adopt a\nprogressive training strategy that starts with non-text-to-text rendering,\nevolves from simple to complex textual inputs, and gradually scales up to\nparagraph-level descriptions. This curriculum learning approach substantially\nenhances the model's native text rendering capabilities. As a result,\nQwen-Image not only performs exceptionally well in alphabetic languages such as\nEnglish, but also achieves remarkable progress on more challenging logographic\nlanguages like Chinese. To enhance image editing consistency, we introduce an\nimproved multi-task training paradigm that incorporates not only traditional\ntext-to-image (T2I) and text-image-to-image (TI2I) tasks but also\nimage-to-image (I2I) reconstruction, effectively aligning the latent\nrepresentations between Qwen2.5-VL and MMDiT. Furthermore, we separately feed\nthe original image into Qwen2.5-VL and the VAE encoder to obtain semantic and\nreconstructive representations, respectively. This dual-encoding mechanism\nenables the editing module to strike a balance between preserving semantic\nconsistency and maintaining visual fidelity. Qwen-Image achieves\nstate-of-the-art performance, demonstrating its strong capabilities in both\nimage generation and editing across multiple benchmarks.", "authors": ["Chenfei Wu", "Jiahao Li", "Jingren Zhou", "Junyang Lin", "Kaiyuan Gao"], "categories": ["cs.CV"], "companies": ["Alibaba"], "abs_url": "https://arxiv.org/abs/2508.02324", "pdf_url": "https://arxiv.org/pdf/2508.02324", "github_repo": "", "source": "daily_arxiv"}, {"id": "2508.02317", "date": "2025-08-04", "title": "VeOmni: Scaling Any Modality Model Training with Model-Centric Distributed Recipe Zoo", "abstract": "Recent advances in large language models (LLMs) have driven impressive progress in omni-modal understanding and generation. However, training omni-modal LLMs remains a significant challenge due to the heterogeneous model architectures required to process diverse modalities, necessitating sophisticated system design for efficient large-scale training. Existing
