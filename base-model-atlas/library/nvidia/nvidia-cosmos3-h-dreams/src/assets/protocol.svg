<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470"><rect width="920" height="470" rx="20" fill="#141c2e"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="36" y="48" font-size="24" font-weight="700">Realtime does not mean validated</text><text x="36" y="80" font-size="17" fill="#fbbf24">Analyst reading aid - not an official figure or measurement</text><rect x="36" y="110" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="151" font-size="20">1. Fix checkpoint / decoder / cache revision</text><rect x="36" y="204" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="245" font-size="20">2. Compare same resolution, steps and hardware</text><rect x="36" y="298" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="339" font-size="20">3. Measure long rollout quality and P95 latency</text><text x="36" y="435" font-size="17" fill="#a5b4c8">No physical-device operation or clinical validation</text></g></svg>
