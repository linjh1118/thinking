<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="20" fill="#101925"/><g font-family="sans-serif" fill="#eef4ff"><text x="35" y="48" font-size="27">What needs to be tested before using the generated ensemble</text><text x="35" y="83" font-size="17" fill="#b8c7dd">Authored validation plan; the card supplies no quantitative benchmark table</text><rect x="35" y="120" width="330" height="275" rx="16" fill="#273b5f"/><text x="53" y="161" font-size="23">Temporal holdout</text><text x="53" y="204" font-size="18">Train: 2018-07-12 to</text><text x="53" y="238" font-size="18">2025-09-30</text><text x="53" y="272" font-size="18">Test: 2025 Q4</text><rect x="385" y="120" width="330" height="275" rx="16" fill="#264c45"/><text x="403" y="161" font-size="23">Spatial / physical checks</text><text x="403" y="204" font-size="18">Per-variable bias and RMSE</text><text x="403" y="238" font-size="18">Spatial spectra / extremes</text><text x="403" y="272" font-size="18">Cross-variable consistency</text><rect x="735" y="120" width="330" height="275" rx="16" fill="#493b5c"/><text x="753" y="161" font-size="23">Ensemble calibration</text><text x="753" y="204" font-size="18">Spread versus error</text><text x="753" y="238" font-size="18">Coverage and reliability</text><text x="753" y="272" font-size="18">Out-of-domain degradation</text><text x="35" y="443" font-size="18" fill="#fed7aa">More samples do not establish calibrated uncertainty or physical conservation.</text><text x="35" y="480" font-size="17" fill="#c0cde1">No claim of improved forecast lead time, flood skill, or operational readiness.</text></g></svg>