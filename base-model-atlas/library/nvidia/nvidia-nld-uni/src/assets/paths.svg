<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><rect width="1100" height="530" rx="24" fill="#101827"/><g font-family="system-ui,sans-serif" fill="#eef4ff"><text x="40" y="55" font-size="27">NLD-Uni: one framework, distinct parameter paths</text><text x="40" y="86" font-size="17" fill="#a5b8d6">BrainHao research diagram · not official artwork / not an evaluation</text><text x="40" y="145" font-size="20" fill="#9cd5ff">Understanding</text><rect x="40" y="163" width="310" height="66" rx="14" fill="#20304a" stroke="#57769e"/><text x="55" y="203" font-size="19">Image → continuous features</text><text x="360" y="205" font-size="27">→</text><rect x="390" y="163" width="310" height="66" rx="14" fill="#20304a" stroke="#57769e"/><text x="405" y="203" font-size="19">Text / image conditioning</text><text x="710" y="205" font-size="27">→</text><rect x="740" y="163" width="310" height="66" rx="14" fill="#20304a" stroke="#57769e"/><text x="755" y="203" font-size="19">Block diffusion → text</text><text x="40" y="295" font-size="20" fill="#9cd5ff">Generation</text><rect x="40" y="313" width="310" height="66" rx="14" fill="#20304a" stroke="#57769e"/><text x="55" y="353" font-size="19">Text / optional source image</text><text x="360" y="355" font-size="27">→</text><rect x="390" y="313" width="310" height="66" rx="14" fill="#20304a" stroke="#57769e"/><text x="405" y="353" font-size="19">Discrete visual-token diffusion</text><text x="710" y="355" font-size="27">→</text><rect x="740" y="313" width="310" height="66" rx="14" fill="#20304a" stroke="#57769e"/><text x="755" y="353" font-size="19">Visual decoder → RGB</text><text x="40" y="477" font-size="18" fill="#f7cd91">Interfaces exist; checkpoint coverage and benchmark quality still require evidence.</text></g></svg>