<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470"><rect width="920" height="470" rx="20" fill="#141c2e"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="36" y="48" font-size="25">Action-conditioned rollout validation</text><text x="36" y="82" font-size="17" fill="#fbbf24">Analyst reading aid - not an official figure or measurement</text><rect x="36" y="110" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="151" font-size="20">1. Pin initial image, action schema and camera clock</text><rect x="36" y="204" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="245" font-size="20">2. Generated observation feeds a policy or controller</text><rect x="36" y="298" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="339" font-size="20">3. Verify physical final state outside the video model</text><text x="36" y="435" font-size="18" fill="#a5b4c8">Pixel similarity is not task success or a safety certificate.</text></g></svg>
