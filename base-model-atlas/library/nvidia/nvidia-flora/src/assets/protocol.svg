<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470"><rect width="920" height="470" rx="20" fill="#141c2e"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="36" y="48" font-size="24" font-weight="700">Annotation validation</text><text x="36" y="80" font-size="17" fill="#fbbf24">Analyst reading aid - not an official figure or measurement</text><rect x="36" y="110" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="151" font-size="20">1. Gold boundaries versus predicted boundaries</text><rect x="36" y="204" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="245" font-size="20">2. Target-only captions; preserve failed intent</text><rect x="36" y="298" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="339" font-size="20">3. External success checks and reward calibration</text><text x="36" y="435" font-size="17" fill="#a5b4c8">20Hz coordinates do not imply 50ms accuracy</text></g></svg>
