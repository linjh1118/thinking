<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">Muse Spark Open：研读结构与部署边界</title><desc id="desc">依据官方模型卡绘制。多模态输入接入816B总参42B活跃MoE，输出文本；BF16和NVFP4共用一个family，drafter可选，不是新正代。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122340"/><stop offset="1" stop-color="#111727"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9dcaff"/></marker></defs>
<rect width="1040" height="650" rx="24" fill="url(#bg)"/>
<g font-family="system-ui, sans-serif" fill="#eef5ff"><text x="40" y="52" font-size="27" font-weight="700">Muse Spark Open · Architecture &amp; Deployment</text><text x="40" y="84" font-size="16" fill="#acc6e7">研读示意图，不是官方架构原图 · 816B capacity ≠ 42B storage</text></g>
<g stroke="#4c76ae" stroke-width="2" fill="#1b3454"><rect x="40" y="123" width="235" height="264" rx="16"/><rect x="351" y="123" width="363" height="264" rx="16"/><rect x="786" y="123" width="213" height="264" rx="16"/></g>
<g font-family="system-ui, sans-serif" fill="#e4efff" font-size="19"><text x="64" y="159" font-weight="700">Multimodal Inputs</text><text x="64" y="205">Text / Image</text><text x="64" y="238">Video / Audio</text><text x="64" y="286" font-size="16">Vision: PE 1.8B</text><text x="64" y="315" font-size="16">50 layers / patch 14</text><text x="64" y="355" font-size="15" fill="#a9c4e8">音频结构未充分披露</text><text x="375" y="159" font-weight="700">Sparse MoE Target</text><text x="375" y="205">816B total / 42B active</text><text x="375" y="238">256 experts · top-8</text><text x="375" y="276">62 layers · hidden 8192</text><text x="375" y="309">GQA 128Q / 16KV</text><text x="375" y="355" font-size="17" fill="#b5ddff">1M context = input + output</text><text x="809" y="159" font-weight="700">Text Output</text><text x="809" y="206">Reasoning</text><text x="809" y="239">Tool calls</text><text x="809" y="291" font-size="16">effort: low → xhigh</text><text x="809" y="327" font-size="16">不是媒体生成器</text></g>
<g stroke="#9dcaff" stroke-width="3" marker-end="url(#arrow)"><path d="M278 253H338"/><path d="M718 253H774"/></g>
<rect x="40" y="423" width="620" height="178" rx="16" fill="#173d3e" stroke="#4faaa1"/><rect x="684" y="423" width="315" height="178" rx="16" fill="#34304b" stroke="#998cc4"/>
<g font-family="system-ui, sans-serif" fill="#e7f8f4"><text x="64" y="459" font-size="21" font-weight="700">One family, two weight formats</text><text x="64" y="500" font-size="18">BF16: ~1.6TB payload · ~2TB budget</text><text x="64" y="532" font-size="18">NVFP4: ~530GB payload · ≥700GB budget</text><text x="64" y="574" font-size="16" fill="#b3d8d4">KV / concurrency / vision / runtime must be budgeted separately</text><text x="706" y="459" font-size="21" font-weight="700">Optional drafter</text><text x="706" y="500" font-size="18">DFlash2 / DSpark</text><text x="706" y="535" font-size="16">target verifies candidates</text><text x="706" y="574" font-size="17" fill="#d0c6e8">acceptance length ≠ TPS gain</text></g>
</svg>
