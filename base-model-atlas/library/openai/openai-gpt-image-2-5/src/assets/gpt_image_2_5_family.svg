<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">GPT-Image-2.5 family map</title>
  <desc id="desc">One shared family branches into Flare for speed and Sunburst for precision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#17102c"/></linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb14a"/><stop offset="1" stop-color="#ff5c7a"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe477"/><stop offset="1" stop-color="#7cf2c8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="640" rx="38" fill="url(#bg)"/>
  <text x="640" y="82" text-anchor="middle" fill="#f7f8ff" font-size="42" font-family="Inter,Arial" font-weight="700">GPT-Image-2.5</text>
  <text x="640" y="122" text-anchor="middle" fill="#9eabc7" font-size="20" font-family="Inter,Arial">reference fidelity · precision editing · multi-turn consistency</text>
  <path d="M640 190 C640 260 380 250 350 330" stroke="#ff8b5c" stroke-width="6" fill="none" opacity=".8"/>
  <path d="M640 190 C640 260 900 250 930 330" stroke="#a7f0ab" stroke-width="6" fill="none" opacity=".8"/>
  <circle cx="640" cy="190" r="52" fill="#7cf2c8" opacity=".16" filter="url(#glow)"/>
  <circle cx="640" cy="190" r="30" fill="#7cf2c8"/>
  <rect x="120" y="330" width="460" height="220" rx="28" fill="#161c2d" stroke="#ff8b5c" stroke-width="2"/>
  <rect x="700" y="330" width="460" height="220" rx="28" fill="#161c2d" stroke="#a7f0ab" stroke-width="2"/>
  <text x="350" y="392" text-anchor="middle" fill="url(#flare)" font-size="38" font-family="Inter,Arial" font-weight="700">FLARE</text>
  <text x="350" y="438" text-anchor="middle" fill="#f7f8ff" font-size="24" font-family="Inter,Arial">默认高吞吐</text>
  <text x="350" y="482" text-anchor="middle" fill="#9eabc7" font-size="18" font-family="Inter,Arial">50% lower latency vs Image-2</text>
  <text x="350" y="518" text-anchor="middle" fill="#9eabc7" font-size="18" font-family="Inter,Arial">rapid iteration · visual search · scale</text>
  <text x="930" y="392" text-anchor="middle" fill="url(#sun)" font-size="38" font-family="Inter,Arial" font-weight="700">SUNBURST</text>
  <text x="930" y="438" text-anchor="middle" fill="#f7f8ff" font-size="24" font-family="Inter,Arial">高精度创意</text>
  <text x="930" y="482" text-anchor="middle" fill="#9eabc7" font-size="18" font-family="Inter,Arial">tighter control across edits</text>
  <text x="930" y="518" text-anchor="middle" fill="#9eabc7" font-size="18" font-family="Inter,Arial">campaign · product · polished assets</text>
</svg>
