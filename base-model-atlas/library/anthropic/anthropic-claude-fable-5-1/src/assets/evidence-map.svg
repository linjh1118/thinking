<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Claude Fable 5.1 evidence map</title>
  <desc id="desc">A BrainHao editorial map from shared frontier model through deployment safeguards to agentic workloads and evidence boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101823"/><stop offset="1" stop-color="#20261d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9ff79"/><stop offset="1" stop-color="#91bd64"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1440" height="520" rx="34" fill="url(#bg)"/>
  <text x="64" y="62" fill="#d9ff79" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="3">BRAINHAO · EVIDENCE MAP</text>
  <text x="64" y="112" fill="#f5f7ef" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800">One frontier model, two deployment boundaries</text>
  <path d="M356 260H500M790 220H920M790 300H920" fill="none" stroke="#8aa078" stroke-width="4" stroke-linecap="round"/>
  <rect x="64" y="184" width="292" height="164" rx="24" fill="#1a2632" stroke="#415064" filter="url(#shadow)"/>
  <text x="92" y="224" fill="#8fa0b4" font-family="Inter,Arial,sans-serif" font-size="15">UNDERLYING MODEL</text>
  <text x="92" y="268" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Claude 5.1</text>
  <text x="92" y="305" fill="#c8d2df" font-family="Inter,Arial,sans-serif" font-size="18">1M context · adaptive thinking</text>
  <rect x="500" y="154" width="290" height="138" rx="24" fill="#27321f" stroke="#9abf6b" filter="url(#shadow)"/>
  <text x="528" y="197" fill="#d9ff79" font-family="Inter,Arial,sans-serif" font-size="15">GENERAL AVAILABILITY</text>
  <text x="528" y="242" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Fable 5.1</text>
  <text x="528" y="270" fill="#cad6be" font-family="Inter,Arial,sans-serif" font-size="16">classifiers + fallback routing</text>
  <rect x="500" y="312" width="290" height="138" rx="24" fill="#28212f" stroke="#8f77a9" filter="url(#shadow)"/>
  <text x="528" y="355" fill="#cbb5e8" font-family="Inter,Arial,sans-serif" font-size="15">TRUSTED ACCESS</text>
  <text x="528" y="400" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Mythos 5.1</text>
  <text x="528" y="428" fill="#d0c5db" font-family="Inter,Arial,sans-serif" font-size="16">same model · different safeguards</text>
  <rect x="920" y="142" width="456" height="244" rx="28" fill="#151e28" stroke="#425064" filter="url(#shadow)"/>
  <text x="952" y="187" fill="#8fa0b4" font-family="Inter,Arial,sans-serif" font-size="15">WHAT TO MEASURE</text>
  <text x="952" y="230" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">Agentic coding · scientific research</text>
  <text x="952" y="270" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">Business workflows · computer use</text>
  <line x1="952" y1="300" x2="1338" y2="300" stroke="#344151"/>
  <text x="952" y="336" fill="#d9ff79" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Strict state success ≠ partial progress</text>
  <text x="952" y="366" fill="#aeb9c8" font-family="Inter,Arial,sans-serif" font-size="16">Record tool path, fallback, effort, cache and cost.</text>
  <rect x="64" y="414" width="292" height="44" rx="22" fill="url(#accent)"/>
  <text x="210" y="442" text-anchor="middle" fill="#10160d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">EVIDENCE, NOT ARCHITECTURE GUESSING</text>
</svg>

