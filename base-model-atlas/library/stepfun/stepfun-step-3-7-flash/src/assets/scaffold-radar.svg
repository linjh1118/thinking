<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multi-scaffold benchmark radar chart" viewBox="0 0 460 420" width="460" height="420">
                            
                            <style>svg{background:white;font-family:Arial,sans-serif}.radar-grid polygon {
    fill: none;
    stroke: hsla(0, 0%, 0%, 0.10);
    stroke-width: 1;
}

.radar-axes line {
    stroke: hsla(0, 0%, 0%, 0.14);
    stroke-width: 1;
}

.radar-series {
    stroke-width: 2;
    fill-opacity: 0.16;
    stroke-linejoin: round;
}

.radar-series-prev {
    fill: hsl(0, 0%, 60%);
    stroke: hsl(0, 0%, 45%);
    fill-opacity: 0.18;
}

.radar-series-curr {
    fill: var(--accent);
    stroke: var(--accent);
    fill-opacity: 0.24;
}

.radar-points-prev circle {
    fill: hsl(0, 0%, 35%);
    cursor: pointer;
    transition: r 0.18s ease, filter 0.18s ease;
}
.radar-points-curr circle {
    fill: var(--accent);
    cursor: pointer;
    transition: r 0.18s ease, filter 0.18s ease;
}
.radar-points-prev circle:hover { r: 7; filter: drop-shadow(0 2px 6px hsla(0, 0%, 0%, 0.32)); }
.radar-points-curr circle:hover { r: 8; filter: drop-shadow(0 2px 6px hsla(var(--accent-h), 60%, 40%, 0.4)); }

.radar-scale text {
    font-family: var(--font-mono, "JetBrains Mono", "SF Mono", monospace);
    font-size: 9.5px;
    fill: hsla(0, 0%, 0%, 0.42);
}

.radar-labels text {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    fill: #000;
}

.theme-b .radar-grid polygon { stroke: hsla(0, 0%, 100%, 0.10); }
.theme-b .radar-axes line     { stroke: hsla(0, 0%, 100%, 0.14); }
.theme-b .radar-scale text    { fill: hsla(0, 0%, 100%, 0.46); }
.theme-b .radar-labels text   { fill: #fff; }
.theme-b .radar-series-prev   { fill: hsl(0, 0%, 70%); stroke: hsl(0, 0%, 75%); }
.theme-b .radar-points-prev circle { fill: hsl(0, 0%, 80%); }
.theme-b .radar-series-curr   { fill: hsl(210, 80%, 65%); stroke: hsl(210, 80%, 65%); }
.theme-b .radar-points-curr circle { fill: hsl(210, 80%, 65%); }

</style><g class="radar-grid">
