<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470"><rect width="920" height="470" rx="20" fill="#141c2e"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="36" y="48" font-size="24" font-weight="700">Target-oriented sentiment</text><text x="36" y="80" font-size="17" fill="#fbbf24">Analyst reading aid - not an official figure or measurement</text><rect x="36" y="110" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="151" font-size="20">1. Identify service / product / agent relevance</text><rect x="36" y="204" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="245" font-size="20">2. Apply complaint, failure and help-request rules</text><rect x="36" y="298" width="848" height="68" rx="12" fill="#24334e"/><text x="56" y="339" font-size="20">3. Generate label first, then short explanation</text><text x="36" y="435" font-size="17" fill="#a5b4c8">Politeness is not proof that a task succeeded</text></g></svg>
