<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" rx="16" fill="#121a29"/><g font-family="Arial,PingFang SC,sans-serif" fill="#e2e8f0"><text x="35" y="44" font-size="23" font-weight="bold">Granite Switch 4.1 · Composed inference</text><text x="35" y="72" fill="#94a3b8" font-size="14">研读示意图｜依据官方模型卡与 BUILD；不是端到端联合训练的 Omni 模型</text><g fill="#1e3a55" stroke="#60a5fa"><rect x="35" y="108" width="190" height="83" rx="10"/><rect x="305" y="100" width="265" height="105" rx="10"/><rect x="655" y="108" width="210" height="83" rx="10"/></g><g font-size="18" text-anchor="middle"><text x="130" y="141">Shared base prefix</text><text x="130" y="168">Granite 4.1 KV</text><text x="438" y="134">Control-token switch</text><text x="438" y="165">decision / guardian-core</text><text x="438" y="189" font-size="14">aLoRA · 连续生成跨度</text><text x="760" y="141">Label probabilities</text><text x="760" y="168">or safety JSON</text></g><path d="M226 151H298M573 151H648" stroke="#fbbf24" stroke-width="3"/><g fill="#20382f" stroke="#6ee7b7"><rect x="35" y="259" width="245" height="77" rx="10"/><rect x="340" y="259" width="525" height="77" rx="10"/></g><g font-size="17"><text x="56" y="289">English audio → 470M CTC</text><text x="56" y="316">转写错误会传给后续决策</text><text x="364" y="290">Cache boundary: base prefix only</text><text x="364" y="317">不可任意复用另一个 adapter 已修改的后缀状态</text></g><text x="35" y="388" font-size="16" fill="#fcd34d">组合模型：8B / 30B family · 不是新 Granite 正代，也不是每 token 专家路由</text></g></svg>
