<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
  <title id="title">Decision Model 的接口关系示意</title>
  <desc id="desc">业务状态与类型化问题送入判断模型，返回 choice、noul 与 score 的概率分布。此图为整理示意，不是官方架构或测量。</desc>
  <rect width="1100" height="320" rx="22" fill="#101827"/>
  <g font-family="Arial,sans-serif" fill="#eaf2ff"><text x="35" y="42" font-size="19">Typed Decisions · Reading Diagram / Not Architecture</text></g>
  <g fill="#1c304d" stroke="#5687b7"><rect x="35" y="90" width="260" height="160" rx="15"/><rect x="370" y="90" width="310" height="160" rx="15"/><rect x="755" y="90" width="310" height="160" rx="15"/></g>
  <g font-family="Arial,sans-serif" fill="#eaf2ff" font-size="20"><text x="60" y="130">Business state</text><text x="60" y="168">+ Typed questions</text><text x="60" y="212" fill="#99b5d8" font-size="17">choice / noul / score</text><text x="395" y="130">Decision model</text><text x="395" y="172" fill="#99b5d8" font-size="17">One forward pass</text><text x="395" y="211" fill="#99b5d8" font-size="17">No generated answer text</text><text x="780" y="130">Decisions + distributions</text><text x="780" y="173" fill="#99b5d8" font-size="17">Gate / router / validator</text><text x="780" y="212" fill="#99b5d8" font-size="17">Calibration still needs testing</text></g>
  <g stroke="#82d8f5" stroke-width="3" fill="none"><path d="M300 170H355m-12-10 12 10-12 10"/><path d="M687 170H740m-12-10 12 10-12 10"/></g>
  <text x="35" y="288" font-family="Arial,sans-serif" fill="#9babc2" font-size="16">Source: official Model Studio model page / API reference · No benchmark values implied</text>
</svg>
