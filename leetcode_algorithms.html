<!-- index: LeetCode 算法模板教学 | 2026-05-18 | 二分法/滑动窗口/回溯/二叉树/动态规划五大模板，含交互动画与执行 Trace -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算法模板教学</title>
<style>
:root {
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#12121f; --card:#1e1e3a;
  --border:#2a2a4a; --accent:#7c6af7; --accent2:#4ecdc4; --accent3:#f7c76a;
  --green:#4ade80; --red:#f87171; --text:#e2e8f0; --muted:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

/* -- Tabs -- */
.tabs-bar{position:sticky;top:0;z-index:200;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:4px;padding:0 24px;}
.tab-btn{padding:14px 20px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* -- Layout -- */
.tab-content{display:none;} .tab-content.active{display:flex;}
.sidebar{width:200px;min-width:200px;background:var(--bg2);position:sticky;top:49px;height:calc(100vh - 49px);overflow-y:auto;padding:14px 0;border-right:1px solid var(--border);}
.sidebar a{display:block;padding:5px 16px;color:var(--muted);text-decoration:none;font-size:12px;border-left:2px solid transparent;transition:all .15s;}
.sidebar a:hover,.sidebar a.active{color:var(--text);background:rgba(124,106,247,.1);border-left-color:var(--accent);}
.sidebar .grp{font-size:10px;color:var(--accent);padding:10px 16px 3px;text-transform:uppercase;letter-spacing:.08em;}
.main{flex:1;padding:32px 40px;max-width:860px;overflow-y:auto;}

/* -- Cards -- */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px 28px;margin-bottom:22px;}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;}
.badge-bs{background:var(--accent);color:#fff;}
.badge-sw{background:var(--accent2);color:#0f0f1a;}
.badge-bt{background:#e879f9;color:#fff;}
.badge-tr{background:#34d399;color:#0f0f1a;}
.badge-dp{background:#fb923c;color:#fff;}
.badge-tmpl{background:#334155;color:var(--text);}
.diff-easy{background:rgba(74,222,128,.15);color:var(--green);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.diff-med{background:rgba(247,199,106,.15);color:var(--accent3);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.diff-hard{background:rgba(248,113,113,.15);color:var(--red);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.card h3{font-size:16px;font-weight:600;}
.tldr{background:rgba(124,106,247,.08);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7;margin-bottom:18px;}
.tldr.sw{background:rgba(78,205,196,.08);border-left-color:var(--accent2);}
.tldr.bt{background:rgba(232,121,249,.08);border-left-color:#e879f9;}
.tldr.tr{background:rgba(52,211,153,.08);border-left-color:#34d399;}
.tldr.dp{background:rgba(251,146,60,.08);border-left-color:#fb923c;}
.hint{color:var(--muted);font-size:13px;margin-bottom:12px;line-height:1.6;}
.maps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.map-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;}
.map-item .lbl{color:var(--muted);font-size:10px;margin-bottom:2px;}
.map-item code{color:var(--accent2);font-family:'Fira Code',monospace;}

/* -- Code -- */
pre{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px 18px;overflow-x:auto;font-family:'Fira Code','Consolas',monospace;font-size:13px;line-height:1.65;margin:12px 0;position:relative;}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;transition:all .15s;}
.copy-btn:hover{color:var(--text);}

/* -- Trace -- */
details{margin:10px 0;}
summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:600;padding:6px 12px;background:rgba(124,106,247,.1);border-radius:5px;list-style:none;user-select:none;}
summary::-webkit-details-marker{display:none;}
summary::before{content:'\25B6 ';}
details[open] summary::before{content:'\25BC ';}
.trace{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;font-family:'Fira Code',monospace;}
.trace th{background:var(--bg3);color:var(--muted);padding:6px 12px;text-align:center;border-bottom:1px solid var(--border);}
.trace td{padding:6px 12px;text-align:center;border-bottom:1px solid rgba(42,42,74,.4);}
.trace tr:last-child td{border-bottom:none;}
.trace .ok{color:var(--green);font-weight:700;}
.trace .no{color:var(--red);}
.trace .ans{background:rgba(74,222,128,.07);}

/* -- Summary table -- */
.sum-table{width:100%;border-collapse:collapse;font-size:13px;}
.sum-table th{background:var(--bg3);color:var(--muted);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);}
.sum-table td{padding:8px 12px;border-bottom:1px solid rgba(42,42,74,.4);vertical-align:top;}
.sum-table tr:last-child td{border-bottom:none;}
.sum-table code{color:var(--accent2);background:var(--bg3);padding:1px 4px;border-radius:3px;font-size:11px;font-family:'Fira Code',monospace;}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;margin:1px;}
.tag-a{background:rgba(74,222,128,.15);color:var(--green);}
.tag-b{background:rgba(124,106,247,.15);color:var(--accent);}
.tag-f{background:rgba(247,199,106,.15);color:var(--accent3);}

/* -- Anim -- */
.anim-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:20px;margin:14px 0;}
.anim-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.anim-cell{width:44px;height:44px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid var(--border);background:var(--card);transition:all .25s;position:relative;}
.anim-cell .ci{position:absolute;bottom:-17px;font-size:10px;color:var(--muted);}
.z-a{background:rgba(248,113,113,.15);border-color:var(--red)!important;}
.z-b{background:rgba(74,222,128,.15);border-color:var(--green)!important;}
.p-lo{border-color:#60a5fa!important;box-shadow:0 0 7px rgba(96,165,250,.4);}
.p-mid{border-color:var(--accent3)!important;box-shadow:0 0 7px rgba(247,199,106,.4);}
.p-hi{border-color:var(--red)!important;box-shadow:0 0 7px rgba(248,113,113,.3);}
.anim-info{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin:10px 0 4px;}
.ptr-row{display:flex;gap:8px;justify-content:center;margin:14px 0 8px;}
.ptr{font-size:12px;padding:2px 10px;border-radius:4px;font-weight:700;}
.ptr-lo{background:rgba(96,165,250,.15);color:#60a5fa;}
.ptr-mid{background:rgba(247,199,106,.15);color:var(--accent3);}
.ptr-hi{background:rgba(248,113,113,.15);color:var(--red);}
.anim-btns{display:flex;gap:8px;justify-content:center;margin-top:10px;}
.btn{padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:var(--accent);color:#fff;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-sec{background:var(--bg2);color:var(--text);border:1px solid var(--border);}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:9px;height:9px;border-radius:2px;}

/* -- SW anim -- */
.sw-cell{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border:2px solid var(--border);background:var(--card);transition:all .25s;position:relative;}
.sw-cell .ci{position:absolute;bottom:-15px;font-size:10px;color:var(--muted);}
.sw-win{background:rgba(78,205,196,.15);border-color:var(--accent2)!important;}
.sw-l{border-color:#60a5fa!important;box-shadow:0 0 6px rgba(96,165,250,.4);}
.sw-r{border-color:var(--accent3)!important;box-shadow:0 0 6px rgba(247,199,106,.4);}
.sw-shrink{background:rgba(248,113,113,.15);border-color:var(--red)!important;}

/* -- Problem card additions -- */
.problem-desc { background:var(--bg3); padding:14px 16px; border-radius:6px; font-size:14px; line-height:1.7; margin-bottom:10px; }
.example-table { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0; }
.example-table th { background:var(--bg2); color:var(--muted); padding:6px 12px; text-align:left; border-bottom:1px solid var(--border); }
.example-table td { padding:6px 12px; border-bottom:1px solid rgba(42,42,74,.4); }
.example-table tr:last-child td { border-bottom:none; }
.example-table code { color:var(--accent2); background:var(--card); padding:1px 5px; border-radius:3px; }
.thinking-text { font-size:14px; line-height:1.8; color:var(--text); padding:10px 16px; background:rgba(124,106,247,.04); border-radius:6px; }

section{scroll-margin-top:20px;}
hr{border:none;border-top:1px solid var(--border);margin:32px 0;}
</style>
</head>
<body>

<script>
// ================================================================
// renderProblem: data-driven card generator
// ================================================================
function renderProblem(p) {
  const diffMap = { easy: ['diff-easy','简单'], medium: ['diff-med','中等'], hard: ['diff-hard','困难'] };
  const [diffCls, diffText] = diffMap[p.diff] || ['diff-med','中等'];
  let html = `<section id="${p.id}"><div class="card">`;
  // header
  html += `<div class="card-header">
    <span class="badge badge-${p.badge}">LC ${p.lc}</span>
    <span class="${diffCls}">${diffText}</span>
    <h3>${p.title}</h3>
    <span style="margin-left:auto;font-size:11px;color:var(--muted)">&#9201; ${p.complexity.time} &nbsp; &#128190; ${p.complexity.space}</span>
  </div>`;
  // desc
  html += `<details open><summary>📖 题目描述</summary>
    <div class="problem-desc">${p.desc}</div>
    <table class="example-table"><tr><th>输入</th><th>输出</th><th>说明</th></tr>
    ${p.examples.map(e => `<tr><td>${e.input}</td><td>${e.output}</td><td>${e.note}</td></tr>`).join('')}
    </table></details>`;
  // thinking
  html += `<details open><summary>💡 解题思路</summary>
    <div class="thinking-text">${p.thinking.replace(/\n/g,'<br>')}</div></details>`;
  // mapping
  if (p.mapping) {
    html += `<div class="maps">${Object.entries(p.mapping).map(([k,v]) =>
      `<div class="map-item"><div class="lbl">${k}</div><code>${v}</code></div>`).join('')}</div>`;
  }
  // code
  html += `<pre>${p.code}</pre>`;
  // trace
  if (p.trace) {
    html += `<details><summary>执行 Trace &middot; ${p.trace.title}</summary>
    <table class="trace">`;
    if (p.trace.headers) {
      html += `<tr>${p.trace.headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
    }
    if (p.trace.subheaders) {
      p.trace.subheaders.forEach(sh => {
        html += `<tr>${sh.map(c => `<th>${c}</th>`).join('')}</tr>`;
      });
    }
    if (p.trace.rows) {
      html += p.trace.rows.map(row => `<tr>${row.map(cell =>
        (typeof cell === 'string' && cell.startsWith('<b>')) ? `<td class="ans">${cell}</td>` : `<td>${cell}</td>`
      ).join('')}</tr>`).join('');
    }
    html += `</table></details>`;
  }
  html += `</div></section>`;
  return html;
}

// ================================================================
// TEMPLATES (hand-written HTML, preserved as-is)
// ================================================================
const TEMPLATES = {};

TEMPLATES.bs = `<section id="bs-tmpl">
<div class="card">
  <div class="card-header"><span class="badge badge-tmpl">核心模板</span><h3>first_true — 二分法统一框架</h3></div>
  <div class="tldr">把区间 [lo, hi) 分成前半段 False、后半段 True，找 <strong>第一个 True 的位置</strong>。全 False 返回 hi，全 True 返回 lo。</div>
  <pre id="bs-tmpl-code">def first_true(lo, hi, predicate):
    while lo < hi:
        mid = lo + hi >> 1        # 向下取整，避免死循环
        if predicate(mid):
            hi = mid              # mid 满足，答案在 [lo, mid]
        else:
            lo = mid + 1          # mid 不满足，答案在 [mid+1, hi)
    return lo                     # lo == hi，即答案</pre>
  <div class="maps">
    <div class="map-item"><div class="lbl">列表下标</div><code>lo=0, hi=len(nums)</code></div>
    <div class="map-item"><div class="lbl">答案域</div><code>lo=1, hi=max_val+1</code></div>
    <div class="map-item"><div class="lbl">版本号</div><code>lo=1, hi=n+1</code></div>
    <div class="map-item"><div class="lbl">找最后一个满足</div><code>first_true(...) - 1</code></div>
  </div>
  <div class="anim-wrap">
    <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px;">演示：nums=[1,3,5,6]，target=5，predicate: nums[i] >= 5</div>
    <div class="anim-row" id="bs-anim-arr"></div>
    <div class="anim-info" id="bs-anim-info">点击「下一步」开始</div>
    <div class="ptr-row" id="bs-anim-ptrs">
      <span class="ptr ptr-lo">lo=–</span><span class="ptr ptr-mid">mid=–</span><span class="ptr ptr-hi">hi=–</span>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:rgba(248,113,113,.4);border:1px solid var(--red)"></span>False区</span>
      <span><span class="dot" style="background:rgba(74,222,128,.4);border:1px solid var(--green)"></span>True区</span>
      <span><span class="dot" style="border:2px solid #60a5fa"></span>lo</span>
      <span><span class="dot" style="border:2px solid var(--accent3)"></span>mid</span>
      <span><span class="dot" style="border:2px solid var(--red)"></span>hi</span>
    </div>
    <div class="anim-btns">
      <button class="btn btn-sec" onclick="bsReset()">重置</button>
      <button class="btn" onclick="bsStep()">下一步 →</button>
    </div>
  </div>
</div>
</section>`;

TEMPLATES.sw = `<section id="sw-tmpl">
<div class="card">
  <div class="card-header"><span class="badge badge-tmpl">骨架模板</span><h3>滑动窗口两种变体</h3></div>
  <div class="tldr sw">right 持续扩张，窗口不合法时收缩 left。<strong>求最长用 if（收缩一格）；求最短用 while（持续收缩）。</strong></div>
  <pre># 变体A · 最大窗口（求最长合法子数组）
left = 0
for right, x in enumerate(nums):
    # 1. expand：把 x 纳入窗口状态
    ...
    # 2. 不合法时收缩一格（窗口大小单调，不会漏答案）
    if &lt;不合法&gt;:
        # shrink：移出 nums[left]
        ...
        left += 1
    # 3. 此时窗口合法，更新答案
    res = max(res, right - left + 1)

# 变体B · 最小窗口（求最短合法子数组）
left = 0
for right, x in enumerate(nums):
    # 1. expand
    ...
    # 2. 合法时持续收缩，记录最小长度
    while &lt;合法&gt;:
        res = min(res, right - left + 1)
        # shrink：移出 nums[left]
        ...
        left += 1</pre>
  <div class="anim-wrap">
    <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px;">演示：LC3 · s="abcabcbb"，无重复最长子串（变体A）</div>
    <div class="anim-row" id="sw-anim-arr"></div>
    <div class="anim-info" id="sw-anim-info">点击「下一步」开始</div>
    <div class="legend">
      <span><span class="dot" style="background:rgba(78,205,196,.3);border:1px solid var(--accent2)"></span>窗口内</span>
      <span><span class="dot" style="border:2px solid #60a5fa"></span>left</span>
      <span><span class="dot" style="border:2px solid var(--accent3)"></span>right</span>
      <span><span class="dot" style="background:rgba(248,113,113,.3);border:1px solid var(--red)"></span>收缩</span>
    </div>
    <div class="anim-btns">
      <button class="btn btn-sec" onclick="swReset()">重置</button>
      <button class="btn" onclick="swStep()">下一步 →</button>
    </div>
  </div>
</div>
</section>`;

TEMPLATES.bt = `<section id="bt-tmpl">
<div class="card">
  <div class="card-header"><span class="badge badge-tmpl">骨架模板</span><h3>回溯统一结构</h3></div>
  <div class="tldr bt">每步「做选择 → 递归 → 撤销选择」，通过 <strong>start 控制不回头</strong>（组合/子集）或 <strong>used[] 标记</strong>（排列）来避免重复。</div>
  <pre>def backtrack(path, choices):
    if 终止条件:
        result.append(path[:])   # 记录副本
        return
    for choice in choices:
        if 不合法: continue      # 剪枝
        path.append(choice)      # 做选择
        backtrack(path, ...)     # 递归
        path.pop()               # 撤销选择</pre>
  <div class="maps">
    <div class="map-item"><div class="lbl">去重（同层）</div><code>排序后跳过 nums[i]==nums[i-1]</code></div>
    <div class="map-item"><div class="lbl">组合/子集</div><code>用 start 不回头</code></div>
    <div class="map-item"><div class="lbl">排列</div><code>用 used[] 标记已选</code></div>
    <div class="map-item"><div class="lbl">剪枝</div><code>提前 if not valid: break</code></div>
  </div>
</div>
</section>`;

TEMPLATES.tr = `<section id="tr-tmpl">
<div class="card">
  <div class="card-header"><span class="badge badge-tmpl">骨架模板</span><h3>递归 DFS & 迭代 BFS</h3></div>
  <div class="tldr tr">后序 DFS：先拿到左右子树结果，再 combine。BFS：用 deque 逐层处理，<code>size=len(q)</code> 控制层边界。</div>
  <pre># 后序 DFS（最常用）
def dfs(node):
    if not node: return &lt;base&gt;
    left  = dfs(node.left)
    right = dfs(node.right)
    return &lt;combine(left, right, node.val)&gt;

# BFS 层序
from collections import deque
q = deque([root])
while q:
    for _ in range(len(q)):    # 控制层边界
        node = q.popleft()
        # 处理 node
        if node.left:  q.append(node.left)
        if node.right: q.append(node.right)</pre>
</div>
</section>`;

TEMPLATES.dp = `<section id="dp-tmpl">
<div class="card">
  <div class="card-header"><span class="badge badge-tmpl">骨架模板</span><h3>动态规划四步法</h3></div>
  <div class="tldr dp"><strong>定义状态 → 初始化边界 → 写转移方程 → 返回答案。</strong>完全背包正序，0/1背包逆序。</div>
  <pre># 一维DP
dp = [init] * (n + 1)

function renderSidebar(navId, groups) {
  const nav = document.getElementById(navId);
  if (!nav) return;
  nav.innerHTML = groups.map(g =>
    `<div class="grp">${g.grp}</div>` +
    g.links.map(l => `<a href="${l.href}">${l.text}</a>`).join('')
  ).join('');
}

function renderMain(mainId, tmplHtml, problems, sumHtml) {
  const main = document.getElementById(mainId);
  if (!main) return;
  let html = tmplHtml;
  problems.forEach(p => { html += renderProblem(p); });
  if (sumHtml) html += sumHtml;
  main.innerHTML = html;
}

// ================================================================
// Tab switching
// ================================================================
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

// ================================================================
// Copy buttons
// ================================================================
function initCopyButtons() {
  document.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = '复制';
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.innerText.replace('复制','').trim());
      btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 1500);
    };
    pre.appendChild(btn);
  });
}
initCopyButtons();

// ================================================================
// Navigation highlight (IntersectionObserver)
// ================================================================
const sectionObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const tabContent = e.target.closest('.tab-content');
    if (!tabContent || !tabContent.classList.contains('active')) return;
    const link = tabContent.querySelector(`a[href="#${e.target.id}"]`);
    if (link) link.classList.toggle('active', e.isIntersecting);
  });
}, { threshold: 0.3 });
document.querySelectorAll('section[id]').forEach(s => sectionObserver.observe(s));

// ================================================================
// Binary Search Animation
// ================================================================
const bsNums = [1,3,5,6];
const bsSteps = [
  { lo:0, hi:4, mid:2, trueFrom:2, info:'mid=2，nums[2]=5 >= 5 -> True -> hi=2' },
  { lo:0, hi:2, mid:1, trueFrom:2, info:'mid=1，nums[1]=3 >= 5 -> False -> lo=2' },
  { lo:2, hi:2, mid:-1, trueFrom:2, info:'lo == hi == 2，返回 2', done:true },
];
let bsCur = -1;

function bsRender(step) {
  const arr = document.getElementById('bs-anim-arr');
  const info = document.getElementById('bs-anim-info');
  const ptrs = document.getElementById('bs-anim-ptrs');
  if (!arr) return;
  arr.innerHTML = '';
  for (let i = 0; i < bsNums.length; i++) {
    const c = document.createElement('div');
    c.className = 'anim-cell';
    c.innerHTML = bsNums[i] + `<span class="ci">${i}</span>`;
    if (step >= 0) {
      const s = bsSteps[step];
      if (i >= s.trueFrom) c.classList.add('z-b');
      else c.classList.add('z-a');
      if (i === s.lo) c.classList.add('p-lo');
      if (i === s.mid && s.mid >= 0) c.classList.add('p-mid');
      if (i === s.hi - 1 || (s.done && i === s.lo)) c.classList.add('p-hi');
    }
    arr.appendChild(c);
  }
  if (step >= 0 && ptrs && info) {
    const s = bsSteps[step];
    info.textContent = s.info;
    ptrs.innerHTML = `<span class="ptr ptr-lo">lo=${s.lo}</span><span class="ptr ptr-mid">mid=${s.mid>=0?s.mid:'–'}</span><span class="ptr ptr-hi">hi=${s.hi}</span>`;
  } else if (ptrs && info) {
    info.textContent = '点击「下一步」开始';
    ptrs.innerHTML = '<span class="ptr ptr-lo">lo=–</span><span class="ptr ptr-mid">mid=–</span><span class="ptr ptr-hi">hi=–</span>';
  }
}
function bsStep() { if (bsCur < bsSteps.length-1) bsCur++; bsRender(bsCur); }
function bsReset() { bsCur = -1; bsRender(-1); }
bsRender(-1);

// ================================================================
// Sliding Window Animation (LC3 "abcabcbb")
// ================================================================
const swStr = 'abcabcbb';
const swSteps = (() => {
  const steps = []; const cnt = {}; let left = 0, best = 0;
  for (let right = 0; right < swStr.length; right++) {
    const c = swStr[right];
    cnt[c] = (cnt[c]||0) + 1;
    steps.push({ right, left, shrink:-1, info:`expand right=${right} '${c}'，count['${c}']=${cnt[c]}` });
    if (cnt[c] > 1) {
      steps.push({ right, left, shrink:left, info:`count['${c}']>1，收缩 left=${left} '${swStr[left]}'` });
      cnt[swStr[left]]--; left++;
    }
    best = Math.max(best, right-left+1);
    steps.push({ right, left, shrink:-1, info:`窗口 "${swStr.slice(left,right+1)}" 长=${right-left+1}，最长=${best}` });
  }
  return steps;
})();
let swCur = -1;

function swRender(step) {
  const arr = document.getElementById('sw-anim-arr');
  const info = document.getElementById('sw-anim-info');
  if (!arr) return;
  arr.innerHTML = '';
  for (let i = 0; i < swStr.length; i++) {
    const c = document.createElement('div');
    c.className = 'sw-cell';
    c.innerHTML = swStr[i] + `<span class="ci">${i}</span>`;
    if (step >= 0) {
      const s = swSteps[step];
      if (i >= s.left && i <= s.right) c.classList.add('sw-win');
      if (i === s.left) c.classList.add('sw-l');
      if (i === s.right) c.classList.add('sw-r');
      if (i === s.shrink) c.classList.add('sw-shrink');
    }
    arr.appendChild(c);
  }
  if (step >= 0 && info) info.textContent = swSteps[step].info;
  else if (info) info.textContent = '点击「下一步」开始';
}
function swStep() { if (swCur < swSteps.length-1) swCur++; swRender(swCur); }
function swReset() { swCur = -1; swRender(-1); }
swRender(-1);
</script>
