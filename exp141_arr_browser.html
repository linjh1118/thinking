interpretability. \nCode and datasets will be released upon acceptance.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Grounded Factuality Evaluation", "Small Language Model"], "openreview_url": "https://openreview.net/forum?id=WOULvOWCLC", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "edxkMD5v3I", "title": "ROXY: Generative Indexing and Conflict-Aware Reranking for Long-Horizon Conversational Memory", "abstract": "Long-horizon conversational assistants must answer questions grounded in multi-session dialogue, yet external memory faces two key challenges: (1) retrieval mismatch-queries often lack cues to surface relevant memories, and (2) conflict resolution-retrieved evidence contains temporal updates, negations, or overrides that similarity- and rule-based methods cannot reliably handle. We propose ROXY, a retrieval-oriented memory framework that integrates Generative Indexing and Conflict-Aware Reranking to address both challenges. For retrieval, ROXY performs Generative Indexing (GI): an LLM generates anticipatory cue questions for each memory chunk and indexes them alongside the original content. For conflicts, a conflict-aware LLM judge reasons over high-recall candidates conditioned on the query, selecting logically coherent evidence without hand-crafted rules-whereas similarity-based methods fail to distinguish semantically similar but contradictory memories. On the LoCoMo benchmark under identical configurations as MemInsight, ROXY achieves 89.3 Recall@5 and 41.2 F1, outperforming MemInsight by +28.8 and +11.1 points respectively, with strong gains on single-hop, temporal, multi-hop, and adversarial questions. These results show that anticipatory indexing combined with adaptive conflict reasoning offers a scalable solution for memory-grounded conversational agents. Code and prompts will publicly available.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Generative indexing", "conversational long-term memory", "retrieval-augmented generation (RAG)", "conflict-aware reranking"], "openreview_url": "https://openreview.net/forum?id=edxkMD5v3I", "contribution_types": ["Engineering"]}, {"id": "NRxPkSrSYA", "title": "Leveraging Pretrained Language Models as Energy Functions for Glauber Dynamics Text Diffusion", "abstract": "We present a discrete diffusion-based generative model for text generation using Glauber dynamics from statistical physics. Our main insight is that instead of trying to train a discrete state space diffusion model using Glauber dynamics with a uniform transition kernel as the forward process, one can set up an ``energy function'' based on pretrained causal/masked language models, which, when viewed as the stationary distribution, allows us to significantly improve the quality of the generated text. Using UL2 as our pretrained models and modifying and incorporating it into our diffusion pipeline, we obtain significantly better perplexities than prior diffusion-based text generative models and are competitive with the perplexities of GPT-2-medium and GPT-2-large for comparable model sizes. Furthermore, our models outperform prior diffusion models and GPT-2 style auto-regressive models on some zero-shot common sense reasoning tasks as well as some planning/search tasks.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["text diffusion models", "non-autoregressive text generation"], "openreview_url": "https://openreview.net/forum?id=NRxPkSrSYA", "contribution_types": ["Engineering"]}, {"id": "zCKfj3kt4P", "title": "SelFusion: Self-distillation for Diffusion Language Models", "abstract": "Diffusion language models (DLMs) alleviate the inherent latency bottleneck of autoregressive (AR) large language models (LLMs), but their degraded generation quality limits practical applicability.\nAlthough knowledge distillation (KD) can be a promising direction for improving performance, we empirically find that naively applying conventional KD yields only marginal gains, or even degrades generation quality.\nBased on these observations, we propose a novel self-distillation framework for DLMs, namely SelFusion.\nTo enable effective KD without an external teacher model, SelFusion performs two forward passes with different masking levels, defining the hard mode with a larger masking probability and the easy mode with a smaller masking probability.\nHowever, the easy mode is not always more accurate than the hard mode and can be overconfident on incorrect tokens.\nThus, we introduce bidirectional KD between the two modes, which can dynamically determine the distillation direction based on token-level correctness.\nExperimental results on instruction-following tasks show that the proposed self-distillation substantially outperforms other KD methods with external LLM and DLM teachers. In many configurations, the student trained with SelFusion even surpasses the performance of the LLM teacher, providing a practical path toward improving DLM generation quality. Source\ncode can be found at \\url{https://github.com/selfusionofficial/SelFusion_ACL.git}", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Diffusion Language Models", "Knowledge Distillation", "Self Distillation"], "openreview_url": "https://openreview.net/forum?id=zCKfj3kt4P", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "QrBZsw2o62", "title": "Rethinking Depression Prediction from a Fine-Grained Subscore Modeling Perspective via Multi-Task Learning", "abstract": "Standard depression assessment relies on instruments such as the clinician-rated Hamilton Depression Rating Scale (HAMD) and the patient-reported Patient Health Questionnaire (PHQ-8), but manual scoring is time-consuming and subject to inter-rater variability. Prior automated approaches typically regress a single total score or coarse severity category, lacking the fine-grained subscore-level supervision needed for precise clinical diagnosis. To address this, we propose MTSP (Multi-Task Subscore Prediction), a fine-grained model for subscore prediction via multi-task learning. MTSP achieves state-of-the-art performance on the public E-DAIC dataset (MAE 3.48, RMSE 4.57) and generalizes well to the public PDCH and a large-scale private clinical dataset (CIDH), outperforming total-score regression baselines and Qwen3-14B direct scoring. We further show that multi-task learning is essential, subscore-level supervision improves assessment by better capturing symptom-cluster structure, and prior constraints plus task-level self-paced learning enhance robustness to subscore difficulty and annotation noise.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MTSP-1D51"], "keywords": ["depression prediction", "mental health assessment", "fine-grained subscore modeling", "multi-task learning", "clinical NLP", "PHQ-8"], "openreview_url": "https://openreview.net/forum?id=QrBZsw2o62", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "v6LMybxmMf", "title": "Distributed Interpretability and Control for Large Language Models", "abstract": "Large language models that require multiple GPU cards to host are usually the most capable models. It is necessary to understand and steer these models, but the current technologies do not support the interpretability and steering of these models in the multi-GPU setting as well as the single-GPU setting. We present a practical implementation of activation-level interpretability (logit lens) and steering (steering vector) that scales up to multi-GPU language models. \nOur system implements design choices that reduce the activation memory by up to 7× and increase the throughput by up to 41× compared to a baseline on identical hardware. We demonstrate the method across LLaMA-3.1 (8B, 70B) and Qwen-3 (4B, 14B, 32B), sustaining 20–100 tokens/s while collecting full layer-wise activation trajectories for sequences of 1,500 tokens. Using label-position steering vectors injected post-LayerNorm, we show controllable, monotonic shifts in model outputs with a mean steerability slope of 0.702 across evaluated datasets, without fine-tuning or additional forward passes. We release detailed benchmarks, ablations, and a reproducible instrumentation recipe to enable practical interpretability and real-time behavioral control for frontier LLMs.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Mechanistic interpretability", "logit lens", "activation steering", "tensor parallelism", "distributed inference", "KV-cached decoding"], "openreview_url": "https://openreview.net/forum?id=v6LMybxmMf", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "y7nPwxaBh4", "title": "Rebalancing Token Importance in Language Models with TF-IDF Weighted Cross-Entropy Loss", "abstract": "Large language models are typically trained under uniform token weighting, which allows frequent and low-information tokens to dominate learning and can increase the tendency to memorize surface-level text spans. To address this memorization issue, we present an information-weighted cross-entropy loss that rescales token-level contributions using TF-IDF statistics, emphasizing semantically-informative tokens while downweighting ubiquitous ones. Experiments on five decoder-only LLMs ranging from 1.1B to 13B parameters show consistent reductions in memorized substring length across all models, while preserving perplexity and downstream task performance. The strongest reduction is observed for GPT-J 6B, with an average decrease of up to 20% in average substring memorization length. Our approach is architecture-agnostic and can be incorporated into existing training pipelines with minimal overhead, suggesting that token-aware weighting provides a lightweight and principled approach to mitigating memorization without disrupting standard training dynamics.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Verbatim Memorization", "Training Objectives", "Privacy in NLP", "Token-Aware Loss", "TF-IDF"], "openreview_url": "https://openreview.net/forum?id=y7nPwxaBh4", "contribution_types": ["Analysis", "Engineering"]}, {"id": "C6TJ92Mjud", "title": "Corrective Unlearning: Scalable and Robust Knowledge Removal via Output Correction", "abstract": "Language models trained on web-scale data risk memorizing and exposing sensitive information, yet existing unlearning methods struggle to balance safety, utility, and scalability. Prior approaches based on fine-tuning or input guardrails often degrade model performance, remain vulnerable to indirect probing, and scale poorly to continual unlearning. We propose corrective unlearning, a novel paradigm that achieves effective and scalable unlearning through output correction. Our framework, CURE, employs a lightweight corrector to detect and rewrite potential leakage in initial model drafts, leveraging retrieved unlearning targets as negative in-context references. Extensive evaluations show that CURE substantially reduces information leakage, even under indirect queries where prior methods fail, while preserving response quality and model utility. Moreover, CURE remains robust in continual and out-of-distribution unlearning scenarios, making it practical for real-world deployment.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["unlearning", "safety", "language model"], "openreview_url": "https://openreview.net/forum?id=C6TJ92Mjud", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "bRYHU5buE5", "title": "OpenRubrics: Towards Scalable Synthetic Rubric Generation for Reward Modeling and LLM Alignment", "abstract": "Reward modeling lies at the core of reinforcement learning from human feedback (RLHF), yet most existing reward models rely on scalar or pairwise judgments that fail to capture the multifaceted nature of human preferences.\nRecent studies have explored \\emph{rubrics-as-rewards} (RaR) that uses structured criteria to capture multiple dimensions of response quality. However, producing rubrics that are both reliable and scalable remains a key challenge.\nIn this work, we introduce OpenRubrics, a diverse, large-scale collection of (prompt, rubric) pairs for training rubric-generation and rubric-based reward models. \nTo elicit discriminative and comprehensive evaluation signals, we introduce \\emph{Contrastive Rubric Generation} (CRG), which derives both hard rules (explicit constraints) and principles (implicit qualities) by contrasting preferred and rejected responses. We further remove noisy rubrics via preserving preference–label consistency. Across multiple reward-modeling benchmarks, our rubric-based reward model, Rubric-RM, surpasses strong size-matched baselines by 8.4\\%. These gains transfer to policy models on instruction-following and biomedical benchmarks.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["reward modeling", "large language model", "rubric"], "openreview_url": "https://openreview.net/forum?id=bRYHU5buE5", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "q2h2Ip1pQj", "title": "Reframing Responsibility: Framing-Aware Event Causality Identification", "abstract": "Causal explanations in political narratives are often framed and contested. Different sources may explain the same event by assigning responsibility to different actors and expressing varying levels of certainty. Standard Event Causality Identification (ECI) focuses on detecting causal links and does not capture these distinctions.\nWe introduce Framing-Aware Event Causality Identification (FrECI), a framing-aware extension of ECI that models causal explanations as structured claims including responsibility targets, evaluative framing, source type, and epistemic modality grounded in established framing theories. We construct a multilingual dataset aligned across English, Chinese, and Arabic narratives using shared event anchors.\nWe evaluate FrECI using prompt-based large language model baselines and supervised neural models. Results show that prompt-based baselines struggle to recover complete framed causal claims, while joint supervised models perform substantially better. Finally, we demonstrate that FrECI enables quantitative analysis of divergent causal attribution across narratives.", "area": "Social NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["event causality identification", "computational framing", "causal attribution", "responsibility attribution", "event-centric framing", "political narratives"], "openreview_url": "https://openreview.net/forum?id=q2h2Ip1pQj", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "WARL13Mnu7", "title": "Listen, Pause, and Reason: Toward Perception-Grounded Hybrid Reasoning for Audio Understanding", "abstract": "Recent Large Audio Language Models have demonstrated impressive capabilities in audio understanding. However, they frequently suffer from **perceptual errors**, while reliable audio reasoning is unattainable without first grounding the model’s perception in structured auditory scenes. Inspired by **Auditory Scene Analysis**, we first introduce **PAQA**, a dataset for Perception-Aware Question Answering. PAQA implements a hierarchical decoupling strategy that separates speech from environmental sound and distinguishes multi speakers, providing explicit perceptual reasoning for training. Building on this, we propose **HyPeR**, a two-stage Hybrid Perception-Reasoning framework. In Stage I, we finetune the model on PAQA to percept acoustic attributes in complex audio. In Stage II, we leverage Group Relative Policy Optimization to refine the model's internal deliberation. We introduce PAUSE tokens to facilitate latent computation during acoustically ambiguous phases and design **Perceptual Consistency Reward** to align reasoning rationales with raw audio. Experiments across key benchmark demonstrate that HyPeR achieves an absolute improvement over the base model, including MMAU-mini (+13.1%), MMAR (+25.5%), and PAQA (+28.2%), with performance comparable to large-scale models, stressing the effectiveness of hybrid perception-grounded reasoning, particularly in noisy and multi-speaker scenarios.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Audio Language Models", "Audio Question Answering", "Auditory Scene Analysis", "Perceptual Error", "Latent Reasoning", "Group Relative Policy Optimization"], "openreview_url": "https://openreview.net/forum?id=WARL13Mnu7", "contribution_types": ["Analysis", "Low-resource", "Dataset"]}, {"id": "tVDS7MTXgd", "title": "Towards Agentic Document-Grounded Information Seeking", "abstract": "Document Question Answering (DocQA) focuses on answering questions grounded in given documents, yet existing DocQA agents lack effective tool utilization and largely rely on closed-source models.\nIn this work, we introduce DocDancer, an end-to-end trained open-source Doc agent.\nWe formulate DocQA as an information-seeking problem and propose a tool-driven agent framework that explicitly models document exploration and comprehension.\nTo enable end-to-end training of such agents, we introduce an Exploration-then-Synthesis data synthesis pipeline that addresses the scarcity of high-quality training data for DocQA.\nTraining on the synthesized data, the trained models on two long-context document understanding benchmarks, MMLongBench-Doc and DocBench, show their effectiveness.\nFurther analysis provides valuable insights for the agentic tool design and synthetic data.", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information Seeking", "Document Question Answering", "LLM Agents", "Tool Use"], "openreview_url": "https://openreview.net/forum?id=tVDS7MTXgd", "contribution_types": ["Engineering"]}, {"id": "ItvdPuHAMq", "title": "Block-Aware Semantic Efficient Retention for Long-Context LLM Inference", "abstract": "In long-context understanding and reasoning, large language models often struggle to focus on semantically relevant information due to dispersed attention over lengthy inputs, leading to degraded semantic modeling. Existing sparse attention methods typically rely on fixed patterns or posterior filtering, lacking explicit prior modeling of contextual importance. We propose BSER (Block-Aware Semantic Efficient Retention), an attention-guided semantic sparsification approach that performs hierarchical relevance modeling before attention computation. BSER dynamically retains context blocks most relevant to the query and applies local context expansion to preserve semantic coherence. The approach is training-free and can be seamlessly integrated into off-the-shelf language models. Experiments on multiple long-context benchmarks demonstrate that BSER consistently improves performance while significantly reducing inference cost. Codes are available at https://anonymous.4open.science/r/BSER-F488/.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/BSER-F488", "https://anonymous.4open.science/r/BSER-024F488"], "keywords": ["Long-Context Inference", "Sparse Attention", "Semantic Efficiency", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=ItvdPuHAMq", "contribution_types": ["Efficiency"]}, {"id": "A5dP6umZQ5", "title": "OSCBench: Benchmarking Object State Change in Text-to-Video Generation", "abstract": "Text-to-video (T2V) generation models have made rapid progress in producing visually high-quality and temporally coherent videos. However, existing benchmarks primarily focus on perceptual quality, text–video alignment, or physical plausibility, leaving a critical aspect of action understanding largely unexplored: object state change (OSC) explicitly specified in the text prompt. OSC refers to the transformation of an object’s state induced by an action, such as peeling a potato or slicing a lemon. In this paper, we introduce OSCBench, a benchmark specifically designed to assess OSC performance in T2V models. OSCBench is constructed from instructional cooking data and systematically organizes action–object interactions into regular, novel, and compositional scenarios to probe both in-distribution performance and generalization. We evaluate six representative open-source and proprietary T2V models using both human user study and multimodal large language model (MLLM)–based automatic evaluation. Our results show that, despite strong performance on semantic and scene alignment, current T2V models consistently struggle with accurate and temporally consistent object state changes, especially in novel and compositional settings. These findings position OSC as a key bottleneck in text-to-video generation and establish OSCBench as a diagnostic benchmark for advancing state-aware video generation models.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Text-to-Video Generation Benchmark", "Object State Change"], "openreview_url": "https://openreview.net/forum?id=A5dP6umZQ5", "contribution_types": ["Dataset"]}, {"id": "gcAHlwY7jd", "title": "SkyAPI: Cost-Effective API Orchestration for Compound LLM Serving", "abstract": "The rapid adoption of large language models (LLMs) has accelerated a shift from single-request inference toward compound and agentic applications, where multiple LLM calls collaborate through structured, graph-based workflows. These systems increasingly rely on third-party inference APIs, whose latency and pricing vary widely across providers. However, existing API routing approaches optimize requests in isolation, overlooking inter-request dependencies, which substantially degrades cost effectiveness in compound execution.\n\nWe present SkyAPI, a structure-aware API orchestration framework for compound LLM serving. SkyAPI optimizes provider selection for compound execution graphs by decomposing dynamic workflows into ordered execution stages that explicitly capture dependencies and straggler effects. At each stage, SkyAPI formulates provider selection as an integer linear program that jointly optimizes stage makespan and monetary cost, while incrementally compensating for execution-time uncertainty (e.g., unknown request dependencies and response lengths) and runtime variation (e.g., API latency fluctuations). SkyAPI further incorporates a prefix-warmup scheduling mechanism that maximizes cache reuse without increasing effective latency. Extensive real-world evaluation across DeepResearch, GAMA-Bench, and ten commercial API providers shows that SkyAPI achieves 54\\% cost savings and 62\\% latency reduction comparing to existing baselines.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM", "Multi-agent System", "Orchestration"], "openreview_url": "https://openreview.net/forum?id=gcAHlwY7jd", "contribution_types": ["Analysis", "Engineering"]}, {"id": "4V0cZkWT1A", "title": "TALE: Tool-using Agent Learning from Error", "abstract": "Large language models equipped with external tools have shown strong potential as general-purpose agents, yet they remain brittle when tool execution fails. Existing approaches largely rely on heuristic self-correction or imitation of error-fix patterns, making it difficult for agents to reliably recover from tool-calling errors, especially in multi-step settings. In this paper, we present TALE, a reinforcement learning framework that enables LLM-based agents to acquire robust self-correction behaviors by explicitly learning from their own tool-calling errors. TALE formulates error recovery as a sequential decision-making problem and introduces a progress-aware reward that captures incremental improvement across consecutive repair attempts, rather than relying solely on sparse success signals. This design encourages directional exploration and discourages repetitive or unproductive behaviors. Extensive experiments on four representative tool-using benchmarks demonstrate that TALE consistently improves task success and correction efficiency, achieving significant gains over strong baselines on challenging settings such as BFCL-v3. Our results show that learning from error experience is a key step toward more reliable and adaptive tool-using agents.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["tool use; function calling; self-corretion; reinforcement learning"], "openreview_url": "https://openreview.net/forum?id=4V0cZkWT1A", "contribution_types": []}, {"id": "xyfbEHasG8", "title": "Aligning Implied Statements for Implicit Hate Speech Generalizability with Context-Bounded Semi-hard Negative Mining", "abstract": "Classifying implicit hate speech remains a challenge, intent is often masked through insinuation and context rather than explicit slurs. Prior supervised contrastive approaches improve in-domain detection but can overfit surface cues and struggle to transfer across datasets. We propose \\textsc{ImpSH}, a triplet-based framework that aligns posts with implied statements when available and uses context-bounded semi-hard negatives to focus learning on near confusions. We also examine \\textsc{AugSH}, which forms positives via data augmentation. In controlled evaluations on \\textsc{IHC}, \\textsc{SBIC}, and \\textsc{DynaHate} with \\textsc{BERT} and \\textsc{HateBERT}, \\textsc{ImpSH} is a viable alternative to standard supervised contrastive baselines and often improves cross-domain performance under matched preprocessing and tuning budgets. Representation analysis using alignment and uniformity indicates tighter positive pairs with balanced global spread, and qualitative nearest-neighbor case studies illustrate typical false negatives under domain shift. These results demonstrate that aligning posts with their implied statements via context-bounded mining provides a more stable, bijective-like mapping to related insinuations, overcoming the volatility inherent in traditional clustering-based representation learning.\\footnote{Code will be released under the MIT license upon acceptance.}", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["NLP Applications", "Computational Social Science and Cultural Analytics", "Ethics", "Bias", "and Fairness", "Interpretability and Analysis of Models for NLP"], "openreview_url": "https://openreview.net/forum?id=xyfbEHasG8", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Dataset", "Data Analysis"]}, {"id": "bhXbznwRGI", "title": "XYZ-Text2SQL-R1: Simple Rewards, Strong Reasoning in Text-to-SQL", "abstract": "Translating natural language into SQL (Text2SQL) is a longstanding challenge at the intersection of natural language understanding and structured data access. While large language models (LLMs) have significantly improved fluency in SQL generation, producing correct and executable SQL, particularly for complex queries, remains a bottleneck. We present \\textbf{XYZ-Text2SQL-R1}, a reinforcement learning (RL) framework and model family designed to generate accurate, executable SQL using a lightweight reward signal based solely on execution correctness. Our approach avoids brittle intermediate supervision and complex reward shaping, promoting stable training and alignment with the end task. Combined with carefully curated data, strong supervised initialization, and effective training practices, XYZ-Text2SQL-R1 achieves state-of-the-art execution accuracy across six diverse Text2SQL benchmarks and ranks among the leading entries on the BIRD leaderboard. Notably, our 7B model outperforms prior 70B-class systems, highlighting the framework’s scalability and efficiency. We further demonstrate inference-time robustness through simple extensions like value retrieval and majority voting. Extensive experiments and ablation studies offer both positive and negative insights, providing practical guidance for future Text2SQL research.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Text to SQL", "Reasoning Models", "Large Language Models", "DataBase"], "openreview_url": "https://openreview.net/forum?id=bhXbznwRGI", "contribution_types": ["Engineering"]}, {"id": "UdlAGXV8vs", "title": "Writing-RL: Advancing Long-form Writing via Adaptive Curriculum Reinforcement Learning", "abstract": "Recent advances in Large Language Models (LLMs) have enabled strong performance in long-form writing, but current training paradigms remain limited: Supervised Fine-Tuning (SFT) remains constrained by data saturation and performance ceilings, while Reinforcement Learning with Verifiable Reward (RLVR), though successful in verifiable domains like math and code, cannot be directly migrated to open-ended long-form writing due to a lack of ground-truths. To further advance long-form writing, we present Writing-RL: an Adaptive Curriculum Reinforcement Learning framework to advance long-form writing capabilities beyond SFT. The framework consists of three key components: Margin-aware Data Selection strategy that prioritizes samples with high learning potential, Pairwise Comparison Reward mechanism that provides discriminative learning signals in the absence of verifiable rewards, and Dynamic Reference Scheduling approach, which plays a critical role by adaptively adjusting task difficulty based on evolving model performance. Experiments on 7B-scale writer models show that Writing-RL effectively improves long-form writing performance over strong SFT baselines. Furthermore, we observe that models trained with long-output RL generalize surprisingly well to long-input reasoning tasks, potentially offering a promising perspective for rethinking long-context training.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["reinforcement learning", "long-form writing", "curriculum", "large language model"], "openreview_url": "https://openreview.net/forum?id=UdlAGXV8vs", "contribution_types": ["Engineering", "Dataset"]}, {"id": "9R2E5MUIxV", "title": "CoRRSafe: Improving LRM safety via Co-optimized Fine-Grained Reasoning and Response Alignment", "abstract": "Large reasoning models (LRMs) with explicit Chain-of-Thought (CoT) face significant safety risks, where unsafe content may appear in intermediate reasoning even when the final response is safe. Existing safety alignment methods often ignore the safety of the reasoning and frequently suffer from over-alignment issues. To address these, we propose **CoRRSafe** (**C**o-**o**ptimized **R**easoning and **R**esponse **Safe**), a two-stage framework designed to comprehensively enhance LRM safety while balancing safety and over-refusal. The method begins with a response cold-start stage using filtered high-quality data for initial alignment on responses. Then we implement a GRPO-based training strategy with fine-grained rewards to jointly evaluate segmented reasoning steps and final answers. This approach effectively guides the model to autonomously learn safe reasoning and response behaviors. Experiments on multiple LRMs show that CoRRSafe achieves state of the art performance in reasoning safety and comprehensive metrics balancing response safety and false refusal. On DeepSeek-Distill-R1-8B, it raises the Reasoning Safety Rate from 27.91\\% to 91.42\\% and reduces the Attack Success Rate from 77.14\\% to 1.33\\%, with only a 18.03\\% increase in false refusal. Further analysis confirms that co-optimizing reasoning and response is essential, as optimizing either alone fails to overcome safety performance ceilings.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LRMs", "Safety Alignment", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=9R2E5MUIxV", "contribution_types": ["Analysis"]}, {"id": "voE8fuYywT", "title": "CrochetBench: Can Vision-Language Models Move from Describing to Doing in Crochet Domain?", "abstract": "While multimodal large language models can describe visual content, their ability to generate executable procedures remains underexplored. CrochetBench presented in this paper evaluates this shift from describing to doing through fine-grained procedural reasoning in crochet: models must recognize stitches, select structurally appropriate instructions, and generate compilable procedures. We adopt the CrochetPARADE DSL as our intermediate representation, enabling structural validation and functional evaluation via execution. The benchmark covers tasks including stitch classification, instruction grounding, and both natural language and image-to-DSL translation. Across all tasks, performance sharply decreases as the evaluation shifts from surface-level similarity to executable correctness, revealing limitations in long-range symbolic reasoning and 3D-aware procedural synthesis. Our proposed CrochetBench offers a new lens for assessing procedural competence in multimodal models and highlights the gap between surface-level understanding and executable precision in real-world creative domains. Code is available at https://anonymous.4open.science/r/crochet-82E6/README.md.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/crochet-82E6"], "keywords": ["Crochet Pattern Generation", "Multimodal", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=voE8fuYywT", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "ijxAZtVHrs", "title": "When Models Judge Themselves: Unsupervised Self-Evolution for Multimodal Reasoning", "abstract": "Recent progress in multimodal large language models has led to strong performance on reasoning tasks, but these improvements largely rely on high quality annotated data, which is costly and difficult to scale.To address this, we propose an unsupervised self-evolution training framework for multimodal reasoning that achieves stable performance improvements without using human-annotated answers or external reward models. For each input, we sample multiple reasoning trajectories and jointly model their within group structure.\nWe use the Actor’s self-consistency signal as a training prior, and introduce a bounded Judge based modulation to continuously reweight trajectories of different quality.We further model the modulated scores as a group level distribution and convert absolute scores into relative advantages within each group, enabling more robust policy updates. Trained with Group Relative Policy Optimization (GRPO) on unlabeled data, our method consistently improves reasoning performance and generalization on five mathematical reasoning benchmarks, including MathVision and DynaMath, offering a scalable path toward self-evolving multimodal models.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Unsupervised self-evolving;Multimodal reasoning;Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=ijxAZtVHrs", "contribution_types": ["Analysis"]}, {"id": "JubQ8z6TDD", "title": "AMVICC: A Novel Benchmark for Cross-Modal Failure Mode Profiling for VLMs and IGMs", "abstract": "We investigated visual reasoning limitations of both multimodal large language models (MLLMs) and image generation models (IGMs) by creating a novel benchmark to systematically compare failure modes across image-to-text and text-to-image tasks, enabling cross-modal evaluation of visual understanding. Despite rapid growth in machine learning, vision language models (VLMs) still fail to understand or generate basic visual concepts such as object orientation, quantity, or spatial relationships, which highlighted gaps in elementary visual reasoning. By adapting MMVP benchmark questions into explicit and implicit prompts, we create AMVICC, a novel benchmark for profiling failure modes across various modalities. After testing 11 MLLMs and 3 IGMs in nine categories of visual reasoning, our results show that failure modes are often shared between models and modalities, but certain failures are model-specific and modality-specific, and this can potentially be attributed to various factors. IGMs consistently struggled to manipulate specific visual components in response to prompts, especially in explicit prompts, suggesting poor control over fine-grained visual attributes. Our findings apply most directly to the evaluation of existing state-of-the-art models on structured visual reasoning tasks. This work lays the foundation for future cross-modal alignment studies, offering a framework to probe whether generation and interpretation failures stem from shared limitations to guide future improvements in unified vision-language modeling.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["machine learning", "image generation modes", "MLLMs", "failure modes", "benchmark", "cross-modal"], "openreview_url": "https://openreview.net/forum?id=JubQ8z6TDD", "contribution_types": ["Analysis", "Data Analysis"]}, {"id": "IYVJabaj8a", "title": "Patch the Distribution Mismatch: RL Rewriting Agent for Stable Off-Policy SFT", "abstract": "Large language models (LLMs) have made rapid progress, yet adapting them to downstream scenarios still commonly relies on supervised fine-tuning (SFT). When downstream data exhibit a substantial distribution shift from the model’s prior training distribution, SFT can induce catastrophic forgetting. \nTo narrow this gap, data rewriting has been proposed as a data-centric approach that rewrites downstream training data prior to SFT.\nHowever, existing methods typically sample rewrites from a prompt-induced conditional distribution, so the resulting targets are not necessarily aligned with the model’s natural QA-style generation distribution. Moreover, reliance on fixed templates can lead to diversity collapse. \nTo address these issues, we cast data rewriting as a policy learning problem and learn a rewriting policy that better matches the backbone’s QA-style generation distribution while preserving diversity.\nSince distributional alignment, diversity and task consistency are automatically evaluable but difficult to optimize end-to-end with differentiable objectives, we leverage reinforcement learning to optimize the rewrite distribution under reward feedback and propose an RL-based data-rewriting agent. The agent jointly optimizes QA-style distributional alignment and diversity under a hard task-consistency gate, thereby constructing a higher-quality rewritten dataset for downstream SFT. Extensive experiments show that our method achieves downstream gains comparable to standard SFT while reducing forgetting on non-downstream benchmarks by 12.34\\% on average.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Patch-the-Prompt-Gap-4112"], "keywords": ["data rewriting", "supervised fine-tuning", "catastrophic forgetting", "reinforcement learning"], "openreview_url": "https://openreview.net/forum?id=IYVJabaj8a", "contribution_types": ["Engineering"]}, {"id": "YLf1OOjR5w", "title": "PrefRAG: Correcting Semantic Errors in Auto-Formalization for Logical Reasoning with Program Preference RAG", "abstract": "Recent advances in large language models (LLMs) have spurred interest in neuro‑symbolic methods for logical reasoning based on auto‑formalization, where LLMs first formalize problems into symbolic programs, then symbolic solvers perform reasoning over these programs.\nHowever, existing auto-formalization methods remain prone to both syntactic and semantic errors.\nSpecifically, the absence of a program‑level semantic verification mechanism leaves semantic errors largely unaddressed.\nIn this paper, we propose a novel approach to semantic error correction via program preference RAG.\nFirst, we conduct an in-depth analysis of semantic error patterns, and then automatically synthesize $\\textbf{SemanticPref}$, a program preference dataset to model these patterns. Utilizing the dataset as knowledge base, we introduce $\\textbf{PrefRAG}$, a general retrieval‑augmented generation framework for refinement in auto-formalization, which enables LLMs to detect and repair both syntactic and semantic errors.\nExtensive evaluations across both in‑distribution (AR‑LSAT and FOLIO) and out‑of‑distribution benchmarks show that PrefRAG consistently outperforms strong baselines, achieving an average improvement of 2.39\\% on ID and 6.23\\% on OOD datasets.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/PrefRAG"], "keywords": ["Logical reasoning", "LLMs", "Neurosymbolic Reasoning", "Auto-formalization", "Retrieval-Augmented Generation"], "openreview_url": "https://openreview.net/forum?id=YLf1OOjR5w", "contribution_types": ["Engineering", "Dataset"]}, {"id": "7uGUohMy8L", "title": "Decoupling the Effect of Chain-of-Thought Reasoning: A Human Label Variation Perspective", "abstract": "Reasoning-tuned LLMs utilizing long Chain-of-Thought (CoT) excel at single-answer tasks, yet their ability to model Human Label Variation—which requires capturing probabilistic ambiguity rather than resolving it—remains underexplored. We investigate this through systematic disentanglement experiments on distribution-based tasks, employing Cross-CoT experiments to isolate the effect of reasoning text from intrinsic model priors. We observe a distinct \"decoupled mechanism\": while CoT improves distributional alignment, final accuracy is dictated by CoT content (99\\% variance contribution), whereas distributional ranking is governed by model priors (over 80\\%). Step-wise analysis further shows that while CoT’s influence on accuracy grows monotonically during the reasoning process, distributional structure is largely determined by LLM’s intrinsic priors. These findings suggest that long CoT serves as a decisive LLM decision-maker for the top option but fails to function as a granular distribution calibrator for ambiguous tasks.", "area": "Human-AI", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["human-centered evaluation", "chain-of-thought", "reasoning"], "openreview_url": "https://openreview.net/forum?id=7uGUohMy8L", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "CLdHidtJIy", "title": "RubricHub: A Comprehensive and Highly Discriminative Rubric Dataset  via Automated Coarse-to-Fine Generation", "abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) has driven substantial progress in reasoning-intensive domains like mathematics. However, optimizing open-ended generation remains challenging due to the lack of ground truth. While rubric-based evaluation offers a structured proxy for verification, existing methods suffer from scalability bottlenecks and coarse criteria, resulting in a supervision ceiling effect. To address this, we propose an automated Coarse-to-Fine Rubric Generation framework. By synergizing principle-guided synthesis, multi-model aggregation, and difficulty evolution, our approach produces comprehensive and highly discriminative criteria capable of capturing the subtle nuances. Based on this framework, we introduce RubricHub, a large-scale ($\\sim$110k) and multi-domain dataset. We validate its utility through a two-stage post-training pipeline comprising Rubric-based Rejection Sampling Fine-Tuning (RuFT) and Reinforcement Learning (RuRL). Experimental results demonstrate that RubricHub unlocks significant performance gains: our post-trained Qwen3-14B achieves state-of-the-art (SOTA) results on HealthBench (69.3), surpassing proprietary frontier models such as GPT-5.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Rubrics", "Dataset", "Rubric-based Reinforcement Learning", "Synthetic Data Method"], "openreview_url": "https://openreview.net/forum?id=CLdHidtJIy", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "yDJddU21H3", "title": "From Linear Input to Hierarchical Structure: Function Words as Statistical Cues for Language Learning", "abstract": "What statistical conditions support learning hierarchical structure from linear input? In this paper, we address this question by focusing on the statistical distribution of function words. Function words have long been argued to play a crucial role in language acquisition due to their distinctive distributional properties, including high frequency, reliable association with syntactic structure, and alignment with phrase boundaries. We use cross-linguistic corpus analysis to first establish that all three properties are present across 186 studied languages.\nNext, we use a combination of counterfactual language modeling and ablation experiments to show that language variants preserving all three properties are more easily acquired by neural learners, with frequency and structural association contributing more strongly than boundary alignment. Follow-up probing and ablation analyses further reveal that different learning conditions lead to systematically different reliance on function words, indicating that similar performance can arise from distinct internal mechanisms.", "area": "Linguistics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["statistical learning", "language acquisition", "language modeling", "function words"], "openreview_url": "https://openreview.net/forum?id=yDJddU21H3", "contribution_types": ["Analysis", "Theory"]}, {"id": "VmfUdx7HGS", "title": "LongNovel: A Multi-Scale Benchmark for Hallucination Detection in Long-Context Novel Summarization", "abstract": "Although context windows have expanded significantly in recent years, hallucinations in long-context summarization remain a challenge. Long novels are better suited than news or papers for researching these hallucinations, due to their intrinsic information and detailed descriptions of events and dialogues. However, current research lacks a Chinese benchmark for hallucination detection in long-context novels and does not fully explore how hallucinations change as the context grows longer. In this study, we propose LongNovel, the first long-context Chinese novel benchmark for hallucination detection. This benchmark is constructed from 29 books, ranging from 2k to 100k tokens. We design 8 hallucination types, employ a combination of Multi-Model Arbitration and Entity-Referenced Hallucination Generation to ensure both data authenticity and a balanced distribution of hallucination categories. Furthermore, we manually revise the contents in the test set to guarantee data reliability. Extensive experimental results demonstrate that LongNovel is a challenging benchmark. We release LongNovel for future research. https://anonymous.4open.science/r/LongNovel-60B194", "area": "Summarization", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/LongNovel-60B194", "https://anonymous.4open.science/r/LongNovel-60B194processingtheexplicitdatafoundinnewsoraca-041demi"], "keywords": ["Hallucination Detection， Long-context Summarization， Large Language models"], "openreview_url": "https://openreview.net/forum?id=VmfUdx7HGS", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "K0tOssqtJd", "title": "TSAQA: Time Series Analysis Question And Answering Benchmark", "abstract": "Time series data are integral to critical applications across domains such as finance, healthcare, transportation, and environmental science.\nWhile recent work has begun to explore multi-task time series question answering (QA), current benchmarks remain limited to forecasting\nand anomaly detection tasks. We introduce TSAQA, a novel unified benchmark designed to broaden task coverage and evaluate diverse\ntemporal analysis capabilities. TSAQA integrates six diverse tasks under a single framework ranging from conventional analysis, including anomaly detection and classification, to advanced analysis, such as characterization, comparison, data transformation, and temporal relationship analysis. Spanning 210k samples across 13 domains, the dataset employs diverse formats, including true-or-false (TF), multiple-choice (MC), and a novel puzzling (PZ), to comprehensively assess time series analysis. Zero-shot evaluation demonstrates that these tasks are challenging for current Large Language Models (LLMs): the best-performing commercial LLM, Gemini-2.5-Flash, achieves an average score of only 65.08. Although instruction tuning boosts open-source performance: the best-performing open-source model, LLaMA-3.1-8B, shows significant room for improvement, highlighting the complexity of temporal analysis for LLMs.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/TSAQA-Benchmark-B86B"], "keywords": ["Time Series Question Answering"], "openreview_url": "https://openreview.net/forum?id=K0tOssqtJd", "contribution_types": ["Dataset"]}, {"id": "pGXIS9FJhX", "title": "Beyond Superficial Tests: Adversarial Refinement for Reliable Property-Based Testing", "abstract": "Large Language Models (LLMs) have demonstrated remarkable proficiency in code generation, yet their application to Property-Based Testing (PBT) remains fraught with a “superficiality gap”. While LLMs can readily generate syntactically correct tests, they often struggle to bridge the semantic gap between code implementation and its intended invariant logic, resulting in weak properties that provide a false sense of security. To address this, we introduce PROBE, an agentic framework that hardens software properties through Adversarial Refinement. Unlike traditional generation approaches, PROBE treats test generation as a game of “semantic asymmetry”: it employs a Validator agent to actively generate counter-implementations, which are semantically incorrect codes that satisfy the generated property, to expose loopholes in the specification. Furthermore, PROBE constructs a cross-functional semantic graph to capture deep dependencies often missed by local analysis. Extensive evaluation reveals that PROBE increases mutation scores by 9.79% over baselines. In real-world deployment, PROBE identified 45 previously unknown bugs in top-tier libraries that have been confirmed by developers, demonstrating its ability to uncover deep semantic defects.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["property-based testing (PBT)", "LLM agents", "test generation", "adversarial refinement", "static analysis", "mutation testing"], "openreview_url": "https://openreview.net/forum?id=pGXIS9FJhX", "contribution_types": []}, {"id": "nYaNHv4kN5", "title": "ChunQiuTR: Time-Keyed Temporal Retrieval in Classical Chinese Annals", "abstract": "Retrieval shapes how language models access and cite knowledge in retrieval-augmented generation (RAG).  In historical research, the goal is often to locate the exact record for a specific regnal month, where temporal alignment matters as much as topical relevance. This is especially challenging for Classical Chinese annals: time is encoded in terse, implicit, non-Gregorian reign phrases that are context-dependent, so semantically plausible evidence can still be temporally invalid. We introduce \\textbf{ChunQiuTR}, a time-keyed retrieval benchmark built from the \\textit{Spring and Autumn Annals} and its exegetical tradition. It organizes records by month-level reign keys and includes chrono-near confounders that mimic real retrieval failures. We propose \\textbf{CTD} (Calendrical Temporal Dual-encoder), a time-aware dual-encoder combining Fourier-based absolute context with relative offset biasing. Experiments show consistent gains over semantic dual-encoder baselines under time-keyed evaluation. We will release ChunQiuTR and code after the anonymity period.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["temporal information retrieval", "historical NLP", "Classical Chinese", "reign-based chronology", "dense retrieval", "dataset"], "openreview_url": "https://openreview.net/forum?id=nYaNHv4kN5", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "tPRRt3xCeg", "title": "Overcoming Copyright Barriers in Corpus Distribution Through Non-Reversible Hashing", "abstract": "While annotated corpora are crucial in the field of natural language processing (NLP), those containing copyrighted material are difficult to exchange among researchers. Yet, such corpora are necessary to fully represent the diversity of data found in the wild in the context of NLP tasks. We tackle this issue by proposing a method to lawfully share the annotations of any sequential copyrighted corpus. The corpus creator shares the annotations in clear, along with a non-reversible hashed version of the source material. The corpus user must own the source material, and apply the same hash function to their own tokens, in order to match them to the shared annotations. Crucially, our method is robust to reasonable divergences in the version of the copyrighted data owned by the user. As an illustration, we present alignment experiments on different editions of novels. Our results show that our method is able to align correctly almost all of the shared corpus. We publicly release novelties-bookshare, a Python implementation of our method.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/novelties-bookshare-2F33"], "keywords": ["corpus distribution", "copyright compliance"], "openreview_url": "https://openreview.net/forum?id=tPRRt3xCeg", "contribution_types": ["Engineering"]}, {"id": "4rnfubjrRg", "title": "MENTOR: Mitigating Identity Drift in Dynamic Role-Playing via Dual-Chain Structured Memory", "abstract": "Long-context LLM agents increasingly serve multiple users or personas within a single session, requiring stable identity and knowledge boundaries under frequent switching.\nWe identify a common failure mode, identity drift, where models conflate user-specific states and leak information across roles.\nOn BEAM-Switch, a benchmark for controlled multi-user switching, performance consistently degrades as switching intensifies, even when responses remain fluent and locally coherent.\nWe propose Mentor, a cognitive architecture that mitigates identity drift without fine-tuning.Mentor uses a Dual-Chain Memory Mechanism: a Global Chain ($\\mathcal{G}$) for long-term event logging and isolated Role Chains ($\\mathcal{R}_r$) as per-role working memories, supported by a semantic Knowledge Graph ($\\mathcal{K}$) that filters and verifies role-admissible information before generation.Across six LLM families, Mentor improves the overall score (Avg) from 0.46 to 0.75 on average (+0.29 absolute), with substantial gains in identity adherence and knowledge fidelity.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM agents", "agent memory", "Multi-user large language models；"], "openreview_url": "https://openreview.net/forum?id=4rnfubjrRg", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency", "Dataset", "Data Analysis", "Theory"]}, {"id": "lgSyDwQfP0", "title": "Optimizing User Profiles via Contextual Bandits for Retrieval-Augmented LLM Personalization", "abstract": "Large Language Models (LLMs) excel at general-purpose tasks, but personalizing their responses to individual users remains challenging. Retrieval augmentation offers a lightweight alternative to fine-tuning by conditioning LLMs on user history records, yet existing strategies rely on heuristics (e.g., relevance to the query) that overlook the true contribution of records to personalization. To address these limitations, we propose PURPLE, a contextual bandit framework that oPtimizes UseR Profiles for Llm pErsonalization. PURPLE operates as a re-ranking layer over candidate records, balancing efficiency with personalization quality. Across nine real-world personalization tasks spanning classification, regression, and short- and long-text generation, PURPLE consistently outperforms strong heuristic and retrieval-augmented baselines, establishing contextual bandit retrieval as a principled and scalable solution for personalized LLMs. Our code is available at: https://anonymous.4open.science/r/ACL-2026-PURPLE-3096/.", "area": "RAG", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/025ACL-2026-PURPLE-3096", "https://anonymous.4open.science/r/ACL-2026-PURPLE-3096"], "keywords": ["LLM Personalization", "Retrieval Augmented Generation", "Reranking"], "openreview_url": "https://openreview.net/forum?id=lgSyDwQfP0", "contribution_types": ["Engineering"]}, {"id": "PSN0nVrSQg", "title": "MM-ShiftKV: Decode-Aware Prefill-Stage KV Selection for Multimodal Large Language Models", "abstract": "Key-Value (KV) caching is essential for efficient inference in multimodal large language models (MLLMs), yet its memory footprint grows linearly with context length and becomes a major bottleneck due to the large number of visual tokens.\nRecent prefill-only KV selection methods estimate KV importance from prefilling statistics, implicitly assuming that prefilling-time queries are representative of those encountered during decoding.\n\nWe show that this assumption breaks down in multimodal inference, where decoding-time queries exhibit substantially larger variance than prefilling-stage representations, leading to unstable KV importance estimation under tight cache budgets.\nAs a result, small ranking errors can disproportionately discard semantically critical visual tokens and degrade grounding and reasoning performance.\nWe propose MM-ShiftKV, a training-free and strictly prefill-only KV selection method that is explicitly decode-aware.\nMM-ShiftKV approximates decoding-time query behavior during prefilling by\nconstructing variance-expanded query proxies and estimates prompt KV\nimportance based on their aggregated attention mass.\nExperiments on multimodal benchmarks demonstrate that MM-ShiftKV consistently outperforms existing KV selection methods under strict KV-cache budgets.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/mm-shiftkv"], "keywords": ["KV cache compression", "inference efficiency", "multimodal large language models"], "openreview_url": "https://openreview.net/forum?id=PSN0nVrSQg", "contribution_types": ["Engineering", "Low-resource", "Efficiency"]}, {"id": "TyVORgiSWX", "title": "KGV-Agent: Schema-Aware Planning  and Hybrid Knowledge Toolset for Reliable Knowledge Graph Triple Verification", "abstract": "Knowledge Graphs (KGs) serve as a critical foundation for AI systems, yet their automated construction inevitably introduces noise, compromising data trustworthiness. Existing triple verification methods, relying on graph embeddings or pre-trained language models, often suffer from single-source bias—ignoring either internal structural constraints or external semantic context—and adhere to a static inference paradigm. Consequently, they struggle to verify complex or long-tail facts and lack interpretability. To address these limitations, we propose KGV-Agent, a training-free autonomous agent that reframes triple verification as a dynamic process of strategic planning, active investigation, and evidential reasoning. Specifically, KGV-Agent mitigates reasoning instability and cold-start issues via a Memory-Augmented Mechanism and Schema-Aware Strategic Planning. It then executes an enhanced ReAct loop equipped with a Hybrid Knowledge Toolset, dynamically fusing internal structural logic with external textual evidence for robust cross-verification. Empirical results across multiple datasets demonstrate that KGV-Agent establishes new state-of-the-art performance, while providing transparent, fact-based evidence chains for every judgment.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Knowledge Graph， Autonomous Agents ，Triple Verification，Fact-checking，Hybrid Knowledge Fusion， Schema-Aware Planning，Explainable AI，Large Language Models"], "openreview_url": "https://openreview.net/forum?id=TyVORgiSWX", "contribution_types": ["Analysis", "Engineering", "Reproduction"]}, {"id": "71aZuEbv0Z", "title": "ReSQL: Self-Improving Framework for Reasoning-Aware Text-to-SQL Dataset Generation", "abstract": "Recent advances in Text-to-SQL have greatly benefited from large language models, yet small and medium-sized models still suffer from frequent execution errors and limited self-correction ability. We present ReSQL (Retrieval-augmented error reasoning for Text-to-SQL), a self-improving framework that generates and learns from its own error-reasoning dataset, enabling models to autonomously refine their SQL generation and correction capabilities. ReSQL combines feedback-driven fine-tuning with retrieval-based inference: it gathers model-generated errors, analyzes them through structured feedback prompts, and retrieves relevant correction examples during inference. This unified approach allows models to internalize robust error-reasoning patterns and dynamically apply them to unseen queries. Experimental results on the SPIDER and BIRD benchmarks show that ReSQL substantially improves execution accuracy and self-correction ability over strong baselines, achieving competitive performance with much larger proprietary models such as GPT-4. Our findings highlight ReSQL as a promising step toward self-improving, reasoning-aware Text-to-SQL systems that can continually enhance their reliability and interpretability without external supervision. All code and generated reasoning datasets are available to facilitate application to open-source LLMs and reproducible baseline training.", "area": "Syntax/Parsing", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ReSQL-6C13"], "keywords": ["Text-to-SQL", "Reasoning", "Self-improving Models", "Synthetic Data Generation", "RAG", "LLM"], "openreview_url": "https://openreview.net/forum?id=71aZuEbv0Z", "contribution_types": ["Efficiency", "Dataset"]}, {"id": "a3HUiYXAs9", "title": "CORD: Bridging the Audio–Text Reasoning Gap via Weighted On-policy Cross-modal Distillation", "abstract": "Large Audio Language Models (LALMs) have garnered significant research interest.\nDespite being built upon text-based large language models (LLMs), LALMs frequently exhibit a degradation in knowledge and reasoning capabilities.\nWe hypothesize that this limitation stems from the failure of current training paradigms to effectively bridge the acoustic-semantic gap within the feature representation space.\nTo address this challenge, we propose CORD, a unified alignment framework that performs online cross-modal self-distillation.\nSpecifically, it aligns audio-conditioned reasoning with its text-conditioned counterpart within a unified model.\nLeveraging the text modality as an internal teacher, CORD performs multi-granularity alignment throughout the audio rollout process.\nAt the token level, it employs on-policy reverse KL divergence with importance-aware weighting to prioritize early and semantically critical tokens.\nAt the sequence level, CORD introduces a judge-based global reward to optimize complete reasoning trajectories via Group Relative Policy Optimization (GRPO).\nEmpirical results across multiple benchmarks demonstrate that CORD consistently enhances audio-conditioned reasoning and substantially bridges the audio–text performance gap with only 80k synthetic training samples, validating the efficacy and data efficiency of our on-policy, multi-level cross-modal alignment approach.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Audio Language Models", "Audio Understanding", "On Policy Distillation", "Cross-modal Alignment"], "openreview_url": "https://openreview.net/forum?id=a3HUiYXAs9", "contribution_types": ["Analysis", "Engineering"]}, {"id": "OMph7WPy4N", "title": "DiVE: Decoupling Intra-layer Visual Evidence for Mitigating Hallucinations in Large Vision-Language Models", "abstract": "Recent Large Vision-Language Models (LVLMs) have achieved significant progress yet frequently suffer from visual hallucinations, often stemming from an over-reliance on language priors rather than visual evidence. Existing decoding-based approaches often rely on input perturbations to weaken language priors, but they do not explicitly decouple visual evidence from mixed vision–language representations. To address these limitations, we propose \\textbf{DiVE} (\\textbf{D}ecoupling \\textbf{i}ntra-layer \\textbf{V}isual \\textbf{E}vidence). DiVE dynamically identifies layers enriched with visual information and performs intra-layer decoupling to extract aggregated visual evidence. By suppressing this evidence to construct a language-prior-dominated reference distribution, DiVE employs contrastive decoding to calibrate the output logits, thereby mitigating hallucinations. Extensive experiments across diverse LVLM architectures demonstrate that DiVE achieves state-of-the-art performance among decoding-based methods on multiple benchmarks. Crucially, it eliminates the latency of an extra forward pass, offering a lightweight and efficient solution.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal large language models", "Multimodal Reasoning", "Visual hallucinations mitigating"], "openreview_url": "https://openreview.net/forum?id=OMph7WPy4N", "contribution_types": ["Analysis", "Engineering", "Low-resource"]}, {"id": "7baRTuksAS", "title": "GRASP: Graph-Reasoning Aided Survey Planning for High-Fidelity Related Work Generation", "abstract": "Writing a literature review requires a deep understanding of the relationships among cited papers: how they build on, challenge, or offer alternative perspectives to one another. We present Graph-Reasoning Aided Survey Planning (GRASP), a framework combining LLM planning for related work generation with graph algorithms to extract key relationships among cited papers. Our two-layer graph structure consists of a Graph of Thoughts and an Argument-Counteragument Planning Network, representing the cited papers at different levels of granularity, and we apply topology-aware pruning via a Steiner tree to identify the core inter-paper relationships captured in our graph. Our citation analysis-based evaluation shows that GRASP generates RWS that closely match human-written targets in terms of the discourse roles, intents, and grouping of citations.", "area": "Summarization", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM", "Summarization", "Planning", "Graph algorithm"], "openreview_url": "https://openreview.net/forum?id=7baRTuksAS", "contribution_types": ["Engineering"]}, {"id": "wuwzqTflvH", "title": "MotifAgent: Learning Molecular Assembly through Multi-Agent Collaboration for Chemical Language Understanding", "abstract": "Large Language Models (LLMs) have shown great potential in molecular understanding by aligning molecular representations with text. However, existing approaches remain limited to static motif recognition without comprehending the generative principles—the connection rules governing how motifs assemble into valid topological structures. To address this challenge, we introduce \\textbf{MotifAgent}, a multi-agent reinforcement learning framework inspired by emergent collective intelligence. We formulate molecular assembly as a collaborative problem where each motif is represented by an agent sharing a common LLM backbone, learning connection rules through explicit inter-motif negotiation rather than implicit sequence memorization. Key innovations include: (1) dynamic inter-agent negotiation for modeling motif connections; (2) Set-based Behavioral Cloning for learning multiple topologically equivalent assembly paths; (3) topology-aware reward shaping with MAPPO to maintain chemical validity while optimizing target properties. Extensive experiments demonstrate that MotifAgent achieves state-of-the-art performance across molecular property prediction, description generation, and reaction prediction tasks, with our generalist model surpassing specialized expert models.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multi-Agent Collaboration", "Molecular Assembly", "Chemical Reasoning", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=wuwzqTflvH", "contribution_types": ["Analysis", "Engineering"]}, {"id": "fqd6jEqtdY", "title": "Robust CAPTCHA Using Audio Illusions in the Era of Large Language Models: from Evaluation to Advances", "abstract": "CAPTCHAs are widely used by websites to block bots and spam by presenting challenges that are easy for humans but difficult for automated programs to solve. To improve accessibility, audio CAPTCHAs are designed to complement visual ones. However, the robustness of audio CAPTCHAs against advanced Large Audio Language Models (LALMs) and Automatic Speech Recognition (ASR) models remains unclear.\n\nIn this paper, we introduce AI-CAPTCHA, a unified framework that offers (i) an evaluation framework, ACEval, which includes advanced LALM- and ASR-based solvers, and (ii) a novel audio CAPTCHA approach, IllusionAudio, leveraging audio illusions. Through extensive evaluations of seven widely deployed audio CAPTCHAs, we show that most existing methods can be solved with high success rates by advanced LALMs and ASR models, exposing critical security weaknesses.\n\nTo address these vulnerabilities, we design a new audio CAPTCHA approach, IllusionAudio, which exploits perceptual illusion cues rooted in human auditory mechanisms. Extensive experiments demonstrate that our method defeats all tested LALM- and ASR-based attacks while achieving a 100% human pass rate, significantly outperforming existing audio CAPTCHA methods.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Audio CAPTCHAs", "Audio Illusion", "Large Audio Language Model"], "openreview_url": "https://openreview.net/forum?id=fqd6jEqtdY", "contribution_types": []}, {"id": "5iNTpm4bSJ", "title": "Optimizing the Effectiveness-Efficiency-Interpretability Trade-off in Text Classification via Hard Instance Paraphrasing", "abstract": "Large Language Models (LLMs) achieve strong text classification performance but incur high training and inference costs. Small Language Models (SLMs) are more efficient yet struggle with ambiguous or low-confidence (\"hard'') instances. We propose RAP -- Rewrite-Assess-Predict for Hard Instances, a multi-stage framework that combines SLM efficiency with zero-shot LLM adaptability. RAP first detects hard instances using calibrated confidence, then applies prompt-optimized LLM paraphrasing to make class-relevant cues more explicit, with the resulting paraphrases replacing the original texts for subsequent classification. The paraphrased texts are reassessed, and predictions are chosen using calibrated confidence, ensuring performance does not degrade when rewriting is unhelpful. Experiments across multiple datasets show that paraphrases preserve semantic content, mitigate label shifts, and substantially improve SLM effectiveness on hard cases. Qualitative analysis further reveals systematic textual modifications that enhance class salience and interpretability. Overall, RAP provides a more accurate, reliable, interpretable, scalable, and cost-effective alternative to end-to-end LLM classification.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["text classification", "large language model", "paraphrasing", "rewrite", "Effectiveness", "Efficiency"], "openreview_url": "https://openreview.net/forum?id=5iNTpm4bSJ", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency", "Data Analysis"]}, {"id": "hlkBwfs11T", "title": "Text-to-Distribution Prediction with Quantile Tokens and Neighbor Context", "abstract": "Many applications of LLM-based text regression require predicting a full conditional distribution rather than a single point value. We study \\emph{distributional regression} under empirical-quantile supervision, where each input is paired with multiple observed quantile outcomes, and the target distribution is represented by a dense grid of quantiles. We address two key limitations of current approaches: the lack of local grounding for distribution estimates, and the reliance on shared representations that create an indirect bottleneck between inputs and quantile outputs. In this paper, we introduce \\emph{Quantile Token Regression}, which, to our knowledge, is the first work to insert dedicated quantile tokens into the input sequence, enabling direct input-output pathways for each quantile through self-attention. We further augment these quantile tokens with retrieval, incorporating semantically similar \\emph{neighbor} instances and their empirical distributions to ground predictions with local evidence from similar instances. We also provide the first theoretical analysis of loss functions for quantile regression, clarifying which distributional objectives each optimizes. Experiments on the Inside Airbnb and StackSample benchmark datasets with LLMs ranging from 1.7B to 14B parameters show that quantile tokens with neighbors consistently outperform baselines ($\\sim$4 points lower MAPE and 2$\\times$ narrower prediction), with especially large gains on smaller and more challenging datasets where quantile tokens produce substantially sharper and more accurate distributions.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Quantile Regression", "Text Regression", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=hlkBwfs11T", "contribution_types": ["Analysis", "Engineering", "Theory"]}, {"id": "LcVjnij6BA", "title": "LLM-Based Multi-Task Bangla Hate Speech Detection: Type, Severity, and Target", "abstract": "Online social media platforms have become central to communication and information exchange, however, they also serve as fertile ground for hate speech, offensive language, and bullying targeting individuals and communities. Such content undermines online safety and inclusion, underscoring the need for reliable detection systems—especially in low-resource languages with limited moderation tools. For Bangla, existing work provides valuable resources and models, however, they are mostly single-task (e.g., binary hate/offense) with narrow coverage of key dimensions such as type, severity, and target. We address these gaps by introducing \\textit{the first multi-task} Bangla hate-speech dataset, BanglaMultiHate, one of the largest manually annotated dataset to date. Using this resource, we performed a comparative study across different baselines, monolingual pretrained models, and LLMs under zero-shot and LoRA fine-tuning settings. Our findings show that while LoRA-tuned LLMs rival BanglaBERT, culturally grounded pretraining remains crucial for robust performance. Overall, BanglaMultiHate establishes a stronger benchmark for hate speech detection in low-resource contexts. All data and scripts will be released for reproducibility.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Bangla Hate speech detection", "datasets for low resource languages", "benchmarking", "hate speech detection", "model evaluation"], "openreview_url": "https://openreview.net/forum?id=LcVjnij6BA", "contribution_types": ["Analysis", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "KNdW3B3cqI", "title": "Adapting Web Agents with Synthetic Supervision", "abstract": "Web agents struggle to adapt to new websites due to the scarcity of environment specific tasks and demonstrations. Recent works have explored synthetic data generation to address this challenge, however, they suffer from data quality issues where synthesized tasks contain hallucinations that cannot be executed, and collected trajectories are noisy with redundant or misaligned actions. In this paper, we propose SynthAgent, a fully synthetic supervision framework that aims at improving synthetic data quality via dual refinement of both tasks and trajectories. Our approach begins by synthesizing diverse tasks through categorized exploration of web elements, ensuring efficient coverage of the target environment. During trajectory collection, tasks are refined only when conflicts with observations are detected, which mitigates hallucinations while preserving task consistency. After collection, we conduct trajectory refinement with global context to mitigate potential noise or misalignments. Finally, we fine-tune open-source web agents on the refined synthetic data to adapt them to the target environment. Experimental results demonstrate that SynthAgent outperforms existing synthetic data methods, validating the importance of high-quality synthetic supervision.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Synthetic Data", "Agent", "LLM", "Multimodal"], "openreview_url": "https://openreview.net/forum?id=KNdW3B3cqI", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "1vYoKS5LSn", "title": "Is Your LLM a Good Game Master? A Game-Based Framework for Evaluating LLM Creativity and Reasoning", "abstract": "In this paper, we introduce a novel evaluation framework for assessing Large Language Model (LLM) capabilities through the Game Master paradigm -- where the LLM generates and orchestrates complex multi-agent games for AI players with distinct personalities. The framework comprises (a) a comprehensive game generation and evaluation system spanning 18 game types across 6 categories (strategy, negotiation, cooperative, competition, auction/resource, and narrative), and (b) a personality-based player model utilizing the Big Five (OCEAN) framework with critical evaluator archetypes designed to prevent lenient assessment bias. To our knowledge, this is the first attempt to systematically evaluate LLM's emergent capabilities -- creativity, logical reasoning, fairness, and narrative coherence -- through fully automatic game-based assessment. Experiments with GPT-4.1 demonstrate only 13.0% overall approval in 162 games, with cooperative games achieving 44.1% approval while strategy games fall to 2.2 % -- a 20 times performance gap. These results indicate that GPT-4.1 struggles with balanced competitive game design while excelling at cooperative narratives.", "area": "Resources and Evaluation", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Agents", "Large language models", "Game theory"], "openreview_url": "https://openreview.net/forum?id=1vYoKS5LS
