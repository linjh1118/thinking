 more informative and discriminative paper pairs from a collection. We then enhance relative quality judgment through supervised fine-tuning and reinforcement learning with comparison-based rewards. At inference, the model performs pairwise comparisons over sampled paper pairs and aggregates these preference signals into a global relative quality ranking. Experimental results demonstrate that our framework achieves an average relative improvement of 21.8\\% over the strong baseline DeepReview-14B, while exhibiting robust generalization to five previously unseen datasets. The code is available at anonymous github (https://anonymous.4open.science/r/anonymous-comparison_native_paper_evaluation).", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/anonymous-comparison_native_paper_evaluation"], "keywords": ["Paper Evaluation", "Large Language Models", "Collaborative Ranking", "Pairwise Comparison", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=OTxIflA32D", "contribution_types": ["Engineering"]}, {"id": "t6gnlciXzA", "title": "Rectifying Coordinate Drift in MLLMs via Counterfactual Positional Guidance", "abstract": "While Multimodal Large Language Models (MLLMs) excel at general vision-language tasks, precise coordinate prediction remains a significant challenge, particularly as high-resolution inputs cause visual positional encodings (VPEs) to degrade. \nWe demonstrate that these encoding failures do not result in random noise but instead trigger predictable, directional biases, suggesting that models default to internal spatial priors when grounding signals are weak. To counteract this, we introduce Vision-PE Shuffle Guidance (VPSG), a training-free, inference-time correction method. VPSG isolates position-unconditioned tendencies by shuffling VPEs and utilizes this negative evidence to steer digit decoding through a lightweight finite-state machine. Evaluation on the ScreenSpot-Pro benchmark confirms that VPSG effectively rectifies coordinate drift, yielding consistent improvements in localization accuracy across various model scales without any retraining.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["coordinates prediction; multimodal applications;"], "openreview_url": "https://openreview.net/forum?id=t6gnlciXzA", "contribution_types": ["Analysis", "Engineering"]}, {"id": "jQVFReieJt", "title": "User-Oriented Multi-Turn Dialogue Generation with Tool Use at scale", "abstract": "The recent paradigm shift toward large reasoning models (LRMs) as autonomous agents has intensified the demand for sophisticated, multi-turn tool-use capabilities. Yet, existing datasets and data-generation approaches are limited by static, predefined toolsets that cannot scale to the complexity of open-ended human-agent collaboration. To address this, we initially developed a framework for automated task-oriented multi-turn dialogue generation at scale, utilizing an LRM-based simulator to dynamically generate high-value, domain-specific tools to solve specified tasks. However, we observe that a purely task-oriented design often results in \"solely task-solving\" trajectories, where the agent completes the objective with minimal interaction, failing to generate the high turn-count conversations seen in realistic scenarios. To bridge this gap, we shift toward a user-oriented simulation paradigm. By decoupling task generation from a dedicated user simulator that mimics human behavioral rules—such as incremental request-making and turn-by-turn feedback—we facilitate more authentic, extended multi-turn dialogues that reflect the iterative nature of real-world problem solving. Our generation pipeline operates as a versatile, plug-and-play module capable of initiating generation from any state, ensuring high scalability in producing extended tool-use data. Furthermore, by facilitating multiple task completions within a single trajectory, it yields a high-density dataset that reflects the multifaceted demands of real-world human-agent interaction.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM", "Agent", "Data pipeline", "Tool-calls"], "openreview_url": "https://openreview.net/forum?id=jQVFReieJt", "contribution_types": []}, {"id": "WKmd1QHkig", "title": "Beyond Compromise: Pareto-Lenient Consensus for Efficient Multi-Preference LLM Alignment", "abstract": "Transcending the single-preference paradigm, aligning LLMs with diverse human values is pivotal for robust deployment. Contemporary Multi-Objective Preference Alignment (MPA) approaches predominantly rely on static linear scalarization or rigid gradient projection to navigate these trade-offs. However, by enforcing strict conflict avoidance or simultaneous descent, these paradigms often prematurely converge to local stationary points. While mathematically stable, these points represent a conservative compromise where the model sacrifices potential global Pareto improvements to avoid transient local trade-offs. To break this deadlock, we propose Pareto-Lenient Consensus (PLC), a game-theoretic framework that reimagines alignment as a dynamic negotiation process. Unlike rigid approaches, PLC introduces consensus-driven lenient gradient rectification, which dynamically tolerates local degradation provided there is a sufficient dominant coalition surplus, thereby empowering the optimization trajectory to escape local suboptimal equilibrium and explore the distal Pareto-optimal frontier. Theoretical analysis validates PLC can facilitate stalemate escape and asymptotically converge to a Pareto consensus equilibrium.  Moreover, extensive experiments show that PLC surpasses baselines in both fixed-preference alignment and global Pareto frontier quality. This work highlights the potential of negotiation-driven alignment as a promising avenue for MPA. Our codes are available at \\url{https://anonymous.4open.science/r/aaa-6BB8}.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/aaa-6BB8"], "keywords": ["Multi Preference LLM Alignment", "RLHF", "Pareto Optimization", "Game Theory"], "openreview_url": "https://openreview.net/forum?id=WKmd1QHkig", "contribution_types": ["Engineering", "Theory"]}, {"id": "z7PcXS0iOi", "title": "Modeling and Benchmarking Spoken Dialogue Rewards with Modality and Colloquialness", "abstract": "The rapid evolution of end-to-end spoken dialogue systems demands transcending mere textual semantics to incorporate paralinguistic nuances and the spontaneous nature of human conversation. However, current methods struggle with two critical gaps: the modality gap, involving prosody and emotion, and the colloquialness gap, distinguishing written scripts from natural speech. To address these challenges, we introduce SDiaReward, an end-to-end multi-turn reward model trained on SDiaReward-Dataset, a novel collection of episode-level preference pairs explicitly targeting these gaps. It operates directly on full multi-turn speech episodes and is optimized with pairwise preference supervision, enabling joint assessment of modality and colloquialness in a single evaluator. We further establish ESDR-Bench, a stratified benchmark for robust episode-level evaluation. Experiments demonstrate that SDiaReward achieves state-of-the-art pairwise preference accuracy, significantly outperforming general-purpose audio LLMs. Further analysis suggests that SDiaReward captures relative conversational expressiveness beyond superficial synthesis cues, improving generalization across domains and recording conditions.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Spoken Dialogue", "Reward Model", "Speech Generation", "Evaluation Benchmark"], "openreview_url": "https://openreview.net/forum?id=z7PcXS0iOi", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "KKA2yZSSYK", "title": "HxAgent: Iterative Agent Planning for End-to-End Web Application Testing", "abstract": "In automated web testing, generating test cases and performing testing using functionality descriptions in natural-language is crucial for improving efficacy. These tasks require such a testing agent to carry out tasks on the target application and generating tests autonomously. We introduce HXAgent, an iterative LLM-based planning agent with a proactive correction strategy. After each step, HXAgent reassesses the web state to determine the next action using (1) current observations, (2) short-term memory of past actions, and (3) long-term experience extracted from past (in)correct sequences of actions. HXAgent achieves 97.4% Exact-Match accuracy on MiniWoB++, comparable to the best baselines without human demonstrations. On a dataset of 350 web tasks, it attains 83.8% Exact-Match and 91.8% Prefix-Match, surpassing baselines by 11.4%. On OnlineMind2Web, it further improves by 19.3%, demonstrating robust generalization.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/hxagent.778ShengJia"], "keywords": ["Web UI Testing", "Test Script Generation", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=KKA2yZSSYK", "contribution_types": ["Engineering"]}, {"id": "zSz4CedtDZ", "title": "CURE-Med: Curriculum-Informed Reinforcement Learning for Multilingual Medical Reasoning", "abstract": "While large language models (LLMs) have shown to perform well on monolingual mathematical and commonsense reasoning, they remain unreliable for multilingual medical reasoning applications, hindering their deployment in multilingual healthcare settings.\nWe address this by first introducing CURE-Med-Bench, a high-quality multilingual medical reasoning dataset with open-ended reasoning queries with a single verifiable answer, spanning thirteen languages, including underrepresented languages such as Amharic, Yoruba, and Swahili.\nBuilding on this dataset, we propose CURE-Med, a curriculum-informed reinforcement learning framework that integrates code-switching-aware supervised fine-tuning and Group Relative Policy Optimization to jointly improve logical correctness and language stability. Across thirteen languages, our approach consistently outperforms strong baselines and scales effectively, achieving 85.21\\% language consistency and 54.35\\% logical correctness at 7B parameters, and 94.96\\% language consistency and 70.04\\% logical correctness at 32B parameters. These results support reliable and equitable multilingual medical reasoning in LLMs.\nThe code and dataset will be made publicly available upon acceptance.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multilingual AI", "Medical Reasoning", "Reinforcement Learning", "Curriculum Learning", "Multilingual NLP", "Low-Resource Languages"], "openreview_url": "https://openreview.net/forum?id=zSz4CedtDZ", "contribution_types": ["Engineering", "Low-resource", "Dataset"]}, {"id": "oN56dSn3xH", "title": "Zipage: Maintain High Request Concurrency for LLM Reasoning through Compressed PagedAttention", "abstract": "With reasoning becoming the generative paradigm for large language models,  the memory bottleneck caused by KV cache during the inference phase has become a critical factor limiting high-concurrency service capabilities. Although existing KV cache eviction methods address the memory issue, most of them are impractical for industrial-grade applications. This paper introduces Compressed PagedAttention, a method that combines token-wise KV cache eviction with PagedAttention. We propose a comprehensive scheduling strategy and support prefix caching and asynchronous compression for Compressed PagedAttention. Based on this, we have developed a high-concurrency inference engine, Zipage. On large-scale mathematical reasoning tasks, Zipage achieves around 95\\% of the performance of Full KV inference engines while delivering over 2.1$\\times$ speedup.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Server Engine", "KV Cache Eviction", "LLM Efficiency"], "openreview_url": "https://openreview.net/forum?id=oN56dSn3xH", "contribution_types": ["Low-resource", "Efficiency"]}, {"id": "GskCydxjre", "title": "GraphDancer: Training LLMs to Explore and Reason over Graphs via Curriculum Reinforcement Learning", "abstract": "Large language models (LLMs) increasingly rely on external knowledge to improve factuality, yet many real-world knowledge sources are organized as heterogeneous graphs rather than plain text. \nReasoning over such graph-structured knowledge poses two key challenges:\n(1) navigating structured, schema-defined relations requires precise function calls rather than similarity-based retrieval, and (2) answering complex questions often demands multi-hop evidence aggregation through iterative information seeking.\nWe propose GraphDancer, a reinforcement learning (RL) framework that teaches LLMs to navigate graphs by interleaving reasoning and function execution.\nTo make RL effective for moderate-sized LLMs, we introduce a graph-aware curriculum that schedules training by the structural complexity of information-seeking trajectories using an easy-to-hard biased sampler.\nWe evaluate GraphDancer on a multi-domain benchmark by training on one domain only and testing on unseen domains and out-of-distribution question types. Despite using only a 3B backbone, GraphDancer outperforms baselines equipped with either a 14B backbone or \\texttt{GPT-4o-mini}, demonstrating robust cross-domain generalization of graph exploration and reasoning skills. Our code is available at \\url{https://anonymous.4open.science/r/GraphDancer}.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/GraphDancer"], "keywords": ["LLM agents", "reinforcement learning", "curriculum learning", "graph-augmented reasoning", "tool use"], "openreview_url": "https://openreview.net/forum?id=GskCydxjre", "contribution_types": ["Engineering"]}, {"id": "aHfMXf0F6l", "title": "Simple Context Compression: Mean-Pooling and Multi-Ratio Training", "abstract": "A common strategy to reduce the computational costs of using long contexts in retrieval-augmented generation (RAG) with large language models (LLMs) is soft context compression, where the input sequence is transformed into a shorter continuous representation. We develop a lightweight and simple mean-pooling approach that consistently outperforms the widely used compression-tokens architecture, and study training the same compressor to output multiple compression ratios. We conduct extensive experiments across in-domain and out-of-domain QA datasets, as well as across model families, scales, and compression ratios. Overall, our simple mean-pooling approach achieves the strongest performance, with a relatively small drop when training for multiple compression ratios. More broadly though, across architectures and training regimes the trade-offs are more nuanced, illustrating the complex landscape of compression methods.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["large language models", "context compression", "compression"], "openreview_url": "https://openreview.net/forum?id=aHfMXf0F6l", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "c8KqPgbJBc", "title": "Reasoning Up the Instruction Ladder for Controllable Language Models", "abstract": "As large language model (LLM) based systems take on high-stakes roles in real-world decision-making, they must reconcile competing instructions from multiple sources within a single prompt context. Enforcing an instruction hierarchy, where higher-level directives override lower-priority requests, is critical to the reliability and controllability of LLMs. In this work, we reframe instruction hierarchy resolution as a reasoning task. The model must first \"think\" about the relationship between a given user prompt and higher-priority instructions before generating a response. To enable this capability, we construct VerIH, a training dataset of constraint-following tasks with verifiable answers, comprising aligned and conflicting system--user instructions. We show that lightweight reinforcement learning with VerIH effectively transfers general reasoning capabilities of models to instruction prioritization. Our method leads to consistent improvements across multiple model families and scales on instruction following and instruction hierarchy benchmarks, achieving $\\sim$20\\% absolute improvement in conflict setups. Our method also generalizes to safety-critical scenarios beyond the training distribution, exhibiting increased robustness against jailbreak and prompt injection, reducing absolute attack success rates by up to 20\\%. Our results establish reasoning over instruction hierarchies as a practical mechanism for improving AI reliability, where targeted updates to system prompts produce predictable, controllable, and robust changes in model behavior.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["instruction hierarchy", "reasoning", "RLVR", "safety"], "openreview_url": "https://openreview.net/forum?id=c8KqPgbJBc", "contribution_types": ["Engineering", "Dataset"]}, {"id": "2hfzJ09ONf", "title": "MARCH: Evaluating the Intersection of Ambiguity Interpretation and Multi-hop Inference", "abstract": "Real-world multi-hop QA is naturally linked with ambiguity, where a single query can trigger multiple reasoning paths that require independent resolution. Since ambiguity can occur at any stage, models must navigate layered uncertainty throughout the entire reasoning chain. Despite its prevalence in real-world user queries, previous benchmarks have primarily focused on single-hop ambiguity, leaving the complex interaction between multi-step inference and layered ambiguity underexplored. In this paper, we introduce MARCH, a benchmark for their intersection, with 2,209 multi-hop ambiguous questions curated via multi-LLM verification and validated by human annotation with strong agreement. Our experiments reveal that even state-of-the-art models struggle with MARCH, confirming that combining ambiguity resolution with multi-step reasoning is a significant challenge. To address this, we propose CLARION, a two-stage agentic framework that explicitly decouples ambiguity planning from evidence-driven reasoning, significantly outperforms existing approaches, and paves the way for robust reasoning systems.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Ambiguity", "Agent", "Dataset", "Multi-hop"], "openreview_url": "https://openreview.net/forum?id=2hfzJ09ONf", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "ljunj7MUh1", "title": "LogicSkills: A Structured Benchmark for Formal Reasoning in Large Language Models", "abstract": "Large language models have demonstrated notable performance across various logical reasoning benchmarks. However, it remains unclear which core logical skills they truly master. To address this, we introduce LogicSkills, a unified benchmark designed to isolate three fundamental skills in formal reasoning: (i) formal symbolization—translating premises into first-order logic; (ii) countermodel construction—formulating a finite structure in which all premises are true while the conclusion is false; and (iii) validity assessment—deciding whether a conclusion follows from a given set of premises. Items are drawn from the two-variable fragment of first-order logic (without identity) and are presented in both natural English and a Carroll-style language with nonce words. All examples are verified for correctness and non-triviality using the SMT solver Z3. Across leading models, performance is high on validity but substantially lower on symbolization and countermodel construction, suggesting reliance on surface-level patterns rather than genuine symbolic or rule-based reasoning.", "area": "Math/Reasoning", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["reasoning", "logic", "deductive reasoning", "AI reasoning benchmarks", "symbolization", "countermodel construction"], "openreview_url": "https://openreview.net/forum?id=ljunj7MUh1", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "NtthohE0kc", "title": "DIP:  Dynamic In-Context Planner For Diffusion Language Models", "abstract": "Diffusion language models (DLMs) have shown strong potential for general natural language tasks with in-context examples. \nHowever, due to the bidirectional attention mechanism, DLMs incur substantial computational cost as context length increases. This work addresses this issue with a key discovery: unlike the sequential generation in autoregressive language models (ARLMs), the diffusion generation paradigm in DLMs allows $\\textit{efficient dynamic adjustment of the context}$ during generation. \nBuilding on this insight, we propose $\\textbf{D}$ynamic $\\textbf{I}$n-Context $\\textbf{P}$lanner (DIP), a context-optimization method that dynamically selects and inserts in-context examples during generation, rather than providing all examples in the prompt upfront. \nResults show DIP maintains generation quality while achieving up to 12.9$\\times$ inference speedup over standard inference and 1.17$\\times$ over KV cache-enhanced inference.", "area": "Language Models", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Diffusion Language Models", "Efficient Inference", "In-Context Learning"], "openreview_url": "https://openreview.net/forum?id=NtthohE0kc", "contribution_types": ["Analysis", "Reproduction", "Efficiency"]}, {"id": "J98NPAidsD", "title": "ConlangCrafter: Constructing Languages with a Multi-Hop LLM Pipeline", "abstract": "Constructed languages (conlangs) such as Esperanto and Quenya have played diverse roles in art, philosophy, and international communication. Meanwhile, foundation models have revolutionized creative generation in text, images, and beyond. In this work, we leverage modern LLMs as computational creativity aids for end-to-end conlang creation. We introduce ConlangCrafter, a multi-hop pipeline that decomposes language design into modular stages -- phonology, morphology, syntax, lexicon generation, and translation. At each stage, our method leverages LLMs' metalinguistic reasoning capabilities, injecting randomness to encourage diversity and leveraging self-refinement feedback to encourage consistency in the emerging language description. We construct a novel, scalable evaluation framework for this task, evaluating metrics measuring consistency and typological diversity. Automatic and manual evaluations demonstrate ConlangCrafter's ability to produce coherent and varied conlangs without human linguistic expertise. We will release our code and data.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["interactive and collaborative generation", "inference methods", "conlangs", "creativity", "NLP", "LLMs"], "openreview_url": "https://openreview.net/forum?id=J98NPAidsD", "contribution_types": ["Engineering"]}, {"id": "UmTRmA1ZAE", "title": "DocPO: Advancing Document Policy Optimization via Tailored Step-Aware Rewards", "abstract": "Despite its success in Large Language Models, Reinforcement Learning (RL) remains underutilized in document because generic rewards fail to effectively evaluate various document elements such as formulas and tables. Existing metrics (e.g., Edit Distance) often miss the semantic validity of structures like LaTeX formulas or nested tables, while training dedicated Reward Models requires expensive human annotation. To bridge this gap, we introduce $\\textbf{DocPO}$, a novel policy optimization framework featuring $\\textbf{Tailored Step-Aware Rewards}$. Unlike generic approaches, DocPO constructs domain-specific reward functions without preference data: it integrates LLM-based semantic verification with syntactic constraints for formulas, utilizes structure-weighted TEDS for tables, and employs continuous distance metrics for text to mitigate sparsity. Additionally, we propose Step-Aware Annealing to dynamically modulate reward discriminability for distinguishing hard samples. Experiments show DocPO boosts parsing precision across elements, establishing a scalable, annotation-free paradigm for document understanding.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Document Parsing", "Reinforcement Learning", "Reward Engineering", "Multimodal"], "openreview_url": "https://openreview.net/forum?id=UmTRmA1ZAE", "contribution_types": ["Analysis", "Engineering"]}, {"id": "HCU6ovxi2c", "title": "SOP-Maze: Evaluating Large Language Models on Complicated Business Standard Operating Procedures", "abstract": "As large language models (LLMs) are widely deployed as domain-specific agents, many benchmarks have been proposed to evaluate their ability to follow instructions and make decisions in real-world scenarios.\nHowever, business scenarios often involve complex standard operating procedures (SOPs), and the evaluation of LLM capabilities in such contexts has not been fully explored. To bridge this gap, we propose SOP-Maze, a benchmark constructed from real-world business data and adapted into a collection of 397 instances and 3422 subtasks from 23 complex SOP scenarios. We further categorize SOP tasks into two broad classes: Lateral Root System (LRS), representing wide-option tasks that demand precise selection; and Heart Root System (HRS), which emphasizes deep logical reasoning with complex branches. Extensive experiments reveal that nearly all state-of-the-art models struggle with SOP-Maze. We conduct a comprehensive analysis and identify three key error categories: (i) route blindness: difficulty following procedures; (ii) conversational fragility: inability to handle real dialogue nuances; and (iii) calculation errors: mistakes in time or arithmetic reasoning under complex contexts. The systematic study explores LLM performance across SOP tasks that challenge both breadth and depth, offering new insights for improving model capabilities. We have open-sourced our work on the anonymous link: https://anonymous.4open.science/r/SOP-Maze.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SOP-Maze"], "keywords": ["Large Language Models", "Instruction Following", "Standard Operating Procedures (SOPs)", "Benchmarking", "Business AI", "Logical Reasoning"], "openreview_url": "https://openreview.net/forum?id=HCU6ovxi2c", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "l5l5dnbkWq", "title": "JADES: A Universal Framework for Jailbreak Assessment via Decompositional Scoring", "abstract": "Accurately assessing jailbreak success remains unsolved, as existing protocols rely on misaligned proxy indicators or naive holistic evaluation strategies that often diverge from human perception. \nWe propose JADES, a universal evaluation framework that decomposes a harmful query into weighted sub-questions, scores each sub-answer, and aggregates the scores into a final decision; an optional fact-checking module further mitigates hallucination-induced misjudgments.\nTo validate JADES, we introduce \\texttt{JailbreakQR}, a meticulously annotated benchmark of 400 prompt–response pairs. \nIn binary settings (success/failure), JADES achieves $98.5%$ human agreement, outperforming strong baselines by over $9%$. \nRe-evaluating five widely used attacks across four LLMs reveals systematic overestimation.\nJADES also enables granular ternary evaluation (failure/partial success/success), uncovers that partial successes dominate current reported successes, challenging the perceived severity of existing attacks. \nOverall, JADES provides an accurate, consistent, and interpretable foundation for future LLM safety and jailbreak research.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large language models", "Jailbreak attacks", "Evaluation methodology", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=l5l5dnbkWq", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "2VfjQcpToG", "title": "LoRA on the Go: Instance-level Dynamic LoRA Selection and Merging", "abstract": "Low-Rank Adaptation (LoRA) has emerged as a parameter-efficient approach for fine-tuning large language models.\nHowever, conventional LoRA adapters are typically trained for a single task, limiting their applicability in real-world settings, where inputs may span multiple, diverse task domains. At inference time, existing methods can combine multiple LoRAs to improve cross-task performance, but they require additional labeled data or task-specific training, which is expensive at scale. \n\nIn this work, we introduce LoRA on the Go (LoGo), a training-free framework that dynamically selects and merges adapters at the instance level without any additional requirements. LoGo leverages signals extracted from a single forward pass through LoRA adapters, to identify the most relevant adapters and determine their contributions on-the-fly. Across 5 NLP benchmarks, 27 datasets, and 3 model families, LoGo  outperforms training-based baselines on some tasks upto a margin of 3.6% while remaining competitive on other tasks and maintaining inference throughput, highlighting its effectiveness and practicality.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Adapter Merging", "Training-free", "Instance-specific"], "openreview_url": "https://openreview.net/forum?id=2VfjQcpToG", "contribution_types": ["Analysis", "Engineering"]}, {"id": "MDkDIJM9aS", "title": "GroupRank: A Groupwise Paradigm for Effective and Efficient Passage Reranking with LLMs", "abstract": "Large Language Models (LLMs) have emerged as powerful tools for passage reranking in information retrieval, leveraging their superior reasoning capabilities to address the limitations of conventional models on complex queries. However, current LLM-based reranking paradigms are fundamentally constrained by an efficiency-accuracy trade-off: (1) pointwise methods are efficient but ignore inter-document comparison, yielding suboptimal accuracy; (2) listwise methods capture global context but suffer from context-window constraints and prohibitive inference latency. \nTo address these issues, we propose GroupRank, a novel paradigm that balances flexibility and context awareness. To unlock the full potential of groupwise reranking, we propose an answer-free data synthesis pipeline that fuses local pointwise signals with global listwise rankings. These samples facilitate supervised fine-tuning and reinforcement learning, with the latter guided by a specialized group-ranking reward comprising ranking-utility and group-alignment. These complementary components synergistically optimize document ordering and score calibration to reflect intrinsic query-document relevance. Experimental results show GroupRank achieves a state-of-the-art 65.2 NDCG@10 on BRIGHT and surpasses baselines by 2.1 points on R2MED, while delivering a 6.4$\\times$ inference speedup.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Passage reranking", "Groupwise paradigm", "Information retrieval"], "openreview_url": "https://openreview.net/forum?id=MDkDIJM9aS", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "kRE6Q2yZjp", "title": "OmniFusion: Simultaneous Multilingual and Multimodal Translations via Modular Fusion", "abstract": "Open-source text-only translation Large Language Models (LLMs) are rapidly improving in multilingual coverage and translation quality, but their unimodal nature limits their use in multimodal translation. In speech translation (ST), they must operate in cascaded pipelines using automatic speech recognition followed by translation introducing additional latency, especially for simultaneous ST (SimulST). In both speech and caption translation, they cannot exploit visual context for disambiguation.\nIn contrast, pretrained multimodal foundation models (MMFMs) offer strong cross-modal perception and reasoning but lack the multilingual depth and translation performance of specialized translation LLMs. This mismatch motivates combining the strengths of both model types.\nWe propose OmniFusion, an end-to-end framework that fuses MMFMs with translation LLMs via a novel multi-layer hidden-state fusion strategy, enabling joint training while remaining data and resource efficient. Built with Omni 2.5–7B as the MMFM and SeedX PPO–7B as the translation LLM, OmniFusion handles speech-to-text, speech-and-image-to-text, and text-and-image-to-text translation within a single architecture. Experiments show that OmniFusion effectively leverages audio and visual cues, reduces SimulST latency by one second compared to cascaded pipelines, and improves overall translation quality.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Speech Translation", "Simultaneous Speech Translation", "Multimodal Translation"], "openreview_url": "https://openreview.net/forum?id=kRE6Q2yZjp", "contribution_types": ["Analysis", "Engineering"]}, {"id": "PdQjdBRA0p", "title": "From Past To Path: Masked History Learning for Next-Item Prediction in Generative Recommendation", "abstract": "Generative recommendation, which directly generates item identifiers, has emerged as a promising paradigm for recommendation systems. However, this left-to-right paradigm inherently biases the model towards local contexts, failing to capture the bidirectional dependencies necessary for understanding complex user intents. To address this limitation, we propose Masked History Learning (MHL), a novel training framework that shifts the objective from simple next-step prediction to deep comprehension of history. MHL augments the standard autoregressive objective with an auxiliary task of reconstructing masked historical items, compelling the model to understand ‘’why'' an item path is formed from the user's past behaviors, rather than just ‘’what'' item comes next.\nWe introduce two key contributions to enhance this framework: (1) an entropy-guided masking policy that intelligently targets the most informative historical items for reconstruction, and (2) a curriculum learning scheduler that progressively transitions from history reconstruction to future prediction.\nExperiments on three public datasets show that our method significantly outperforms state-of-the-art generative models, highlighting that a comprehensive understanding of the past is crucial for accurately predicting a user's future path.  The code will be released. Anonymous code is available at https://anonymous.4open.science/r/MHL_anonymous-57C7", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MHL_anonymous-57C7"], "keywords": ["Generative Recommendation"], "openreview_url": "https://openreview.net/forum?id=PdQjdBRA0p", "contribution_types": ["Engineering"]}, {"id": "CfWaF8cDpO", "title": "MAESTRO: Meta-learning Adaptive Estimation of Scalarization Trade-offs for Reward Optimization", "abstract": "Group-Relative Policy Optimization (GRPO) has emerged as an efficient paradigm for aligning Large Language Models (LLMs), yet its efficacy is primarily confined to domains with verifiable ground truths. Extending GRPO to **open-domain settings** remains a critical challenge, as **unconstrained generation** entails multi-faceted and often conflicting objectives—such as creativity versus factuality—where rigid, static reward scalarization is inherently suboptimal. To address this, we propose **MAESTRO** (**M**eta-learning **A**daptive **E**stimation of **S**calarization **T**rade-offs for **R**eward O**ptimization), which introduces a meta-cognitive orchestration layer that treats reward scalarization as a dynamic latent policy, leveraging the model's terminal hidden states as a semantic bottleneck to perceive task-specific priorities. We formulate this as a contextual bandit problem within a bi-level optimization framework, where a lightweight Conductor network co-evolves with the policy by utilizing group-relative advantages as a meta-reward signal. Across seven benchmarks, MAESTRO consistently outperforms single-reward and static multi-objective baselines, while preserving the efficiency advantages of GRPO, and in some settings even reducing redundant generation.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Reinforcement Learning", "Group-Relative Policy Optimization (GRPO)", "Multi-Objective Optimization", "Meta-learning", "Reward Scalarization"], "openreview_url": "https://openreview.net/forum?id=CfWaF8cDpO", "contribution_types": ["Analysis", "Engineering", "Theory"]}, {"id": "ZmFOnVECBQ", "title": "LADKG: LLM-Augmented Dynamic Knowledge Graph for Fake News Detection", "abstract": "Fake news spreads rapidly on social media and causes serious societal harm. Existing methods rely on propagation structures, temporal signals, or external knowledge, but often model them separately and fail to capture dynamic diffusion, evolving comment-based knowledge, and high-order semantic relationships. We propose llm-augmented dynamic knowledge graph (LADKG), a unified framework for fake news detection. LADKG constructs a dynamic post–entity–concept knowledge graph from posts and user comments using large language models and updates it over time to capture semantic evolution. A multi-hop graph attention mechanism aggregates high-order neighborhood information for deep semantic reasoning. LADKG further introduces a post-enhancement unit to model fine-grained interactions between textual and knowledge representations. Experiments on two datasets show that LADKG consistently outperforms strong baselines, with notable gains in early-stage fake news detection.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information Extraction", "Information Retrieval and Text Mining", "NLP Applications"], "openreview_url": "https://openreview.net/forum?id=ZmFOnVECBQ", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Dataset", "Data Analysis", "Position", "Surveys", "Theory"]}, {"id": "kBQWTuRH3j", "title": "From Decomposition to Validation: A Multi-stage Framework for Temporal Knowledge Graph Question Answering with LLMs", "abstract": "Temporal Knowledge Graph Question Answering (TKGQA) requires reasoning over time-dependent facts. However, existing approaches suffer from two fundamental limitations: (1) general-purpose text retrievers often fail to align the entity, relation, and temporal mentions in the question with TKG facts and (2) large language models (LLMs) remain unreliable in temporal reasoning, frequently exhibiting the hallucination problem. To address these challenges, we propose TempReasoner, a multi-stage framework for TKGQA. TempReasoner decomposes complex temporal questions into structured sub-questions, retrieves temporally relevant facts using a trained TKG-Retriever, filters noisy evidence through LLM-generated alignment signals, and generates answers along with supporting proofs. A dedicated validation module further refines uncertain predictions by issuing verification queries, improving both answer accuracy and reliability. Experiments on two widely used benchmarks, MultiTQ and CronQuestions, show that TempReasoner consistently delivers strong performance. In particular, TempReasoner achieves substantial improvements on multi-hop temporal questions, demonstrating its effectiveness in temporal reasoning and evidence grounding. Additional analysis further confirms the efficiency of its retrieval component and consistent model-agnostic generalization.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Temporal Knowledge Graph Question Ansewring"], "openreview_url": "https://openreview.net/forum?id=kBQWTuRH3j", "contribution_types": ["Engineering"]}, {"id": "87qJOHuOB1", "title": "WebAnchor: Anchoring Agent Planning to Stabilize Long-Horizon Web Reasoning", "abstract": "Large Language Model(LLM)-based agents have shown strong capabilities in web information seeking, with reinforcement learning (RL) becoming a key optimization paradigm. However, planning remains a bottleneck, as existing methods struggle with long-horizon strategies. Our analysis reveals a critical phenomenon—plan anchor—where the first reasoning step disproportionately impacts downstream behavior in long-horizon web reasoning tasks. Current RL algorithms, fail to account for this by uniformly distributing rewards across the trajectory.To address this, we propose Anchor-GRPO, a two-stage RL framework that decouples planning and execution. In Stage 1, the agent optimizes its first-step planning using fine-grained rubrics derived from self-play experiences and human calibration. In Stage 2, execution is aligned with the initial plan through sparse rewards, ensuring stable and efficient tool usage. We evaluate Anchor-GRPO on four benchmarks: BrowseComp, BrowseComp-Zh, GAIA, and XBench-DeepSearch. Across models from 3B to 30B, Anchor-GRPO outperforms baseline GRPO and First-step GRPO, improving task success and tool efficiency. Notably, WebAnchor-30B achieves 46.0% pass@1 on BrowseComp and 76.4% on GAIA. Anchor-GRPO also demonstrates strong scalability, getting higher accuracy as model size and context length increase.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM/AI agents;reinforcement learning in agents;DeepResearch Agent"], "openreview_url": "https://openreview.net/forum?id=87qJOHuOB1", "contribution_types": ["Engineering", "Data Analysis"]}, {"id": "nTEl9XtGEx", "title": "Semantic Directions Emerge from Sparse Token Mixtures", "abstract": "Linear probes reveal that semantic properties are linearly separable in LLM hidden representations, yet where these semantic directions originate and what they are composed of remain underexplored. Inspired by sparse population coding in the brain---where concepts are represented by activating only $\\sim$1\\% of neurons---we propose Token-Mixture Representation, which expresses semantic directions as sparse, non-negative linear combinations of LM head token embeddings. By applying a global Top-$K$ constraint, semantic directions are decomposed into human-readable token lists. Across four LLMs (Llama-3.1-8B, Qwen2.5-7B, GPT-OSS-20B, Phi-4) and four semantic classification tasks, we find that using only $K{=}100$ tokens (0.1\\% of vocabulary) achieves 96\\% of full-vocabulary performance on average. The selected tokens exhibit high interpretability, with knock-out experiments confirming 3--8$\\times$ greater performance contribution compared to random tokens. Furthermore, Token-Mixture directions align significantly with Sparse Autoencoder monosemantic features ($z = 12.32$, $p < 0.001$), confirming capture of genuine semantic structure rather than superficial lexical patterns. Finally, fMRI alignment analysis achieves a meta-correlation of 0.76 with human brain concreteness sensitivity patterns, with strong alignment in known semantic processing regions. These findings demonstrate that LLM semantic directions are represented as sparsely in vocabulary space as concepts are in the brain, opening new possibilities for interpretable representation engineering.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Interpretability", "Semantic Directions", "Sparse Representation", "Token Embeddings", "Linear Probes", "Brain-Inspired AI"], "openreview_url": "https://openreview.net/forum?id=nTEl9XtGEx", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "iVD8yP6DKz", "title": "HopWeaver: Cross-Document Synthesis of High-Quality and Authentic Multi-Hop Questions", "abstract": "Multi-Hop Question Answering (MHQA) is crucial for evaluating the model's capability to integrate information from diverse sources. However, creating extensive and high-quality MHQA datasets is challenging: (i) manual annotation is expensive, and (ii) current synthesis methods often produce simplistic questions or require extensive manual guidance. This paper introduces HopWeaver, the first cross-document framework synthesizing authentic multi-hop questions without human intervention. HopWeaver synthesizes bridge and comparison questions through an innovative pipeline that identifies complementary documents and constructs authentic reasoning paths to ensure true multi-hop reasoning. We further present a comprehensive system for evaluating the synthesized multi-hop questions. Empirical evaluations demonstrate that the synthesized questions achieve comparable or superior quality to human-annotated datasets at a lower cost. Our framework provides a valuable tool for the research community: it can automatically generate challenging benchmarks from any raw corpus, which opens new avenues for both evaluation and targeted training to improve the reasoning capabilities of advanced QA models, especially in domains with scarce resources.", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multi-Hop Question Synthesis", "Cross-Document Reasoning", "Retrieval-Augmented Generation", "Synthetic Data Generation", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=iVD8yP6DKz", "contribution_types": ["Engineering", "Dataset"]}, {"id": "bqEAeidFEV", "title": "HiMed: Incentivizing Hindi Reasoning in Medical LLMs", "abstract": "Medical large language models hold promise for reducing healthcare disparities, yet Hindi remains severely underrepresented. While medical LLMs excel in high-resource languages, their performance degrades sharply in Hindi, particularly on Indian systems of medicine. We argue that robust cross-lingual medical transfer requires Hindi reasoning. To this end, we introduce HiMed, a comprehensive Hindi reasoning medical corpus and benchmark suite covering both Western and Indian medicine. We further propose HiMed-8B, a Hindi medical reasoning LLM based on LLaMA-3.1-8B-Instruct, through the design of decaying scaffolding reward. Extensive experiments have been conducted, demonstrating consistent improvements in Hindi medical reasoning performance and substantial reduction in the English--Hindi accuracy gap. Ablation studies further validate the contribution of each training stage and reward component. All data and code are available at an anonymous GitHub repository: https://anonymous.4open.science/r/anon-repo-54EC/README.md.", "area": "Multilinguality and Language Diversity", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/025anon-repo-54EC", "https://anonymous.4open.science/r/anon-repo-54EC"], "keywords": ["Hindi", "medical LLM", "cross-lingual transfer", "low-resource languages"], "openreview_url": "https://openreview.net/forum?id=bqEAeidFEV", "contribution_types": ["Engineering", "Low-resource", "Dataset"]}, {"id": "S9X4lldF60", "title": "Bridging the Culture Gap: A Framework for LLM-Driven Socio-Cultural Localization of Math Word Problems in Low-Resource Languages", "abstract": "Large language models (LLMs) have demonstrated significant capabilities in solving mathematical problems expressed in natural language. However, multilingual and culturally-grounded mathematical reasoning in low-resource languages lags behind English due to the scarcity of socio-cultural task datasets that reflect accurate native entities such as person names, organization names, and currencies. Existing multilingual benchmarks are predominantly produced via translation and typically retain English-centric entities, owing to the high cost associated with human annotater-based localization. Moreover, automated localization tools are limited, and hence, truly localized datasets remain scarce. In this work, we study the cultural robustness of large language models by examining the impact of culturally specific entities and the biases introduced by English-centric benchmarks. To bridge this gap, we introduce a framework for LLM-driven cultural localization of math word problems that automatically constructs datasets with native names, organizations, and currencies from existing sources. We find that translated benchmarks can obscure true multilingual math ability under appropriate socio-cultural contexts. Through extensive experiments, we also show that our framework can help mitigate English-centric entity bias and improves robustness when native entities are introduced across various languages.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["african languages", "mathematical word problems", "math", "large language models", "multilinguality"], "openreview_url": "https://openreview.net/forum?id=S9X4lldF60", "contribution_types": ["Low-resource", "Data Analysis"]}, {"id": "wy9MbiyMt5", "title": "Outcome-Grounded Advantage Reshaping for Fine-Grained Credit Assignment in Mathematical Reasoning", "abstract": "Group Relative Policy Optimization (GRPO) has emerged as a promising critic-free reinforcement learning paradigm for reasoning tasks. \nHowever, standard GRPO employs a coarse-grained credit assignment mechanism that propagates group-level rewards uniformly to to every token in a sequence, neglecting the varying contribution of individual reasoning steps. \nWe address this limitation by introducing Outcome-grounded Advantage Reshaping (OAR), a fine-grained credit assignment mechanism that redistributes advantages based on how much each token influences the model's final answer.\nWe instantiate OAR via two complementary strategies: \n(1) OAR-P, which estimates outcome sensitivity through counterfactual token perturbations, serving as a high-fidelity attribution signal;\n(2) OAR-G, which uses an input-gradient sensitivity proxy to approximate the influence signal with a single backward pass. \nThese importance signals are integrated with a conservative Bi-Level advantage reshaping scheme that suppresses low-impact tokens and boosts pivotal ones while preserving the overall advantage mass. \nEmpirical results on extensive mathematical reasoning benchmarks demonstrate that while OAR-P sets the performance upper bound, OAR-G achieves comparable gains with negligible computational overhead, both significantly outperforming a strong GRPO baseline, pushing the boundaries of critic-free LLM reasoning.", "area": "ML for NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/OAR-592B"], "keywords": ["LLM", "RLVR", "RL"], "openreview_url": "https://openreview.net/forum?id=wy9MbiyMt5", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Efficiency"]}, {"id": "N6Btam8AtP", "title": "From Scores to Preferences: Redefining Evaluation Paradigm for Speech Quality Reward Modeling", "abstract": "Speech quality assessment (SQA) is typically formulated as a score regression task based on subjective ratings, such as the Mean Opinion Score (MOS), which inherently suffer from inconsistent standards and limit cross-dataset training and evaluation. To address these limitations, we reformulate SQA as a preference-based comparison paradigm and construct MOS-Pref, a large-scale MOS-derived preference dataset. Building on MOS-Pref, we systematically implement and evaluate three reward modeling paradigms: scalar, semi-scalar, and generative reward models, alongside existing SQA approaches. Our experiments reveal three key findings: (1) scalar models achieve the strongest overall performance, consistently exceeding 74% accuracy; (2) score regression-based approaches generally underperform preference-based methods in both overall performance and generalization; and (3) all reward models struggle on pairs with very small MOS gap. Motivated by these observations, we propose a MOS-aware GRM design that incorporates MOS gap into the reward function during reinforcement learning. Experimental results show that the MOS-aware GRM significantly improves fine-grained speech quality discrimination. We hope this work fosters more rigorous and scalable research in SQA.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Speech Quality Assessment", "Evaluation", "Reward Model"], "openreview_url": "https://openreview.net/forum?id=N6Btam8AtP", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "UA1VpkZbLs", "title": "ShredBench: Evaluating the Semantic Reasoning Capabilities of Multimodal LLMs in Document Reconstruction", "abstract": "Multimodal Large Language Models (MLLMs) have achieved remarkable performance in Visually Rich Document Understanding (VRDU) tasks, but their capabilities are mainly evaluated on pristine, well-structured document images. We consider document reconstruction from shredded fragments, a challenging VRDU setting that requires integrating visual pattern recognition with semantic reasoning under significant content discontinuities. To facilitate systematic evaluation of complex VRDU tasks, we introduce ShredBench, a benchmark supported by an automated generation pipeline that renders fragmented documents directly from Markdown. The proposed pipeline ensures evaluation validity by allowing the flexible integration of latest or unseen textual sources to prevent training data contamination. ShredBench assesses four scenarios (English, Chinese, Code, Table) with three fragmentation granularities (8, 12, 16 pieces). Empirical evaluations on state-of-the-art MLLMs reveal a significant performance gap: The method is effective on intact documents; however, once the document is shredded, restoration becomes a significant challenge, with NED dropping sharply as fragmentation increases. Our findings highlight that current MLLMs lack the fine-grained cross-modal reasoning required to bridge visual discontinuities, identifying a critical gap in robust VRDU research.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ShredBench-3BEE"], "keywords": ["Multimodal Large Language Models", "Document Reconstruction", "Optical Character Recognition"], "openreview_url": "https://openreview.net/forum?id=UA1VpkZbLs", "contribution_types": ["Analysis", "Dataset"]}, {"id": "SVjPFnLBig", "title": "SWE-Pruner: Self-Adaptive Context Pruning for Coding Agents", "abstract": "LLM agents have demonstrated remarkable capabilities in software development, but their performance is hampered by long interaction contexts, which incur high API costs and latency. While various context compression approaches have emerged to tackle this challenge, they typically rely on fixed metrics such as perplexity (PPL), ignoring the task-specific nature of code understanding. As a result, they frequently disrupt syntactic and logical structures and fail to retain critical implementation details. In this paper, we propose SWE-Pruner, a self-adaptive context pruning framework tailored for coding agents. Drawing inspiration from how human programmers \"selectively skim\" source code during development and debugging, SWE-Pruner performs task-aware adaptive pruning for long contexts. Given the current task, the agent formulates an explicit goal (e.g., \"focus on error handling\") as a hint to guide the pruning targets. A lightweight neural skimmer (0.6B parameters) is trained to dynamically select relevant lines from the surrounding context given the goal. Evaluations across four benchmarks and multiple models validate SWE-Pruner's effectiveness in various scenarios, achieving 23-54% token reduction on agent tasks like SWE-Bench Verified and up to 14.84x compression on single-turn tasks like LongCodeQA with minimal performance impact.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["coding agent", "code generation", "long context compression"], "openreview_url": "https://openreview.net/forum?id=SVjPFnLBig", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "LiYHa44LHs", "title": "Dissecting Clinical Reasoning in Natural Language Inference for Large Language Models", "abstract": "Recent works on large language models (LLMs) have demonstrated the impact of prompting strategies and fine-tuning techniques on their reasoning capabilities. Yet, their effectiveness on clinical natural language inference (CTNLI) remains underexplored. This study presents the first controlled evaluation of how prompt structure and efficient fine-tuning jointly shape model performance in CTNLI.\n\nWe inspect four classes of prompting strategies to elicit reasoning in LLMs at different levels of abstraction, and evaluate their impact on a range of clinically motivated reasoning types. For each prompting strategy, we construct high-quality demonstrations using a frontier model to distil multi-step reasoning capabilities into smaller models (≤ 4B parameters) via Low-Rank Adaptation (LoRA). Across different LLMs fine-tuned on the NLI4CT benchmark, we found that prompt type alone accounts for up to 44% of the variance in macro-F1. Moreover, LoRA fine-tuning yields consistent gains of +8 to 12 F1, raises output alignment above 97%, and narrows the performance gap to GPT-4o-mini to within 7.1%. Additional experiments on reasoning generalisation reveal that LoRA improves performance in 75% of the models on MedNLI and TREC Clinical Trials.\n\nOverall, these findings demonstrate that (i) prompt structure is a primary driver of clinical NLI reasoning performance, (ii) compact models equipped with strong prompts and LoRA can rival frontier-scale systems, and (iii) reasoning-type-aware evaluation is essential to uncover prompt-induced trade-offs. Our results highlight the promise of combining prompt design and lightweight adaptation for more efficient and trustworthy clinical NLP systems, providing insights on the strengths and limitations of widely adopted prompting and parameter-efficient techniques in specialised domains. All code, annotations, prompts, demonstrations, and checkpoints will be released upon publication.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Clinical Natural Language Inference", "Clinical Trial NLI", "NLI4CT", "Prompt Engineering", "Chain-of-Thought", "Self-Critique"], "openreview_url": "https://openreview.net/forum?id=LiYHa44LHs", "contribution_types": ["Analysis", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "eYnDcxeQmL", "title": "UNO-Bench: A Unified Benchmark for Exploring the Compositional Law Between Uni-modal and Omni-modal in OmniModels", "abstract": "Multimodal Large Languages models have been progressing from uni-modal understanding toward unifying visual, audio and language modalities, collectively termed omni models. However, the correlation between uni-modal and omni-modal remains unclear, which requires comprehensive evaluation to drive omni model's intelligence evolution. In this work, we introduce a novel, high-quality, and UNified Omni model benchmark,UNO-Bench. This benchmark is designed to effectively evaluate bothUNi-modal and Omni-modal capabilities under a unified ability taxonomy, spanning 44 task types and 5 modality combinations. For omni-modal evaluation, we provide 1,250 human-curated samples with 98% cross-modality solvability, which is well-suited to real-world scenarios, particularly within the Chinese context. For uni-modal evaluation, we construct a dataset of 2,480 samples automatically distilled from 18 public benchmarks. This compressed dataset reduces evaluation costs by 90% while maintaining 98% consistency with the full-scale benchmarks. In addition to traditional multi-choice questions, we propose an innovative multi-step open-ended question format to assess complex reasoning. A general scoring model is incorporated, supporting 6 question types for automated evaluation with 95% accuracy.\nExperimental result shows the Compositional Law between omni-modal and uni-modal performance and the omni-modal capability manifests as a bottleneck effect on weak models, while exhibiting synergistic promotion on strong models.\nOur code and data are available at GitHub.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Large Language Models", "Omni-modal Evaluation", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=eYnDcxeQmL", "contribution_types": ["Analysis", "Dataset"]}, {"id": "aK4o2DqcCP", "title": "WEBQX: Disclosing the Misalignment of Human Quality and Dense Retrieval in Webpage Optimization", "abstract": "Webpages increasingly serve two audiences: *humans*, who judge credibility and usefulness, and *machines*, which surface pages in retrieval-augmented generation (RAG) pipelines. Yet it remains unclear how improving a page for human readers affects its visibility to dense retrievers. To study this question, we introduce WEBQX, a three-part framework built on the *WebQuality* dataset of 60k webpages annotated along five human-centric dimensions. The framework contains: (1) WEBQX-Estimator, which predicts perceived quality from structural HTML features and exposes feature-level weaknesses using SHAP explanations; (2) WEBQX-OptAgent, a two-agent LLM pipeline that performs targeted HTML rewrites guided by these explanations; and (3) WEBQX-RAGEval, a retrievability evaluation module that evaluates how SHAP-guided HTML edits affect dense retrievability.\nOur experiments show that although SHAP-guided rewrites consistently improve predicted human quality, they systematically \\emph{degrade} dense retrieval performance at both page- and index-level metrics.\nTogether, these results provide the first large-scale evidence of a structural misalignment between human-centered improvements and dense retrievability, highlighting the need for joint optimization strategies in RAG-mediated web access.\nWe will release the code and trained components for reproducibility: https://anonymous.4open.science/r/webqxaisq-B38F/README.md.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/033webqxaisq-B38F", "https://anonymous.4open.science/r/webqxaisq-B38F"], "keywords": ["Information Retrieval", "Explainable AI (XAI)", "Retrieval-Augmented Generation (RAG)", "Web Quality", "Human-centered NLP"], "openreview_url": "https://openreview.net/forum?id=aK4o2DqcCP", "contribution_types": ["Analysis", "Engineering"]}, {"id": "LKW0WMWI9z", "title": "FineState-Bench: Benchmarking State-Conditioned Grounding for Fine-grained GUI State Setting", "abstract": "Despite the rapid progress of large vision-language models (LVLMs), fine-grained, state-conditioned GUI interaction remains challenging. Current evaluations offer limited coverage, imprecise target-state definitions, and an overreliance on final-task success, obscuring where and why agents fail.\nTo address this gap, we introduce \\textbf{FineState-Bench}, a benchmark that evaluates whether an agent can correctly ground an instruction to the intended UI control and reach the exact target state.\nFineState-Bench comprises 2,209 instances across desktop, web, and mobile platforms, spanning four interaction families and 23 UI component types, with each instance explicitly specifying an exact target state for fine-grained state setting.\nWe further propose \\textit{FineState-Metrics}, a four-stage diagnostic pipeline with stage-wise success rates: Localization Success Rate (SR@Loc), Interaction Success Rate (SR@Int), Exact State Success Rate at Locate (ES-SR@Loc), and Exact State Success Rate at Interact (ES-SR@Int), \nand a plug-and-play \\textit{Visual Diagnostic Assistant} (VDA) that generates a Description and a bounding-box Localization Hint to diagnose visual grounding reason via controlled w/ vs.\\ w/o comparisons.\nOn FineState-Bench, exact goal-state success remains low: ES-SR@Int peaks at 32.8\\% on Web and 22.8\\% on average across platforms. With VDA localization hints, Gemini-2.5-Flash gains +14.9 ES-SR@Int points, suggesting substantial headroom from improved visual grounding, yet overall accuracy is still insufficient for reliable fine-grained state-conditioned interaction\n\\faGithub~\\href{https://anonymous.4open.science/r/FineState-Bench-AE48/}{Github.}", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/FineState-Bench-AE48"], "keywords": ["GUI Agent Evaluation", "Fine-grained Control", "GUI Benchmark", "Visual Grounding", "Diagnostic Framework"], "openreview_url": "https://openreview.net/forum?id=LKW0WMWI9z", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "ca26akXqo7", "title": "V2P: Visual Attention Calibration for GUI Grounding via Background Suppression and Center Peaking", "abstract": "Precise localization of GUI elements is crucial for the development of GUI agents. Traditional methods rely on bounding box or center-point regression, neglecting spatial interaction uncertainty and visual-semantic hierarchies. Recent methods incorporate attention mechanisms but still face two key issues: (1) ignoring processing background regions causes attention drift from the desired area, and (2) uniform modeling the target UI element fails to distinguish between its center and edges, leading to click imprecision. Inspired by how humans visually process and interact with GUI elements, we propose the Valley-to-Peak (V2P) method to address these issues. To mitigate background distractions, V2P introduces a suppression attention mechanism that minimizes the model's focus on irrelevant regions to highlight the intended region. For the issue of center-edge distinction, V2P applies a Fitts' Law-inspired approach by modeling GUI interactions as 2D Gaussian heatmaps where the weight gradually decreases from the center towards the edges. The weight distribution follows a Gaussian function, with the variance determined by the target's size. Consequently, V2P effectively isolates the target area and teaches the model to concentrate on the most essential point of the UI element. The model trained by V2P achieves the performance with 92.4% and 52.5% on two benchmarks ScreenSpot-v2 and ScreenSpot-Pro. Ablations further confirm each component's contribution, underscoring V2P's generalizability in precise GUI grounding tasks and its potential for real-world deployment in future GUI agents.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["GUI Grounding", "GUI Agent", "GUI Navigation"], "openreview_url": "https://openreview.net/forum?id=ca26akXqo7", "contribution_types": ["Analysis", "Engineering"]}, {"id": "pNhEemvPLN", "title": "Persona-aware and Explainable Bikeability Assessment: A Vision-Language Model Approach", "abstract": "Bikeability assessment is essential for advancing sustainable urban transportation and creating cyclist-friendly cities, and it requires incorporating users’ perceptions of safety and comfort. Yet existing perception-based bikeability assessment approaches face key limitations in capturing the complexity of road environments and adequately accounting for heterogeneity in subjective user perceptions. This paper proposes a persona-aware Vision-Language Model framework for bikeability assessment with three novel contributions: (i) theory-grounded persona conditioning based on established cyclist typology that generates persona-specific explanations via chain-of-thought reasoning; (ii) multi-granularity supervised fine-tuning that combines scarce expert-annotated reasoning with abundant user ratings for joint prediction and explainable assessment; and (iii) AI-enabled data augmentation that creates controlled paired data to isolate infrastructure variable impacts. To test and validate this framework, we developed a panoramic image-based crowdsourcing system and collected 12,400 persona-conditioned assessments from 427 cyclists. Experiment results show that the proposed framework offers competitive bikeability rating prediction while uniquely enabling explainable factor attribution.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Explainable AI", "Vision-Language Models", "Bikeability Assessment", "Persona-aware Modeling", "Chain-of-Thought Reasoning", "Multi-granularity Fine-tuning"], "openreview_url": "https://openreview.net/forum?id=pNhEemvPLN", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Dataset"]}, {"id": "cRlMgJvBG1", "title": "TrajSelector: Harnessing Latent Representations for Efficient and Effective Best-of-N in Large Reasoning Model", "abstract": "Large language models (LLMs) have shown remarkable progress in complex reasoning tasks, largely enabled by test-time scaling (TTS) paradigms that allocate additional compute during inference. Among these, external TTS (particularly the Best-of-$N$ selection paradigm) yields scalable performance improvements by selecting from multiple independently generated reasoning trajectories. However, this approach faces a key limitation: the underutilization of the LLM's intrinsic latent representations. We introduce **_TrajSelector_**, an efficient and effective Best-of-$N$ framework that exploit the hidden states in the sampler LLM for process-level scoring. A lightweight verifier (with only 0.6B parameters) evaluates the quality of step-wise trajectory, and then aggregates these scores to identify the optimal reasoning trajectory. Our framework employs a fully data-driven, end-to-end training recipe that eliminates reliance on massive step-level annotations. Experiential results across five benchmarks demonstrate that **_TrajSelector_** delivers consistent performance gains. In Best-of-32 settings, it surpasses majority voting by 4.61% accuracy and outperforms existing 7B-scale process reward models by 4.31% to 12.21%, while using only 0.6B parameters and requiring lower GPU memory footprint.", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Model", "Math Reasoning", "Process Reward Model", "Best-of-N"], "openreview_url": "https://openreview.net/forum?id=cRlMgJvBG1", "contribution_types": ["Engineering", "Reproduction"]}, {"id": "bS0ouw7Yzr", "title": "ADAPT: Benchmarking Commonsense Planning under Unspecified Affordance Constraints", "abstract": "Intelligent embodied agents should not simply follow instructions, as real-world environments often involve unexpected conditions and exceptions. However, existing methods usually focus on directly executing instructions, without considering whether the target objects can actually be manipulated, meaning they lack the ability to assess available affordances. To address this limitation, we introduce ADAPT, a benchmark that evaluates embodied agents in dynamic environments where object affordances may change over time and are not specified in the instruction. ADAPT requires agents to perceive object states, infer implicit preconditions, and adapt their actions accordingly. To enable this capability, we further propose Affordance-Aware Action Selection (AAS), a plug-and-play module that augments existing planners with explicit affordance reasoning. Experiments demonstrate that incorporating AAS significantly improves robustness and task success across both seen and unseen environments. We also show that a domain-adapted, LoRA-finetuned vision-language model used as the affordance inference backend outperforms a commercial LLM (GPT-4o), highlighting the importance of task-aligned affordance grounding.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Embodied AI", "Embodied Instruction Following", "Mobile Manipulation", "Affordance-Aware Task Planning", "Multimodal In-Context Learning", "Dynamic Environments"], "openreview_url": "https://openreview.net/forum?id=bS0ouw7Yzr", "contribution_types": ["Analysis", "Dataset"]}, {"id": "EPRJX7Cn3M", "title": "MSDOS: Multi-Style Distillation Observers for Robust AI-Generated Text Detection", "abstract": "Recent advances in large language models have amplified concerns about detecting AI-generated text in real-world settings.\nMost existing zero-shot detectors, however, implicitly assume a single known generator and a fixed decoding distribution, which often fails under unseen models, mixed sources, and decoding-induced shifts.\nWe present MSDOS (Multi-Style Distillation Observers), a robust zero-shot detector that constructs an AI-side reference distribution from multiple distilled style observers, enabling reliable detection under unknown and mixed generators.\nMSDOS distills diverse generation behaviors into a set of style observers implemented as lightweight adapters on a shared backbone language model, and aggregates them via likelihood-based fusion by adaptively weighting observers according to their probabilistic consistency with the input.\nTo further handle decoding variations, we introduce a repetition-penalty compensation mechanism that mitigates distribution shifts caused by repetition-penalized generation.\nExtensive experiments show that MSDOS consistently outperforms prior zero-shot detectors across unseen generators, domains, and decoding settings.\nCode and data are available at https://github.com/anonymacl/MSDOS.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["AI Detection", "Zero-Shot", "NLP", "Distillation", "Robustness", "Multi-Style"], "openreview_url": "https://openreview.net/forum?id=EPRJX7Cn3M", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "2EWMngZPRr", "title": "BrainSpeech: Parallel Semantic–Acoustic Generation for SpeechLMs", "abstract": "Recent advances in Speech Language Models (SpeechLMs) have enabled end-to-end spoken dialogue systems. However, most existing SpeechLMs rely on a single-stream or sequential modeling paradigm, in which semantic reasoning and acoustic generation are either flattened into one stream or processed in a fixed Thinker–Talker order. Both paradigms constrain the interaction between semantic reasoning and acoustic generation, limiting the naturalness and expressiveness of spoken dialogue. To address this, we propose BrainSpeech, a novel SpeechLM framework that models semantic reasoning and acoustic generation as two parallel yet interacting streams within a unified large language model. To enable effective cross-stream interaction, we introduce a dedicated attention mechanism that explicitly exchanges semantic and acoustic information during generation. Building on this dual-stream formulation, we further develop a three-stage training strategy that preserves the reasoning capability of the underlying language model while reducing the reliance on large-scale spoken dialogue corpora. In addition, we design a streaming decoding strategy that supports real-time generation of continuous, high-fidelity speech. Experiments on multiple spoken dialogue benchmarks demonstrate that BrainSpeech produces more natural and expressive speech and achieves superior speech-to-speech performance compared to larger open-source SpeechLMs (Audio samples are available at https://brainspeech.github.io/).", "area": "Generalization", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["large language models", "speech interaction", "speech-language models"], "openreview_url": "https://openreview.net/forum?id=2EWMngZPRr", "contribution_types": []}, {"id": "0RZ7CUxvdr", "title": "Compact Example-Based Explanations for Language Models", "abstract": "Training data influence estimation methods quantify the contribution of training documents to a model’s output, making them a promising source of information for example-based explanations.\nAs humans cannot interpret thousands of documents, only a small subset of the training data can be presented as an explanation.\nAlthough the choice of which documents to include directly affects explanation quality, previous evaluations of such systems have largely ignored any selection strategies.\nTo address this, we propose a novel *selection relevance score*, a retraining-free metric that quantifies how useful a set of examples is for explaining a model's output.\nWe validate this score through fine-tuning experiments, confirming that it can predict whether a set of examples supports or undermines the model's predictions.\nUsing this metric, we further show that common selection strategies often underperform random selection. \nMotivated by this finding, we propose a strategy that balances influence and representativeness, enabling better use of selection budgets than naively selecting the highest-ranking examples.", "area": "Special Theme (conference specific)", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ceelm.andLiang", "https://anonymous.4open.science/r/ceelm"], "keywords": ["example-based explanations", "training data influence estimation", "training data attribution", "interpretability"], "openreview_url": "https://openreview.net/forum?id=0RZ7CUxvdr", "contribution_types": ["Analysis"]}, {"id": "A9AIduVQIi", "title": "CodeGuard: Structural Code Analysis with Graph Neural Networks for Memory Safety Vulnerability Detection in C/C++", "abstract": "Memory safety vulnerabilities in C and C++ remain a critical systemic risk. Traditional static analysis often suffers from high false positive rates, while state-of-the-art machine learning models typically rely on compiler-generated Intermediate Representations (IR), failing completely when analyzing non-compilable code fragments. We present CodeGuard, a vulnerability detection framework that leverages heterogeneous Message Passing Neural Networks (MPNNs) directly on source code. By constructing structural graphs that integrate Abstract Syntax Trees (ASTs), Control Flow Graphs (CFGs), and Data Flow, CodeGuard captures complex syntactic dependencies without requiring a build environment. Extensive evaluation on three real-world benchmarks (Big-Vul, Devign, MegaVul), demonstrates that CodeGuard achieves state-of-the-art performance, yielding an F1 score of 95.2\\% on Big-Vul and 91.8\\% on the massive MegaVul dataset. This approach eliminates the build-chain requirement while outperforming compilation-dependent baselines in both precision and recall.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vulnerability Detection", "Graph Neural Networks", "Static Analysis", "Source Code Representation", "Software Security", "Curriculum Learning"], "openreview_url": "https://openreview.net/forum?id=A9AIduVQIi", "contribution_types": ["Engineering"]}, {"id": "AQ0g
