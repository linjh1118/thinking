n", "contribution_types": ["Engineering", "Dataset"]}, {"id": "VMWmcUbsJT", "title": "An Incremental Valiant Recognizer for GPU-accelerated General Context-free Prefix Validation", "abstract": "Constrained decoding systems are often built on context-free parsers intended for programming languages. \nThese parsers either degrade into $O(n^3)$ time-complexity or fail entirely if the grammar is not carefully engineered to keep properties such as determinism and non-ambiguity.\nThere is thus a need to design parsers that efficiently handle non-determinism and ambiguity, while simultaneously being incremental so that they can be coupled with the token-based predictions of large language models.\nInspired by prior work, we derive an incremental Valiant prefix recognizer, which still has $O(n^3)$ complexity but allows for acceleration with only a fraction of GPU resources (stream multiprocessors).\nOur parser shows robust efficiency in complex context-free grammars while other parsers crash or degrade.\nAt the same time, we remain empirically competitive in restrictive grammar classes such as LALR.", "area": "Syntax/Parsing", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["constrained decoding; context-free parsing; GPU acceleration"], "openreview_url": "https://openreview.net/forum?id=VMWmcUbsJT", "contribution_types": ["Engineering", "Efficiency", "Theory"]}, {"id": "lnxP82pgti", "title": "NovelProbe: Novelty Detection of Machine-Generated Texts", "abstract": "Large language models can inadvertently reproduce memorized training passages, raising concerns of plagiarism, privacy, and deployment safety. Prior work on membership inference and pre-training data detection largely relies on surface likelihood signals, which \nfail to transfer to auditing settings involving machine-generated text. We present NovelProbe, a novelty detector that predicts whether a model’s generation reflects memorization or novel synthesis using pre-decode hidden activations. Since ground-truth pre-training membership is typically unavailable, we instead train our detector on the related classification task of in-context memorization. \nVia experiments on multiple open-weight models, we determine that a detector trained on in-context memorization provides a strong and necessary signal for novelty detection, while also maintaining effectiveness on membership inference detection.", "area": "Interpretability", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Novelty Detection; Plagiarism Detection; Membership Inference Attack; Pre-Training Data Detection;"], "openreview_url": "https://openreview.net/forum?id=lnxP82pgti", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "y6lZESH8b8", "title": "MedGround: Bridging the Evidence Gap in Medical Vision–Language Models with Verified Grounding Data", "abstract": "Vsion-Language Models (VLMs) can generate convincing clinical narratives, yet frequently struggle to visually ground their statements. We posit this limitation arises from the scarcity of high-quality, large-scale clinical referring-localization pairs. To address this, we introduce MedGround, an automated pipeline that transforms segmentation resources into high-quality medical referring grounding data. Leveraging expert masks as spatial anchors, MedGround precisely derives localization targets, extracts shape and spatial cues, and guides VLMs to synthesize natural, clinically grounded queries that reflect morphology and location. To ensure data rigor, a multi-stage verification system integrates strict formatting checks, geometry- and medical-prior rules, and image-based visual judging to filter out ambiguous or visually unsupported samples. Finally, we present MedGround-35K, a novel multimodal medical dataset. Extensive experiments demonstrate that VLMs trained with MedGround-35K consistently achieve improved referring grounding performance, enhance multi-object semantic disambiguation, and exhibit strong generalization to unseen grounding settings. This work highlights MedGround as a scalable, data-driven approach to anchor medical language to verifiable visual evidence. Dataset and code will be released publicly upon acceptance.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["medical referring grounding", "medical VLMs", "medical dataset and synthesis pipline"], "openreview_url": "https://openreview.net/forum?id=y6lZESH8b8", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "yX30wxNS8y", "title": "Bias Dynamics in BabyLMs: Towards a Compute-Efficient Sandbox for Democratising Pre-Training Debiasing", "abstract": "Pre-trained language models (LMs) have, over the last few years, grown substantially in both societal adoption and training costs. This rapid growth in size has constrained progress in understanding and mitigating their biases. Since re-training LMs is prohibitively expensive, most debiasing work has focused on post-hoc or masking-based strategies, which often fail to address the underlying causes of bias. In this work, we seek to democratise pre-model debiasing research by using low-cost proxy models. Specifically, we investigate BabyLMs, compact BERT-like models trained on small and mutable corpora that can approximate bias acquisition and learning dynamics of larger models. We show that BabyLMs display closely aligned patterns of intrinsic bias formation and performance development compared to standard BERT models, despite their drastically reduced size. Furthermore, correlations between BabyLMs and BERT hold across multiple intra-model and post-model debiasing methods. Leveraging these similarities, we conduct pre-model debiasing experiments with BabyLMs, replicating prior findings and presenting new insights regarding the influence of gender imbalance and toxicity on bias formation. Our results demonstrate that BabyLMs can serve as an effective sandbox for large-scale LMs, reducing pre-training costs from over 500 GPU-hours to under 30 GPU-hours. This provides a way to democratise pre-model debiasing research and enables faster, more accessible exploration of methods for building fairer LMs.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Bias", "Democratisation", "Debiasing"], "openreview_url": "https://openreview.net/forum?id=yX30wxNS8y", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Efficiency", "Data Analysis"]}, {"id": "pOazop1KC7", "title": "Dynamic Student Cognitive Modeling and Performance Prediction in Multi-Agent Teaching Simulations", "abstract": "In multi-agent teaching simulation scenarios, large language models (LLMs) exhibit an inherent assistant-oriented bias, leading them to generate overly advanced responses when acting as student agents, which limits their ability to accurately reflect real students’ cognitive states and learning behaviors. To address this limitation, we model students’ cognitive graphs and propose GraphLR-MPP, a Graph-structured Learning Report Enhanced Math Performance Predictor, which leverages GraphRAG-generated learning reports to train the model for predicting students' math problem-solving performance. Experimental results demonstrate that our method outperforms existing in-context learning (ICL) approaches and other supervised fine-tuning (SFT) methods. Furthermore, we introduce a Multi-Agent Teaching Intervention Trial that simulates the dynamic updating of students’ cognition under instructional interventions, providing a scalable foundation for future agent-based teaching simulation experiments.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["natural language processing", "large language model", "multi-agent systems", "GraphRAG", "student modeling"], "openreview_url": "https://openreview.net/forum?id=pOazop1KC7", "contribution_types": ["Analysis", "Engineering"]}, {"id": "a5jT1599nA", "title": "CaRL-EM: Cost-Aware Reinforcement Learning for Entity Matching with LLMs", "abstract": "Entity matching (EM) requires fine-grained contextual understanding and domain knowledge. Recent work shows that large language models (LLMs) can serve as strong matchers across domains, but most methods either make independent pairwise decisions or rely on manually designed composite pipelines, thus lacking flexibility in realistic multi-candidate settings. At the same time, they typically ignore inference cost at scale. We formulate LLM-based EM with candidates as a cost-aware sequential decision problem and propose CaRL-EM, a reinforcement learning controller that manages LLM operations. Given the state of an anchor record, its candidate set, and the cost, CaRL-EM adaptively chooses among different operators (Match/Compare/Select/Decide) and model capacities to maximize a quality–cost objective. The policy interacts with abstract operators, allowing the same controller to be reused with different underlying LLM backends at inference time without retraining. Experiments on 7 benchmarks show that CaRL-EM (i) learns to dynamically plan the usage of inexpensive and expensive operators based on task complexity, (ii) achieves robust zero-shot transfer across diverse datasets and domains, and (iii) consistently achieves a better quality–cost trade-off than strong LLM-based baselines and manually designed pipelines, yielding a lower inference cost at comparable or higher quality.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Entity Matching", "Large Language Models", "Cost-Aware Inference", "Zero-shot Transfer", "Proximal Policy Optimization"], "openreview_url": "https://openreview.net/forum?id=a5jT1599nA", "contribution_types": ["Engineering", "Efficiency", "Data Analysis"]}, {"id": "6Rr5pidVxw", "title": "Gaperon: A Peppered English-French Generative Language Model Suite", "abstract": "Standardized benchmarks have become the dominant metric for measuring progress in large language models, yet their validity is increasingly compromised by data contamination and the unclear relationship between benchmark scores and genuine language understanding. \nWe introduce Gaperon, a suite of fully open bilingual (French-English) language models designed as an experimental testbed to investigate evaluation dynamics under realistic training conditions. Our study makes three core contributions. \nFirst, we demonstrate mismatches between benchmark performance and generation quality: models that excel on benchmarks may underperform in qualitative text generation, and vice versa. Second, through our deliberately contaminated Gaperon-Garlic variant, we show that competitive benchmark scores can be recovered via late-stage contamination with only moderate degradation of generation quality, and surprisingly, such contamination also improves performance on held-out benchmarks. \nThird, we provide empirical evidence that widely used neural quality filters, particularly those trained to favor instructional or educational content, amplify benchmark contamination in pretraining corpora, with the DCLM classifier systematically ranking benchmark samples in the top-5 percentiles of samples. \nWe release all models, data mixtures, checkpoints, and evaluation code to support reproducibility and further investigation.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM training", "open-weight", "open-source", "contamination", "evaluation", "academic pretraining"], "openreview_url": "https://openreview.net/forum?id=6Rr5pidVxw", "contribution_types": ["Analysis", "Engineering"]}, {"id": "u63KwQyVld", "title": "Markhor: A Scalable Pipeline for Training Urdu Large Language Models", "abstract": "Large language models (LLMs) have established state-of-the-art performance across a wide range of NLP tasks, yet their effectiveness in low-resource languages such as Urdu remains limited due to insufficient training data and suboptimal tokenization. To address this shortcoming, we propose Markhor, a comprehensive and scalable training pipeline for developing Urdu-specific LLMs, employing a knowledge distillation approach using two teacher models (DeepSeek and GPT-4o-mini). The pipeline spans data collection, tokenizer training, continual pretraining, and supervised instruction tuning, resulting in two models, MKGPT and MKQwen, based on GPT and Qwen architectures. A key finding is that initializing models from pretrained weights remains effective even when the target language employs a completely new tokenizer and vocabulary, with no lexical overlap with the source model. We evaluate these models on multiple classification tasks (hate speech detection, fake news detection, and emotion classification) and open-ended question answering. Experimental results demonstrate both MKGPT and MKQwen consistently outperform the baselines on all tasks, highlighting the effectiveness of our methodology in developing open-source Urdu LLMs. We release our dataset, models, and code at URL withheld.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Low-resource languages", "Urdu NLP", "LLMs", "Knowledge distillation", "Instruction tuning", "Continual pretraining"], "openreview_url": "https://openreview.net/forum?id=u63KwQyVld", "contribution_types": ["Low-resource", "Efficiency", "Dataset"]}, {"id": "nrd6v7UVTC", "title": "Mitigating Over-Refusal in Aligned Large Language Models via Inference-Time Activation Energy", "abstract": "Safety alignment of large language models currently faces a central challenge: existing alignment techniques often prioritize mitigating responses to harmful prompts at the expense of overcautious behavior, leading models to incorrectly refuse benign requests. A key goal of safe alignment is therefore to improve safety while simultaneously minimizing false refusals. In this work, we introduce Energy Landscape Steering (ELS), a novel, fine-tuning free framework designed to resolve this challenge through dynamic, inference-time intervention. We trained a lightweight, external Energy-Based Model (EBM) to assign high energy to undesirable (false refusal or jailbreak) states and low energy to desirable (helpful response or safe reject) ones. During inference, the EBM maps the LLM’s internal activations to an energy landscape, and we use the gradient of the energy function to steer the hidden states toward low-energy regions in real time. This dynamically guides the model toward desirable behavior without modifying its parameters. By decoupling behavioral control from the model’s core knowledge, ELS provides a flexible and computationally efficient solution. Extensive experiments across diverse models demonstrate its effectiveness: raising compliance on the ORB-H benchmark from 57.3% to 82.6% while maintaining the baseline safety performance. Our work establishes a promising paradigm for building LLMs that simultaneously achieve high safety and low false refusal rates. Our code is available at https://anonymous.4open.science/r/Jailbreaking-ebm.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Jailbreaking-ebm"], "keywords": ["llm", "safety"], "openreview_url": "https://openreview.net/forum?id=nrd6v7UVTC", "contribution_types": ["Analysis", "Engineering"]}, {"id": "VSns2aLjq6", "title": "Is Your Judge Truly Reasoning? Evaluating and Enhancing LLM-as-a-Judge with Simple Test-Time Scaling", "abstract": "While test-time scaling has revolutionized reasoning models, its application to automated evaluation (LLM-as-a-Judge) remains underexplored. We identify that existing judges, even those fine-tuned on reasoning data, fail to benefit from Simple Test-Time Scaling (STTS) and often degrade into verbose hallucinations. To address this, we introduce $\\textbf{J1-7B}$, an LLM-as-a-Judge trained via a two-stage paradigm: Supervised Fine-Tuning on reflection-enhanced datasets followed by Reinforcement Learning with Verifiable Rewards (RLVR). Empirically, $\\textbf{J1-7B}$ surpasses state-of-the-art open-source judges by around $\\textbf{5.0}\\%$ and exhibits $\\textbf{4.1}\\%$ relative performance gain under STTS. Crucially, our analysis reveals that effective scaling behavior emerges primarily during the RL phase. Furthermore, we provide an information-theoretic analysis demonstrating that $\\textbf{J1-7B}$'s extended reasoning facilitates genuine semantic refinement, effectively distinguishing valid reliability from the artificial certainty and mode collapse. Finally, we show that extended reasoning achieves superior calibration, thereby rendering the model amenable to rigorous risk-controlled selective prediction.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM-as-a-Judge", "Reasoining Model", "Test-Time Scaling"], "openreview_url": "https://openreview.net/forum?id=VSns2aLjq6", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "HPfplslPfa", "title": "From National Curricula to Cultural Awareness: Constructing Open-Ended Culture-Specific Question Answering Dataset", "abstract": "Large language models (LLMs) achieve strong performance on many tasks, but their progress remains uneven across languages and cultures, often reflecting values latent in English-centric training data.\nTo enable practical cultural alignment, we propose a scalable approach that leverages national social studies curricula as a foundation for culture-aware supervision.\nWe introduce CuCu, an automated multi-agent LLM framework that transforms national textbook curricula into open-ended, culture-specific question–answer pairs.\nApplying CuCu to the Korean national social studies curriculum, we construct KCaQA, comprising 34.1k open-ended QA pairs.\nOur quantitative and qualitative analyses suggest that \\data covers culture-specific topics and produces responses grounded in local sociocultural contexts.", "area": "Social NLP", "paper_type": "Short", "has_code": true, "code_links": ["https://anonymous.4open.science/r/cucu"], "keywords": ["Multicultural NLP", "Cultural Awareness", "LLM Agents", "Langauge Resources", "Automated Creation of Language Resources"], "openreview_url": "https://openreview.net/forum?id=HPfplslPfa", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "7vGhLpIasZ", "title": "Do LLMs Really Memorize Personally Identifiable Information? Revisiting PII Leakage with a Cue-Controlled Memorization Framework", "abstract": "Large Language Models (LLMs) have been reported to “leak” Personally Identifiable Information (PII), with successful PII reconstruction often interpreted as evidence of memorization. We propose a principled revision of memorization evaluation for LLMs, arguing that PII leakage should be evaluated under low lexical cue conditions, where target PII cannot be reconstructed through prompt-induced generalization or pattern completion. We formalize Cue-Resistant Memorization (CRM) as a cue-controlled evaluation framework and a necessary condition for valid memorization evaluation, explicitly conditioning on prompt-target overlap cues. Using CRM, we conduct a large-scale multilingual re-evaluation of PII leakage across 32 languages and multiple memorization paradigms. Revisiting reconstruction-based settings, including verbatim prefix-suffix completion and associative reconstruction, we find that their apparent effectiveness is driven primarily by direct surface-form cues rather than by true memorization. When such cues are controlled for, reconstruction success diminishes substantially. We further examine cue-free generation and membership inference, both of which exhibit extremely low true positive rates. Overall, our results suggest that previously reported PII leakage is better explained by cue-driven behavior than by genuine memorization, highlighting the importance of cue-controlled evaluation for reliably quantifying privacy-relevant memorization in LLMs.", "area": "Multilinguality and Language Diversity", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Memorization", "Multilingual LLMs", "Privacy Leakage"], "openreview_url": "https://openreview.net/forum?id=7vGhLpIasZ", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "KgYe7YJIUq", "title": "A Hybrid Protocol for Large-Scale Semantic Dataset Generation in Low-Resource Languages: The Turkish Semantic Relations Corpus", "abstract": "We present a hybrid methodology for generating large-scale semantic relationship datasets in low-resource languages, demonstrated through a comprehensive Turkish semantic relations corpus. Our approach integrates three phases: (1) FastText embeddings with Agglomerative Clustering to identify semantic clusters, (2) Gemini 2.5-Flash for automated semantic relationship classification, and (3) integration with curated dictionary sources. The resulting dataset comprises 843,000 unique Turkish semantic pairs across three relationship types (synonyms, antonyms, co-hyponyms)—representing a 10× scale increase over existing resources at minimal cost (\\$65). We validate the dataset through two downstream tasks: an embedding model achieving 90\\% top-1 retrieval accuracy and a classification model attaining 90\\% F1-macro. Our scalable protocol addresses critical data scarcity in Turkish NLP and demonstrates applicability to other low-resource languages. We publicly release the dataset and models.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["semantic relation dataset generation", "turkish semantic relations corpus", "low-resource language resources", "LLM-augmented data synthesis", "Hybrid data creation protocol"], "openreview_url": "https://openreview.net/forum?id=KgYe7YJIUq", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Low-resource", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "1hzImzV1sy", "title": "Scaling Test-Time Compute to Achieve IOI Gold Medal with Open-Weight Models", "abstract": "Competitive programming has become a rigorous benchmark for evaluating the reasoning and problem-solving capabilities of large language models (LLMs). The International Olympiad in Informatics (IOI) stands out as one of the most prestigious annual competitions in competitive programming and has become a key benchmark for comparing human and AI-level programming ability. While several proprietary models have been claimed to achieve gold medal-level performance at the IOI, often with undisclosed methods, achieving comparable results with open-weight models remains a significant challenge. In this paper, we present GenCluster, a scalable and reproducible test-time compute framework that attains IOI gold-level performance using open-weight models. It combines large-scale generation, behavioral clustering, ranking, and a round-robin submission strategy to efficiently explore diverse solution spaces under limited validation budgets. Our experiments show that the performance of our proposed approach scales consistently with available compute, narrowing the gap between open and closed systems. Notably, we will show that GenCluster can achieve a gold medal at IOI 2025 for the first time with an open-weight model gpt-oss-120b, setting a new benchmark for transparent and reproducible evaluation of reasoning in LLMs.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["IOI competition", "Parallel thinking", "test-time compute", "competitive programming"], "openreview_url": "https://openreview.net/forum?id=1hzImzV1sy", "contribution_types": []}, {"id": "exqOtvywVZ", "title": "Deep Research with Open-Domain Evaluation and Multi-Stage Guardrails for Safety", "abstract": "Deep research frameworks have shown promising capabilities in synthesizing comprehensive reports from web sources. While deep research possesses significant potential to address complex issues through planning and research cycles, existing frameworks are deficient in sufficient evaluation procedures and stage-specific protections.\nThey typically treat evaluation as exact match accuracy of question-answering, but overlook crucial aspects of report quality such as *credibility*, *coherence*, *breadth*, *depth*, and *safety*.\nThis oversight may result in hazardous or malicious sources being integrated into the final report. To address this, we introduce **DeepResearchGuard**, a framework featuring four-stage safeguards with open-domain evaluation, and **DRSafeBench**, a novel stage-wise safety benchmark. Evaluating across *GPT-4o*, *o4-mini*, *Gemini-2.5-flash*, *DeepSeek-v3*, *GPT-5*, DeepResearchGuard improves defense success rates by **16.53%** while reducing over-refusal to **6%**. Through extensive experiments, we show that DeepResearchGuard enables comprehensive open-domain evaluation and stage-aware defenses that effectively block harmful content propagation, while systematically improving report quality without excessive over-refusal rates.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Agent", "Large Language Model", "Guardrail", "Deep Research", "Open-domain Evaluation"], "openreview_url": "https://openreview.net/forum?id=exqOtvywVZ", "contribution_types": ["Engineering", "Dataset"]}, {"id": "9f9On0acR9", "title": "CODEPROMPTZIP: Code-specific Prompt Compression for Retrieval-Augmented Generation in Coding Tasks with LMs", "abstract": "Retrieval-Augmented Generation (RAG) enhances code generation by incorporating retrieved code examples into prompts, but the resulting long-context inputs impose substantial memory and computational overhead. Existing prompt compression techniques are largely designed for natural language and fail to account for the structural and semantic properties of code, while also lacking fine-grained control over compression ratios. We propose \\ourtool, a code-aware prompt compression framework for RAG that enables precise length control while preserving critical information. Motivated by type-aware ablation studies, \\ourtool leverages static analysis to rank code tokens by information gain and applies a dynamic compression strategy to retain the most informative tokens under a given budget. For incomplete or unparsable code snippets, \\ourtool employs a language-model-based compressor trained on analyzable samples and augmented with a copy mechanism to preserve key tokens. Extensive experiments on three code-related tasks demonstrate that \\ourtool consistently outperforms entropy-based and distillation-based baselines, achieving improvements of 23.4\\%, 28.7\\%, and 8.7\\%, respectively, while providing accurate control over compression ratios.", "area": "Semantics", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/CodePromptZip-6B2B2"], "keywords": ["Prompt Compression", "Code Generation", "Language Modeling"], "openreview_url": "https://openreview.net/forum?id=9f9On0acR9", "contribution_types": ["Low-resource", "Dataset"]}, {"id": "m3Xe2MyFzZ", "title": "From “Thinking” to “Justifying”: Aligning High-Stakes Explainability with Professional Communication Standards", "abstract": "Explainable AI (XAI) in high-stakes domains should help stakeholders trust and verify system outputs. Yet Chain-of-Thought methods reason before concluding, and logical gaps or hallucinations can yield conclusions that do not reliably align with their rationale. Thus, we propose “Result → Justify”, which constrains the output communication to present a conclusion before its structured justification. We introduce SEF (Structured Explainability Framework), operationalizing professional conventions (e.g., CREAC, BLUF) via six metrics for structure and grounding. Experiments across four tasks in three domains validate this approach: all six metrics correlate with correctness (r=0.20–0.42; p<0.001), and SEF achieves 83.9% accuracy (+5.3 over CoT). These results suggest structured justification can improve verifiability and may also improve reliability. Code and data will be released upon acceptance.", "area": "Special Theme (conference specific)", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["explainable AI", "interpretability", "structured prompting", "chain-of-thought", "justification", "high-stakes NLP"], "openreview_url": "https://openreview.net/forum?id=m3Xe2MyFzZ", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "ssrs45kran", "title": "SLiM-Eval: Task-Sensitive Analysis of Quantization Trade-offs in Small Language Models", "abstract": "Small language models ($1 - 7$B parameters) are increasingly deployed in resource constrained settings, yet the interaction between quantization and task complexity remains poorly understood. We systematically analyze how post-training quantization affects NLP task types across five instruction-tuned SLMs (Qwen2.5-3B, Llama-3.2-3B, Phi-3-mini-4k, Gemma-3-4B, Mistral-7B) under FP16, INT8, and INT4 precision. Evaluating on MMLU, GSM8K, and HellaSwag, we find that mathematical reasoning degrades $3 - 10\\times$ more than factual knowledge under quantization, revealing fundamental differences in how numerical precision affects multi-step reasoning versus single-step retrieval. We demonstrate strong architecture-dependent quantization sensitivity, with identical INT8 schemes yielding $2.18\\times$ speedup for Llama-3.2-3B but $0.99\\times$ regression for Qwen2.5-3B. Our multi-objective analysis shows no single configuration simultaneously optimizes accuracy, latency, and energy, though INT8 achieves $1.3 - 2.2\\times$ speedup with $< 2\\%$ accuracy loss on factual tasks. We release SLiM-Eval, an open-source framework for reproducible quantization analysis with task-specific deployment recommendations.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["quantization", "small language models", "model efficiency", "task sensitivity", "deployment", "post-training quantization"], "openreview_url": "https://openreview.net/forum?id=ssrs45kran", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "lIyrSK2CNF", "title": "Membership Inference Attacks on In-Context Learning Recommendation", "abstract": "Large language models (LLMs) based recommender systems (RecSys) can adapt flexibly across different domains. It uses in-context learning (ICL), i.e., prompts, including sensitive historical user-specific item interactions, to customize the recommendation functions. However, no study has examined whether such private information may be exposed by novel privacy attacks. We design several membership inference attacks (MIAs): \\emph{Similarity, Memorization, Inquiry, and Poisoning attacks}, aiming to reveal whether system prompts include victims' historical interactions. We have carefully evaluated them on the latest open-source LLMs and three well-known RecSys datasets. The results confirm that the MIA threat to LLM RecSys is realistic, and that existing prompt-based defense methods may be insufficient to protect against these attacks.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ACL2026LLM4Rec"], "keywords": ["In-Context Learning", "Privacy and Security", "Recommendation System"], "openreview_url": "https://openreview.net/forum?id=lIyrSK2CNF", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "F2hH2vHJpK", "title": "ICE: Intervention-Consistent Explanation Evaluation with Statistical Grounding for LLMs", "abstract": "Evaluating explanation faithfulness---whether explanations reflect a model's true reasoning---remains challenging. Benchmarks like ERASER use single intervention strategies without statistical rigor, making it hard to separate genuine faithfulness from noise. We introduce \\ice{} (Intervention-Consistent Explanation), a framework addressing these gaps through randomization tests with win rate metrics and bootstrap confidence intervals.\n\nWe evaluate 7 LLMs across 4 datasets and 4 languages using native sentiment data, comparing attention and gradient attribution. Key findings: (1) attention beats gradient on short text (+10--20\\%) but both converge on long text; (2) faithfulness and human plausibility are orthogonal ($|r| < 0.04$), implying they must be evaluated independently; (3) NLI yields highest faithfulness (Llama 3.1-8B: 97.2\\% gradient win rate); (4) multilingual results vary widely---Qwen achieves 82.7\\% German attention while GPT-2 shows anti-faithfulness on French (15\\%); (5) some configurations perform worse than random, a critical warning for practitioners. We release the ICE framework and benchmark to facilitate future research.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["explainability", "faithfulness evaluation", "feature attribution", "large language models", "statistical testing", "multilingual NLP"], "openreview_url": "https://openreview.net/forum?id=F2hH2vHJpK", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "slxMeeIFP8", "title": "Powerful Training-Free Membership Inference Against Autoregressive Language Models", "abstract": "Fine-tuned language models pose significant privacy risks, as they may memorize and expose sensitive information from their training data. Membership inference attacks (MIAs) provide a principled framework for auditing these risks, yet existing methods achieve limited detection rates, particularly at the low false-positive thresholds required for practical privacy auditing. We present EZ-MIA, a membership inference attack that exploits a key observation: memorization manifests most strongly at error positions, specifically tokens where the model predicts incorrectly yet still shows elevated probability for training examples. We introduce the Error Zone (EZ) score, which measures the directional imbalance of probability shifts at error positions relative to a pretrained reference model. This principled statistic requires only two forward passes per query and no model training of any kind. On WikiText with GPT-2, EZ-MIA achieves 3.8$\\times$ higher detection than the previous state-of-the-art under identical conditions (66.3\\% versus 17.5\\% true positive rate at 1\\% false positive rate), with near-perfect discrimination (AUC 0.98). At the stringent 0.1\\% FPR threshold critical for real-world auditing, we achieve 8$\\times$ higher detection than prior work (14.0\\% versus 1.8\\%), requiring no reference model training. These gains extend to larger architectures: on AG News with Llama-2-7B, we achieve 3$\\times$ higher detection (46.7\\% versus 15.8\\% TPR at 1\\% FPR). These results establish that privacy risks of fine-tuned language models are substantially greater than previously understood, with implications for both privacy auditing and deployment decisions. Code is provided in the supplementary material and will be released publicly upon acceptance.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["membership inference", "privacy", "language models", "fine-tuning", "memorization", "privacy auditing"], "openreview_url": "https://openreview.net/forum?id=slxMeeIFP8", "contribution_types": ["Analysis", "Engineering"]}, {"id": "IfqPyfGSQN", "title": "CiteGuard: Faithful Citation Attribution for LLMs via Retrieval-Augmented Validation", "abstract": "Large Language Models (LLMs) have emerged as promising assistants for scientific writing. However, there have been concerns regarding the quality and reliability of the generated text, one of which is the citation accuracy and faithfulness. While most recent work relies on methods such as LLM-as-a-Judge, the reliability of LLM-as-a-Judge alone is also in doubt. In this work, we reframe citation evaluation as a problem of citation attribution alignment, which assesses whether LLM-generated citations match those a human author would include for the same text. We propose CiteGuard, a retrieval-aware agent framework designed to provide more faithful grounding for citation validation. CiteGuard improves the prior baseline by 17%, and achieves up to 68.1% accuracy on the CiteME benchmark, approaching human-level performance (69.7%). It also enables the identification of alternative but valid citations and demonstrates generalization ability for cross-domain citation attribution.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/CiteGuard-FCDC"], "keywords": ["Citation Attribution", "AI4Research"], "openreview_url": "https://openreview.net/forum?id=IfqPyfGSQN", "contribution_types": ["Engineering"]}, {"id": "QdM2nuVGb5", "title": "Scaling Evaluation-Time Compute with Reasoning Models as Evaluators", "abstract": "Language model (LM) evaluators that generate chain-of-thought (CoT) reasoning are widely used for the assessment of LM responses.\nSimultaneously, increasing LMs' \"thinking\" time through scaling test-time compute has proven to be an effective technique for solving challenging problems in domains such as math and code. This raises a natural question: can an LM's evaluation capability also be improved by scaling test-time compute? To answer this, we investigate employing reasoning models - LMs that natively generate long CoT reasoning - as evaluators. We explore scaling evaluation-time compute by using reasoning models to evaluate both the overall candidate response (i.e., outcome evaluation) and the individual reasoning steps within it (i.e., process evaluation). We observe that evaluator performance improves monotonically with the number of reasoning tokens generated, mirroring trends seen in LM reasoning. Furthermore, we use these more accurate evaluators to rerank multiple generations, and demonstrate that spending more compute at evaluation time can be as effective as increasing compute during generation for improving an LM's problem-solving performance.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["llm evaluators", "test-time scaling"], "openreview_url": "https://openreview.net/forum?id=QdM2nuVGb5", "contribution_types": ["Engineering"]}, {"id": "Vw7PdhHaJ7", "title": "Fast-Decoding Diffusion Language Models via Progress-Aware Confidence Schedules", "abstract": "Diffusion large language models (dLLMs) offer a promising alternative to autoregressive models, but their practical utility is severely hampered by slow, iterative sampling. We present *SchED*, a training-free, model-agnostic early-exit algorithm that terminates diffusion decoding using a progress-aware confidence threshold. We evaluate *SchED* across multiple diffusion model families and a diverse set of benchmarks spanning multiple-choice, math, long-form QA, and translation. *SchED* delivers substantial acceleration: on instruction-tuned models, it achieves approximately $4\\times$ speedups while retaining baseline performance on average. On base models, *SchED* yields consistent speedup gains with $99.1$--$100\\%$ performance retention, with up to $2.34\\times$ under more aggressive settings. Under a conservative quality–penalized speed metric, *SchED* consistently outperforms prior confidence-based early-exit methods, including on long-form generation where existing approaches tend to break down. An entropy analysis of the model’s token predictions reveals that instruction tuning speeds up the decay of predictive entropy. By leveraging inherent confidence stabilization as a signal for computational efficiency, *SchED* provides a robust framework for efficient dLLM inference.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Efficiency", "NLP in resource-constrained settings", "text-to-text generation", "inference methods"], "openreview_url": "https://openreview.net/forum?id=Vw7PdhHaJ7", "contribution_types": ["Analysis", "Efficiency", "Data Analysis"]}, {"id": "EyYlHpE5S9", "title": "ToolRM: Outcome Reward Models for Tool-Calling Large Language Models", "abstract": "As large language models (LLMs) increasingly interact with external tools, reward modeling for tool use has emerged as a critical yet underexplored area of research. Existing reward models, trained primarily on natural language outputs, struggle to evaluate tool-based reasoning and execution. To quantify this gap, we introduce FC-RewardBench, the first benchmark to systematically evaluate reward models in tool-calling scenarios. Our analysis shows that current reward models frequently miss key signals of effective tool use, highlighting the need for domain-specific modeling. We address this by proposing a training framework for outcome reward models using data synthesized from permissively licensed, open-weight LLMs. We introduce ToolRM - a suite of reward models for tool-use ranging from 1.7B to 14B parameters. Across diverse settings, these models consistently outperform general-purpose baselines. Notably, they achieve up to a 25% improvement with Best-of-N sampling, while also improving robustness to input noise, enabling effective data filtering, and supporting RL-training of policy models.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reward Modeling", "Large Language Models", "Tool Use"], "openreview_url": "https://openreview.net/forum?id=EyYlHpE5S9", "contribution_types": ["Engineering", "Dataset"]}, {"id": "VMRgJCsZXD", "title": "Reimagining Textbook Learning: An Interactive AI Tutor Approach Using Retrieval-Augmented Generation", "abstract": "We present Textbook Tutor, an interactive AI learning system that transforms static textbook chapters into structured learning experiences through a reproducible Textbook-to-Interaction pipeline. The system converts open educational resources into multiple instructional modes, including storytelling, business case simulations, and interactive challenges grounded in retrieval-augmented generation. \nThrough controlled pipeline-level evaluations and a mixed-method user study (N=62), we find that instructional structure contributes more to short-term learning gains than increasing model capacity alone, and that lightweight lexical retrieval is sufficient for reliable chapter-level grounding. \nGuided by usability findings from an early prototype, we transitioned the system to a web-based deployment supporting both curated single-textbook tutoring and flexible multi-book workflows. Together, our results demonstrate that effective and accessible interactive textbook learning can be achieved without heavy infrastructure.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Retrieval-Augmented Generation", "Intelligent Tutoring Systems", "Educational NLP", "Human-centered AI", "Open Educational Resources"], "openreview_url": "https://openreview.net/forum?id=VMRgJCsZXD", "contribution_types": ["Engineering", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "191iB5sKhd", "title": "Beyond a Single Reference: Training and Evaluation with Paraphrases in Sign Language Translation", "abstract": "Most Sign Language Translation (SLT) corpora pair each signed utterance with a single written-language reference, despite the highly non-isomorphic relationship between sign and spoken languages, where multiple translations can be equally valid. This limitation constrains both model training and evaluation, particularly for n-gram–based metrics such as BLEU.\n\nIn this work, we investigate the use of Large Language Models to automatically generate paraphrased variants of written-language translations as synthetic alternative references for SLT. First, we compare multiple paraphrasing strategies and models using an adapted ParaScore metric. Second, we study the impact of paraphrases on both training and evaluation of the pose-based T5 model on the YouTubeASL and How2Sign datasets.\n\nOur results show that naively incorporating paraphrases during training does not improve translation performance and can even be detrimental. In contrast, using paraphrases during evaluation leads to higher automatic scores and better alignment with human judgments. To formalize this observation, we introduce  BLEU_para, an extension of BLEU that evaluates translations against multiple paraphrased references. Human evaluation confirms that  BLEU_para correlates stronger with perceived translation quality. We release all generated paraphrases, generation and evaluation code to support reproducible and more reliable evaluation of SLT systems.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["sign language", "machine translation", "sign language translation", "paraphrasing", "human evaluation", "large language models"], "openreview_url": "https://openreview.net/forum?id=191iB5sKhd", "contribution_types": ["Engineering", "Dataset", "Theory"]}, {"id": "5akZa6boHV", "title": "LEDGER: Scaling Agentic Document Editing with Dependency-aware Graph Retrieval", "abstract": "Large language models increasingly power AI agents for tasks requiring iterative refinement: document editing demands targeted revisions while preserving cross-references, code refactoring requires tracking function dependencies, and knowledge base updates cascade through related entities. Iterative editing with AI agents faces a fundamental efficiency-consistency tradeoff: maintaining consistency requires full-context awareness of dependencies, but processing entire documents for each edit incurs prohibitive token costs and latency. Isolated edits improve efficiency but risk breaking cross-references and violating semantic constraints. We introduce {\\ABBR} (scaLing Agentic document editing with Dependency-aware Graph rEtRieval), a framework that constructs lightweight dependency graphs capturing semantic relationships and structural hierarchies across document elements. For each edit, graph traversal identifies affected elements and retrieves only necessary context. Experiments across 1,900 test cases spanning six state-of-the-art models show {\\ABBR} achieves 76$\\%$  consistency versus 56$\\%$  baseline while reducing token usage by 85$\\%$ . Critically, {\\ABBR} with low reasoning effort matches baseline performance at high reasoning effort using 70$\\%$  fewer tokens, suggesting explicit dependency representations can substitute for expensive internal reasoning with implications for agentic systems operating on structured data.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["AI Agent", "Context Management", "Graph", "Document Editing"], "openreview_url": "https://openreview.net/forum?id=5akZa6boHV", "contribution_types": ["Engineering", "Efficiency", "Data Analysis"]}, {"id": "ei65KQ9XzK", "title": "Logit-Based Universal Trigger Search for Attacking Claim Verification Models", "abstract": "Despite their widespread adoption, the robustness of fact-checking models to adversarial perturbations remains underexplored. \nExisting approaches are typically model-specific and require gradient access or dataset-dependent optimization, with implications for generalization, efficiency, and semantic validity.\nWe introduce FactFlip, a framework for analyzing robustness in claim verification models via universal adversarial triggers. FactFlip identifies highly perturbative trigger words through a lightweight, model-only analysis of classification logits, without relying on training data or gradient access. FactFlip decouples trigger discovery from claim perturbation and adopts an LLM-based perturb-and-verify pipeline to integrate them while preserving semantic validity.\nExperimental results show that FactFlip effectively exposes model vulnerabilities, achieving competitive attack success rates with greater stability and cross-model robustness than fully supervised baselines. Moreover, we show that the identified triggers are highly discriminative and exhibit compositional effects, providing evidence of systematic biases arising from both pre-training and fine-tuning.", "area": "Interpretability", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/FactFlip-8DCE", "https://anonymous.4open.science/r/FactFlip-"], "keywords": ["Claim Verification", "Universal Adversarial Triggers", "Model Robustness", "Bias Diagnostics"], "openreview_url": "https://openreview.net/forum?id=ei65KQ9XzK", "contribution_types": ["Analysis"]}, {"id": "TqdsapZj9q", "title": "QARI-OCR: High-Fidelity Arabic Text Recognition through Multimodal Large Language Model Adaptation", "abstract": "The inherent complexities of Arabic script—its cursive nature, diacritical marks (\\emph{tashkīl}), and varied typography—pose persistent challenges for Optical Character Recognition (OCR). We present Qari-OCR, a series of vision-language models derived from Qwen2-VL-2B-Instruct, progressively optimized for Arabic through iterative fine-tuning on specialized synthetic datasets. Our leading model, QARI v0.2 achieves a the strongest performance with a Word Error Rate (WER) of 0.160, Character Error Rate (CER) of 0.061, and BLEU score of 0.737 on diacritically-rich texts. Qari-OCR demonstrates the strongest handling of \\emph{tashkīl}, diverse fonts, and document layouts, alongside impressive performance on low-resolution images. Further explorations (QARI v0.3) showcase strong potential for structural document understanding and handwritten text. This work delivers a marked improvement in Arabic OCR accuracy and efficiency, with all models and datasets released to foster further research.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/QARI-OCR-60A2"], "keywords": ["Arabic OCR; Vision–Language Models; Synthetic Data Augmentation;BLEU Score; Document Layout Analysis"], "openreview_url": "https://openreview.net/forum?id=TqdsapZj9q", "contribution_types": ["Analysis", "Low-resource", "Efficiency", "Dataset"]}, {"id": "77gkePTeBu", "title": "Can Large Language Models Infer Causal Relationships from Real-World Text?", "abstract": "Understanding and inferring causal relationships from texts is a core aspect of human cognition and is essential for advancing large language models (LLMs) towards artificial general intelligence. Existing work evaluating LLM causal reasoning primarily relies on synthetic or simplified texts with explicitly stated causal relationships. These texts typically feature short passages and few causal relations, failing to reflect the complexities of real-world reasoning. In this paper, we investigate whether LLMs are capable of inferring causal relationships from real-world texts. We develop a benchmark drawn from real-world academic literature, which includes diverse texts with respect to length, complexity (different levels of explicitness, number of causal events and relationships), and domain. To the best of our knowledge, our benchmark is the first-ever real-world dataset for this task. Our experiments on this dataset show that LLMs face significant challenges in inferring causal relationships from real-world text, with the best-performing model achieving an average F$_1$ score of only 0.535. Through systematic analysis across aspects of real-world text (explicitness, number of causal events and relationships, length of text, domain), our benchmark offers targeted insights for further research into advancing LLM causal reasoning.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Causal Reasoning", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=77gkePTeBu", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "MBBjonGhN7", "title": "ProKG: Triplet-Level Bayesian Reasoning over Knowledge Graphs for Robust LLM Safety", "abstract": "Safety mechanisms for large language models (LLMs) must reason under semantic uncertainty, particularly when benign inputs contain surface patterns associated with prompt injection or jailbreak attacks. Existing defenses often rely on keyword heuristics, latent boundary modeling, or fixed-hop knowledge graph reasoning, leading to over-defense, brittle decisions, and limited interpretability. We introduce ProKG, a probabilistic knowledge graph reasoning framework that formulates LLM safety assessment as Bayesian inference over complete ⟨subject, predicate, object⟩ triplets. Each triplet is treated as a random variable with an explicit posterior belief, and uncertainty is propagated via joint and conditional Bayesian updates rather than deterministic rules. Reasoning scope expands adaptively based on posterior probability mass rather than fixed-hop traversal. Experiments on NOTINJECT and ADVBENCH show that ProKG substantially reduces false-positive refusals on benign trigger-containing inputs while preserving strong robustness against adversarial jailbreaks, at practical inference cost. These results demonstrate that triplet-level probabilistic reasoning provides a principled, interpretable foundation for robust LLM safety under uncertainty.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ProKG-1248"], "keywords": ["LLM safety", "prompt injection", "jailbreak defense", "knowledge graphs", "Bayesian inference", "neuro-symbolic reasoning"], "openreview_url": "https://openreview.net/forum?id=MBBjonGhN7", "contribution_types": ["Analysis", "Engineering", "Theory"]}, {"id": "ECkJfyM2h2", "title": "Learning Complementary Action Pairs from Automotive Repair Manuals", "abstract": "Learning complementary action pairs is a fundamental prerequisite for procedural understanding in automotive repair.\nRepair manuals describe mechanical procedures as short, imperative instructions that implicitly encode inverse action relations, such as assembly--disassembly or tighten--loosen, without explicit semantic links.\nRecovering these relations is challenging due to highly repetitive documentation, concise phrasing, and a strong dependence on contextual cues.\nAlthough expert-defined heuristics can resolve a subset of complementary action pairs, such rules generalize poorly to linguistic variation and achieve only partial coverage in practice.\nWe study the problem of learning complementary action pairs from real-world automotive repair manuals.\nWe construct a dataset of complementary repair step pairs using automatic alignment followed by manual verification, and investigate learning-based formulations based on contrastive representation learning and generative modeling.\nExperimental results show that learned models capture complementary action relations beyond surface-level similarity and generalize more robustly than rule-based approaches under realistic industrial constraints.", "area": "Semantics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Complementary action relations", "Contrastive representation learning", "Generative modeling", "Industrial technical documentation"], "openreview_url": "https://openreview.net/forum?id=ECkJfyM2h2", "contribution_types": ["Engineering", "Dataset"]}, {"id": "gRTHn4RZWO", "title": "PiCSAR: Probabilistic Confidence Selection and Ranking for Reasoning Chains", "abstract": "Best-of-$n$ sampling improves the accuracy of large language models (LLMs) and large reasoning models (LRMs) by generating multiple candidate solutions and selecting the one with the highest reward. The key challenge for reasoning tasks is designing a scoring function that can identify correct reasoning chains without access to ground-truth answers. We propose Probabilistic Confidence Selection and Ranking for Reasoning Chains (PiCSAR): a simple, training-free method that scores each candidate generation using the joint log-likelihood of the reasoning and final answer. This method utilises both the scores of the reasoning path (*reasoning confidence*) and the final answer (*answer confidence*). PiCSAR achieves substantial gains across several benchmarks ($+11.7$ on AIME2024, $+9.81$ on AIME2025), outperforming baselines with at least 2x fewer samples in 20 out of 25 comparisons. Our analysis reveals that correct reasoning chains exhibit higher reasoning and answer confidence, justifying the effectiveness of PiCSAR.", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Reasoning", "Mathematical Reasoning", "Probabilistic Confidence", "Large Language Models", "Large Reasoning Models"], "openreview_url": "https://openreview.net/forum?id=gRTHn4RZWO", "contribution_types": []}, {"id": "7AK4lSIlLq", "title": "On the Effectiveness and Robustness of Open-Weight LLMs for Danish Hate Speech Detection", "abstract": "We present a study of open-weight large language models for Danish hate speech detection. \nWe evaluate four models (LLaMA, Mistral, Gemma, Qwen) across various prompting strategies, cross-prompt generalization, Danish orthographic effects, and robustness under balanced and imbalanced distributions. \nUnder balanced evaluation, models achieve strong performance with minimal fine-tuning, with Gemma excelling on format-based prompts and Qwen showing consistent performance across theory-driven patterns.\nSurprisingly, zero-shot fine-tuning matches or exceeds few-shot performance while introducing fewer failures, suggesting that in-context examples may interfere with fine-tuned representations. However, imbalanced evaluation reflecting real-world distributions reveals substantial degradation, with Gemma maintaining the strongest performance under class skew.\nTheory-informed prompts grounded in linguistic frameworks prove more robust under class imbalance than simple format-based patterns.\nCross-prompt generalization varies substantially by model, though format-constrained patterns consistently fail to transfer while semantically-grounded patterns show more robustness.\nASCII transliteration of Danish characters (æ, ø, å $\\rightarrow$ ae, oe, aa) significantly degrades performance, demonstrating that multilingual pre-training has established meaningful orthographic representations.\nThese findings demonstrate that strong balanced performance does not guarantee real-world readiness and we recommend complementing balanced training with imbalanced evaluation to estimate deployment performance.", "area": "Low-resource Methods for NLP", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["hate speech detection", "Danish", "low-resource languages", "large language models", "prompting strategies", "class imbalance"], "openreview_url": "https://openreview.net/forum?id=7AK4lSIlLq", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Data Analysis"]}, {"id": "JlCuc4y0yB", "title": "SLICEFORMER: Static Program Slicing Using Language Models With Dataflow-Aware Pretraining and Constrained Decoding", "abstract": "Static program slicing is a fundamental software engineering technique for isolating code relevant to specific variables. While recent learning-based approaches using language models (LMs) show promise in automating slice prediction, they suffer from inaccurate dependency modeling and unconstrained generation, where LMs fail to capture precise data flow relations and produce slices containing hallucinated tokens and statements.\nTo address these challenges, we propose SliceFormer, a novel approach that reformulates static program slicing as a sequence-to-sequence task using small language models such as CodeT5+.  introduces two key innovations that directly target the identified limitations. First, to improve dependency modeling, we design dataflow-aware pretraining objectives that leverage data flow graphs DFG to teach models data dependencies through dataflow-preserving statement permutation and dataflow-aware span corruption. Second, to eliminate hallucination, we develop a constrained decoding mechanism that enforces both lexical and syntactic constraints. We evaluate SliceFormer on Java and Python program slicing benchmarks, demonstrating consistent improvements over state-of-the-art baselines with up to 22% gain in ExactMatch.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/staticsliceT5-4E22"], "keywords": ["static program slicing", "pre-training", "constraint decoding", "language model."], "openreview_url": "https://openreview.net/forum?id=JlCuc4y0yB", "contribution_types": []}, {"id": "FhZGqzAjnE", "title": "KCVR: Knowledge-Centric Video Reconstruction for Structured Pedagogical Summarization via Dynamic Graph Planning", "abstract": "Existing video summarization methods mainly compress content for gist browsing, but they often break the prerequisite logic in instructional videos and induce logical inversions (e.g., conclusions before premises). We formalize this problem as Structure-Pedagogical Reconstruction (\\textbf{SPR}). SPR raises two challenges: (1) \\textbf{Structure Hallucination}, where retrieved knowledge is topologically valid but not evidence-grounded by the blackboard; and (2) \\textbf{Logical Inversion}, where soft prompt-level graph injection fails to enforce prerequisite order during decoding. To address these challenges, we propose \\textbf{K}nowledge-\\textbf{C}entric \\textbf{V}ideo \\textbf{R}econstruction \\textbf{(KCVR)}, a Plan-then-Generate neuro-symbolic framework that decouples epistemic planning from content generation. KCVR prunes a Dual-Layer Epistemic Graph into a minimal video-supported plan, then realizes the plan with visually anchored attention and topology-constrained decoding. We additionally release \\textbf{EduStruct}, a 10-discipline benchmark for SPR and structure-centric evaluation. Experiments show that KCVR outperforms strong end-to-end baselines on Knowledge Progression Consistency and Learning Objective Coverage. Our code and data are available at \\url{https://anonymous.4open.science/r/video_sum-474D/}.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/video_sum-474D"], "keywords": ["multimodal summarization;Mathematical", "Symbolic", "Neurosymbolic", "and Logical Reasoning;Generation;knowledge graphs"], "openreview_url": "https://openreview.net/forum?id=FhZGqzAjnE", "contribution_types": ["Engineering", "Dataset"]}, {"id": "f1moN9JXKk", "title": "From Facts to Conclusions : Integrating Deductive Reasoning in Retrieval-Augmented LLMs", "abstract": "Retrieval-Augmented Generation (RAG) grounds large language models (LLMs) in external evidence, but fails when retrieved sources conflict or contain outdated or subjective information. Prior work address these issues independently but lack unified reasoning supervision. We propose a reasoning-trace-augmented RAG framework that adds structured, interpretable reasoning across three stages: (1) document-level adjudication, (2) conflict analysis, and (3) grounded synthesis, producing citation-linked answers or justified refusals.A Conflict-Aware Trust-Score (CATS) pipeline is introduced which evaluates groundedness, factual correctness, refusal accuracy, and conflict-behavior alignment using an LLM-as-a-Judge. Our 539-query reasoning dataset and evaluation pipeline establishes a foundation for conflict-aware, interpretable RAG systems. Experimental results demonstrate substantial gains over baselines, most notably with Qwen, where Supervised Fine-Tuning (SFT) improved End-to-End answer correctness from 0.069 to 0.883 and behavioral adherence from 0.074 to 0.722.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["retrieval-augmented generation", "conflict-aware reasoning", "trustworthy RAG systems", "evidence adjudication", "interpretable reasoning traces", "grounded question answering"], "openreview_url": "https://openreview.net/forum?id=f1moN9JXKk", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "aeuZnD35eV", "title": "XY-Tokenizer: Mitigating the Semantic-Acoustic Conflict in Low-Bitrate Speech Codecs", "abstract": "Speech codecs provide an important interface between continuous speech signals and large language models. An ideal codec for speech language models should not only preserve acoustic information but also capture rich semantic information. However, existing codecs struggle to balance these objectives at low bitrates. We propose $\\textbf{XY-Tokenizer}$, a low-bitrate speech codec (around 1 kbps) trained with a structured multi-stage, multi-task strategy that aligns discrete speech representations with text while preserving fine-grained acoustic details for reconstruction. This design explicitly mitigates the semantic--acoustic conflict observed in prior low-bitrate codecs. Experiments show that XY-Tokenizer achieves stronger semantic alignment than representative semantic-distillation codecs such as SpeechTokenizer and Mimi, while maintaining high-quality speech reconstruction across both clean and out-of-distribution conditions. Furthermore, XY-Tokenizer consistently outperforms existing low-bitrate codecs in LLM-based speech understanding and generation tasks, demonstrating its effectiveness as a general-purpose speech representation for speech–language modeling.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["speech tokenizer", "speech representations", "speech language models"], "openreview_url": "https://openreview.net/forum?id=aeuZnD35eV", "contribution_types": ["Engineering"]}, {"id": "un8yshVuBY", "title": "Parallel Context-of-Experts Decoding for Retrieval Augmented Generation", "abstract": "Retrieval Augmented Generation faces a trade-off: concatenating documents in a long prompt enables multi-document reasoning but creates prefill bottlenecks, while encoding document KV caches separately offers speed but breaks cross-document interaction. We propose Parallel Context-of-Experts Decoding (Pced), a training-free framework that shifts evidence aggregation from the attention mechanism to the decoding. Pced treats retrieved documents as isolated \"experts\", synchronizing their predictions via a novel retrieval-aware contrastive decoding rule that weighs expert logits against the model prior. This approach recovers cross-document reasoning capabilities without constructing a shared attention across documents.", "area": "RAG", "paper_type": "Short", "has_code": true, "code_links": ["https://anonymous.4open.science/r/context-of-experts"], "keywords": ["Retrieval-Augmented Generation", "KV caching", "Efficient inference", "Parallel decoding", "Context-aware decoding"], "openreview_url": "https://openreview.net/forum?id=un8yshVuBY", "contribution_types": ["Efficiency"]}, {"id": "9hLEqyeONN", "title": "Towards Better Legal Reasoning LLMs: Signal Balancing and Reward Scheduling", "abstract": "In the legal domain, large language models (LLMs) can improve reliability and interpretability by generating explicit reasoning traces. However, training LLMs to produce high-quality reasoning traces remains challenging. Existing supervised fine-tuning methods struggle when reasoning traces are significantly longer than final answers, as the learning signal for the answer becomes diluted. Meanwhile, reinforcement learning methods such as Group Relative Policy Optimization (GRPO) are not without drawbacks, facing issues including costly reward design, performance plateaus, and reward hacking. To address these challenges, we propose a two-stage training framework. In Stage I, JurisCoT-SFT employs a length-normalized dual objective to balance learning signals between reasoning traces and final answers. In Stage II, Lifecycle-Aware Backtrackable Policy Optimization dynamically activates and deactivates auxiliary reward signals based on their impact on primary performance metrics, enabling efficient reward utilization without manual intervention. Trained on 2.7 million real-world judicial decision triplets and evaluated on a professionally annotated benchmark of 3,462 cases, our method is fine-tuned on Qwen3-8B and achieves state-of-the-art performance on average across evaluation metrics, outperforming both specialized legal LLMs and larger general-purpose models.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["reasoning traces", "dual objective learning", "legal NLP", "judicial decision modeling"], "openreview_url": "https://openreview.net/forum?id=9hLEqyeONN", "contribution_types": ["Analysis", "Engineering"]}, {"id": "A5TJ9ySXuK", "title": "RiskBridge: Turning CVEs into Business-Aligned Patch Priorities", "abstract": "Enterprises are confronted with an unprecedented escalation in cybersecurity vulnerabilities, with thousands of new CVEs disclosed each month. Conventional prioritization frameworks such as CVSS offer static severity metrics that fail to account for exploit probability, compliance urgency, and operational impact, resulting in inefficient and delayed remediation. This paper introduces RiskBridge, an explainable and compliance-aware vulnerability management framework that integrates multi-source intelligence from CVSS v4, EPSS, and CISA KEV to produce dynamic, business-aligned patch priorities. RiskBridge employs a probabilistic Zero-Day Exposure Simulation (ZDES) model to forecast near-term exploit likelihood, a Policy-as-Code Engine to translate regulatory mandates (e.g., PCI DSS, NIST SP 800-53) into automated SLA logic, and an ROI-driven Optimizer to maximize cumulative risk reduction per remediation effort. Experimental evaluations using live CVE datasets demonstrate an 88% reduction in residual risk, an 18-day improvement in SLA compliance, and a 35% increase in remediation efficiency compared to state-of-the-art commercial baselines. These findings validate RiskBridge as a practical and auditable decision-intelligence system that unifies probabilistic modeling, compliance reasoning, and optimization analytics.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["vulnerability management", "cybersecurity", "risk prioritization", "explainable AI", "compliance automation", "Machine learning"], "openreview_url": "https://openreview.net/forum?id=A5TJ9ySXuK", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "CtfVyTz4Gf", "title": "ReasAlign: Reasoning Enhanced Safety Alignment against Prompt Injection Attack", "abstract": "Large Language Models (LLMs) have enabled the development of powerful agentic systems capable of automating complex workflows across various fields. However, these systems are highly vulnerable to indirect prompt injection attacks, where malicious instructions embedded in external data can hijack agent behavior. In this work, we present ReasAlign, a model-level solution to improve safety alignment against indirect prompt injection attacks. The core idea of ReasAlign is to incorporate structured reasoning steps to analyze user queries, detect conflicting instructions, and preserve the continuity of the user’s intended tasks to defend against indirect injection attacks. To further ensure reasoning logic and accuracy, we introduce a test-time scaling mechanism with a preference-optimized judge model that scores reasoning steps and selects the best trajectory. Comprehensive evaluations across various benchmarks show that ReasAlign maintains utility comparable to an undefended model while consistently outperforming Meta SecAlign, the strongest prior guardrail. On the representative open-ended CyberSecEval2 benchmark, which includes multiple prompt-injected tasks, ReasAlign achieves 94.6% utility and only 3.6% ASR, far surpassing the state-of-the-art defensive model of Meta SecAlign (56.4% utility and 74.4% ASR). These results demonstrate that ReasAlign achieves the best trade-off between security and utility, establishing a robust and practical defense against prompt injection attacks in real-world agentic systems. Our code and experimental results could be found at https://anonymous.4open.science/r/ReasAlign-DDC4.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ReasAlign-DDC4"], "keywords": ["prompt injection attack", "defense", "LLM safety"], "openreview_url": "https://openreview.net/forum?id=CtfVyTz4Gf", "contribution_types": ["Engineering"]}, {"id": "8s2ojXy1f9", "title": "The GDN-CC Dataset: Automatic Corpus Clarification for AI-enhanced Democratic Citizen Consultations", "abstract": "LLMs are ubiquitous in modern NLP, and while their applicability extends to texts produced for democratic activities such as online deliberations or large-scale citizen consultations, ethical questions have been raised for their usage as analysis tools. We continue this line of research with two main goals: (a) to develop resources that can help standardize citizen contributions in public forums at the $\\textbf{pragmatic level}$, and make them more amenable for, e.g., topic modeling and political analysis; (b) to study how well this standardization can reliably be performed by small,  open-weights LLMs, i.e. models that can be run locally and transparently with limited resources. We accordingly introduce $\\textbf{Corpus Clarification}$ as a preprocessing framework for large-scale consultation data that transforms noisy, multi-topic contributions into structured, self-contained argumentative units ready for downstream analysis. We present $\\textbf{GDN-CC}$, a manually-curated dataset of 1,231 contributions to the French $\\textit{Grand Débat National}$, making up 2,285 argumentative units, annotated for argumentative structure, and manually clarified. We then show that finetuned Small Language Models match or outperform LLMs on reproducing these annotations, and measure their usability for an opinion clustering task. We finally release $\\textbf{GDN-CC-large}$, an automatically annotated corpus of 240k contributions, the largest annotated democratic consultation dataset to date.", "area": "Social NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Democratic AI", "Corpus Clarification", "Argument Mining"], "openreview_url": "https://openreview.net/forum?id=8s2ojXy1f9", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "FaxG3PCBxE", "title": "InFi-Check: Interpretable and Fine-Grained Fact-Checking of LLMs", "abstract": "Large language models (LLMs) often hallucinate, yet most existing fact-checking methods treat factuality evaluation as a binary classification problem, offering limited interpretability and failing to capture fine-grained error types.\nIn this paper, we introduce InFi-Check, a framework for interpretable and fine-grained fact-checking of LLM outputs.\nSpecifically, we first propose a controlled data synthesis pipeline that generates high-quality data featuring explicit evidence, fine-grained error type labels, justifications, and corrections. \nBased on this, we further construct large-scale training data and a manually verified benchmark InFi-Check-FG for fine-grained fact-checking of LLM outputs.\nBuilding on these high-quality training data, we further propose InFi-Checker, which can jointly provide supporting evidence, classify fine-grained error types, and produce justifications along with corrections. \nExperiments show that InFi-Checker achieves state-of-the-art performance on InFi-Check-FG and strong generalization across various downstream tasks, significantly improving the utility and trustworthiness of factuality evaluation.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["fact-checking", "hallucination detection", "automatic evaluation", "data synthesis", "benchmark"], "openreview_url": "https://openreview.net/forum?id=FaxG3PCBxE", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "M77jHSniJU", "title": "Enabling Stroke-Level Structural Analysis of Hieroglyphic Scripts without Language-Specific Priors", "abstract": "Hieroglyphs, as logographic writing systems, encode rich semantic and cultural information within their internal structural composition. Yet, current advanced Large Language Models (LLMs) and Multimodal LLMs (MLLMs) usually remain structurally blind to this information. LLMs process characters as textual tokens, while MLLMs additionally view them as raw pixel grids. Both fall short to model the underlying logic of character strokes. Furthermore, existing structural analysis methods are often script-specific and labor-intensive. In this paper, we propose Hieroglyphic Stroke Analyzer (HieroSA), a novel and generalizable framework that enables MLLMs to automatically derive stroke-level structures from character bitmaps without handcrafted data. It transforms modern logographic and ancient hieroglyphs character images into explicit, interpretable line-segment representations in a normalized coordinate space, allowing for cross-lingual generalization. Extensive experiments demonstrate that HieroSA effectively captures character-internal structures and semantics, bypassing the need for language-specific priors. Experimental results highlight the potential of our work as a graphematics analysis tool for a deeper understanding of hieroglyphic scripts.", "area": "Social NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Hieroglyphs", "Logograms", "Stroke Representation", "Multimodal Large Language Models"], "openreview_url": "https://openreview.net/forum?id=M77jHSniJU", "contribution_types": ["Engineering"]}, {"id": "XaFh3wa04f", "title": "AgentDebug: Where LLM Agents Fail and How They can Learn From Failures", "abstract": "Large Language Models (LLMs) agents, which integrate planning, memory, reflection, and tool-use modules, have shown promise in solving complex, multi-step tasks. Yet their sophisticated architectures amplify vulnerability to cascading failures, where a single root-cause error propagates through subsequent decisions, leading to task failure. Current systems lack a framework that can comprehensively understand agent error in a modular and systemic way, and therefore fail to detect these errors accordingly. We address this gap with three contributions. First, we introduce the AgentErrorTaxnomy, a modular classification of failure modes spanning memory, reflection, planning, action, and system-level operations. Second, we construct the Agent Error Benchmark, the first dataset of systematically annotated failure trajectories from ALFWorld, GAIA, and WebShop, grounding error analysis in real-world agent rollouts. Third, we propose AgentDebug, a debugging framework that isolates root-cause failures and provides corrective feedback, enabling agents to recover and iteratively improve. Experiments on AgentErrorBench show that AgentDebug achieves 24% higher all-correct accuracy and 17% higher step accuracy compared to the strongest baseline. Beyond detection, the targeted feedback generated by AgentDebug enables LLM agents to iteratively recover
