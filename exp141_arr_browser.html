rdware-efficient kernels like FlashAttention. In this work, we observe that tokens evolve toward semantic fixing points, making further processing redundant. To this end, we introduce Delta Attention Selective Halting (DASH), a training-free policy that monitors the layer-wise update dynamics of the self-attention mechanism to selectively halt stabilized tokens. Extensive evaluation confirms that DASH generalizes across language and vision benchmarks, delivering significant prefill speedups while preserving model accuracy and hardware efficiency.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Efficient AI"], "openreview_url": "https://openreview.net/forum?id=OQiuouhVPB", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "c6hfizFTFf", "title": "Conflict-Suppressed RAG: A Simple Decoding-Time Framework for Faithful Retrieval-Augmented Generation", "abstract": "Retrieval-Augmented Generation (RAG) improves the factual accuracy of large language models (LLMs) by grounding responses in external evidence. However, when retrieved context conflicts with models’ internal parametric knowledge, LLMs may still generate answers that contradict the provided evidence, posing a key challenge to contextual faithfulness and the reliability of RAG systems. Motivated by recent mechanistic findings on the distinct propagation and progressive accumulation of parametric and contextual signals in LLMs, we propose Conflict-Suppressed RAG (CSRAG), a simple, training-free, decoding-time framework for resolving knowledge conflicts. CSRAG biases generation toward retrieved evidence by suppressing tokens associated with parametric knowledge while boosting tokens from the context via two complementary logits processors. Experiments on six challenging faithfulness benchmarks demonstrate that CSRAG consistently achieves state-of-the-art or near state-of-the-art performance across multiple backbone LLMs, while remaining fully training-free and lightweight.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Retrieval-Augmented Generation", "Knowledge Conflict", "Large Language Models", "Faithfulness"], "openreview_url": "https://openreview.net/forum?id=c6hfizFTFf", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "r9PvVERCnZ", "title": "AMO-Bench: Large Language Models Still Struggle in High School Math Competitions", "abstract": "We present **AMO-Bench**, an **A**dvanced **M**athematical reasoning benchmark with **O**lympiad level or even higher difficulty, comprising 50 human-crafted problems.\nExisting benchmarks have widely leveraged high school math competitions for evaluating mathematical reasoning capabilities of large language models (LLMs).\nHowever, many existing math competitions are becoming less effective for assessing top-tier LLMs due to performance saturation (e.g., AIME24/25).\nTo address this, AMO-Bench introduces more rigorous challenges by ensuring all 50 problems are (1) cross-validated by experts to meet at least the International Mathematical Olympiad (IMO) difficulty standards, and (2) entirely original problems to prevent potential performance leakages from data memorization.\nExperimental results across 36 LLMs on AMO-Bench highlights three key findings:\n(1) high-level mathematical reasoning remains challenging for current LLMs, with even the best-performing model achieving only 63.1% accuracy and most LLMs scoring below 50%;\n(2) scaling test-time compute remains a highly effective strategy for substantially improving reasoning performances,\nand (3) open-source models are progressively narrowing the performance gap with proprietary models.\nAdditionally, we conduct further analysis about reasoning efficiency, volatility, and cross-lingual robustness, providing deeper insights behind the reasoning performances.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Reasoning Models", "Mathematical Reasoning", "Math Evaluation"], "openreview_url": "https://openreview.net/forum?id=r9PvVERCnZ", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "k6SSQYZ6Ak", "title": "RepoShapley: Shapley-Enhanced Context Filtering for Repository-Level Code Completion", "abstract": "Repository-level code completion benefits from retrieval-augmented generation (RAG). However, controlling cross-file evidence is difficult because chunk utility is often interaction-dependent: some snippets help only when paired with complementary context, while others harm decoding when they conflict. We propose RepoShapley, a coalition-aware context filtering framework supervised by Shapley-style marginal contributions. Our module ChunkShapley constructs offline labels by (i) single-chunk probing with teacher-forced likelihood to estimate signed, weighted effects, (ii) a surrogate game that captures saturation and interference, (iii) exact Shapley computation for small retrieval sets, and (iv) bounded post-verification that selects a decoding-optimal coalition using the frozen generator. We distill verified $KEEP$ or $DROP$ decisions and retrieval triggering into a single model via discrete control tokens. Experiments across benchmarks and backbones show that RepoShapley improves completion quality while reducing harmful context and unnecessary retrieval. Code: https://anonymous.4open.science/r/a7f3c9.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/a7f3c9"], "keywords": ["Repository-Level Code Completion", "Retrieval-Augmented Generation", "Large Language Models", "Context Filtering"], "openreview_url": "https://openreview.net/forum?id=k6SSQYZ6Ak", "contribution_types": ["Analysis", "Engineering"]}, {"id": "lu2LIFlEx2", "title": "ScreenCoder: Advancing Visual-to-Code Generation for Front-End Automation via Modular Multimodal Agents", "abstract": "Automating the transformation of user interface (UI) designs into front-end code holds significant promise for accelerating software development and democratizing design workflows. While multimodal large language models (MLLMs) can translate images to code, they often fail on complex UIs, struggling to unify visual perception, layout planning, and code synthesis within a single monolithic model, which leads to frequent perception and planning errors. To address this, we propose ScreenCoder, a modular multi-agent framework that decomposes the task into three interpretable stages: grounding, planning, and generation. By assigning these distinct responsibilities to specialized agents, our framework achieves significantly higher robustness and fidelity than end-to-end approaches. Furthermore, ScreenCoder serves as a scalable data engine, enabling us to generate high-quality image-code pairs. We use this data to fine-tune open-source MLLM via a dual-stage pipeline of supervised fine-tuning and reinforcement learning, demonstrating substantial gains in its UI generation capabilities. Extensive experiments demonstrate that our approach achieves state-of-the-art performance in layout accuracy, structural coherence, and code correctness.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Agents", "Visual-to-code"], "openreview_url": "https://openreview.net/forum?id=lu2LIFlEx2", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "3FXnyZlqQz", "title": "Query-Aware Graph Attention for Precise Subgraph Retrieval in Knowledge-Augmented Reasoning", "abstract": "Large language models (LLMs) increasingly rely on external knowledge to mitigate hallucinations, yet retrieving precise multi-hop evidence for knowledge-augmented reasoning remains difficult. Existing Knowledge Graph (KG)-based Retrieval-Augmented Generation (RAG) systems insufficiently model the interaction between query semantics and relation types, resulting in imprecise subgraph retrieval and unstable reasoning. We propose Query-aware Subgraph Retrieval Augmented Generation (QSRAG), a retrieval framework built upon a Query-Relational Graph Attention Network (QR-GAT) that integrates query semantics and relation embeddings directly into the attention mechanism, enabling fine-grained triple scoring and scalable subgraph construction. This query–relation conditioning improves relevance estimation and suppresses noisy edges, producing faithful reasoning subgraphs. Experiments on WebQSP and CWQ establish new state-of-the-art results in both Triple Recall and Answer Recall, and significantly enhance LLMs reasoning accuracy without finetuning. These findings underscore the effectiveness of modeling query–relation interactions for reliable knowledge-augmented reasoning.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Knowledge Graph Question Answering", "Retrieval-Augmented Generation", "Graph Attention Networks", "Multi-hop Reasoning"], "openreview_url": "https://openreview.net/forum?id=3FXnyZlqQz", "contribution_types": ["Analysis", "Engineering"]}, {"id": "0uTSZN4Kyc", "title": "Causality-aware Deconfounded NER Network for Chinese Named Entity Recognition", "abstract": "Chinese Named Entity Recognition (Chinese NER) faces challenges such as ambiguous entity boundaries and limited classification accuracy, mainly due to  the lack of clear word boundaries and the strong coupling between semantic features and interfering features.  To address the interference caused by confounding factors like domain bias, this paper proposes a Causality-aware Deconfounded NER network (CDNER). By integrating multi-granularity feature extraction, causal deconfounding, and prototype learning into the CRF (Conditional Random Field) model, the network enhances the model's recognition accuracy and outputs more robust entity representations. Experimental results demonstrate that CDNER achieves performance close to the current state-of-the-art, especially excelling in complex text environments.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Chinese Named Entity Recognition", "Causal Deconfounding", "Multi-granularity Feature Extraction", "Prototype Contrastive Learning", "Complex Text Processing"], "openreview_url": "https://openreview.net/forum?id=0uTSZN4Kyc", "contribution_types": []}, {"id": "IGW72OnsbW", "title": "SE-Search: Self-Evolving Search Agent via Memory and Dense Reward", "abstract": "Retrieval augmented generation (RAG) reduces hallucinations and factual errors in large language models (LLMs) by conditioning generation on retrieved external knowledge. Recent search agents further cast RAG as an autonomous, multi-turn information-seeking process. However, existing methods often accumulate irrelevant or noisy documents and rely on sparse reinforcement learning signals. We propose Self-Evolving Search, a Self-Evolving Search agent that improves online search behavior through three components, memory purification, atomic query training, and dense rewards. SE-Search follows a Think-Search-Memorize strategy that retains salient evidence while filtering irrelevant content. Atomic query training promotes shorter and more diverse queries, improving evidence acquisition. Dense rewards provide fine-grained feedback that speeds training. Experiments on single-hop and multi-hop question answering benchmarks show that SE-Search-3B outperforms strong baselines, yielding a 10.8 point absolute improvement and a 33.8% relative gain over Search-R1.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Question Answer", "Search Agent", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=IGW72OnsbW", "contribution_types": ["Analysis", "Engineering"]}, {"id": "KxmvIEcnW9", "title": "TFD: A Comprehensive Structured Tibetan Foundation Dataset for Low-Resource Language Processing and Large-Scale Modeling", "abstract": "Large language models (LLMs) have achieved remarkable success in high-resource languages, yet progress for Tibetan remains severely constrained by the lack of large-scale, high-quality, and structured data. Existing Tibetan resources are fragmented, domain-limited, and insufficient to support modern LLM pipelines that require pretraining, instruction tuning, safety alignment, and reasoning supervision. We introduce the Tibetan Foundation Dataset (TFD), a comprehensive, large-scale, and expert-curated dataset explicitly designed for Tibetan large language modeling. TFD comprises two complementary components: TIBSTC, a unified corpus of over 11 billion tokens spanning literature, law, medicine, religion, and everyday communication, and TIBSTC-CoT, a large-scale Tibetan chain-of-thought dataset that supports explicit multi-step reasoning across diverse domains. Unlike prior Tibetan datasets, TFD is structurally organized to support the full LLM development lifecycle, including pretraining, supervised fine-tuning, safety alignment, and preference optimization. We demonstrate the utility of TFD by training the Sun-Shine family of Tibetan LLMs and evaluating them on understanding, safety, reasoning, and generation tasks. Experimental results show consistent improvements over strong open-source and proprietary baselines, underscoring the importance of large-scale, structured data for low-resource language modeling. We release TFD to facilitate reproducible research and the development of robust, culturally aligned Tibetan LLMs.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Dataset", "LLM", "Tibetan NLP", "Low Resources NLP"], "openreview_url": "https://openreview.net/forum?id=KxmvIEcnW9", "contribution_types": ["Low-resource", "Dataset", "Data Analysis"]}, {"id": "VMzXQ8ZoH9", "title": "The Green Reasoner: Cognition-Guided Policy Optimization for Efficient LLM Reasoning", "abstract": "Balancing reasoning accuracy and efficiency in large language models (LLMs) is a critical objective. Reinforcement learning (RL) has emerged as a leading paradigm to achieve this goal. However, current RL-based methods cannot effectively distinguish between redundant and essential reasoning paths. Moreover, these methods often lack flexibility in handling samples with different difficulty levels. To address these limitations, we present Cognition-Guided Policy Optimization (CGPO), which consists of Cognitive Utility Reward (CUR) and Cognition-Adaptive Regulation (CAR). Specifically, CUR designs a multiplicative reward that scales correctness rewards with a non-linear length penalty to reduce redundancy. CAR adaptively adjusts Kullback-Leibler (KL) regularization based on real-time cognitive difficulty of each sample. Extensive experiments on nine datasets across three reasoning tasks demonstrate that CGPO achieves an effective balance between efficiency and reasoning accuracy. For instance, on mathematical reasoning benchmarks using the DeepScaleR-Preview-1.5B model, CGPO outperforms other methods by 0.2 to 3.2 points in average Pass@1 and reduces token usage by 0.7\\% to 38.4\\%.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Efficient Reasoning", "Reinforcement Learning", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=VMzXQ8ZoH9", "contribution_types": ["Engineering"]}, {"id": "nPk6u0CPsY", "title": "Empathy Applicability Modeling for General Health Queries", "abstract": "LLMs are increasingly being integrated into clinical workflows, yet they often lack clinical empathy, an essential aspect of effective doctor–patient communication. Existing NLP frameworks focus on reactively labeling empathy in doctors' responses but offer limited support for anticipatory modeling of empathy needs, especially in general health queries. We introduce the Empathy Applicability Framework (EAF), a theory-driven approach that classifies patient queries in terms of the applicability of emotional reactions and interpretations, based on clinical, contextual, and linguistic cues. We release a benchmark of real patient queries, dual-annotated by Humans and GPT-4o. In the subset with human consensus, we also observe substantial human–GPT alignment. To validate EAF, we train classifiers on human-labeled and GPT-only annotations to predict empathy applicability, achieving strong performance and outperforming the heuristic and zero-shot LLM baselines. Error analysis highlights persistent challenges: implicit distress, clinical-severity ambiguity, and contextual hardship, underscoring the need for multi-annotator modeling, clinician-in-the-loop calibration, and culturally diverse annotation. EAF provides a framework for identifying empathy needs $before$ response generation, establishes a benchmark for anticipatory empathy modeling, and enables supporting empathetic communication in asynchronous healthcare.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Empathy modeling", "clinical NLP", "large language models", "anticipatory assessment", "human–AI alignment", "dataset and annotation"], "openreview_url": "https://openreview.net/forum?id=nPk6u0CPsY", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "rQI15O7a0R", "title": "From Logical to Computational Sparsity: Structure-Aware Block-Sparse Attention for Long-Code Completion", "abstract": "Code Large Language Models face critical Time-To-First-Token (TTFT) latency challenges when handling long code completion due to the quadratic complexity ($O(n^2)$) of attention mechanisms. While existing sparse attention methods attempt to address this issue, they suffer from three key limitations: (1) general sparse patterns cause excessive accuracy degradation without considering code structure, (2) code-related methods achieve only logical sparsity without actual computational speedup, and (3) limited adaptation to complex scenarios such as repository-level completion. We propose **SabreCoder**, a training-free **S**tructure-**a**ware **B**lock-spa**r**s**e** attention mechanism that bridges the gap between logical and computational sparsity. SabreCoder parses code into semantic chunks, constructs chunk-level sparse patterns through dependency analysis and similarity matching, and maps them to GPU-friendly block-sparse formats. Extensive experiments on LCC and CrossCodeEval benchmarks demonstrate that SabreCoder reduces TTFT by 45-55% while maintaining accuracy within 3% of dense attention.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SabreCoder"], "keywords": ["Long Code Completion", "Code Structure", "Sparse Attention"], "openreview_url": "https://openreview.net/forum?id=rQI15O7a0R", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "auxmtaVmnA", "title": "F-Actor: Controllable Conversational Behavior in Full-Duplex Models", "abstract": "Spoken conversational systems require more than accurate speech generation to have human-like conversations: to feel natural and engaging, they must produce conversational behaviour that adapts dynamically to the context. Current spoken conversational systems, however, rarely allow such customization, limiting their naturalness and usability. In this work, we present the first open, instruction-following full-duplex conversational speech model that can be trained efficiently under typical academic resource constraints. By keeping the audio encoder frozen and finetuning only the language model, our model requires just 2,000 hours of data, without relying on large-scale pretraining or multi-stage optimization. The model can follow explicit instructions to control speaker voice, conversation topic, conversational behaviour (e.g., backchanneling and interruptions), and dialogue initiation. We propose a single-stage training protocol and systematically analyze design choices. Both the model and training code will be released to enable reproducible research on controllable full-duplex speech systems.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["full-duplex modelling", "instruction-following"], "openreview_url": "https://openreview.net/forum?id=auxmtaVmnA", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "RK0klpYUWr", "title": "Gradient-Guided Multi-Judge Prompt Optimization", "abstract": "Automatic prompt optimization is a practical alternative to fine-tuning for adapting large language models (LLMs), yet existing approaches often trade off signal quality against computational cost. Methods that rely on generative feedback can be informative but expensive to scale, while sampling-based optimization typically requires many evaluations and exhibits high variance. Even loss-driven prompt optimization remains limited by costly segment attribution that scales with prompt length and by overfitting to a single evaluator, which weakens transfer across model families and domains. We propose Gradient-guided Multi-judge Prompt Optimization (GMPO), a scalable framework that improves both efficiency and robustness. GMPO uses a first-order gradient approximation to score segment importance in a continuous masking direction, requiring only one forward and one backward pass. GMPO further employs a generate multi-judge design in which candidate prompt edits are proposed by a generator and selected using cross-entropy losses aggregated from multiple lightweight judge models, reducing evaluator bias and improving generalization. Experiments across math, reasoning, instruction-following evaluation, and safety robustness benchmarks demonstrate consistent gains with substantially lower optimization overhead. We will publicly release our code.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Prompt Optimization;Language Modeling"], "openreview_url": "https://openreview.net/forum?id=RK0klpYUWr", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "06mfJ71hmo", "title": "Adapt to Thrive! Adaptive Power-Mean Policy Optimization for Improved LLM Reasoning", "abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) is an essential paradigm that enhances the reasoning capabilities of Large Language Models (LLMs). However, existing methods typically rely on static policy optimization schemes that misalign with the model's evolving reasoning capabilities. To address this issue, we propose Adaptive Power-Mean Policy Optimization (APMPO), which comprises two main innovations: Power-Mean Policy Optimization (PMPO) and Feedback-Adaptive Clipping (FAC). Specifically, PMPO introduces a generalized power-mean objective. This enables the model to adaptively transition from the signal‑amplifying behavior of the arithmetic mean to the consistency‑enforcing behavior of the geometric mean. FAC adaptively adjusts clipping bounds based on real-time reward statistics to overcome the limitations of static mechanisms. Capitalizing on these innovations, APMPO improves learning dynamics and reasoning performance. Extensive experiments on nine datasets across three reasoning tasks showcase the superiority of APMPO over state-of-the-art RLVR-based baselines. For instance, APMPO boosts the average Pass@1 score on mathematical reasoning benchmarks by 3.0 points compared to GRPO when using Qwen2.5-3B-Instruct.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Power-Mean Objective", "Improved Reasoning", "Reinforcement Learning", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=06mfJ71hmo", "contribution_types": ["Engineering"]}, {"id": "M3mSzWOwoW", "title": "CodeWiki: Evaluating AI’s Ability to Generate Holistic Documentation for Large-Scale Codebases", "abstract": "Comprehensive software documentation is crucial yet costly to produce. Despite recent advances in large language models (LLMs), generating holistic, architecture-aware documentation at the repository level remains challenging due to complex and evolving codebases that exceed LLM context limits. Existing automated methods struggle to capture rich semantic dependencies and architectural structure. We present $\\textbf{CodeWiki}$, a unified framework for automated repository-level documentation across seven mainstream programming languages. CodeWiki combines top-down hierarchical decomposition with a divide-and-conquer agent system to preserve architectural context and scale documentation generation, and a bottom-up synthesis that integrates textual descriptions with visual artifacts such as architecture and data-flow diagrams. We also introduce $\\textbf{CodeWikiBench}$, a benchmark with hierarchical rubrics and LLM-based evaluation protocols. Experiments show that CodeWiki achieves a 68.79\\% quality score with proprietary models, outperforming the closed-source DeepWiki baseline by 4.73\\%, with especially strong gains on scripting languages. CodeWiki is released as open source to support future research.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Automated Documentation Generation", "Documentation Generation"], "openreview_url": "https://openreview.net/forum?id=M3mSzWOwoW", "contribution_types": ["Engineering"]}, {"id": "s3r7yk9KUW", "title": "Which Pieces Does Unigram Tokenization Really Need?", "abstract": "The Unigram tokenization algorithm offers a probabilistic alternative to the greedy heuristics of Byte-Pair Encoding.\nDespite its theoretical elegance, its implementation in practice is complex, limiting its adoption to the SentencePiece package and adapters thereof.\nWe bridge this gap between theory and practice by providing a clear guide to implementation and parameter choices.\nWe also identify a simpler algorithm that accepts slightly higher training loss in exchange for improved compression.", "area": "Phonology", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["tokenization", "unigram"], "openreview_url": "https://openreview.net/forum?id=s3r7yk9KUW", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "tAfKHliovR", "title": "EmModBench: Benchmarking Cross-Modal Decision Consistency for Embodied Agents", "abstract": "Vision-Language Models (VLMs) are increasingly used as the cognitive core of embodied agents. In real deployments, agents often receive fragmented observations: the same decision-critical cue may appear as a raw visual signal in one episode, but as a structured textual message from upstream modules (maps or planners) in another. When each modality alone is sufficient, a reliable agent should make modality-invariant decisions, producing the same correct action across modalities. Existing benchmarks mainly test static knowledge retrieval or unimodal perception, leaving cross-modal decision consistency for embodied reasoning underexplored. To bridge this gap, we introduce EmModBench, a diagnostic benchmark for decision consistency under embodied input fragmentation. EmModBench evaluates Text-only, Image-only, and Image+Text settings, built via a rigorous pipeline with human auditing and strengthened by bidirectional verification. It contains 4,406 multiple-choice questions spanning five embodied competency domains, and our evaluation runs approximately 280,000 inference calls across 15 representative VLMs. Results show multimodal fusion is not reliably beneficial and can even hurt due to modality interference; models may also be consistently wrong across modalities, indicating brittle cross-modal grounding even with high unimodal accuracy.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Cross-Modal Consistency", "Multimodal Fusion", "Benchmarking & Evaluation", "Embodied Planning", "Vision–Language Models"], "openreview_url": "https://openreview.net/forum?id=tAfKHliovR", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "fr8u8LnM2x", "title": "Feedback-Driven Tool-Use Improvements in Large Language Models via Automated Build Environments", "abstract": "Effective tool use is essential for large language models (LLMs) to interact with their environment. However, progress is limited by the lack of efficient reinforcement learning (RL) frameworks specifically designed for tool use, due to challenges in constructing stable training environments and designing verifiable reward mechanisms. To address this, we propose an automated environment construction pipeline, incorporating scenario decomposition, document generation, function integration, complexity scaling, and localized deployment. This enables the creation of high-quality training environments that provide detailed and measurable feedback without relying on external tools. Additionally, we introduce a verifiable reward mechanism that evaluates both the precision of tool use and the completeness of task execution. When combined with trajectory data collected from the constructed environments, this mechanism integrates seamlessly with standard RL algorithms to facilitate feedback-driven model training. Experiments on LLMs of varying scales demonstrate that our approach significantly enhances the models’ tool-use performance without degrading their general capabilities. Our analysis suggests that these gains result from improved context understanding and reasoning, driven by updates to the lower-layer MLP parameters in models.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Tool Use", "Feedback-Driven Training"], "openreview_url": "https://openreview.net/forum?id=fr8u8LnM2x", "contribution_types": ["Engineering"]}, {"id": "ezqn0XV3oz", "title": "LeakDojo: Decoding the Leakage Threats of RAG Systems", "abstract": "Retrieval-Augmented Generation (RAG) enables large language models (LLMs) to leverage external knowledge, but also exposes valuable RAG databases to leakage attacks. \nAs RAG systems grow more complex and LLMs exhibit stronger instruction-following capabilities, existing studies fall short of systematically assessing RAG leakage risks.\nWe present LeakDojo, a configurable framework for controlled evaluation of RAG leakage. \nUsing LeakDojo, we benchmark six existing attacks across fourteen LLMs, four datasets, and diverse RAG systems. \nOur study reveals that (1) query generation and adversarial instructions contribute independently to leakage, with overall leakage well approximated by their product; (2) stronger instruction-following capability correlates with higher leakage risk; and (3) improvements in RAG faithfulness can introduce increased leakage risk. \nThese findings provide actionable insights for understanding and mitigating RAG leakage in practice.\nOur codebase is available at https://anonymous.4open.science/r/leakdojo055A.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/leakdojo055A"], "keywords": ["RAG leakage; data security."], "openreview_url": "https://openreview.net/forum?id=ezqn0XV3oz", "contribution_types": ["Analysis", "Reproduction"]}, {"id": "fhNJ8INAQm", "title": "Free Energy-Driven Reinforcement Learning with Adaptive Advantage Shaping for Unsupervised Reasoning in LLMs", "abstract": "Unsupervised reinforcement learning (RL) has emerged as a promising paradigm for enabling self-improvement in large language models (LLMs). However, existing unsupervised RL-based methods often lack the capacity to adapt to the model's evolving reasoning capabilities during training. Therefore, these methods can misdirect policy optimization in the absence of ground-truth supervision. To address this issue, we introduce FREIA, a novel RL-based algorithm built on two key innovations: (1) Free Energy-Driven Reward (FER) adapts rewards to balance consensus and exploration based on the Free Energy Principle. (2) Adaptive Advantage Shaping (AAS) adaptively adjusts learning signals based on the statistical characteristics of sampled rewards. Empirical evaluations on nine datasets across three reasoning tasks showcase that FREIA outperforms other unsupervised RL-based baselines. Notably, in mathematical reasoning tasks, FREIA surpasses other methods by an average of 0.5 to 3.5 points in Pass@1 using the DeepSeek-R1-Distill-Qwen-1.5B model.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Unsupervised Reinforcement Learning", "Free Energy Principle", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=fhNJ8INAQm", "contribution_types": ["Engineering"]}, {"id": "9hrP8OF6Kz", "title": "Aletheia: What Makes RLVR For Code Verifiers Tick?", "abstract": "Multi-domain thinking verifiers trained via Reinforcement Learning from Verifiable Rewards (RLVR) are a prominent fixture of the Large Language Model (LLM) post-training pipeline, owing to their ability to robustly rate and rerank model outputs. However, the adoption of such verifiers towards code generation has been comparatively sparse, with execution feedback constituting the dominant signal. Nonetheless, code verifiers remain valuable toward judging model outputs in scenarios where execution feedback is hard to obtain and are a potentially powerful addition to the code generation post-training toolbox. To this end, we create and open-source Aletheia, a controlled testbed that enables execution-grounded evaluation of code verifiers' robustness across disparate policy models and covariate shifts. We examine components of the RLVR-based verifier training recipe widely credited for its success: (1) intermediate thinking traces, (2) learning from negative samples, and (3) on-policy training. While experiments show the optimality of RLVR, we uncover important opportunities to simplify the recipe. Particularly, despite code verification being amenable to training- and inference-time scaling, on-policy learning stands out as the key component at smaller verifier sizes, and thinking-based training emerges as the most important component at larger scales.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/arr2026-aletheia"], "keywords": ["Verifiers", "RLVR", "Code"], "openreview_url": "https://openreview.net/forum?id=9hrP8OF6Kz", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "jtM1RaSl5N", "title": "CityCube: Benchmarking Cross-view Spatial Reasoning on Vision-Language Models in Urban Environments", "abstract": "Cross-view spatial reasoning is essential for embodied AI, underpinning spatial understanding, mental simulation and planning in complex environments. Existing benchmarks primarily emphasize indoor or street settings, overlooking the unique challenges of open-ended urban spaces characterized by rich semantics, complex geometries, and view variations. To address this, we introduce CityCube, a systematic benchmark designed to probe cross-view reasoning capabilities of current VLMs in urban settings. CityCube integrates four viewpoint dynamics to mimic camera movements and spans a wide spectrum of perspectives from multiple platforms, e.g., vehicles, drones and satellites. For a comprehensive assessment, it features 5,022 meticulously annotated multi-view QA pairs categorized into five cognitive dimensions and three spatial relation expressions. A comprehensive evaluation of 33 VLMs reveals a significant performance disparity with humans: even large-scale models struggle to exceed 54.1\\% accuracy, remaining 34.2\\% below human performance. By contrast, small-scale fine-tuned VLMs achieve over 60.0\\% accuracy, highlighting the necessity of our benchmark. Further analyses indicate the task correlations and fundamental cognitive disparity between VLMs and human-like reasoning.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Cross-view Spatial Reasoning", "Vision-Language Models", "Urban Scene Understanding", "Spatial Intelligence Benchmark"], "openreview_url": "https://openreview.net/forum?id=jtM1RaSl5N", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "lvurtnlSJw", "title": "Beyond Perfect APIs: A Comprehensive Evaluation of LLM Agents Under Real-World API Complexity", "abstract": "We introduce ***WildAGTEval***, a benchmark designed to evaluate large language model (LLM) agents’ function-calling capabilities under **realistic API complexity**. Unlike prior work that assumes an **idealized** API system and disregards real-world factors such as noisy API outputs, ***WildAGTEval*** accounts for two dimensions of real-world complexity: ❶ **API specification**, which includes detailed documentation and usage constraints, and ❷ **API execution**, which captures runtime challenges. Consequently, ***WildAGTEval*** offers (i) an API system encompassing 60 distinct complexity scenarios that can be composed into approximately 32K test configurations, and (ii) user-agent interactions for evaluating LLM agents on these scenarios. Using ***WildAGTEval***, we systematically assess several advanced LLMs and observe that most scenarios are challenging, with **irrelevant information** complexity posing the greatest difficulty and reducing the performance of strong LLMs by 27.3%. Furthermore, our qualitative analysis reveals that LLMs occasionally *distort* user intent merely to claim task completion, critically affecting user satisfaction.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/WildAGTEval", "https://anonymous.4open.science/r/WildAGTEval."], "keywords": ["LLM Agents", "Tool Use", "Function Calling", "Realistic Benchmark", "API Complexity", "Robustness Evaluation"], "openreview_url": "https://openreview.net/forum?id=lvurtnlSJw", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "FzCxKG8Sk5", "title": "MulDimIF: A Multi-Dimensional Constraint Framework for Evaluating and Improving Instruction Following in Large Language Models", "abstract": "Instruction following refers to the ability of large language models (LLMs) to generate outputs that satisfy all specified constraints.  Existing research has primarily focused on constraint categories, offering limited evaluation dimensions and little guidance for improving instruction-following abilities. To address this gap, we introduce MulDimIF, a multi-dimensional constraint framework encompassing three constraint patterns, four constraint categories, and four difficulty levels. Based on this framework, we design a controllable instruction generation pipeline. Through constraint expansion, conflict detection, and instruction rewriting, we construct 9,106 code-verifiable samples. We evaluate 18 LLMs from six model families and find marked performance differences across constraint settings. For instance, average accuracy decreases from 80.82% at Level I to 36.76% at Level IV. Moreover, training with data generated by our framework significantly improves instruction following without compromising general performance. In-depth analysis indicates that these gains stem largely from parameter updates in attention modules, which strengthen constraint recognition and adherence.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Instruction Following", "Multi-Dimensional Constraint", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=FzCxKG8Sk5", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "mo81oKxSwS", "title": "ALGOGEN: Tool-Generated Verifiable Traces for Reliable Algorithm Visualization", "abstract": "Algorithm Visualization (AV) helps students build mental models by animating algorithm execution states. Recent LLM-based systems such as CODE2VIDEO generate AV videos in an end-to-end manner. However, this paradigm requires the system to simultaneously simulate algorithm flow and satisfy video rendering constraints (element layout, color schemes, etc.), a complex task that induces LLM hallucinations. This results in reduced execution success rates, element overlap, and inter-frame inconsistencies.\nTo address these challenges, we propose ALGOGEN, a novel paradigm that decouples algorithm execution from rendering. We first introduce Visualization Trace Algebra (VTA), a monoid over algorithm visual states and operations. The LLM then generates a Python tracker that simulates algorithm flow and outputs VTA-JSON traces, a JSON encoding of VTA. For rendering, we define a Rendering Style Language (RSL) to templatize algorithm layouts. A deterministic renderer then compiles algorithm traces with RSL into Manim, LaTeX/TikZ, or Three.js outputs\\footnote{\nManim, TikZ, and Three.js are respectively a Python animation engine, a LaTeX vector graphics package, and a JavaScript 3D rendering library.}.\nEvaluated on a LeetCode AV benchmark of 200 tasks, ALGOGEN achieves an average success rate improvement of $17.3\\%$ compared to end-to-end methods ($99.8\\%$ vs. $82.5\\%$). These results demonstrate that our decoupling paradigm effectively mitigates LLM hallucinations in complex AV tasks, providing a more reliable solution for automated generation of high-quality algorithm visualizations. Demo videos and code are available at: \\projecturl.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/w/algogen-E227"], "keywords": ["LLM agents", "tool use", "VTA", "algorithm visualization", "verifiable traces", "schema validation"], "openreview_url": "https://openreview.net/forum?id=mo81oKxSwS", "contribution_types": ["Engineering"]}, {"id": "4V5S4pI9CE", "title": "Towards Fine-Grained and Multi-Granular Contrastive Language-Speech Pre-training", "abstract": "Modeling fine-grained speaking styles remains challenging for language-speech representation pre-training, as existing speech-text models are typically trained with coarse captions or task-specific supervision, and scalable fine-grained style annotations are unavailable. We present FCaps, a large-scale dataset with fine-grained free-text style descriptions, encompassing 47k hours of speech and 19M fine-grained captions annotated via a novel end-to-end pipeline that directly grounds detailed captions in audio, thereby avoiding the error propagation caused by LLM-based rewriting in existing cascaded pipelines. Evaluations using LLM-as-a-judge demonstrate that our annotations surpass existing cascaded annotations in terms of correctness, coverage, and naturalness. Building on FCaps, we propose CLSP, a contrastive language-speech pre-trained model that integrates global and fine-grained supervision, enabling unified representations across multiple granularities. Extensive experiments demonstrate that CLSP learns fine-grained and multi-granular speech-text representations that perform reliably across global and fine-grained speech-text retrieval, zero-shot paralinguistic classification, and speech style similarity scoring, with strong alignment to human judgments. All resources will be made publicly available.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["contrastive language-speech pre-training", "speech-text representation learning", "multi-granular representation learning", "style-captioned speech datasets"], "openreview_url": "https://openreview.net/forum?id=4V5S4pI9CE", "contribution_types": ["Dataset"]}, {"id": "IaZseCdyuD", "title": "Beyond Translation: Cross-Cultural Meme Transcreation with Vision-Language Models", "abstract": "Memes are a pervasive form of online communication, yet their cultural specificity poses significant challenges for cross-cultural adaptation. We study cross-cultural meme transcreation, a multimodal generation task that aims to preserve communicative intent and humor while adapting culture-specific references. We propose a hybrid transcreation framework based on vision–language models and introduce a large-scale bidirectional dataset of Chinese and US memes. Using both human judgments and automated evaluation, we analyze 6,315 meme pairs and assess transcreation quality across cultural directions. Our results show that current vision–language models can perform cross-cultural meme transcreation to a limited extent, but exhibit clear directional asymmetries: US -> Chinese transcreation consistently achieves higher quality than Chinese -> US. We further identify which aspects of humor and visual–textual design transfer across cultures and which remain challenging, and propose an evaluation framework for assessing cross-cultural multimodal generation. Our code and dataset are publicly available at https://anonymous.4open.science/r/MemeXGen/.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MemeXGen"], "keywords": ["cross-cultural meme", "transcreation", "multimodal generation", "vision–language", "humor preservation", "cultural adaptation"], "openreview_url": "https://openreview.net/forum?id=IaZseCdyuD", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "761mn3CG42", "title": "Author-in-the-Loop Response Generation and Evaluation: Integrating Author Expertise and Intent in Responses to Peer Review", "abstract": "Author response (rebuttal) writing is a critical stage of scientific peer review that demands substantial author effort. Recent work frames this task as automatic text generation, underusing author expertise and intent. In practice, authors possess domain expertise, author-only information, revision and response strategies--concrete forms of author expertise and intent--to address reviewer concerns, and seek NLP assistance that integrates these signals to support effective response writing in peer review. We reformulate author response generation as an author-in-the-loop task and introduce *REspGen*, a generation framework that integrates explicit author input, multi-attribute control, and evaluation-guided refinement, together with *REspEval*, a comprehensive evaluation suite with 20+ metrics covering input utilization, controllability, response quality, and discourse. To support this formulation, we construct *Re$^3$Align*, the first large-scale dataset of aligned review--response--revision triplets, where revisions provide signals of author expertise and intent. Experiments with state-of-the-art LLMs show the benefits of author input and evaluation-guided refinement, the impact of input design on response quality, and trade-offs between controllability and quality. We make our dataset, generation, and evaluation tools publicly available.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Author Response Generation and Evaluation", "Dataset Creation"], "openreview_url": "https://openreview.net/forum?id=761mn3CG42", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "jJAWNJSXVh", "title": "LACE: Locality-Aware Complexity Estimation", "abstract": "Syntactic complexity contributes to language processing difficulty, yet most evaluation metrics rely on shallow proxies or conflate syn-\ntactic and lexical difficulty, leaving the structural contribution unmeasured. We address this gap by introducing two locality-aware syntac-\ntic complexity metrics inspired by Dependency Locality Theory (DLT): LACE-CORE, which quantifies the memory load and integration dif-\nficulty of syntactic dependencies, and LACE-FULL, which additionally captures the cost of introducing new discourse referents. We bench-\nmark these metrics across three dimensions: (1) agreement with human judgments of text simplification, (2) overlap with other complexity\nmetrics, and (3) prediction of difficulty in downstream QA tasks. Our results show that LACE-FULL aligns more closely with human judgments of simplified text, while LACE-CORE provides the most length-independent signal of structural complexity. These findings establish LACE as a theory-grounded benchmark for syntactic complexity, with potential applications to text simplification, readability, and accessibility.", "area": "Linguistics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["syntactic complexity; Dependency Locality Theory; theory-grounded evaluation; psycholinguistic metrics; structural linguistic difficulty; model robustness; diagnostic analysis; instruction tuning effects"], "openreview_url": "https://openreview.net/forum?id=jJAWNJSXVh", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "fja4B25tFh", "title": "SPD-Faith Bench: Diagnosing and Improving Faithfulness in Chain-of-Thought for Multimodal Large Language Models", "abstract": "Chain-of-Thought reasoning is widely used to improve the interpretability of multimodal large language models (MLLMs), yet the faithfulness of the generated reasoning traces remains unclear. Prior work has mainly focused on perceptual hallucinations, leaving reasoning level unfaithfulness underexplored. To isolate faithfulness from linguistic priors, we introduce SPD-Faith Bench, a diagnostic benchmark based on fine-grained image difference reasoning that enforces explicit visual comparison. Evaluations on state-of-the-art MLLMs reveal two systematic failure modes, perceptual blindness and perception-reasoning dissociation. We trace these failures to decaying visual attention and representation shifts in the residual stream. Guided by this analysis, we propose SAGE, a train-free visual evidence-calibrated framework that improves visual routing and aligns reasoning with perception. Our results highlight the importance of explicitly evaluating faithfulness beyond response correctness. Our benchmark and codes are available at https://anonymous.4open.science/r/SPD-Faith/.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SPD-Faith"], "keywords": ["chain-of-thought", "faithfulness", "multimodal large language models", "benchmark"], "openreview_url": "https://openreview.net/forum?id=fja4B25tFh", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "qsSrEBy4CJ", "title": "NaviMaster: Learning a Unified Policy for GUI and Embodied Navigation Tasks", "abstract": "Recent advances in Graphical User Interface (GUI) and embodied navigation have driven progress, yet these domains have largely evolved in isolation, with disparate datasets and training paradigms. In this paper, we observe that both tasks can be formulated as Markov Decision Processes (MDP), suggesting a foundational principle for their unification. Hence, we present NaviMaster, the first unified agent capable of unifying GUI navigation and embodied navigation within a single framework. Specifically, NaviMaster (i) proposes a visual-target trajectory collection pipeline that generates trajectories for both GUI and embodied tasks using a single formulation. (ii) employs a unified reinforcement learning framework on the mix data to improve generalization. (iii) designs a novel distance-aware reward to ensure efficient learning from the trajectories. Through extensive experiments on out-of-domain benchmarks, NaviMaster is shown to outperform state-of-the-art agents in GUI navigation, spatial affordance prediction, and embodied navigation. Ablation studies further demonstrate the efficacy of our unified training strategy, data mixing strategy, and reward design. Resources will be released to the community.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["GUI Agent", "Navigation"], "openreview_url": "https://openreview.net/forum?id=qsSrEBy4CJ", "contribution_types": []}, {"id": "pNk1SE493F", "title": "microCLIP: Unsupervised CLIP Adaptation via Coarse-Fine Token Fusion for Fine-Grained Image Classification", "abstract": "Unsupervised adaptation of CLIP-based vision-language models (VLMs) for fine-grained image classification is challenging because pseudo-labels must be inferred from tiny local cues. CLIP’s contrastive pretraining yields strong zero-shot transfer, but its coarse-grained $\\texttt{[CLS]}$ visual token often misses fine spatial details. Existing UA methods mainly enrich text prompts with large language model (LLM) descriptions while still relying on $\\texttt{[CLS]}$, which limits spatial precision. We propose $\\textbf{microCLIP}$, a label-free self-training framework that jointly adapts visual features and LLM-derived text prototypes using fine-grained cues. First, a Saliency-Oriented Attention Pooling (SOAP) mechanism inside a lightweight TokenFusion module constructs a saliency-guided $\\texttt{[FG]}$ token from patch features and fuses it with the global $\\texttt{[CLS]}$ representation for coarse–fine alignment. Second, a two-headed LLM-derived classifier combines a frozen text head, used with multi-view CLIP features as a stable prior for pseudo-labels, with a learnable head initialized from the same LLM-derived descriptions. Finally, Dynamic Knowledge Aggregation convexly combines fixed CLIP/LLM priors with TokenFusion logits during self-training. Across 13 diverse classification benchmarks including fine-grained ones, microCLIP yields a mean improvement of $\\mathbf{+2.90\\\\%}$ points over the strongest prior UA baseline while fine-tuning only layer norms and a tiny head.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vision-language Models", "Unsupervised Adaptation", "Fine-grained Visual Recognition"], "openreview_url": "https://openreview.net/forum?id=pNk1SE493F", "contribution_types": ["Analysis", "Low-resource"]}, {"id": "OzaToh9REM", "title": "URECA: Unique Region Caption Anything", "abstract": "Region captioning models fail to generate descriptions that uniquely identify specific regions of interest, instead producing generic labels that could also apply to other regions within the same image. This ambiguity limits their effectiveness in downstream applications and prevents them from capturing the fine-grained details that distinguish objects. To address this, we introduce the Unique Region Caption Anything (URECA) dataset, a new large-scale benchmark designed to enforce caption uniqueness for multi-granularity regions. URECA dataset is constructed using a novel four-stage automated data pipeline that establishes a one-to-one mapping between a region and a descriptive caption, ensuring that each description uniquely identifies its target. We also propose the URECA model, an architecture built on two innovations for generating unique region captions: a decoupled processing strategy that preserves global context by separating region and image inputs, and dynamic mask modeling to capture fine-grained details regardless of any input image scale.\nCode and weights will be publicly released.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vision Language Model"], "openreview_url": "https://openreview.net/forum?id=OzaToh9REM", "contribution_types": ["Dataset"]}, {"id": "o4A39J8vBA", "title": "G-Cap: A Game Character Caption Generator", "abstract": "While Large Vision-Language Models (LVLMs) have demonstrated remarkable proficiency in image captioning, existing research primarily focuses on real-world scenarios, leaving surreal, highly stylized, and semantically hybrid virtual-world scenarios significantly underexplored. In this work, we introduce \\textbf{Game Character Captioning}, a novel task designed to evaluate LVLMs' capability to perceive and describe game character from the virtual-world. To facilitate evaluation, we establish \\textbf{GC-Bench}, a manually annotated benchmark, and propose \\textbf{Graph-F1} to effectively assess performance on this task. Our evaluation reveals that: (1) current state-of-the-art LVLMs, including closed-source giants such as \\texttt{Gemini 3 Pro} and \\texttt{GPT-5.1}, struggle to maintain the high performance seen in real-world scenarios; and (2) a notable gap exists between open-source and closed-source models. To bridge this gap, we construct \\textbf{GC-148K}, a large-scale dataset generated via a specialized data pipeline, and develop the \\textbf{G-Cap} series. Experiments demonstrate that G-Cap series rivals the performance of advanced closed-source models at a lower cost, offering an efficient solution for industrial-grade production environment.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Vision-Language Models; image captioning"], "openreview_url": "https://openreview.net/forum?id=o4A39J8vBA", "contribution_types": ["Dataset"]}];

function buildSidebar() {
  const c = document.getElementById('area-chips');
  AREAS.forEach(function(item) {
    const el = document.createElement('span');
    el.className = 'chip on';
    el.dataset.area = item.area;
    el.textContent = item.area + ' (' + item.count + ')';
    el.addEventListener('click', function() { togArea(item.area); });
    c.appendChild(el);
  });

  document.getElementById('code-chips').addEventListener('click', function(e) {
    const chip = e.target.closest('[data-code]');
    if (!chip) return;
    codeFilter = chip.dataset.code;
    document.querySelectorAll('[data-code]').forEach(function(el) { el.classList.remove('on'); });
    chip.classList.add('on');
    render();
  });
}

function togArea(val) {
  if (selAreas.size === 1 && selAreas.has(val)) { selAreas.clear(); }
  else { selAreas.clear(); selAreas.add(val); }
  syncAreaChips();
  render();
}

function syncAreaChips() {
  document.querySelectorAll('#area-chips .chip').forEach(function(el) {
    el.classList.toggle('on', selAreas.size === 0 || selAreas.has(el.dataset.area));
  });
  document.getElementById('area-reset-btn').style.display = selAreas.size ? 'inline' : 'none';
}

function resetArea() { selAreas.clear(); syncAreaChips(); render(); }

function getFiltered() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  return PAPERS.filter(function(p) {
    if (selAreas.size > 0 && !selAreas.has(p.area)) return false;
    if (codeFilter === 'has_code' && !p.has_code) return false;
    if (codeFilter === 'long' && p.paper_type !== 'Long') return false;
    if (codeFilter === 'short' && p.paper_type !== 'Short') return false;
    if (q) {
      const hay = (p.title + ' ' + p.abstract + ' ' + p.keywords.join(' ')).toLowerCase();
      if (!q.split(' ').every(function(w) { return hay.includes(w); })) return false;
    }
    return true;
  });
}

function h(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function render() {
  const sort = document.getElementById('sort-sel').value;
  let data = getFiltered();
  if (sort === 'title') data.sort(function(a, b) { return a.title.localeCompare(b.title); });
  else if (sort === 'has_code') data.sort(function(a, b) { return (b.has_code ? 1 : 0) - (a.has_code ? 1 : 0); });
  else data.sort(function(a, b) { return a.area.localeCompare(b.area) || a.title.localeCompare(b.title); });

  document.getElementById('cnt').textContent = '共 ' + data.length + ' 篇';
  const list = document.getElementById('paper-list');
  list.innerHTML = '';

  if (!data.length) { list.innerHTML = '<div class="empty">没有匹配的论文</div>'; return; }

  data.forEach(function(p) {
    const card = document.createElement('div');
    card.className = 'card';

    const hasCodeTag = p.has_code ? '<span class="tag tag-code">&#128206; 匿名代码</span>' : '';
    const typeTag = p.paper_type === 'Short' ? '<span class="tag tag-short">Short</span>' : '';
    const ctypeTags = p.contribution_types.slice(0, 3).map(function(c) {
      return '<span class="tag tag-type">' + h(c) + '</span>';
    }).join('');
    const kwHtml = p.keywords.length
      ? '<div class="kw-row">' + p.keywords.map(function(k) { return '<span class="kw">' + h(k) + '</span>'; }).join('') + '</div>'
      : '';
    const codeLinksHtml = (p.code_links && p.code_links.length)
      ? '<div class="code-links">' + p.code_links.map(function(l) {
          return '<a class="code-link" href="' + h(l) + '" target="_blank">' + h(l) + '</a>';
        }).join('') + '</div>'
      : '';

    card.innerHTML =
      '<div class="card-header">'
      + '<div class="card-title">' + h(p.title) + '</div>'
      + '<div class="card-meta"><span class="tag tag-area">' + h(p.area) + '</span>' + hasCodeTag + typeTag + ctypeTags + '</div>'
      + '</div>'
      + '<div class="card-body">'
      + '<div class="abstract">' + h(p.abstract) + '</div>'
      + kwHtml
      + '<div class="link-row">'
      + '<a class="link-btn" style="background:#1e3a5f" href="' + h(p.openreview_url) + '" target="_blank">OpenReview</a>'
      + (p.has_code ? '<span class="link-btn" style="background:#15803d">有匿名代码</span>' : '')
      + '</div>'
      + codeLinksHtml
      + '</div>';

    card.querySelector('.card-header').addEventListener('click', function() {
      card.classList.toggle('expanded');
    });

    list.appendChild(card);
  });
}

buildSidebar();
render();
</script>
</body>
</html>
