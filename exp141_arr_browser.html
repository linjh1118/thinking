R4H6L1", "title": "How Does Personalized Memory Shape LLM Behavior? Benchmarking Rational Preference Utilization in Personalized Assistants", "abstract": "Large language model (LLM)-powered assistants have recently integrated memory mechanisms that record user preferences, leading to more personalized and user-aligned responses.\nHowever, irrelevant personalized memories are often introduced into the context, interfering with the LLM's intent understanding. \nTo comprehensively investigate the dual effects of personalization, we develop RPEval, a benchmark comprising a personalized intent reasoning dataset and a multi-granularity evaluation protocol.\nRPEval reveals the widespread phenomenon of irrational personalization in existing LLMs and, through error pattern analysis, illustrates its negative impact on user experience.\nFinally, we introduce RP-Reasoner, which treats memory utilization as a pragmatic reasoning process, enabling the selective integration of personalized information. Experimental results demonstrate that our method significantly outperforms carefully designed baselines on RPEval, and resolves 80\\% of the bad cases observed in a large-scale commercial personalized assistant, highlighting the potential of pragmatic reasoning to mitigate irrational personalization. Our benchmark is publicly available at \\url{https://anonymous.4open.science/r/RPEval-E4B0}.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/RPEval-E4B0"], "keywords": ["benchmarking", "personalized assistants", "intent reasoning", "pragmatics", "large language models", "evaluation methodology"], "openreview_url": "https://openreview.net/forum?id=AQ0gR4H6L1", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "AJpdfW2kpC", "title": "DSL-R1: From SQL to DSL for Training Retrieval Agents across Structured and Unstructured Data with Reinforcement Learning", "abstract": "Effective retrieval in complex domains requires bridging the gap between structured metadata and unstructured content. Existing systems typically isolate these capabilities, relying on either symbolic filtering or vector similarity, failing to capture their interplay. In this work, we propose DSL-R1, a unified framework that synergizes logical reasoning with semantic matching via a novel Domain-Specific Language (DSL). By embedding vector primitives within SQL-style operators, our approach leverages the complementary strengths of symbolic precision and semantic coverage. We further introduce a reinforcement learning mechanism where rule-based execution feedback and retrieval quality rewards jointly optimize the DSL generation, balancing structural correctness and semantic alignment. Evaluations on a large-scale industrial email benchmark demonstrate that DSL-R1 achieves a +12.3% improvement in Hit@1/3, consistently outperforming decoupled baselines and establishing a robust paradigm for hybrid retrieval.", "area": "AI/LLM Agents", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["DSL", "Retrieval", "Agentic RL"], "openreview_url": "https://openreview.net/forum?id=AJpdfW2kpC", "contribution_types": ["Engineering", "Dataset"]}, {"id": "Nf5Gfy7goG", "title": "PaTaRM: Bridging Pairwise and Pointwise Signals via Preference-Aware Task-Adaptive Reward Modeling", "abstract": "Reward models (RMs) are central to reinforcement learning from human feedback (RLHF), providing the critical supervision signals that align large language models (LLMs) with human preferences. Generative reward models (GRMs) provide greater interpretability than traditional scalar RMs, but they come with a critical trade-off: pairwise methods are hindered by a training-inference mismatch, while pointwise methods require expensive absolute annotations. To bridge this gap, we propose the Preference-aware Task-adaptive Reward Model (PaTaRM). Unlike prior approaches, PaTaRM enables robust pointwise training using readily available pairwise data via a novel Preference-Aware Reward (PAR) mechanism, eliminating the need for explicit rating labels. Furthermore, it incorporates a Task-Adaptive Rubric system that dynamically generates instance-specific criteria for precise evaluation. Extensive experiments demonstrate that PaTaRM achieves a 8.7% average improvement on RewardBench and RMBench across Qwen3-8B/14B models. Crucially, it boosts downstream RLHF performance by an average relative improvement of 13.6% across IFEval and InFoBench, validating its effectiveness for policy alignment. Our code is available at https://anonymous.4open.science/r/PaTaRM-E779.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/PaTaRM-E779"], "keywords": ["LLMs", "Human Feedback Alignment", "Generative Reward Models", "RLHF"], "openreview_url": "https://openreview.net/forum?id=Nf5Gfy7goG", "contribution_types": ["Engineering"]}, {"id": "QFvdwqIsco", "title": "SafeMo: Linguistically Grounded Unlearning for Trustworthy Text-to-Motion Generation", "abstract": "Text-to-motion (T2M) generation have achieved impressive realism but pose significant safety risks by faithfully executing harmful textual prompts. Existing safety measures face dual challenges: brittle keyword filtering and discrete codebook manipulation, which degrade benign generation quality and introduce jerky transitions. To address these challenges, we propose SafeMo, a linguistically grounded framework that leverages Large Language Models (LLMs) to align motion generation with safety constraints. First, we introduce SafeMoEngine, an LLM-agent pipeline that autonomously classifies harmful intents and performs semantic rewriting to construct SafeMoVAE-29K, the first safety-aligned text-to-motion dataset. Second, we propose Minimal Motion Unlearning (MMU), a continuous-space unlearning strategy that projects harmful semantic concepts into a task vector for precise negation, avoiding the quantization artifacts of discrete methods. Experiments demonstrate effective unlearning performance of SafeMo by showing strengthened forgetting on unsafe prompts, reaching 2.5$\\times$ and 14.4$\\times$ higher forget-set FID on HumanML3D and Motion-X respectively, compared to the previous SOTA human motion unlearning method LCR, with benign performance on safe prompts being better or comparable.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine Unlearning", "Text-to-Motion Generation", "Large Language Models", "Safety Alignment"], "openreview_url": "https://openreview.net/forum?id=QFvdwqIsco", "contribution_types": ["Dataset"]}, {"id": "7VZGRZVwDP", "title": "LLM-VA: Resolving the Jailbreak-Overrefusal Trade-off via Vector Alignment", "abstract": "Safety-aligned LLMs suffer from two failure modes: jailbreak (responding to harmful inputs) and over-refusal (declining benign queries). Existing vector steering methods adjust the magnitude of answer vectors, but this creates a fundamental trade-off---reducing jailbreak increases over-refusal and vice versa. We identify the root cause: LLMs encode the decision to respond (answer vector $v_a$) and the judgment of input safety (benign vector $v_b$) as nearly orthogonal directions, treating them as independent processes. We propose LLM-VA, which aligns $v_a$ with $v_b$ through closed-form weight updates, making the model's willingness to respond causally dependent on its safety assessment---without fine-tuning or architectural changes. Our method identifies vectors at each layer using SVMs, selects safety-relevant layers, and iteratively aligns vectors via minimum-norm weight modifications. Experiments on 12 LLMs demonstrate that LLM-VA achieves 11.45\\% higher F1 than the best baseline while preserving 95.92\\% utility, and automatically adapts to each model's safety bias without manual tuning.\nCode and models are available at https://anonymous.4open.science/w/LLM-VA-Web-A6C4/.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/w/LLM-VA-Web-A6C4"], "keywords": ["Safety Alignment", "Large Language Model", "Vector Steering"], "openreview_url": "https://openreview.net/forum?id=7VZGRZVwDP", "contribution_types": ["Analysis", "Engineering", "Theory"]}, {"id": "S6sjtbanhF", "title": "Incentivizing In-depth Reasoning over Long Contexts with Process Advantage Shaping", "abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) has proven effective in enhancing LLMs' short-context reasoning but falters in long-context scenarios requiring precise grounding and multi-hop reasoning. We identify the \"almost-there\" phenomenon—trajectories that are largely correct but fail at the final step—in long-context reasoning RL and attribute this failure to two factors: (1) the lack of high reasoning density in long-context QA data, and (2) indiscriminate penalization of partially correct trajectories during long-context RL. To overcome this bottleneck, we propose DeepReasonQA, a KG-driven synthesis framework that controllably constructs high-difficulty, multi-hop long-context QA pairs with inherent reasoning chains. Building on this, we introduce Long-context Process Advantage Shaping (LongPAS), a simple yet effective method that performs fine-grained credit assignment by measuring reasoning steps along Validity and Relevance dimensions, which captures critical signals from \"almost-there\" trajectories. Experiments on three long-context reasoning benchmarks show that our approach substantially outperforms RLVR baselines and matches frontier LLMs while using far fewer parameters. Further analysis confirms the effectiveness of our methods in strengthening long-context reasoning while maintaining stable RL training.", "area": "Question Answering", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/LongPAS", "https://anonymous.4open.science/r/LongPAS0.00.1250.250.3750.50.6250.750.875GroupPositiveRatio0.00."], "keywords": ["Long-Context Reasoning", "QA Synthesis", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=S6sjtbanhF", "contribution_types": ["Engineering", "Reproduction", "Dataset"]}, {"id": "vhfAkFh9pX", "title": "DRA-GRPO: Your GRPO Needs to Know Diverse Reasoning Paths for Mathematical Reasoning", "abstract": "Post-training LLMs with Reinforcement Learning, specifically Group Relative Policy Optimization (GRPO), has emerged as a paradigm for enhancing mathematical reasoning. However, standard GRPO relies on scalar correctness rewards that are often \\textit{non-injective} with respect to semantic content: distinct reasoning paths receive identical rewards. This leads to a $\\textit{Diversity-Quality Inconsistency}$, where the policy collapses into a narrow set of dominant modes while ignoring equally valid but structurally novel strategies. \nTo bridge this gap, we propose $\\textbf{D}$iversity-aware $\\textbf{R}$eward $\\textbf{A}$djustment ($\\textbf{DRA}$), a theoretically grounded framework that calibrates the reward signal using the semantic density of sampled groups. \nBy leveraging Submodular Mutual Information (SMI), DRA implements an $\\textit{Inverse Propensity Scoring (IPS)}$ mechanism that effectively de-biases the gradient estimation. This creates a repulsive force against redundancy, driving the policy to achieve better coverage of the high-reward landscape.\nOur method is plug-and-play and integrates seamlessly with GRPO variants. Empirical evaluations on five math benchmarks demonstrate that DRA-GRPO consistently outperforms strong baselines, achieving an average accuracy of 58.2\\% on DeepSeek-R1-Distill-Qwen-1.5B with only 7,000 training samples and \\$55 cost, highlighting the critical role of diversity calibration in data-efficient alignment.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Diversity-aware Reward", "GRPO", "LLM for Mathematical reasoning", "Debais"], "openreview_url": "https://openreview.net/forum?id=vhfAkFh9pX", "contribution_types": ["Engineering", "Low-resource", "Data Analysis"]}, {"id": "dFQLfagXEK", "title": "EMemBench: Interactive Benchmarking of Episodic Memory for VLM Agents", "abstract": "We introduce EMemBench, a programmatic benchmark for evaluating long-term memory of agents through interactive games. Rather than using a fixed set of questions, EMemBench generates questions from each agent’s own trajectory, covering both text and visual game environments. Each template computes verifiable ground truth from underlying game signals, with controlled answerability and balanced coverage over memory skills: single/multi-hop recall, induction, temporal, spatial, logical, and adversarial. We evaluate memory agents with strong LMs/VLMs as backbones, using in-context prompting as baselines. Across 15 text games and multiple visual seeds, results are far from saturated: induction and spatial reasoning are persistent bottlenecks, especially in visual setting. Persistent memory yields clear gains for open backbones on text games, but improvements are less consistent for VLM agents, suggesting that visually grounded episodic memory remains an open challenge. A human study further confirms the difficulty of EMemBench.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["episodic memory", "multimodal memory", "interactive evaluation", "LLM agents", "vision-language agents", "trajectory-grounded QA"], "openreview_url": "https://openreview.net/forum?id=dFQLfagXEK", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "ExWVOPelb4", "title": "Masking or Mitigating? Deconstructing the Impact of Query Rewriting on Retriever Biases in RAG", "abstract": "Dense retrievers in retrieval-augmented generation (RAG) systems exhibit systematic biases---including brevity, position, literal matching, and repetition biases---that can compromise retrieval quality. Query rewriting techniques are now standard in RAG pipelines, yet their impact on these biases remains unexplored. We present the first systematic study of how query enhancement techniques affect dense retrieval biases, evaluating five methods across six retrievers. Our findings reveal that simple LLM-based rewriting achieves the strongest aggregate bias reduction (54%), yet fails under adversarial conditions where multiple biases combine. Mechanistic analysis uncovers two distinct mechanisms: simple rewriting reduces bias through increased score variance, while pseudo-document methods achieve reduction through genuine decorrelation from bias-inducing features. However, no technique uniformly addresses all biases, and effects vary substantially across retrievers. Our results provide practical guidance for selecting query enhancement strategies based on specific bias vulnerabilities. More broadly, we establish a taxonomy distinguishing query-document interaction biases from document encoding biases, clarifying the limits of query-side interventions for debiasing RAG systems.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Retriever Biases", "Retrieval Augmented Generation"], "openreview_url": "https://openreview.net/forum?id=ExWVOPelb4", "contribution_types": ["Analysis", "Engineering"]}, {"id": "r4iWnuMpmY", "title": "CrossGuard: Safeguarding MLLMs against Joint-Modal Implicit Malicious Attacks", "abstract": "Multimodal Large Language Models (MLLMs) achieve strong reasoning and perception capabilities but are increasingly vulnerable to jailbreak attacks. While existing work focuses on explicit attacks, where malicious content resides in a single modality, recent studies reveal implicit attacks, in which benign text and image inputs jointly express unsafe intent. Such joint-modal threats are difficult to detect and remain underexplored, largely due to the scarcity of high-quality implicit data. We propose ImpForge, an automated red-teaming pipeline that leverages reinforcement learning with tailored reward modules to generate diverse implicit samples across 14 domains. Building on this dataset, we further develop CrossGuard, an intent-aware safeguard providing robust and comprehensive defense against both explicit and implicit threats. Extensive experiments across safe and unsafe benchmarks, implicit and explicit attacks, and multiple out-of-domain settings demonstrate that CrossGuard significantly outperforms existing defenses, including advanced MLLMs and guardrails, achieving stronger security while maintaining high utility. This offers a balanced and practical solution for enhancing MLLM robustness against real-world multimodal threats.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/CrossGuard-8E30"], "keywords": ["red-teaming", "safety and alignment", "multimodal large language models"], "openreview_url": "https://openreview.net/forum?id=r4iWnuMpmY", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "jq6IITior0", "title": "Learning to Generate Secure Code via Token-Level Rewards", "abstract": "Large language models (LLMs) have demonstrated strong capabilities in code generation, yet they remain prone to producing security vulnerabilities. Existing approaches commonly suffer from two key limitations: the scarcity of high-quality security data and coarse-grained reinforcement learning reward signals. To address these challenges, we propose Vul2Safe, a new secure code generation framework that leverages LLM self-reflection to construct high-confidence repair pairs from real-world vulnerabilities, and further generates diverse implicit prompts to build the PrimeVul+ dataset. Meanwhile, we introduce SRCode, a novel training framework that pioneers the use of token-level rewards in reinforcement learning for code security, which enables the model to continuously attend to and reinforce critical fine-grained security patterns during training. Compared with traditional instance-level reward schemes, our approach allows for more precise optimization of local security implementations. Extensive experiments show that PrimeVul+ and SRCode substantially reduce security vulnerabilities in generated code while improving overall code quality across multiple benchmarks.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Secure Code Generation", "Real-World Vulnerabilities", "Reinforcement Learning", "Token-Level Rewards"], "openreview_url": "https://openreview.net/forum?id=jq6IITior0", "contribution_types": ["Dataset"]}, {"id": "6WTU29XcrU", "title": "Raw Pointer Rewriting with LLMs for Translating C to Safer Rust", "abstract": "There has been a growing interest in translating C code to Rust due to Rust's robust memory and thread safety guarantees. Tools such as $C2Rust$ enable syntax-guided transpilation from C to semantically equivalent Rust code. However, the resulting Rust programs often rely heavily on unsafe constructs, particularly raw pointers, which undermines Rust’s safety guarantees.\nThis paper aims to improve the memory safety of Rust programs generated by $C2Rust$ by eliminating raw pointers. Specifically, we propose a raw pointer rewriting technique that lifts raw pointers in individual functions to appropriate Rust data structures. Technically, $PR^2$ employs decision-tree-based prompting to guide the pointer lifting process. It also leverages code change analysis to guide the repair of errors introduced during rewriting, effectively addressing errors encountered during compilation and test case execution.\nWe implement $PR^2$ as a prototype and evaluate it using gpt-4o-mini on 28 real-world C projects. The results show that $PR^2$ successfully eliminates 18.57\\% of local raw pointers across these projects, significantly enhancing the safety of the translated Rust code. On average, $PR^2$ completes the transformation of a project in 5.02 hours, at an average cost of \\$1.13.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Rust", "Program Transformation", "Program Repair", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=6WTU29XcrU", "contribution_types": ["Engineering"]}, {"id": "IUCGCbvggt", "title": "VisPCO: Visual Token Pruning Configuration Optimization via Budget-Aware Pareto-Frontier Learning for Vision-Language Models", "abstract": "Visual token pruning methods effectively mitigate the quadratic computational growth caused by processing high-resolution images and video frames in vision-language models (VLMs). However, existing approaches rely on predefined pruning configurations without determining whether they achieve computation-performance optimality. In this work, we introduce $\\textbf{VisPCO}$, a novel framework that formulates visual token pruning as a Pareto configuration optimization problem to automatically identify optimal configurations. Our approach employs continuous relaxation and straight-through estimators to enable gradient-based search, solved via the Augmented Lagrangian method. Extensive experiments across 8 visual benchmarks demonstrate that $\\textbf{VisPCO}$ effectively approximates the empirical Pareto frontier obtained through grid search and generalizes well across various pruning methods and VLM architectures. Furthermore, through learnable kernel functions, we investigate layer-wise pruning patterns and reveal that multi-step progressive pruning captures VLMs' hierarchical compression structure, achieving superior accuracy-efficiency trade-offs compared to single-layer approaches.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/VisPCO-5B7B", "https://anonymous.4open.science/r/VisPCO-5B7B.1432RelatedWork1442.1VisualTokenPruning145Visualtoken"], "keywords": ["Vision-Language Models", "Vision Token Pruning", "Budget-Aware Optimization", "Pareto Optimization"], "openreview_url": "https://openreview.net/forum?id=IUCGCbvggt", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency"]}, {"id": "jhZ53SlQoP", "title": "ATOD: An Evaluation Framework and Benchmark for Agentic Task-Oriented Dialogue System", "abstract": "Recent advances in task-oriented dialogue (TOD) systems, driven by large language models (LLMs) with extensive API and tool integration, have enabled conversational agents to coordinate interleaved goals, maintain long-horizon context, and act proactively through asynchronous execution. These capabilities extend beyond traditional TOD systems, yet existing benchmarks lack systematic support for evaluating such agentic behaviors. To address this gap, we introduce ATOD, a benchmark and synthetic dialogue generation pipeline that produces richly annotated conversations requiring long-term reasoning. ATOD captures key characteristics of Advanced TOD, including multi-goal coordination, dependency management, memory, adaptability, and proactivity. Building on ATOD, we propose ATOD-Eval, a holistic evaluation framework that translates these dimensions into fine-grained metrics and supports reproducible offline and online evaluation. We further present a strong agentic memory-based evaluator for benchmarking on ATOD. Experiments show that ATOD-Eval enables comprehensive assessment across task completion, agentic capability, and response quality, and that the proposed evaluator offers a better accuracy–efficiency trade-off compared to existing memory- and LLM-based approaches under this evaluation setting.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Task-Oriented Dialogue", "Evaluation Benchmark", "Agentic Systems", "Dialogue Memory", "Long-Horizon Dialogue"], "openreview_url": "https://openreview.net/forum?id=jhZ53SlQoP", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "XHPOM7TF5b", "title": "Choosing How to Adapt:  An Empirical Study on Cross-Lingual Medical Question-Answering Adaptation", "abstract": "The development of large language models (LLMs) has led to increased focus on their adaptation to specialized domains and languages, yet the effectiveness of domain adaptation strategies remains unclear. We present a study of medical domain adaptation using French medical question answering (QA) as a case study. We compare continual pretraining (CPT), supervised fine-tuning (SFT), and their combination across three model families, multiple sizes, and three initialization types, explicitly disentangling adaptation effects from base model choice.\nWe evaluate both multiple-choice (MCQA) and open-ended QA (OEQA) under greedy and constrained decoding using automatic metrics and LLM-as-a-Judge evaluation. For MCQA, CPT+SFT most often achieves the best scores, but gains over SFT are small and frequently not statistically significant, making SFT a strong and cost-effective default. For OEQA, CPT consistently improves overlap-based metrics, while SFT often degrades generation quality; instruction tuning and CPT+SFT are preferred by LLM-based evaluation. Cross-lingual experiments further show effective transfer from French adaptation to English benchmarks. Overall, we provide practical guidelines for selecting adaptation strategies under computational constraints.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MedAdapt-2F23"], "keywords": ["Large Language Models", "Medical Question Answering", "Domain Adaptation", "Supervised Fine-Tuning", "Continual Pretraining", "Multilingual Transfer"], "openreview_url": "https://openreview.net/forum?id=XHPOM7TF5b", "contribution_types": ["Analysis", "Reproduction"]}, {"id": "6JyedFL9tK", "title": "ScaleTrack: Scaling and Backtracking Automated GUI Agents", "abstract": "Automated GUI agents aim to streamline user interaction by automatically executing complex tasks across digital environments, such as web, mobile, and desktop devices. Given a textual task instruction and a GUI description, the agent generates a sequence of executable actions (\\emph{e.g.}, clicks) and operation steps. Training a GUI agent typically involves grounding and planning stages, where the GUI grounding stage focuses on locating the executable interface coordinates based on the given task, while the planning stage aims to predict the next action using the history of previous actions. However, previous work suffers from insufficient training data for GUI grounding and overlooks the importance of backtracking historical behaviors in GUI planning. To handle the above challenges, we propose ScaleTrack, a training framework that integrates scalable grounding and backtracking planning for automated GUI agents. Specifically, we systematically collected GUI samples from a wide range of sources, with each source employing distinct synthesis criteria, and unified them into a standardized template for training GUI grounding models.\nMoreover, ScaleTrack introduces a novel training strategy that predicts the next action based on the current GUI image while simultaneously backtracking the historical actions that led to it. This approach enables ScaleTrack to effectively capture the correspondence between GUI states and actions, modeling the dynamic evolution of the GUI environment. Extensive experimental results on grounding tasks, as well as both offline and online agent evaluations, demonstrate the effectiveness of ScaleTrack.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Applications"], "openreview_url": "https://openreview.net/forum?id=6JyedFL9tK", "contribution_types": ["Data Analysis"]}, {"id": "pvXkT9uRkl", "title": "TOXIFRENCH: Benchmarking and Enhancing Language Models via CoT Fine-Tuning for French Toxicity Detection", "abstract": "Detecting toxic content using language models is crucial yet challenging. While substantial progress has been made in English, toxicity detection in French remains underdeveloped, primarily due to the lack of culturally relevant, human-annotated, large-scale datasets. In this work, we release TOXIFRENCH, a dataset of 53,622 French online comments, together with a 1,388-sample balanced benchmark split for systematic evaluation. The dataset is constructed via a semi-automated annotation pipeline that reduces manual labeling to only 10% through high-confidence LLM-based pre-annotation and human verification, while ensuring statistically near-perfect alignment with human-only annotation. We then benchmark a broad range of models and uncover a counterintuitive insight: Small Language Models (SLMs) often surpass larger models in robustness and generalization on this task. Motivated by this finding, we propose a novel Chain-of-Thought (CoT) fine-tuning strategy using a dynamic weighted loss that progressively emphasizes the model's final decision, significantly improving faithfulness. Our fine-tuned 4B model (Qwen3-4B) achieves state-of-the-art performance on the benchmark, improving its balanced accuracy by 10% over its baseline and achieving better performance than GPT-4o and DeepSeek-R1 on our benchmark, while successfully retaining cross-lingual capabilities.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["hate-speech detection", "bias/toxicity", "model bias/unfairness mitigation", "human evaluation", "automatic evaluation", "few-shot generation"], "openreview_url": "https://openreview.net/forum?id=pvXkT9uRkl", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Dataset"]}, {"id": "yNKHDRdA75", "title": "Guiding Giants: Lightweight Controllers for Weighted Activation Steering in LLMs", "abstract": "Controlling undesirable LLM behaviors typically requires costly fine-tuning, while existing inference-time steering methods lack fine-grained adaptivity. We introduce a lightweight, trainable controller network for adaptive inference-time control. The controller observes intermediate LLM activations to predict a global scaling factor and layer-specific weights, which dynamically modulate a pre-computed \"refusal direction\" vector. Trained on harmful and benign prompts, the controller learns to apply nuanced, layer-aware steering selectively. Experiments on Llama and Mistral models show our method significantly increases refusal rates on safety benchmarks like ToxicChat, outperforming existing approaches without altering the original model parameters.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/GuidingGiantsWAS-D88F", "https://anonymous.4open.science/r/020GuidingGiantsWAS-D88F"], "keywords": ["Large Language Models", "Safety", "Steering", "Activation Engineering", "Controller Network", "Refusal Detection"], "openreview_url": "https://openreview.net/forum?id=yNKHDRdA75", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "5cHBVpOWmk", "title": "Chart-R1: Chain-of-Thought Supervision and Reinforcement for Advanced Chart Reasoner", "abstract": "Chart reasoning presents unique challenges due to its inherent complexity—requiring precise numerical comprehension, multi-level visual understanding, and logical inference across interconnected data elements. Existing vision-language models often struggle with such reasoning tasks, particularly when handling multi-subchart scenarios and numerical sensitivity. To address these challenges, we introduce \\textbf{Chart-R1}, a chart-domain vision-language model that leverages reinforcement fine-tuning for advanced chart reasoning. We first propose a programmatic data synthesis approach to generate high-quality step-by-step reasoning data with verifiable answer formats, covering diverse chart types and complexity levels. Our two-stage training strategy includes: (1) \\textbf{Chart-COT}, which decomposes complex reasoning into interpretable subtasks through chain-of-thought supervision, and (2) \\textbf{Chart-RFT}, which employs group relative policy optimization with numerically sensitive rewards tailored for chart-specific reasoning. Experiments on open-source benchmarks and our proposed \\textbf{ChartRQA} dataset demonstrate that Chart-R1 significantly outperforms existing chart-domain methods and rivals large-scale open/closed-source models.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["chart understanding and reasoning", "vision language models"], "openreview_url": "https://openreview.net/forum?id=5cHBVpOWmk", "contribution_types": ["Data Analysis"]}, {"id": "3DJsn0mqJc", "title": "Legal Semantic Engineering: Reconciling Probabilistic Generation with Rigid Normative Constraints", "abstract": "Legislative translation demands the precise preservation of normative intent. However, Large Language Models (LLMs) frequently suffer from **Deontic Drift**-a systemic failure where models prioritize probabilistic fluency over rigid normative mandates. By analyzing a five-jurisdiction benchmark via Zipf-Mandelbrot modeling, we characterize this failure as a structural distributional mismatch: the high-concentration mandatory monopoly of source legal terms diverges significantly from the granular, dispersed probability distributions of target languages. To bridge this gap, we propose **Legal Semantic Engineering (LSE)**, a framework that introduces vertical hierarchical control as a robust alternative to horizontal multi-agent collaboration. Through an Anchoring-Shaping-Polishing (ASP) pipeline, LSE explicitly decouples normative logic validation from stochastic text generation. Experiments on a trilingual legislative benchmark demonstrate that LSE is highly robust to backbone variations; implementations using DeepSeek, GPT, and Gemini all significantly surpass strong horizontal agent baselines. Furthermore, our analysis unveils the gain-interference-rescue dynamics, quantitatively illustrating the necessary trade-offs between linguistic fluency and legal fidelity.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Legal Machine Translation", "Deontic Drift", "Multi-Agent Systems", "Zipf-Mandelbrot Law", "Hierarchical Control."], "openreview_url": "https://openreview.net/forum?id=3DJsn0mqJc", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "C27ZDig7C3", "title": "DataGovBench: Benchmarking LLM Agents for Real-World Data Governance Workflows", "abstract": "Data governance ensures data quality, security, and compliance through policies and standards—a critical foundation for scaling modern AI development. Recently, Large Language Models (LLMs) have emerged as a promising solution for automating data governance by translating user intent into executable transformation code. However, existing benchmarks for automated data science often emphasize snippet-level coding or high-level analytics, failing to capture the unique challenge of data governance: ensuring the correctness and quality of the data itself. To bridge this gap, we introduce DataGovBench, a benchmark featuring 150 diverse tasks grounded in real-world scenarios, built on data from actual cases. DataGovBench employs a novel ``reversed-objective'' methodology to synthesize realistic noise and utilizes rigorous metrics to assess end-to-end pipeline reliability. Our analysis on DataGovBench reveals that current models struggle with complex, multi-step workflows and lack robust error-correction mechanisms. Consequently, we propose DataGovAgent, a framework utilizing a Planner-Executor-Evaluator architecture that integrates constraint-based planning, retrieval-augmented generation, and sandboxed feedback-driven debugging. Experimental results show that DataGovAgent significantly boosts the Average Task Score (ATS) on complex tasks from 39.7 to 54.9 and reduces debugging iterations by over 77.9\\% compared to general-purpose baselines.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/GovBench-F6C6"], "keywords": ["Data Governance", "LLM Agents", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=C27ZDig7C3", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "AWNvtEkkOx", "title": "Think-on-Graph 3.0: Efficient and Adaptive LLM Reasoning on Heterogeneous Graphs via Multi-Agent Dual-Evolving Context Retrieval", "abstract": "Graph-based Retrieval-Augmented Generation (GraphRAG) has become the important paradigm for enhancing Large Language Models (LLMs) with external knowledge. \nHowever, existing approaches are constrained by their reliance on high-quality knowledge graphs: manually built ones are not scalable, while automatically extracted ones are limited by the performance of LLM extractors, especially when using smaller, local-deployed models.\nTo address this, we introduce Think-on-Graph 3.0 (ToG-3), a novel framework featuring a Multi-Agent Context Evolution and Retrieval (MACER) mechanism. Its core contribution is the dynamic construction and iterative refinement of a Chunk-Triplets-Community heterogeneous graph index, powered by a Dual-Evolution process that adaptively evolves both the query and the retrieved sub-graph during reasoning. ToG-3 dynamically builds a targeted graph index tailored to the query, enabling precise evidence retrieval and reasoning even with lightweight LLMs.\nExtensive experiments demonstrate that ToG-3 outperforms compared baselines on both deep and broad reasoning benchmarks, and ablation studies confirm the efficacy of the components of MACER framework.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["GraphRAG", "Knowledge Graph", "Multi Agent"], "openreview_url": "https://openreview.net/forum?id=AWNvtEkkOx", "contribution_types": ["Engineering"]}, {"id": "WmjFMCFIcC", "title": "Low-probability Tokens Sustain Exploration in Reinforcement Learning with Verifiable Reward", "abstract": "Reinforcement Learning with Verifiable Rewards (RLVR) has propelled Large Language Models in complex reasoning, yet its scalability is often hindered by a training bottleneck where performance plateaus as policy entropy collapses, signaling a loss of exploration. While previous methods attempt to maintain high entropy, we argue that unselective entropy maximization risks amplifying irrelevant noise rather than fostering meaningful exploration. In this paper, we identify a deeper issue: the gradual elimination of valuable low-probability exploratory tokens, which we term reasoning sparks, driven by RLVR over-penalization. To address this, we introduce Low-probability Regularization (Lp-Reg). Leveraging the statistical distinction where reasoning sparks exhibit higher probabilities than noise, Lp-Reg constructs a filtered, re-normalized proxy distribution. By penalizing deviations from this proxy via forward KL divergence, our method selectively shields these valuable tokens from elimination. Experiments demonstrate that Lp-Reg enables stable on-policy training for over $3,000$ steps (81,204 GPU-hours), sustaining exploration in regimes where baselines typically collapse. Validated across extensive evaluations totaling over 300,000 cumulative GPU-hours, Lp-Reg consistently achieves state-of-the-art performance across diverse model families, sizes, and domains, with relative accuracy improvements ranging from $3.06\\%$ to $7.98\\%$.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reasoning LLM", "RLVR", "Low Probability Token", "Exploration"], "openreview_url": "https://openreview.net/forum?id=WmjFMCFIcC", "contribution_types": ["Analysis", "Engineering"]}, {"id": "Pq7tTNLgQh", "title": "TiMem: Temporal-Hierarchical Memory Consolidation for Long-Horizon Conversational Agents", "abstract": "Long-horizon conversational agents have to manage ever-growing interaction histories that quickly exceed the finite context windows of large language models (LLMs). Existing memory frameworks provide limited support for temporally structured information across hierarchical levels, often leading to fragmented memories and unstable long-horizon personalization. We present TiMem, a temporal--hierarchical memory framework that organizes conversations through a Temporal Memory Tree (TMT), enabling systematic memory consolidation from raw conversational observations to progressively abstracted persona representations. TiMem is characterized by three core properties: (1) temporal--hierarchical organization through TMT; (2) semantic-guided consolidation that enables memory integration across hierarchical levels without fine-tuning; and (3) complexity-aware memory recall that balances precision and efficiency across queries of varying complexity. Under a consistent evaluation setup, TiMem achieves state-of-the-art accuracy on both benchmarks, reaching 75.30% on LoCoMo and 76.88% on LongMemEval-S. It outperforms all evaluated baselines while reducing the recalled memory length by 52.20% on LoCoMo. Manifold analysis indicates clear persona separation on LoCoMo and reduced dispersion on LongMemEval-S. Overall, TiMem treats temporal continuity as a first-class organizing principle for long-horizon memory in conversational agents. Code is available at https://anonymous.4open.science/r/TiMem.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/TiMem", "https://anonymous.4open.science/r/TiMem.0361Introduction037LargeLanguageModels"], "keywords": ["Long-Horizon Conversational Agents", "Temporal-Hierarchical Memory", "Memory Consolidation", "Complexity-Aware Recall", "Agent Memory Systems"], "openreview_url": "https://openreview.net/forum?id=Pq7tTNLgQh", "contribution_types": ["Analysis", "Engineering"]}, {"id": "inqN1rBIxq", "title": "LongAct: Harnessing Intrinsic Activation Patterns for Long-Context Reinforcement Learning", "abstract": "Reinforcement Learning (RL) has emerged as a critical driver for enhancing the reasoning capabilities of Large Language Models (LLMs). While recent advancements have focused on reward engineering or data synthesis, few studies exploit the model's intrinsic representation characteristics to guide the training process. In this paper, we first observe the presence of high-magnitude activations within the query and key vectors when processing long contexts.  Drawing inspiration from model quantization—which establishes the criticality of such high-magnitude activations—and the insight that long-context reasoning inherently exhibits a sparse structure, we hypothesize that these weights serve as the pivotal drivers for effective model optimization. Based on this insight, we propose LongAct, a strategy that shifts from uniform to saliency-guided sparse updates. By selectively updating only the weights associated with these significant activations, LongAct achieves an approximate 8\\% improvement on LongBench v2 and enhances generalization on the RULER benchmark. Furthermore, our method exhibits remarkable universality, consistently boosting performance across diverse RL algorithms such as GRPO and DAPO. Extensive ablation studies confirm that high-magnitude activations pinpoint the model's most sensitive components, demonstrating that focusing on these salient features is key to unlocking long-context potential.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Long-context", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=inqN1rBIxq", "contribution_types": ["Engineering"]}, {"id": "DDZw4Y5gHY", "title": "ExecVerify: White-Box RL with Verifiable Stepwise Rewards for Code Execution Reasoning", "abstract": "Code LLMs still struggle with code execution reasoning, especially in smaller models. Existing methods rely on supervised fine-tuning (SFT) with teacher-generated explanations, primarily in two forms: (1) input–output (I/O) prediction chains and (2) natural-language descriptions of execution traces. However, intermediate execution steps cannot be explicitly verified during SFT, so the training objective can reduce to merely matching teacher explanations. Moreover, training data is typically collected without explicit control over task difficulty. We introduce ExecVerify, which goes beyond text imitation by incorporating verifiable white-box rewards derived from execution traces, including next-statement prediction and variable value/type prediction. Our work first builds a dataset with multiple difficulty levels via constraint-based program synthesis. Then, we apply reinforcement learning (RL) to reward correct answers about both intermediate execution steps and final outputs, aligning the training objective with semantic correctness at each execution step. Finally, we adopt a two-stage training pipeline that first enhances execution reasoning and then transfers to code generation. Experiments demonstrate that a 7B model trained with ExecVerify achieves performance comparable to 32B models on code reasoning benchmarks and improves pass@1 by up to 5.9% on code generation tasks over strong post-training baselines.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["code execution reasoning", "data synthesis", "reinforcement learning", "code LLMs", "code generation"], "openreview_url": "https://openreview.net/forum?id=DDZw4Y5gHY", "contribution_types": ["Engineering", "Efficiency", "Dataset"]}, {"id": "jObTrB6rwY", "title": "Inflated Excellence or True Performance? Rethinking Medical Diagnostic Benchmarks with Dynamic Evaluation", "abstract": "Medical diagnostics is a high-stakes and complex domain that is critical to patient care. \nHowever, current evaluations of large language models (LLMs) are fundamentally misaligned with real-world clinical practice. \nMost rely on benchmarks derived from public exams, raising contamination bias that can inflate performance, and they overlook the confounded nature of real consultations beyond textbook cases.\nRecent dynamic evaluations offer a promising alternative, but often remain insufficient for realistic diagnostic benchmarking, with limited coverage of clinically grounded confounders and trustworthiness beyond accuracy.\nTo address these gaps, we propose DyReMe, a dynamic benchmark for medical diagnostics that better reflects real clinical practice. Unlike static exam-style questions, DyReMe generates fresh, consultation-like cases that introduce distractors such as differential diagnoses and common misdiagnosis factors. It also varies expression styles to mimic diverse real-world query habits. Beyond accuracy, DyReMe evaluates LLMs on three additional clinically relevant dimensions: veracity, helpfulness, and consistency. Our experiments demonstrate that this dynamic approach yields more challenging and realistic assessments, revealing significant misalignments between the performance of state-of-the-art LLMs and real clinical practice. These findings highlight the urgent need for evaluation frameworks that better reflect the demands of trustworthy medical diagnostics.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["medical diagnostic", "benchmark", "dynamic evalution", "large language model"], "openreview_url": "https://openreview.net/forum?id=jObTrB6rwY", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "BTgWJzUVMe", "title": "ALDEN: Reinforcement Learning for Active Navigation and Evidence Gathering in Long Documents", "abstract": "While Vision–language models (VLMs) interpret text-rich images effectively, they struggle with reasoning across long, multi-page documents. We present $\\textbf{A}$ctive $\\textbf{L}$ong-$\\textbf{D}$ocum$\\textbf{E}$nt $\\textbf{N}$avigation (ALDEN), a multi-turn reinforcement learning framework that fine-tunes VLMs as interactive agents capable of actively navigating long, visually rich documents rather than passive readers. ALDEN features a novel $\\texttt{fetch}$ action that allows direct page indexing, complementing the classic $\\texttt{search}$ action and better exploiting document structure. To ensure training efficiency and stability, we introduce a rule-based cross-level reward for dense supervision and a visual-semantic anchoring mechanism utilizing dual-path KL-divergence constraints. We train ALDEN on a curated corpus built from open-source datasets where trivial samples are filtered, and queries are rewritten to incentivize multi-turn navigation and fetch usage. Empirically, ALDEN achieves state-of-the-art results on five long-document benchmarks, offering a more accurate and efficient path for long-document understanding.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Document Understanding", "Visual Language Model", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=BTgWJzUVMe", "contribution_types": ["Dataset"]}, {"id": "YzPeFDZK4J", "title": "MACS CODER: A Multi-Agent Coding Framework for Small LMs --- From Fast Thinking to Deep Planning", "abstract": "Current multi-agent coding frameworks are often resource-intensive, employing a one-size-fits-all strategy that lacks efficiency. We propose MACS-Coder (Multi-Agent Adaptive Coding Structure), a dual-process framework inspired by human cognition. It adaptively switches between a Fast Thinking System for rapid, low-cost generation and a Deep Planning System---comprising specialized planning, templating, and debugging agents---for complex tasks. This architecture enables compact open-source models to achieve performance comparable to elite proprietary systems with significantly lower energy consumption. Extensive evaluations show that MACS-Coder achieves new SOTA results: using a gpt-oss-20B backbone, it attains 99.4% on HumanEval, 93.2% on MBPP, and 83.2% on LiveCodeBench V5, consistently outperforming prior methods like CodeSIM and MapCoder. Notably, our 20B-parameter framework matches the performance of top-tier models such as o4-mini and Gemini 2.5 Pro, bridging the gap between small open-source and large closed-source systems. We will open-source our framework and evaluation suite available here: https://anonymous.4open.science/r/MACS-Coder-B161HIIRqq0023", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MACS-Coder-B161HIIRqq0023"], "keywords": ["Multi-Agent Systems", "Code Generation", "Large Language Models (LLMs)", "Test-time Compute"], "openreview_url": "https://openreview.net/forum?id=YzPeFDZK4J", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "UgeycXIdn5", "title": "Context-Aware API Reranking for Custom Developer Requirements in Code Completion", "abstract": "Large Language Models (LLMs) have made significant advancements in automatic code completion. \nGiven the rapid pace of API updates and the restricted proprietary documentation of enterprise environments, selecting suitable APIs for automatic code completion from vast third-party and private libraries plays a critical role.\nHowever, existing solutions struggle to accurately recommend APIs when developers present customized requirements within an incomplete code context. To bridge this gap, we propose a context-aware approach APIRANKER to rerank candidate API documents based on both the explicit developer intent and implicit cues in the incomplete code context.  To generate training data for this task, we introduce a self-supervised ranking framework that automatically constructs data by assessing the relevance of API documents to code context with a perplexity-driven approach via comments.  To enhance API relevance detection, we propose a novel reranking model that predicts relevance scores by capturing a hidden reasoning state to estimate relevance.  The experimental results show the effectiveness of our approach in recommending more accurate APIs.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/APIRanker-C442pandas.DataFrame.sort_valuespandas.dt.strftimepandas.Data", "https://anonymous.4open.science/r/APIRanker-C442"], "keywords": ["code understanding", "API Recommendations"], "openreview_url": "https://openreview.net/forum?id=UgeycXIdn5", "contribution_types": ["Engineering", "Low-resource", "Dataset"]}, {"id": "hFrtf7oaMP", "title": "Learning to Think on Hypergraph: HyperCoT for Structure-Guided N-ary Knowledge Graph Completion", "abstract": "$N$-ary knowledge graph completion (KGC) aims to infer missing components in facts with multiple entities under distinct semantic roles, commonly formulated as a knowledge hypergraph link prediction task. Most embedding-based approaches score individual hyperedges relying on enriched structural representations, but overlook intermediate propagation states containing complementary local and global structural evidence. Despite their capability to generate chain-of-thought (CoT) representations for the classical KGC task, large language models (LLMs) struggle with hypergraph structure involving multiple facts, while current hypergraph QA methods only provide LLMs with a single query signal rather than path-level evidence. These limitations hinder the transferability of existing methods, especially those leveraging LLMs, to solve knowledge hypergraph link prediction problem. To bridge this gap, we propose HyperCoT, a structure-aware approach that models multi-hop structural reasoning as a depth-sensitive progressive evidence accumulation process. It constructs a Graphical Chain-of-Thought (Graph-CoT) by aggregating role-aware hyperedge states along strongly correlated reasoning paths, and injects the resulting path-level structural evidence into each token in query and candidate entities to prompt LLMs. Experiments on JF17K, WikiPeople, and FB-AUTO demonstrate that HyperCoT consistently outperforms strong $n$-ary KGC baselines, particularly in high arity and structural sparsity scenarios, while yielding interpretable multi-hop reasoning traces.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["N-ary Knowledge Graph Completion", "Hypergraph Reasoning", "Graph-based Methods", "Knowledge-Augmented Generation", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=hFrtf7oaMP", "contribution_types": ["Analysis", "Engineering"]}, {"id": "lDJ1lrMxaS", "title": "Trade-R1: Bridging Verifiable Rewards to Stochastic Environments via Process-Level Reasoning Verification", "abstract": "Reinforcement Learning (RL) has enabled Large Language Models (LLMs) to achieve remarkable reasoning in domains like mathematics and coding, where verifiable rewards provide clear signals. However, extending this paradigm to financial decision is challenged by the market's stochastic nature: rewards are verifiable but inherently noisy, causing standard RL to degenerate into reward hacking. To address this, we propose Trade-R1, a model training framework that bridges verifiable rewards to stochastic environments via process-level reasoning verification. Our key innovation is a verification method that transforms the problem of evaluating reasoning over lengthy financial documents into a structured Retrieval-Augmented Generation (RAG) task. We construct a triangular consistency metric, assessing pairwise alignment between retrieved evidence, reasoning chains, and decisions to serve as a validity filter for noisy market returns. We explore two reward integration strategies: Fixed-effect Semantic Reward (FSR) for stable alignment signals, and Dynamic-effect Semantic Reward (DSR) for coupled magnitude optimization. Experiments on different country asset selection demonstrate that our paradigm reduces reward hacking, with DSR achieving superior cross-market generalization while maintaining the highest reasoning consistency.", "area": "Finance", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Reinforcement Learning", "Reward Hacking", "Quantitative Trading", "Verifiable Rewards"], "openreview_url": "https://openreview.net/forum?id=lDJ1lrMxaS", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency", "Data Analysis"]}, {"id": "Mi29bQbAr7", "title": "Bootstrapping Action-Grounded Visual Dynamics in Unified Vision–Language Models", "abstract": "Can unified vision--language models (VLMs) perform forward dynamics prediction (FDP), i.e., predicting the future state (in image form) given the previous observation and an action (in language form)? We find that VLMs struggle to generate physically plausible transitions between frames from instructions. \nNevertheless, we identify a crucial asymmetry in multimodal grounding: fine-tuning a VLM to learn inverse dynamics prediction (IDP)—effectively captioning the action between frames—is significantly easier than learning FDP.\nIn turn, IDP can be used to bootstrap FDP through two main strategies: 1) weakly supervised learning from synthetic data and 2) inference time verification. Firstly, IDP can annotate actions for unlabelled pairs of video frame observations to expand the training data scale for FDP. Secondly, IDP can assign rewards to multiple samples of FDP to score them, effectively guiding search at inference time. We evaluate the FDP resulting from both strategies through the task of action-centric image editing on Aurora-Bench with two families of VLMs. Despite remaining general-purpose, our best model achieves a performance competitive with state-of-the-art image editing models, improving on them by a margin of 15% on real-world subsets according to GPT4o-as-judge, and achieving the best average human evaluation across all subsets of Aurora-Bench.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["vision-language model", "world model", "inverse-dyanmics model", "language grounding"], "openreview_url": "https://openreview.net/forum?id=Mi29bQbAr7", "contribution_types": ["Engineering"]}, {"id": "ffkXPkpvL6", "title": "Beyond Compliance: A Resistance-Informed Motivation Reasoning Framework for Challenging Psychological Client Simulation", "abstract": "Psychological client simulators have emerged as a scalable solution for training and evaluating counselor trainees and psychological LLMs. Yet existing simulators exhibit unrealistic over-compliance, leaving counselors underprepared for the challenging behaviors common in real-world practice. \nTo bridge this gap, we present ResistClient, which systematically models challenging client behaviors grounded in Client Resistance Theory by integrating external behaviors with underlying motivational mechanisms. To this end, we propose Resistance-Informed Motivation Reasoning (RIMR), a two-stage training framework. First, RIMR mitigates compliance bias via supervised fine-tuning on RPC, a large-scale resistance-oriented psychological conversation dataset covering diverse client profiles. Second, beyond surface-level response imitation, RIMR models psychologically coherent motivation reasoning before response generation, jointly optimizing motivation authenticity and response consistency via process-supervised reinforcement learning. Extensive automatic and expert evaluations show that ResistClient substantially outperforms existing simulators in challenge fidelity, behavioral plausibility, and reasoning coherence. Moreover, ResistClient facilities evaluation of psychological LLMs under challenging conditions, offering new optimization directions for mental health dialogue systems.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ResistClient"], "keywords": ["Client Simulation; Psychological Conversation; Motivation Reasoning; Reinforcement Learning;"], "openreview_url": "https://openreview.net/forum?id=ffkXPkpvL6", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "0ynEbH7kHy", "title": "SDAR-VL: Stable and Efficient Block-wise Diffusion for Vision-Language Understanding", "abstract": "Block-wise discrete diffusion offers an attractive balance between parallel generation and causal dependency modeling, making it a promising backbone for vision-language modeling. However, its practical adoption has been limited by high training cost, slow convergence, and instability, which have so far kept it behind strong autoregressive (AR) baselines.\nWe present \\textbf{SDAR-VL}, the first systematic application of block-wise discrete diffusion to large-scale vision-language understanding (VLU), together with an \\emph{integrated framework for efficient and stable training}. This framework unifies three components: 1) \\textbf{Asynchronous Block-wise Noise Scheduling} to diversify supervision within each batch; 2) \\textbf{Effective Mask Ratio Scaling} for unbiased loss normalization under stochastic masking; and 3) a \\textbf{Progressive Beta Noise Curriculum} that increases effective mask coverage while preserving corruption diversity.\nExperiments on 21 single-image, multi-image, and video benchmarks show that SDAR-VL consistently improves \\emph{training efficiency}, \\emph{convergence stability}, and \\emph{task performance} over conventional block diffusion. On this evaluation suite, SDAR-VL sets a new state of the art among diffusion-based vision-language models and, under matched settings, matches or surpasses strong AR baselines such as LLaVA-OneVision as well as the global diffusion baseline LLaDA-V, establishing block-wise diffusion as a practical backbone for VLU.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vision-Language Models", "Discrete Diffusion", "Block-wise Generation", "Multimodal Understanding", "Efficient Training", "Chain-of-Thought"], "openreview_url": "https://openreview.net/forum?id=0ynEbH7kHy", "contribution_types": ["Engineering"]}, {"id": "9tjbXN2YYg", "title": "MemTR: Enhancing Tool-Calling Reliability via Uncertainty-Triggered FFN-Space Retracing", "abstract": "Tool calling requires Large Language Models (LLMs) to generate structured decisions including tool names and schema-constrained arguments, where small decoding mistakes can cause hard failures. Existing methods either rely on costly tool-use training data or only constrain syntax, leaving tool selection and argument value errors largely unsolved.\nWe analyze tool-calling failures through a Where–When lens: (Where) failures correlate with persistent uncertainty in late Transformer layers, (When) uncertainty concentrates on content-bearing tokens (tool names and argument values) rather than schema tokens. \nBased on this, and motivated by evidence that transformer Feed-Forward Network (FFN) function as key–value style memories that store and retrieve factual or associative mappings, we propose Memory Space Tool Retracing (MemTR), a weight-free decoding-time method that retrieves relevant tool evidence from the tool library and mixes it into the FFN output at the uncertain layer, treating FFNs as key–value memories.\nAcross BFCL, ACEBench, and APIBank on Llama, Qwen and xLAM, MemTR yields a 2\\%–9\\% relative reduction in tool-calling failure rate with 1\\%–2\\% runtime overhead, without fine-tuning. Our implementation code will be released as open-source software after publication.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["tool calling", "function calling", "large language models", "decoding-time intervention", "constrained decoding", "uncertainty estimation"], "openreview_url": "https://openreview.net/forum?id=9tjbXN2YYg", "contribution_types": ["Analysis", "Engineering", "Low-resource"]}, {"id": "R0Qxdf7mDL", "title": "Beyond Chunks and Graphs: Retrieval-Augmented Generation through Triplet-Driven Thinking", "abstract": "Retrieval-augmented generation (RAG) is critical for reducing hallucinations and incorporating external knowledge into Large Language Models (LLMs). However, advanced RAG systems face a trade-off between performance and efficiency. Multi-round RAG approaches achieve strong reasoning but incur excessive LLM calls and token costs, while Graph RAG methods suffer from computationally expensive, error-prone graph construction and retrieval redundancy. To address these challenges, we propose T$^2$RAG, a novel framework that operates on a simple, graph-free knowledge base of atomic triplets. T$^2$RAG leverages an LLM to decompose questions into searchable triplets with placeholders, which it then iteratively resolves by retrieving evidence from the triplet database. Empirical results show that T$^2$RAG significantly outperforms state-of-the-art multi-round and Graph RAG methods, achieving an average performance gain of up to 11% across six datasets while reducing retrieval costs by up to 45%.", "area": "RAG", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/T2RAG-DF75.0251Introduction026LargeLanguageModels", "https://anonymous.4open.science/r/T2RAG-DF75"], "keywords": ["retrieval-augmented generation", "chain-of-thought", "knowledge graphs"], "openreview_url": "https://openreview.net/forum?id=R0Qxdf7mDL", "contribution_types": ["Efficiency"]}, {"id": "pLOz4RLbdi", "title": "Non-invasive electromyographic speech neuroprosthesis: a geometric perspective", "abstract": "We present a neuromuscular speech interface that translates silently voiced articulations directly into text. We record surface electromyographic (EMG) signals from multiple articulatory sites on the face and neck as participants *silently* articulate speech, enabling direct EMG-to-text translation. Such an interface has the potential to restore communication for individuals who have lost the ability to produce intelligible speech due to laryngectomy, neuromuscular disease, stroke, or trauma-induced damage (e.g., radiotherapy toxicity) to the speech articulators. Prior work has largely focused on mapping EMG collected during *audible* articulation to time-aligned audio targets or transferring these targets to *silent* EMG recordings, which inherently requires audio and limits applicability to patients who can no longer speak. In contrast, we propose an efficient representation of high-dimensional EMG signals and demonstrate direct sequence-to-sequence EMG-to-text conversion at the phonemic level without relying on time-aligned audio.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Neuromotor speech interfaces", "electromyographic (EMG)", "speech neuroprosthesis", "accessible speech technology", "brain-computer interfaces"], "openreview_url": "https://openreview.net/forum?id=pLOz4RLbdi", "contribution_types": ["Low-resource", "Efficiency", "Dataset"]}, {"id": "Mnk9Lu4uwl", "title": "Route-Induced Density and Stability (RIDE): Controlled Intervention and Mechanism Analysis of Routing-Style Meta Prompts on LLM Internal States", "abstract": "Routing is widely used to scale large language models, from Mixture-of-Experts gating to multi-model/tool selection. A common belief is that routing to a task ``expert'' activates sparser internal computation and thus yields more certain and stable outputs (the Sparsity--Certainty Hypothesis). We test this belief by injecting routing-style meta prompts as a textual proxy for routing signals in\nfront of frozen instruction-tuned LLMs. We quantify (C1) internal density via activation sparsity, (C2) domain-keyword attention, and (C3) output stability via predictive entropy and semantic variation. On a RouterEval subset with three instruction-tuned models (Qwen3-8B, Llama-3.1-8B-Instruct, and Mistral-7B-Instruct-v0.2), meta prompts consistently densify early/middle-layer representations rather than increasing sparsity; natural-language expert instructions are often stronger than structured tags. Attention responses are heterogeneous: Qwen/Llama reduce keyword attention, while Mistral reinforces it. Finally, the densification--stability link is weak and appears only in Qwen, with near-zero correlations in Llama and Mistral. We present RIDE as a diagnostic probe for calibrating routing design and uncertainty estimation.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["multi-model routing", "Mixture-of-Experts", "routing signals", "Meta-prompt Intervention", "mechanistic interpretability", "representation densification"], "openreview_url": "https://openreview.net/forum?id=Mnk9Lu4uwl", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "7QSyFxTr8o", "title": "Efficient Structured Reasoning Framework for SLMs via Dynamic Directed Acyclic Graph Construction", "abstract": "Small Language Models (SLMs) offer substantial cost efficiency but often struggle with complex reasoning tasks due to their limited parameter capacity. While methods such as Chain-of-Thought (CoT) and ReAct have proven effective for Large Language Models (LLMs), their effectiveness remains limited in the context of SLMs. Tree of Thoughts (ToT) enhances reasoning by enabling multi-path exploration, but poses practical limitations for SLMs due to its high computational overhead and limited extensibility for external tool integration. In this paper, we propose an Efficient Structured Reasoning Framework via Dynamic DAG Construction to enhance the reasoning capabilities of SLMs. Inspired by cognitive insights, the framework modularizes human problem-solving into “Atomic Thinking” components and dynamically reassembles them into a task-specific Directed Acyclic Graph (DAG), effectively pruning the reasoning search space. In addition, the framework compensates for the inherent limitations of SLMs by augmenting them with external knowledge through a modular architecture that supports node-level tool integration. Applied to 20B-scale SLMs, our framework achieves GPT-4o-level performance across various benchmarks with an average of seven model calls per problem, and outperforms ToT in both token efficiency and inference speed under equal accuracy.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Efficient-Structured-Reasoning-Framework-for-SLMs-via-Dynamic-Directed-Acyclic-Graph-Construction-4E0D"], "keywords": ["Small Language Models (SLMs)", "Test-time Scaling", "Directed Acyclic Graph (DAG)", "Structured Reasoning", "Cognitive Modeling"], "openreview_url": "https://openreview.net/forum?id=7QSyFxTr8o", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency"]}, {"id": "hxVBo0digl", "title": "Deep Think with Rehearsal for Low-Latency Team-AI Collaboration", "abstract": "The integration of Large Language Models (LLMs) into scientific team meetings presents exciting opportunities to accelerate biomedical discovery, especially through their strong deep thinking capabilities enabled by multi-step reasoning and web search. However, such methods are computationally expensive and introduce substantial latency, limiting their effectiveness in real-time Team-AI communications. In this study, we propose Deep Think with Rehearsal (DTR), a novel framework that decouples deep reasoning from synchronous interaction in the AI4Science context. DTR transfers computationally intensive reasoning into an offline rehearsal phase, allowing the LLM to pre-cognize complex scientific contexts and deliver high-quality, \"deep\" insights with minimal latency during live interactions. To facilitate this research, we introduce the Scientific Team Meeting Dataset (STMD), a hybrid benchmark comprising authentic transcripts from three real-world biomedical research labs alongside extensive simulated multi-party deliberations synthesized from PubMed literature. Experiments in both simulated and real-world settings demonstrate that DTR consistently improves response quality while reducing inference latency compared to state-of-the-art methods, highlighting the effectiveness of rehearsal in enabling low-latency, high-quality scientific collaboration.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Human-AI Collaboration", "Large Language Models", "LLM reasoning", "Low-Latency Interaction", "Biomedical NLP", "Tool-Augmented Reasoning"], "openreview_url": "https://openreview.net/forum?id=hxVBo0digl", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "xC7MkZNyGS", "title": "emg2speech: synthesizing speech from electromyography using self-supervised speech models", "abstract": "We present a neuromuscular speech interface that translates electromyographic (EMG) signals recorded from orofacial muscles during speech articulation directly into audio. We find that self-supervised speech representations (SS) are strongly linearly related to the electrical power of muscle activity: a simple linear mapping predicts EMG power from SS with a correlation of *r* = 0.85. In addition, EMG power vectors associated with distinct articulatory gestures form structured, separable clusters. Together, these observations suggest that SS implicitly encode articulatory mechanisms, as reflected in EMG activity. Leveraging this structure, we map EMG signals into the SS space and synthesize speech, enabling end-to-end EMG-to-speech generation without explicit articulatory modeling or vocoder training. We demonstrate this system with a participant with amyotrophic lateral sclerosis (ALS), converting orofacial EMG recorded while she *silently* articulated speech into audio.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Neuromotor speech interfaces", "electromyography (EMG)", "speech neuroprosthesis", "accessible speech technology", "brain-computer interfaces"], "openreview_url": "https://openreview.net/forum?id=xC7MkZNyGS", "contribution_types": ["Low-resource", "Efficiency", "Dataset"]}, {"id": "KGHe9zHnrO", "title": "Robust Instruction Following via Reinforcement Learning", "abstract": "Instruction following has become a cornerstone capability of Large Language Models (LLMs) since the advent of ChatGPT. Despite its significance, we observe that existing training paradigms often lead to a catastrophic degradation in multi-step reasoning performance. This phenomenon is counter-intuitive, as robust instruction adherence should theoretically augment, rather than hinder, general task performance. To bridge this gap, we propose **Ro**bust **I**nstruction **F**ollowing via **R**einforcement **L**earning (**RoIFRL**), a novel RL training framework. RoIFRL reframes instruction following as a composite task consisting of  _constraint adherence_ and _sequential execution_. Furthermore, it introduces a two-dimensional curriculum that dynamically orchestrates data sampling from two subtasks by aligning the data mixture and the instruction complexity with the policy model’s evolving capabilities. We synthesize a comprehensive set of verifiable RL training data covering both subtasks. Extensive experiments and ablation studies demonstrate that RoIFRL not only preserves but further enhances multi-step reasoning while significantly improving standard instruction-following benchmarks, like IFEval.", "area": "Language Models", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Instruction Following", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=KGHe9zHnrO", "contribution_types": ["Analysis", "Dataset"]}, {"id": "qoxNsgJt7A", "title": "AgentOrchestra: Orchestrating Multi-Agent Intelligence with the Tool-Environment-Agent(TEA) Protocol", "abstract": "Recent advances in LLM-based agent systems have shown promise in tackling complex, long-horizon tasks. However, existing LLM-based agentprotocols (e.g., A2A and MCP) under-specify cross-entity lifecycle and context management, version tracking, and ad-hoc environment integration, which in turn encourages fixed, monolithic agent compositions and brittle glue code. To address these limitations, we introduce the \\textbf{Tool–Environment–Agent} (TEA) protocol, a unified abstraction that models environments, agents, and tools as first-class resources with explicit lifecycles and versioned interfaces. TEA provides a principled foundation for end-to-end lifecycle and version management, and for associating each run with its context and outputs across components, improving traceability and reproducibility. Moreover, TEA enables continual self-evolution of agent-associated components\\footnote{Unless otherwise specified, \\emph{agent-associated components} include prompts, memory/tool/agent/environment code, and agent outputs (solutions).} through a closed feedback loop, producing improved versions while supporting version selection and rollback. Building on TEA, we present AgentOrchestra, a hierarchical multi-agent framework in which a central planner orchestrates specialized sub-agents for web navigation, data analysis, and file operations, and supports continual adaptation by dynamically instantiating, retrieving, and refining tools online during execution. We evaluate AgentOrchestra on three challenging benchmarks, where it consistently outperforms strong baselines and achieves 89.04\\% on GAIA, establishing state-of-the-art performance to the best of our knowledge. Overall, our results provide evidence that TEA and hierarchical orchestration improve scalability and generality in multi-agent systems.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multi Agent Framework", "Model Context Protocol", "LLM", "General-purpose Task Solving", "Deep Research"], "openreview_url": "https://openreview.net/forum?id=qoxNsgJt7A", "contribution_types": ["Engineering"]}, {"id": "vAvRjRZth4", "title": "STaD: Scaffolded Task Design for Identifying Compositional Skill Gaps in LLMs", "abstract": "Benchmarks are often used as a standard to understand LLM capabilities in different domains. However, aggregate benchmark scores provide limited insight into compositional skill gaps of LLMs and how to improve it. To make these weaknesses visible, we propose Scaffolded Task Design (STaD) framework. STaD generates controlled variations of benchmark tasks based on the concept of scaffolding, which introduces structured, incremental support in a step-by-step manner. Rather than inspecting failures individually, this approach enables systematic and scalable probing of model behavior by identifying the specific reasoning skill compositions they lack. Treating the LLM as a black box, our experiments on six models of varying sizes reveal multiple failure points in three reasoning benchmarks and highlight each model's unique and distinct skill gaps.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Skill Gaps", "Scaffolding", "Benchmark Evaluation", "Variations"], "openreview_url": "https://openreview.net/forum?id=vAvRjRZth4", "contribution_types":
