<script>
const PAPERS = [{"id": "o3l1kEvelu", "title": "What Is Novel? A Knowledge-Driven Framework for Bias-Aware Literature Originality Evaluation", "abstract": "Assessing research novelty is a core yet highly subjective aspect of peer review, typically based on implicit judgment and incomplete comparison to prior work. We introduce a literature-aware novelty assessment framework that explicitly learns how humans judge novelty from peer-review reports and grounds these judgments in structured comparison to existing research. Using nearly 80K novelty-annotated reviews from top-tier AI conferences, we fine-tune a large language model to capture reviewer-aligned novelty evaluation behavior. For a given manuscript, the system extracts structured representations of its ideas, methods, and claims, retrieves semantically related papers, and constructs a similarity graph that enables fine-grained, concept-level comparison to prior work. Conditioning on this structured evidence, the model produces calibrated novelty scores and human-like explanatory assessments, reducing overestimation and improving consistency relative to existing approaches.", "area": "RAG", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Automated Novelty Assessment", "Large Language Models", "Idea-Level Plagiarism Detection", "Knowledge Graphs", "Information Retrieval"], "openreview_url": "https://openreview.net/forum?id=o3l1kEvelu", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "xGy1XzNXwJ", "title": "Explanation-Consistency Graphs: Neighborhood Surprise in Explanation Space for Training Data Debugging", "abstract": "Training data quality is critical for NLP model performance, yet identifying mislabeled examples remains challenging when models confidently fit errors via spurious correlations. Confident learning methods like Cleanlab assume mislabeled examples cause low confidence; however, this assumption breaks down when artifacts enable confident fitting of wrong labels. We propose Explanation-Consistency Graphs (ECG), which detects problematic training instances by computing neighborhood surprise in explanation embedding space. Our key insight is that LLM-generated explanations capture \"why this label applies,\" and this semantic content reveals inconsistencies invisible to classifier confidence. By embedding structured explanations and measuring k-nearest neighbor (kNN) label disagreement, ECG achieves 0.832 area under the ROC curve (AUROC) on artifact-aligned noise (where Cleanlab drops to 0.107), representing a 24% improvement over the same algorithm on input embeddings (0.671). On random label noise, ECG remains competitive (0.943 vs. Cleanlab's 0.977), demonstrating robustness across noise regimes. We show that the primary value lies in the explanation representation rather than complex signal aggregation, and analyze why naive multi-signal combination can degrade performance when training dynamics signals are anti-correlated with artifact-driven noise.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["training data debugging", "learning with noisy labels", "label error detection", "LLM explanations", "kNN methods", "shortcut learning"], "openreview_url": "https://openreview.net/forum?id=xGy1XzNXwJ", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "koaC5Qgt9C", "title": "AgentEconomist: An End-to-End Agentic System for Translating Economic Intuitions into Executable Computational Experiments", "abstract": "A long-standing challenge in economics lies not in the lack of intuition, but in the difficulty of translating intuitive insights into verifiable research. To address this challenge, we introduce AgentEconomist, an end-to-end interactive system designed to translate abstract intuitions into executable computational experiments. Grounded in a domain-specific knowledge base covering over 8,700 high-quality academic papers, the system employs a multi-agent architecture. Specifically, an Idea Development Agent and an Experimental Design Agent collaborate to formulate theoretically grounded hypotheses and draft experimental protocols. An Experimental Execution Agent then conducts the designed experiments, forming a closed-loop workflow that supports the rapid development, validation, and iterative refinement of economic intuitions. Through extensive experiments involving human expert evaluation and large language models (LLMs) as judges, we show that the system generates research ideas with stronger literature grounding and higher novelty and insight than state-of-the-art generic LLMs. Overall, AgentEconomist adopts a human-AI collaboration paradigm that enables researchers to focus on high-level intuitions, while delegating the labor-intensive processes of translation and computational execution to agents.", "area": "Human-AI", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AgentEconomist-CB75"], "keywords": ["Large Language Model Agents", "AI Scientist", "Interactive System", "Human-AI Collaboration"], "openreview_url": "https://openreview.net/forum?id=koaC5Qgt9C", "contribution_types": ["Engineering", "Data Analysis"]}, {"id": "brMqndJYRg", "title": "Adaptive Retrieval for Reasoning-Intensive Retrieval", "abstract": "We study leveraging adaptive retrieval to ensure sufficient ``bridge'' documents are retrieved for reasoning-intensive retrieval. Bridge documents are those that contribute to the reasoning process yet are not directly relevant to the initial query. While existing reasoning-based reranker pipelines attempt to surface these documents in ranking, they suffer from bounded recall. Naive solution with adaptive retrieval into these pipelines often leads to planning error propagation. To address this, we propose REPAIR, a framework that bridges this gap by repurposing reasoning plans as dense feedback signals for adaptive retrieval. Our key distinction is enabling mid-course correction during reranking through selective adaptive retrieval, retrieving documents that support the pivotal plan. Experimental results on reasoning-intensive retrieval and complex QA tasks demonstrate that our method outperforms existing baselines by 5.6\\%pt.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/RIFT-BEB0"], "keywords": ["re-ranking", "adaptive retrieval"], "openreview_url": "https://openreview.net/forum?id=brMqndJYRg", "contribution_types": ["Engineering"]}, {"id": "tEyTESKCm6", "title": "Can Post-Training Transform LLMs into Causal Reasoners?", "abstract": "Causal inference is essential for decision-making but remains challenging for non-experts. While large language models (LLMs) show promise in this domain, their precise causal estimation capabilities are still limited, and the impact of post-training on these abilities is insufficiently explored. This paper examines the extent to which post-training can enhance LLMs’ capacity for causal inference.\nWe introduce CausalGym, a comprehensive dataset comprising seven core causal tasks for training and five diverse test sets. Using this dataset, we systematically evaluate five post-training approaches: SFT, DPO, KTO, PPO, and GRPO. Across five in-domain and four existing benchmarks, our experiments demonstrate that appropriate post-training enables smaller LLMs to perform causal inference competitively, often surpassing much larger models. Our 14B-parameter model achieves 93.5% accuracy on the CaLM benchmark, compared to 55.4% by OpenAI o3. Furthermore, the post-trained LLMs exhibit strong generalization and robustness under real-world conditions such as distribution shifts and noisy data. Collectively, these findings provide the first systematic evidence that targeted post-training can produce reliable and robust LLM-based causal reasoners.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models (LLMs)", "Causal Inference", "Post-training"], "openreview_url": "https://openreview.net/forum?id=tEyTESKCm6", "contribution_types": ["Analysis", "Dataset"]}, {"id": "uDDdZKi6LL", "title": "Conditional Deontics over Terminals: A Mildly Context-Sensitive Formal Grammar for Constrained Decoding", "abstract": "With the broad adoption of large language models (LLMs), techniques to guide their generation have become increasingly important, with particularly sophisticated patterns found in constrained decoding frameworks expressed via formal grammars.\nRecent frameworks such as IterGen expand beyond context-free grammars to achieve some context sensitivity but with drawbacks: expensive backtracking or speculative lookahead, permissive semantics that risk spurious constraint activation, and difficult integration with runtime optimizations like XGrammar.\nTo address these concerns, we propose Conditional Deontics over Terminals (CDoT), a mildly context-sensitive grammar paired with a GPU-accelerated O(n³) parser that can be employed for constrained decoding with LLMs.\nWe show that CDoT can express useful constraints that improve LLM performance in a traditional text-to-SQL task and a complex logic puzzle involving unit propagation.", "area": "Syntax/Parsing", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["constrained decoding; formal grammar"], "openreview_url": "https://openreview.net/forum?id=uDDdZKi6LL", "contribution_types": ["Engineering"]}, {"id": "p1chpVu3Q2", "title": "PEAR: Pairwise Evaluation for Automatic Relative scoring", "abstract": "We present PEAR (Pairwise Evaluation for Automatic Relative scoring), a supervised QE metric family that reframes reference-free MT evaluation as a graded pairwise comparison. Given a source segment and two candidate translations, PEAR predicts the direction and magnitude of their quality difference. PEAR learns from pairwise supervision constructed by differencing human segment-level judgments under an antisymmetry-consistent objective.\n\nOn the WMT24 meta-evaluation benchmark, PEAR outperforms strictly matched single-candidate QE baselines trained with the same data and backbones, isolating the benefit of the proposed pairwise formulation. Despite using substantially fewer parameters than recent large WMT submissions, PEAR surpasses far larger QE models and strong reference-based metrics. Inter-metric analyses further indicate that PEAR yields a less redundant evaluation signal relative to other top metrics. Finally, we show that PEAR is a strong utility for Minimum Bayes Risk decoding, and that an antisymmetry-based shortcut reduces pairwise scoring cost with negligible impact.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine Translation", "Evaluation"], "openreview_url": "https://openreview.net/forum?id=p1chpVu3Q2", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "Uai0vrJgaL", "title": "MetaBench-7: A Multi-Modal Benchmark for Model and Hyperparameter Selection", "abstract": "Hyperparameter selection in machine learning remains a critical challenge often involving tedious trial-and-error or costly optimization processes. This paper presents “MetaBench-7”,a comprehensive metadata dataset that includes seven modalities (Image, Text, Tabular, Graph, Time-Series, Audio, and Video) with their optimal hyperparameter configurations.The collection includes 573 distinct models, each with standardized metadata like dataset size and class count,enabling detailed quantitative investigation of design trends Exploratory Data Analysis shows unique patterns for each modality.Text datasets often use Transformer-based models with large batch sizes and relatively few epochs,while Graph and Tabular datasets use larger batch sizes and more epochs as dataset size increases. The model-modality specialization statistics indicate that certain architectures, like ResNet50 and XGBoost, are specialized for specific modalities, whereas Transformer variants can work across multiple modalities The dataset provides “safe default” hyperparameter configurations tailored to each modality, offering reliable baselines for new datasets.The dataset serves as a valuable, reusable resource for meta-learning, AutoML and research into the hyperparameter performance dynamics.", "area": "Information Extraction and Retrieval", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Hyperparameters", "Meta Data", "Model Training", "AutoML", "Fine tuning", "Machine Learning"], "openreview_url": "https://openreview.net/forum?id=Uai0vrJgaL", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "qJZ1QVyGg8", "title": "Towards semantic reliable clinical QA: Query pipeline optimization for cancer patient question answering systems", "abstract": "Large Language Models (LLMs) show promise in medical Question-Answering (QA) but suffer from hallucinations that jeopardize patient safety. While Retrieval-Augmented Generation (RAG) mitigates this by grounding outputs in external evidence, existing pipelines struggle with the complex, rapidly evolving nature of oncology. We present \\textbf{CoMeta}, a three-level controllable metadata-aware framework optimized for Cancer Patient QA (CPQA). We introduce Clinical Hybrid Semantic-Symbolic Document Retrieval (CHSDR), which synergizes real-time Boolean search via NCBI E-Utilities with semantic retrieval to overcome metadata blindness. Additionally, we propose Semantic Enhanced Overlap Segmentation (SEOS) to prevent contextual fragmentation. Our results demonstrate that CHSDR significantly improves retrieval performance, CoMeta improved the answer accuracy of Claude-3-haiku by 5.24\\% over chain-of-thought prompting and about 3\\% over a naive RAG setup. This study highlights the importance of domain-specific query optimization in realizing the full potential of RAG and provides a robust framework for building more accurate and reliable CPQA systems.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Medical Question-Answering; Clinical Dataset; RAG for Clinical Application; Cancer Patient QA"], "openreview_url": "https://openreview.net/forum?id=qJZ1QVyGg8", "contribution_types": ["Engineering", "Reproduction", "Low-resource", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "dTCSbhz6c0", "title": "FeedEval: Pedagogically Aligned Evaluation of LLM-Generated Essay Feedback", "abstract": "Going beyond the prediction of numerical scores, recent research in automated essay scoring has increasingly emphasized the generation of high-quality feedback that provides justification and actionable guidance. To mitigate the high cost of expert annotation, prior work has commonly relied on LLM-generated feedback to train essay assessment models. However, such feedback is often incorporated without explicit quality validation, resulting in the propagation of noise in downstream applications. To address this limitation, we propose FeedEval, an LLM-based framework for evaluating LLM-generated essay feedback along three pedagogically grounded dimensions: specificity, helpfulness, and validity. FeedEval employs dimension-specialized LLM evaluators trained on datasets curated in this study to assess multiple feedback candidates and select high-quality feedback for downstream use. Experiments on the ASAP++ benchmark show that FeedEval closely aligns with human expert judgments and that essay scoring models trained with FeedEval-filtered high-quality feedback achieve superior scoring performance. Furthermore, revision experiments using small LLMs show that the high-quality feedback identified by FeedEval leads to more effective essay revisions. We release our code and curated datasets at: https://anonymous.4open.science/r/anonymized_acl-1342.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/anonymized_acl-1342"], "keywords": ["Essay Feedback Evaluation", "Large Language Model", "Pedagogical Alignment", "Essay Assessment"], "openreview_url": "https://openreview.net/forum?id=dTCSbhz6c0", "contribution_types": ["Data Analysis"]}, {"id": "DhyLEEu6Uv", "title": "OnlineMate: An LLM-Based Multi-Agent Companion System for Cognitive Support in Online Learning", "abstract": "In online learning environments, students often lack personalized peer interactions, which are crucial for cognitive development and learning engagement. Although previous studies have employed large language models (LLMs) to simulate interactive learning environments, these interactions are limited to conversational exchanges, failing to adapt to learners’ individualized cognitive and psychological states. As a result, students’ engagement is low and they struggle to gain inspiration. To address this challenge, we propose **OnlineMate**, a multi-agent learning companion system driven by LLMs integrated with Theory of Mind (ToM). OnlineMate simulates peer-like roles, infers learners’ psychological states such as misunderstandings and confusion during collaborative discussions, and dynamically adjusts interaction strategies to support higher-order thinking. Comprehensive evaluations, including simulation-based experiments, human assessments, and real classroom trials, demonstrate that OnlineMate significantly promotes deep learning and cognitive engagement by elevating students’ average cognitive level while substantially improving emotional engagement scores.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Theory of Mind", "Online Learning", "LLM for Education", "Role Play", "LLM-based Agent", "Multi-agent System"], "openreview_url": "https://openreview.net/forum?id=DhyLEEu6Uv", "contribution_types": ["Engineering"]}, {"id": "jSFegTEP4V", "title": "DPC: Training-Free Text-to-SQL Candidate Selection via Dual-Paradigm Consistency", "abstract": "While Large Language Models (LLMs) demonstrate impressive proficiency in generating SQL queries, they fundamentally lack the capability to self-evaluate correctness without an execution oracle. \nThis limitation creates a stark Generation-Selection Gap, where high potential accuracy (Pass@K) fails to translate into execution accuracy (Pass@1).\nAlthough supervised verifiers offer mitigation, they incur prohibitive annotation costs and suffer from domain fragility. \nConsequently, recent research has pivoted to the training-free setting. \nHowever, existing methods---such as Self-Consistency or LLM-as-a-Judge---remain hampered by systematic bias (consensus on hallucinations) and symbolic blindness (inability to simulate execution states). \nWe introduce DPC (Dual-Paradigm Consistency), a multi-agent framework that reformulates SQL selection from a probabilistic guessing task on hidden data into a deterministic verification task on visible data. \nSpecifically, DPC employs a Slicer and a Tester agent to collaboratively construct a Minimal Distinguishing Database (MDD)---an adversarial, fully observable micro-environment engineered to expose logical discrepancies between candidates. \nTo break the self-correction bias, a Solver agent then verifies the SQL candidates by cross-referencing their execution against a parallel Python/Pandas solution. \nBy validating execution consistency between declarative (SQL) and imperative (Python) paradigms, DPC robustly discriminates correct logic from systematic hallucinations. \nExperiments on BIRD and Spider across multiple LLMs demonstrate that our method consistently outperforms existing selection baselines, achieving absolute accuracy improvements of up to 2.2\\% over strong competitors like Self-Consistency.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Database", "Text-to-SQL", "LLM Agent"], "openreview_url": "https://openreview.net/forum?id=jSFegTEP4V", "contribution_types": []}, {"id": "2oHtuNibqZ", "title": "Do LLM Semantic Judgments Follow Distributional Geometry? Prompt and Model Effects in Controlled Category Probes", "abstract": "Embeddings and next-token probabilities are often treated as interchangeable proxies for semantic knowledge in large language models (LLMs), but they need not reflect the same underlying structure. We present a controlled test of when representational geometry aligns with semantic behavior. We construct a counterbalanced matched-alternative dataset in which each probe is evaluated against a related and unrelated candidate under identical formatting, enabling within-item comparisons across relation type (cohyponym vs. superordinate), distractor difficulty (easy vs. hard, defined by semantic confusability), prompting regimes, and model. We evaluate five LLMs using two scoring lenses: logprob preference and static embedding similarity. Across models, logprob discrimination is uniformly high with modest difficulty penalties. By contrast, embedding similarity systematically underestimates superordinate relations, with the gap largest under hard distractors, while cohyponym judgments remain near ceiling. Metaprompt scaffolding produces larger shifts than prompt wording. Overall, behavior–geometry alignment is relation- and difficulty-dependent, cautioning against treating embedding similarity as a model-agnostic measure of semantic knowledge.", "area": "Semantics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["lexical relationships", "word embeddings", "semantic textual similarity", "natural language inference", "textual entailment"], "openreview_url": "https://openreview.net/forum?id=2oHtuNibqZ", "contribution_types": ["Analysis", "Data Analysis", "Theory"]}, {"id": "GFsN7elCGC", "title": "Self-Manager: Parallel Agent Loop for Long-form Deep Research", "abstract": "Long-form deep research requires multi-faceted investigations over extended horizons to get a comprehensive report. When handling such complex tasks, existing agents manage context at the subtask level to overcome linear context accumulation and information loss. However, they still adhere to a single context window and sequential execution paradigm, which results in mutual interference and blocking behavior, restricting scalability and adaptability. To address this issue, this paper introduces Self-Manager, a parallel agent loop that enables asynchronous and concurrent execution. The main thread can create multiple subthreads, each with its own isolated context, and manage them iteratively through Thread Control Blocks, allowing for more focused and flexible parallel agent execution. To assess its effectiveness, we benchmark Self-Manager on DeepResearch Bench, where it consistently outperforms existing single-agent loop baselines across all metrics. Furthermore, we conduct extensive analytical experiments to demonstrate the necessity of Self-Manager’s design choices, as well as its advantages in contextual capacity, efficiency, and generalization.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Deep Research", "Agent", "Information Retrieval"], "openreview_url": "https://openreview.net/forum?id=GFsN7elCGC", "contribution_types": []}, {"id": "BMUlYGOJuX", "title": "Precise Debugging Benchmark: Is Your Model Debugging or Regenerating?", "abstract": "Unlike code completion, debugging requires localizing faults and applying targeted edits. \nWe observe that frontier LLMs often regenerate correct but over-edited solutions during debugging.\nTo evaluate how far LLMs are from precise debugging, we introduce the Precise Debugging Benchmarking (PDB) framework, an automatic pipeline that converts any coding dataset into a debugging benchmark with precision-aware evaluation. \nPDB generates buggy programs by synthesizing verified atomic bugs and composing them into multi-bug programs. \nWe further define two novel metrics, edit-level precision and bug-level recall, which provide fine-grained measurements of how many necessary edits are made and how many bugs are resolved.\nWe release PDB-Hard, a 5,734-example evaluation set for measuring debugging precision and recall.\nExperiments show that frontier models, such as GPT-5.1-Codex and DeepSeek-V3.2-Thinking, achieve unit-test pass rates above $78\\%$ but exhibit precision below $45\\%$, even when explicitly instructed to perform minimal debugging. \nFinally, we show that iterative and agentic debugging strategies do not substantially improve precision or recall, highlighting the need to rethink post-training pipelines for coding models.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Debugging", "Coding", "LLM", "Precision", "Evaluation"], "openreview_url": "https://openreview.net/forum?id=BMUlYGOJuX", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "TZWC06Zh17", "title": "SwipeGen: Bridging the Execution Gap in GUI Agents via Human-like Swipe Synthesis", "abstract": "With the widespread adoption of Graphical User Interface (GUI) agents for automating GUI interaction tasks, substantial research focused on improving GUI perception to ground task instructions into concrete action steps.\nHowever, the step execution capability of these agents has gradually emerged as a new bottleneck for task completion.\nIn particular, existing GUI agents often adopt overly simplified strategies for handling \\textit{swipe} interactions, preventing them from accurately replicating human-like behavior.\nTo address this limitation, we decompose human swipe gestures into multiple quantifiable dimensions and propose an automated pipeline \\texttt{SwipeGen} to synthesize human-like swipe interactions through GUI exploration.\nBased on this pipeline, we construct and release the first benchmark for evaluating the swipe execution capability of GUI agents. Furthermore, leveraging the synthesized data, we propose \\texttt{GUISwiper}, a GUI agent with enhanced interaction execution capabilities.\nExperimental results demonstrate that \\texttt{GUISwiper} achieves a swipe execution accuracy of 69.07\\%, representing a 214\\% improvement over existing VLM baselines.\nOur code, dataset, and model are available at \\url{https://anonymous.4open.science/r/UI-anoy-91BC/}.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/UI-anoy-91BC"], "keywords": ["GUI Agents", "Data Generation", "Vision-Language Models", "Human-like Gestures", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=TZWC06Zh17", "contribution_types": ["Dataset"]}, {"id": "3dNXHQ0lcM", "title": "Quantifying Cultural Evolution: A Computational Analysis of Intellectual History in Chinese and Latin Traditions", "abstract": "Understanding how intellectual traditions evolve across cultures remains a fundamental challenge in cultural analytics. We present a computational framework for quantifying cultural evolution by extracting idea graphs from classical texts using LLMs, detecting thought communities via graph algorithms, and discovering cross-temporal idea lineages through semantic similarity. Applying this framework to 243 Chinese and 636 Latin texts spanning over 2,500 years, we construct graphs containing approximately 360,000 entities and 390,000 relations. Our analysis reveals fundamentally different evolutionary dynamics: Chinese tradition exhibits asynchronous Politics-Religion dominance with cumulative inheritance, while Latin tradition shows synchronized dynamics with substitutional inheritance. We identify two critical transition periods where diversity trajectories diverge in opposite directions, and through structural analysis of thought communities and lineages, reveal why these patterns emerge and how they shaped divergent modern trajectories. Our quantitative findings align with historiographical narratives about Chinese continuity versus European transformation, providing measurable evidence for cultural analytics and cross-civilizational comparison.", "area": "Social NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Cultural Analytics", "Intellectual History", "Cultural Evolution", "Cross-Cultural Comparison", "Knowledge Graphs", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=3dNXHQ0lcM", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "6Lk7LXw2Qf", "title": "CIB-MoE: Counterfactual Inconsistency-Bottleneck Mixture-of-Experts for Robust Multimodal Aspect-based Sentiment Analysis and Sarcasm Detection", "abstract": "Multimodal posts on social media pose a fine-grained affective understanding challenge: the decisive signal often lies in instance-specific discrepancies between text and image, yet models are easily misled by weak cross-modal relevance, heterogeneous mismatch types (semantic, entity-level, and affective), and spurious lexical shortcuts. These issues are central to multimodal aspect-based sentiment analysis (MABSA), which demands aspect-conditioned predictions under noisy visual context, and multimodal sarcasm detection (MMSD), where sarcasm is frequently expressed through cross-modal incongruity rather than surface polarity.\nWe propose **CIB-MoE** (**C**ounterfactual **I**nconsistency-**B**ottleneck **M**ixture-**o**f-**E**xperts), a unified framework that performs discrepancy-aware conditional computation instead of monolithic fusion. CIB-MoE builds lightweight difference experts that quantify complementary mismatch cues—e.g., CLIP-based semantic inconsistency and entity-level misalignment derived from Top-$N$ predicted object labels—and routes them through a two-level gate with an information-bottleneck regularizer for sparse and stable expert usage. To further suppress shortcut-driven routing, we calibrate the gate with realizable counterfactual interventions by substituting the image with neutral (text-aligned) and random (noise) alternatives and imposing ranking/consistency constraints on routing and predictions.\nExperiments on Twitter-2015/2017 and MMSD/MMSD2.0 show that CIB-MoE achieves state-of-the-art performance while improving robustness under distribution shift and counterfactual evaluation.", "area": "Sentiment/Argument", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal learning", "Multimodal aspect-based sentiment analysis", "Multimodal sarcasm detection", "Cross-modal incongruity", "Mixture-of-experts", "Information bottleneck"], "openreview_url": "https://openreview.net/forum?id=6Lk7LXw2Qf", "contribution_types": []}, {"id": "CiOWTg27qk", "title": "An Evaluation Framework for Emotional Companionship Capability of Dialogue Systems", "abstract": "With the rapid development of Large Language Models, dialogue systems are shifting from information tools to emotional companions, heralding the era of Emotional Companionship Dialogue Systems (ECDs) that provide personalized emotional support for users. However, the field lacks systematic evaluation standards. To address this, we pioneered the design and implementation of the Four-Dimensional Capability Evaluation Framework (FDAEF), which hierarchically integrates ``Capability Layer → Task Layer (three-level) → Data Layer → Method Layer''. Then, we present  ECDBench 1.0 , the inaugural ECD-specific benchmark developed under FDAEF. Through extensive evaluations of 30 mainstream models, we demonstrate that ECDBench 1.0 has excellent discriminant validity and can effectively quantify the differences in emotional companionship capabilities among models. Furthermore, the results reveal current models' shortcomings in deep emotional companionship, guiding future technological optimization and significantly aiding developers in enhancing ECDs’ user experience.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["PQAEF", "ECDBench1.0", "Emotional Companionship Dialogue Systems", "Evaluation Benchmark"], "openreview_url": "https://openreview.net/forum?id=CiOWTg27qk", "contribution_types": ["Reproduction", "Dataset", "Data Analysis", "Position"]}, {"id": "Cz4m4p3qU4", "title": "Budget-Aware Routing for Long Clinical Text", "abstract": "A growing consideration for large language models is the token cost per query and the cost of deployment.\nIn clinical settings, the input is long, heterogeneous, and redundant, while the downstream task is often short and high stakes.\nThis paper studies a concrete primitive for long context use: select a subset of document units under a strict token budget so that an off-the-shelf generator can operate within fixed cost and latency.\nWe formulate budgeted context selection as a knapsack-constrained subset selection problem with two design axes: \\emph{unitization} (how to segment documents) and \\emph{selection} (which units to keep).\nFor selection, we present RCD, a monotone submodular objective coupling relevance, coverage, and diversity.\nFor unitization, we evaluate sentence-level, section-based, window-based, and cluster-based strategies.\nWe introduce a routing heuristic that chooses among methods based on budget regime.\nAcross MIMIC discharge notes, Cochrane abstracts, and L-Eval, we find that optimal strategy depends on evaluation paradigm: for extractive evaluation, positional heuristics dominate at low budgets; for LLM-based generation, diversity-aware selection (MMR) provides consistent gains.\nUnitization matters less than selector choice--cluster-based grouping hurts performance, while other strategies perform similarly.\nWe observe that ROUGE saturates for LLM-generated summaries and that BERTScore better captures quality differences between methods.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Long-document processing", "Text summarization", "Budget-constrained inference", "Context selection / context construction", "Clinical NLP", "Evaluation of large language models"], "openreview_url": "https://openreview.net/forum?id=Cz4m4p3qU4", "contribution_types": ["Low-resource", "Efficiency", "Dataset"]}, {"id": "gtcOku1v2s", "title": "Optimal Document Selection in RAG via Combinatorial Optimization: A Theoretical Framework", "abstract": "Retrieval-Augmented Generation (RAG) augments Large Language Models with external knowledge by retrieving relevant documents, yet its performance is often bottlenecked by *context construction*: selecting a small set of retrieved documents under a fixed token budget. Standard top-$k$ selection is fast but frequently wastes budget on redundant evidence and fails to cover complementary facts needed for multi-hop reasoning. We cast RAG document selection as *monotone submodular maximization* under a knapsack (token-budget) constraint, motivated by the diminishing-returns nature of information coverage. Concretely, we instantiate the objective as a weighted coverage function over query-relevant *concepts*, which is provably monotone and submodular. We then apply a standard approximation algorithm for knapsack-constrained monotone submodular maximization, obtaining a $(1-1/e)$ approximation guarantee *for this surrogate objective*. Experiments on Natural Questions, ELI5, and HotpotQA show that our framework, **Submodular-RAG (S-RAG)**, improves answer quality over Top-$k$ and MMR across EM, BERTScore/ROUGE, and LLM-as-a-judge evaluations, with particularly strong gains on multi-hop questions.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Retrieval-Augmented Generation", "Submodular Optimization", "Information Coverage", "Multi-hop Reasoning", "LLM Efficiency"], "openreview_url": "https://openreview.net/forum?id=gtcOku1v2s", "contribution_types": ["Analysis", "Engineering", "Theory"]}, {"id": "n6I7TZ6rHh", "title": "BanglaLorica: Design and Evaluation of a Robust Watermarking Algorithm for Large Language Models in Bangla Text Generation", "abstract": "As large language models (LLMs) are increasingly deployed for text generation, watermarking has become essential for authorship attribution, intellectual property protection, and misuse detection. While existing watermarking methods perform well in high-resource languages, their robustness in low-resource languages remains underexplored. This work presents the first systematic evaluation of state-of-the-art text watermarking methods: KGW, Exponential Sampling (EXP), and Waterfall, for Bangla LLM text generation under cross-lingual round-trip translation (RTT) attacks. Under benign conditions, KGW and EXP achieve high detection accuracy ($>$$88$%) with negligible perplexity and ROUGE degradation. However, RTT causes detection accuracy to collapse below RTT causes detection accuracy to collapse to $9\\text{–}13$%, indicating a fundamental failure of token-level watermarking. To address this, we propose a layered watermarking strategy that combines embedding-time and post-generation watermarks. Experimental results show that layered watermarking improves post-RTT detection accuracy by $25\\text{–}35$%, achieving $40\\text{–}50$% accuracy, representing a 3$\\times$ to 4$\\times$ relative improvement over single-layer methods, at the cost of controlled semantic degradation. Our findings quantify the robustness-quality trade-off in multilingual watermarking and establish layered watermarking as a practical, training-free solution for low-resource languages such as Bangla. Our code and data will be made public.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Authorship Attribution", "Bangla Text Generation", "Cross-Lingual Round-Trip Translation (RTT)", "Exponential Sampling (EXP)", "Intellectual Property Protection", "KGW Watermarking"], "openreview_url": "https://openreview.net/forum?id=n6I7TZ6rHh", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Data Analysis"]}, {"id": "0aPHOviTLX", "title": "Confident Rankings with Fewer Items: Adaptive LLM Evaluation with Continuous Scores", "abstract": "Computerized Adaptive Testing (CAT) has proven effective for efficient LLM \nevaluation on multiple-choice benchmarks, but modern LLM evaluation\nincreasingly relies on generation tasks where outputs are scored continuously\nrather than marked correct/incorrect. We present a principled extension of\nIRT-based adaptive testing to continuous bounded scores (ROUGE, BLEU,\nLLM-as-a-Judge) by replacing the Bernoulli response distribution with a\nheteroskedastic normal distribution. Building on this, we introduce an uncertainty \naware ranker with adaptive stopping criteria that achieves reliable model ranking\nwhile testing as few items and as cheaply as possible. We validate our method \non five benchmarks spanning n-gram-based, embedding-based, and \nLLM-as-judge metrics. Our method uses 2% of the items while improving \nranking correlation by 0.12 $\\tau$ over random sampling, with 95% accuracy on \nconfident predictions.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["adaptive testing", "efficient evaluation", "benchmarking", "item response theory", "model ranking", "continuous metrics"], "openreview_url": "https://openreview.net/forum?id=0aPHOviTLX", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "lVeVjr82G0", "title": "Not all ANIMALs are equal: metaphorical framing through source domains and semantic frames", "abstract": "Metaphors are powerful framing devices, yet their source domains alone do not fully explain the specific associations they evoke. We argue that the interplay between source domains and semantic frames determines how metaphors shape understanding of complex issues, and present a computational framework that allows to derive salient discourse metaphors through their source domains and semantic frames. Applying this framework to climate change news, we uncover not only well-known source domains but also reveal nuanced frame-level associations that distinguish how the issue is portrayed. In analyzing immigration discourse across political ideologies, we demonstrate that liberals and conservatives systematically employ different semantic frames within the same source domains, with conservatives favoring frames emphasizing uncontrollability and liberals choosing neutral or more ''victimizing\" semantic frames. Our work bridges conceptual metaphor theory and linguistics, providing the first NLP approach for discovery of discourse metaphors and fine-grained analysis of differences in metaphorical framing.", "area": "Social NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ConceptFrameMet-50F8"], "keywords": ["metaphors", "framing", "semantic frames", "source domains"], "openreview_url": "https://openreview.net/forum?id=lVeVjr82G0", "contribution_types": ["Data Analysis", "Theory"]}, {"id": "aZ8oKfihjg", "title": "CBTDialog: A CBT-Oriented Multi-Turn Counseling Dialogue Dataset for Mental Health Support", "abstract": "Amid persistent shortages in mental health services, large language models (LLMs) have emerged as promising tools for counseling support. However, training reliable counselor models requires high-quality data with explicit therapeutic frameworks, whereas existing LLM-synthesized datasets often lack authenticity and professional intervention annotations, limiting controllable, framework-aligned generation. To address these challenges, we construct CBTDialog, a multi-turn counseling dialogue dataset focused on Cognitive Behavioral Therapy (CBT), consisting of real-world and simulated-client sessions with over 81k counselor–client utterances. Grounded in CBT authoritative assessment tool and textbook, we provide a hierarchical intervention annotation schema comprising goal-level CBT skills and implementation-level dialogue strategies. Moreover, we propose CBT-Qwen3, a counselor model trained on CBTDialog that leverages reinforcement learning to explicitly guide and constrain the generation process under CBT intervention. Experiments demonstrate the effectiveness of our proposed model.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Counseling Dialogue Dataset", "Controlled Text Generation", "Cognitive Behavioral Therapy"], "openreview_url": "https://openreview.net/forum?id=aZ8oKfihjg", "contribution_types": ["Engineering", "Dataset"]}, {"id": "rrOlpXhLqr", "title": "V-FAT: Benchmarking Visual Fidelity Against Text-bias", "abstract": "Recent advancements in Multimodal Large Language Models (MLLMs) have demonstrated impressive performance on standard visual reasoning benchmarks. However, there is growing concern that these models rely excessively on linguistic shortcuts rather than genuine visual grounding, a phenomenon we term \\textbf{Text Bias}.\nIn this paper, we investigate the fundamental tension between visual perception and linguistic priors. We decouple the sources of this bias into two dimensions: \\textbf{Internal Corpus Bias}, stemming from statistical correlations in pre-training, and \\textbf{External Instruction Bias}, arising from the alignment-induced tendency toward sycophancy.\nTo quantify this effect, we introduce V-FAT (Visual Fidelity Against Text-bias), a diagnostic benchmark comprising 4,026 VQA instances across six semantic domains. V-FAT employs a Three-Level Evaluation Framework that systematically increases the conflict between visual evidence and textual information: (L1) internal bias from atypical images, (L2) external bias from misleading instructions, and (L3) synergistic bias where both coincide. To quantify robustness, we introduce the \\textbf{Visual Robustness Score (VRS)}, a metric designed to penalize \"lucky\" linguistic guesses and reward true visual fidelity. Our evaluation of 12 frontier MLLMs reveals that while models excel in existing benchmarks, they experience significant visual collapse under high linguistic dominance.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Learning", "Hallucinations", "VQA"], "openreview_url": "https://openreview.net/forum?id=rrOlpXhLqr", "contribution_types": ["Analysis"]}, {"id": "VHTlLxWten", "title": "rSIM: Incentivizing Reasoning Capabilities of LLMs via Reinforced Strategy Injection", "abstract": "Large language models (LLMs) are post-trained through reinforcement learning (RL) to evolve into Reasoning Language Models (RLMs), where the hallmark of this advanced reasoning is ``aha'' moments when they start to perform strategies, such as self-reflection and deep thinking, within chain of thoughts (CoTs). Motivated by this, this paper proposes a novel reinforced strategy injection mechanism (rSIM), that enables any LLM to become an RLM by employing a small planner to guide the LLM's CoT through the adaptive injection of reasoning strategies. To achieve this, the planner (leader agent) is jointly trained with an LLM (follower agent) using multi-agent RL (MARL), based on a leader-follower framework and straightforward rule-based rewards. Experimental results show that rSIM enables Qwen2.5-0.5B to become an RLM and significantly outperform Qwen2.5-14B. Moreover, the planner is generalizable: it only needs to be trained once and can be applied as a plug-in to substantially improve the reasoning capabilities of existing LLMs. In addition, the planner supports continual learning across various tasks, allowing its planning abilities to gradually improve and generalize to a wider range of problems.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reasoning Language Models", "Reinforcement Learning", "Multi-agent System"], "openreview_url": "https://openreview.net/forum?id=VHTlLxWten", "contribution_types": ["Analysis", "Engineering"]}, {"id": "6S9qRgOeMd", "title": "RES-RAG: Reinforced Evidence Set Retrieval for Retrieval-Augmented Generation", "abstract": "Retrieval-augmented generation (RAG) is widely used to incorporate external knowledge into large language models (LLMs), effectively improving answer quality in question-answering (QA) tasks. Since external knowledge may far exceed the context window of LLMs, retrieving the key evidence they need within a limited context is challenging. Existing heuristic retrieval methods often add more evidence in context to improve answer quality, but some non-essential evidence may contribute little, potentially leading to over-retrieval and increased noise. To overcome these challenges, we propose RES-RAG, which, for the first time, models evidence retrieval as an action decision problem under context constraints. Compared to existing methods such as top-$k$ and truncation, RES-RAG can adaptively retrieve evidence that contributes to answer quality. Specifically, we construct a lightweight retrieval strategy model. We use reinforcement learning (RL) to optimize the retrieval process, making evidence retrieval quality-oriented. Furthermore, we design a joint quality-cost function for the optimization signal in RL. We use the F1 score as a positive reward and penalize over-retrieval. This achieves a balance between answer quality and retrieval cost. Experiments across multiple open-domain QA benchmarks demonstrate that RES-RAG achieves higher answer quality at lower evidence cost, reflecting a superior quality-cost trade-off.", "area": "RAG", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/RES-RAG-0106"], "keywords": ["Question-answering", "Retrieval-augmented Aeneration", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=6S9qRgOeMd", "contribution_types": []}, {"id": "35NByXvpPu", "title": "LLM-Codec: Neural Audio Codec Meets Language Model Objectives", "abstract": "Neural audio codecs are widely used as tokenizers for spoken language models, but they are optimized for waveform reconstruction rather than autoregressive prediction.\nThis mismatch injects acoustically driven uncertainty into the discrete token space and increases language-model perplexity.\nWe propose LLM-Codec, which trains the codec encoder with language-model-facing objectives while keeping both codec and LLM architectures unchanged.\nLLM-Codec introduces (i) future token prediction with Medusa-style multi-step heads to encourage multi-step predictability, and (ii) semantic alignment that matches audio and text representations via a memory-bank contrastive loss.\nA differentiable Gumbel bridge enables end-to-end gradients from these objectives to the codec encoder.\nOn SALMon speech coherence, token LMs trained on LLM-Codec reach 62.3\\% accuracy (+13.0 points over AUV) while reducing perplexity 34$\\times$.\nOn Codec-SUPERB-tiny, LLM-Codec improves speech Mel distance by 10.4\\%.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["spoken language model", "neural audio codec", "speech tokenization", "multi-step prediction", "semantic alignment", "speech generation"], "openreview_url": "https://openreview.net/forum?id=35NByXvpPu", "contribution_types": ["Engineering"]}, {"id": "t7xqvuNSEH", "title": "UrduBench: A Unified Benchmark for Evaluating Large Language Models on Native Urdu Tasks", "abstract": "Large Language Models (LLMs) have driven rapid advances in natural language processing (NLP); however, low-resource languages such as Urdu, spoken by over 230 million people, remain severely underrepresented, limiting equitable deployment and widening multilingual performance gaps. Existing Urdu benchmarks are fragmented or translation dependent, lacking a unified framework for evaluating emerging efficient models on native, culturally grounded tasks.\nWe present $UrduBench$, a comprehensive benchmark comprising 20 datasets across 17 tasks for Urdu LLM evaluation, covering natural language understanding, safety-critical moderation, and generation. We also release a modular, open-source evaluation framework enabling reproducible zero-shot evaluation with uniform prompting and metrics.\nUsing this framework, we benchmark 13 open-weight instruction-tuned LLMs spanning nano (<1B), small (1–3B), and medium (up to 7B) parameter scales focusing on models that are computationally efficient and suitable for deployment in low-resource settings. Results show pronounced performance disparities across model sizes and task categories, with persistent difficulties in Urdu sequence labeling and generation, and consistent gains from larger multilingual models.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Urdu NLP; Low-Resource Languages; LLM Benchmarking; Safety and Moderation; Efficient Language Models; Zero-Shot Evaluation"], "openreview_url": "https://openreview.net/forum?id=t7xqvuNSEH", "contribution_types": ["Low-resource", "Efficiency"]}, {"id": "m40eaXH7d1", "title": "Explicating Tacit Regulatory Knowledge from LLMs to Auto-Formalize Requirements for Compliance Test Case Generation", "abstract": "Compliance testing in highly regulated domains is crucial but largely manual, requiring domain experts to translate complex regulations into executable test cases. While large language models (LLMs) show promise for automation, their susceptibility to hallucinations limits reliable application. Existing hybrid approaches mitigate this issue by constraining LLMs with formal models, but still rely on costly manual modeling. To solve this problem, this paper proposes RAFT, a framework for Requirements Auto-Formalization and compliance Test generation via explicating tacit regulatory knowledge from multiple LLMs. RAFT employs an Adaptive Purification-Aggregation strategy to explicate tacit regulatory knowledge from multiple LLMs and integrate it into three artifacts: a domain meta-model, a formal requirements representation, and testability constraints. These artifacts are then dynamically injected into prompts to guide high-precision requirement formalization and automated test generation. Experiments across financial, automotive, and power domains show that RAFT achieves expert-level performance, substantially outperforms state-of-the-art (SOTA) methods while reducing overall generation and review time.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Requirement Formalization", "Compliance Testing", "Test Case Generation", "Domain Modeling", "Knowledge Elicitation"], "openreview_url": "https://openreview.net/forum?id=m40eaXH7d1", "contribution_types": ["Engineering"]}, {"id": "fTSx5vF4Ih", "title": "PuzzleClone: A DSL-Powered Framework for Synthesizing Verifiable Data", "abstract": "High-quality mathematical and logical datasets with verifiable answers are essential for strengthening the reasoning capabilities of large language models (LLMs). While recent data augmentation techniques have facilitated the creation of large-scale benchmarks, existing LLM-generated datasets often suffer from limited reliability, diversity, and scalability. To address these challenges, we introduce PuzzleClone, a formal framework for synthesizing verifiable data at scale using a novel DSL-driven approach.\nOur approach features three key innovations: (1) encoding seed puzzles into structured logical specifications, (2) generating scalable variants through systematic variable and constraint randomization, and (3) ensuring validity via a reproduction mechanism. Applying PuzzleClone, we construct PC-83K, a benchmark comprising over 83K diverse and programmatically validated puzzles. The generated puzzles span a wide spectrum of difficulty and formats, posing significant challenges to current state-of-the-art models. Experimental results show that post training (SFT and RL) on PC-83K  yields substantial improvements not only on the testset but also on various logic and mathematical benchmarks. Post training raises average performance on PC-83K from 14.5 to 66.0 and delivers consistent improvements across 7 logic and mathematical benchmarks up to 18.4 absolute percentage points (SATBench from 51.6 to 70.0). \nOur code and data are available at https://github.com/puzzleclone.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["data synthesis", "mathematical puzzle", "natural language processing"], "openreview_url": "https://openreview.net/forum?id=fTSx5vF4Ih", "contribution_types": ["Engineering", "Dataset"]}, {"id": "i9ZKAcIrWq", "title": "ChakmaNMT: Machine Translation for a Low-Resource and Endangered Language via Transliteration", "abstract": "We present the first systematic study of machine translation for Chakma, an endangered and extremely low-resource Indo-Aryan language, with the goal of supporting language access and preservation.\nWe introduce a new Chakma--Bangla parallel and monolingual dataset, along with a trilingual Chakma--Bangla--English benchmark for evaluation.\nTo address script mismatch and data scarcity, we propose a character-level transliteration framework that exploits the close orthographic and phonological relationship between Chakma and Bangla, preserving semantic content while enabling effective transfer from Bangla and multilingual pretrained models.\nWe benchmark from-scratch MT, fine-tuned pretrained models, and large language models via in-context learning.\nResults show that transliteration is essential and that fine-tuning and in-context learning substantially outperform from-scratch baselines, with strong asymmetry across translation directions.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["machine translation", "low-resource NLP", "transliteration", "multilingual models", "benchmarking", "evaluation"], "openreview_url": "https://openreview.net/forum?id=i9ZKAcIrWq", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Dataset"]}, {"id": "sFH5VLFmaZ", "title": "Practical AI-Grading with Formal Verification: A Case Study of Russell-Bernays Axiom System", "abstract": "Large Language Models (LLMs) have achieved remarkable feats in complex reasoning, often rivaling human performance on Olympiad-level problems. Yet, a critical disparity exists between their generative prowess and verification reliability. \nOur study shows that even within a simple logical system like the Russell–Bernays axiom system, state‑of‑the‑art LLMs still frequently misjudge the validity of proofs. This shows that probabilistic models are not good as reliable checkers, because they often accept arguments that sound right but are logically wrong, and sometimes reject correct steps for no good reason.\nTo bridge this gap, we explore a neuro-symbolic grading framework that decouples semantic interpretation from logical validation. Instead of relying on the model's internal judgment, our pipeline converts informal proofs into a Domain-Specific Language and leverages the Lean 4 kernel as a deterministic verifier, which provides formal feedback to help produce valid assessments. Ultimately, our work demonstrates that trustworthy verification cannot rely on probabilistic reasoning alone, but demands the feedback of symbolic kernels, which can be explored in more domains where trustworthiness must be guaranteed.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Formal Verification", "LLM Grading"], "openreview_url": "https://openreview.net/forum?id=sFH5VLFmaZ", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "4nSIb6NU1l", "title": "Granuscore: A Reference-Free Measure of Granularity for Text Analysis and Question Answering", "abstract": "Natural language conveys information at varying levels of abstraction, from fine-grained references to broad descriptions. While granularity is fundamental to human communication, existing measures mostly capture surface detail or sentence specificity rather than abstraction within semantic hierarchies. \n\nWe introduce Granuscore, a reference-free measure of granularity that leverages structural properties of a hierarchical embedding space. We validate Granuscore both empirically and conceptually. Granuscore reliably recovers granularity orderings on the Granola-EQ dataset and aligns with expected differences in abstraction across sections of scientific papers. Across multiple domains, we further show that granularity captures systematic, non-linear variation in sentence specificity beyond sentence length. Finally, we apply Granuscore to several question answering datasets and demonstrate that it provides a useful lens for characterizing dataset difficulty and understanding systematic differences in model performance and outputs. Together, these results position Granuscore as a scalable and broadly applicable tool for analyzing granularity in text.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Semantic Granularity", "Sentence Specificity", "Hierarchical Representations", "Reference-Free Evaluation", "Question Answering", "Evaluation Metrics"], "openreview_url": "https://openreview.net/forum?id=4nSIb6NU1l", "contribution_types": ["Analysis", "Engineering", "Data Analysis", "Theory"]}, {"id": "r5w43KdUVn", "title": "Metaphor Reasoning is Meta-reasoning", "abstract": "Metaphor reasoning is an essential cognitive ability that maps knowledge from familiar domains to more abstract domains. This ability functions as a meta-ability underlying many types of reasoning. However, existing work rarely investigates how metaphor reasoning affects other reasoning abilities. \nTo bridge this gap, we systematically study how metaphor reasoning, particularly through metaphorical riddles, can enhance broader reasoning abilities in large language models. \nWe propose MetaR, an automated system for synthesizing metaphorical riddles that satisfy five quality dimensions: diverse, balanced, reasoning-oriented, challenging, and verifiable. Leveraging that answer categories determine riddle categories, we employ a hierarchical answer taxonomy for the former three criteria and a multi-agent refinement framework for the latter two, generating a high-quality dataset. Training with reinforcement learning on verifiable rewards using only thousands of metaphorical riddles, we demonstrate improvements across six out-of-distribution reasoning domains. Analysis reveals transfer effectiveness depends on model scale and pattern-target domain alignment. We will release our code and data.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["metaphor reasoning", "large language model", "natural language processing"], "openreview_url": "https://openreview.net/forum?id=r5w43KdUVn", "contribution_types": ["Engineering", "Reproduction", "Dataset"]}, {"id": "WvSdMPow5K", "title": "Benchmarking Kyrgyz Language Understanding", "abstract": "Evaluating large language models (LLMs) across languages remains challenging, as most multilingual benchmarks rely on translated English datasets, often obscuring linguistic and cultural specificity in the target language.\nThis issue is particularly pronounced for less-resourced languages such as Kyrgyz, where reliable natively authored evaluation data are scarce.\nBuilding on previously introduced Kyrgyz-language evaluation datasets, this work reports the first systematic and large-scale evaluation of LLMs in Kyrgyz using the KyrgyzLLM-Bench benchmark suite.\nKyrgyzLLM-Bench comprises two natively authored datasets—KyrgyzMMLU  and KyrgyzRC—together with carefully translated and manually post-edited versions of WinoGrande, HellaSwag, BoolQ, and TruthfulQA.\nWe evaluate 26 open- and closed-source LLMs under zero-shot and few-shot settings, analyzing model performance, cross-lingual transfer, and the impact of translation artifacts on evaluation reliability.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["less-resourced languages", "large language models", "benchmarks", "Kyrgyz language", "evaluation"], "openreview_url": "https://openreview.net/forum?id=WvSdMPow5K", "contribution_types": ["Dataset"]}, {"id": "zgyQPq6gCl", "title": "RLAR: An Agentic Reward System for Multi-task Reinforcement Learning on Large Language Models", "abstract": "Large language model alignment via reinforcement learning depends critically on reward function quality. \nHowever, static, domain-specific reward models are often costly to train and exhibit poor generalization in out-of-distribution scenarios encountered during RL iterations.\nWe present RLAR (**R**einforcement **L**earning from **A**gent **R**ewards), an agent‑driven framework that dynamically assigns tailored reward functions to individual queries.\nSpecifically, RLAR transforms reward acquisition into a dynamic tool synthesis and invocation task.\nIt leverages LLM agents to autonomously retrieve optimal reward models from the Internet and synthesize programmatic verifiers through code generation.\nThis allows the reward system to self-evolve with the shifting data distributions during training.\nExperimental results demonstrate that RLAR yields consistent performance gains ranging from $10%$ to $60%$ across mathematics, coding, translation, and dialogue tasks.\nOn RewardBench-V2, RLAR significantly outperforms static baselines and approaches the performance upper bound, demonstrating superior generalization through dynamic reward orchestration.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ACL2026-RLAR"], "keywords": ["reinforcement learning", "large language model", "reward modeling", "llm agent"], "openreview_url": "https://openreview.net/forum?id=zgyQPq6gCl", "contribution_types": ["Engineering"]}, {"id": "m4mhft8nAa", "title": "PUPPET: Neural-Symbolic Standardized Patients for Mental Health", "abstract": "The critical therapist shortage demands scalable training solutions. While Standardized Patients are the gold standard for such training, they remain scarce and costly. Current LLM-based approaches focus primarily on patient simulation to achieve conversational realism but fail to function as Virtual Standardized Patients regarding pedagogical rigor. Consequently, they lack faithful reactions to clinical errors and cannot provide explainable feedback. To bridge this gap, we propose PUPPET, the first neuro-symbolic Virtual Standardized Patient governed by an Observe-Think-Behave architecture. This approach enforces trainer-defined clinical logic to ensure deterministic state transitions while maintaining natural variability. Additionally, our PUPPET-TRAINER reveals the complete causal chain from intervention to response to facilitate transparent learning. Experiments across three distinct clinical scenarios confirm that our method consistently outperforms other baselines in both clinical faithfulness and pedagogical value.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Mental Health Training", "Patient Simulation", "Neuro-Symbolic AI", "Virtual Standardized Patients"], "openreview_url": "https://openreview.net/forum?id=m4mhft8nAa", "contribution_types": ["Engineering"]}, {"id": "s3sfI0PWfP", "title": "LLMRouterBench: A Massive Benchmark and Unified Framework for LLM Routing", "abstract": "Large language model (LLM) routing assigns each query to the most suitable model from an ensemble. We introduce LLMRouterBench, a large-scale benchmark and unified framework for LLM routing. It comprises over 400K instances from 21 datasets and 33 models. Moreover, it  provides comprehensive metrics for both performance-oriented and performance–cost trade-off routing, and integrates 10 representative routing baselines. Using LLMRouterBench, we systematically re-evaluate the field. While confirming strong model complementarity—the central premise of LLM routing—we find that many routing methods exhibit similar performance under unified evaluation, and several recent approaches, including commercial routers, fail to reliably outperform a simple baseline. Meanwhile, a substantial gap remains to the Oracle, driven primarily by persistent model-recall failures. We further show that backbone embedding models have limited impact, that larger ensembles exhibit diminishing returns compared to careful model curation, and that the benchmark also enables latency-aware analysis. All code and data are available at https://anonymous.4open.science/r/LLMRouterBench-F524", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/LLMRouterBench-F524"], "keywords": ["Large Language Models", "LLM Routing", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=s3sfI0PWfP", "contribution_types": ["Reproduction", "Dataset"]}, {"id": "yaLfiGu3t0", "title": "From Understanding to Engagement: Personalized pharmacy Video Clips via Vision Language Models (VLMs)", "abstract": "Vision Language Models (VLMs) are poised to revolutionize the digital transformation of pharmacyceutical industry by enabling intelligent, scalable, and automated multi-modality content processing. Traditional manual annotation of heterogeneous data modalities (text, images, video, audio, and web links), is prone to inconsistencies, quality degradation, and inefficiencies in content utilization. The sheer volume of long video and audio data further exacerbates these challenges, (e.g. long clinical trial interviews and educational seminars). \n\nHere, we introduce a domain-adapted Video-to-Video Clip Generation framework that integrates Audio-Language Models (ALMs) and Vision Language Models (VLMs) to produce highlight clips. Our contributions are threefold: (i) a reproducible Cut \\& Merge algorithm with fade-in/out and timestamp normalization, ensuring smooth transitions and audio/visual alignment; (ii) a personalization mechanism based on role definition and prompt injection for tailored outputs (marketing, training, regulatory); (iii) a cost-efficient e2e pipeline strategy balancing ALM/VLM-enhanced processing. \nEvaluations on Video-MME benchmark (900) and our proprietary dataset of 16,159 pharmacy videos across 14 disease areas demonstrate 3–4× speedup, 4× cost reduction, and competitive clip quality. Beyond efficiency gains, we also report our methods improved clip coherence scores (0.348) and informativeness scores (0.721) over state-of-the-art VLM baselines (e.g., Gemini 2.5 Pro), highlighting the potential of transparent, custom extractive, and compliance-supporting video summarization for life sciences. \\href{https://video-clips-highlight-generator-338849523617.us-west1.run.app/}{Demo access}.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["NLP applications", "prompting", "Language Modeling", "VLMs", "multimodality", "NLP Applications"], "openreview_url": "https://openreview.net/forum?id=yaLfiGu3t0", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "6cQnHOEBk6", "title": "Scaling External Knowledge Input Beyond Context Windows of LLMs via Multi-Agent Collaboration", "abstract": "With the rapid advancement of post-training techniques for reasoning and information seeking, large language models (LLMs) can incorporate a large quantity of retrieved knowledge to solve complex tasks. However, the limited context window of LLMs obstructs scaling the amount of external knowledge input, prohibiting further improvement. Existing context window extension methods inevitably cause information loss. LLM-based multi-agent methods emerge as a new paradigm to handle massive input in a distributional manner, where we identify two core bottlenecks in existing agent orchestration designs. In this work, we develop a multi-agent framework, $\\textbf{ExtAgents}$, to overcome the bottlenecks and enable better scalability in inference-time knowledge integration without longer-context training. Benchmarked with our enhanced multi-hop question answering test, $\\boldsymbol\\infty\\textbf{Bench}\\boldsymbol+$, and other public test sets including long survey generation, ExtAgents significantly enhances the performance over existing non-training methods with the same amount of external knowledge input, regardless of whether it falls $\\textit{within or exceeds the context window}$. Moreover, the method maintains efficiency due to high parallelism. We believe further study in the coordination of LLM agents on increasing external knowledge input could benefit real-world applications.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Multi-Agent Systems", "Long-Context Language Model", "External Knowledge", "Scalable LLM Agents"], "openreview_url": "https://openreview.net/forum?id=6cQnHOEBk6", "contribution_types": ["Engineering", "Dataset"]}, {"id": "yCtDfCnAOV", "title": "From Human Cognition to Neural Activations: Probing the Computational Primitives of Spatial Reasoning in LLMs", "abstract": "As spatial intelligence becomes an increasingly important capability for foundation models, it remains unclear whether large language models’ (LLMs) performance on spatial reasoning benchmarks reflects structured internal spatial representations or reliance on linguistic heuristics. We address this question from a mechanistic perspective by examining how spatial information is internally represented and used. Drawing on computational theories of human spatial cognition, we decompose spatial reasoning into three primitives, relational composition, representational transformation, and stateful spatial updating, and design controlled task families for each. We evaluate multilingual LLMs in English, Chinese, and Arabic under single pass inference, and analyze internal representations using linear probing, sparse autoencoder based feature analysis, and causal interventions. We find that task relevant spatial information is encoded in intermediate layers and can causally influence behavior, but these representations are transient, fragmented across task families, and weakly integrated into final predictions. Cross linguistic analysis further reveals mechanistic degeneracy, where similar behavioral performance arises from distinct internal pathways. Overall, our results suggest that current LLMs exhibit limited and context dependent spatial representations rather than robust, general purpose spatial reasoning, highlighting the need for mechanistic evaluation beyond benchmark accuracy.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Spatial reasoning; Large Language Models; Mechanistic interpretability; Cognitive primitives; Multilingual evaluation;"], "openreview_url": "https://openreview.net/forum?id=yCtDfCnAOV", "contribution_types": ["Analysis", "Dataset"]}, {"id": "KGdKlAilJB", "title": "Model-x: A Family of Arabic-Centric Open Large Language Models", "abstract": "We present a family of Arabic-centric large language models representing the most capable and culturally aligned Arabic LLMs to date. The family includes the largest open Arabic-centric LLM trained from scratch at 70B parameters, and the best-in-class 8B-parameter LLM. A custom Arabic-centric vocabulary enables efficient training and inference. In addition, an optimized architecture and training recipe yield highly compute-efficient training. With a substantially smaller token budget than comparable models, our model achieves state-of-the-art Arabic performance and competitive English results. The models are best-performing on a key Arabic leaderboard: Open Arabic Leaderboard v2 (OALLv2) and AraGen v1. They are also leading in several benchmarks for domains deeply rooted in Arab life, such as poetry, religion, dream interpretation, as well as in general tasks such as translation and summarization. We release the models in HuggingFace under a commercially permissive license. By uniting scale, linguistic diversity, cultural fidelity, openness, and speed, our model establishes a transparent and inclusive foundation for the next generation of Arabic-centric high-performance LLMs. Both sizes of the model, as open-weights, are publicly available at HuggingFace: http://anonymous.for.review", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Arabic-centric large language models", "Low-resource and underrepresented languages", "Arabic dialects and diglossia", "Multilingual language modeling", "Transformer-based language models", "Cultural and linguistic alignment"], "openreview_url": "https://openreview.net/forum?id=KGdKlAilJB", "contribution_types": ["Low-resource", "Dataset"]}, {"id": "Ptb6ACeyWg", "title": "GLA: Grounding Large Language Models in Molecular Hierarchy for Chemical Understanding", "abstract": "Conventional Euclidean geometries lead to structural distortion and entangle core pharmacophoric identities with peripheral groups. Existing molecule-language models, relying on linear or uniform encodings, often obscure the hierarchical organization of chemical semantics. To address this, we propose Geometric-Language Alignment (GLA), a framework integrating intrinsic molecular topology into large language models. GLA employs a mixed-curvature encoder that maps scaffolds to hyperbolic space to capture hierarchy, while encoding side-chains in Euclidean space. These representations are aligned with text via a dual-view contrastive objective and injected into a frozen language model. Experiments on cross-modal retrieval, captioning, and property prediction benchmarks show GLA consistently improves performance over baselines, suggesting that modeling geometric heterogeneity enhances the grounding between molecular structure and chemical language.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal applications", "Molecular applications"], "openreview_url": "https://openreview.net/forum?id=Ptb6ACeyWg", "contribution_types": []}, {"id": "yMgPOGzWpZ", "title": "CoSMAC: A Benchmark for Evaluating Communication and Coordination in LLM-Based Agents", "abstract": "Large Language Models (LLMs) have recently demonstrated strong reasoning and communication abilities, motivating research into their potential as autonomous agents in multi-agent systems. In this work, we introduce Communicative SMAC (CoSMAC), a benchmark designed to systematically evaluate the communication and coordination capabilities of LLM-based agents. Built upon the well-established SMAC multi-agent reinforcement learning (MARL) environment, CoSMAC features a set of scenarios requiring varying degrees of micromanagement and communication, where agents must exchange information through natural language to achieve shared goals. We evaluate 8 state-of-the-art open-source and proprietary LLMs in zero-shot settings, analyzing model properties that are critical for communicative and cooperative behaviors. Based on these results, we then distill the Qwen2.5-7B model on the resulting dataset via supervised fine-tuning. We further compare the performance of LLM-based agents against a well-known MARL baseline trained without communication. Experimental results show that while LLMs struggle in scenarios demanding fine-gra
