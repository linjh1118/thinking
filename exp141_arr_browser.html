ined micromanagement and spatial coordination, they can outperform the MARL baseline in tasks that rely more heavily on effective communication. The environment implementation and datasets can be found on GitHub repository.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/cosmac-DC03MostexistingLLM-agentsystemsfocusonrel-042ativelysimple"], "keywords": ["Multiagent Systems", "Large Language Models", "Natural Language Communication", "Computation and Language", "Machine Learning"], "openreview_url": "https://openreview.net/forum?id=yMgPOGzWpZ", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "Tu3zq3qU7N", "title": "UniMoE-Audio: Unified Speech and Music Generation with Dynamic-Capacity Mixture-of-Experts", "abstract": "Recent advances in unified multimodal models indicate a clear trend towards comprehensive content generation. However, the auditory domain remains a significant challenge, with music and speech often developed in isolation, hindering progress towards universal audio synthesis. This separation stems from inherent task conflicts between semantic speech and structural music modeling, and severe data imbalances, which impede the development of a truly unified model. \nTo address these challenges, we propose **UniMoE-Audio**, a unified speech and music generation model built upon a novel **D**ynamic-**C**apacity **M**ix-**o**f-**E**xperts (DCMoE) framework. Architecturally, UniMoE-Audio extends the conventional MoE paradigm by introducing a Top-$P$ routing strategy for adaptive capacity allocation.\nTo tackle data imbalance, we introduce a three-stage training curriculum: 1) Independent Specialist Training leverages original datasets to instill domain-specific knowledge into each specialists without interference; 2) MoE Integration and Warmup incorporates these specialists into the UniMoE-Audio architecture, warming up the gate module and shared expert using a subset of balanced dataset; and 3) Synergistic Joint Training trains the entire model end-to-end on the fully balanced dataset, fostering enhanced cross-domain synergy.\nExtensive experiments show that UniMoE-Audio not only achieves state-of-the-art performance on major speech and music generation benchmarks, but also demonstrates superior synergistic learning, mitigating the performance degradation typically seen in naive joint training. Our findings highlight the substantial potential of specialized MoE architecture and curated training strategies in advancing universal audio generation.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Large Language Model", "Audio Generation", "Mix-of-Experts"], "openreview_url": "https://openreview.net/forum?id=Tu3zq3qU7N", "contribution_types": ["Engineering"]}, {"id": "F3eCqEQUaT", "title": "From Individual Excellence to Collective Sustainability: Seeking Strategic Equilibrium in Proactive Multi-Agent Teams", "abstract": "In heterogeneous team settings, proactive AI agents often suffer from Collaborative Myopia: a greedy optimization for immediate task accuracy that ignores long-term team longevity. This leads to the Individual-Centric Trap, where experts (e.g., PIs) are disproportionately overloaded while junior roles remain underutilized, incurring unobserved opportunity costs that erode collective sustainability. To resolve this efficiency-sustainability coupling problem, we propose GT-PMARL (Game-Theoretic Proactive Multi-Agent Reinforcement Learning). We reformulate team coordination as a strategic game that internalizes opportunity cost. Our framework employs: (1) a Positive-Unlabeled scorer to anchor intervention quality under sparse supervision, and (2) a Nash-Pareto competitive objective to seek an equilibrium between individual task excellence and collective load balancing. Empirical experiments on scientific workflows show that GT-PMARL effectively maintains high performance while preventing expert over-exploitation. Our work provides a game-theoretic foundation for building sustainable, balanced human-AI collaborative ecosystems.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Proactive Team Agent", "Team Sustainability", "Human-AI Collaboration", "Nash equilibrium"], "openreview_url": "https://openreview.net/forum?id=F3eCqEQUaT", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "VWXa75fRJd", "title": "CircuitLM: A Multi-Agent LLM-Aided Design Framework for Generating Circuit Schematics from Natural Language Prompts", "abstract": "Generating accurate circuit schematics from high-level natural language descriptions remains a persistent challenge in electronics design, as large language models (LLMs) frequently hallucinate in granular details, violate electrical constraints, and produce non-machine-readable outputs. We present CircuitLM, a novel multi-agent LLM-aided circuit design pipeline that translates user prompts into structured, visually interpretable $\\texttt{CircuitJSON}$ schematics through five sequential stages: (i) LLM-based component identification, (ii) canonical pinout retrieval, (iii) chain-of-thought reasoning by an electronics expert agent, (iv) JSON schematic synthesis, and (v) force-directed SVG visualization. Anchored by a curated, embedding-powered component knowledge base. While LLMs often violate electrical constraints, CircuitLM bridges this gap by grounding generation in a verified and dynamically extensible component database, initially comprising 50 components. To ensure safety, we incorporate a hybrid evaluation framework, namely Dual-Metric Circuit Validation (DMCV), validated against human-expert assessments, which achieves high fidelity in microcontroller-centric designs. We evaluate the system on 100 diverse embedded-systems prompts across six LLMs and introduce DMCV to assess both structural and electrical validity. This work bridges natural language input to deployable hardware designs, enabling reliable circuit prototyping by non-experts. Our code and data will be made public upon acceptance.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Chain-of-Thought Reasoning", "Circuit Design", "CircuitJSON", "CircuitLM", "Dual-Metric Circuit Validation (DMCV)", "Electronics Design Automation (EDA)"], "openreview_url": "https://openreview.net/forum?id=VWXa75fRJd", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "yT32tleoD1", "title": "There's Levels to It: Red Teaming Dialogue With Hierarchical Reinforcement Learning", "abstract": "Red teaming is essential for securing Large Language Models (LLMs), yet current automated methods remain limited by brittle templates and single-turn attacks. These approaches fail to simulate the complex, interactive nature of real-world adversarial attacks. We introduce a novel red teaming paradigm designed to maximize expected cumulative harm through strategic interaction. By formalizing red teaming as a Markov Decision Process (MDP) within a hierarchical Reinforcement Learning (RL) framework, we effectively navigate the challenges of sparse rewards and long-horizon planning. Our generative agent learns diverse, multi-turn attacks using a token-level harm reward, consistently uncovering vulnerabilities that bypass existing baselines. This approach establishes a new state-of-the-art, re-framing LLM red teaming as a principled, trajectory-based optimization process.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reinforcement Learning", "LLM Red Teaming"], "openreview_url": "https://openreview.net/forum?id=yT32tleoD1", "contribution_types": ["Theory"]}, {"id": "qXrbzGZBFt", "title": "GRRM: Group Relative Reward Modeling for Machine Translation", "abstract": "While Group Relative Policy Optimization (GRPO) offers a powerful framework for LLM post-training, its effectiveness in open-ended domains like Machine Translation hinges on accurate intra-group ranking. We identify that standard Scalar Quality Metrics (SQM) fall short in this context; by evaluating candidates in isolation, they lack the comparative context necessary to distinguish fine-grained linguistic nuances. To address this, we introduce the Group Quality Metric (GQM) paradigm and instantiate it via the Group Relative Reward Model (GRRM). Unlike traditional independent scorers, GRRM processes the entire candidate group jointly, leveraging comparative analysis to rigorously resolve relative quality and adaptive granularity. Empirical evaluations confirm that GRRM achieves competitive ranking accuracy among all baselines. Building on this foundation, we integrate GRRM into the GRPO training loop to optimize the translation policy.  Experimental results demonstrate that our framework not only improves general translation quality but also unlocks reasoning capabilities comparable to state-of-the-art reasoning models.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine Translation", "Reward Modeling", "Reasoning", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=qXrbzGZBFt", "contribution_types": ["Engineering"]}, {"id": "lEeIteQzU7", "title": "Representing data in words: A context engineering approach", "abstract": "Large language models (LLMs) have demonstrated remarkable potential across a broad range of applications. However, producing reliable text that faithfully represents data remains a challenge. While prior work has shown that task-specific conditioning through in-context learning and knowledge augmentation can improve performance, LLMs continue to struggle with interpreting and reasoning about numerical data. To address this, we introduce wordalisations, a methodology for generating stylistically natural narratives from data. Much like how visualisations display numerical data in a way that is easy to digest, wordalisations abstract data insights into descriptive texts. To illustrate its versatility, we apply our method to three application areas: scouting football players, personality tests, and international survey data. Due to the absence of standardized benchmarks for this specific task, we conduct LLM-as-a-judge and human-as-a-judge evaluations to assess accuracy across the three applications. We found that the wordalisation methods reduces misrepresentation of the data and shows the potential to improve communication about data. We further describe best practice methods for open and transparent development of communication about data.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/wordalisation-4088", "https://anonymous.4open.science/r/wordalisation-4088/model%20cards/model-cards.md"], "keywords": ["LLM", "prompt engineering", "context engineering", "NLP"], "openreview_url": "https://openreview.net/forum?id=lEeIteQzU7", "contribution_types": ["Engineering"]}, {"id": "RD5O8XuL0m", "title": "Automatic Paper Analysis and Categorisation for Systematic Reviews with Combined Reasoning-Augmented SFT and DAPO RL", "abstract": "Systematic reviews are a cornerstone of modern science, synthesising evidence from published research to provide the highest level of research evidence in a field. The process includes categorising studies on a number of different dimensions which is laborious and time consuming. Automatic approaches are beginning to be explored but the complexity of the task means we are currently far from a satisfactory solution. In this paper, we test different field-agnostic methods for automatic paper categorisation for systematic reviews, and test them on two tasks: (i) annotating NLP papers for categories of reported controlled-text generation methods, and (ii) annotating NLP papers for categories of reported human evaluations. We find that reasoning-enhanced fine-tuning combined with DAPO reinforcement learning rewarding both correctness and output format substantially improves the performance of LLMs (by up to +53.8% points), even when they have been pre-trained to perform reasoning, and cuts time required for annotation by around 80% in a human-in-the-loop setting.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["PEFT", "RL", "automatic annotation", "text classification"], "openreview_url": "https://openreview.net/forum?id=RD5O8XuL0m", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset"]}, {"id": "V9pJJy2uRc", "title": "Magistrate: A Repository-Context Aware Multi-Agent Framework for Automated Code Review", "abstract": "As Large Language Models make code writing faster than ever, the bottleneck has shifted to the critical task of reviewing code before merge: ensuring correctness, security, and compliance with project guidelines. We introduce $\\textbf{Magistrate}$, an automated code review framework designed to augment human reviewers by detecting complex, cross-file logic errors that single-pass analysis misses. Unlike existing tools that analyze isolated diffs, Magistrate employs a hierarchical multi-agent architecture: a $\\textit{Delegator}$ partitions changed files into semantically coherent batches, while parallel $\\textit{IssueDetector}$ agents combine static analysis (ast-grep) with LLM-based semantic reasoning over the full repository context. We also present $\\textbf{Magistrate-Bench}$, a benchmark of 2,042 Pull Requests across 12 programming languages, with complete repository workspaces cached at evaluation time to enable realistic dependency tracing. Evaluated on a 108-PR subset across four frontier models (Gemini 3 Flash, Devstral, Minimax M2, and Grok 4.1 Fast), Magistrate consistently improves F1 scores by 2.2--5.5$\\times$ over single-shot baselines, with the best model (Gemini 3 Flash) achieving an F1 of 0.214 and a hallucination rate of just 0.6\\%. Across all models, Magistrate identified $\\textbf{997 valid issues}$ that human reviewers had overlooked, demonstrating its utility as a complementary filter for objective correctness issues.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Automated Code Review", "Multi-Agent Systems", "Large Language Models for Code", "Repository-Level Code Understanding", "NLP for Software Engineering", "Benchmarking"], "openreview_url": "https://openreview.net/forum?id=V9pJJy2uRc", "contribution_types": ["Engineering", "Dataset"]}, {"id": "FeLiTM6Gb9", "title": "Training Dynamics of Large Language Models Under Domain Adaptation in Clinical Domains", "abstract": "While scaling laws for general-purpose language models are well-documented, the empirical trajectories governing their specialized adaptation to high-stakes clinical environments remain poorly understood. In this study, we systematically characterize the adaptation trajectories of the \\textit{Qwen2.5} and \\textit{Qwen3} model families within the German medical domain through continuous pre-training and model merging. We evaluate performance through a dual-metric lens, combining objective knowledge benchmarks via multiple-choice question answering with an assessment of generative proficiency through automated preference rankings. Our results reveal a critical asynchronous scaling behavior between factual recall and generative proficiency; while models achieve rapid stylistic alignment within the first 2B to 3B tokens, objective knowledge acquisition scales more gradually and exhibits significantly shallower improvement curves. Furthermore, our results demonstrate that once a sufficient architectural capacity is reached, domain-specific training allows models to bridge the performance gap to significantly larger generalist counterparts, challenging the assumption that raw parameter scale is the primary determinant of domain proficiency. These findings demonstrate that domain proficiency is not a monolithic acquisition process but a series of decoupled trajectories, providing an empirical blueprint for compute-optimal specialization in resource-constrained clinical environments.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["domain adaptation", "continual learning", "pre-training", "automatic evaluation", "evaluation methodologies", "multilingualism"], "openreview_url": "https://openreview.net/forum?id=FeLiTM6Gb9", "contribution_types": ["Analysis", "Efficiency"]}, {"id": "NLMnl0sL0i", "title": "CoSineVerifier: Tool-Augmented Answer Verification for Computation-Oriented Scientific Questions", "abstract": "Answer verification methods are widely employed in language model training pipelines spanning data curation, evaluation, and reinforcement learning with verifiable rewards (RLVR). \nWhile prior work focuses on developing unified verifiers applicable across multiple reasoning scenarios, significant challenges remain in computation-oriented scientific domains, such as algebraic equivalence checking.\nIn this paper, we introduce CosineVerifier, a tool-augmented verifier that leverages external executors to perform precise computations and symbolic simplifications. \nCosineVerifier enables robust verification that goes beyond simple semantic matching. \nTo train this accurate tool-augmented verifier, we propose a novel verifier training data augmentation method and a two-stage training framework to increase the correctness of tool-invoked verifications on computation-heavy questions.\nExtensive experiments across STEM, QA, and long-form reasoning tasks demonstrate CosineVerifier's robust generalization, achieving state-of-the-art performance on VerifyBench-Hard and SCI-Bench. Furthermore, when employed as an RLVR reward model, CosineVerifier consistently outperforms both rubric- and model-based verifiers on AIME'24, AIME'25 and GPQA-D, highlighting its potential to advance LLM reasoning.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/CosineVerifier-2256"], "keywords": ["LLM", "Verification", "Tool-integrated reasoning"], "openreview_url": "https://openreview.net/forum?id=NLMnl0sL0i", "contribution_types": []}, {"id": "omDa8f3u2d", "title": "Code-Mixed Phonetic Perturbations for Red-Teaming LLMs", "abstract": "Large language models (LLMs) continue to be demonstrably unsafe despite sophisticated safety alignment techniques and multilingual red-teaming. However, recent red-teaming work has focused on incremental gains in attack success over identifying underlying architectural vulnerabilities in models. In this work, we present \\textbf{CMP-RT}, a novel red-teaming probe that combines code-mixing with phonetic perturbuations (CMP), exposing a tokenizer-level safety vulnerability in transformers. Combining realistic elements from digital communication such as code-mixing and textese, CMP-RT preserves phonetics while perturbing safety-critical tokens, allowing harmful prompts to bypass alignment mechanisms while maintaining high prompt interpretability, exposing a gap between pre-training and safety alignment. Our results demonstrate robustness gainst standard defenses, attack scalability, and generalisation of the vulnerability across modalities and to SOTA models like Gemini-3-Pro, establishing CMP-RT as a major threat model, and highlighting tokenization as an under-examined vulnerability in current safety pipelines.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Code-mixing", "LLM", "Jailbreaking"], "openreview_url": "https://openreview.net/forum?id=omDa8f3u2d", "contribution_types": ["Analysis"]}, {"id": "APJp364Rcg", "title": "ECG-LoRA: A Conditional Fidelity Gated Adaptation Method for Empathetic Response Generation", "abstract": "Although Large Language Models (LLMs) excel in open-domain dialogue, they often struggle with emotional fidelity--the ability to dynamically adapt response styles and strategies to fine-grained emotional contexts. Existing Parameter-Effcient Fine-Tuning methods like LoRA typically apply static updates, failing to capture such nuanced variations. To address this, we propose Emotion-Conditioned Gated LoRA (ECG-LoRA), a novel framework that introduces a lightweight, input-aware gating mechanism to dynamically scale LoRA updates based on emotional signals. This design enables the model to intrinsically allocate adaptation capacity: intensifying intervention for high-arousal emotions while preserving base knowledge for subtle states. Extensive experiments on the EmpatheticDialogues benchmark across three LLM backbones (Qwen2-7B, Llama-3-8B, Gemma-7B) demonstrate that ECG-LoRA significantly outperforms standard LoRA in both generation quality (e.g., +0.65% BERTScore) and emotional fidelity (e.g.,+4.29% Emp-F1). Our framework is highly efficient, requiring only 0.12% additional parameters. More importantly, it introduces a new perspective for controllable text generation: targeting the imitationof complex, intrinsically consistent human behavioral patterns beyond simple semantic alignment. Code and data are released to facilitate future research.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["empathetic dialogue", "emotional fidelity", "controllable generation", "Parameter-Efficient Fine-Tuning", "LoRA adaptation", "gating mechanism"], "openreview_url": "https://openreview.net/forum?id=APJp364Rcg", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "rAYtG9ZlK7", "title": "See2Refine: Vision-Language Feedback Improves LLM-Based eHMI Action Designers", "abstract": "Automated vehicles lack natural communication channels with other road users, making external Human–Machine Interfaces (eHMIs) essential for conveying intent and maintaining trust in shared environments. However, most eHMI studies rely on developer-crafted message–action pairs, which are difficult to adapt to diverse and dynamic traffic contexts. A promising alternative is to use Large Language Models (LLMs) as action designers that generate context-conditioned eHMI actions, yet such designers lack perceptual verification and typically depend on fixed prompts or costly human-annotated feedback for improvement. We present See2Refine, a human-free, closed-loop framework that uses vision–language model (VLM) perceptual evaluation as automated visual feedback to improve an LLM-based eHMI action designer. Given a driving context and a candidate eHMI action, the VLM evaluates the perceived appropriateness of the action, and this feedback is used to iteratively revise the designer’s outputs, enabling systematic refinement without human supervision. We evaluate our framework across three eHMI modalities (lightbar, eyes, and arm) and multiple LLM model sizes. Across settings, our framework consistently outperforms prompt-only LLM designers and manually specified baselines in both VLM-based metrics and human-subject evaluations. Results further indicate that the improvements generalize across modalities and that VLM evaluations are well aligned with human preferences, supporting the robustness and effectiveness of See2Refine for scalable eHMI action design.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/eHMI_LLM_finetuning-3A74"], "keywords": ["Vision Language Models; Finetuning; RLAIF; eHMI; MLLM-as-Judge"], "openreview_url": "https://openreview.net/forum?id=rAYtG9ZlK7", "contribution_types": ["Engineering"]}, {"id": "Nc3S0h3oYc", "title": "From What to Respond to When to Respond: Timely Response Generation for Open-domain Dialog Agents", "abstract": "While research on dialog response generation has primarily focused on generating coherent responses conditioning on textual context, the critical question of when to respond grounded on the temporal context remains underexplored.\nTo bridge this gap, we propose a novel task named timely dialog response generation and introduce the TimelyChat benchmark to evaluate two key aspects: response timing and time-conditioned responses, which focus on the capabilities of language models to predict appropriate delays and delayed responses.\nAdditionally, we construct a large-scale training dataset by leveraging unlabeled event knowledge from a temporal commonsense knowledge graph and employing a large language model (LLM) to synthesize 55K event-driven dialogs.\nWe then train Timer, a dialog agent designed to proactively predict time intervals and generate timely responses that align with those intervals.\nExperimental results show that Timer outperforms instruction-tuned LLMs and other time-aware baselines in both turn-level and dialog-level evaluations.\nWe publicly release our data, model, and code.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/timelychat-EADE"], "keywords": ["open-domain dialogue system", "evaluation and metrics", "conversational modeling", "automatic creation and evaluation of language resources", "NLP datasets"], "openreview_url": "https://openreview.net/forum?id=Nc3S0h3oYc", "contribution_types": ["Dataset"]}, {"id": "UQmFUybRW6", "title": "SPASM: Stable Persona-driven Agent Simulation for Multi-turn Dialogue Generation", "abstract": "Large language models are increasingly deployed in multi-turn settings such as tutoring, support, and counseling, where reliability depends on preserving consistent roles, personas, and goals across long horizons. This requirement becomes critical when LLMs are used to generate synthetic dialogues for training and evaluation, since LLM–LLM conversations can accumulate identity-related failures such as persona drift, role confusion, and “echoing”, where one agent gradually mirrors its partner. We introduce SPASM (Stable Persona-driven Agent Simulation for Multi-turn dialogue generation), a modular, stability-first framework that decomposes simulation into (i) persona creation via schema sampling, plausibility validation, and natural-language persona crafting, (ii) Client–Responder dialogue generation, and (iii) termination detection for coherent stopping. To improve long-horizon stability without changing model weights, we propose Egocentric Context Projection (ECP): dialogue history is stored in a perspective-agnostic representation and deterministically projected into each agent’s egocentric view before generation. Across three LLM backbones (GPT-4o-mini, DeepSeek-V3.2, Qwen-Plus) and nine Client–Responder pairings, we construct a dataset of 4,500 personas and 45,000 conversations (500 personas × 10 conversations per pairing). Ablations show ECP substantially reduces persona drift and, under human validation, eliminates echoing; embedding analyses recover persona structure and reveal strong responder-driven interaction geometry.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Simulation", "LLM", "persona-driven simulation", "LLM–LLM dialogue", "synthetic data generation", "long-horizon consistency"], "openreview_url": "https://openreview.net/forum?id=UQmFUybRW6", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "e954id7ahS", "title": "GeoBuildBench: A Benchmark for Interactive and Executable Geometry Construction from Natural Language", "abstract": "We introduce **GeoBuildBench**, a benchmark designed to evaluate whether large language models and multimodal agents can ground informal natural-language plane geometry problems into executable geometric constructions. Unlike existing geometry benchmarks that focus on answer correctness or static diagram interpretation, GeoBuildBench treats geometry diagram as an interactive construction task: given a textual problem, an agent must generate a domain-specific language (DSL) program to produce a diagram satisfying explicitly specified geometric objects and verifiable constraints. The benchmark features 489 Chinese textbook-style problems, curated through automated filtering and human validation to ensure text-complete, constructible problem specifications. We evaluate several state-of-the-art multimodal models in a bounded iterative setting and show that, despite reasonable success rates, models frequently exhibit structural hallucinations, missing objects, and failures to satisfy geometric constraints, with limited ability to exploit visual and constraint-based feedback for self-correction. These results highlight geometry construction as a rigorous testbed for grounded, executable reasoning beyond textual or visual plausibility. Our benchmark and\ncode are released at https://anonymous.4open.science/r/GeoBuildBench-3032.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/GeoBuildBench-3032"], "keywords": ["geometry construction", "benchmark", "evaluation", "executable grounding", "structural hallucination", "multimodal agents"], "openreview_url": "https://openreview.net/forum?id=e954id7ahS", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "lFtK9fH8dR", "title": "CONTOUR: A Framework for Investigating LLM-Generated and Human-Written Knowledge on Controversial Topics", "abstract": "As Large Language Models (LLMs) increasingly serve as primary information-seeking tools, their role in shaping public perception of complex social issues becomes a critical concern for civic discourse. This study investigates the representation of controversial topics in LLMs. We propose a comparative framework that benchmarks LLM-generated content against two human-curated knowledge systems: Wikipedia, representing community-driven consensus, and Encyclopedia Britannica, representing elite expert viewpoints. Through a multi-dimensional linguistic analysis across 153 politically sensitive topics, we quantify the \"intensity of controversy\" using a novel taxonomy.", "area": "Social NLP", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["NLP tools for social analysis", "evaluation and metric", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=lFtK9fH8dR", "contribution_types": ["Engineering", "Reproduction", "Dataset"]}, {"id": "mh9w3tioyS", "title": "ConflictScore: Measuring How Language Models Handle Conflicting Evidence", "abstract": "Existing metrics for factuality and faithfulness evaluate whether an answer is supported or contradicted by its grounding documents, but they fail to capture when both supporting and contradicting evidence coexist. We introduce ConflictScore, a novel metric that quantifies how well a model’s response acknowledges conflicting evidence in its grounding documents. Our framework decomposes responses into atomic claims, labels each claim against each grounding document, and then aggregates these labels into two complementary measures: ConflictScore-Count (CS-C), the proportion of claims exhibiting conflicts, and ConflictScore-Ratio (CS-R), the balance between supporting and contradicting evidence. We develop ConflictBench, a benchmark covering diverse forms of conflicts such as ambiguity, contradiction, and divergent opinions, to systematically evaluate our metric. Experiments show that ConflictScore effectively detects overconfident claims across domains and can serve as a corrective feedback mechanism that improves truthfulness on TruthfulQA.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["ConflictScore", "ConflictBench", "Conflicting Evidence", "RAG", "Trustworthiness", "Evaluation"], "openreview_url": "https://openreview.net/forum?id=mh9w3tioyS", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "6FvRBX1mFX", "title": "Paper Circle: An open-source multi-agent research discovery and analysis framework", "abstract": "The rapid growth of scientific literature has made it increasingly difficult for researchers to efficiently discover, evaluate, and synthesize relevant work. Recent advances in multi-agent large language models (LLMs) have demonstrated strong potential for understanding user intent and are being trained to utilize various tools.\nIn this paper, we introduce Paper Circle, a multi-agent research discovery and analysis system designed to reduce the effort required to find, assess, organize, and understand academic literature. The system comprises two complementary pipelines: (1) a Discovery Pipeline that integrates offline and online retrieval from multiple sources, multi-criteria scoring, diversity-aware ranking, and structured outputs; and (2) an Analysis Pipeline that transforms individual papers into structured knowledge graphs with typed nodes (e.g., concepts, methods, experiments, and figures) and edges, enabling graph-aware question answering and coverage verification. Both pipelines are implemented within a coder LLM–based multi-agent orchestration framework and produce fully reproducible, synchronized outputs (JSON, CSV, BibTeX, Markdown, and HTML) at each agent step. This paper describes the system architecture, agent roles, retrieval and scoring methods, knowledge graph schema, and evaluation interfaces that together form the Paper Circle research workflow. We benchmark Paper Circle on both paper retrieval and paper review generation, reporting hit rate, MRR, and Recall@K. Results show consistent improvements with stronger agent models. We will publicly release the website and source code.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["mutli-agent", "research discovery", "paper reviews", "opensouce paper analysis", "orchestrator agent", "code agent"], "openreview_url": "https://openreview.net/forum?id=6FvRBX1mFX", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "cgNCARACVP", "title": "Apples, Oranges, and Tennis Balls: A Neuro-Symbolic Approach to Facilitate Flexible Retrieval Strategies", "abstract": "Humans exhibit flexible retrieval strategies that allow them to adaptively access different types of semantic knowledge depending on context and goals. In contrast, LLMs struggle with tasks requiring this kind of controlled, adaptive memory access. \nIn this work, we propose a neuro-symbolic approach to implement flexible retrieval strategies. We demonstrate our\nideas on the NYT Connections puzzle.\nThe Connections puzzle embodies many cognitive science themes, from how\nwe store concepts to how we flexibly retrieve them, and its study can offer a new lens to explore this topic.\n\nOur approach significantly outperforms LLM-only baselines, improving average scores by 2-7x across models, enabling models that previously solved 0-5 puzzles to perfectly solve up to 32. We also show that combining smaller, open-source LLMs with symbolic reasoning can outperform larger proprietary models. We make our code and data publicly available.", "area": "Linguistics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Connections; flexible retrieval strategies; neuro-symbolic"], "openreview_url": "https://openreview.net/forum?id=cgNCARACVP", "contribution_types": ["Analysis", "Engineering"]}, {"id": "mLSPVkGJFA", "title": "TinyR1-32B-Preview: Boosting Accuracy with Branch-Merge Distillation", "abstract": "It is beneficial but challenging to reduce the size of Large Language Models (LLMs) while maintaining their performance. Existing methods, such as naive model distillation, often fail to achieve high accuracy. To address this limitation, we introduce our Branch-Merge distillation approach: First, domain-specific knowledge from a large teacher model is selectively distilled into different student expert models; then, we merge these student experts in order to build a generalized model with cross-domain knowledge. With our distillation approach, we create TinyR1-32B-Preview, which outperforms the original student across multiple benchmarks, including Mathematics (+5.5), Coding (+4.4) and Science (+2.9), and achieves comparable performance to DeepSeek-R1 on AIME 2024. Our Branch-Merge distillation provides a novel solution for creating smaller, high-performing LLMs with reduced computational cost and time.", "area": "LLM Efficiency", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Branch-Merge Distillation", "Domain-specific Supervised Fine-Tuning", "Model Merging"], "openreview_url": "https://openreview.net/forum?id=mLSPVkGJFA", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "GXkkwSZMR0", "title": "Efficient Hallucination Detection in Automatic Code Generation", "abstract": "Large language models (LLMs) frequently generate source code that appears plausible yet contains hallucinations that lead to test failures. While uncertainty quantification (UQ) methods have shown promise for hallucination detection in natural language, their effectiveness in the code generation setting remains largely unexplored. In this work, we investigate the performance of state-of-the-art UQ methods for hallucination detection in source code generation and propose an efficient and effective training-based approach. We develop a diff-based pipeline to construct a code dataset annotated with line-level LLM hallucinations, enabling systematic benchmarking of hallucination detection methods. Using this pipeline, we build a large-scale annotated dataset and train a lightweight Transformer-based hallucination detector that leverages LLM hidden states as input features. Experimental results across diverse code generation domains demonstrate that the detector substantially outperforms other existing approaches in line-level hallucination detection. We release the first publicly available dataset of line-level code hallucinations, along with the corresponding source code and trained hallucination detectors.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large language models", "Automatic Code Generation", "Hallucination Detection"], "openreview_url": "https://openreview.net/forum?id=GXkkwSZMR0", "contribution_types": ["Analysis", "Dataset"]}, {"id": "gw3z90iqsz", "title": "PromptScreen: Efficient Jailbreak Mitigation Using Semantic Linear Classification in a Multi-Staged Pipeline", "abstract": "Prompt injection and jailbreaking attacks pose persistent security challenges to large language model (LLM)–based systems. We present \\textbf{PromptScreen}, an efficient and systematically evaluated defense architecture that mitigates these threats through a lightweight, multi‑stage pipeline. Its core component is a semantic filter based on text normalization, TF–IDF representations, and a Linear SVM classifier. Despite its simplicity, this module achieves 93.4\\% accuracy and 96.5\\% specificity on held‑out data, substantially reducing attack throughput while incurring negligible computational overhead.\n\nBuilding on this efficient foundation, the full pipeline integrates complementary detection and mitigation mechanisms that operate at successive stages, providing strong robustness with minimal latency. In comparative experiments, our SVM‑based configuration improves overall accuracy from 35.1 \\% to 93.4\\% while reducing average time‑to‑completion from $\\approx$ 450s to 47s, yielding over 10× lower latency than ShieldGemma. These results demonstrate that the proposed design simultaneously advances defensive precision and efficiency, addressing a core limitation of current model‑based moderators.\n\nEvaluation across a curated corpus of over 30{,}000 labeled prompts, including benign, jailbreak, and application‑layer injections, confirms that staged, resource‑efficient defenses can robustly secure modern LLM‑driven applications.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/PromptScreen-F78D"], "keywords": ["Prompt injection", "jailbreak attacks", "LLM security", "semantic filtering", "efficient defenses", "adversarial prompting"], "openreview_url": "https://openreview.net/forum?id=gw3z90iqsz", "contribution_types": ["Analysis", "Engineering", "Efficiency", "Dataset"]}, {"id": "m9eRFXoyN8", "title": "SAHM (سهم): A Benchmark for Arabic Financial and Shari’ah-Compliant Reasoning", "abstract": "English financial NLP has progressed rapidly through benchmarks for sentiment, document understanding, and financial question answering, while Arabic financial NLP remains comparatively under-explored despite strong practical demand for trustworthy finance and Islamic-finance assistants. We introduce SAHM, a document-grounded benchmark and instruction-tuning dataset for Arabic financial NLP and Shari’ah-compliant reasoning. SAHM contains 14,380 expert-verified instances spanning seven tasks: AAOIFI standards QA, fatwa-based QA/MCQ, accounting and business exams, financial sentiment analysis, extractive summarization, and event–cause reasoning, curated from authentic regulatory, juristic, and corporate sources. We evaluate 19 strong open and proprietary LLMs using task-specific metrics and rubric-based scoring for open-ended outputs, and find that Arabic fluency does not reliably translate to evidence-grounded financial reasoning: models are substantially stronger on recognition-style tasks than on generation and causal reasoning, with the largest gaps on event–cause reasoning. We release the benchmark, evaluation framework, and an instruction-tuned model to support future research on trustworthy Arabic financial NLP.", "area": "Multilinguality and Language Diversity", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Arabic NLP", "financial NLP", "Islamic finance", "Shari’ah reasoning", "question answering", "benchmark dataset"], "openreview_url": "https://openreview.net/forum?id=m9eRFXoyN8", "contribution_types": ["Dataset"]}, {"id": "1BzZNk5dzG", "title": "Enhancing Repository-Level Code Completion with Reinforcement Learning in Real-World Scenarios", "abstract": "The rapid development of large language models (LLMs) for code, which closely aligns with the practical needs of real-world software development, has sparked growing attention in repository-level code completion. However, existing Code LLMs present challenges in focusing on suitable contexts from the repository and in deeply reasoning about cross-file dependencies. To address these challenges, we propose a novel reinforcement learning framework for repository-level code completion. To better understand both in-file and cross-file contexts, we employ identifier-driven intent recognition to capture completion intent, thereby improving the model's performance in real-world scenarios. To enhance cross-file reasoning,  we propose a reward-driven completion learning to effectively reward in complex repository completion scenarios. To guide LLMs in completing code that aligns with intended functionality and repository context, we introduce a selective-exploration strategy that directs the model to focus on low-confidence, high-reward tokens, promoting the exploration of valuable, underexplored completion patterns. Experimental results show that our approach significantly improves the performance of Code LLMs.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/IntentCoder-EAD5"], "keywords": ["Repository-Level Code Completion", "Code LLMs"], "openreview_url": "https://openreview.net/forum?id=1BzZNk5dzG", "contribution_types": ["Engineering"]}, {"id": "S9CgeqKKql", "title": "$R^3$: End-to-End Reasoning-based Planning for Multi-step Retrosynthesis via Reinforcement Learning", "abstract": "Multi-step retrosynthetic planning is a fundamental challenge in organic chemistry, traditionally modeled as a combinatorial search problem guided by single-step prediction models. However, this search-centric paradigm often disconnects from the explicit chemical reasoning processes employed by human experts. In this paper, we propose $R^3$ (**R**einforced **R**easoning **R**etrosynthesis), a novel framework that reformulates this task as end-to-end generative reasoning. Instead of traversing a search tree, $R^3$ simulates the problem-solving logic of chemists to directly generate complete synthetic pathways. To achieve this, we initialize the model with domain knowledge and employ end-to-end Reinforcement Learning (RL) to optimize the entire planning policy. Experimental results on Retrobench show that $R^3$ achieves a state-of-the-art Top-1 accuracy of 43.7\\%, demonstrating that generative reasoning offers a superior alternative to traditional search algorithms in solving complex retrosynthetic problems.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multi-step Retrosynthesis", "Reinforcement Learning", "Large Language Models", "AI for Science"], "openreview_url": "https://openreview.net/forum?id=S9CgeqKKql", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "78azWvR3Do", "title": "TableHallu: A Benchmark for Uncovering Hallucinations in Query-Driven Table Generation", "abstract": "While Large Language Models (LLMs) excel at processing unstructured text, their reliability falters in structured data generation, leading to a critical issue we term table hallucination. Existing benchmarks, reliant on monolithic accuracy scores, fail to diagnose the specific ways models err. To address this, we introduce a systematic framework for understanding and evaluating this problem. Our contributions are threefold. First, we provide a formal definition and a comprehensive taxonomy of table hallucinations. Second, based on this taxonomy, we construct TableHallu, the first diagnostic benchmark for this task. TableHallu is built using a novel, scalable pipeline that programmatically injects distractors to create challenging test cases. This automated process, which eliminates the need for costly manual annotation, is proven to be over 95% accurate under human verification. Third, we conduct a comprehensive evaluation of state-of-the-art LLMs on TableHallu. The results reveal alarming and previously obscured vulnerabilities: models universally struggle with ordering constraints, frequently invent non-existent entities or attributes, and fail at elementary arithmetic during table generation. Our work provides the first systematic analysis of table hallucinations and a robust benchmark to steer future research from pursuing simple accuracy towards achieving verifiable, multi-faceted reliability. Code and data will be available.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Hallucination", "Large Language Model", "Table Hallucination", "Faithfulness", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=78azWvR3Do", "contribution_types": ["Analysis", "Dataset"]}, {"id": "A9caGWJyDy", "title": "SocraticKG: Knowledge Graph Construction via QA-Driven Fact Extraction", "abstract": "Constructing Knowledge Graphs (KGs) from unstructured text provides a structured framework for knowledge representation and reasoning, yet current LLM-based approaches struggle with a fundamental trade-off: factual coverage often leads to relational fragmentation, while premature consolidation causes information loss. To address this, we propose SocraticKG, an automated KG construction method that introduces question-answer pairs as a structured intermediate representation to systematically unfold document-level semantics prior to triple extraction. By employing 5W1H-guided QA expansion, SocraticKG captures contextual dependencies and implicit relational links typically lost in direct KG extraction pipelines, providing explicit grounding in the source document that helps mitigate implicit reasoning errors. Evaluation on the MINE benchmark demonstrates that our approach effectively addresses the coverage-connectivity trade-off, achieving superior factual retention while maintaining high structural cohesion even as extracted knowledge volume substantially expands. These results highlight that QA-mediated semantic scaffolding plays a critical role in structuring semantics prior to KG extraction, enabling more coherent and reliable graph construction in subsequent stages.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Knowledge Graph Construction", "QA-Driven", "5W1H Framework", "Semantic Coherence", "Factual Recoverability"], "openreview_url": "https://openreview.net/forum?id=A9caGWJyDy", "contribution_types": ["Engineering"]}, {"id": "GPg10Fm5k2", "title": "Can Lightweight LLM Agents Improve Spatial Transcriptomics Annotation?", "abstract": "Spatial transcriptomics (ST) enables the study of tissue organization by linking gene expression to spatial context, yet automated annotation of spatial regions remains challenging. While recent work has explored large language models (LLMs) for biological reasoning, their utility in low-compute, locally deployable settings is poorly understood. We study whether lightweight, open-weight LLMs can improve ST region annotation when used as constrained post-hoc reviewers rather than standalone predictors. Our approach combines deterministic rule-based heuristics, prototype-derived neighborhood summaries, and a tri-role LLM review process (Analyst–Consensus–Reviewer) that is selectively invoked for ambiguous regions. \n\nWe evaluate single- and multi-stage variants across six STARmap and MERFISH datasets using standard clustering and spatial coherence metrics (NMI, ARI, CHAOS, ASW). Results show that small models such as \\texttt{LLama 3.2} and \\texttt{Qwen3} match deterministic baselines in clustering accuracy on average across datasets, while consistently improving spatial coherence and interpretability. These findings suggest that lightweight LLM components can serve as resource-efficient, coherence-aware modules in spatial omics annotation pipelines.", "area": "Clinical and Biomedical Applications", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Spatial transcriptomics", "large language models", "agentic reasoning", "low-compute AI", "spatial clustering", "biological interpretability"], "openreview_url": "https://openreview.net/forum?id=GPg10Fm5k2", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency", "Data Analysis"]}, {"id": "bR5Cd2POe8", "title": "Typology-Aware Multilingual Morphosyntactic Parsing with Joint Abstract Node Modeling", "abstract": "The UniDive 2025 Morphosyntactic Parsing (MSP) shared task introduces a representation unifying dependency structure, morphological features, and unrealized arguments. Unlike Universal Dependencies, MSP encodes abstract nodes (e.g., dropped subjects, implicit pronouns) as labels projected onto content words, which standard UD parsers cannot model. We present a multilingual, typology-aware joint system integrating word-type prediction, content-only parsing, morphological tagging, and an abstract-node component within a single architecture. The model combines the baseline joint framework with typology-conditioned adapters and progressive weighting for abstract supervision. On the MSP test set, our model outperforms the leading submission by 3.23 percentage points in MSLAS, 3.35 in LAS, and 1.78 in FEATS macro F1, demonstrating the effectiveness of typology-sensitive multi-task learning in MSP.", "area": "Syntax/Parsing", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["morphosyntactic parsing", "abstract node modeling", "multilingual dependency parsing", "typology-aware adaptation", "non-overt syntax"], "openreview_url": "https://openreview.net/forum?id=bR5Cd2POe8", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "fKvbL1pLbh", "title": "TIME: Temporally Intelligent Meta-reasoning Engine for Context Triggered Explicit Reasoning", "abstract": "Reasoning oriented large language models often expose explicit “thinking” as long, turn-global traces at the start of every response, either always on or toggled externally at inference time. While useful for arithmetic, programming, and problem solving, this design is costly, blurs claim-level auditability, and cannot re-trigger explicit reasoning once the model begins presenting. Dialogue models are also largely blind to temporal structure, treating replies after seconds and replies after weeks as equivalent unless time is stated in text.\n\nWe introduce TIME, the Temporally Intelligent Meta-reasoning Engine, a behavioral alignment framework that treats explicit reasoning as a context-sensitive resource driven by discourse and temporal cues. TIME augments dialogue with optional ISO 8601 ⟨time⟩ tags, tick turns that represent silent gaps, and short ⟨think⟩ blocks that can appear anywhere in a reply. A four-phase curriculum, including a small, maximally diverse full-batch alignment step, trains Qwen3 dense models to invoke brief, in-place reasoning bursts and keep user-facing text compact. We evaluate with TimeBench, a temporally grounded dialogue benchmark probing chronology, commonsense under gaps and offsets, anomaly detection, and continuity. Across 4B to 32B scales, TIME improves TimeBench scores over base Qwen3 in both thinking and no-thinking modes while reducing reasoning tokens by about an order of magnitude.", "area": "Discourse, Pragmatics, and Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Adaptive Reasoning", "Reasoning Efficiency", "Model Interpretability", "Reasoning Control", "Behavioral Alignment", "Temporal Reasoning"], "openreview_url": "https://openreview.net/forum?id=fKvbL1pLbh", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "2PLn1VELDY", "title": "PACE: Prefix-Protected and Difficulty-Aware Compression for Efficient Reasoning", "abstract": "Language Reasoning Models (LRMs) achieve strong performance by scaling test-time computation but often suffer from \"overthinking\", producing excessively long reasoning traces that increase latency and memory usage. Existing LRMs typically enforce conciseness with uniform length penalties, which over-compress crucial early deduction steps at the sequence level and indiscriminately penalize all queries at the group level. To solve these limitations, we propose PACE, a dual-level framework for prefix-protected and difficulty-aware compression under hierarchical supervision. At the sequence level, prefix-protected optimization employs decaying mixed rollouts to maintain valid reasoning paths while promoting conciseness. At the group level, difficulty-aware penalty dynamically scales length constraints based on query complexity, maintaining exploration for harder questions while curbing redundancy on easier ones. Extensive experiments on DeepSeek-R1-Distill-Qwen (1.5B/7B) demonstrate that PACE achieves a substantial reduction in token usage (up to 55.7\\%) while simultaneously improving accuracy (up to 4.1\\%) on math benchmarks, with generalization ability to code, science, and general domains.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/PACE-F6BB"], "keywords": ["Efficient Reasoning", "Large Reasoning Models", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=2PLn1VELDY", "contribution_types": ["Analysis", "Engineering", "Reproduction"]}, {"id": "iodHOxNDWL", "title": "DARM: Distribution-Aware Reward Modeling by Alleviating Biases from Low Preference-Context Dependency Data", "abstract": "Reward models (RMs) are the surrogate objectives in reinforcement learning from human feedback (RLHF), and their scores directly steer policy optimization. We show that standard RM training is vulnerable in data subsets where response quality depends only weakly on the context: such instances encourage the RM to ignore the context, leading to context neglect and degraded accuracy. \nTo address this failure mode, we propose Distribution-Aware Reward Modeling (DARM), which augments the RM objective with a conditional mutual information regularizer that maximizes context and the predicted reward conditioned on the response. By explicitly preserving the sensitivity of reward signals to the prompting context, DARM reduces over-reliance on response-only features and improves robustness to contextual variation. Extensive experiments across in-distribution and out-of-distribution settings show that DARM trained RMs deliver more accurate and consistent scoring than strong baselines. We further evaluate its downstream impact in RLHF, where DARM produce better aligned policies. We also demonstrate the necessity of each DARM design component and the impact of key parameters on performance through ablation experiments.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reward Modeling", "Reinforcement Learning from Human Feedback", "Human Preference Alignment"], "openreview_url": "https://openreview.net/forum?id=iodHOxNDWL", "contribution_types": ["Analysis", "Engineering"]}, {"id": "lfRwvweo6R", "title": "Enhancing Large Language Model Reasoning via Latent Space Modeling for Pre-thinking and Pre-answering", "abstract": "Chain-of-Thought (CoT) has proven effective for eliciting reasoning abilities in large language models, but standard autoregressive decoders treat reasoning and answer tokens uniformly as next-token prediction targets, despite their fundamentally different roles. This homogeneous modeling introduces conflicting inductive biases and significant inference overhead. Latent CoT methods attempt to improve efficiency by removing explicit reasoning tokens, yet often degrade performance, indicating that explicit reasoning supervision remains critical for preserving pretrained reasoning capabilities.\nTo address these challenges,\nwe propose Pre$^2$, a phase-aware reasoning framework that decouples thinking and answering while retaining explicit CoT supervision. Our approach introduces independent pre-thinking and pre-answering latent states and integrates them with explicit token representations through a hybrid latent–token decoding paradigm. This design increases computation along both width and depth dimensions with minimal parameter overhead, enabling stronger reasoning without sacrificing inference efficiency. Experiments on one in-domain dataset and four out-of-domain benchmarks demonstrate consistent improvements over strong baselines and robust generalization. Code will be released at github.com", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Latent space modeling", "chain of thoughts", "reasoning"], "openreview_url": "https://openreview.net/forum?id=lfRwvweo6R", "contribution_types": ["Engineering", "Theory"]}, {"id": "R6d86jMO74", "title": "Coordinated Cross-Modal Token Reuse with a Unified Mask for Efficient and Accurate Inference in VLA Models", "abstract": "Vision-language-action (VLA) inference suffers from substantial redundancy across consecutive frames, where large regions of the visual input remain unchanged while the model repeatedly re-encodes the entire scene. We propose a training-free approach for efficient and accurate VLA inference based on \\emph{coordinated cross-modal token reuse}. Our method introduces a \\emph{unified mask} that identifies static and task-irrelevant visual patches using a two-stage criterion combining temporal appearance consistency and attention-based relevance. The unified mask drives reuse consistently in both the vision encoder and the language model: cached visual representations are reused for selected patches, while dynamic or task-critical regions are recomputed. This coordinated reuse preserves cross-modal consistency and enables end-to-end acceleration without modifying model architecture or requiring finetuning. Experiments on robotic manipulation tasks demonstrate that the proposed approach improves inference efficiency while maintaining or improving task success rates, validating the effectiveness of unified, cross-modal token reuse in VLA models.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vision Language Models", "Vision Language Action Models", "Efficient Inferrence"], "openreview_url": "https://openreview.net/forum?id=R6d86jMO74", "contribution_types": ["Low-resource", "Efficiency"]}, {"id": "1ijZGDXo4F", "title": "GROKE: Vision-Free Navigation Instruction Evaluation via Graph Reasoning on OpenStreetMap", "abstract": "The evaluation of navigation instructions remains a persistent challenge in Vision-and-Language Navigation (VLN) research. Traditional reference-based metrics such as BLEU and ROUGE fail to capture the functional utility of spatial directives, specifically whether an instruction successfully guides a navigator to the intended destination. \nAlthough existing VLN agents could serve as evaluators, their reliance on high-fidelity visual simulators introduces licensing constraints and computational costs, and perception errors further confound linguistic quality assessment.\nThis paper introduces GROKE (Graph-based Reasoning over OSM Knowledge for instruction Evaluation), a vision-free training-free hierarchical LLM-based framework for evaluating navigation instructions using OpenStreetMap data. Through systematic ablation studies, we demonstrate that structured JSON and textual formats for spatial information substantially outperform grid-based and visual graph representations. Our hierarchical architecture combines sub-instruction planning with topological graph navigation, reducing navigation error by 68.5% compared to heuristic and sampling baselines on the Map2Seq dataset. The agent's execution success, trajectory fidelity, and decision patterns serve as proxy metrics for functional navigability given OSM-visible landmarks and topology, establishing a scalable and interpretable evaluation paradigm without visual dependencies. Code and data are available at https://anonymous.4open.science/r/groke.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/groke"], "keywords": ["Navigation Instruction Evaluation", "Graph Reasoning", "Vision-Free Navigation", "Topological Navigation", "Large Language Models", "Spatial Reasoning"], "openreview_url": "https://openreview.net/forum?id=1ijZGDXo4F", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "ghIwINVsqp", "title": "FlexGuard: Continuous Risk Scoring for Strictness-Adaptive LLM Content Moderation", "abstract": "Ensuring the safety of LLM-generated content is essential for real-world deployment.\nMost existing guardrail models formulate moderation as a fixed binary classification task, implicitly assuming a fixed definition of harmfulness.\nIn practice, enforcement strictness—how conservatively harmfulness is defined and enforced—varies across platforms and evolves over time, making binary moderators brittle under shifting requirements.\nIn this paper, we introduce FlexBench, a strictness-adaptive LLM moderation benchmark that enables controlled evaluation under multiple strictness regimes.\nExperiments on FlexBench reveal substantial cross-strictness inconsistency in existing moderators: models that perform well under one regime can degrade substantially under others, limiting their practical usability.\nTo address this, we propose FlexGuard, an LLM-based moderator that outputs a calibrated continuous risk score reflecting risk severity and supports strictness-specific decisions via thresholding.\nWe train FlexGuard via risk-alignment optimization to improve score--severity consistency and provide practical threshold selection strategies to adapt to target strictness at deployment.\nExperiments on FlexBench and public benchmarks demonstrate that FlexGuard achieves higher moderation accuracy and substantially improved robustness under varying strictness.\nWe release the source code and data (https://anonymous.4open.science/r/FlexGuard-4654) to support reproducibility.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/FlexGuard-4654", "https://anonymous.4open.science/r/FlexGuard-"], "keywords": ["LLM", "content moderation", "moderators", "guardrails"], "openreview_url": "https://openreview.net/forum?id=ghIwINVsqp", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "DxyKgcGfbP", "title": "DeepCode: Open Agentic Coding", "abstract": "Recent advances in Large Language Models (LLMs) have enabled the shift from coding assistants to autonomous software engineers. However, high-fidelity document-to-codebase synthesis—such as reproducing scientific papers—remains challenging due to the fundamental conflict between information overload and the finite context constraints of LLMs. In this work, we introduce DeepCode, a fully autonomous framework that addresses this challenge through principled information-flow management. By treating repository synthesis as a channel optimization problem, DeepCode maximizes task-relevant signals under strict context budgets via four orchestrated operations: source compression via blueprint distillation, structured indexing using stateful memory, conditional knowledge injection via retrieval-augmented generation, and closed-loop error correction. Extensive evaluations on PaperBench demonstrate that DeepCode achieves state-of-the-art performance, decisively outperforming leading commercial agents and, notably, surpassing PhD-level human experts on key reproduction metrics. Our source code is available at: https://anonymous.4open.science/r/DeepCode-C464.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/DeepCode-C464"], "keywords": ["Agentic-Coding", "LLM agent", "Large language model"], "openreview_url": "https://openreview.net/forum?id=DxyKgcGfbP", "contribution_types": ["Engineering"]}, {"id": "RlbpGBx0nX", "title": "PragmaticSearch: Learning to Efficient Retrieval via Advantage Shaping", "abstract": "Retrieval-Augmented Generation (RAG) is essential for grounding Large Language Models, yet its deployment is hindered by the high latency and financial costs of frequent retrieval. Existing reinforcement learning approaches primarily maximize answer accuracy, inadvertently encouraging excessive search behavior and ignoring the trade-off between performance and efficiency. \nTo resolve this, we introduce PragmaticSearch, a framework that learns efficient retrieval. Unlike standard RL, PragmaticSearch employs a Two-Stage Advantage Shaping (TSAS) curriculum that explicitly decouples capability learning from cost calibration. We further introduce a gating mechanism, theoretically grounded in a Bayesian estimate of retrieval necessity, that dynamically neutralizes cost penalties when retrieval provides high utility. Optimized via our stabilized LS-GRPO algorithm, this approach prevents policy collapse. Experiments across seven benchmarks show that PragmaticSearch reduces retrieval calls by up to 76.2\\% while maintaining competitive performance.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Search Capability Incentivization", "Curriculum Learning", "Tool Learning"], "openreview_url": "https://openreview.net/forum?id=RlbpGBx0nX", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "oxkTpziYja", "title": "MemBuilder: Reinforcing LLMs for Long-Term Memory Construction via Attributed Dense Rewards", "abstract": "Maintaining consistency in long-term dialogues remains a fundamental challenge for LLMs, as standard retrieval mechanisms often fail to capture the temporal evolution of historical states.\nWhile memory-augmented frameworks offer a structured alternative, current systems rely on static prompting of closed-source models or suffer from ineffective training paradigms with sparse rewards. \nWe introduce MemBuilder, a reinforcement learning framework that trains models to orchestrate multi-dimensional memory construction with attributed dense rewards. \nMemBuilder addresses two key challenges: (1) Sparse Trajectory-Level Rewards: we employ synthetic session-level question generation to provide dense intermediate rewards across extended trajectories; and (2) Multi-Dimensional Memory Attribution: we introduce contribution-aware gradient weighting that scales policy updates based on each component's downstream impact.\nExperimental results show that MemBuilder enables a 4B-parameter model to outperform state-of-the-art closed-source baselines, exhibiting strong generalization across long-term dialogue benchmarks.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reinforcement Learning", "Long-Term Memory", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=oxkTpziYja", "contribution_types": ["Engineering"]}, {"id": "uxiPvnnsC3", "title": "SpeechMedAssist: Efficiently and Effectively Adapting Speech Language Models for Medical Consultation", "abstract": "Medical consultations are intrinsically speech-centric. However, most prior works focus on long-text-based interactions, which are cumbersome and patient-unfriendly. Recent advances in speech language models (SpeechLMs) have enabled more natural speech-based interaction, yet the scarcity of medical speech data and the inefficiency of directly fine-tuning on speech data jointly hinder the adoption of SpeechLMs in medical consultation.\nIn this paper, we propose SpeechMedAssist, a SpeechLM natively capable of conducting speech-based multi-turn interactions with patients. By exploiting the architectural properties of SpeechLMs, we decouple the conventional one-stage training into a two-stage paradigm consisting of **(1) Knowledge & Capability Injection via Text** and **(2) Modality Re-alignment with Limited Speech Data**, thereby reducing the requirement for medical speech data to only **10k** synthesized samples.\nTo evaluate SpeechLMs for medical consultation scenarios, we design a benchmark comprising both single-turn question answering and multi-turn simulated interactions. Experimental results show that our model outperforms all baselines in both effectiveness and robustness in most evaluation settings.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SpeechMedAssist-Anonymous"], "keywords": ["speech-language models", "medical consultation", "speech-based interaction", "domain application"], "openreview_url": "https://openreview.net/forum?id=uxiPvnnsC3", "contribution_types": ["Low-resource", "Dataset"]}, {"id": "ynv63rk29C", "title": "DynaSafe-RL: Dynamic Behaviour Control with Reinforcement-Learning Safeguards for Safe LLM Dialogue", "abstract": "LLMs can produce harmful content in interactive dialogue, but retraining or weight editing is costly and often infeasible for black-box systems. This paper presents DynaSafe-RL, an adaptive behaviour-steering framework that regulates LLMs at runtime without retraining or parameter access. It operates through an adaptive, closed-loop prompt refinement mechanism driven by a reinforcement learning agent that selects optimal safeguarding strategies based on live safety–quality feedback. DynaSafe-RL significantly improves safety across 12 harm categories and four diverse LLMs, maintaining response quality and outperforming most handcrafted dynamic baselines\\footnote{Full code and results are available at \\url{https://anonymous.4open.science/r/DynaSafe-RL-126C/}}. Retention analysis shows that 60.12\\%–94.50\\% of the improved behaviour persists even after safeguards are removed. The framework is model-agnostic, lightweight, and suitable for practical deployment.", "area": "Social NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/DynaSafe-RL-126C"], "keywords": ["NLP", "Optimization", "Generative Models", "LLM", "Rudeness Detection", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=ynv63rk29C", "contribution_types": ["Analysis", "Engineering"]}, {"id": "GVvEFz3aww", "title": "LMT: Toward Inclusive and Scalable Multilingual Machine Translation with LLMs", "abstract": "Large language models have significantly advanced Multilingual Machine Translation (MMT), yet scaling to many languages while keeping quality robust across directions remains challenging.\nIn this paper, we identify a failure mode of multilingual supervised fine-tuning (SFT) on multi-way parallel data: when such data are reused symmetrically around a pivot language (e.g., English), performance on reverse directions (X $\\to$ pivot) can drop substantially.\nWe term this phenomenon Directional Degeneration and attribute it to excessive many-to-one mappings, which encourage shortcut learning.\nWe propose \\textbf{Strategic Downsampling}, a simple yet effective method to mitigate this degeneration.\nIn addition, we introduce \\textbf{Parallel Multilingual Prompting (PMP)}, which augments translation instructions with an auxiliary parallel sentence to promote cross-lingual transfer during training and enables optional test-time enhancement when auxiliary translations are available. \nWe further develop \\textbf{LMT}, a Chinese–English-centric suite of \\textbf{L}arge-scale \\textbf{M}ultilingual \\textbf{T}ranslation models spanning four sizes (0.6B/1.7B/4B/8B) covering 60 languages and 234 directions.\nComprehensive evaluations show that LMT is competitive among open-source MMT systems, and that our 4B LMT model performs on par with or better than substantially larger baselines. \nWe release our models to support inclusive and scalable MMT.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["multilingual machine translation", "large language models"], "openreview_url": "https://openreview.net/forum?id=GVvEFz3aww", "contribution_types": ["Low-resource", "Dataset"]}, {"id": "TbiLZAItyZ", "title": "Live-Evo: Online Evolution of Agentic Memory from Continuous Feedback", "abstract": "Large language model (LLM) agents are increasingly equipped with memory, which are stored experience and reusable guidance that can improve task-solving performance. Recent \\emph{self-evolving} systems update memory based on interaction outcomes, but most existing evolution pipelines are developed for static train/test splits and only approximate online learning by folding static benchmarks, making them brittle under true distribution shift and continuous feedback. We introduce \\textsc{Live-Evo}, an online self-evolving memory system that learns from a stream of incoming data over time. \\textsc{Live-Evo} decouples \\emph{what happened} from \\emph{how to use it} via an Experience Bank and a Meta-Guideline Bank, compiling task-adaptive guidelines from retrieved experiences for each task. To manage memory online, \\textsc{Live-Evo} maintains experience weights and updates them from feedback: experiences that consistently help are reinforced and retrieved more often, while misleading or stale experiences are down-weighted and gradually forgotten, analogous to reinforcement and decay in human memory. On the live \\textit{Prophet Arena} benchmark over a 10-week horizon, \\textsc{Live-Evo} improves Brier score by 20.8\\% and increases market returns by 12.9\\%, while also transferring to deep-research benchmarks with consistent gains over strong baselines.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Agent;  Self-Evolving; Agent Memory; Live-Benchmark; Online Learning"], "openreview_url": "https://openreview.net/forum?id=TbiLZAItyZ", "contribution_types": ["Analysis", "Engineering"]}, {"id": "4iMJscN9Fb", "title": "Beyond Overlap Metrics: Rewarding Reasoning and Preferences for Faithful Multi-Role Dialogue Summarization", "abstract": "Multi-role dialogue summarization requires modeling complex interactions among multiple speakers while preserving role-specific information and factual consistency. However, most existing methods optimize for automatic metrics such as ROUGE and BERTScore, which favor surface-level imitation of references rather than genuine gains in faithfulness or alignment with human preferences. We propose a novel framework that couples explicit cognitive-style reasoning with reward-based optimization for multi-role dialogue summarization. Our method first distills structured reasoning traces (e.g., step-by-step inferences and intermediate reflections) from a large teacher model and uses them as auxiliary supervision to initialize a reasoning-aware summarizer via staged supervised fine-tuning. It then applies GRPO with a dual-principle reward that blends metric-based signals with human-aligned criteria targeting key information coverage, implicit inference, factual faithfulness, and conciseness. Experiments on multilingual multi-role dialogue benchmarks show that our method matches strong baselines on ROUGE and BERTScore. Specifically, results on CSDS confirm the framework's stability in semantic consistency, while in-depth analysis on SAMSum demonstrates clear gains in factual faithfulness and model-based preference alignment. These findings underscore the value of reasoning-aware and preference-aware training for reliable dialogue summarization. Code will be made accessible upon acceptance, checkpoints and datasets are now available at https://huggingface.co/NebulaPixel.", "area": "Summarization", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multi-role dialogue summarization", "Cognitive reasoning", "Reward-based optimization", "GRPO", "Factual faithfulness", "Human preference alignment"], "openreview_url": "https://openreview.net/forum?id=4iMJscN9Fb", "contribution_types": ["Engineering"]}, {"id": "cDdVItK7CU", "title": "BiMol-Diff: A Unified Diffusion Framework for Molecular Generation and Captioning", "abstract": "Bridging molecular structures and natural language is essential for controllable design. Autoregressive models struggle with long-range dependencies, while standard diffusion processes apply uniform corruption across positions, which can distort structurally informative tokens. We present BiMol-Diff, a unified diffusion framework for the paired tasks of text-conditioned molecule generation and molecule captioning. Our key component is a token-aware noise schedule that assigns position-dependent corruption based on token recovery difficulty, preserving harder-to-recover substructures during the forward process. On ChEBI-20 and M3-20M, BiMol-Diff improves molecule reconstruction with a 15.4\\% relative gain in Exact Match and achieves strong captioning results, attaining best BLEU and BERTScore among compared baselines. These results indicate token-aware noising improves fidelity in molecular structure-language modeling.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Molecule Generation", "Molecule Captioning", "Diffusion Models", "Autoregressive Models"], "openreview_url": "https://openreview.ne
