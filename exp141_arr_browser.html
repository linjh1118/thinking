t/forum?id=cDdVItK7CU", "contribution_types": ["Analysis", "Engineering"]}, {"id": "1pw8v8SfYD", "title": "Reasoning Structure Matters for Safety Alignment of Reasoning Models", "abstract": "Large reasoning models (LRMs) achieve strong performance on complex reasoning tasks but often generate harmful responses to malicious user queries. This paper investigates the underlying cause of these safety risks and shows that the issue lies in the reasoning structure itself. Based on this insight, we claim that effective safety alignment can be achieved by altering the reasoning structure. We propose AltTrain, a simple yet effective post-training method that explicitly alters the reasoning structure of LRMs. AltTrain is both practical and generalizable, requiring no complex reinforcement learning (RL) training or reward design—only supervised fine-tuning (SFT) with a lightweight 1K training examples. Experiments across LRM backbones and model sizes demon strate strong safety alignment, along with robust generalization across reasoning, QA, summarization, and multilingual setting.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large reasoning models", "safety alignment"], "openreview_url": "https://openreview.net/forum?id=1pw8v8SfYD", "contribution_types": ["Engineering", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "d8WDMqDdky", "title": "MorphBPE: Morphology-Aware Tokenization for Efficient LLM Training", "abstract": "Tokenization fundamentally shapes NLP performance, affecting both efficiency and linguistic fidelity. While Byte Pair Encoding (BPE) underpins most Large Language Models (LLMs), its frequency-driven merges often disregard morpheme boundaries, yielding inconsistent and semantically opaque segmentations in morphologically rich languages. We introduce MorphBPE, a simple extension of BPE that constrains merge operations during tokenizer training to respect morpheme boundaries, while leaving inference unchanged and fully compatible with existing LLM pipelines. We evaluate tokenization quality using two intrinsic metrics, Morphological Consistency F1, which measures whether shared morphemes are assigned consistent token representations, and Morphological Edit Distance, which quantifies alignment with morpheme boundaries. We then train 300M and 1B parameter decoder-only LMs from scratch across four typologically diverse languages, English, Russian, Hungarian, and Arabic, under identical vocabulary sizes and training settings. Across all languages, MorphBPE consistently improves intrinsic morphological coherence and reduces language model cross-entropy, moreover, token length statistics indicate that these gains are not attributable to materially shorter tokens. Finally, on the Belebele multilingual reading comprehension benchmark, MorphBPE yields significant improvements in morphologically rich languages such as Russian and Arabic.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Tokenization", "Morphology", "Subword Segmentation", "Large Language Models", "Multilingual NLP"], "openreview_url": "https://openreview.net/forum?id=d8WDMqDdky", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency", "Dataset", "Position"]}, {"id": "bwd1ykqifH", "title": "Verified Critical Step Optimization for LLM Agents", "abstract": "As large language model agents tackle increasingly complex long-horizon tasks, effective post-training becomes critical. Prior work faces fundamental challenges: outcome-only rewards fail to precisely attribute credit to intermediate steps, estimated step-level rewards introduce systematic noise, and Monte Carlo sampling approaches for step reward estimation incur prohibitive computational cost. Inspired by findings that only a small fraction of high-entropy tokens drive effective RL for reasoning, we propose Critical Step Optimization (CSO), which focuses preference learning on verified critical steps—decision points where alternate actions demonstrably flip task outcomes from failure to success. Crucially, our method starts from failed policy trajectories rather than expert demonstrations, directly targeting the policy model’s weaknesses. We use a process reward model (PRM) to identify candidate critical steps, leverage expert models to propose high-quality alternatives, then continue execution from these alternatives using the policy model itself until task completion. Only alternatives that the policy successfully executes to correct outcomes are verified and used as DPO training data, ensuring both quality and policy reachability. This yields fine-grained, verifiable supervision at critical decisions while avoiding trajectory-level coarseness and step-level noise. Experiments on GAIA-Text-103 and XBench-DeepSearch show that CSO achieves 37% and 26% relative improvement over the SFT baseline and substantially outperforms other post-training methods, while requiring supervision at only 16% of trajectory steps. This demonstrates the effectiveness of selective verification-based learning for agent post-training.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Agents", "LLM", "Post-training"], "openreview_url": "https://openreview.net/forum?id=bwd1ykqifH", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "j74O4FVFSl", "title": "Rushes: A Human Preference Dataset for Pluralistic Alignment", "abstract": "We introduce $\\textbf{Rushes}$, a dataset and benchmark for studying revealed human engagement preferences in interactive narrative environments. Rushes is collected through a game interface where users interact with AI-generated branching narratives and select one choice from a small, explicit candidate set at each decision point. Each interaction logs the full candidate set, the user's choice, and the evolving narrative context, yielding time-ordered trajectories with persistent user-level identifiers.\n    Rushes contains 44,226 decision events from 8,167 unique users across six games, capturing sequential, personalized engagement behavior rather than static judgments. We show that user choices exhibit structured, non-random patterns, quantified by a low choice entropy relative to a uniform baseline. \n    We position Rushes as a diagnostic benchmark for pluralistic alignment and demonstrate a robust $\\textit{Engagement Gap}$: state-of-the-art LLMs, including GPT-5, fail to outperform simple baselines. While classical Matrix Factorization (SVD) captures measurable personalized signal (37.7%), frontier LLMs (34.23%) struggle to even match the Popularity Baseline (36.4\\%) on event-level choice prediction. \n    This gap suggests that single, population-level objectives, like those used in modern RLHF, appear insufficient to capture heterogeneous, context-dependent engagement signals. As a result, even highly capable models default to majority preferences rather than adapting to individual trajectories.\n    We release Rushes to support research into pluralistic alignment and sequential decision-making in generative systems.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["corpus creation", "benchmarking", "NLP datasets", "evaluation methodologies", "human-AI interaction", "human-centered evaluation"], "openreview_url": "https://openreview.net/forum?id=j74O4FVFSl", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "3DKDjS7nnp", "title": "LEAP: Logical Embodied Action Planning for Long-Horizon Robotic Tasks via Generative Vision-Language Alignment", "abstract": "Vision-Language-Action models (VLAs) have emerged as a promising paradigm for generalizable sensorimotor control by leveraging pretrained vision-language models. However, despite their efficacy in learning direct input-output mappings, current VLAs struggle with long-horizon tasks that demand an understanding of physical constraints and logical reasoning. In this paper, we introduce \\textsc{Leap} (Logical Embodied Action Planning), a framework that empowers a compact 2B VLM to master complex, multi-step planning tasks via Full Parameter Supervised Fine-Tuning. \\textsc{Leap} learns to generate coherent action blueprints directly from single observations, effectively bridging the gap between high-level reasoning and low-level execution. Experimental results on VLABench demonstrate that \\textsc{Leap} achieves superior performance, particularly in the Physics Law dimension, where it outperforms significantly larger baselines (e.g., 3B and 8B models). Specifically, \\textsc{Leap} achieves a score of 30.3 on the Physics Law dimension, surpassing Qwen2.5-VL (17.4) by a substantial margin.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["embodied AI", "vision-language-action models", "long-horizon planning", "implicit reasoning", "robotic manipulation", "full-parameter fine-tuning"], "openreview_url": "https://openreview.net/forum?id=3DKDjS7nnp", "contribution_types": ["Analysis", "Engineering"]}, {"id": "ozGWtpxMlU", "title": "ATLAS: Adaptive Test-Time Latent Steering with External Verifiers for Enhancing LLMs’ Reasoning", "abstract": "Recent work on activation and latent steering has demonstrated that modifying internal representations can effectively guide large language models (LLMs) toward improved reasoning and efficiency without additional training. However, most existing approaches rely on fixed steering policies and static intervention strengths, which limit their robustness across problem instances and often result in over- or under-steering. We propose Adaptive Test-time Latent Steering, called ATLAS, a task-specific framework that dynamically controls steering decisions at inference time using an external, lightweight latent verifier. Given intermediate hidden states, the verifier predicts the quality of ongoing reasoning and adaptively selects whether and how strongly to apply steering, enabling per-example and per-step adjustment with minimal overhead. To our knowledge, ATLAS is the first method to integrate learned latent verification into test-time steering for enhancing LLMs' reasoning. Experiments on multiple mathematical reasoning benchmarks show that ATLAS consistently outperforms both vanilla decoding and fixed steering baselines, achieving higher accuracy while substantially reducing test-time token usage. These results demonstrate that verifier-guided latent adaptation provides an effective and scalable mechanism for controlling reasoning efficiency without sacrificing solution quality. All source code will be publicly available.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLMs", "latent reasoning", "model steering"], "openreview_url": "https://openreview.net/forum?id=ozGWtpxMlU", "contribution_types": ["Analysis", "Reproduction"]}, {"id": "ty6y1WiVzk", "title": "ProMCP: Profiling Token Flows and Latency Costs in Model Context Protocol–Based LLM Agents", "abstract": "The Model Context Protocol (MCP) aims to standardize the integration of Large Language Models (LLMs) with external tools, yet existing research primarily evaluates functional capabilities while treating the underlying protocol as an opaque black box. This oversight obscures critical inefficiencies in token flows and latency distributed across MCP’s decoupled Host-Client-Server architecture. In this paper, we introduce ProMCP, an end-to-end profiling and instrumentation framework that decomposes the MCP workflow into a six-stage communication pipeline, enabling granular attribution of computational costs. We evaluate widely varying deployment topologies—from air-gapped local models to commercial off-the-shelf (OTS) clients—across 20 servers and 169 tools from MCP-Bench and MCP-Universe. Our analysis reveals a distinct inversion in performance bottlenecks: topologies with customized clients devote 56–72\\% of total tokens and 60–67\\% of latency to planning and schema injection, whereas OTS clients concentrate over 85\\% of latency in final answer synthesis. Crucially, actual tool execution constitutes a negligible fraction of the total cost across all configurations. These findings establish a quantitative baseline for protocol overhead and demonstrate that future optimization must target schema orchestration and transport efficiency rather than tool execution speed.\nThe code is available at: https://anonymous.4open.science/r/mcp-F16B.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/mcp-F16B.0341Introduction035LargeLanguageModels", "https://anonymous.4open.science/r/mcp-F16B"], "keywords": ["Model Context Protocol (MCP)", "LLM", "Tool Discovery", "Token Usage Analysis", "Latency Measurement"], "openreview_url": "https://openreview.net/forum?id=ty6y1WiVzk", "contribution_types": ["Analysis"]}, {"id": "9M1aeUuqTx", "title": "MuseAgent: Grounded Multimodal Understanding of Music Scores and Performance Audio", "abstract": "Despite recent advances in multimodal large language models (MLLMs), their ability to understand and interact with music remains limited. Music understanding requires grounded reasoning over symbolic scores and expressive performance audio, which general-purpose MLLMs often fail to handle due to insufficient perceptual grounding.\nWe introduce MuseAgent, a music-centric multimodal agent that augments language models with structured symbolic representations derived from sheet music images and performance audio. By integrating optical music recognition and automatic music transcription modules, MuseAgent enables multi-step reasoning and interaction over fine-grained musical content.\nTo systematically evaluate music understanding capabilities, we further propose MuseBench, a benchmark covering music theory reasoning, score interpretation, and performance-level analysis across text, image, and audio modalities. Experiments show that existing MLLMs perform poorly on these tasks, while MuseAgent achieves substantial improvements, highlighting the importance of structured multimodal grounding for interactive music understanding.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Language Models", "Music Understanding", "Grounded Reasoning", "Multimodal Agents", "Symbolic Music", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=9M1aeUuqTx", "contribution_types": ["Engineering", "Dataset"]}, {"id": "bCBS0MhUow", "title": "What Makes Reasoning Invalid: Echo Reflection Mitigation for Large Language Models", "abstract": "Large Language Models (LLMs) excel in various reasoning tasks, including complex mathematical reasoning. However, when applied to domain-specific tasks, they consistently fail to generate novel insights during the reflection stage. Instead of conducting genuine cognitive refinement, the model tends to  mechanically reiterate earlier reasoning steps without introducing new information or perspectives, a phenomenon referred to as “Echo Reflection”. We attribute this behavior to two key defects: (1) Uncontrollable information flow during response generation, which allows premature intermediate thoughts to propagate unchecked and distort final decisions; (2) An imbalance between exploration and exploitation of domain-relevant internal knowledge, leading to repeating earlier findings rather than generating new cognitive insights. Building on these findings, we proposed a novel reinforcement learning method termed Adaptive Entropy Policy Optimization (AEPO). Specifically, the AEPO framework consists of two major components: \n(1) Reflection-aware Information Filtration, which quantifies the cognitive information flow and prevents the final answer from being affected by earlier bad cognitive information; (2) Adaptive-Entropy Optimization, which dynamically balances exploration and exploitation across different reasoning stages, promoting both reflective diversity and answer correctness. Extensive experiments demonstrate that AEPO consistently achieves state-of-the-art performance over mainstream reinforcement learning baselines across diverse benchmarks.\nOur code is available at https://anonymous.4open.science/r/AEPO-7F3A.", "area": "ML for NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AEPO-7F3A", "https://anonymous.4open.science/r/AEPO-7F3A.0381Introduction039LargeLanguageModels"], "keywords": ["Large language model", "Reinforcement learning", "Echo reflection"], "openreview_url": "https://openreview.net/forum?id=bCBS0MhUow", "contribution_types": []}, {"id": "0xmRv2TAVc", "title": "ToolRM: Towards Agentic Tool-Use Reward Modeling", "abstract": "Reward models (RMs) play a critical role in aligning large language models (LLMs) with human preferences. Yet in the domain of tool learning, the lack of RMs specifically designed for function-calling tasks has limited progress toward more capable agentic AI. We introduce ToolRM, a family of lightweight reward models tailored for general tool-use scenarios. To build these models, we propose a novel pipeline that constructs high-quality pairwise preference data using rule-based scoring and multidimensional sampling. This yields *ToolPref-Pairwise-30K*, a diverse, balanced, and challenging preference dataset that supports both generative and discriminative reward modeling. We also introduce TRBench$_{BFCL}$, a benchmark built on the agent evaluation suite BFCL to evaluate RMs on tool calling tasks. Trained on our constructed data, models from the Qwen3-4B/8B series achieve up to 17.94% higher accuracy, substantially outperforming frontier LLMs and RMs in pairwise reward judgments. Beyond training objectives, generative ToolRM generalizes to broader critique tasks, including Best-of-N sampling and self-correction. Experiments on ACEBench highlight its effectiveness and efficiency, enabling inference-time scaling while reducing output token usage by over 66%. Its support for downstream RL training further validates its practical utility. We release data to facilitate future research.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM agent", "tool use", "reward modeling"], "openreview_url": "https://openreview.net/forum?id=0xmRv2TAVc", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "WciAFsTNbj", "title": "Code Reffix: A Benchmark for Reflection-Guided Code Repair with Large Language Models", "abstract": "While recent studies have increasingly emphasized the role of reflection in code repair tasks, existing benchmarks still target the repair generation capability of LLMs, lacking fine-grained evaluation of reflection generation capability. To this end, we propose Code Reffix, a benchmark featuring an automated pipeline with oracle reflections and a dual-task protocol to decouple the evaluation of reflection from repair. Through extensive experiments on 14 LLMs and fine-tuning analysis, we aim to pinpoint performance bottlenecks of code repair, quantify reflection quality, and verify the value of reflection optimization. Evaluations reveal that underperformed reflection capabilities remain a major bottleneck for code repair. By quantifying this gap, Code Reffix provides a critical foundation for optimizing LLMs to achieve superior repair performance.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Code Repair", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=WciAFsTNbj", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "A6FqKl3nmV", "title": "A Large-Scale Parallel Corpus and Multilingual Pretrained Language Model for Machine Translation and Semantic Retrieval for Pāli, Sanskrit, Buddhist Chinese, and Tibetan", "abstract": "Ancient Buddhist literature features frequent, yet often unannotated, textual parallels spread across diverse languages: Sanskrit, Pāli, Buddhist Chinese, Tibetan, and more. The scale of this material makes manual examination prohibitive. We present the X (name changed for anonymity purposes) framework, which consists of a novel pipeline for multilingual parallel passage mining, X-parallel, a large-scale corpus of 1.74 million parallel sentence pairs between Sanskrit, Chinese, and Tibetan, and the development of the domain-specific pretrained language model Gemma 2 X. We present Gemma 2 X-MT, a version of this base model fine-tuned on machine translation tasks, reaching state-of-the-art performance for machine translation of these languages into English and outperforming even much larger open-source models. We also present Gemma 2 X-E, a semantic embedding model that shows state-of-the-art performance on a novel, detailed semantic embedding benchmark. We make the parallel dataset, model weights, and semantic similarity benchmark openly available to aid both NLP research and philological studies in Buddhist and classical Asian literature.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information retrieval", "Sanskrit", "Tibetan", "Pāli", "Chinese", "machine translation"], "openreview_url": "https://openreview.net/forum?id=A6FqKl3nmV", "contribution_types": ["Engineering", "Low-resource", "Dataset"]}, {"id": "CUsrZXhor3", "title": "Mitigating Strategy Preference Bias with Boundary-Aware Reward for Emotional Support Conversation", "abstract": "Emotional support conversation (ESC) aims to alleviate distress through empathetic dialogue, yet large language models (LLMs) face challenges in delivering effective ESC due to low accuracy in strategy planning. Moreover, there is a considerable preference bias towards specific strategies. Prior methods using fine-tuned strategy planners have shown potential in reducing such bias, while the underlying causes of the preference bias have not well been studied. In this work, we present an empirical analysis showing that strategy preference bias correlates with regions of low model confidence in strategy prediction. Based on this observation, we propose a boundary-aware reward to mitigate the bias by reinforcement learning, which optimizes strategy planning via both accuracy and entropy-based confidence for each region according to the estimated uncertainty. Experiments on the ESConv and ExTES datasets across multiple LLM backbones show that our approach consistently improves strategy selection accuracy while significantly reducing preference bias, without requiring external preference data or auxiliary modules.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Emotional support conversation", "large language models", "strategy preference bias", "knowledge boundaries", "reinforcement learning"], "openreview_url": "https://openreview.net/forum?id=CUsrZXhor3", "contribution_types": ["Analysis", "Data Analysis"]}, {"id": "niRfwWZY22", "title": "Tourism Mining: Aligning Sentiment & Topic Representations of Sentence Transformer Embeddings for Tourism Opinion Mining", "abstract": "We introduce **TourCSE**, a Sentence Transformer tailored for tourism opinion mining, leveraging training data from topic modeling with negative filtering using GISTEmbed. TourCSE enables identification of key aspects in large-scale exploratory analyses.\n\nBeyond improved results, we investigate the sources of these improvements through ablation studies, including Low-Rank Adaptation, dropout augmentation, sentiment sampling, and negative filtering. Our experiments demonstrate the necessity of negative filtering, in combination with either topic modeling or sentiment sampling, to substantially improve topic–sentiment alignment. We also compare TourCSE with other available models in terms of both visualization and retrieval performance, confirming the value of domain-specific models. Finally, we advocate reconsidering the neutral sentiment in current benchmarks.", "area": "Social NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/TourCSE-8372"], "keywords": ["social media", "opinion mining", "contrastive learning", "dense retrieval", "stance detection", "sentiment analysis"], "openreview_url": "https://openreview.net/forum?id=niRfwWZY22", "contribution_types": ["Analysis", "Engineering"]}, {"id": "HxPfWBt4b4", "title": "BAPO: Boundary-Aware Policy Optimization for Reliable Agentic Search", "abstract": "RL-based agentic search enables LLMs to solve complex questions via dynamic planning and external search. While this approach significantly enhances accuracy with agent policies optimized via large-scale reinforcement learning, we identify a critical gap in reliability: these agents fail to recognize their reasoning boundaries and rarely admit ``\\textit{I DON'T KNOW}'' (\\textit{IDK}) even when evidence is insufficient or reasoning reaches its limit. The lack of reliability often leads to plausible but unreliable answers, introducing significant risks in many real-world scenarios. To this end, we propose \\underline{\\textbf{B}}oundary-\\underline{\\textbf{A}}ware \\underline{\\textbf{P}}olicy \\underline{\\textbf{O}}ptimization \\textbf{(BAPO)}, a novel RL framework designed to cultivate reliable boundary awareness without compromising accuracy. BAPO introduces two key components: (i) a group-based boundary-aware reward that encourages an \\textit{IDK} response only when the reasoning reaches its limit, and (ii) an adaptive reward modulator that strategically suspends this reward during early exploration, preventing the model from exploiting \\textit{IDK} as a shortcut. Extensive experiments on four benchmarks demonstrate that BAPO substantially enhances the overall reliability of agentic search. Code and data will be released upon acceptance.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["agentic search", "boundary awareness", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=HxPfWBt4b4", "contribution_types": ["Engineering"]}, {"id": "BArka7ZyhU", "title": "SPARC-RAG: Adaptive Sequential–Parallel Scaling with Context Management for Retrieval-Augmented Generation", "abstract": "Retrieval-Augmented Generation (RAG) grounds large language model outputs in external evidence, but remains challenged on multi-hop question answering that requires long reasoning. Recent works scale RAG at inference time along two complementary dimensions: sequential depth for iterative refinement and parallel width for coverage expansion. However, naive scaling causes context contamination and scaling inefficiency, leading to diminishing or negative returns despite increased computation. To address these limitations, we propose SPARC-RAG, a multi-agent framework that coordinates sequential and parallel inference-time scaling under a unified context management mechanism. SPARC-RAG employs specialized agents that maintain a shared global context and provide explicit control over the scaling process. It generates targeted, complementary sub-queries for each branch to enable diverse parallel exploration, and explicitly regulates exiting decisions based on answer correctness and evidence grounding. To optimize scaling behavior, we further introduce a lightweight fine-tuning method with process-level verifiable preferences, which improves the efficiency of sequential scaling and effectiveness of parallel scaling. Across single- and multi-hop QA benchmarks, SPARC-RAG consistently outperforms previous RAG baselines, yielding an average +6.2 F1 improvement under lower inference cost.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Retrieval-Augmented Generation", "Question Answering", "Inference-time Scaling", "Multi-agent Systems", "Context Management"], "openreview_url": "https://openreview.net/forum?id=BArka7ZyhU", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "oKwJXGkfeB", "title": "SocraticEval: A Benchmark for Evaluating the Socratic Questioning Ability of LLMs in Dialogue Interaction", "abstract": "Socratic questioning is vital for fostering critical reasoning in domains like education. However, current methodologies lack effective frameworks to assess this capability in Large Language Models (LLMs). To bridge this gap, we propose \\textsc{SocraticEval}, a benchmark that systematically decomposes this capability into \\textit{Question Generation} and \\textit{Strategy Utilization}. Leveraging our multi-domain dataset, \\textsc{SocraticEnv}, we reveal a critical gap between theory and practice: state-of-the-art models exhibit limited strategic diversity, frequently devolving into mere rebuttal rather than constructive guidance, which undermines the method's intended value. Additionally, they show a pronounced deficiency in interrogating logical fallacies. To address this issue, we construct \\textsc{SocraticPref}, a human preference dataset with ranked candidate questions, and apply Direct Preference Optimization (DPO), resulting in consistent improvements in fallacy-focused questioning.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SocraticEval", "https://anonymous.4open.science/r"], "keywords": ["Socratic Questioning", "Large Language Models (LLMs) Evaluation", "Benchmark Construction"], "openreview_url": "https://openreview.net/forum?id=oKwJXGkfeB", "contribution_types": ["Engineering", "Dataset", "Data Analysis", "Position"]}, {"id": "8oLZYkKJvh", "title": "MA$^{2}$P: A Meta-Cognitive Autonomous Intelligent Agents Framework for Complex Persuasion", "abstract": "Persuasive dialogue generation plays a vital role in decision-making, negotiation, counseling, and behavior change, yet it remains a challenging problem.\nIn complex persuasion where the persuadee's internal states are not expressed clearly, the persuader must interpret responses, infer the persuadee's latent mental states (e.g., beliefs and desires), and translate them into targeted, strategy-consistent actions; however, current approaches often produce generic or weakly grounded responses even when such cues are identified.\nMoreover, although large language models (LLMs) can generate persuasive content, their performance varies substantially across domains due to uneven knowledge coverage and limited reasoning generalization.\nTo address these challenges, we propose MA\\textsuperscript{2}P, a meta-cognitive autonomous intelligent agent framework for complex persuasion. Specifically, we develop an autonomous multi-agent architecture that coordinates perception management, mental-state inference, strategy execution, memory maintenance, and performance evaluation.\nTo mitigate cross-domain performance variation, we further design a meta-cognitive configurator that selects an appropriate meta-strategy from a structured knowledge base at the outset, thereby guiding subsequent reasoning and planning.\nExperimental results show that our approach achieves a higher persuasion success rate than baselines.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Persuasive dialogue", "Persuasion", "Meta-cognition", "Autonomous agents", "Multi-agent systems", "Theory of mind"], "openreview_url": "https://openreview.net/forum?id=8oLZYkKJvh", "contribution_types": ["Engineering"]}, {"id": "0gGODKJ4z9", "title": "Diagnosing CFG Interpretation in LLMs", "abstract": "As LLMs are increasingly integrated into agentic systems, they must adhere to dynamically defined, machine-interpretable interfaces. We evaluate LLMs as in-context interpreters: *given a novel context-free grammar, can LLMs generate syntactically valid, behaviorally functional, and semantically faithful outputs?* We introduce RoboGrid, a framework that disentangles **syntax**, **behavior**, and **semantics** through controlled stress-tests of recursion depth, expression complexity, and surface styles. Our experiments reveal a consistent hierarchical degradation: LLMs often maintain surface syntax but fail to preserve structural semantics. Despite the partial mitigation provided by CoT reasoning, performance collapses under structural density, specifically deep recursion and high branching, with semantic alignment vanishing at extreme depths. Furthermore, `Alien` lexicons reveal that LLMs rely on semantic bootstrapping from keywords rather than pure symbolic induction. These findings pinpoint critical gaps in hierarchical state-tracking required for reliable, grammar-agnostic agents.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models Evaluation", "Formal Languages", "In-context Learning", "Symbolic Reasoning", "Systematic Generalization"], "openreview_url": "https://openreview.net/forum?id=0gGODKJ4z9", "contribution_types": ["Analysis", "Engineering"]}, {"id": "PkYpQohQH9", "title": "See both ways: A bidirectional evaluation of Multimodal Language Models and Human Spontaneous Speech for Image Captioning", "abstract": "Multimodal large language models (MLLMs) have achieved notable success in image captioning, yet systematic comparisons with human-generated references remain underexplored. In this work, we present a novel  study on  understanding the alignment between captions generated by multimodal models and  spontaneous human speech captions. To this end, we introduce a human–machine  bidirectional evaluation framework, which does not assume a \"ground-truth\". This evaluation is performed by comparing human audio-based captions of images with model generated captions from various MLLMs.Our detailed analysis reveals that, (i) humans are  more selective than models in image captioning rather than providing a comprehensive summary, (ii) scores with human reference and model targets are significantly higher than those computed with model reference and human targets, and (iii) images from specific categories like \"nature\" and \"educational\" evoke more human imagination during the description task, compared to other categories. Together, these findings reveal a clear divergence in human vs. model captioning that can pave the way for human-aligned MLLM designs.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal large language models", "Image captioning", "Human–AI comparison and interaction", "Model Evaluation"], "openreview_url": "https://openreview.net/forum?id=PkYpQohQH9", "contribution_types": ["Analysis", "Data Analysis"]}, {"id": "CiSvOu6fQ4", "title": "WirelessMathLM: Teaching Mathematical Reasoning for LLMs in Wireless Communications with Reinforcement Learning", "abstract": "Large Language Models (LLMs) struggle with specialized mathematical reasoning in domains governed by strict physical constraints, such as wireless communications. Progress is currently stifled by a lack of training-scale resources; existing datasets are either purely evaluative or insufficient in volume for robust adaptation. To bridge this gap, we present WirelessMathBench-XL, the first training-scale benchmark for wireless mathematics, comprising 4,027 problems derived from 970 state-of-the-art papers. We employ a rigorous construction pipeline combining automated extraction with human expert verification to ensure robust generalization assessment. The dataset features a hierarchical taxonomy consisting of multiple-choice, progressive fill-in-the-blank, and full equation completion tasks, explicitly designed to test comprehension depth. To validate the corpus, we train baseline models (WirelessMathLM) using reinforcement learning with verification rewards. Our 7B model achieves 39.5\\% accuracy, rivaling GPT-4o (40.4\\%) and demonstrating that the dataset provides sufficient signal for small models to master complex domain logic. Further analysis reveals that training on this specialized corpus improves performance on general mathematical benchmarks without catastrophic forgetting, while also showing consistent improvements across broad knowledge, science, and coding tasks.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["large language models", "mathematical reasoning", "wireless communications", "reinforcement learning", "benchmark datasets"], "openreview_url": "https://openreview.net/forum?id=CiSvOu6fQ4", "contribution_types": ["Engineering", "Dataset"]}, {"id": "dapG1wYvUL", "title": "Towards Proactive Personalization of LLMs through Profile Customization for Individual Users in Dialogues", "abstract": "The deployment of Large Language Models (LLMs) in interactive systems necessitates a deep alignment with the nuanced and dynamic preferences of individual users. Current alignment techniques predominantly address universal human values or static, single-turn preferences, thereby failing to address the critical needs of long-term personalization and the initial user cold-start problem. To bridge this gap, we propose PersonalAgent, a novel user-centric lifelong agent designed to continuously infer and adapt to user preferences. PersonalAgent constructs and dynamically refines a unified user profile by decomposing dialogues into single-turn interactions, framing preference inference as a sequential decision-making task. Experiments show that PersonalAgent achieves superior performance over strong prompt-based and policy optimization baselines, not only in idealized but also in noisy conversational contexts, while preserving cross-session preference consistency. Furthermore, human evaluation confirms that PersonalAgent excels at capturing user preferences naturally and coherently. Our findings underscore the importance of lifelong personalization for developing more inclusive and adaptive conversational agents. Our code and ALOE-Unseen dataset will be released.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Personalization", "Personalized Alignment"], "openreview_url": "https://openreview.net/forum?id=dapG1wYvUL", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "2Pxhhg9ULf", "title": "Beyond Polarity: Continuous Affect-Enhanced Multimodal Aspect-Based Sentiment Classification", "abstract": "Multimodal aspect-based sentiment classification (MABSC) requires aspect-level sentiment inference from textual-image data that jointly convey opinions. Yet most existing approaches primarily exploit discrete polarity patterns and generic visual embeddings, making them less effective when the affect is subtle, implicit, or expressed through imagery. In this work, we propose $\\textbf{\\textit{VADE}}$, a Valence–Arousal–Dominance $\\textbf{\\textit{VAD}}-\\textbf{\\textit{E}}$nhanced MABSC framework that brings continuous VAD signals into multimodal sentiment reasoning and learns emotion-sensitive image representations. Specifically, we design a VAD encoder to extract continuous affect cues from text for aspect-level sentiment reasoning. Furthermore, we fine-tune a CLIP-based image encoder on affect-enriched image–text pairs to obtain visual representations that are more sensitive to sentiment cues. To support this process, we construct an affect-enriched image–text dataset $\\textbf{\\textit{Senti-COCO}}$ by rewriting MSCOCO captions with a multimodal large language model, which yields large-scale image-text pairs with richer affective expressions. Experiments on two mainstream datasets, Twitter-15 and Twitter-17, show that $\\textbf{\\textit{VADE}}$ achieves  a new state-of-the-art performance, demonstrating the effectiveness of incorporating VAD signals for MABSC.", "area": "Sentiment/Argument", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Aspect-based Sentiment Classification", "Valence–Arousal–Dominance", "Aspect-level Sentiment Reasoning"], "openreview_url": "https://openreview.net/forum?id=2Pxhhg9ULf", "contribution_types": ["Dataset"]}, {"id": "LSOrhkL2YB", "title": "PedGraph: Resolving Pragmatic Ambiguity in Instructional Videos through Function-Aware Event Detection", "abstract": "Understanding classroom instruction requires not only localizing what happens in a video, but also inferring \\emph{why} it happens: visually similar behaviors (e.g., pointing) can serve different pedagogical functions under different discourse phases, creating profound pragmatic ambiguity. Yet existing video and vision-language models excel mainly at appearance-driven recognition and often lack an explicit representation of the relational logic that governs instructional interaction. To address this gap, we introduce \\textbf{PedGraph}, a knowledge-guided framework that integrates a data-driven and expert-validated \\textbf{S}tructured \\textbf{T}eaching \\textbf{I}nteraction \\textbf{G}raph (\\textbf{STIG}) to represent hierarchical, multi-relational pedagogical context; PedGraph injects STIG topology into representation learning via a structure-aware contrastive objective and performs global inference with a hierarchical relation-aware graph network to disambiguate event functions. We evaluate on \\textbf{PEA}, a densely annotated instructional video benchmark (15.2 hours, 113 lessons, 32 event classes), where PedGraph outperforms strong baselines by 3.4 mAP@0.5 on function-aware event detection. Code, models, and the dataset will be released at \\url{https://anonymous.4open.science/r/event-3A66/}.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/event-3A66"], "keywords": ["vision language navigation", "event extraction", "cross-modal information extraction", "multimodality", "educational applications", "knowledge graphs"], "openreview_url": "https://openreview.net/forum?id=LSOrhkL2YB", "contribution_types": ["Engineering", "Dataset"]}, {"id": "UaLNRHgGfW", "title": "Language Models Might Not Understand You: Evaluating Theory of Mind via Story Prompting", "abstract": "We introduce StorySim, a programmable framework for synthetically generating stories to evaluate the theory of mind (ToM) and world modeling (WM) capabilities of large language models (LLMs). Unlike prior benchmarks that may suffer from contamination in pretraining data, or rely on an LLM for generation, StorySim produces novel, compositional story prompts anchored by a highly controllable Storyboard, enabling precise manipulation of character perspectives and events. We use this framework to design first- and second-order ToM tasks alongside WM tasks that control for the ability to track and model mental states. Our experiments across a suite of state-of-the-art LLMs reveal that most models perform better on WM tasks than ToM tasks, and that models tend to perform better reasoning with humans compared to inanimate objects. Additionally, our framework enabled us to find evidence of heuristic behavior such as recency bias and an over-reliance on earlier events in the story. All code for generating data and evaluations is freely available.", "area": "Question Answering", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/StorySim-3A48", "https://anonymous.4open.science/r/StorySim-"], "keywords": ["Dialogue and Interactive Systems", "Information Extraction", "Question Answering"], "openreview_url": "https://openreview.net/forum?id=UaLNRHgGfW", "contribution_types": ["Analysis", "Data Analysis"]}, {"id": "aNcwP0Cd8h", "title": "AU-Harness: An Open-Source Toolkit for Efficient and Unified Evaluation of AudioLLMs", "abstract": "Large Audio Language Models (LALMs) are rapidly advancing, but evaluating them remains challenging due to inefficient toolkits that limit fair comparison and systematic assessment. Existing evaluation frameworks exhibit two critical limitations: (1) slow and inefficient processing pipeline that bottlenecks large-scale studies, (2) the absence of unified and scalable evaluation framework capable of keeping pace with the rapid growth of both LALMs and audio benchmarks. To address these issues, we introduce $\\textbf{AU-Harness}$, an efficient and comprehensive evaluation framework for LALMs. Our system achieves a speedup of up to 151\\% over existing toolkits through optimized batch processing and parallel execution, enabling large-scale evaluations previously impractical. We provide standardized prompting protocols and flexible configurations for fair model comparison across diverse scenarios. Through evaluation across diverse sets of tasks, we reveal significant gaps in current LALMs. Our findings also highlight a lack of standardization in modalities of user-provided instructions existent across audio benchmarks, which can lead to performance differences of up to 7.2 absolute points on challenging complex instruction following downstream tasks. AU-Harness provides both practical evaluation tools and insights into model limitations, advancing systematic LALM development.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AU-Harness-5C15", "https://anonymous.4open.science/r/AU-Harness-5C15Omni"], "keywords": ["large audio language models", "evaluation framework"], "openreview_url": "https://openreview.net/forum?id=aNcwP0Cd8h", "contribution_types": ["Engineering", "Reproduction"]}, {"id": "ZrgfJD1XH5", "title": "VET: Verifiable Execution Tracing for Reliable Text-to-SQL Generation", "abstract": "Large language models (LLMs) have shown remarkable capabilities in text-to-SQL generation, yet existing approaches remain prone to hallucinations and lack verification mechanisms. Current methods such as Chain-of-Thought (CoT) and Program-of-Thought (PoT) typically rely on intermediate reasoning that is either purely textual or executed only as a final step, leaving the reasoning process opaque and prone to grounding and logical hallucinations.  In this paper, we introduce Verifiable Execution Tracing (VET), a novel reasoning paradigm that transforms text-to-SQL from unverifiable textual rationales into step-wise executable semantics. VET addresses these limitations by constraining the reasoning process within a candidate schema space and formulating it as a sequence of executable Python steps. Crucially, each step is executed against the real database to produce observable intermediate results, which serve as immediate verification feedback and transform the traditionally opaque generation process into a transparent, debuggable interaction with database reality.\nExperiments demonstrate superior performance: 70.93\\% execution accuracy on BIRD benchmark, with exceptional gains on complex queries, validating that executable reasoning fundamentally outperforms textual alternatives.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Text-to-SQL", "Verifiable Execution", "Large Language Models", "Program Synthesis", "Reasoning"], "openreview_url": "https://openreview.net/forum?id=ZrgfJD1XH5", "contribution_types": ["Analysis", "Engineering", "Efficiency", "Data Analysis"]}, {"id": "Tpq4Acgbja", "title": "MythNER: Multi-Agent NER Extraction and Benchmarking in Chinese Myth Narratives", "abstract": "Named entity recognition (NER) performs strongly in well‑studied domains, yet mythological narratives pose a long‑tail setting where entityhood is defined by referable instances, mentions vary through titles and aliases, and correct extraction requires stable long‑span boundaries. We introduce MythNER, a culturally grounded coarse‑grained NER benchmark for Chinese mythology built from Ne Zha subtitle text. MythNER uses four flat labels (PER/LOC/ORG/OBJ) with conservative annotation criteria; in particular, OBJ is restricted to named artifacts and fixed technique titles rather than generic concepts. We evaluate a zero‑shot Chinese spaCy model, a supervised BERT token‑classification baseline, and a multi‑agent LLM extraction pipeline with chunk/context tuning on the held‑out Ne_Zha_P2 test set.\nResults show substantial domain shift for off‑the‑shelf NER, strong gains from supervised adaptation, and further improvements from agentic extraction under well‑chosen constraints. Our analysis characterizes dominant failure modes—boundary drift under exact‑span scoring, mythology‑specific type ambiguity, and over‑extraction of generic nouns as OBJ—highlighting the need for iterative consistency checks in narrative‑domain NER.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Named Entity Recognition", "Information Extraction", "Benchmark Dataset", "Chinese", "Mythology", "Multi-Agent Systems"], "openreview_url": "https://openreview.net/forum?id=Tpq4Acgbja", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "VenzPqcwMq", "title": "Business Logic-Driven Text-to-SQL Data Synthesis for Business Intelligence", "abstract": "Evaluating Text-to-SQL agents in private business intelligence (BI) settings is challenging due to the scarcity of realistic, domain-specific data. While synthetic evaluation data offers a scalable solution, existing generation methods fail to capture business realism--whether questions reflect realistic business logic and workflows. We propose a Business Logic–driven Data Synthesis framework that generates data grounded in business personas, work scenarios, and workflows. In addition, we improve the data quality by imposing a business reasoning complexity control strategy that diversifies the analytical reasoning steps required to answer the questions. Experiments on a production-scale Salesforce database show that our synthesized data achieves high business realism (98.44%), substantially outperforming OmniSQL (+19.5%) and SQL-Factory (+54.7%), while maintaining strong question–SQL alignment (98.59%). Our synthetic data also reveals that state-of-the-art Text-to-SQL models still have significant performance gaps, achieving only 42.86% execution accuracy on the most complex business queries.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Text-to-SQL", "Data Synthesis", "Business Intelligence", "Synthetic Benchmarking"], "openreview_url": "https://openreview.net/forum?id=VenzPqcwMq", "contribution_types": ["Dataset"]}, {"id": "EotzHTZWx2", "title": "Unlocking Prompt Infilling Capability for Diffusion Language Models", "abstract": "Masked diffusion language models possess infilling capabilities, yet current supervised fine-tuning practices use response-only masking which prevents models from learning to infill prompt tokens. We first show that publicly available masked diffusion language models exhibit limited infilling capability for prompts. This limitation stems from a training-inference gap where models never encounter prompt masking during supervised fine-tuning stage. To address this, we introduce a two-stage training framework during supervised fine-tuning (SFT): (1) full-sequence masking to enable prompt infilling, followed by (2) response-only masking to preserve downstream task accuracy. This simple approach enables models to infill optimal prompts from few-shot examples at inference time. Evaluating on math, multi-hop reasoning, and LLM-as-a-Judge, we show that our training framework unlocks prompt infilling capabilities. Our results suggest that the training framework is the primary bottleneck for unlocking prompt infilling capability in masked diffusion language models.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["diffusion language model", "masked diffusion language model", "prompt engineering", "prompt infilling"], "openreview_url": "https://openreview.net/forum?id=EotzHTZWx2", "contribution_types": ["Engineering"]}, {"id": "LU3NGUhq7M", "title": "Writing As Reasoning: Interleaving Drafting and Deepening for Open-Ended Deep Research", "abstract": "Generating deep research reports requires large-scale information acquisition and the synthesis of insight-driven analyses, posing a major challenge for current language models. Existing methods largely follow a *plan-then-write* paradigm, whose performance strongly depends on the quality of the initial outline.\nWe propose a **Writing As Reasoning Policy (WARP)** framework, which enables models to dynamically revise outlines during report writing. In this policy, the agent alternates between ***Evidence-Based Drafting*** and ***Reasoning-Driven Deepening*** phases, jointly supporting information acquisition, knowledge refinement, and outline updating.\nWe further introduce a **Multi-Stage Agentic Training**—including cold start, atomic skill RL, and holistic pipeline RL—that enables small models to operate the WARP effectively.\nExperiments on DeepResearch Bench, DeepConsult, and DeepResearch Gym show that our approach allows small models to surpass leading closed-source systems, particularly with substantial improvements in *Insight* metric.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM-based agent", "open-ended deep research", "deep information seeking", "knowledge-intensive long writing"], "openreview_url": "https://openreview.net/forum?id=LU3NGUhq7M", "contribution_types": ["Engineering", "Dataset"]}, {"id": "fSN46E69Vm", "title": "Causal-Constrained GraphRAG: Enhancing Explainability and Reliability in Safety-Critical Parameter Extraction", "abstract": "Causal-Constrained GraphRAG is a neurosymbolic framework designed to improve the explainability and reliability of parameter extraction from long, structured, and causally rich regulatory corpora used in safety-critical engineering domains such as fire safety and evacuation modeling. The framework parses heterogeneous technical manuals into a topologically grounded knowledge graph, extracts explicit cause-effect-action chains through weak supervision combined with an active-learning annotation loop, and injects validated causal structures into a GraphRAG reasoning stage to constrain large language model inference. Instantiation on a curated Evacuation and Fire Safety question--answer dataset (approximately 24k pairs) and a Neo4j-based causal knowledge graph enables evaluation across multi-hop regulatory reasoning, numerical and sign consistency, and end-to-end parameter generation tasks. Experimental results demonstrate substantial improvements in factual retrieval accuracy and causal coherence, including notable F1 gains in occupant-load interpretation and high mean opinion scores from domain experts, alongside improved response stability under repeated technical queries. The framework supports safe and auditable automation of engineering parameter extraction while explicitly preserving human-in-the-loop validation for cases involving ambiguous, incomplete, or conflicting regulatory guidance.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Causal-Constrained GraphRAG", "Causal NLP", "Retrieval-Augmented Generation", "Knowledge Graph Reasoning", "Safety-Critical AI"], "openreview_url": "https://openreview.net/forum?id=fSN46E69Vm", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "iZ2y0sqJJD", "title": "Lychee-FD: Hierarchical Acoustic-Semantic Modeling for Full-Duplex Spoken Language Models", "abstract": "Spoken Language Models (SLMs) have revolutionized voice interaction, yet they remain constrained by rigid half-duplex mechanisms that fail to replicate the fluidity of human conversation. While recent Full-Duplex SLMs attempt to bridge this gap by enabling real-time capabilities such as interruption and backchanneling, these methods suffer from severe modality interference. Specifically, adapting models for native full-duplex interaction often induces significant knowledge degradation, impeding the realization of seamless human-machine interaction.To address this, we conduct an optimization dynamics analysis, identifying the root cause as the inherent gradient conflict between acoustic rendering and semantic modeling within a shared parameter space. Guided by this insight, we introduce **Lychee-FD**, a native end-to-end full-duplex framework designed to mitigate modality interference. We proposed a hierarchical parameter separation strategy that decouples conflicting modalities in deep layers. Moreover, we incorporate a semantic alignment channel that enables the model to preserve coherent internal monologues, ensuring the robustness of semantic modeling during training.Extensive experiments demonstrate that our method achieves state-of-the-art performance across multiple full-duplex benchmarks, specifically delivering an average **7.4\\%** improvement on Spoken QA tasks and **28.5\\%** improvement on FullDuplexBench 1.5. Consequently, our work uncovers the fundamental causes of modality interference within Full-Duplex SLMs and provides an effective approach to reconcile interaction efficiency with robust knowledge retention.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Model", "Multimodal Large Language Model", "Spoken Language Model"], "openreview_url": "https://openreview.net/forum?id=iZ2y0sqJJD", "contribution_types": ["Engineering", "Dataset"]}, {"id": "5tWieEJKFq", "title": "Between a Rock and a Hard Place: The Tension Between Ethical Reasoning and Safety Alignment in LLMs", "abstract": "Large Language Model safety alignment predominantly operates on a binary assumption that requests are either safe or unsafe. This classification proves insufficient when models encounter ethical dilemmas, where the capacity to reason through moral trade-offs creates a distinct attack surface. We formalize this vulnerability through TRIAL, a multi-turn red-teaming methodology that embeds harmful requests within ethical framings. TRIAL achieves consistently high attack success rates across models by exploiting the model's own ethical reasoning to frame harmful actions as morally necessary compromises. Building on these insights, we introduce ERR (Ethical Reasoning Robustness), a defense framework that distinguishes between instrumental responses that enable harmful outcomes and explanatory responses that analyze ethical frameworks without endorsing harmful acts. ERR employs a Layer-Stratified Harm-Gated LoRA architecture, achieving robust defense against reasoning-based attacks while preserving model utility.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Ethics", "Bias", "and Fairness", "Language Modeling", "Interpretability and Analysis of Models for NLP", "Question Answering"], "openreview_url": "https://openreview.net/forum?id=5tWieEJKFq", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "qDK6OXa3uY", "title": "TTL: Language-balanced Data Selection for LLM-based Text-to-Speech via Codec Token Scoring", "abstract": "Recent progress in large language model (LLM)-based text-to-speech (TTS) has enabled increasingly natural and versatile speech generation, including zero-shot voice synthesis and multilingual capability. However, these gains are often accompanied by a growing reliance on large-scale data, making training resource-intensive, costly, and time-consuming. \nIn this paper, we introduce TTL, a novel data selection framework tailored for LLM-based TTS that leverages a probability gap computed on codec tokens. Our selection uses two scoring models of different sizes, each aggregating conditional probabilities of global and semantic tokens given the text. A larger score gap indicates more challenging and informative speech samples, which we prioritize to construct data-efficient training subsets.\nOn top of that, we further show that naïve selection can severely bias the selected subset toward a high-resource language in multilingual settings, and propose a simple language-balanced strategy to mitigate this bias and effectively improve multilingual generalization. Extensive experiments on multiple benchmarks demonstrate consistent improvements in naturalness and intelligibility, with substantial gains in word error rate (WER) and strong multilingual performance under data-constrained settings.\nSource codes are available at \\href{https://github.com/TTL-cell/TTL.git}.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Data Selection", "LLM-based TTS"], "openreview_url": "https://openreview.net/forum?id=qDK6OXa3uY", "contribution_types": ["Engineering", "Efficiency", "Dataset"]}, {"id": "B3ruHnLnEw", "title": "Sign-Language Datasets at Scale: A Comprehensive Survey on Resources, Benchmarks, and Annotation Standards", "abstract": "Sign languages are expressive visual languages used by Deaf and Hard-of-Hearing (DHH) communities. Despite advances in sign-language recognition, translation, and production, progress remains limited by fragmented datasets, inconsistent annotations,\nand narrow linguistic coverage. Existing benchmarks often fail to support real-world communication needs, and systematic analyses of their limitations are rare. In this survey, we present the most comprehensive index of sign-language datasets to date, covering 120 resources across 35 sign languages, and identify key challenges including modality imbalance, annotation granularity, and signer bias. We propose essential requirements for future datasets and introduce a 24-field Sign-Language Datasheet template, along with a public GitHub repo for dataset documentation. Our work provides a unified foundation for developing inclusive and robust sign-language technologies.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Open-Sign-Language-9D59"], "keywords": ["Sign Language", "Multimodal Dataset", "Survey", "Annotation", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=B3ruHnLnEw", "contribution_types": ["Analysis", "Reproduction", "Dataset", "Data Analysis", "Surveys"]}, {"id": "BYiwNYYixO", "title": "AGENTHIVE: A Composable Multi-Agent Framework with First-Class Delegation", "abstract": "Large-language-model (LLM) agents excel at reasoning and tool use, yet existing multi-agent systems (MAS) rely on static, hand-crafted\ntopologies and struggle with open-ended, evolving tasks. We introduce AGENTHIVE, a delegation-centric MAS framework that treats\ndelegation as a first-class primitive: any agent may spawn and coordinate sub-agents, enabling decentralized control without a cen-\ntral orchestrator. Through recursive delegation, AGENTHIVE dynamically forms task-adaptive structures—trees, forests, and star\ntopologies—without predefined agent graphs. We evaluate AGENTHIVE across four real-world domains, showing that MAS emerge au-\ntomatically from task demands. The performance gains arise from an expressive, adaptive MAS that allows agents to explore more\ndeeply and cover a wider solution space. Our results demonstrate that first-class delegation is a powerful paradigm for scaling LLM-based\nautonomous systems. An anonymized version of the source code is available at https://anonymous.4open.science/r/anonymous-B-3F03/.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/anonymous-B-3F03"], "keywords": ["multi-agent systems", "framework", "delegation"], "openreview_url": "https://openreview.net/forum?id=BYiwNYYixO", "contribution_types": []}, {"id": "QWnosu0EP4", "title": "Manifold-based Sampling for In-Context Hallucination Detection in Large Language Models", "abstract": "Large language models (LLMs) frequently generate factually incorrect or unsupported content, commonly referred to as hallucinations. Prior work has explored decoding strategies, retrieval augmentation, and supervised fine-tuning for hallucination detection, while recent studies show that in-context learning (ICL) can substantially influence factual reliability. However, existing ICL demonstration selection methods often rely on surface-level similarity heuristics and exhibit limited robustness across tasks and models.\n\nWe propose MB-ICL, a manifold-based demonstration sampling framework for selecting in-context demonstrations that leverages latent representations extracted from frozen LLMs. By jointly modeling local manifold structure and class-aware prototype geometry, MB-ICL selects demonstrations based on their proximity to learned prototypes rather than lexical or embedding similarity alone.\n\nAcross factual verification (FEVER) and hallucination detection (HaluEval) benchmarks, MB-ICL outperforms standard ICL selection baselines in the majority of evaluated settings, with particularly strong gains on dialogue and summarization tasks. The method remains robust under temperature perturbations and model variation, indicating improved stability compared to heuristic retrieval strategies. While lexical retrieval can remain competitive in certain question-answering regimes, our results demonstrate that manifold-based prototype selection provides a reliable and training light approach for hallucination detection without modifying LLM parameters, offering a principled direction for improved ICL demonstration selection.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Hallucination detection", "In-context learning"], "openreview_url": "https://openreview.net/forum?id=QWnosu0EP4", "contribution_types": ["Low-resource"]}, {"id": "m4WFTb6PiE", "title": "Incentivizing Parametric Knowledge via Reinforcement Learning with Verifiable Rewards for Cross-Cultural Entity Translation", "abstract": "Cross-cultural entity translation remains challenging for large language models (LLMs) as literal or phonetic renderings are usually yielded instead of culturally appropriate translations in context. However, relevant knowledge may already be encoded in model parameters during large-scale pre-training. To incentivize the effective use of parametric knowledge, we propose \\textbf{EA-RLVR} (Entity-Anchored Reinforcement Learning with Verifiable Rewards), a training framework that optimizes cross-cultural entity translation without relying on external knowledge bases. EA-RLVR anchors supervision on a verifiable, entity-level reward signal and incorporates lightweight structural gates to stabilize optimization. This design steers the model toward learning a robust reasoning process rather than merely imitating reference translations.\nWe evaluate EA-RLVR on XC-Translate and observe consistent improvements in both entity translation accuracy and out-of-domain generalization. Specifically, training on merely 7k samples boosts Qwen3-14B’s entity translation accuracy from 23.66\\% to 31.87\\% on a 50k test set comprising \\textbf{entirely unseen entities}.\nThe learned entity translation ability also transfers to general translation, yielding +1.35 XCOMET on WMT24pp, which scales to +1.59 with extended optimization.\nExtensive analyses of $pass@k$ dynamics and reward formulations attribute these gains to superior sampling efficiency and a stable optimization landscape.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine Translation", "Cross-Cultural Translation", "Reinforcement Learning", "RLVR", "Large Language Models", "Entity Translation"], "openreview_url": "https://openreview.net/forum?id=m4WFTb6PiE", "contribution_types": ["Analysis", "Engineering"]}, {"id": "l7kk2DI2i7", "title": "MultiModal Code-Switching: Interleaving Visual Objects into Language for Explicit Object-Level Alignment", "abstract": "Existing Multimodal Large Language Models (MLLMs) predominantly rely on image-text pairs for modality alignment pretraining, mapping global image representations to long textual descriptions. However, this image-level alignment suffers from \\textit{referential ambiguity}: the model must struggle to infer the correspondences between multiple visual objects and textual entities from the global representation, leading to data inefficiency and suboptimal semantic grounding. To address this, we propose MultiModal Code-Switching (MMCS), a novel pretraining paradigm that enables explicit object-level supervision. Inspired by linguistic code-switching, MMCS interleaves vision and language by replacing textual entity embeddings with embeddings of their corresponding visual objects, enforcing local visual–textual grounding during pretraining. We further develop a scalable data synthesis pipeline to generate 773k samples with accurate object–entity correspondences. Experiments across model scales show that MMCS is highly data-efficient: with only 50k samples, it matches or surpasses models trained on 600k image–caption pairs, while consistently improving visual grounding and perception capabilities.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MMCS_anonymous-4C7A"], "keywords": ["multimodal large language models", "modality alignment pretraining", "object-level alignment"], "openreview_url": "https://openreview.net/forum?id=l7kk2DI2i7", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "NExGdrUsWf", "title": "ProMoral-Bench: Evaluating Prompting Strategies for Moral Reasoning and Safety in LLMs", "abstract": "Prompt design significantly impacts the moral competence and safety alignment of large language models (LLMs), yet empirical comparisons remain fragmented across datasets and models.\nWe introduce ProMoral-Bench, a unified benchmark evaluating 11 prompting paradigms across four LLM families. Using ETHICS, Scruples, WildJailbreak, and our new robustness test, ETHICS-Contrast, we measure performance via our proposed Unified Moral Safety Score (UMSS), a metric balancing accuracy and safety. Our results show that compact, exemplar-guided scaffolds outperform complex multi-stage reasoning, providing higher UMSS scores and greater robustness at a lower token cost. While multi-turn reasoning proves fragile under perturbations, few-shot exemplars consistently enhance moral stability and jailbreak resistance. ProMoral-Bench establishes a standardized framework for principled, cost-effective prompt engineering. Code and data are available at https://anonymous.4open.science/r/ProMoral_Bench-FFB4/README.md.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/024ProMoral_Bench-FFB4", "https://anonymous.4open.science/r/ProMoral_Bench-FFB4"], "keywords": ["Large Language Models (LLMs)", "AI Safety", "Moral Reasoning", "Prompt Engineering", "Adversarial Robustness", "Jailbreaking"], "openreview_url": "https://openreview.net/forum?id=NExGdrUsWf", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "PLtVpi2Qya", "title": "Decoupled Reasoning with Implicit Fact Tokens (DRIFT): A Dual-Model Framework for Efficient Long-Context Inference", "abstract": "The integration of extensive, dynamic knowledge into Large Language Models (LLMs) remains a significant challenge due to the inherent entanglement of factual data and reasoning patterns. Existing solutions, ranging from non-parametric Retrieval-Augmented Generation (RAG) to parametric knowledge editing, are often constrained in practice by finite context windows, retriever noise, or the risk of catastrophic forgetting. In this paper, we propose \\textbf{DRIFT}, a novel dual-model architecture designed to explicitly decouple knowledge extraction from the reasoning process. Unlike static prompt compression, DRIFT employs a lightweight knowledge model to dynamically compress document chunks into implicit fact tokens conditioned on the query. These dense representations are projected into the reasoning model's embedding space, replacing raw, redundant text while maintaining inference accuracy. Extensive experiments show that DRIFT significantly improves performance on \\textbf{long-context tasks}, outperforming strong baselines among comparably sized models. Our approach provides a scalable and efficient paradigm for extending the effective context window and reasoning capabilities of LLMs. Our code and data will be made public upon publication.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Long-Context Inference", "Prompt Compression"], "openreview_url": "https://openreview.net/forum?id=PLtVpi2Qya", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "VrxxNl7leX", "title": "REVEALER: Reinforcement-Guided Visual Reasoning for Element-Level Text-Image Alignment Evaluation", "abstract": "Evaluating the alignment between textual prompts and generated images is critical for ensuring the reliability and usability of text-to-image (T2I) models. However, most existing evaluation methods rely on coarse-grained metrics or static Question Answering (QA) pipelines, which lack fine-grained interpretability and struggle to reflect human preferences. To address this, we propose $\\textbf{REVEALER}$, a reinforcement-guided visual reasoning framework for element-level text-to-image alignment evaluation. \nAdopting a structured $''grounding–reasoning–conclusion''$ paradigm, our method enables Multimodal Large Language Models (MLLMs) to explicitly localize semantic elements and derive interpretable alignment judgments. We optimize the model via Group Relative Policy Optimization (GRPO) using a multi-dimensional reward function that targets format compliance, localization precision, and alignment accuracy.\nExtensive experiments confirm that REVEALER achieves state-of-the-art results across four benchmarks. Notably, on EvalMuse-40K, it surpasses the strong proprietary Gemini 3 Pro and Training-based baselines with absolute accuracy gains of $\\textbf{+4.0\\%}$ and $\\textbf{+13.1\\%}$, respectively. \nAblation studies further demonstrate the efficacy of our method, contributing a cumulative $\\textbf{19.4\\%}$ improvement over the base model.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/F698"], "keywords": ["Text-Image Alignment", "Reinforcement Learning", "Visual Reasoning"], "openreview_url": "https://openreview.net/forum?id=VrxxNl7leX", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "GoQiHQDOME", "title": "Steering Large Language Models Toward Clarification through Sparse Autoencoders", "abstract": "Instruction-tuned LLMs often respond to ambiguous instructions by guessing missing\ndetails rather than asking clarifying questions. Clarification-seeking improves reliability by aligning responses with user intent and avoiding under-specified assumptions. This is especially important for embodied AI, where misinterpretations can translate into task failure or safety risks. We propose ClarifySAE, an inference-time method that steers clarification-seeking by intervening on Sparse Autoencoder (SAE) features. ClarifySAE ranks SAE features using ClarifyScore, which measures association with clarification contexts, and filters them with OutputScore to retain features that measurably affect the model’s output distribution. During decoding, we apply additive biases to the selected features, increasing the likelihood of generating a clarifying question without updating model weights. We evaluate our method on two datasets with ambiguous instructions (AmbiK and ClarQ-LLM) and two Gemma instruction-tuned models (2B and 9B) using pretrained 16k-feature SAEs. On AmbiK with Gemma-2-9B-IT, ClarifySAE increases clarification rate from 0.61 to 0.95 and improves task success from 0.06 to 0.21. Our code will be publicly available.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["SAE", "ClarifySAE", "OutputScore", "ReasonScore", "LLM", "clarification"], "openreview_url": "https://openreview.net/forum?id=GoQiHQDOME", "contribution_types": ["Analysis", "Engineering"]}, {"id": "MSfGhUMxa7", "title": "ClaHF: A Human Feedback-inspired Reinforcement Learning Framework for Improving Classification Tasks", "abstract": "Text classification models are typically trained via supervised fine-tuning (SFT). However, SFT essentially performs behavior cloning from instance-wise labels and thus fails to adequately capture relative preference relations among samples, which limits the model’s ability to shape decision boundaries and calibrate predictive confidence. In this paper, we propose ClaHF, a human feedback-inspired reinforcement learning (RL) framework for text classification that integrates preference modeling and RL optimization into the classification pipeline without requiring additional human annotations. Unlike prior work that relies solely on instance-wise supervision, ClaHF constructs multiple candidate predictions together with their relative ranking relations, and jointly models the Top-1 preference and the ordering among non-optimal candidates within a reward model (RM). This design converts conventional label supervision into preference signals that are directly applicable to policy optimization. We conduct systematic evaluations on eight classification tasks spanning three categories of scenarios.\nResults demonstrate that ClaHF consistently improves both classification performance and confidence calibration across diverse language models (LMs). The data and code are available at https://anonymous.4open.science/r/ClaHF.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ClaHF.", "https://anonymous.4open.science/r/ClaHF"], "keywords": ["Text classification", "RLHF", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=MSfGhUMxa7", "contribution_types": ["Analysis", "Engineering"]}, {"id": "WOULvOWCLC", "title": "Teaching Language Models to Check Grounded Claim Factuality with Human Test-Taking Strategies", "abstract": "Grounded claim factuality checking is important for large language model (LLM) applications such as retrieval-augmented generation, as it helps users assess the correctness of generated outputs.\nExisting metrics using entailment classifiers require dataset-specific threshold tuning, while LLM-based approaches often use direct prompting, which underutilises the reasoning capabilities of LLMs.\nWe address this by formulating grounded claim factuality checking as a true/false reading comprehension task and prompting LLMs with explicit test-taking strategies for efficient reasoning.\nOur method reduces token usage by over 80\\% compared to unguided open-ended reasoning, and achieves competitive performance to more expensive alternatives across two factuality benchmarks, setting a new state of the art on one.\nTo further reduce inference cost, we train small language models (SLMs) to replace LLMs in the checking pipeline.\nUsing supervised fine-tuning (SFT) and a self-revision mechanism, the SLMs learn to improve their factuality judgements. \nExperimental results show that the resulting SLMs perform on par with strong baselines,\ncombining low inference costs with generating supporting rationales to support
