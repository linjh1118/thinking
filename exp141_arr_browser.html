 from failures, yielding up to 26% relative improvements in task success across ALFWorld, GAIA, and WebShop. These results establish principled debugging as a pathway to more reliable and adaptive LLM agents.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM", "Agent", "Error Analysis"], "openreview_url": "https://openreview.net/forum?id=XaFh3wa04f", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "pMQ2eMQNHg", "title": "AlphaQuanter: An End-to-End Tool-Augmented Agentic Reinforcement Learning Framework for Stock Trading", "abstract": "While Large Language Model (LLM) agents show promise in automated trading, they still face critical limitations. Prominent multi-agent frameworks often suffer from inefficiency, produce inconsistent signals, and lack the end-to-end optimization required to learn a coherent strategy from market feedback. To address this, we introduce **AlphaQuanter**, a single-agent framework that uses reinforcement learning (RL) to learn a dynamic policy over a transparent, tool-augmented decision workflow, which empowers a single agent to *autonomously orchestrate tools* and *proactively acquire information* on demand, establishing a transparent and auditable reasoning process. Extensive experiments demonstrate that AlphaQuanter achieves state-of-the-art performance on key financial metrics. Besides, human evaluation shows the learned reasoning patterns reveal more faithful and coherent tool-usage behaviors, providing steps toward verifiable LLM-driven trading.", "area": "Finance", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["financial NLP", "AI agents", "reinforcement learning"], "openreview_url": "https://openreview.net/forum?id=pMQ2eMQNHg", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "nD7afph0oT", "title": "A Navigational Approach for Comprehensive RAG via Traversal over Proposition Graphs", "abstract": "Standard RAG pipelines based on chunking excel at simple factual retrieval but fail on complex multi-hop queries due to a lack of structural connectivity. Conversely, initial strategies that interleave retrieval with reasoning often lack global corpus awareness, while Knowledge Graph (KG)-based RAG performs strongly on complex multi-hop tasks but suffers on fact-oriented single-hop queries. To bridge this gap, we propose a novel RAG framework: ToPG (Traversal over Proposition Graphs). ToPG models its knowledge base as a heterogeneous graph of propositions, entities, and passages, effectively combining the granular fact density of propositions with graph connectivity. We leverage this structure using iterative Suggestion-Selection cycles, where the Suggestion phase enables a query-aware traversal of the graph, and the Selection phase provides LLM feedback to prune irrelevant propositions and seed the next iteration. Evaluated on three distinct QA tasks (Simple, Complex, and Abstract QA), ToPG demonstrates strong performance across both accuracy- and quality-based metrics. Overall, ToPG shows that query-aware graph traversal combined with factual granularity is a critical component for efficient structured RAG systems.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Retrieval-Augmented Generation", "Knowledge Representation", "Graph-based Methods"], "openreview_url": "https://openreview.net/forum?id=nD7afph0oT", "contribution_types": ["Engineering"]}, {"id": "d1ld3xqKzG", "title": "AntiHateAgent: A Knowledge-Augmented Evidence-Based Reasoning Agent for Implicit Hate Speech Detection", "abstract": "Hate speech poses a growing challenge to online platforms, particularly as it becomes increasingly implicit and subtle.\nWhile recent advances in machine learning have improved automated detection, they largely rely on static internal knowledge or explicit semantics, leading to a critical knowledge gap and a lack of comprehensive reasoning. \nTo address these limitations, we propose AntiHateAgent, an agent-based framework for hate speech detection that enables structured reasoning, contextual knowledge integration, and transparent decision-making, thereby improving robustness and reliability in real-world content moderation scenarios.\nExperimental results show that AntiHateAgent significantly improves the performance of implicit hate speech detection. On three datasets, it achieves up to a 22.3\\% increase in overall F1 score and up to a 43.6\\% improvement in recall for hate samples. The framework excels particularly in detecting newly emerging implicit hate that relies on cultural context, reaching 89.7\\% recall on the latest 4chan dataset implicit hate subset. Its evidence-driven reasoning process also ensures explainability and transparency in decision-making.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Hate Speech Detection", "Implicit Hate Speech", "LLM Agents", "Retrieval-Augmented Reasoning", "Chain-of-Thought"], "openreview_url": "https://openreview.net/forum?id=d1ld3xqKzG", "contribution_types": ["Dataset"]}, {"id": "cZcvS59DfU", "title": "Multimodal Fake News Detection in Bilingual Media: A Vision–Language Fusion Approach Using Task-Specific CNNs and Multilingual Transformers", "abstract": "Misinformation on social media increasingly exploits visually persuasive thumbnail-style content, yet multimodal fake news detection remains underexplored for low-resource languages. This paper presents a bilingual multimodal framework for fake news detection using textual and visual information extracted from Bangla and English social media thumbnails collected from YouTube, Facebook, and Instagram. A manually annotated dataset of 19,890 thumbnail images with embedded textual content is constructed. Multilingual transformer models are fine-tuned using a robust text preprocessing pipeline, while a custom convolutional neural network is designed for visual feature extraction. Unimodal predictions are combined using a late fusion strategy to enhance robustness. Experimental results demonstrate that the XLM-RoBERTa-base model outperforms other multilingual transformer-based models on OCR-extracted text, achieving the highest macro F1-score of 97.20. The Visual Misinformation Detection Convolutional Neural Network (VMD-CNN) model achieves 96.05% accuracy on visual content, confirming that textual cues dominate while visual features provide complementary signals. Late fusion of the best-performing unimodal models further improves overall performance, reaching 97.15% test accuracy, highlighting the effectiveness of decision-level fusion in integrating heterogeneous modalities. This framework provides a practical solution for detecting misleading social media content, particularly in bilingual low-resource settings, and offers a foundation for future research in multilingual multimodal fake news detection and automated content moderation.", "area": "Multilinguality and Language Diversity", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["BERT", "CNN", "XLM-RoBERTa", "Fusion Classifier", "Late fusion", "Bilingual"], "openreview_url": "https://openreview.net/forum?id=cZcvS59DfU", "contribution_types": ["Analysis", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "VDdK3tWQfd", "title": "RIFT: Reordered Instruction Following Testbed To Evaluate Instruction Following in Singular Multistep Prompt Structures", "abstract": "Large Language Models (LLMs) are increasingly relied upon for complex, multistep workflows, yet their ability to maintain control flow of instructions remains underexplored. Existing benchmarks often conflate task complexity with structural ordering, making it difficult to isolate the impact of prompt topology on performance. We introduce RIFT, Reordered Instruction Following Testbed, to assess instruction following by disentangling structure from content. Using rephrased Jeopardy! question-answer pairs, we test LLMs across two formally defined prompt structures: linear prompts, which progress sequentially, and jumping prompts, which preserve identical content but require non-sequential traversal. Across 10,000 evaluations spanning six state-of-the-art open-source LLMs, accuracy dropped by up to 72% under jumping conditions (compared to baseline), revealing a strong dependence on positional continuity. Error analysis shows that approximately 50% of failures stem from instruction-order violations and semantic drift, indicating that current architectures internalize instruction following as a sequential pattern rather than an abstract reasoning skill. These results highlight structural sensitivity as a fundamental limitation in LLM alignment and reasoning, establishing a reproducible framework for testing discontinuous procedural execution.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Instruction Following", "Non-sequential Instructions", "Prompt Structural Sensitivity", "LLM Evaluation"], "openreview_url": "https://openreview.net/forum?id=VDdK3tWQfd", "contribution_types": ["Analysis"]}, {"id": "12GBePrc39", "title": "AutoRAN: Automated Hijacking of Safety Reasoning in Large Reasoning Models", "abstract": "This paper presents AutoRAN, the first framework to automate the hijacking of internal safety reasoning in large reasoning models (LRMs). At its core, AutoRAN pioneers an execution simulation paradigm that leverages a weaker but less-aligned model to simulate execution reasoning for initial hijacking attempts and iteratively refine attacks by exploiting reasoning patterns leaked through the target LRM's refusals. This approach steers the target model to bypass its own safety guardrails and elaborate on harmful instructions. We evaluate AutoRAN against state-of-the-art LRMs, including GPT-o3/o4-mini and Gemini-2.5-Flash, across multiple benchmarks (AdvBench, HarmBench, and StrongReject). Results show that AutoRAN achieves approaching 100% success rate within one or few turns, effectively neutralizing reasoning-based defenses even when evaluated by robustly aligned external models. This work reveals that the transparency of the reasoning process itself creates a critical and exploitable attack surface, highlighting the urgent need for new defenses that protect models' reasoning traces rather than merely their final outputs.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AutoRAN"], "keywords": ["Large Reasoning Models (LRMs)", "Safety Alignment", "Jailbreak Attack", "Chain-of-Thought (CoT)", "Automated Red Teaming"], "openreview_url": "https://openreview.net/forum?id=12GBePrc39", "contribution_types": ["Analysis", "Engineering"]}, {"id": "6kuvUYqtr7", "title": "PsyEmbedding: A Framework for Aligning Language Models to Psychological Theory", "abstract": "Pre-trained transformer-based language models revolutionized natural language processing and are increasingly important in computational psychology. However, these models' representations are optimized for quantifying \\textit{semantic} similarity, which may not always align with \\textit{psychological} similarity. We present \\textit{PsyEmbedding}, a framework for fine-tuning models (including BERT, SBERT, RoBERTa, GTE, and E5) to encode psychological constructs within content rather than just their semantic meaning. Leveraging a dataset annotated for numerous psychological constructs (CAMEL), we introduce a balanced stratified sampling strategy to generate embeddings predictive of psychological dimensions. We evaluate PsyEmbedding across multiple textual similarity and construct representation tasks, demonstrating that our method significantly aligns embedding spaces with psychological theory.", "area": "Social NLP", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Embedding", "Psychology", "Computational Social Science"], "openreview_url": "https://openreview.net/forum?id=6kuvUYqtr7", "contribution_types": ["Analysis"]}, {"id": "AsIzWmbUeu", "title": "Beyond Pixels: Introspective and Interactive Grounding for Visualization Agents", "abstract": "Coding agents rely on Vision-Language Models (VLMs) to verify the charts they generate, but VLMs frequently hallucinate data values from rendered pixels and fail to detect fine-grained errors. We propose Introspective and Interactive Visual Grounding (IVG), a framework with two complementary mechanisms: (1) spec-grounded introspection, which provides direct access to the agent's own chart specification for deterministic value verification; and (2) view-grounded interaction, which allows agents to manipulate the view (zoom, pan, toggle traces) to resolve ambiguity in overlapping regions. To evaluate this framework, we introduce iPlotBench, a benchmark of 500 interactive Plotly figures with 6,706 binary questions and released ground-truth specifications. Our experiments show that spec-grounded introspection improves data reconstruction fidelity in chart recreation, while view-grounded interaction yields the largest gains on questions requiring spatial reasoning over overlapping geometries. The combination achieves the highest overall QA accuracy, demonstrating that these two capabilities are complementary for building trustworthy visualization agents.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/iPlotBench-D0C4", "https://anonymous.4open.science/r/IVG-D433"], "keywords": ["visualization agents", "visual grounding", "chart question answering", "Chart Understand and Reasoning", "tool use", "benchmark"], "openreview_url": "https://openreview.net/forum?id=AsIzWmbUeu", "contribution_types": ["Engineering", "Dataset"]}, {"id": "pMcLzfhR9b", "title": "LooComp: Leverage Leave-One-Out Strategy to Encoder-only Transformer for Efficient Query-aware Context Compression", "abstract": "Efficient context compression is crucial for improving the accuracy and scalability of question answering. For the efficiency of Retrieval Augmented Generation, context should be delivered fast, compact, and precise to ensure clue sufficiency and budget-friendly LLM reader cost. We propose a margin-based framework for query-driven context pruning, which identifies sentences that are critical for answering a query by measuring changes in clue richness when they are omitted. The model is trained with a composite ranking loss that enforces large margins for critical sentences while keeping non-critical ones near neutral. Built on a lightweight encoder-only Transformer, our approach generally achieves strong exact-match and F1 scores with high-throughput inference and lower memory requirements than those of major baselines. In addition to efficiency, our method yields effective compression ratios without degrading answering performance, demonstrating its potential as a lightweight and practical alternative for retrieval-augmented tasks.", "area": "Summarization", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["query-focused summarization", "extractive summarisation", "pruning", "NLP in resource-constrained settings"], "openreview_url": "https://openreview.net/forum?id=pMcLzfhR9b", "contribution_types": ["Engineering", "Low-resource", "Efficiency"]}, {"id": "375SKZS7Nc", "title": "Proof of Time: A Benchmark for Evaluating Scientific Idea Judgments", "abstract": "Large language models are increasingly being used to assess and forecast research ideas, yet we lack scalable ways to evaluate the quality of models’ judgments about these scientific ideas. Towards this goal, we introduce \\textbf{\\gls{pot}}, a semi-verifiable benchmarking framework that links scientific idea judgments to downstream signals that become observable later (e.g., citations and shifts in researchers’ agendas). \\gls{pot} freezes a pre-cutoff snapshot of evidence in an offline sandbox and asks models to forecast post-cutoff outcomes, enabling verifiable evaluation when ground truth arrives, scalable benchmarking without exhaustive expert annotation, and analysis of human–model misalignment against signals such as peer-review awards. In addition, \\gls{pot} provides a controlled testbed for agent-based research judgments that evaluate scientific ideas, comparing tool-using agents to non-agent baselines under prompt ablations and budget scaling. Across 30K+ instances spanning four benchmark domains, we find that, compared with non-agent baselines, higher interaction budgets generally improve agentic performance, while the benefit of tool use is strongly task dependent. By combining time-partitioned, future-verifiable targets with an offline sandbox for tool use, \\gls{pot} supports scalable evaluation of agents on future-facing scientific idea judgment tasks.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["scientific ideas judgment evaluation", "semi-verifiable benchmarking", "scalable evaluation via public metadata", "agent evaluation"], "openreview_url": "https://openreview.net/forum?id=375SKZS7Nc", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "cTs65zxuxv", "title": "Long-Context Reasoning Through Proxy-Based Chain-of-Thought Tuning", "abstract": "Recent large language models support inputs of up to 10 million tokens, yet they perform poorly on long-context tasks that require complex reasoning. Such tasks can be solved using only a subset of the input --- a proxy context --- rather than the full sequence. Despite sharing the same underlying reasoning process, models exhibit a significant performance disparity between proxy and full contexts.  To improve long-context reasoning, we propose ProxyCoT, a novel training framework that transfers reasoning capabilities from short proxy contexts to full long contexts.  Specifically, we first obtain high-quality chain-of-thought reasoning traces on proxy contexts through reinforcement learning or distillation from a larger teacher model, and then ground the generated traces in full long contexts with supervised fine-tuning. Experiments across different datasets demonstrate that ProxyCoT consistently outperforms strong baselines with reduced computational overhead. Furthermore, models trained with ProxyCoT generalize their long-context reasoning capabilities to out-of-domain tasks.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Long-context Language Models", "Language Model Distillation", "Language Model Reasoning"], "openreview_url": "https://openreview.net/forum?id=cTs65zxuxv", "contribution_types": ["Engineering"]}, {"id": "1jca3tDrU5", "title": "Multi-Agent Comedy Club: Investigating Community Discussion Effects on LLM Humor Generation", "abstract": "Prior work has explored multi-turn interaction and feedback for LLM writing, but evaluations still largely center on prompts and localized feedback, leaving persistent public reception in online communities underexamined. We test whether broadcast community discussion improves stand-up comedy writing in a controlled multi-agent sandbox: in the discussion condition, critic and audience threads are recorded, filtered, stored as social memory, and later retrieved to condition subsequent generations, whereas the baseline omits discussion. Across 50 rounds (250 paired monologues) judged by five expert annotators using A/B preference and a 15-item rubric, discussion wins 75.6% of instances and improves Craft/Clarity (Δ = 0.440) and Social Response (Δ = 0.422), with occasional increases in aggressive humor.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Natural language generation (NLG)", "Computational humor", "Multi-agent systems", "Comedy generation", "Human evaluation of LLM writing"], "openreview_url": "https://openreview.net/forum?id=1jca3tDrU5", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "2QaqBsuyCT", "title": "AudioRole: An Audio Dataset for Character Role-Playing in Large Language Models", "abstract": "While existing role-playing research predominantly focuses on text, Audio Role-Playing (ARP) presents unique challenges regarding the synchronized alignment of semantic content and vocal characteristics. To address this gap, we propose AudioRole, a meticulously curated dataset from 13 TV series spanning 1K+ hours with 1M+ character-grounded dialogues, providing synchronized audio-text pairs annotated with speaker identities and contextual metadata. In addition, to demonstrate the effectiveness of the dataset, we introduced ARP-Eval, a dual-aspect evaluation framework that assesses both response quality and role fidelity. Empirical validation showing GLM-4-Voice trained on AudioRole (called ARP-Model) achieves an average Acoustic Personalization score of 0.31, significantly outperforming the original GLM-4-voice and the more powerful model MiniCPM-O-2.6. The ARP-Model also achieves a Content Personalization score of 0.36, surpassing the untrained original model by about 38%. The blind human perceptual evaluation also confirms these findings.\n\nAudioRole features dialogues from over 115 main characters, 6 trained ARP-Models, and evaluation protocols. Together, they provide an essential resource for advancing audio-grounded role-playing research.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Audio Role-Playing", "Large Language Models", "Multimodal Dataset", "Data Construction"], "openreview_url": "https://openreview.net/forum?id=2QaqBsuyCT", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "kwKrJT3dWE", "title": "Self-Ensembling Vision-Language Models for Chart Data Extraction", "abstract": "Charts effectively convey quantitative information, but the underlying data are often locked in image form, hindering reuse and analysis. Manually digitizing charts is time-consuming and error-prone, motivating automatic chart-to-table extraction. Recent approaches use specialized vision-language models (VLMs), yet performance still lags on charts with many datapoints or substantial stylistic variation. We propose a VLM self-ensembling method that repeatedly samples multiple tabular outputs from the same VLM for a fixed chart image and aggregates them at the level of individual table cells. We align candidate tables and take per-cell medians over numerical values to produce a more accurate consensus table. Our method also includes convergence detection to stop sampling once the aggregated table stabilizes, and uncertainty estimation based on dispersion across samples to help users assess extraction reliability. Because existing chart extraction benchmarks contain relatively simple plots with limited room for improvement, we introduce WB-ChartExtract, a new benchmark built from World Bank data with more complex and stylistically diverse charts; on average, its charts contain 8.4$\\times$ more datapoints than those in the ChartQA benchmark. Across both ChartQA and WB-ChartExtract, our approach consistently improves extraction accuracy over single-pass VLM outputs, yielding up to 23\\% relative improvement on WB-ChartExtract after ensembling. More broadly, our method helps unlock tabular data previously siloed in chart images, enabling downstream analysis and reuse.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vision-Language Models", "Chart Data Extraction"], "openreview_url": "https://openreview.net/forum?id=kwKrJT3dWE", "contribution_types": ["Engineering", "Dataset"]}, {"id": "Cx6dkj7HUw", "title": "Controllable Memory Usage: Balancing Anchoring and Innovation in Long-Term Human–Agent Interaction", "abstract": "As LLM-based agents are increasingly used in long-term interactions, cumulative memory is critical for enabling personalization and maintaining stylistic consistency. However, most existing systems adopt an ``all-or-nothing'' approach to memory usage: incorporating all relevant past information can lead to Memory Anchoring, where the agent is trapped by past interactions, while excluding memory entirely results in under-utilization and the loss of important interaction history. \nWe show that an agent's reliance on memory can be modeled as an explicit and user-controllable dimension.\nWe first introduce a behavioral metric of memory dependence to quantify the influence of past interactions on current outputs. \nWe then propose Steerable Memory Agent, SteeM, a framework that allows users to dynamically regulate memory reliance, ranging from a fresh-start mode that promotes innovation to a high-fidelity mode that closely follows interaction history.\nExperiments across different scenarios demonstrate that our approach consistently outperforms conventional prompting and rigid memory masking strategies, yielding a more nuanced and effective control for personalized human-agent collaboration.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Preference Alignment", "Personalized LLM Agent", "Agent Memory Usage"], "openreview_url": "https://openreview.net/forum?id=Cx6dkj7HUw", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "c09Gh7rcNK", "title": "Map of Encoders – Mapping Sentence Encoders using Quantum Relative Entropy", "abstract": "We propose a method to compare and visualise sentence encoders at scale by creating a *map of encoders* where each sentence encoder is represented in relation to the other sentence encoders. Specifically, we first represent a sentence encoder using an embedding matrix of a sentence set, where each row corresponds to the embedding of a sentence. Next, we compute the Pairwise Inner Product (PIP)  matrix for a sentence encoder using its embedding matrix. Finally, we create a feature vector for each sentence encoder reflecting its Quantum Relative Entropy (QRE) with respect to a unit base encoder. We construct a map of encoders covering 1101 publicly available sentence encoders, providing a new perspective of the landscape of the pre-trained sentence encoders. Our map accurately reflects various relationships between encoders, where encoders with similar attributes are proximally located on the map. Moreover, our encoder feature vectors can be used to accurately infer downstream task performance of the encoders, such as in retrieval and clustering tasks, demonstrating the faithfulness of our map.", "area": "Semantics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["sentence encoder", "map of encoders", "sentence representation", "sentence embedding", "quantum relative entropy"], "openreview_url": "https://openreview.net/forum?id=c09Gh7rcNK", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Data Analysis", "Theory"]}, {"id": "lCHqJ4U9lM", "title": "Graph Reasoning Paradigm: Structured and Symbolic Reasoning with Topology-Aware Reinforcement Learning for Large Language Models", "abstract": "Long Chain-of-Thought, achieved by Reinforcement Learning with Verifiable Rewards, has proven effective in enhancing the reasoning capabilities of Large Language Models (LLMs).\nHowever, reasoning in current LLMs is primarily generated as plain text, where performing semantic evaluation on such unstructured data creates a computational bottleneck during training.\nDespite RLVR-based optimization, existing methods still suffer from coarse-grained supervision, reward hacking, high training costs, and poor generalization.\nTo address these issues, we propose the Graph Reasoning Paradigm (GRP), which realizes structured and symbolic reasoning, implemented via graph-structured representations with step-level cognitive labels. \nBuilding upon GRP, we further design Process-Aware Stratified Clipping Group Relative Policy Optimization (PASC-GRPO), which leverages structured evaluation to replace semantic evaluation, achieves process-aware verification through graph-structured outcome rewards, and mitigates reward hacking via stratified clipping advantage estimation.\nExperiments demonstrate significant improvements across mathematical reasoning and code generation tasks. Data, models, and code will be released later.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Reinforcement Learning", "Graph Reasoning Paradigm", "Structured Reasoning", "Symbolic Reasoning"], "openreview_url": "https://openreview.net/forum?id=lCHqJ4U9lM", "contribution_types": ["Analysis", "Low-resource", "Efficiency", "Dataset", "Theory"]}, {"id": "B65QAl38dr", "title": "LearnerCoMPASS: Intelligent Tutoring System with Dynamic Cognitive Diagnosis and Multi-Model Path Planning", "abstract": "Existing adaptive learning systems struggle to simultaneously achieve deep personalization, dynamic adaptability, and content trustworthiness, particularly in logically rigorous STEM fields where Large Language Models (LLMs) are prone to \"hallucination\". This paper introduces LearnerCoMPASS (Cognitive Multi-model Planning & Adaptive System), an integrated, end-to-end framework for adaptive learning. At its core, the framework features a novel multi-model path planning algorithm that orchestrates and fuses the outputs of heterogeneous LLM experts to generate and optimize learning sequences. To enable deep personalization, we design a dynamic cognitive diagnosis module that employs an innovative encoder-decoder architecture to generate precise, multi-dimensional cognitive state vectors for learners. To ensure trustworthiness, the system leverages an adaptively constructed dynamic knowledge graph and a Graph-RAG mechanism to provide factual anchors and logical constraints for LLM reasoning, thereby mitigating hallucinations. Extensive experiments demonstrate that LearnerCoMPASS significantly outperforms state-of-the-art baselines in generating high-quality personalized learning paths. Furthermore, ablation studies validate the critical contributions of our dynamic cognitive diagnosis and multi-model planning components.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Intelligent Tutoring Systems; Large Language Models; Multi-Agent Systems; Cognitive Diagnosis; Learning Path Planning"], "openreview_url": "https://openreview.net/forum?id=B65QAl38dr", "contribution_types": ["Engineering"]}, {"id": "wOrNShGSXc", "title": "GeoVLMath: Enhancing Geometry Reasoning in Vision-Language Models via Cross-Modal Reward for Auxiliary Line Creation", "abstract": "Auxiliary lines are essential for solving complex geometric problems but remain challenging for large vision-language models (LVLMs). \nRecent attempts construct auxiliary lines via code-driven rendering, a strategy that relies on accurate and executable code generation to produce visual renderings of the auxiliary lines for subsequent reasoning. However, in complex solid geometry settings, such a strong dependence on precise specifications substantially restricts the robustness of this strategy. Alternatively, we turn to a simpler and more stable solution, representing auxiliary-line constructions as structured textual descriptions. To bridge the gap between textual descriptions and spatial structure, we propose a reinforcement learning framework that enhances diagram-text alignment. The core is a cross-modal reward model that evaluates how well the generated auxiliary-line description matches the ground-truth auxiliary-line diagram. The reward signal drives a GRPO-based RL stage to  yield informative auxiliary-line descriptions for the reasoning. To support the training and evaluation, we develop a scalable data pipeline and construct AuxSolidMath, a dataset of 3,018 real-exam geometry problems with paired diagrams and aligned textual fields. Based on this framework, we derive GeoVLMath, an LVLM for solving complex solid geometry.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Cross-Modal Reward", "Geometry Reasoning", "Auxiliary Line Creation"], "openreview_url": "https://openreview.net/forum?id=wOrNShGSXc", "contribution_types": ["Dataset"]}, {"id": "uuER9zP04c", "title": "Vector Calligrapher: Generating Scalable Vector Graphics via Structured Linguistic Supervision", "abstract": "Generating SVG-based fonts requires Multimodal Large Language Models (MLLMs) to translate high-level linguistic intent into low-level, topologically constrained symbolic sequences. However, current approaches struggle with two fundamental misalignments: the semantic ambiguity of unstructured natural language for precise geometric control, and the inefficiency of generic text tokenizers, which fragment coordinate-dense SVG XML into excessively long sequences with low information density. In this work, we propose Vector Calligrapher, a system that treats SVG generation as a conditional language modeling task optimized for both semantic grounding and representational efficiency.\n\nTo bridge the semantic gap, we introduce a structured linguistic supervision Font Description Framework that decomposes typographic style into interpretable linguistic dimensions (e.g., historical lineage, affective metaphors), providing structured supervision aligned with the compositional syntax of SVG. To address the tokenization bottleneck, we design a scalable separated-coordinate strategy that bypasses the vocabulary explosion of flattened tokens while significantly compressing sequence length. Supported by VectorFont, a dataset of over 10 million hierarchically annotated glyphs, our approach improves CLIP score by +23%, reduces geometric error by ≈48%, and boosts generation efficiency by achieving an 18% Command-per-Token (C/T) ratio---a 6× increase in information density over standard baselines. These results demonstrate that combining structured linguistic supervision with efficient symbolic tokenization is essential for reliable, controllable vector graphics synthesis.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Structured Linguistic Supervision", "SVG Generation", "Multimodal Large Language Models", "Symbolic Sequence Modeling", "Vector Typography"], "openreview_url": "https://openreview.net/forum?id=uuER9zP04c", "contribution_types": ["Dataset"]}, {"id": "SPWZxcnmlF", "title": "Talk to Your Slides: High-Efficiency Slide Editing via Language-Driven Structured Data Manipulation", "abstract": "Editing presentation slides is a frequent yet tedious task, ranging from creative layout design to repetitive text maintenance.\nWhile recent GUI-based agents powered by Multimodal LLMs (MLLMs) excel at tasks requiring visual perception, such as spatial layout adjustments, they often incur high computational costs and latency when handling structured, text-centric, or batch processing tasks.\nIn this paper, we propose Talk-to-Your-Slides, a high-efficiency slide editing agent that operates via language-driven structured data manipulation rather than relying on the image modality.\nBy leveraging the underlying object model instead of screen pixels, our approach ensures precise content modification while preserving style fidelity, addressing the limitations of OCR-based visual agents.\nOur system features a hierarchical architecture that effectively bridges high-level user instructions with low-level execution codes.\nExperiments demonstrate that for text-centric and formatting tasks, our method enables 34% faster processing, achieves 34% better instruction fidelity, and operates at an 87% lower cost compared to GUI-based baselines.\nFurthermore, we introduce TSBench, a human-verified benchmark dataset comprising 379 instructions, including a Hard subset designed to evaluate robustness against complex and visually dependent queries.\nOur code and benchmark are available at https://drive.google.com/drive/folders/1onwp5m7t3207xZu7HEBTMpdivsiOuqG8?usp=share_link", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Slide Editing", "LLM Agent", "Structured Data Manipulation", "TSBench"], "openreview_url": "https://openreview.net/forum?id=SPWZxcnmlF", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "WTiXHxkffB", "title": "Influence-based Online Experience Selection for Effective RLHF", "abstract": "Reinforcement Learning from Human Feedback (RLHF) has emerged as a crucial technique for aligning large language models (LLMs) with human preferences. However, existing RLHF methods face key challenges, including poor sample efficiency, high computational overhead, and slow convergence. Recent studies highlight the importance of data selection in RL, but how to effectively select the most beneficial experiences for RL training remains an open problem. Existing data selection methods for RL rely on heuristic metrics, failing to establish an interpretable connection between data and optimization objectives. To address this problem, we propose InfOES (Influence-based Online Experience Selection), a novel data selection method for RLHF that dynamically estimates the influence of individual training samples on policy optimization. By incorporating data attribution into the policy gradient, InfOES can identify and filter out detrimental samples on the fly, ensuring effective convergence toward alignment objectives. Our approach is compatible with various RL algorithms (e.g., PPO, GRPO, REINFORCE++). Extensive experiments demonstrate that InfOES significantly enhances training effectiveness, achieving superior alignment performance with fewer optimization steps.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["RLHF", "Alignment"], "openreview_url": "https://openreview.net/forum?id=WTiXHxkffB", "contribution_types": ["Efficiency", "Data Analysis"]}, {"id": "JjGPxtCMrH", "title": "Text2Stories: Evaluating the Alignment Between Stakeholder Interviews and User Stories", "abstract": "Software requirements are derived from natural language inputs such as the transcripts of elicitation interviews. However, evaluating whether those derived requirements faithfully reflect the stakeholders’ needs remains a challenging manual task. We introduce Text2Stories, a task and metrics for text-to-story alignment that allow quantifying the extent to which requirements (in the form of user stories) match the actual needs expressed by the elicitation session participants.\nGiven an interview transcript and a set of user stories, our metric quantifies (i) correctness: the proportion of stories supported by the transcript, and (ii) completeness: the proportion of transcript supported by at least one story. We segment the transcript into text chunks and instantiate the alignment as a matching problem between chunks and stories.\nExperiments over four datasets show that an LLM-based matcher achieves 0.86 macro-F1 on manually labeled chunk–story pairs, while \nembedding models alone remain behind but enable effective blocking. Automated alignment decisions enable the downstream computation of completeness and correctness. We show that these two metrics behave consistently with human judgment across multiple datasets, positioning Text2Stories as a scalable, source-faithful complement to existing user-story quality criteria.", "area": "Semantics", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/txt2stories-A3FD", "https://anonymous.4open.science/r/374txt2stories-A3FD"], "keywords": ["Requirements Engineering", "User Story Evaluation", "Text Alignment", "Source-Grounded Evaluation", "LLM-as-a-Judge"], "openreview_url": "https://openreview.net/forum?id=JjGPxtCMrH", "contribution_types": ["Engineering", "Efficiency", "Dataset"]}, {"id": "kc8unzZj6P", "title": "NeuralFSM: Adaptive Multi-Agent Coordination via Learning Finite-State Execution Policy", "abstract": "LLM-powered multi-agent systems (MAS) have demonstrated strong performance on complex tasks. However, most existing approaches still rely on hand-crafted communication protocols or automatically designed communication topologies, which generalize poorly across tasks. We introduce NeuralFSM, a state-driven framework that formulates multi-agent problem solving as a finite-state execution process. NeuralFSM learns both the state transition distribution and inter-agent communication weights from interaction traces using a Temporal Coordination Controller. Rather than prioritizing explicit structure generation, the proposed framework uses task context to modulate transition and routing decisions, enabling flexible coordination without manual protocol design. To improve robustness against noisy or adversarial agents, we incorporate graph regularization during training and apply trust-aware message attenuation at runtime. Experiments on diverse benchmarks show that NeuralFSM consistently outperforms prior baselines by an average margin of $6.74\\% \\sim 19.39\\%$, while substantially reducing token consumption. Moreover, NeuralFSM exhibits strong inherent robustness, which is further enhanced by the protection layer, resulting in only a $1.82\\%$ performance drop under attack.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/neuralfsm-anonymous-F833"], "keywords": ["finite state machine; LLM-based multi-agent systems; temporal graph networks; task-adaptive coordination; finite-state traversal; dual-defense protection"], "openreview_url": "https://openreview.net/forum?id=kc8unzZj6P", "contribution_types": ["Engineering", "Theory"]}, {"id": "sBN9bobIie", "title": "NC2C: Automated Convexification of Generic Non-Convex Optimization Problems", "abstract": "Non-convex optimization problems are pervasive across mathematical programming, engineering design, and scientific computing, often posing intractable challenges for traditional solvers due to their complex objective functions and constrained landscapes. To address the inefficiency of manual convexification and the over-reliance on expert knowledge, we propose NC2C, an end-to-end automated framework designed to transform generic non-convex optimization problems into solvable convex forms. NC2C integrates symbolic reasoning, adaptive transformation techniques, and iterative validation to autonomously detect non-convex components, select optimal convexification strategies, and generate rigorous convex equivalents. Equipped with error correction loops and feasibility domain correction mechanisms, the framework ensures the robustness and validity of transformed problems. Experimental results on a diverse dataset of 100 generic non-convex problems demonstrate that NC2C achieves an 89.3% execution rate and a 76% success rate in producing feasible, high-quality convex transformations. This outperforms baseline methods by a significant margin, highlighting NC2C’s ability to streamline non-convex problem-solving, reduce expert dependency, and enable efficient deployment of convex solvers for previously intractable optimization tasks.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Non-convex optimization", "LLMs for Math", "Instruction Learning"], "openreview_url": "https://openreview.net/forum?id=sBN9bobIie", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Low-resource", "Efficiency", "Dataset", "Data Analysis", "Theory"]}, {"id": "e599H1NP7T", "title": "PRiSM: Benchmarking Phone Realization in Speech Models", "abstract": "Phone recognition (PR) serves as the atomic interface for language-agnostic modeling for cross-lingual speech processing and phonetic analysis. \nDespite prolonged efforts in developing PR systems, current evaluations only measure surface-level transcription accuracy.\nWe introduce PRiSM, the first open-source benchmark designed to expose blind spots in phonetic perception through intrinsic and extrinsic evaluation of PR systems. \nPRiSM standardizes transcription-based evaluation and assesses downstream utility in clinical, educational, and multilingual settings with transcription and representation probes. \nWe find that \ndiverse language exposure during training is key to PR performance, encoder-CTC models are the most stable, and specialized PR systems still outperform LALMs. \nPRiSM releases code, recipes, and datasets to move the field toward multilingual speech models with robust phonetic ability.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["speech technologies", "phonology", "benchmarking", "evaluation"], "openreview_url": "https://openreview.net/forum?id=e599H1NP7T", "contribution_types": ["Analysis"]}, {"id": "MhTKIlvpnx", "title": "Probing Social Identity Bias in Chinese LLMs with Gendered Pronouns and Social Groups", "abstract": "Large language models (LLMs) are increasingly deployed in user-facing applications, raising concerns that they may reflect and amplify social biases. We investigate social identity biases in Chinese LLMs using Mandarin-specific prompts across ten representative models. Our evaluation compares ingroup (“We”) and outgroup (“They”) framings across 240 social groups salient in the Chinese context, using a two-tiered measurement framework that assesses both sentiment and toxicity. The prompt design explicitly accounts for linguistic and cultural properties of Mandarin, such as Chinese-specific gendered pronoun usage, enabling a controlled comparison of social identity framing effects. Across models, we observe consistent patterns of ingroup solidarity and outgroup hostility, indicating systematic social identity biases in Chinese LLMs. Our study introduces a language-aware evaluation framework for Chinese LLMs and shows that social identity biases previously documented in English also manifest in Chinese, highlighting the cross-linguistic relevance of bias concerns in large language models.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Chinese Large Language Models (LLMs)", "Social Bias", "Fairness", "Ingroup–Outgroup Framing"], "openreview_url": "https://openreview.net/forum?id=MhTKIlvpnx", "contribution_types": ["Analysis", "Data Analysis"]}, {"id": "HFyB08RWCn", "title": "A2M: Trace-Optimized Agent Hijacking in the MCP Ecosystem", "abstract": "The evolution of Large Language Models into autonomous agents via the Model Context Protocol (MCP) introduces a critical security vulnerability because agents rely on semantic matching to select tools from unverified third-party MCP servers. This creates a novel semantic supply chain attack surface. We introduce A2M (Attraction-to-Manipulation), a two-stage black-box optimization framework designed to systematically hijack MCP agents. A2M first optimizes tool metadata to maximize selection probability through an Attraction phase and subsequently employs a trace-driven Analyzer-Optimizer to craft adversarial return payloads that steer agent reasoning towards attacker-desired outcomes by optimizing the tool further during a Manipulation phase. Extensive evaluations on LiveMCPBench tasks across various frontier models, including both proprietary and open-weight architectures, demonstrate the severity of this threat. A2M inflates token costs by up to 32.4× with cognitive denial of service, and achieves high success rates on information exfiltration, environment integrity compromise, and reasoning derailment. Furthermore, optimized tools exhibit strong transferability to unseen models and successfully bypass existing perplexity-based defenses and lightweight auditors. Our findings underscore the fragility of the tool selection layer and highlight an urgent need for robust vetting and isolation mechanisms in agentic ecosystems. A2M is open source and anonymously available at https://anonymous.4open.science/r/A2M-63A0.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/A2M-63A0"], "keywords": ["LLM Agents", "Model Context Protocol", "Adversarial Attacks"], "openreview_url": "https://openreview.net/forum?id=HFyB08RWCn", "contribution_types": ["Analysis", "Engineering"]}, {"id": "BRHv9AUhhD", "title": "ToolGate: Contract-Grounded and Verified Tool Execution for LLMs", "abstract": "Large Language Models (LLMs) augmented with external tools have demonstrated remarkable capabilities in complex reasoning tasks. However, existing frameworks rely heavily on natural language reasoning to determine when tools can be invoked and whether their results should be committed, lacking formal guarantees for logical safety and verifiability. We present \\textbf{ToolGate}, a forward execution framework that provides logical safety guarantees and verifiable state evolution for LLM tool calling. ToolGate maintains an explicit symbolic state space as a typed key-value mapping representing trusted world information throughout the reasoning process. Each tool is formalized as a Hoare-style contract consisting of a precondition and a postcondition, where the precondition gates tool invocation by checking whether the current state satisfies the required conditions, and the postcondition determines whether the tool's result can be committed to update the state through runtime verification. Our approach guarantees that the symbolic state evolves only through verified tool executions, preventing invalid or hallucinated results from corrupting the world representation. Experimental validation demonstrates that ToolGate significantly improves the reliability and verifiability of tool-augmented LLM systems while maintaining competitive performance on complex multi-step reasoning tasks. This work establishes a foundation for building more trustworthy and debuggable AI systems that integrate language models with external tools.", "area": "Discourse, Pragmatics, and Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Tool Learning", "Hoare Logic", "Contract Planning"], "openreview_url": "https://openreview.net/forum?id=BRHv9AUhhD", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Low-resource", "Efficiency", "Dataset", "Data Analysis", "Theory"]}, {"id": "S2Mjt37yJ1", "title": "Psyche-R1: Towards Reliable Psychological LLMs through Unified Empathy, Expertise, and Reasoning", "abstract": "Amidst a shortage of qualified mental health professionals, the integration of large language models (LLMs) into psychological applications offers a promising way to alleviate the growing burden of mental health disorders. Recent reasoning-augmented LLMs have achieved remarkable performance in mathematics and programming, while research in the psychological domain has predominantly emphasized emotional support and empathetic dialogue, with limited attention to reasoning mechanisms that are beneficial to generating accurate responses. Therefore, in this paper, we propose Psyche-R1, the first Chinese psychological LLM that jointly integrates empathy, psychological expertise, and reasoning, built upon a novel data curation pipeline. Specifically, we design a comprehensive data synthesis pipeline that produces over 75k high-quality psychological questions paired with detailed rationales, generated through and iterative prompt-rationale optimization procedure, along with 73k empathetic dialogues. Subsequently, we employ a hybrid training strategy wherein challenging samples are identified through a multi-LLM cross-selection strategy for group relative policy optimization (GRPO) to improve reasoning ability, while the remaining data are used for supervised fine-tuning (SFT) to enhance empathetic response generation and psychological domain knowledge. Extensive experiment results demonstrate the effectiveness of Psyche-R1 across several psychological benchmarks, where our 7B Psyche-R1 achieves comparable results to 671B DeepSeek-R1.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["psychology", "natural language processing"], "openreview_url": "https://openreview.net/forum?id=S2Mjt37yJ1", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "1ZBM1KZ5YR", "title": "Towards Reliable Paper Contributions Annotation in the ACL Rolling Review", "abstract": "With the rapid growth of scientific publications, researchers struggle to efficiently assess the relevance of numerous papers. Identifying the types of contributions an article makes can help readers quickly grasp its significance. The ACL Rolling Review (ARR) introduced a typology requiring authors to specify their contributions to improve review quality and fairness. However, the current typology lacks clear definitions and guidance, leading to inconsistent labeling and raising concerns about its reliability.\nOur extensive re-annotation campaign reveals substantial disagreement between authors and domain experts. Evaluation of LLMs on paper contribution identification shows competitive performance relative to authors against annotator consensus, highlighting a potential path toward more reliable annotation.", "area": "Resources and Evaluation", "paper_type": "Short", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ContributionTypes-8DBE"], "keywords": ["paper contributions", "re-annotation", "llm as annotator", "authors reliability", "arr process"], "openreview_url": "https://openreview.net/forum?id=1ZBM1KZ5YR", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "DDuUqjiLo9", "title": "Estimating Text Temperature", "abstract": "Autoregressive language models typically use temperature parameter at inference to shape the probability distribution and control the randomness of the text generated. After the text was generated, this parameter can be estimated using maximum likelihood approach. Following it, we propose a procedure to estimate the temperature of any text, including ones written by humans, with respect to a given language model. We evaluate the temperature estimation capability of a wide selection of small-to-medium LLMs. We then use the best-performing Qwen3 14B to estimate temperatures of popular corpora.", "area": "Natural Language Generation", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Sampling temperature", "LLM", "maximum likelihood"], "openreview_url": "https://openreview.net/forum?id=DDuUqjiLo9", "contribution_types": ["Engineering", "Data Analysis", "Theory"]}, {"id": "Xozt8IGHKJ", "title": "Multimodal Safety Evaluation in Generative Agent Social Simulations", "abstract": "Can generative agents be trusted in multimodal environments? Despite recent advances, agents remain limited in their ability to reason about safety, coherence, and trust across modalities. We introduce a reproducible simulation framework to evaluate generative agents in three aspects: (1) safety improvement over time via iterative plan revision in multimodal scenarios; (2) detection of unsafe activities across social contexts; and (3) social dynamics, measured through interaction and acceptance rates. These multimodal agents are evaluated using metrics that quantify plan revisions and unsafe-to-safe conversions. Experiments show that while agents detect direct multimodal contradictions, they often fail to align local revisions with global safety, achieving only a 55\\% success rate in correcting unsafe plans. We release a dataset of 1,000 multimodal plans, yielding more than 600,000 simulation steps. Notably, 45\\% of unsafe actions are accepted when paired with misleading visual cues, revealing a strong tendency to overtrust visual content.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Emergent social behavior", "Multimodal consistency", "Safety in AI", "Generative agents"], "openreview_url": "https://openreview.net/forum?id=Xozt8IGHKJ", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "Do6AiKYbiT", "title": "An Explainable Comparative Analysis of Machine Learning with Rule Based Models in Sentiment Tasks: Implication for Polarization Studies", "abstract": "This research systematically examines whether post-hoc Explainable AI (XAI) techniques can render transformer-based sentiment models sufficiently interpretable for measuring societal polarization from unstructured text data. Further, we compare explainable transformers with rule-based sentiment lexicons to illustrate which model is better suited to societal polarization data. Our results suggest that, XAI techniques help to explain and interpret the model decision and we also found that, transformer perform better in comparison to rule-based lexicons.", "area": "Interpretability", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["explainable ai; polarization; automated text analysis; nlp; social media analysis"], "openreview_url": "https://openreview.net/forum?id=Do6AiKYbiT", "contribution_types": ["Analysis", "Reproduction"]}, {"id": "fsgYB42b1V", "title": "Thinking Before Constraining: A Unified Decoding Framework for Large Language Models", "abstract": "Natural generation allows Language Models (LMs) to produce free-form responses with rich reasoning, but the lack of guaranteed structure makes outputs difficult to parse or verify. Structured generation, or constrained decoding, addresses this drawback by producing content in standardized formats such as JSON, ensuring consistency and guaranteed-parsable outputs, but it can inadvertently restrict the model’s reasoning capabilities.\nIn this work, we propose a simple approach that combines the advantages of both natural and structured generation. By allowing LLMs to reason freely until specific trigger tokens are generated, and then switching to structured generation, our method preserves the expressive power of natural language reasoning while ensuring the reliability of structured outputs. We further evaluate our approach on several datasets, covering both classification and reasoning tasks, to demonstrate its effectiveness, achieving a substantial gain of up to 27\\% in accuracy compared to natural generation, while requiring only a small overhead of 10--20 extra tokens. Our code and results\nare available online.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM reasoning", "hybrid decoding", "structured generation", "syntax-guaranteed generation"], "openreview_url": "https://openreview.net/forum?id=fsgYB42b1V", "contribution_types": ["Analysis", "Reproduction", "Low-resource", "Efficiency", "Theory"]}, {"id": "2Ml6FpsGEs", "title": "Mina: A Multilingual LLM-Powered Legal Assistant Agent for Empowering Access to Justice in Bangladesh", "abstract": "Bangladesh's low-income population faces major barriers to affordable legal advice due to complex legal language, procedural opacity, and high costs. Existing AI legal assistants lack Bengali-language support and jurisdiction-specific adaptation, limiting their effectiveness. To address this, we developed \\textsc{Mina}, a multilingual LLM-based legal assistant tailored for the Bangladeshi context. It employs multilingual embeddings and a RAG-based chain-of-tools framework for retrieval, reasoning, translation, and document generation, delivering context-aware legal drafts, citations, and plain-language explanations via an interactive chat interface. Evaluated by law faculty from leading Bangladeshi universities across all stages of the 2022 and 2023 Bangladesh Bar Council examinations, \\textsc{Mina} achieved scores of 75–80\\% in the preliminary MCQs, written, and simulated viva voce components. These results matched or surpassed average human performance, demonstrating strong clarity, contextual understanding, and sound legal reasoning, while operating at approximately 0.1-0.6\\% of the cost of human lawyers. These results confirm its potential as a low-cost, multilingual AI assistant that automates key legal tasks and scales access to justice, offering a real-world details on building domain-specific, low-resource systems and addressing challenges of multilingual adaptation, efficiency, and sustainable public-service AI deployment.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["legal AI", "multilingual large language models", "retrieval-augmented generation", "low-resource languages", "access to justice", "domain-specific NLP"], "openreview_url": "https://openreview.net/forum?id=2Ml6FpsGEs", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "OdPJLjjSfw", "title": "CASS: Nvidia to AMD Transpilation with Data, Models, and Benchmark", "abstract": "Cross-architecture GPU code transpilation is essential for unlocking low-level hardware portability, yet no scalable solution exists. We introduce CASS, the first dataset and model suite for source- and assembly-level GPU translation (CUDA ↔ HIP, SASS ↔ RDNA3). CASS contains 60k verified host-device code pairs, enabling learning-based translation across both ISA and runtime boundaries. We generate each sample using our automated pipeline that scrapes, translates, compiles, and aligns GPU programs across vendor stacks. Leveraging CASS, we train a suite of domain-specific translation models that achieve 88.2% accuracy on CUDA → HIP and 69.1% on SASS → RDNA3, outperforming commercial baselines including GPT-5.1, Claude-4.5, and Hipify by wide margins. Generated code matches native performance in 85% of cases, preserving both runtime and memory behavior. To support rigorous evaluation, we introduce CASS-Bench, a curated benchmark spanning 18 GPU domains with ground-truth execution. All data, models, and evaluation tools will be released as open source to support progress in GPU compiler tooling, binary compatibility, and LLM-guided code translation.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["CUDA", "Language Models", "HIP", "Assembly"], "openreview_url": "https://openreview.net/forum?id=OdPJLjjSfw", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "s6qDJz0qx2", "title": "Autonomous Knowledge Graph Exploration with Adaptive Breadth-Depth Retrieval", "abstract": "Retrieving evidence for language model queries from knowledge graphs requires balancing broad search across the graph with targeted multi-hop traversal to follow relational links. Similarity-based retrievers provide coverage but remain shallow, whereas traversal-based methods rely on selecting seed nodes to start exploration, which can fail when queries span multiple entities and relations. We introduce DGR: Dynamic Graph Retriever, an agentic KG retriever that gives a language model control over this breadth-depth tradeoff using a two-operation toolset: global lexical search over node descriptors and one-hop neighborhood exploration that composes into multi-hop traversal. DGR alternates between breadth-oriented discovery and depth-oriented expansion without depending on a fragile seed selection, a pre-set hop depth, or graph training. DGR autonomously adapts tool use to queries, using global search for language-heavy queries and neighborhood exploration for relation-heavy queries. On STaRK, DGR reaches 59.1% average Hit@1, improving Hit@1 by up to 9.5% and MRR by up to 7.5% over trained retrievers and agentic baselines while maintaining performance on various graph regimes. Finally, we distill DGR tool-use trajectories from a large teacher into an 8B model via label-free imitation, improving Hit@1 by 7.0%, 26.6%, and 13.5% over the base 8B model on AMAZON, MAG, and PRIME datasets, and retaining up to 98.5% of the teacher's Hit@1 rate.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Knowledge graph retrieval", "agentic retrieval", "adaptive breadth–depth trade-off", "multi-hop graph traversal", "tool-using language models", "global lexical search"], "openreview_url": "https://openreview.net/forum?id=s6qDJz0qx2", "contribution_types": ["Engineering", "Data Analysis"]}, {"id": "UbDz5dUzPm", "title": "How Value Induction Reshapes LLM Behavior", "abstract": "Conversational Large Language Models are post-trained on language that expresses specific behavioural traits, such as curiosity, open-mindedness, and empathy, and values, such as helpfulness, harmlessness, and honesty. This is done to increase utility, ensure safety, and improve the user experience of the people interacting with the model. However, values are complex and inter-related - incorporating one can modify behaviour on another. Further, incorporating certain values can make models more addictive or sycophantic, potentially having a detrimental effect on the user interacting with it. We investigate these and other unintended effects of value incorporation into models. \nWe fine-tune models using value subsets of existing preference datasets, measuring the effect of value induction of 15 values on safety, anthropomorphism, and various QA benchmarks.\nWe find that i) inducing values also leads to expression of other related, and sometimes contrastive values, ii) inducing positive values increases safety, and iii) all values increase anthropomorphic language use by models, making them more validating and sycophantic.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["values", "alignment", "behaviour", "LLMs", "anthropomorphisation", "safety"], "openreview_url": "https://openreview.net/forum?id=UbDz5dUzPm", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "unoGOeksI6", "title": "KARL: Mitigating Hallucinations in LLMs via Knowledge-Boundary-Aware Reinforcement Learning", "abstract": "Enabling large language models (LLMs) to appropriately abstain from answering questions beyond their knowledge is crucial for mitigating hallucinations.\nWhile existing reinforcement learning methods foster autonomous abstention, they often compromise answer accuracy because their static reward mechanisms, agnostic to models' knowledge boundaries, drive models toward excessive caution.\nIn this work, we propose KARL, a novel framework that continuously aligns an LLM's abstention behavior with its evolving knowledge boundary. KARL introduces two core innovations: a *Knowledge-Boundary-Aware Reward* that performs online knowledge boundary estimation using within-group response statistics, dynamically rewarding correct answers or guided abstention; and a *Two-Stage RL Training Strategy* that first explores the knowledge boundary and bypasses the ``*abstention trap*'', and subsequently converts incorrect answers beyond the knowledge boundary into abstentions without sacrificing accuracy.\nExtensive experiments on multiple benchmarks demonstrate that KARL achieves a superior accuracy-hallucination trade-off, effectively suppressing hallucinations while maintaining high accuracy across both in-distribution and out-of-distribution scenarios.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Hallucination Mitigation", "Reinforcement Learning", "Knowledge Boundary"], "openreview_url": "https://openreview.net/forum?id=unoGOeksI6", "contribution_types": ["Engineering"]}, {"id": "q8qbA8g6RD", "title": "CogRec: A Cognitive Recommender Agent Fusing Large Language Models and Soar for Explainable Recommendation", "abstract": "Large Language Models (LLMs) have demonstrated a remarkable capacity in understanding user preferences for recommendation systems. However, they are constrained by several critical challenges, including their inherent “Black-Box” characteristics, susceptibility to knowledge hallucination, and limited online learning capacity. These factors compromise their trustworthiness and adaptability. Conversely, cognitive architectures such as Soar offer structured and interpretable reasoning processes, yet their knowledge acquisition is notoriously laborious. To address these complementary challenges, we propose a novel cognitive recommender agent called CogRec which synergizes the strengths of LLMs with the Soar cognitive architecture. CogRec leverages Soar as its core symbolic reasoning engine and leverages an LLM for knowledge initialization to populate its working memory with production rules. The agent operates on a Perception-Cognition-Action(PCA) cycle. Upon encountering an impasse, it dynamically queries the LLM to obtain a reasoned solution. This solution is subsequently transformed into a new symbolic production rule via Soar's chunking mechanism, thereby enabling robust online learning. This learning paradigm allows the agent to continuously evolve its knowledge base and furnish highly interpretable rationales for its recommendations. Extensive evaluations conducted on three public datasets demonstrate that CogRec demonstrates significant advantages in recommendation accuracy, explainability, and its efficacy in addressing the long-tail problem.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Recommender Systems", "Large Language Models", "Cognitive Architecture", "Symbolic Reasoning"], "openreview_url": "https://openreview.net/forum?id=q8qbA8g6RD", "contribution_types": ["Analysis", "Engineering", "Data Analysis"]}, {"id": "2dJfKh96PO", "title": "StreamUni: Achieving Streaming Speech Translation with a Unified Large Speech-Language Model", "abstract": "Streaming speech translation (StreamST) requires determining appropriate timing, known as policy, to generate translations while continuously receiving source speech inputs, balancing low latency with high translation quality. Existing StreamST methods typically operate on sentence-level speech segments, referred to as simultaneous speech translation (SimulST). In practice, they require collaboration with upstream segmentation models to accomplish StreamST, where the truncated speech segments constrain SimulST models to make policy decisions and generate translations based on pre-defined contextual information preset by the upstream models. Moreover, SimulST models struggle to learn effective policies due to the complexity of speech inputs and cross-lingual generation. To address these challenges, we propose StreamUni, which achieves StreamST through a unified Large Speech-Language Model (LSLM). Specifically, StreamUni incorporates speech Chain-of-Thought (CoT) in guiding the LSLM to generate multi-stage outputs. Leveraging these multi-stage outputs, StreamUni simultaneously accomplishes speech segmentation, policy decision, and translation generation. Additionally, we propose a streaming CoT training method that enhances low-latency policy decisions and generation capabilities using limited CoT data. Experiments demonstrate that our approach achieves state-of-the-art performance on both SimulST and StreamST tasks.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Speech Translation", "Streaming Speech Translation", "Policy Decision", "Speech Chain-of-Thought", "Large Speech-Language Models"], "openreview_url": "https://openreview.net/forum?id=2dJfKh96PO", "contribution_types": ["Engineering", "Dataset"]}, {"id": "WIQZSDRgMk", "title": "MSEarth: A Multimodal Benchmark for Earth Science Phenomenon Discovery with MLLMs", "abstract": "The rapid advancement of multimodal large language models (MLLMs) offers new opportunities for complex scientific challenges, yet their application in earth science—especially at the graduate level—remains underexplored due to a lack of benchmarks reflecting the depth and complexity of geoscientific reasoning. Existing datasets often rely on synthetic data or simple figure-caption pairs, failing to capture the nuanced reasoning required for real-world applications. To address this, we introduce MSEarth, a multimodal scientific dataset and benchmark curated from high-quality, open-access publications. Covering the five major spheres of Earth science—atmosphere, cryosphere, hydrosphere, lithosphere, and biosphere—MSEarth features over 289K figures with refined captions enriched by contextual discussions and reasoning from the original papers. The benchmark supports tasks such as scientific figure captioning, multiple choice questions, and open-ended reasoning, providing a scalable, high-fidelity resource for developing and evaluating MLLMs in scientific reasoning.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MSEarth-2B3F"], "keywords": ["Multimodal", "Earth Science", "Dataset", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=WIQZSDRgMk", "contribution_types": ["Dataset"]}, {"id": "F5M1YCAbrr", "title": "One Instruction Is a Benchmark: End-to-End Instruction-Following Evaluation with FlexBench", "abstract": "Real-world deployments of of large language models(LLMs) increasingly depend on long, precise, and carefully constructed user instructions, such as standard operating procedures(SOPs), state machines, and multi-step workflows. In this setting, aggregate leaderboard performance is often a weak proxy for a model’s ability to faithfully execute any particular instruction that a practitioner cares about. To address this gap, we present FlexBench, an on-demand framework that automatically transforms a single seed instruction into an instruction-specialized benchmark. FlexBench (i) decomposes the instruction into a set of verifiable evaluation dimensions by treating it as a collection of checkable clauses, and (ii) generates a conversation corpus using a leakage-resistant user simulator. We further introduce FlexEval, which maps per-dimension, tri-valued judgments (yes/no/unknown) into instruction-level metrics that reflect workflow progress (Coverage) and conditional correctness (Achievement). Together, FlexBench and FlexEval provide a fully automated pipeline for instruction-specialized evaluation, enabling practitioners to build a benchmark tailored to their own instruction and to obtain reproducible, fine-grained diagnostics of instruction following. We validate the framework on 248 complex single-turn instructions and conduct extensive experiments across 10 leading LLMs in three multi-turn conversational scenarios with long, branching instructions. Our source code is publicly available at https://anonymous.4open.science/r/FlexBench-E0D7.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/FlexBench-E0D7"], "keywords": ["Large Language Models", "Instruction Following", "Automated Evaluation", "Benchmark Construction"], "openreview_url": "https://openreview.net/forum?id=F5M1YCAbrr", "contribution_types": ["Engineering", "Dataset"]}, {"id": "OJbIlRcaVR", "title": "A.S.E: A Repository-Level Benchmark for Evaluating Security in AI-Generated Code", "abstract": "The increasing adoption of large language models (LLMs) in software engineering necessitates rigorous security evaluation of their generated code. However, existing benchmarks often lack relevance to real-world AI-assisted programming scenarios, making them inadequate for assessing the practical security risks associated with AI-generated code in production environments. To address this gap, we introduce A.S.E (AI Code Generation Security Evaluation), a repository-level evaluation benchmark designed to closely mirror real-world AI programming tasks, offering a comprehensive and reliable framework for assessing the security of AI-generated code. Our evaluation of leading LLMs on A.S.E reveals several key findings. In particular, current LLMs still struggle with secure coding. The complexity in repository-level scenarios presents challenges for LLMs that typically perform well on snippet-level tasks. Moreover, a larger reasoning budget does not necessarily lead to better code generation. These observations offer valuable insights into the current state of AI code generation and help developers identify the most suitable models for practical tasks. They also lay the groundwork for refining LLMs to generate secure and efficient code in real-world applications.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Repository-level benchmark", "CVE-grounded tasks", "LLM sec", "Secure code generation"], "openreview_url": "https://openreview.net/forum?id=OJbIlRcaVR", "contribution_types": ["Engineering", "Data Analysis", "Surveys"]}, {"id": "uJViMxqV28", "title": "PaperAudit-Bench: Benchmarking Error Detection in Research Papers for Critical Automated Peer Review", "abstract": "Large language models can generate fluent peer reviews, yet their assessments often lack sufficient critical rigor when substantive issues are subtle and distributed across a paper.\nIn this paper, we introduce **PaperAudit-Bench**, which consists of two components:\n**(1) PaperAudit-Dataset**, an error dataset covering both errors identifiable within individual sections and those requiring cross-section reasoning, designed for controlled evaluation under long-context settings; and\n**(2) PaperAudit-Review**, an automated review framework that integrates structured error detection with evidence-aware review generation to support critical assessment.\nExperiments on PaperAudit-Bench reveal large variability in error detectability across models and detection depths, highlighting the difficulty of identifying such errors under long-context settings.\nRelative to representative automated reviewing baselines, incorporating explicit error detection into the review workflow produces systematically stricter and more discriminative evaluations, demonstrating its suitability for peer review.\nFinally, we show that the dataset supports training lightweight LLM detectors via SFT and RL, enabling effective error detection at reduced computational cost.\n\nCode is available at: https://anonymous.4open.science/r/PaperAudit-43C2.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/PaperAudit-43C2"], "keywords": ["Error Benchmark", "Error Detection", "Automated Peer Review"], "openreview_url": "https://openreview.net/forum?id=uJViMxqV28", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "DzAqgCe04W", "title": "HERIT: Democratizing Global Access to Korean Historical Archives via RAG-based Data Augmentation", "abstract": "Historical archives are invaluable resources for multidisciplinary research but remain inaccessible to the global community due to language barriers. While manual translation is prohibitively expensive and time-consuming, the direct application of existing machine translation models is often inadequate due to the unique linguistic and historical nuances of these documents. To address these challenges, we propose a novel framework that leverages Retrieval-Augmented Generation (RAG) to generate high-quality pseudo-labeled data from abundant Hanja-Korean corpora. This approach expands the training dataset, effectively mitigating data scarcity and temporal overfitting observed in human-labeled corpora. Extensive evaluations demonstrate that HERIT significantly ou
