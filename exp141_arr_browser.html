["Analysis", "Engineering", "Reproduction", "Data Analysis", "Theory"]}, {"id": "7FigeE9Zyl", "title": "Grounding Agent Memory in Contextual Intent", "abstract": "Deploying large language models in long-horizon, goal-oriented interactions remains challenging because similar entities and facts recur under different latent goals and con-straints, causing memory systems to retrieve context-mismatched evidence. We propose STITCH (Structured Intent Tracking in Contextual History), an agentic memory system that indexes each trajectory step with a structured retrieval cue, contextual intent, and retrieves history by matching the current step's intent. Contextual intent provides compact signals that disambiguate repeated mentions and reduce interference: (1) the current latent goal defining a thematic segment, (2) the action type, and (3) the salient entity types anchoring which attributes matter. During inference, STITCH filters and prioritizes memory snippets by intent compatibility, suppressing semantically similar but context-incompatible history.\n\nFor evaluation, we introduce CAME-Bench, a benchmark for context-aware retrieval in realistic, dynamic, goal-oriented trajectories. Across CAME-Bench and LongMemEval, STITCH achieves state-of-the-art performance, outperforming the strongest baseline by 35.6%, with the largest gains as trajectory length increases. Our analysis shows that intent indexing substantially reduces retrieval noise, supporting intent-aware memory for robust long-horizon reasoning.'", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Agentic Memory", "Context-Aware Retrieval", "Long-Horizon Reasoning", "Retrieval Cues", "Large Language Model Agents"], "openreview_url": "https://openreview.net/forum?id=7FigeE9Zyl", "contribution_types": ["Engineering", "Dataset"]}, {"id": "JwjKOq3fvQ", "title": "When Tone and Words Disagree: Towards Robust Speech Emotion Recognition under Acoustic-Semantic Conflict", "abstract": "Speech Emotion Recognition (SER) systems often assume congruence between vocal emotion and lexical semantics. However, in real-world interactions, acoustic-semantic conflict is common yet overlooked, where the emotion conveyed by tone contradicts the literal meaning of spoken words. We show that state-of-the-art SER models, including ASR-based, self-supervised learning (SSL) approaches and Audio Language Models (ALMs), suffer performance degradation under such conflicts due to semantic bias or entangled acoustic–semantic representations. To address this, we propose the **Fusion Acoustic-Semantic (FAS)** framework, which explicitly disentangles acoustic and semantic pathways and bridges them through a lightweight, query-based attention module. To enable systematic evaluation, we introduce the **Conflict in Acoustic-Semantic Emotion(CASE)**, the first dataset dominated by clear and interpretable acoustic-semantic conflicts in varied scenarios. Extensive experiments demonstrate that FAS consistently outperforms existing methods in both in-domain and zero-shot settings. Notably, on the CASE benchmark, conventional SER models fail dramatically, while FAS sets a new SOTA with 59.38\\% accuracy. Our code and datasets is available at https://anonymous.4open.science/r/FAS-Anonymous.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/FAS-030Anonymous.", "https://anonymous.4open.science/r/FAS-Anonymous"], "keywords": ["speech emotion recognition", "acoustic-semantic conflict"], "openreview_url": "https://openreview.net/forum?id=JwjKOq3fvQ", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "6jg8g3uate", "title": "DSA-Tokenizer: Disentangled Semantic-Acoustic Tokenization via Flow Matching-based Hierarchical Fusion", "abstract": "Speech tokenizers serve as the cornerstone of discrete Speech Large Language Models (Speech LLMs).\nExisting tokenizers either prioritize semantic encoding, fuse semantic content with acoustic style inseparably, or achieve incomplete semantic-acoustic disentanglement. To achieve better disentanglement, we propose $\\textbf{DSA-Tokenizer}$, which explicitly disentangles speech into discrete semantic and acoustic tokens via distinct optimization constraints. Specifically, semantic tokens are supervised by ASR to capture linguistic content, while acoustic tokens focus on mel-spectrograms restoration to encode style. To eliminate rigid length constraints between the two sequences, we introduce a hierarchical $\\textbf{Flow-Matching}$ decoder that further improve speech generation quality. Furthermore, We employ a joint reconstruction-recombination training strategy to enforce this separation. DSA-Tokenizer enables high fidelity reconstruction and flexible recombination through robust disentanglement, facilitating controllable generation in speech LLMs. Our analysis highlights disentangled tokenization as a pivotal paradigm for future speech modeling. Audio samples are avaialble at $\\url{https://anonymous.4open.science/w/DSA_Tokenizer_demo/}$. The code and model will be made publicly available after the paper has been accepted.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/w/DSA_Tokenizer_demo"], "keywords": ["Speech Tokenizer", "Speech LLM", "Disentangle", "Reconstrucion", "Recombination"], "openreview_url": "https://openreview.net/forum?id=6jg8g3uate", "contribution_types": []}, {"id": "8gmRWPNceT", "title": "Agentic Parallel Thinking for Deep Information Seeking", "abstract": "Parallel thinking broadens exploration and complements deep information-seeking (IS) agents, but in this setting it is hindered by redundant from-scratch rollouts and context-limited answer generation that cannot reliably integrate long-horizon trajectories.\nTo address these issues, we propose ParallelMuse, a two-stage inference-only paradigm designed for deep IS agents. The first stage, Functionality-Specified Partial Rollout, partitions generated sequences into functional regions and performs uncertainty-guided path reuse and branching to enhance exploration efficiency. The second stage, Compressed Reasoning Aggregation, exploits reasoning redundancy to losslessly compress information relevant to answer derivation and synthesize a coherent final answer. Experiments across multiple open-source agents and benchmarks demonstrate up to 62% performance improvement with a 10--30% reduction in exploratory token consumption.", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information Seeking", "Open-Domain Question Answering", "LLM Agents", "Parallel Thinking"], "openreview_url": "https://openreview.net/forum?id=8gmRWPNceT", "contribution_types": ["Engineering"]}, {"id": "tNBlZoH5HB", "title": "Nested Browser-Use Learning for Agentic Information Seeking", "abstract": "Information-seeking (IS) agents have achieved strong performance across a range of wide and deep search tasks, yet their tool use remains largely restricted to API-level snippet retrieval and URL-based page fetching, limiting access to the richer information available through real browsing. While full browser interaction could unlock deeper capabilities, its fine-grained control and verbose page content returns introduce substantial complexity for ReAct-style function-calling agents. To bridge this gap, we propose Nested Browser-Use Learning (NestBrowse), which introduces a minimal and complete browser-action framework that decouples interaction control from page exploration through a nested structure. This design simplifies agentic reasoning while enabling effective deep-web information acquisition. Empirical results on challenging deep IS benchmarks demonstrate that NestBrowse offers clear benefits in practice. Further in-depth analyses underscore its efficiency.", "area": "Question Answering", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information Seeking", "Open-Domain Question Answering", "LLM Agents", "Browser Use"], "openreview_url": "https://openreview.net/forum?id=tNBlZoH5HB", "contribution_types": ["Engineering"]}, {"id": "sys6P5vdcA", "title": "LLMs Can't Play Hangman: On the Necessity of a Private Working Memory for Language Agents", "abstract": "As LLMs move from text completion toward autonomous agents, they remain constrained by the standard chat interface, which lacks private working memory. This raises a fundamental question: can agents reliably perform interactive tasks that depend on hidden state?\nWe define Private State Interactive Tasks (PSITs), which require agents to generate and maintain hidden information while producing consistent public responses. We show theoretically that any agent restricted to the public conversation history cannot simultaneously preserve secrecy and consistency in PSITs, yielding an impossibility theorem.\nTo empirically validate this limitation, we introduce a self-consistency testing protocol that evaluates whether agents can maintain a hidden secret across forked dialogue branches. Standard chat-based LLMs and retrieval-based memory baselines fail this test regardless of scale, demonstrating that semantic retrieval does not enable true state maintenance. To address this, we propose a novel architecture incorporating an explicit private working memory; we demonstrate that this mechanism restores consistency, establishing private state as a necessary component for interactive language agents. Our code is available at https://anonymous.4open.science/r/Hangman-6B6F.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Hangman-6B6F"], "keywords": ["Large Language Models", "AI Agents", "Memory Agents", "Private Working Memory", "Private State Interactive Tasks (PSITs)", "State Persistence"], "openreview_url": "https://openreview.net/forum?id=sys6P5vdcA", "contribution_types": ["Analysis", "Engineering", "Dataset", "Theory"]}, {"id": "G2BRF0szEL", "title": "UniDoc-Bench: A Unified Benchmark for Document-Centric Multimodal RAG", "abstract": "Multimodal retrieval-augmented Generation (MM-RAG) is a key approach for applying large language models (LLMs) and agents to real-world knowledge bases, yet current evaluations are fragmented—focusing on either text or images in isolation, or simplified multimodal setup, failing to capture document-centric multimodal use cases.\nIn this paper, we introduce UniDoc-Bench, the first large-scale, realistic benchmark for MM-RAG built from $70$k real-world PDF pages across $8$ domains.\nOur pipeline extracts and links evidence from text, tables, and\nfigures, then generates $1,600$ multimodal QA pairs spanning factual retrieval, comparison, summarization, and logical reasoning queries. \nTo ensure reliability, all of QA pairs\nare validated by multiple human annotators and expert adjudication.\nUniDoc-Bench supports apples-to-apples comparison across four paradigms --- 1) text-only, 2) image-only, 3) \\emph{multimodal} text–image fusion and 4) \\emph{multimodal} joint retrieval --- under a unified protocol with standardized candidate pools, prompts, and evaluation metrics. \nUniDoc-Bench can also be used to evaluate Visual Question Answering (VQA) tasks.\nOur experiments show that multimodal text–image fusion RAG systems consistently outperform both unimodal and jointly multimodal embedding–based retrieval, indicating that neither text nor images alone are sufficient and that current multimodal embeddings remain inadequate. Beyond benchmarking, our analysis reveals when and how visual context complements textual evidence, uncovers systematic failure modes, and offers actionable guidance for developing more robust MM-RAG pipelines.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["multimodal", "evaluation", "vqa", "RAG", "LLMs"], "openreview_url": "https://openreview.net/forum?id=G2BRF0szEL", "contribution_types": ["Dataset"]}, {"id": "eNVst3cWDN", "title": "SDAR: A Synergistic Diffusion-AutoRegression Paradigm for Scalable Sequence Generation", "abstract": "Autoregressive (AR) language modeling remains the dominant paradigm due to its dense supervision signal and highly optimized serving infrastructure, but its strictly causal, token-by-token decoding limits parallelism and non-causal modeling. \nWhile masked diffusion offers a promising path toward parallel generation, it faces two critical bottlenecks: training inefficiency stemming from sparse masked objectives, and high latency caused by iterative whole-sequence denoising.\nWe present a systematic study of blockwise discrete diffusion, a pragmatic middle ground that preserves AR-compatible serving while enabling parallel intra-block generation.\nOur study proceeds in four steps:\n(i) a \\textbf{controlled, compute- and scale-matched comparison} revealing that AR is a more effective backbone for blockwise hybrids than masked diffusion objectives;\n(ii) a \\textbf{scalable conversion recipe, \\textsc{SDAR}}, validating that AR models spanning 1.7B to 30B parameters can be adapted into block diffusion models with minimal compute while preserving backbone capabilities; and\n(iii) a \\textbf{systematic characterization of decoding dynamics},\nwhich reveals a virtuous cycle where larger models enable more aggressive parallel decoding, achieving {theoretical speedups over 5$\\times$} and {wall-clock speedups of 2.3$\\times$} on H200 GPUs in latency-critical regimes; and\n(iv) an \\textbf{investigation of local non-causal modeling capabilities}, showing that SDAR's local bidirectional attention overcomes causal bottlenecks in scientific domains (e.g., chemistry) and enables robust test-time scaling. \nWe release the full model suite, the training framework, and our inference engines for further innovation in non-autoregressive generative paradigms.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Discrete Diffusion", "Blockwise Parallel Decoding", "Inference Acceleration", "Test-Time Scaling"], "openreview_url": "https://openreview.net/forum?id=eNVst3cWDN", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "ycphNnKfxs", "title": "Translation or Recitation? Calibrating Evaluation Scores for Machine Translation of Extremely Low-Resource Languages", "abstract": "The landscape of extremely low-resource machine translation (MT) is characterized by perplexing variability in reported performance, often making results across different language pairs difficult to contextualize. For researchers focused on specific language groups—such as ancient languages—it is nearly impossible to determine if breakthroughs reported in other contexts (e.g., African or American languages) result from superior methodologies or are merely artifacts of benchmark collection. To address this, we introduce the \\textbf{FRED Difficulty Metrics}—\\textit{Fertility Ratio (F)}, \\textit{Retrieval Proxy} ($R$) \\textit{Pre-training Exposure} ($E$) and \\textit{Corpus Diversity} ($D$) —that serve as dataset-intrinsic metrics to contextualize reported scores. Our findings reveal that a significant portion of result variability is explained by train-test overlap and pre-training exposure rather than model capability. Additionally, we identify that underperforming XLR languages—particularly extinct and non-Latin indigenous languages—suffer from poor tokenization coverage (high token fertility), highlighting structural limitations of transfer learning for languages outside pre-trained models' representation space. By providing these indices alongside performance scores, we enable more transparent evaluation of cross-lingual transfer and provide a more reliable foundation for the XLR MT community.", "area": "Low-resource Methods for NLP", "paper_type": "Short", "has_code": true, "code_links": ["https://anonymous.4open.science/r/analysis-loresMT-209C", "https://anonymous.4open.science/r/analysis-loresMT-209C01020304050607080chrFScoreZulu"], "keywords": ["low reosurce machine translation dataset analysis"], "openreview_url": "https://openreview.net/forum?id=ycphNnKfxs", "contribution_types": ["Analysis", "Low-resource", "Data Analysis"]}, {"id": "1LzZXv3Pi2", "title": "SPEC-RL: Accelerating On-Policy Reinforcement Learning with Speculative Rollouts", "abstract": "Large Language Models (LLMs) increasingly rely on reinforcement learning with verifiable rewards (RLVR) to elicit reliable chain-of-thought reasoning. However, the training process remains bottlenecked by the computationally expensive rollout stage. Existing acceleration methods—such as parallelization, objective- and data-driven modifications, and replay buffers—either incur diminishing returns, introduce bias, or overlook redundancy across iterations. We identify that rollouts from consecutive training epochs frequently share a large portion of overlapping segments, wasting computation. To address this, we propose **SPEC-RL**, a novel framework that integrates **SPEC**ulative decoding with the **RL** rollout process. SPEC-RL reuses prior trajectory segments as speculative prefixes and extends them via a draft-and-verify mechanism, avoiding redundant generation while ensuring policy consistency. Experiments on diverse math reasoning and generalization benchmarks, including AIME24, MATH-500, OlympiadBench, MMLU-STEM, and others, demonstrate that SPEC-RL reduces rollout time by 2–3× without compromising policy quality. As a purely rollout-stage enhancement, SPEC-RL integrates seamlessly with mainstream algorithms (e.g., PPO, GRPO, DAPO), offering a general and practical path to scale RLVR for large reasoning models. Code will be released upon acceptance.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["RLVR", "Speculative Decoding"], "openreview_url": "https://openreview.net/forum?id=1LzZXv3Pi2", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "nUIPqVbus0", "title": "IRIS: Intent Resolution via Inference-time Saccades for Open-Ended VQA in Large Vision-Language Models", "abstract": "Vision-Language Models (VLMs) have demonstrated remarkable capabilities in Visual Question Answering (VQA), yet they often struggle with referential ambiguity when multiple objects in an image could satisfy a given query. We introduce IRIS (Intent Resolution via Inference-time Saccades), a novel training-free approach that uses eye-tracking data in real-time to resolve ambiguity in open-ended VQA. Through a comprehensive user study with 500 unique image-question pairs, we demonstrate that fixations closest to the time participants start verbally asking their questions are the most informative for disambiguation in Large VLMs, more than doubling the accuracy of responses on ambiguous questions (from 35.2\\% to 77.2\\%) while maintaining performance on unambiguous queries. We evaluate our approach across state-of-the-art VLMs, showing consistent improvements when gaze data is incorporated in ambiguous image-question pairs, regardless of architectural differences. We release a new benchmark dataset to use eye movement data for disambiguated VQA, a novel real-time interactive protocol, and an evaluation suite.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["IRIS", "eye-tracking", "human gaze", "fixations", "scanpaths", "multimodal large language models"], "openreview_url": "https://openreview.net/forum?id=nUIPqVbus0", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "SraVYcq6Do", "title": "d-TreeRPO: Towards More Reliable Policy Optimization for Diffusion Language Models", "abstract": "Reinforcement learning (RL) is pivotal for enhancing the reasoning capabilities of diffusion large language models (dLLMs). However, existing dLLM policy optimization methods suffer from two critical reliability bottlenecks: (1) reward sparsity, arising from coarse or unverifiable signals that impede accurate advantage calculation; and (2) their probability estimates do not account for the gap to the unbiased expectation over all decoding orders, which are intractable to compute. To mitigate these issues, we propose \\emph{d}-TreeRPO, a reliable RL framework for dLLMs that leverages tree-structured rollouts and bottom-up advantage computation based on verifiable outcome rewards to provide fine-grained and verifiable step-wise reward signals. Furthermore, we provide a theoretical proof demonstrating that increasing prediction confidence effectively minimizes the gap between unbiased expected prediction probabilities and its single-step forward pass estimate. Guided by this analysis, we introduce a time-scheduled self-distillation loss during training that enhances prediction confidence in later training stages, thereby enabling more accurate probability estimation and better performance. Experiments demonstrate that \\emph{d}-TreeRPO outperforms existing baselines and achieves significant improvements across multiple reasoning benchmarks. Specifically, it achieves +86.2% on Sudoku, +51.6% on Countdown, +4.5% on GSM8K, and +5.3% on Math500 compared to the base model. Code and checkpoints are available in anonymous repositories.", "area": "ML for NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/d-treerpo-submit-BD8F"], "keywords": ["diffusion large language models", "reinforcement learning", "reliability"], "openreview_url": "https://openreview.net/forum?id=SraVYcq6Do", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Data Analysis"]}, {"id": "AeU8Eoq5KS", "title": "MAViS2: A Multi-Agent Framework for Interactive and Adaptive Long-Sequence Video Storytelling", "abstract": "Existing long-sequence video generation frameworks often overlook scriptwriting, rely on a fixed T2I+I2V paradigm, lack post-production support, and offer limited user interaction, resulting in poor viewing experience and limited user controllability. To address these limitations, we propose MAViS2, a multi-agent framework for interactive and adaptive long-sequence video storytelling. MAViS2 decomposes the video creation process into three coordinated stages: scriptwriting, video clip generation, and post-production, each handled by multiple specialized agents. In the scriptwriting stage, we propose a Scriptwriting Workflow that progressively improves the expressiveness of the scripts. In the video generation stage, MAViS2 uses Adaptive Generation Planning to select an appropriate generation strategy for each shot and dynamically adjusts it based on the global memory and the evaluation of generated results, thereby significantly increasing visual diversity while reducing constraints on scriptwriting. In the post-production stage, MAViS2 integrates basic video editing, voice-over synthesis, background music matching, and subtitle composition to improve the completeness of the final output. Moreover, MAViS2 natively supports Fine-grained Human-in-the-loop Control, allowing users to intervene and make fine-grained adjustments at any stage, thereby flexibly exploring diverse visual narratives and creative directions. Experimental results show that MAViS2 outperforms existing methods in terms of visual quality, narrative coherence, and overall viewing experience. MAViS2 offers a novel solution for long-sequence video storytelling and is capable of performing a wide range of storytelling tasks, including end-to-end generation, video understanding, Wikipedia-based external knowledge retrieval, prequel and sequel creation, and video remaking.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Video Generation", "Multi-modal Language Model Agent", "Long-Sequence Video Storytelling", "Video Agent", "Human-in-the-loop"], "openreview_url": "https://openreview.net/forum?id=AeU8Eoq5KS", "contribution_types": ["Engineering"]}, {"id": "Bf7rPlNqcr", "title": "Mixup Model Merge: A Geometric Exploration of Task-Vector Space for Decoupled Model Merging", "abstract": "Model merging integrates distinct task-specific capabilities into a unified model without the cost of retraining. We observe that prevailing methods largely focus on resolving parameter-level conflicts while overlooking a macroscopic geometric constraint: they typically assign uniform weights that lock the merging direction, allowing variation only in magnitude. We posit that this rigid constraint prevents the discovery of optimal solutions in the parameter space. In this work, we introduce Mixup Model Merge (M$^3$), a framework designed to navigate this unexplored geometry by decoupling the exploration of merging direction (via interpolation coefficients) and magnitude (via a scaling factor). By utilizing randomized linear interpolation, M$^3$ systematically probes the continuous task-vector space to identify low-loss merging configurations. Empirical results on three task-specific LLMs reveal that this simple geometric exploration significantly outperforms complex conflict-resolution baselines. Moreover, M$^3$ demonstrates superior generalization, substantially enhancing out-of-distribution and adversarial robustness on benchmarks such as LiveBench and PromptBench. Notably, M$^3$ is orthogonal to sparsification techniques like DARE, unlocking further performance improvements when combined.", "area": "ML for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Model Merging", "Large Language Models", "Task Vectors", "Geometric Exploration", "Parameter Interpolation"], "openreview_url": "https://openreview.net/forum?id=Bf7rPlNqcr", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "tT3QBNJMeG", "title": "RepoDistill: Distilling Repository Knowledge through Compression-Aware Budget Allocation and Policy Optimization", "abstract": "Large Language Models (LLMs) have achieved strong performance on many code-related tasks, yet they still struggle with repository-level scenarios where reasoning depends on long, noisy, and structurally complex contexts. While existing retrieval methods, including both similarity-based and graph-based approaches, can identify relevant code snippets, they often retrieve excessive contexts that intensify the \"lost-in-the-middle\" phenomenon and dilute model attention with redundant contexts. To address this, we present RepoDistill, a novel framework that integrates retrieval with learned budget allocation for fine-grained context compression. RepoDistill first employs a plug-and-play lightweight GraphRAG to retrieve context that follows logical flows. It then applies Compression-Aware Budget Allocation guided by Compression-Aware Policy Optimization, which formulates context management as a multi-step decision problem and learns allocation policies for contexts. Experiments show that RepoDistill outperforms baselines, achieving gains of up to +7.00 on SWE-QA, +24.4% on CoderEval, and +0.25 on LongCodeU. Furthermore, a compact 4B-parameter model trained with RepoDistill can serve as an effective context compressor for closed-source LLMs, reducing input tokens by up to 66\\% while maintaining comparable performance. We release our code at https://anonymous.4open.science/r/RepoDistill-12B0.", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/RepoDistill-6CE3"], "keywords": ["Large Language Model", "Code Repository", "Long-Code Understanding"], "openreview_url": "https://openreview.net/forum?id=tT3QBNJMeG", "contribution_types": []}, {"id": "AQXGC79WTY", "title": "Chain-in-Tree: Back to Sequential Reasoning in LLM Tree Search", "abstract": "Test-time scaling improves large language models (LLMs) on long-horizon reasoning tasks by allocating more compute at inference.\nLLM inference via tree search (LITS) achieves strong performance but is highly inefficient. We propose Chain-in-Tree (CiT), a plug-in framework that decides when to branch during search instead of expanding at every step.\nCiT introduces lightweight Branching Necessity (BN) evaluations, including BN-DP (direct prompting) and BN-SC (self-consistency). Integrated into Tree of Thoughts, ReST-MCTS, and RAP, BN-DP reduces token generation, model calls, and runtime by 75-85% on GSM8K and Math500, with often negligible or no accuracy loss.\nBN-SC typically yields substantial savings (up to 80%) generally but shows instability in 1-4 out of 14 settings, caused by a small subset of examples that produce extremely long reasoning steps. We theoretically prove that BN-DP never increases policy invocations and release unified implementations applicable across LITS frameworks.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM reasoning", "tree search", "test-time scaling", "efficient inference"], "openreview_url": "https://openreview.net/forum?id=AQXGC79WTY", "contribution_types": ["Engineering", "Efficiency", "Theory"]}, {"id": "0ni0z8Ttg6", "title": "RealFin: Benchmarking Agent Skills for Multi-Tool Orchestration under Tool Explosion", "abstract": "Large language models are increasingly moving from answering questions to acting as agents that plan actions, call tools and operate in external environments. Solving tasks in these settings requires constructing and executing multi step workflows rather than producing a single response. The key difficulty lies not only in computation but in choosing appropriate tools and organizing them into effective workflows, since realistic environments contain many tools with related yet non identical functions and several plausible solution paths may coexist for the same task. However, many existing benchmarks primarily emphasize static question answering and final outputs, often using simplified tool environments and short workflows, which provides limited visibility into how tools are chosen and workflows are executed. A natural direction is therefore to evaluate agents through the processes they carry out in realistic environments where overlapping tools and genuine workflows are present. We introduce \\textsc{RealFin} to support this direction. \\textsc{RealFin} contains tasks derived from authentic financial analysis workflows, pairs each task with an executable reference program and operates in realistic multi tool environments while recording execution traces. It enables joint evaluation of outcomes and execution behavior and supports process oriented assessment of tool choice, workflow organization and temporal grounding in addition to answer accuracy.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Agentic LLMs;Tool-augmented;Financial Benchmark;Tool Explosion"], "openreview_url": "https://openreview.net/forum?id=0ni0z8Ttg6", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "0B54Zxpr9b", "title": "Diabetica: Developing Specialized Large Language Models for Diabetes Care with Multi-Faceted Benchmarks and Clinical Validation", "abstract": "Diabetes is a chronic disease with a significant global health burden, where the effectiveness of Large Language Models (LLMs) across diverse diabetes tasks remains unproven. To address this, we introduce a comprehensive framework for developing and evaluating diabetes-specialized LLMs. Our methodology begins with systematically collecting unstructured diabetes-related data from sources like clinical guidelines and medical textbooks. This data then undergoes rigorous processing, including filtering, transformation, and refinement via a novel self-distillation approach, to produce a high-quality training dataset and a multi-faceted benchmarking suite. Leveraging this training dataset, the model we obtain, Diabetica, significantly outperforms existing open-source LLMs of comparable size across diabetes-specific benchmarks, including multiple choice questions, fill-in-the-blank assessments, and open-ended dialogue scenarios. To demonstrate real-world applicability, we conduct extensive clinical assessments in three key use cases: medical counseling, medical education, and record summarization. \nResults reveal that Diabetica provides more thorough and empathetic patient responses than human physicians, achieves expert-level performance in medical examinations, and significantly improves clinical documentation efficiency while maintaining high quality.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models for Diabetes Care", "Benchmarks Construction", "Clinical Assessments"], "openreview_url": "https://openreview.net/forum?id=0B54Zxpr9b", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "fUheAlx3i8", "title": "Generation-Augmented Generation: A Plug-and-Play Framework for Private Knowledge Injection in Large Language Models", "abstract": "In domains such as biomedicine, materials, and finance, high-stakes deployment of large language models (LLMs) requires injecting private, domain-specific knowledge that is proprietary, fast-evolving, and under-represented in public pretraining. However, the two dominant paradigms for private knowledge injection each have pronounced drawbacks: fine-tuning is expensive to iterate, and continual updates risk catastrophic forgetting and general-capability regression; retrieval-augmented generation (RAG) keeps the base model intact but is brittle in specialized private corpora due to chunk-induced evidence fragmentation, retrieval drift, and long-context pressure that yields query-dependent prompt inflation. Inspired by how multimodal LLMs align heterogeneous modalities into a shared semantic space, we propose **Generation-Augmented Generation (GAG)**, which treats private expertise as an additional expert modality and injects it via a compact, representation-level interface aligned to the frozen base model, avoiding prompt-time evidence serialization while enabling plug-and-play specialization and scalable multi-domain composition with reliable selective activation. Across two private scientific QA benchmarks (immunology adjuvant and catalytic materials) and mixed-domain evaluations, GAG improves specialist performance over strong RAG baselines by **15.34%** and **14.86%** on the two benchmarks, respectively, while maintaining performance on six open general benchmarks and enabling near-oracle selective activation for scalable multi-domain deployment.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Private Knowledge Injection", "Plug-and-Play", "Retrieval-free Augmentation"], "openreview_url": "https://openreview.net/forum?id=fUheAlx3i8", "contribution_types": ["Analysis", "Engineering"]}, {"id": "jxkveOzjI9", "title": "Follow the Path: Reasoning over Knowledge Graph Paths to Improve Large Language Model Factuality", "abstract": "We introduce fs1, a simple yet effective method that improves the factuality of reasoning traces by sourcing them from large reasoning models and grounding them by conditioning on knowledge graph (KG) paths. We fine-tune eight instruction-tuned Large Language Models (LLMs) on 3.9K factually grounded reasoning traces and rigorously evaluate them on six complex open-domain question-answering (QA) benchmarks encompassing 23.9K questions. Our results demonstrate that our fs1-tuned model consistently outperforms instruction-tuned counterparts with parallel sampling by 6-14 absolute points (pass@$16$). Our detailed analysis shows that fs1 considerably improves model performance over more complex questions (requiring 3 or more hops on KG paths) and numerical answer types compared to the baselines. Furthermore, in single-pass inference, we notice that smaller LLMs show the most improvements. While prior works demonstrate the effectiveness of reasoning traces primarily in the STEM domains, our work shows strong evidence that anchoring reasoning to factual KG paths is a critical step in transforming LLMs for reliable knowledge-intensive tasks.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/fs1-3C18"], "keywords": ["large language models", "reasoning", "factuality", "knowledge graphs"], "openreview_url": "https://openreview.net/forum?id=jxkveOzjI9", "contribution_types": ["Engineering", "Dataset"]}, {"id": "RJs68VZgRM", "title": "Binary Patch Encoding for Numerically Intensive Scientific Computing with Large Language Models", "abstract": "Despite the revolutionary success of large language models (LLMs) in natural language processing and task agents, their application to real-world scientific problems—particularly in domains involving large-scale numerical data—remains challenging. This limitation stems primarily from the inefficiency of the Byte-Pair-Encoding (BPE) method when handling numerical data. To address this gap, we propose a binary patch encoding method and integrate it into an LLM architecture named BigBang-Neutron, which can efficiently process mixed textual and large-scale numerical datasets. We demonstrate the efficacy of our method on Jet Origin Identification (JoI), a critical categorization task in high-energy physics that distinguishes jets originating from different quarks or gluons, which is one of the number-intensive classification problems in particle physics. Experimental results show that BigBang-Neutron achieves performance comparable to state-of-the-art task-specific JoI models. Furthermore, we investigate the scaling behavior of BigBang-Neutron’s performance with increasing data volume, indicating its potential to serve as a foundational model for particle physics data analysis and holds promise for extension to a broad range of scientific computing applications. The project code is publicly available on GitHub, which will be provided after the manuscript is accepted.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Tokenization", "Tokenizer", "LLM", "Patch Encoding", "Scaling Behavior", "Scientific Computing"], "openreview_url": "https://openreview.net/forum?id=RJs68VZgRM", "contribution_types": ["Engineering", "Data Analysis"]}, {"id": "pK6xcBiDuB", "title": "CodeHacker: Automated Test Case Generation for Detecting Vulnerabilities in Competitive Programming Solutions", "abstract": "The evaluation of Large Language Models (LLMs) for code generation relies heavily on the quality and robustness of test cases. However, existing benchmarks often lack coverage for subtle corner cases, allowing incorrect solutions to pass. To bridge this gap, we propose CodeHacker, an automated agent framework dedicated to generating targeted adversarial test cases that expose latent vulnerabilities in program submissions. \nMimicking the hack mechanism in competitive programming, CodeHacker employs a multi-strategy approach—including stress testing, anti-hash attacks, and logic-specific targeting to break specific code submissions. \nTo ensure the validity and reliability of these attacks, we introduce a Calibration Phase, where the agent iteratively refines its own Validator and Checker via self-generated adversarial probes before evaluating contestant code.\nExperiments demonstrate that CodeHacker significantly improves the True Negative Rate (TNR) of existing datasets, effectively filtering out incorrect solutions that were previously accepted. Furthermore, generated adversarial cases prove to be superior training data, boosting the performance of RL-trained models on benchmarks like LiveCodeBench. All code, datasets, and evaluation scripts will be open-sourced to promote further investigation in LLMs for competitive programming.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Agents", "Automated Test Case Generation", "Code Vulnerability Detection", "Adversarial Robustness", "Code Reasoning", "Benchmark Construction"], "openreview_url": "https://openreview.net/forum?id=pK6xcBiDuB", "contribution_types": ["Engineering", "Data Analysis"]}, {"id": "9AjWSeaXX1", "title": "Learning from the Irrecoverable: Error-Localized Policy Optimization for Tool-Integrated LLM Reasoning", "abstract": "Tool-integrated reasoning (TIR) enables LLM agents to solve tasks through planning, tool use, and iterative revision, but outcome-only reinforcement learning in this setting suffers from sparse, delayed rewards and weak step-level credit assignment.\nIn long-horizon TIR trajectories, an early irrecoverable mistake can determine success or failure, making it crucial to localize the first irrecoverable step and leverage it for fine-grained credit assignment.\nWe propose Error-Localized Policy Optimization (ELPO), which localizes the first irrecoverable step via binary-search rollout trees under a fixed rollout budget, converts the resulting tree into stable learning signals through hierarchical advantage attribution, and applies error-localized adaptive clipping to strengthen corrective updates on the critical step and its suffix.\nAcross TIR benchmarks in math, science QA, and code execution, ELPO consistently outperforms strong Agentic RL baselines under comparable sampling budgets, with additional gains in Pass@K and Major@K scaling, rollout ranking quality, and tool-call efficiency.\nOur code is publicly released for reproducibility at https://anonymous.4open.science/r/ELPO-7C19.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ELPO-7C19"], "keywords": ["Agentic Reinforcement Learning", "Tool Integrated Reasoning", "Credit Assignment"], "openreview_url": "https://openreview.net/forum?id=9AjWSeaXX1", "contribution_types": ["Analysis", "Engineering"]}, {"id": "1hBysayr2G", "title": "TeamFusion: Supporting Open-ended Team Decisions with Multi-Agent Systems", "abstract": "In open-ended domains, teams must reconcile diverse viewpoints to produce strong deliverables. Answer aggregation approaches commonly used in closed domains are ill-suited to this setting, as they tend to suppress minority perspectives rather than resolve underlying disagreements.\nWe present TeamFusion, a multi-agent system designed to support teamwork in open-ended domains by: 1. Instantiating a proxy agent for each team member conditioned on their expressed preferences; 2. Conducting a structured discussion to elicit agreements and disagreements; and 3. Synthesizing more consensus-oriented deliverables that feed into new iterations of discussion and synthesis.\nWe evaluate TeamFusion on two teamwork tasks where team members can judge how well their individual views are represented in team decisions and how consensually good the final deliverables are, finding that it outperforms direct aggregation baselines across metrics, tasks, and team configurations.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Team decision support", "Open ended tasks", "LLM agents", "Human-AI interaction"], "openreview_url": "https://openreview.net/forum?id=1hBysayr2G", "contribution_types": ["Engineering"]}, {"id": "1R2Ry6cl2C", "title": "Scaling Behaviors of LLM Reinforcement Learning Post-Training: An Empirical Study in Mathematical Reasoning", "abstract": "While scaling laws for large language models (LLMs) during pre-training have been extensively studied, their behavior under reinforcement learning (RL) post-training remains largely unexplored. This paper investigates the scaling behavior of Large Language Model (LLM) reinforcement learning post-training, focusing on mathematical reasoning. Through experiments across the Qwen2.5 series (0.5B to 72B), we characterize how model scale, data, and compute interact. Our analysis yields four key findings: 1. Larger models consistently demonstrate superior compute and data efficiency. 2. The relationship between model performance and training resources follows a **predictive power-law** across both base and instruction-tuned models. 3. RL learning efficiency exhibits a latent **saturation trend** with increasing model scale. 4. In data-constrained regimes, performance is primarily driven by the **total volume of training data** rather than sample uniqueness. These results offer practical guidelines for scaling reasoning capabilities through reinforcement learning post-training.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["large language model", "neural scaling law", "reinforcement learning", "LLM reasoning"], "openreview_url": "https://openreview.net/forum?id=1R2Ry6cl2C", "contribution_types": ["Analysis", "Engineering", "Reproduction"]}, {"id": "TQnK1lOcJ4", "title": "Preference Learning Unlocks LLMs’ Psycho-Counseling Skills", "abstract": "Applying large language models (LLMs) to assist in psycho-counseling is an emerging and meaningful approach, driven by the significant gap between patient needs and the availability of mental health support. However, current LLMs struggle to consistently provide effective responses to client speeches, largely due to the lack of supervision from high-quality real psycho-counseling data, whose content is typically inaccessible due to client privacy concerns. Furthermore, the quality of therapists’ responses in available sessions can vary significantly based on their professional training and experience. Assessing the quality of therapists’ responses remains an open challenge.\nWe address these challenges by first proposing a set of professional and comprehensive principles to evaluate therapists’ responses to client speeches. Using these principles, we create a **Psy**cho-**Co**unseling **Pref**erence dataset, **PsyCoPref**, which contains 36k high-quality preference comparison pairs. This dataset aligns with the preferences of professional psychotherapists, providing a robust foundation for evaluating and improving LLMs in psycho-counseling. Experiments on reward modeling and preference learning demonstrate that PsyCoPref is an excellent resource for LLMs to acquire essential skills for responding to clients in a counseling session. Our best-aligned model achieves an impressive win rate of 87% against GPT-4o.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Model", "Preference Learning", "Psycho-Counseling"], "openreview_url": "https://openreview.net/forum?id=TQnK1lOcJ4", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "w3z7ZgQhSW", "title": "Analyzing and Internalizing Complex Policy Documents for LLM Agents", "abstract": "Large language model agents rely on in-context policy documents encoding diverse business rules. As businesses scale, these documents grow, creating substantial computational overhead and motivating internalization methods that embed policy into model priors. Prior work focuses on generic prompts, but we find agentic policies span multiple complexity levels and demand heavier reasoning, posing greater challenges. We introduce an agentic benchmark generator with Controllable Complexity in agent policy across four levels, enabling systematic evaluation of agents under increasing complexity and providing a testbed for policy internalization. Our analysis shows that workflow-governing policy specifications are the hardest to reason over, and that SFT on gold trajectories with chain-of-thought is data-hungry and struggles at high complexity. We propose  Category-Aware Policy Continued Pretraining, an automated pipeline that analyzes policies, extracts key specifications, categorizes them into factual, behavioral, and conditional types, and isolates those driving workflow complexity. This enables targeted “therapy” by synthesizing specialized training data for each type and improving internalization via an autoregressive pretraining loss. Extensive experiments show our synthetic data and objective consistently improve performance. Combined with SFT, our method outperforms the baseline across different settings, especially in data-sparse and high-complexity regimes, with gains up to 41\\% and 22\\% on Qwen-3-32B. Overall, we achieve 97.3\\% prompt reduction on our benchmark, and on $\\tau$-Bench we further improve performance while reducing prompt requirements with very limited SFT data.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Internalize Complex Policy Documents for LLM Agents"], "openreview_url": "https://openreview.net/forum?id=w3z7ZgQhSW", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "hbs9nKL9sw", "title": "BOOKAGENT: Orchestrating Safety-Aware Visual Narratives via Multi-Agent Cognitive Calibration", "abstract": "Recent advancements in Large Generative Models (LGMs) have revolutionized multi-modal generation.\nHowever, generating illustrated storybooks remains an open challenge, where prior works mainly decompose this task into separate stages, and thus, holistic multi-modal grounding remains limited.\nBesides, while safety alignment is studied for text- or image-only generation, existing works rarely integrate child-specific safety constraints into narrative planning and sequence-level multi-modal verification.\nTo address these limitations, we propose BookAgent, a safety-aware multi-agent collaboration framework designed for high-quality, safety-aware visual narratives.\nDifferent from prior story visualization models that assume a fixed storyline sequence, BookAgent targets end-to-end storybook synthesis from a user draft by jointly planning, scripting, illustrating, and globally repairing inconsistencies.\nTo ensure precise multi-modal grounding, BookAgent dynamically calibrates page-level alignment between textual scripts and visual layouts.\nFurthermore, BookAgent calibrates holistic consistency from the temporal dimension, by verifying-then-rectifying global inconsistencies in character identity and storytelling logic.\nExtensive experiments demonstrate that BookAgent significantly outperforms current methods in narrative coherence, visual consistency, and safety compliance, offering a robust paradigm for reliable agents in complex multi-modal creation.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Agents", "Multimodel Generation"], "openreview_url": "https://openreview.net/forum?id=hbs9nKL9sw", "contribution_types": ["Analysis", "Engineering"]}, {"id": "qLoWGBSo4d", "title": "Evaluating Large Language Models on Urdu Idioms", "abstract": "We present a comprehensive evaluation of Urdu--English idiomatic translation, introducing a parallel benchmark encompassing Native and Roman Urdu across translation, paraphrasing, idiom span detection, and idiomatic back-translation. Eight prompting strategies—including literal, cultural, idiomatic, and few-shot prompts—are used to assess multiple open-source LLMs and NMT systems. Performance is evaluated using BLEU, ChrF, BERTScore, COMET, XCOMET, ROUGE, Levenshtein distance, and multilingual embedding cosine similarities (LASER, LaBSE, USE). Results indicate that LLMs outperform NMT systems in preserving idiomatic meaning, with cultural and idiomatic prompts yielding the highest semantic fidelity. Few-shot prompting further improves idiom handling. Native Urdu consistently achieves higher scores than Roman Urdu across all tasks, highlighting the influence of script on translation quality. This study provides the first multi-metric, cross-script benchmark for idiomatic Urdu--English translation, offering insights into model behavior, prompt sensitivity, and the challenges of Romanized input.", "area": "Multilinguality and Language Diversity", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["idiom translation", "low-resource MT", "automatic evaluation", "multilingual corpora", "corpus creation", "Urdu-English"], "openreview_url": "https://openreview.net/forum?id=qLoWGBSo4d", "contribution_types": ["Analysis", "Low-resource", "Dataset"]}, {"id": "flAJZreC2x", "title": "ReCode: Reinforcing Code Generation with Reasoning-Process Rewards", "abstract": "In practice, rigorous reasoning is often a key driver of correct code, while Reinforcement Learning (RL) for code generation often neglects optimizing reasoning quality. \nBringing process-level supervision into RL is appealing, but it faces two challenges. First, training reliable reward models to assess reasoning quality is bottlenecked by the scarcity of fine-grained preference data. Second, naively incorporating such neural rewards may suffer from reward hacking.\nThis work proposes ReCode(Reasoning-Reinforced Code Generation), a novel RL training framework comprising: (1) Contrastive Reasoning-Process Reward Learning (CRPL), which trains a reward model with synthesized optimized and degraded reasoning variants to assess the quality of reasoning process; and (2) Consistency-Gated GRPO (CG-GRPO), which integrates the reasoning-process reward model into RL by gating neural reasoning-process rewards with strict execution outcomes, using execution correctness as a hard gate to mitigate reward hacking.\nAdditionally, to assess the reward model’s discriminative capability in assessing reasoning-process quality, we introduce LiveCodeBench-RewardBench (LCB-RB), a new benchmark comprising preference pairs of superior and inferior reasoning processes tailored for code generation.\nExperimental results across HumanEval(+), MBPP(+), LiveCodeBench, and BigCodeBench show that a 7B model trained with ReCode outperforms the base version by 16.1% and reaches performance comparable to GPT-4-Turbo. We further demonstrate the generalizability of ReCode by extending it to the math domain.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ReasoningRL-CC6F2ReCode1352.1ContrastiveReasoning-ProcessReward136Le"], "keywords": ["Code Generation", "Reasoning Quality", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=flAJZreC2x", "contribution_types": ["Engineering", "Dataset"]}, {"id": "zfYcLd01XA", "title": "SQL-ASTRA: Alleviating Sparse Feedback in Agentic SQL via Column-Set Matching and Trajectory Aggregation", "abstract": "Agentic Reinforcement Learning (RL) shows promise for complex tasks, but Text-to-SQL remains mostly restricted to single-turn paradigms. A primary bottleneck is the credit assignment problem. In traditional paradigms, rewards are determined solely by the final-turn feedback, which ignores the intermediate process and leads to ambiguous credit evaluation. To address this, we propose Agentic SQL, a framework featuring a universal two-tiered reward mechanism designed to provide effective trajectory-level evaluation and dense step-level signals. First, we introduce Aggregated Trajectory Reward (ATR) to resolve multi-turn credit assignment. Using an asymmetric transition matrix, ATR aggregates process-oriented scores to incentivize continuous improvement. Leveraging Lyapunov stability theory, we prove ATR acts as an energy dissipation operator, guaranteeing a cycle-free policy and monotonic convergence. Second, Column-Set Matching Reward (CSMR) provides immediate step-level rewards to mitigate sparsity. By executing queries at each turn, CSMR converts binary (0/1) feedback into dense $[0, 1]$ signals based on partial correctness. Evaluations on BIRD show a 5\\% gain over binary-reward GRPO. Notably, our approach outperforms SOTA Arctic-Text2SQL-R1-7B on BIRD and Spider 2.0 using identical models, propelling Text-to-SQL toward a robust multi-turn agent paradigm.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Reinforcement Learning", "Multi-turn Agents", "Text-to-SQL", "Reward Design", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=zfYcLd01XA", "contribution_types": ["Analysis", "Engineering"]}, {"id": "uVvdFPl9e5", "title": "SGT: Securing Open-Source LLMs Against Malicious Fine-tuning via Safety Guidance Trigger", "abstract": "Open-weight large language models (LLMs) enable broad customization, but also increase exposure to post-release misuse, including malicious fine-tuning (MFT). To mitigate this risk, many prior defenses aim to improve the robustness of open-weight models to MFT by constraining adversarial fine-tuning dynamics in parameter space or mitigating harmful information encoded in internal representations. Nevertheless, since malicious fine-tuning can still erode safety, developing robust safeguards for open-weight models that fundamentally mitigate this risk remains an open research problem. In this paper, we characterize a safety region for open-weight LLMs and propose Safety Guidance Trigger (SGT), which guides fine-tuning toward the safety manifold to preserve alignment. SGT has two stages: (1) optimizing a safety trigger that steers the base model toward safe responses and (2) training the open-weight model to align its internal features with trigger-induced safety representations. We demonstrate that SGT substantially improves robustness against malicious fine-tuning, requiring adversaries to increase their data budget significantly to compromise safety. Our analysis shows that SGT anchors model representations to a safety region, which remains stable under malicious fine-tuning.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Safety_Guidance_Trigger-AC8B"], "keywords": ["Large Language Models", "AI Safety", "Safety Alignment", "Adversarial Robustness", "Open-weight Models"], "openreview_url": "https://openreview.net/forum?id=uVvdFPl9e5", "contribution_types": ["Analysis", "Engineering"]}, {"id": "gb5FcgBIuF", "title": "AirNav: A Large-Scale Real-World UAV Vision-and-Language Navigation Dataset with Natural and Diverse Instructions", "abstract": "Existing Unmanned Aerial Vehicle (UAV) Vision-Language Navigation (VLN) datasets face issues such as dependence on virtual environments, lack of naturalness in instructions, and limited scale.\nTo address these challenges, we propose AirNav, a large-scale UAV VLN benchmark constructed from real urban aerial data, rather than synthetic environments, with natural and diverse instructions.\nAdditionally, we introduce the AirVLN-R1, which combines Supervised Fine-Tuning and Reinforcement Fine-Tuning to enhance performance and generalization. \nThe feasibility of the model is preliminarily evaluated through real-world tests.\nOur dataset and code are publicly available.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AirNav-FB4C", "https://anonymous.4open.science/r/AirNav-FB4Cdiversity.Somedatasetsonlyprovidetargetde-039scriptions"], "keywords": ["Unmanned Aerial Vehicle", "Vision-and-Language Navigation", "AirNav Dataset", "Reinforcement Fine-Tuning", "Real-World Testing"], "openreview_url": "https://openreview.net/forum?id=gb5FcgBIuF", "contribution_types": ["Engineering", "Reproduction", "Dataset", "Data Analysis"]}, {"id": "kt7AVrmKYX", "title": "Diverse Thinking: Breaking Oppositions in Debates to Foster Synergized Reasoning via Multi-Agent Collaboration", "abstract": "Large Language Models (LLMs) frequently face limitations, such as judgment biases and cognitive deadlocks, in complex reasoning due to “Degradation of Thought” in self-reflection. While Multi-Agent Debate (MAD) approaches attempt to address this issue, their inherently adversarial nature suppresses diverse perspectives by overemphasizing antagonism, which results in the loss of partially valid reasoning. In this paper, we propose Multi-Agent Diverse Thinking (MADT), a novel cognitive framework that redefines multi-agent collaboration by shifting from adversarial confrontation toward constructive synergy. To break the oppositional deadlock found in traditional debates, MADT decomposes the thinking process into fine-grained modules: an Affirmative Thinker to preserve rational components, a Critical Thinker to rectify errors, and a Growth-Minded Thinker to provide optimization suggestions. These agents jointly foster a synergistic environment where specialized roles protect valid logic while iteratively refining flaws. Meanwhile, a Leader agent coordinates the collaborations and synthesizes the feedback from multiple thinkers to produce the final result. Extensive experiments on Common Machine Translation and Counter-Intuitive Arithmetic Reasoning tasks show that MADT consistently outperforms Self-Reflection and MAD baselines, validating the superior ability to enhance complex logical and reasoning performance in LLMs. Code is available at https://anonymous.4open.science/r/MADT-5D3B.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MADT-5D3B", "https://anonymous.4open.science/r/MADT-5D3B."], "keywords": ["multi-agent diverse thinking (MADT)", "multi-agent collaboration", "complex reasoning", "machine translation"], "openreview_url": "https://openreview.net/forum?id=kt7AVrmKYX", "contribution_types": ["Analysis", "Engineering", "Theory"]}, {"id": "61pwJ6okE4", "title": "Alpha-R1: Alpha Screening with LLM Reasoning via Reinforcement Learning", "abstract": "Signal decay and regime shifts pose recurring challenges for data-driven investment strategies in non-stationary markets. Conventional time-series and machine learning approaches, which rely primarily on historical correlations, often struggle to generalize when the economic environment changes. While large language models (LLMs) offer strong capabilities for processing unstructured information, their potential to support quantitative factor screening through explicit economic reasoning remains underexplored. Existing factor-based methods typically reduce alphas to numerical time series, overlooking the semantic rationale that determines when a factor is economically relevant. We propose Alpha-R1, an 8B-parameter reasoning model trained via reinforcement learning for context-aware alpha screening. Alpha-R1 reasons over factor logic and real-time news to evaluate alpha relevance under changing market conditions, selectively activating or deactivating factors based on contextual consistency. Empirical results across multiple asset pools from markets across different countries show that Alpha-R1 consistently outperforms benchmark strategies and exhibits improved robustness to alpha decay.", "area": "Finance", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Reinforcement Learning", "Alpha Screening", "Quantitative Trading"], "openreview_url": "https://openreview.net/forum?id=61pwJ6okE4", "contribution_types": ["Analysis", "Engineering", "Efficiency", "Data Analysis"]}, {"id": "NUSKBBEqM1", "title": "Chinese Court Simulation with LLM-Based Agents System", "abstract": "Mock trial has long served as an important platform for professional legal training and education. Traditional mock trials are difficult to access by the public because they rely on professional tutors and human participants. Fortunately, the rise of large language models (LLMs) provides new opportunities for creating more accessible and scalable court simulations. While promising, existing research ignored the systematic design and procedure evaluation of court simulations, which are critical to the credibility and usage of court simulation in practice. To this end, we propose a novel court simulation paradigm, i.e. SimCourt, based on the real-world procedure structure of Chinese courts, and design a comprehensive evaluation framework focusing on both legal judgment prediction and court procedure analysis. Experiments show that our framework can generate simulated trials that better guide the system in predicting the imprisonment, probation, and fine of each case. Further procedure evaluations show that agents' responses under our simulation framework even outperform judges and lawyers from the real trials in many aspects. These demonstrate the potential of LLM-based court simulation.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SC0F03.0301Introduction031Mocktrial"], "keywords": ["Court", "Simulation", "Large Language Model", "Multi-Agent System"], "openreview_url": "https://openreview.net/forum?id=NUSKBBEqM1", "contribution_types": ["Engineering"]}, {"id": "P370r0Sozp", "title": "LLaVA-RadZ: Can Multimodal Large Language Models Effectively Tackle Zero-shot Radiology Recognition?", "abstract": "Recently, Multimodal Large Language Models (MLLMs) have demonstrated exceptional capabilities in visual understanding and reasoning across various vision-language tasks. However, we found that MLLMs cannot process effectively from fine-grained medical image data in the traditional Visual Question Answering (VQA) pipeline, as they do not exploit the captured features and available medical knowledge fully, results in MLLMs usually performing poorly in zero-shot medical disease recognition. Fortunately, this limitation does not indicate that MLLMs are fundamentally incapable of addressing fine-grained recognition tasks. From a feature representation perspective, MLLMs demonstrate considerable potential for tackling such challenging problems. Thus, to address this challenge, we propose $\\textbf{\\textit{LLaVA-RadZ}}$, a simple yet effective framework for zero-shot medical disease recognition via utilizing the existing MLLM features. Specifically, we design an end-to-end training strategy, termed $\\textit{Decoding-Side Feature Alignment Training ($\\textbf{DFAT}$)}$ to take advantage of the characteristics of the MLLM decoder architecture and incorporate modality-specific tokens tailored for different modalities.\nAdditionally, we introduce a $\\textit{Domain Knowledge Anchoring Module ($\\textbf{DKAM}$)}$ to exploit the intrinsic medical knowledge of large models, which mitigates the $\\textit{category semantic gap}$ in image-text alignment.\nExtensive experiments demonstrate that our LLaVA-RadZ significantly outperforms traditional MLLMs in zero-shot disease recognition, achieving the comparable performance to the well-established and highly-optimized CLIP-based approaches.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal Large Language Model", "Zero Shot Learning", "Medical Image Analysis"], "openreview_url": "https://openreview.net/forum?id=P370r0Sozp", "contribution_types": ["Engineering"]}, {"id": "jXjwauhpzd", "title": "M$^3$Searcher: Modular Multimodal Information Seeking Agency with Retrieval-Oriented Reasoning", "abstract": "Recent advances in DeepResearch-style agents have demonstrated strong capabilities in autonomous information acquisition and synthesize from real-world web environments.\nHowever, existing approaches remain fundamentally limited to text modality. Extending autonomous information-seeking agents to multimodal settings introduces critical challenges: the specialization-generalization trade-off that emerges when training models for multimodal tool-use at scale, and the severe scarcity of training data capturing complex, multi-step multimodal search trajectories.\nTo address these challenges, we propose M$^3$Searcher, a modular multimodal information-seeking agent that explicitly decouples information acquisition from answer derivation. \nM$^3$Searcher is optimized with a multi-objective reward that jointly encourages factual accuracy, reasoning soundness, and retrieval fidelity. In addition, we develop MMSearchVQA, a multimodal multi-hop dataset tailored to retrieval evidence centric RL training. \nExperimental results demonstrate that M$^3$Searcher outperforms existing approaches, exhibits strong transfer adaptability and effective reasoning in complex multimodal tasks.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Autonomous Agent", "Multimodal RAG", "Information Seeking", "LLM"], "openreview_url": "https://openreview.net/forum?id=jXjwauhpzd", "contribution_types": ["Engineering", "Dataset"]}, {"id": "M8zr7QvasK", "title": "PAR: Training-Free Positional Perturbation and Attention Recycling for Faithful OCR", "abstract": "In high-precision scenarios, vision language models suffer from Linguistic Priors Hallucination. When processing familiar text, models tend to over-rely on internal parametric knowledge, effectively \"reciting\" the content rather than \"reading\" the image. In this paper, we first systematically investigate this phenomenon by constructing the GlitchText Probing Dataset. We discover that the model's reliance on visual grounding diminishes significantly as the generation length increases. To mitigate this, we propose PAR (Positional Perturbation and Attention Recycling), a training-free, inference-time intervention framework. PAR consists of two parts: (1) Positional Perturbation (PP) injects structured phase noise into the rotary positional embeddings; (2) Foveal Attention Recycling (FAR) detects over-confident linguistic priors and dynamically redistributes attention mass back to important visual regions. Extensive experiments across state-of-the-art models, demonstrate that PAR significantly reduces hallucination rates (reducing CER by 12\\%), particularly in long-context scenarios, while maintaining robust generalization on standard benchmarks.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Faithful OCR", "Linguistic Priors Hallucination", "Vision Language Models"], "openreview_url": "https://openreview.net/forum?id=M8zr7QvasK", "contribution_types": ["Analysis", "Efficiency", "Dataset"]}, {"id": "y6niMnK9Pj", "title": "Every Token Counts: Generalizing 16M Ultra-Long Context in Large Language Models", "abstract": "This work explores efficient ultra-long context modeling. We posit that an effective solution requires three fundamental properties: sparsity, random-access flexibility, and \\textbf{length generalization. To achieve this, we leverage Hierarchical Sparse Attention (HSA), a novel attention mechanism that satisfies all three properties. We integrate HSA into the Transformer architecture to develop HSA-UltraLong, an 8B-parameter Mixture-of-Experts (MoE) model trained on over 8 trillion tokens. We rigorously evaluate the model across tasks with both in-domain and out-of-domain context lengths to validate its capabilities. \nOur model demonstrates comparable performance to full-attention baselines on in-domain sequence lengths. Crucially, it achieves over 90\\% accuracy on most in-context retrieval tasks with contexts up to 512 times the pre-training context length. This work reports our findings and remaining issues throughout the experiments, offering insights for future research in ultra-long context modeling.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Long-context modeling; LLM; sparse attention; length generalization"], "openreview_url": "https://openreview.net/forum?id=y6niMnK9Pj", "contribution_types": []}, {"id": "XjjfxiLo97", "title": "Encoder-Free ECG-Language Models", "abstract": "ECG–Language Models (ELMs) extend recent progress in Multimodal Large Language Models (MLLMs) to automated ECG interpretation. However, most ELMs follow Vision–Language Model (VLM) designs and depend on pretrained ECG encoders, adding architectural and training complexity. Inspired by encoder-free VLMs, we introduce ELF, an encoder-free ELM that replaces the ECG encoder with a single projection layer trained jointly with the LLM. Across five datasets, ELF matches or exceeds state-of-the-art ELMs that use far more complex encoders and training pipelines. We also test whether adding architectural biases to ELF improves performance and find that the single linear projection remains competitive. Finally, we show that ELF, and potentially other ELMs, often rely more on benchmark artifacts and language priors than ECG-derived information, highlighting limitations in current evaluation practices and ELM design. We will open-source all code and data upon acceptance.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["ECG", "Multimodal", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=XjjfxiLo97", "contribution_types": ["Analysis", "Engineering"]}, {"id": "i313koucci", "title": "TreeHop: Efficient Embedding-Level Query Rewriter", "abstract": "Retrieval-augmented generation (RAG) systems face significant challenges in multi-hop question answering (MHQA), where complex queries require synthesizing information across multiple document chunks. Existing approaches typically rely on iterative LLM-based query rewriting and routing, resulting in high computational costs due to repeated LLM invocations and multi-stage processes. To address these limitations, we propose TreeHop, an embedding-level framework without the need for LLMs in query refinement. TreeHop dynamically updates query embeddings by fusing semantic information from prior queries and retrieved documents, enabling iterative retrieval through embedding-space operations alone. This method replaces the traditional \"Retrieve-Rewrite-Vectorize-Retrieve\" cycle with a streamlined \"Retrieve-Embed-Retrieve\" loop, significantly reducing computational overhead. Moreover, a rule-based stop criterion is introduced to further prune redundant retrievals, balancing efficiency and recall rate. Experimental results show that TreeHop rivals advanced RAG methods across three open-domain MHQA datasets, achieving comparable performance with only 5\\%-0.4\\% of the model parameter size and reducing the query latency by approximately 99\\% compared to concurrent approaches. This makes TreeHop a faster and more cost-effective solution for deployment in a range of knowledge-intensive applications. For reproducibility purposes, codes and data are available anonymously here: https://github.com/Super-Researcher/TreeHop", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information Retrieval", "Retrieval-Augmented Generation", "Natural Language Processing", "Multi-hop Question Answering", "Query Rewriting"], "openreview_url": "https://openreview.net/forum?id=i313koucci", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Low-resource", "Efficiency"]}, {"id": "2cHXYZRcg2", "title": "Towards Effective Model Editing for LLM Personalization", "abstract": "Personalization is becoming indispensable for LLMs to align with individual user preferences and needs. Yet current approaches are often computationally expensive, data-intensive, susceptible to catastrophic forgetting, and prone to performance degradation in multi-turn interactions or when handling implicit queries. To address these challenges, we conceptualize personalization as a model editing task and introduce Personalization Editing, a framework that applies localized edits guided by clustered preference representations. This design enables precise preference-aligned updates while preserving overall model capabilities. In addition, existing personalization benchmarks frequently rely on persona-based dialogs between LLMs rather than user-LLM interactions, or focus primarily on stylistic imitation while neglecting information-seeking tasks that require accurate recall of user-specific preferences. We introduce User Preference Question Answering (UPQA), a short-answer QA dataset constructed from in-situ user queries with varying levels of difficulty. Unlike prior benchmarks, UPQA directly evaluates a model's ability to recall and apply specific user preferences. Across experimental settings, Personalization Editing achieves higher editing accuracy and greater computational efficiency than fine-tuning, while outperforming prompting-based baselines in multi-turn conversations and implicit preference questions settings.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/personalization-model-editing", "https://anonymous.4open.science/r/personalization-model-editinginteractionhistory"], "keywords": ["Personalization", "Model Editing", "LLMs"], "openreview_url": "https://openreview.net/forum?id=2cHXYZRcg2", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset"]}, {"id": "7DVgZMmxRL", "title": "Is Your LLM-Based Multi-Agent a Reliable Real-World Planner? Exploring Fraud Detection in Travel Planning", "abstract": "The rise of Large Language Model-based Multi-Agent Planning has enabled autonomous and collaborative task execution across diverse domains. However, these systems often rely on external platforms such as review sites and social media, which are highly vulnerable to fraudulent information including fake reviews or misleading descriptions. Such reliance introduces risks that may cause financial losses and undermine user trust.\nIn this work, we present **WandaPlan**, a plug-and-play fraud environment designed to expose and evaluate fraud vulnerabilities in multi-agent planning systems. Rather than offering a standalone agent framework, WandaPlan provides modular fraud-injection scenarios—including Misinformation Fraud, Team-Coordinated Multi-Person Fraud, and Level-Escalating Multi-Round Fraud—that can be easily integrated into existing agent pipelines with minimal modifications.\nThrough experiments, we demonstrate that current frameworks prioritize task efficiency at the expense of data authenticity, leaving them susceptible to manipulation. We further show that WandaPlan can be applied across different open-source planning frameworks, highlighting its generalizability as a reusable evaluation direction.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/348WandaPlan-0535.AppendixAgivesoutabrief349interpretation.350The", "https://anonymous.4open.science/r/WandaPlan-0535", "https://anonymous.4open.science/r/WandaPlan-0535.AppendixAgivesoutabriefinterpretation.generators"], "keywords": ["Travel Planning", "Fraud Detection", "LLM-based Multi-Agent"], "openreview_url": "https://openreview.net/forum?id=7DVgZMmxRL", "contribution_types": ["Analysis", "Engineering"]}, {"id": "pKVPJj3cbV", "title": "Beyond Individual Mimicry: Constructing human-like social network with Graph-augmented LLM agents", "abstract": "Driven by large language models (LLMs), a new generation of social bots can autonomously interact locally, whose human-like behaviors enable them to evade social bot detection.\nHowever, while these botnets exhibit realistic local social interactions, they fail to preserve human-like social network.\nThis is because LLM-based bots are graph-unaware and cannot coordinate over global interactions, which makes those botnets vulnerable to graph neural network (GNN)-based detection.\nTo address this limitation, we propose GraphMind, which equips LLM-driven social bots to explicitly learn and fit human-like social network structures. Building on this foundation, we fu
