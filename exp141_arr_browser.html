tperforms baseline models. Finally, we employ our model to translate previously untranslated portions of the archives, aiming to democratize access to these resources for researchers worldwide.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine Translation", "Large Language Model", "Historical Documents", "RAG", "Data Augmentation"], "openreview_url": "https://openreview.net/forum?id=DzAqgCe04W", "contribution_types": ["Dataset"]}, {"id": "NN7vpL6DsJ", "title": "HOMURA: Taming the Sand-Glass for Time-Constrained LLM Translation via Reinforcement Learning", "abstract": "Large Language Models (LLMs) have achieved remarkable strides in multilingual translation but are hindered by a systemic cross-lingual verbosity bias, rendering them unsuitable for strict time-constrained tasks like subtitling and dubbing. Current prompt-engineering approaches struggle to resolve this conflict between semantic fidelity and rigid temporal feasibility. To bridge this gap, we first introduce Sand-Glass, a benchmark specifically designed to evaluate translation under syllable-level duration constraints. Furthermore, we propose HOMURA, a reinforcement learning framework that explicitly optimizes the trade-off between semantic preservation and temporal compliance. By employing a KL-regularized objective with a novel dynamic syllable-ratio reward, HOMURA effectively \"tames\" the output length. Experimental results demonstrate that our method significantly outperforms strong LLM baselines, achieving precise length control that respects linguistic density hierarchies without compromising semantic adequacy.", "area": "Machine Translation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine Translation", "RL", "Time-Constrained Translation"], "openreview_url": "https://openreview.net/forum?id=NN7vpL6DsJ", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "DVgZ21RHc0", "title": "Revisiting Audio-language Pretraining for Learning General-purpose Audio Representation", "abstract": "Audio-language pretraining (ALP) holds promise for learning general-purpose audio representation, yet remains underexplored. \nCrucially, there is no consensus on whether audio–language models can build effective general-purpose audio encoders, nor a systematic understanding of how pretraining objectives behave across diverse tasks and scales.\nWe identify three key barriers: limited scale of audio-text corpora, insufficient caption diversity, and lack of systematic exploration and evaluation.\nTo fill this gap, we present the first principled empirical study of ALP.\nWe first introduce CaptionStew, a 10.7M caption dataset aggregating open-source audio-text corpora across multiple domains and captioning focuses.\nWe then conduct the first comprehensive evaluation comparing contrastive and captioning objectives for learning audio representation across speech, music, and environmental sound tasks.\nOur results not only demonstrate that ALP yields competitive, transferable representations, but reveal critical trade-offs: contrastive learning offers superior data efficiency, while captioning exhibits better scalability.\nFurthermore, we find that supervised initialization provides diminishing returns at scale, challenging common practices.\nBy grounding these claims in empirical evidence, we establish a viable pathway toward general-purpose audio representation learning, guiding future research.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["audio-language pretraining", "audio representation learning", "audio understanding"], "openreview_url": "https://openreview.net/forum?id=DVgZ21RHc0", "contribution_types": ["Engineering", "Dataset"]}, {"id": "M3fn6ycMqU", "title": "CoTEvol: Self-Evolving Chain-of-Thoughts for Data Synthesis in Mathematical Reasoning", "abstract": "Large Language Models (LLMs) exhibit strong mathematical reasoning when trained on high-quality Chain-of-Thought (CoT) that articulates intermediate steps, yet costly CoT curation hinders further progress. While existing remedies such as distillation from stronger LLMs and self-synthesis based on test-time search alleviate this issue, they often suffer from diminishing returns or high computing overhead. In this work, we propose CoTEvol, a genetic evolutionary framework that casts CoT generation as a population-based search over reasoning trajectories. Candidate trajectories are iteratively evolved through reflective global crossover at the trajectory level and local mutation guided by uncertainty at the step level, enabling holistic recombination and fine-grained refinement. Lightweight, task-aware fitness functions are designed to guide the evolutionary process toward accurate and diverse reasoning. Empirically, \\ourmethod improves correct-CoT synthesis success by over 30\\% and enhances structural diversity, with markedly improved efficiency. LLMs trained on these evolutionary CoT data achieve an average gain of 6.6\\% across eight math benchmarks, outperforming previous distillation and self-synthesis approaches. These results underscore the promise of evolutionary CoT synthesis as a scalable and effective method for mathematical reasoning tasks.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Self-training", "Data Synthesis", "Mathematical Reasoning"], "openreview_url": "https://openreview.net/forum?id=M3fn6ycMqU", "contribution_types": ["Engineering"]}, {"id": "sUryTVw9nc", "title": "GRAPHMOE: Amplifying Cognitive Depth of Mixture-of-Experts Network via Introducing Self-Rethinking Mechanism", "abstract": "Traditional Mixture-of-Experts (MoE) networks benefit from utilizing multiple smaller expert models as opposed to a single large network. However, these experts typically operate independently, leaving a question open about whether interconnecting these models could enhance the performance of MoE networks. In response, we introduce GRAPHMOE, aiming at augmenting the cognitive depth of language models via a self-rethinking mechanism constructed on Pseudo Graph MoE networks. GRAPHMOE employs a recurrent routing strategy, allowing the model to iteratively revisit and refine intermediate reasoning states. Simultaneously, by treating experts as interconnected nodes in a pseudo-graph, it facilitates iterative information exchange among experts rather than treating them as isolated modules. We implement the GRAPHMOE architecture using Low-Rank Adaptation techniques (LoRA) and conduct extensive experiments on various benchmark datasets. The experimental results reveal that GRAPHMOE outperforms other LoRA based models, achieving state-of-the-art performance.", "area": "Linguistics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Mixture-of-Experts", "Low-Rank Adaptation", "Self-Rethinking Mechanism", "Recurrent Neural Network", "Cognitive Depth"], "openreview_url": "https://openreview.net/forum?id=sUryTVw9nc", "contribution_types": ["Engineering", "Efficiency", "Theory"]}, {"id": "mgposXrh9b", "title": "Infinite Problem Generator: Verifiably Scaling Physics Reasoning Data with Agentic Workflows", "abstract": "Training large language models for complex reasoning is bottlenecked by the scarcity of verifiable, high-quality data. In domains such as physics, standard text augmentation often introduces hallucinations, while static benchmarks lack the reasoning traces required for fine-tuning. We introduce the Infinite Problem Generator (IPG), an agentic framework that synthesizes physics problems while enforcing solvability through a \"Formula-as-Code'' paradigm. Unlike probabilistic text generation, IPG constructs solutions as executable Python programs, enforcing strict mathematical consistency. As a proof-of-concept, we release ClassicalMechanicsV1, a high-fidelity corpus of 1,335 classical mechanics problems expanded from 165 expert seeds. The corpus demonstrates high structural diversity, spanning 102 unique physical formulas with an average complexity of 3.05 formulas per problem. Furthermore, we identify a \"Complexity Blueprint'', demonstrating a strong linear correlation ($R^2 \\approx 0.95$) between formula count and verification code length. This relationship establishes code complexity as a precise, proxy-free metric for problem difficulty, enabling controllable curriculum generation. We release the full IPG pipeline, the ClassicalMechanicsV1 dataset, and our evaluation tools to support reproducible research in reasoning-intensive domains.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ProblemGenerationAgent-4E62"], "keywords": ["synthetic data", "physics reasoning", "agentic workflows", "executable verification", "large language models"], "openreview_url": "https://openreview.net/forum?id=mgposXrh9b", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "sxNfrxqHWi", "title": "Contributive Attribution for Question Answering via Tree-based Context Pruning", "abstract": "The development of large language models for question answering has benefited from understanding which context sentences are responsible for their answer. These sentences are commonly called contributive attribution. Recent works use the probability drop of the answer for a modified context to estimate how well sentences in the context match the attribution. Unfortunately, this metric does not convey the necessity and sufficiency qualities that the natural language processing community has defined in previous works. We propose a metric composed of a necessary and a sufficiency score based on probability drops to fill this gap. Then, to illustrate the soundness of the metric in practice, we develop a hierarchical method, TreeFinder, which progressively selects finer parts of the context through tree-based pruning using the metric. It begins with a few coarse-grained chunks and iteratively narrows the top $k$ chunks according to our metric down to sentence-level granularity. At each iteration, we calculate our metric using ablation-based log-probability differences and filter out irrelevant chunks. Experimental results on HotpotQA demonstrate that TreeFinder outperforms ContextCite and TracLLM in contributive attribution quality when it is composed of a few sentences. Further experiments on Loogle and LongBench-v2 show that TreeFinder ranks sentences for attribution score better than ContextCite in long contexts.", "area": "Question Answering", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/TreeFinder-F3FD"], "keywords": ["Contributive attributions", "Natural Language Processing", "Explainability", "Trustworthiness", "Language Models"], "openreview_url": "https://openreview.net/forum?id=sxNfrxqHWi", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "Np1nxcTtx2", "title": "Output Composability of QLoRA PEFT Modules for Plug-and-Play Attribute-Controlled Text Generation", "abstract": "Parameter-efficient fine-tuning (PEFT) techniques offer task-specific fine-tuning at a fraction of the cost of full fine-tuning, but require separate fine-tuning for every new task (combination). In this paper, we explore three ways of generalising beyond single-task training/inference: (i) training on combinations of multiple, related datasets; (ii) at inference, composing the weight matrices of separately trained PEFT modules; and (iii) at inference, composing the outputs of separately trained PEFT modules. We test these approaches on three different LLMs, QLoRA as the PEFT technique, and three sets of controlled text generation datasets for sentiment control, topic control, and multi-attribute control. We find that summing PEFT module outputs is a particularly strong composition method, which consistently either outperforms or matches the performance of alternative approaches. This is the case even when comparing against single-task specialised modules on the single-task test set, where three-module output composition achieves an average 2% point performance increase across all models for sentiment control.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["PEFT", "Controllable Text Generation", "LoRA", "composition method", "Text Generation"], "openreview_url": "https://openreview.net/forum?id=Np1nxcTtx2", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "KKlZMxn0Vs", "title": "Improving LLM Code Reasoning via Semantic Equivalence Self-Play with Formal Verification", "abstract": "We introduce a self-play framework for semantic equivalence in Haskell, utilizing formal verification to guide adversarial training between a generator and an evaluator. The framework leverages Liquid Haskell proofs for validating equivalence and execution-based counterexamples for inequivalence, organized via a difficulty-aware curriculum. To facilitate this, we release OpInstruct-HSx, a synthetic dataset of $\\approx$28k validated Haskell programs. Empirical experiments show that our evaluator transfers effectively to downstream tasks, achieving up to 13.3pp accuracy gain on EquiBench and consistent gains on PySecDB. Ablation studies on the SEQ-SINQ regimes indicate that while inequivalence supervision provides data volume, equivalence proofs are uniquely responsible for the model's reasoning capabilities. The entire training pipeline and dataset are publicly released on GitHub and Hugging Face respectively.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLMs", "coding", "reasoning", "self-play", "formal verification", "Haskell"], "openreview_url": "https://openreview.net/forum?id=KKlZMxn0Vs", "contribution_types": ["Engineering", "Dataset"]}, {"id": "bxWRUT5bux", "title": "Adapting Dynamic Sampling to Fine-Grained Rewards for Tool Learning with Curriculum Learning", "abstract": "Dynamic sampling is a technique employed in reinforcement Learning for Large Language Models to mitigate training instability, often caused by the gradient-decreasing problem. However, existing dynamic sampling approaches are predominantly designed for tasks with binary rewards (success/failure) and struggle to adapt to the complex reward structures of tool learning. Such task involves interdependent sub-tasks of varying difficulty and yields fine-grained, multi-faceted rewards. To bridge this gap, we introduce Dynamic Sampling with Curriculum Learning (DSCL), an algorithm tailored for the intricate dynamics of tool learning. DSCL integrates two core components: a Reward-Based Dynamic Sampler, which leverages multi-dimensional reward statistics to prioritize high-value training data; and a Task-Based Dynamic Curriculum Learning method to overcome the credit assignment problem caused by the fine-grained rewards. Extensive experiments on widely used tool learning benchmarks demonstrate the efficacy of our approach. DSCL significantly improves model performance, outperforming strong baselines by 4.75\\% on the BFCL V3 dataset and 4.02\\% on the API-Bank dataset. Our method will be publicly available at  http://anonymous.com/.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Tool Learning", "Reinforcement Learning", "Dynamic Sampling", "Curriculum Learning"], "openreview_url": "https://openreview.net/forum?id=bxWRUT5bux", "contribution_types": ["Engineering"]}, {"id": "d14lQu9QtW", "title": "Reading the Lines, Decoding the Minds: Explainable Satirical Cartoon Detection via On-Canvas and Beyond-Canvas Modeling", "abstract": "Multimodal Satire Detection (MSD) aims to identify implicit criticism and stance in social media. However, existing MSD benchmarks mainly use user generated content and predominantly consist of realistic photographs, where satire is often conveyed through overt image text incongruity. By contrast, increasingly popular editorial cartoons convey satire through symbolic and metaphorical cues, requiring models to infer latent intent and pragmatics.\nTo address these limitations, we propose MSCE, a dedicated evaluation benchmark for Multimodal Satirical Cartoons Evaluation.  \nAs a strong baseline for MSCE, we introduce a novel explainable framework named DOUBLE. \nDOUBLE endows Multimodal Large Language Model (MLLM) with a Clue2View mechanism to explicitly model interpretation through two complementary views: a literal on-canvas view and a metaphorical beyond-canvas view. \nIn addition, DOUBLE incorporates a lightweight Small Language Model Arbiter to distill reasoning traces from the MLLM, ensuring reliable predictions with lower computational costs. \nExperiments on MSCE demonstrate that DOUBLE achieves the best performance, showcasing its ability to provide clear, well-grounded rationales for complex satirical cartoons.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/DOUBLE-5577"], "keywords": ["Multimodal Reasoning", "Satire Detection", "Satirical Cartoons"], "openreview_url": "https://openreview.net/forum?id=d14lQu9QtW", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "yVUNgOwm9Z", "title": "From Lexicon to AI: A Structured-Data Pipeline for Specialized Conversational Systems in Low-Resource Languages", "abstract": "Low-resource languages face a critical challenge in AI development: creating specialized conversational systems without access to massive training corpora. We present a systematic methodology for transforming structured linguistic resources into specialized AI systems, demonstrating that expert-curated lexical databases can serve as effective foundations for conversational AI development. Our approach converts Hindi WordNet into 1.25 million diverse instruction-response pairs, fine-tunes a 12B-parameter language model using resource-efficient LoRA with 4-bit quantization. Evaluation through a Hindi language learning chatbot demonstrates that structured-knowledge-based systems achieve superior pedagogical effectiveness (91.0 vs. 79.4-83.6 for general-purpose models) while maintaining competitive semantic performance and exceptional consistency. The complete pipeline demonstrates a proof-of-concept methodology using Hindi for developing specialized AI systems for any languages with WordNet resources. This work addresses the critical gap in AI accessibility for low-resource languages, offering a practical alternative to corpus-intensive approaches and potentially enabling specialized AI development for billions of underserved language speakers worldwide.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Low-resource methods", "Resource-efficient methods", "Instruction tuning", "Dataset creation", "Conversational agents", "WordNets and lexical resources"], "openreview_url": "https://openreview.net/forum?id=yVUNgOwm9Z", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset"]}, {"id": "BvkxDzmxGp", "title": "AdaLoc: Adaptive Granularity and Hierarchical Filtering for Evidence-Aware Academic Search", "abstract": "Retrieval-Augmented Generation (RAG) improves factuality for scientific question answering, but scientific queries vary systematically in evidence scope. A single static retrieval pipeline faces a granularity–precision tension: strategies that maximize semantic coverage for global synthesis often miss needle-like evidence required for local extraction. We propose AdaLoc, a scope-adaptive evidence localization module. AdaLoc (i) routes queries by predicted scope, (ii) selects scope-specific evidence granularity, and (iii) applies a hierarchical filter cascade to balance semantic and lexical matching. We validate AdaLoc on the public QASPER benchmark, where it achieves competitive performance compared to closed-source baselines while using over 50% fewer tokens and purely open-source components. Furthermore, to rigorously probe the granularity trade-off, we introduce SCISCOPE, a diagnostic dataset of 2000 queries explicitly annotated with evidence scope. On SCISCOPE, AdaLoc substantially outperforms strong RAG baselines and long-context methods, particularly on local queries (improving F1 by over 3.7× compared to full-context baselines, 74.37% vs. 20.17%). These results demonstrate that precise evidence localization is more critical than simply extending context volume.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AdaLoc-EEC3"], "keywords": ["Large Language Models", "Retrieval-Augmented Generation", "Literature Retrieval"], "openreview_url": "https://openreview.net/forum?id=BvkxDzmxGp", "contribution_types": []}, {"id": "YFhGSYkgDt", "title": "CPR-RAG: Clinical Prior-Regularized Retrieval for Anatomy-Aware 3D CT Report Generation", "abstract": "Generating radiology reports from 3D volumetric data remains challenging due to the difficulty of grounding fine-grained pathologies within high-dimensional scans. While retrieval-augmented generation (RAG) offers a potential solution, standard approaches struggle with visual-semantic ambiguity and often introduce irrelevant \"normal\" context that dilutes pathological signals. To address this limitation, we introduce CPR-RAG, a model-agnostic RAG framework that enhances organ-level grounding by integrating clinical priors into the retrieval process. Specifically, we propose a clinical prior-regularized re-ranking module that leverages corpus-derived co-occurrence statistics to align retrieved candidates with latent disease distributions, ensuring clinical consistency beyond mere visual similarity. Furthermore, we employ clinical relevance context refinement to selectively filter out boilerplate normal descriptions, thereby maximizing the information density of the evidence provided to the generator. Extensive experiments on the RadGenome-ChestCT benchmark demonstrate that CPR-RAG significantly improves clinical efficacy across state-of-the-art radiology report generation models. Human evaluation further confirms that our approach achieves superior factual correctness, completeness, and utility compared to the existing models.", "area": "RAG", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["CT radiology report generation", "Retrieval-augmented generation", "Re-ranking", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=YFhGSYkgDt", "contribution_types": ["Engineering"]}, {"id": "XxkOt9PsHR", "title": "Study on HSK Chinese Text Grading Based on Deep Hybrid Neural Network Model", "abstract": "Thispaperproposesadeephybridneuralnet-workmodelforHSKtextgrading,aimingto accuratelyassessthediffcultylevelsofChi-nesetexts.Themodeladoptsahierarchical processingarchitecture,includingacharacter embeddinglayer,amulti-scalefeatureextrac-tionmodule,abidirectionalLSTMsequence encodingmodule,amulti-headself-attention mechanismmodule,andaclassifcationout-putmodule.Byorganicallyintegratingscale convolutionalfeatureextraction,sequencemod-eling,andattentionmechanisms,themodelef-fectivelycapturescomplexlinguisticcharacter-isticsforprofciencyassessment.Weconstruct adatasetof4,474textsbasedonthelatestHSK standardtextbooksandsampleexams,aligned withtheInternationalChineseEducationChi-neseProfciencyLevelStandard(HSK9),us-ingacombined“HSK9+sentencelength”and “maximumdistributiondensitysegmentation”method.Experimentsshowthatthemodel achievesanaccuracyof94.17%andaweighted F1scoreof94.17%,signifcantlyoutperform-ingbaselinemodelsincludingBERT(92.32%),MLF-BERT(91.05%),andKGMNN(80.36%).Ablationstudiesconfrmthecontributionsof eachcomponent,withtheCNNmodulecon-tributing4.85percentagepointstoaccuracy andtheattentionmechanismcontributing4.59 percentagepoints.", "area": "NLP Applications", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["HSK Text Grading; Deep Hybrid Neural Network; Multi-scale Feature Extraction; Bidirectional LSTM; Multi-head Self-Attention Mechanism"], "openreview_url": "https://openreview.net/forum?id=XxkOt9PsHR", "contribution_types": []}, {"id": "0X9YHFyEby", "title": "Anti-Length Shift: Dynamic Outlier Truncation for Training Efficient Reasoning Models", "abstract": "Large reasoning models enhanced by reinforcement learning with verifiable rewards have achieved significant performance gains by extending their chain-of-thought. However, this paradigm incurs substantial deployment costs as models often exhibit excessive verbosity on simple queries. Existing efficient reasoning methods relying on explicit length penalties often introduce optimization conflicts and leave the generative mechanisms driving overthinking largely unexamined. In this paper, we identify a phenomenon termed length shift where models increasingly generate unnecessary reasoning on trivial inputs during training. To address this, we introduce Dynamic Outlier Truncation (DOT), a training-time intervention that selectively suppresses redundant tokens. This method targets only the extreme tail of response lengths within fully correct rollout groups while preserving long-horizon reasoning capabilities for complex problems. To complement this intervention and ensure stable convergence, we further incorporate auxiliary KL regularization and predictive dynamic sampling. Experimental results across multiple model scales demonstrate that our approach significantly pushes the efficiency-performance Pareto frontier outward. Notably, on the AIME-24, our method reduces inference token usage by 78\\% while simultaneously increasing accuracy compared to the initial policy and surpassing state-of-the-art efficient reasoning methods.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Reinforcement Learning", "LLM Reasoning", "Efficiency"], "openreview_url": "https://openreview.net/forum?id=0X9YHFyEby", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "jAUGXDvRKK", "title": "Mind-Paced Speaking: A Dual-Brain Approach to Real-Time Reasoning in Spoken Language Models", "abstract": "Real-time Spoken Language Models (SLMs) struggle to leverage Chain-of-Thought (CoT) reasoning due to the prohibitive latency of generating the entire thought process sequentially. Enabling SLMs to think while speaking, similar to humans, is attracting increasing attention. We present, for the first time, Mind-Paced Speaking (MPS), a brain-inspired framework that enables high-fidelity, real-time reasoning. Similar to how humans utilize distinct brain regions for thinking and responding, we propose a novel dual-brain approach, employing a \"Formulation Brain\" for high-level reasoning to pace and guide a separate \"Articulation Brain\" for fluent speech generation. This division of labor eliminates mode-switching, preserving the integrity of the reasoning process. Experiments show that MPS significantly outperforms existing think-while-speaking methods and achieves reasoning performance comparable to models that pre-compute the full CoT before speaking, while drastically reducing latency. Under a zero-latency configuration, the proposed method achieves an accuracy of 92.8\\% on the mathematical reasoning task Spoken-MQA and attains a score of 82.5 on the speech conversation task URO-Bench. Our work effectively bridges the gap between high-quality reasoning and real-time interaction.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Spoken Language Models", "Real-time Reasoning", "Chain of Thought"], "openreview_url": "https://openreview.net/forum?id=jAUGXDvRKK", "contribution_types": ["Analysis", "Theory"]}, {"id": "dJ9bRYrul2", "title": "NED-Tree: Bridging the Semantic Gap with Nonlinear Element Decomposition Tree for LLM Nonlinear Optimization Modeling", "abstract": "Automating the translation of Operations Research (OR) problems from natural language to executable models is a critical challenge. While Large Language Models (LLMs) have shown promise in linear tasks, they suffer from severe performance degradation in real-world nonlinear scenarios due to semantic misalignment between mathematical formulations and solver codes, as well as unstable information extraction. In this study, we introduce NED-Tree, a systematic framework designed to bridge the semantic gap. NED-Tree employs (a) a sentence-by-sentence extraction strategy to ensure robust parameter mapping and traceability; and (b) a recursive tree-based structure that adaptively decomposes complex nonlinear terms into solver-compatible sub-elements. Additionally, we present NEXTOR, a novel benchmark specifically designed for complex nonlinear, extensive-constraint OR problems. Experiments across 10 benchmarks demonstrate that NED-Tree establishes a new state-of-the-art with 72.51\\% average accuracy, NED-Tree is the first framework that drives LLMs to resolve nonlinear modeling difficulties through element decomposition, achieving alignment between modeling semantics and code semantics. The NED-Tree framework and benchmark are accessible in the anonymous repository https://anonymous.4open.science/r/NORA-NEXTOR.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/NORA-NEXTOR.etal.", "https://anonymous.4open.science/r/NORA-NEXTOR"], "keywords": ["Large Language Models", "Optimization Problems Modeling", "Nonlinear Semantics Alignment"], "openreview_url": "https://openreview.net/forum?id=dJ9bRYrul2", "contribution_types": ["Analysis", "Engineering"]}, {"id": "Q2JwaaI0ll", "title": "JailMeter: An Evidence-Based Evaluation Framework for Jailbreak Attacks on Large Language Models", "abstract": "The assessment of jailbreak attacks against large language models currently suffers from inconsistent evaluation criteria and methods, leading to unreliable estimates of attack success rates. We propose JailMeter, an evidence-based evaluation framework designed to more faithfully measure jailbreak effectiveness. Inspired by the Information Bottleneck theory, JailMeter applies dual-feedback optimization to filter jailbreak noise from model responses while preserving content relevant to the original malicious question. This process produces concise evidence for a rigorous assessment under which an attack is validated only when the response captures the malicious intent and delivers a complete answer, thereby signaling a substantive bypass of model safety alignment. We evaluate JailMeter on JailMeter-Eva, a challenging benchmark containing 330 human-labeled, non-rejected jailbreak instances. JailMeter achieves an accuracy of 97.27\\%, substantially outperforming existing evaluation methods. To support large-scale evaluation, we further distill JailMeter into a small language model, JailMeter\\textsubscript{SLM}, which maintains comparable reliability with significantly reduced computational costs. Code and dataset are available at \\url{https://anonymous.4open.science/r/JailMeter-383D}.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/JailMeter-383D"], "keywords": ["Jailbreak Evaluation", "Multi-Agent System", "Multi-Agent Knowledge Distillation"], "openreview_url": "https://openreview.net/forum?id=Q2JwaaI0ll", "contribution_types": ["Low-resource", "Dataset"]}, {"id": "wmUlXT8FWe", "title": "Med-SRAF: A Multi-Agent Framework for Medical Reasoning via Semantic Routing and Agentic Fusion", "abstract": "While Retrieval-Augmented Generation (RAG) has become a standard paradigm for mitigating hallucinations in Large Language Models (LLMs), its effectiveness in complex medical reasoning remains limited. Existing RAG methods suffer from two main challenges: First, **Semantic Drift**: without explicit domain constraints, LLM-driven query decomposition often deviates from the original clinical intent, introducing substantial noise that degrades retrieval relevance. Second, **Concatenation Fallacy**: retrieved evidence from different semantic aspects is aggregated in a naive, unstructured manner, without modeling their inter-dependencies and potential conflicts, which ultimately undermines downstream reasoning. To address these challenges, we propose **Med-SRAF**, a multi-agent retrieval augmentation framework guided by medical domain knowledge. This framework reconstructs the traditional RAG process through two core mechanisms: (1) Intent-driven Semantic Routing, where a UMLS-based NavigationAgent dynamically maps queries to medical dimensions for strategic search space pruning; and (2) Evidence-based Agentic Fusion, where a FusionAgent resolves conflicts among dimension-specific evidence to build logically consistent reasoning chains. Extensive experiments on five widely used medical benchmarks show that Med-SRAF consistently outperforms existing general RAG baselines, achieving an average accuracy improvement of over **4.9\\%**, highlighting its effectiveness in robust and interpretable medical reasoning.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MultiAgent_RAG-F6DC"], "keywords": ["RAG", "Medical Reasoning", "Multi-Agents", "Semantic Routing", "Agentic Fusion"], "openreview_url": "https://openreview.net/forum?id=wmUlXT8FWe", "contribution_types": []}, {"id": "OlrG92KxGY", "title": "VideoMolmo: Spatio-Temporal Grounding Meets Pointing", "abstract": "Spatio-temporal localization, identifying the position and temporal evolution of objects, is essential for applications from cell tracking to autonomous navigation. Video Large Multimodal Models show promise but remain limited by coarse predictions, reliance on dense mask optimization, and limited interpretability. We introduce VideoMolmo, a two-stage framework that grounds objects through point-based localization. Rather than predicting dense masks, VideoMolmo produces precise points as lightweight, interpretable anchors, then uses them for downstream tasks including referring segmentation, video object segmentation, and counting. By decoupling localization from task execution, we provide robust and transparent reasoning. Built on Molmo, VideoMolmo incorporates a novel temporal attention module for cross-frame reasoning and a bidirectional temporal mask fusion strategy, enabling coherent point propagation and accurate segmentation. For training and evaluation, we release a large-scale spatio-temporal pointing dataset of 72k video-caption pairs with 100k annotated points and curate VPoS-Bench, a challenging benchmark spanning five real-world domains. Experiments show that VideoMolmo outperforms existing approaches on the MeViS benchmark and achieves a gain of 5.4 percentage points on VPoS-Bench. This highlights the effectiveness of point-based representations as a foundation for interpretable, fine-grained reasoning in dynamic visual environments.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Video-LMM", "Grounding", "Pointing"], "openreview_url": "https://openreview.net/forum?id=OlrG92KxGY", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "KfydLOFtwc", "title": "ErrEval: Error-Aware Evaluation for Question Generation through Explicit Diagnostics", "abstract": "Automatic Question Generation (QG) often produces outputs with critical defects, such as factual hallucinations and answer mismatches. However, existing evaluation methods, including LLM-based evaluators, mainly adopt a black-box and holistic paradigm without explicit error modeling, leading to the neglect of such defects and overestimation of question quality. To address this issue, we propose ErrEval, a flexible and Error-aware Evaluation framework that enhances QG evaluation through explicit error diagnostics. Specifically, ErrEval reformulates evaluation as a two-stage process of error diagnosis followed by informed scoring. At the first stage, a lightweight plug-and-play Error Identifier detects and categorizes common errors across structural, linguistic, and content-related aspects. These diagnostic signals are then incorporated as explicit evidence to guide LLM evaluators toward more fine-grained and grounded judgments. Extensive experiments on three benchmarks demonstrate the effectiveness of ErrEval, showing that incorporating explicit diagnostics improves alignment with human judgments. Further analyses confirm that ErrEval effectively mitigates the overestimation of low-quality questions.", "area": "Resources and Evaluation", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ErrEval-3BE8", "https://anonymous.4open.science/r/ErrEval-3BE8.Passage"], "keywords": ["Automatic Evaluation", "Question Generation", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=KfydLOFtwc", "contribution_types": ["Analysis", "Engineering"]}, {"id": "Ps4CSX1zeL", "title": "Benchmarking and Improving PDDL Formalization Ability of Large Language Models with Planner-in-the-Loop Feedback", "abstract": "Planning depends on symbolic specifications that are both executable and verifiable. However, large language models often generate Planning Domain Definition Language (PDDL) problem descriptions that appear syntactically well formed yet fail under strict precondition, effect-consistency, and reachability constraints. Even minor specification errors can render a task unsolvable, motivating benchmarks and learning signals grounded in planner-based verification rather than surface plausibility.\n\nWe present NL-PDDL-Bench, a multi-domain benchmark for natural-language-to-PDDL specification construction, with planner-verified executability and object-count difficulty scaling. We also propose a planner-in-the-loop framework that uses validator and planner diagnostics to revise non-executable specifications via localized edits. Building on this toolchain, we present a planner-grounded optimization recipe combining parameter-efficient Low-Rank Adaptation supervised fine-tuning, offline planner-derived preference pairs for Direct Preference Optimization, and inference-time planner-in-the-loop repair, without online planner calls during training. We further provide a unified evaluation suite for parseability, solvability, specification similarity, and outcome-aware plan-level consistency against planner references. Experiments on eight representative model families show higher planner success and plan-level agreement, improved robustness under difficulty scaling and cross-domain transfer. Code and data are available at: https://anonymous.4open.science/r/NL-PDDL-Bench-BF76", "area": "Math/Reasoning", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/NL-PDDL-Bench-BF76"], "keywords": ["symbolic planning", "PDDL folmulitation", "large language model", "planner-in-the-loop"], "openreview_url": "https://openreview.net/forum?id=Ps4CSX1zeL", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "FO1ewDgZcr", "title": "Model Knows What Now to Learn: Learner-Centric SFT Data Selection via Self-Rectify", "abstract": "LLM supervised fine-tuning (SFT) data have become abundant, mainly driven by synthetic generation. However, sheer scale does not guarantee effective SFT: large datasets often exhibit pathologies such as redundancy, imbalance, and poor learnability, making data selection critical for improving SFT data efficiency and efficacy. Existing selection methods typically rely on static or handcrafted criteria, which can be subjective, biased, and lack transferability. To address this, we propose **LeRS** (**Le**arner Self-**R**ectify **S**election), a learner-centric data selection framework. It enables the learner model, or its compact homologue, to identify learning-worthy samples via self-feedback signals, and dynamically rectify the training subset distribution throughout the learning process. By focusing on the learner's evolving needs rather than static metrics, LeRS surfaces suitably challenging and unmastered samples that are otherwise overlooked. Experiments show that LeRS boosts data efficiency and efficacy : using only $10$% of the data, it matches the SFT performance of $5\\times$ randomly sampled data, and yields consistent gains over full-dataset training in multi-source scenarios. Our findings reveal that prioritizing high-utility data that dynamically address the learner’s needs is the key to “more with less” in SFT.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["supervised fine-tuning", "data-efficient training", "data efficiency", "data selection"], "openreview_url": "https://openreview.net/forum?id=FO1ewDgZcr", "contribution_types": ["Engineering", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "zxrJIw8kST", "title": "ASE-MCTS: Asynchronous Self-Evaluated Monte Carlo Tree Search for Efficient LLM Reasoning", "abstract": "While Monte Carlo Tree Search (MCTS) effectively enhances LLM reasoning, its widespread application is constrained by the unreliability of intermediate rewards and prohibitive time costs. Prevailing methods typically secure high-quality signals via external supervision, while intrinsic self-evaluation often suffers from noise and unreliability, limiting the scalability and broad applicability of tree search. To address these challenges, we propose ASE-MCTS, an \\textbf{A}synchronous \\textbf{S}elf-\\textbf{E}valuated \\textbf{MCTS} framework. To improve reward robustness, we introduce a fused reward mechanism that integrates diverse signals, including pairwise comparisons, to enhance both global alignment and local discriminability. Simultaneously, we utilize a novel asynchronous orchestrator that parallelizes independent expansion and simulation tasks, effectively masking generation latency. Extensive experiments demonstrate that ASE-MCTS consistently outperforms strong baselines and achieves capability breakthroughs on high-difficulty benchmarks without external supervision. Moreover, our asynchronous design significantly improves computational efficiency, yielding up to a $6\\times$ speedup over synchronous implementations.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "LLM Reasoning", "Monte Carlo Tree Search", "Asynchronous Search"], "openreview_url": "https://openreview.net/forum?id=zxrJIw8kST", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "eXF1TZykUw", "title": "R$^3$L: Reflect-then-Retry Reinforcement Learning with Language-Guided Exploration, Pivotal Credit, and Positive Amplification", "abstract": "Reinforcement learning drives recent advances in LLM reasoning and agentic capabilities, yet current approaches struggle with both exploration and exploitation. Exploration suffers from low success rates on difficult tasks and high costs of repeated rollouts from scratch. Exploitation suffers from coarse credit assignment and training instability: Trajectory-level rewards penalize valid prefixes for later errors, and failure-dominated groups overwhelm the few positive signals, leaving optimization without constructive direction. To this end, we propose R$^3$L, Reflect-then-Retry Reinforcement Learning with Language-Guided Exploration, Pivotal Credit, and Positive Amplification. To synthesize high-quality trajectories, R$^3$L shifts from stochastic sampling to active synthesis via reflect-then-retry, leveraging language feedback to diagnose errors, transform failed attempts into successful ones, and reduce rollout costs by restarting from identified failure points. With errors diagnosed and localized, Pivotal Credit Assignment updates only the diverging suffix where contrastive signals exist, excluding the shared prefix from gradient update. Since failures dominate on difficult tasks and reflect-then-retry produces off-policy data, risking training instability, Positive Amplification upweights successful trajectories to ensure positive signals guide the optimization process. Experiments on agentic and reasoning tasks demonstrate 5\\% to 52\\% relative improvements over baselines while maintaining training stability. Our code is released at \\url{https://anonymous.4open.science/r/R3L}.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/R3L.", "https://anonymous.4open.science/r/R3L"], "keywords": ["reinforcement learning", "LLM agents", "credit assignment", "language-guided exploration"], "openreview_url": "https://openreview.net/forum?id=eXF1TZykUw", "contribution_types": ["Analysis", "Engineering"]}, {"id": "RljVuNvfoQ", "title": "Improving Question Generation Quality for Educational LLMs: Evaluation Framework Construction and Fine-Tuning Optimization", "abstract": "The application of large language models (LLMs) in the field of education is becoming increasingly widespread, and question generation based on LLMs has begun to attract more attention. This is because it can save educators' time and enable personalized learning.\nHowever, existing studies mostly focus on the local rationality of the content generated by models, lacking a systematic comparison between the generated questions and human-crafted  questions in terms of their overall characteristics.\nThis work proposes an evaluation framework that covers both the content and form of questions, which comprehensively measures the gap between question generation by LLMs and that by humans, and puts forward a series of improvement methods targeting this gap.\nSpecifically, we focus on seven dimensions to measure the differences between question generation by humans and by models. Based on these differences, we propose a zero-shot method (Chain-of-Thought Prompting for Question Generation, CPQG) that does not rely on external knowledge bases. By combining CoT and prompt engineering, CPQG significantly improves the model's own question generation quality. Extensive experiments show that CPQG has significantly narrowed the gap between question generation by models and by humans. Compared with the baseline, CPQG enables 7B-sized models to outperform the baseline by an average of 10\\,\\% and even surpassed GPT4 in multiple dimensions.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Educational NLP", "Large Language Model-based Question Generation", "Benchmark Evaluation", "Long Chain-of-Thought Reasoning"], "openreview_url": "https://openreview.net/forum?id=RljVuNvfoQ", "contribution_types": ["Analysis"]}, {"id": "0HH0w7tROY", "title": "Don’t learn, Ground. Image Generation for Grounded NLI", "abstract": "We propose a zero-shot method for Natural Language Inference (NLI) that leverages multimodal representations by grounding language in visual contexts. Our approach generates visual representations of premises using text-to-image models and performs inference by comparing these with textual hypotheses. The pipeline achieves an accuracy comparable to text-based NLI classifiers while offering additional transparency. Our findings suggest that grounding language in vision is a viable and effective strategy for advancing robust natural language understanding.", "area": "Multimodal", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["natural language inference", "synthetic data", "textual entailment"], "openreview_url": "https://openreview.net/forum?id=0HH0w7tROY", "contribution_types": ["Engineering"]}, {"id": "6PNO4y7NN4", "title": "Route to Rome Attack: Directing LLM Routers to Expensive Models via Adversarial Suffix Optimization", "abstract": "Cost-aware routing dynamically dispatches user queries to models of varying capability to balance performance and inference cost. However, the routing strategy introduces new security concern that adversaries may manipulate  router to consistently select expensive high-capability models. Existing routing attacks depend either on white-box access or heuristic prompts, rendering them ineffective in real-world black-box scenarios. In this work, we propose R$^2$A which aims to mislead black-box LLM routers to expensive models via adversarial suffix optimization. Specifically, R$^2$A deploys a hybrid ensemble surrogate router to mimic the black-box router. A suffix optimization algorithm is further adapted for the ensemble-based surrogate. Extensive experiments on multiple open-source and commercial routing systems demonstrate that R$^2$A significantly increases the routing rate to expensive models on queries of different distributions. Code and examples: https://anonymous.4open.science/r/Anonymous_code-692E.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Anonymous_code-692E"], "keywords": ["adversarial attacks", "router attack", "large language models", "LLM routing"], "openreview_url": "https://openreview.net/forum?id=6PNO4y7NN4", "contribution_types": ["Analysis", "Engineering"]}, {"id": "CRfH3ryg5e", "title": "RSDA: Restoring Stale Data Affinity via Dynamic Renovation Strategy for Mitigating Data Scarcity", "abstract": "High-quality data is the cornerstone of advancing large language models. However, the field currently faces a critical dilemma: the supply of premium data is nearing depletion, while vast stale corpora remain underutilized. Our empirical analysis reveals that training models on such data directly often leads to performance degradation. We attribute this phenomenon to the data affinity gap, a misalignment stemming from the model's inability to effectively comprehend the data or inherent quality defects. To bridge this gap, we propose Restoring Stale Data Affinity (RSDA) framework. First, utilizing our proposed potential entropy metric, RSDA quantifies the latent value of samples to effectively identify stale data with higher renovation potential. Subsequently, the framework employs a dynamic renovation strategy selection mechanism to determine the optimal component-level strategy for each instance, transforming low-affinity stale samples into high-quality training data. Comprehensive experimental results demonstrate that RSDA effectively enhances data affinity, achieving performance improvements using less than 10% of the data volume, thereby underscoring that the latent potential of stale corpora remains largely untapped. The code is available at https://anonymous.4open.science/status/RSDA-4DF1.", "area": "Low-resource Methods for NLP", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/status/RSDA-4DF1"], "keywords": ["Data-Centric AI", "Synthetic Data", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=CRfH3ryg5e", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "ACoJWTUB3P", "title": "EvoConfig: Self-Evolving Multi-Agent Systems for Efficient Autonomous Environment Configuration", "abstract": "A reliable executable environment is the foundation for ensuring that large language models solve software engineering tasks. \nDue to the complex and tedious construction process, large-scale configuration is relatively inefficient. However, most methods always overlook fine-grained analysis of the actions performed by the agent, making it difficult to handle complex errors and resulting in configuration failures. To address this bottleneck, we propose EvoConfig, an efficient environment configuration framework that optimizes multi-agent collaboration to build correct runtime environments. EvoConfig features an expert diagnosis module for fine-grained post-execution analysis, and a self-evolving mechanism that lets expert agents self-feedback and dynamically adjust error-fixing priorities in real time. Empirically, EvoConfig matches the previous state-of-the-art Repo2Run on Repo2Run’s 420 repositories, while delivering clear gains on harder cases: on the more challenging Envbench, EvoConfig achieves a 78.1% success rate, outperforming Repo2Run by 7.1%. Beyond end-to-end success, EvoConfig also demonstrates stronger debugging competence, achieving higher accuracy in error identification and producing more effective repair recommendations than existing methods.", "area": "Code Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Software Engineering; Automated Environment Configuration; Multi-Agent Systems; Executable Environments"], "openreview_url": "https://openreview.net/forum?id=ACoJWTUB3P", "contribution_types": ["Analysis", "Engineering", "Low-resource"]}, {"id": "MEleuu9onS", "title": "IREASONER: Trajectory-Aware Intrinsic Reasoning Supervision for Self-Evolving Large Multimodal Models", "abstract": "Recent work shows that large multimodal models (LMMs) can self-improve from unlabeled data via self-play and intrinsic feedback. Yet existing self-evolving frameworks mainly reward final outcomes, leaving intermediate reasoning weakly constrained despite its importance for visually grounded decision making. We propose IREASONER, a self-evolving framework that improves an LMM’s implicit reasoning by explicitly eliciting chain-of-thought (CoT) and rewarding its internal agreement. In a Proposer–Solver loop over unlabeled images, IREASONER augments outcome-level intrinsic rewards with a trajectory-aware signal defined over intermediate reasoning steps, providing learning signals that distinguish reasoning paths leading to the same answer without ground-truth labels or external judges. Starting from Qwen2.5-VL-7B, IREASONER yields up to +2.1 points across diverse multimodal reasoning benchmarks under fully unsupervised post-training. We hope this work serves as a starting point for reasoning-aware self-improvement in LMMs in purely unsupervised settings. Our code will be released.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Multimodal Models", "Unsupervised Self-Evolution", "Reinforcement Learning", "Multimodal Reasoning"], "openreview_url": "https://openreview.net/forum?id=MEleuu9onS", "contribution_types": ["Analysis", "Engineering"]}, {"id": "mSlTXnQ5TI", "title": "ClinDoc Copilot: Enhancing Efficiency and Normalization in Chinese Outpatient Settings", "abstract": "Clinical documentation in Chinese outpatient settings is a legally regulated and time-intensive task, requiring physicians to produce records that are both efficient and auditable. Existing medical large language models demonstrate strong performance on medical benchmarks. However, their generated content cannot be directly adopted in clinical documentation due to legal risk, as responsibility for medical records cannot be delegated to or assumed by autonomous models. We present ClinDoc Copilot, a physician-centered assistant designed to support outpatient documentation. We evaluate ClinDoc Copilot in realistic simulated outpatient scenarios with licensed physicians and clinical trainees. Results show that the system improves documentation efficiency, terminology standardization, and evidence-grounded traceability. Our work highlights the value of interactive, physician-led AI assistance for clinical documentation in regulated healthcare settings. All code is available at an anonymous repository: https://anonymous.4open.science/r/ClinDoc-Copilot/README.md.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/ClinDoc-Copilot"], "keywords": ["Copilot", "medical LLM", "clinical documentation"], "openreview_url": "https://openreview.net/forum?id=mSlTXnQ5TI", "contribution_types": []}, {"id": "LRis39ZLv8", "title": "GrandGuard: Taxonomy, Benchmark, and Safeguards for Elderly-Chatbot Interaction Safety", "abstract": "As older adults increasingly use LLM-based chatbots for companionship and assistance, a safety gap is emerging. Older adults may face vulnerabilities from social isolation, limited digital literacy, and cognitive decline, yet existing safety benchmarks largely target general harms and overlook elderly-specific risks. For example, a prompt such as “how to repair a ceiling light alone in the dark” may be benign for most users but poses a serious fall risk for older adults with mobility limitations.\n\nWe introduce GrandGuard, the first comprehensive framework for assessing and mitigating elderly-specific contextual risks in LLM interactions. We develop a three-level taxonomy with 50 fine-grained risk types across mental well-being, financial, medical, toxicity, and privacy domains, grounded in real-world incidents, community discussions, and analysis of stakeholder studies. Using this taxonomy, we construct a benchmark of 10,404 labeled prompts and responses, showing that several leading LLMs mishandle elderly-specific contextual risks in over 50% of cases. We mitigate these failures with two safeguards: a fine-tuned Llama-Guard-3 and a policy-enhanced gpt-oss-safeguard-20b, achieving up to 96.2% and 90.9% unsafe-prompt detection accuracy, respectively. GrandGuard lays the groundwork for AI systems that move beyond general safety to support aging populations.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM safety", "older adults", "contextual risk", "safety benchmark", "guardrails", "policy-based moderation"], "openreview_url": "https://openreview.net/forum?id=LRis39ZLv8", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "lyKnvdt57u", "title": "DeepPlanning: Benchmarking Long-Horizon Agentic Planning with Verifiable Constraints", "abstract": "While agent evaluation has shifted toward long-horizon tasks, most benchmarks still emphasize local, step-level reasoning rather than the global constrained optimization (e.g., time and financial budgets) that demands genuine planning ability. Meanwhile, existing LLM planning benchmarks underrepresent the active information gathering and fine-grained local constraints typical of real-world settings. To address this, we introduce DeepPlanning, a challenging benchmark for practical long-horizon agent planning. It features multi-day travel planning and multi-product shopping tasks that require proactive information acquisition, local constrained reasoning, and global constrained optimization. Evaluations on DeepPlanning show that even frontier agentic LLMs struggle with these problems, highlighting the importance of reliable explicit reasoning patterns and parallel tool use for achieving better effectiveness-efficiency trade-offs. Error analysis further points to promising directions for improving agentic LLMs over long planning horizons. We open-source the code and data to support future research.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM Agent Evaluation", "Tool Use", "Long-horizon planning"], "openreview_url": "https://openreview.net/forum?id=lyKnvdt57u", "contribution_types": ["Dataset", "Data Analysis"]}, {"id": "wRQn4dCPCD", "title": "LOLGORITHM: Funny Comment Generation Agent For Short Videos", "abstract": "This paper presents LOLGORITHM, a modular multi-agent system for stylized comment generation in short-form videos. The system employs video segmentation, emotion extraction, and stylized prompt construction to support six distinct comment styles: puns, rhymes, memes, sarcasm, humor, and content extraction. We construct a bilingual dataset covering both TikTok and YouTube platforms, encompassing five categories of popular videos. Experimental results demonstrate that LOLGORITHM outperforms existing methods in both automated metrics and human preference evaluations, achieving user preference rates exceeding 90% on TikTok and 87.55% on YouTube. This research provides a scalable framework for enhancing interactivity and cultural dissemination on short-video platforms.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["short video comment generation", "multimodal language model", "style-controlled generation", "multi-agent system", "bilingual dataset", "humor modeling"], "openreview_url": "https://openreview.net/forum?id=wRQn4dCPCD", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "9TRrtL4a44", "title": "Mind Reader: Latent User Demand-Guided Content Optimization for Generative Search Engine", "abstract": "Generative Search Engines (GSEs) have reshaped information retrieval, and Generative Engine Optimization (GEO) emerges to improve the content visibility in GSEs' responses. Previous methods mainly rely on empirical strategies or query-dependent preferences of GSEs for content optimization. However, they remain limited in effectiveness as they overlook the latent user search demands in queries that drive content retrieval and response generation of GSEs. To address this, we propose Mind Reader, a novel GEO method to effectively improve the content visibility within the generated responses of GSEs through content optimization guided by the extracted latent demands of user search. Specifically, we propose a decomposition-recombination query augmentation module, which enriches the query with latent semantic information by decomposing it into diverse perspectives, capturing underlying semantic information, and recombining them into variants to support subsequent optimization. Then, we propose a reasoning coverage content optimization module. By optimizing content to cover critical reasoning information of GSEs, we align the content with the user search demands, effectively improving the content visibility. Extensive experiments on widely used GEO-Bench and our proposed PC-GEO show that our method significantly outperforms baselines and effectively improves content visibility (with up to 2.44x objective metrics and 1.23x subjective metrics on average).", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["generative engine optimization", "search demand extraction", "query augmentation", "reasoning coverage"], "openreview_url": "https://openreview.net/forum?id=9TRrtL4a44", "contribution_types": []}, {"id": "eHmGsHEiUE", "title": "SCULPT: Constraint-Guided Pruned MCTS that Carves Efficient Paths for Mathematical Reasoning", "abstract": "Automated agent workflows can enhance the problem-solving ability of large language models (LLMs), but common search strategies rely on stochastic exploration and often traverse implausible branches. This occurs because current pipelines sample candidate steps from generic prompts or learned policies with weak domain priors, yielding near-random walks over operators, units, and formats. To promote ordered exploration, this paper introduces SCULPT, a constraint-guided approach for Monte Carlo Tree Search (MCTS) that integrates domain-aware scoring into selection, expansion, simulation, and backpropagation. SCULPT scores and prunes actions using a combination of symbolic checks (dimensional consistency, type compatibility, magnitude sanity, depth control, and diversity) and structural pattern guidance, thereby steering the search toward plausible reasoning paths. Under matched LLM configurations, SCULPT yields stable improvements on multiple datasets; additional results with GPT-5.2 assess executor transferability and performance on frontier reasoning models. Overall, domain-aware constraints can improve accuracy while maintaining efficiency and reasoning stability.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["mathematical reasoning", "Monte Carlo tree search", "constraint-guided search", "LLM agents", "workflow optimization", "symbolic constraints"], "openreview_url": "https://openreview.net/forum?id=eHmGsHEiUE", "contribution_types": ["Engineering", "Efficiency"]}, {"id": "7DfxCMFzTA", "title": "Remember Me, Refine Me: A Dynamic Procedural Memory Framework for Experience-Driven Agent Evolution", "abstract": "Procedural memory enables large language model (LLM) agents to internalize ''how-to'' knowledge and thus reduce redundant trial-and-error. However, existing frameworks predominantly suffer from a ''passive accumulation'' paradigm, treating memory as a static append-only archive. To bridge the gap between static storage and dynamic reasoning, we propose ReMe (Remember Me, Refine Me), a comprehensive framework for experience-driven agent evolution. ReMe manages the memory lifecycle via three mechanisms: 1) multi-faceted distillation, which extracts fine-grained experiences by recognizing success patterns, analyzing failure triggers and generating comparative insights; 2) context-adaptive reuse, which tailors historical insights to new contexts through scenario-aware indexing; and 3) utility-based refinement, which automatically adds validated memories and prunes outdated ones to maintain a compact, high-quality experience pool. Experiments on BFCL-V3 and AppWorld demonstrate that ReMe establishes a new state-of-the-art in agent memory system. Crucially, we observe a significant memory-scaling effect: Qwen3-8B equipped with ReMe outperforms larger, memoryless Qwen3-14B, indicating that self-evolving memory provides a computation-efficient path for lifelong learning.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Agent Memory System", "Procedural Memory Management", "Agent Evolution"], "openreview_url": "https://openreview.net/forum?id=7DfxCMFzTA", "contribution_types": ["Engineering", "Reproduction"]}, {"id": "iB1hRBqjhz", "title": "PandaGuard: A Systematic Framework for Evaluating LLM Safety Against Jailbreaking Attacks", "abstract": "Large language models (LLMs) have achieved remarkable capabilities but remain vulnerable to adversarial prompts known as jailbreaks, which can bypass safety alignment and elicit harmful outputs. Despite growing efforts in LLM safety research, existing evaluations are often fragmented, focused on isolated attack or defense techniques, and lack systematic, reproducible analysis. In this work, we introduce \\textsc{PandaGuard}, a unified and modular framework that models LLM jailbreak safety as a multi-agent system comprising attackers, defenders, and judges. Our framework implements 19 attack methods and 12 defense mechanisms, along with multiple judgment strategies, all within a flexible plugin architecture supporting diverse LLM interfaces, multiple interaction modes, and configuration-driven experimentation that enhances reproducibility and practical deployment. Built on this framework, we develop \\textsc{PandaBench}, a comprehensive benchmark that evaluates the interactions between these attack/defense methods across 49 LLMs and various judgment approaches, requiring over 3 billion tokens to execute. Our extensive evaluation reveals key insights into model vulnerabilities, defense cost-performance trade-offs, and judge consistency. We find that no single defense is optimal across all dimensions and that judge disagreement introduces nontrivial variance in safety assessments. We release the code, configurations, and evaluation results to support transparent and reproducible research in LLM safety.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Jailbreak Attacks", "Safety Alignment", "Benchmark Evaluation"], "openreview_url": "https://openreview.net/forum?id=iB1hRBqjhz", "contribution_types": ["Analysis", "Reproduction", "Data Analysis"]}, {"id": "Ye2dEUW0IZ", "title": "Let Retrievers Think Before Action: Thought-Augmented Embedding for Dense Retrieval", "abstract": "Large language models (LLMs) have demonstrated that explicitly performing step-by-step thinking before producing final outputs can substantially improve performance on complex tasks, as exemplified by recent reasoning-oriented models such as OpenAI O1 and DeepSeek R1. Inspired by these advancements, we propose the O1 Embedder, a novel approach aiming to endow retrieval models with similar capabilities to address challenges like multi-task retrieval, zero-shot retrieval, and tasks requiring intensive reasoning of complex relationships. The O1 Embedder generates preliminary thoughts for input queries before document retrieval.  To realize this objective, we address two fundamental challenges in integrating thinking mechanisms into dense retrieval. First, retrieval tasks lack explicit supervision for intermediate thinking processes, making it difficult to define thoughts that are truly useful for retrieval. We address this challenge with a data synthesis framework following an “Exploration-Refinement” process, ensuring alignment with retrieval utility. Second, effectively integrating thought generation with representation learning requires a unified modeling framework that can jointly support generation and embedding within a single model. O1 Embedder addresses this challenge by jointly optimizing thought generation and dense retrieval in an end-to-end manner, enhancing retrieval accuracy while reducing complexity through a single deployable model. Extensive evaluations across diverse datasets demonstrate significant performance improvements, highlighting the effectiveness and generalization capability of O1 Embedder.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Dense Retrieval", "Embedding Model", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=Ye2dEUW0IZ", "contribution_types": ["Analysis"]}, {"id": "JBZKVcEDNT", "title": "HER: Human Emulation Reasoning for Thinking-in-Character Role-playing", "abstract": "LLM role-playing, i.e., using large language models (LLMs) to simulate specific personas, has emerged as a key capability in various applications, such as companionship, content creation, and digital games. While current models effectively capture character tones and knowledge, simulating the inner thoughts behind their behaviors remains a non-trivial challenge. Towards cognitive simulation in LLM role-play, previous efforts have mainly suffered from two critical deficiencies: the lack of high-quality datasets with explicit reasoning traces and the absence of reliable reward signals aligned with human preferences.\nIn this paper, we propose HER (\\textbf{H}uman \\textbf{E}mulation \\textbf{R}easoning), a unified framework for cognitive-level persona simulation. HER introduces a dual-layer thinking mechanism that strictly distinguishes characters' first-person thinking processes from LLMs' third-person reasoning. To bridge the aforementioned gaps, we curate a reasoning-augmented role-playing dataset via a reverse engineering strategy for supervised learning, and construct human-aligned evaluation principles and preference-based reward models for role-play reinforcement learning.\nLeveraging these resources, we train HER models based on the Qwen3-32B backbone via a hybrid paradigm of supervised learning (SL) and reinforcement learning from human feedback (RLHF). Extensive experiments validate the effectiveness of our approach. Notably, our models significantly outperform the Qwen3-32B baseline, achieving a 30.26% on the CoSER benchmark and a 14.97% on the MiniMax Benchmark. Our datasets, evaluation principles, and trained models will be released to facilitate future research in cognitive-level LLM role-playing.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["rolepaly", "rl", "LLM", "Reward Model", "persona"], "openreview_url": "https://openreview.net/forum?id=JBZKVcEDNT", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "qF0BEdgmG1", "title": "How to Make Line-Level Defect Prediction More Effective?", "abstract": "Line-level defect prediction aims to precisely localize defect-prone code, yet its effectiveness is often limited by insufficient inter-line context modeling and weak coordination across granularities.\nTo make line-level defect prediction more effective, We propose PHLDP, a $\\textbf{P}$DG-to-sequence $\\textbf{H}$ierarchical $\\textbf{L}$ine-level $\\textbf{D}$efect $\\textbf{P}$rediction model that jointly learns defect patterns at both file and line levels.\nPHLDP improves effectiveness through (1) PDG-to-sequence conversion to preserve control and data dependencies, (2) hierarchical representation learning for local and global semantics, and (3) dual-level supervision to jointly optimize file-level and line-level predictions.\nExperiments on multiple open-source projects show that PHLDP consistently outperforms state-of-the-art baselines in both within-project and cross-project settings, particularly on effort-aware metrics, validating its practical effectiveness for line-level defect prediction.\nOur code is available at: https://anonymous.4open.science/r/PHLDP-7181/", "area": "Code Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/PHLDP-0247181", "https://anonymous.4open.science/r/PHLDP-7181"], "keywords": ["code intelligence", "defect prediction", "program analysis", "AI for software engineering"], "openreview_url": "https://openreview.net/forum?id=qF0BEdgmG1", "contribution_types": ["Engineering"]}, {"id": "WSl5mW3zuV", "title": "Kaiyuan-2B: Pushing the Limits of Fully-Open Language Model through Data Benchmarking and Curriculum", "abstract": "The rapid advancement of Large Language Models (LLMs) has resulted in a significant knowledge gap between the open-source community and industry, primarily because the latter relies on closed-source, high-quality data and training recipes. To address this, we introduce Kaiyuan-2B, a fully open-source 2-billion-parameter model focused on improving training efficiency and effectiveness under resource constraints. Our methodology includes three key innovations in a data-centric way: a Quantile Data Benchmarking method for systematically comparing heterogeneous open-source datasets and providing insights on data mixing strategies; a Bi-Level Curriculum Training policy that progressively introduces domain-specialized and refined samples at both phase and instance levels; and a Strategic Selective Repetition scheme within the multi-phase paradigm to effectively leverage sparse, high-quality data. Kaiyuan-2B achieves performance competitive with state-of-the-art fully open-source models, demonstrating practical and scalable solutions for resource-limited pretraining. We release all assets (including model weights, data, and code) under the Apache 2.0 license.", "area": "Language Models", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Kaiyuan-Spark-4E83"], "keywords": ["Open source", "Language Model pretraining", "Data benchmarking", "Data curriculum"], "openreview_url": "https://openreview.net/forum?id=WSl5mW3zuV", "contribution_types": ["Data Analysis"]}, {"id": "NvGW4WHVLO", "title": "\"Excuse me, may I say something...\" CoLabScience, A Proactive AI Assistant for Biomedical Discovery and LLM-Expert Collaborations", "abstract": "The integration of Large Language Models (LLMs) into scientific workflows presents exciting opportunities to accelerate biomedical discovery. However, the reactive nature of LLMs, which respond only when prompted, limits their effectiveness in collaborative settings that demand foresight and autonomous engagement. In this study, we introduce CoLabScience, a proactive LLM assistant designed to enhance biomedical collaboration between AI systems and human experts through timely, context-aware interventions. At the core of our method is PULI (Positive-Unlabeled Learning-to-Intervene), a novel framework trained with a reinforcement learning objective to determine when and how to intervene in streaming scientific discussions, by leveraging the team's project proposal and long- and short-term conversational memory. To support this work, we introduce BSDD (Biomedical Streaming Dialogue Dataset), a new benchmark of simulated research discussion dialogues with intervention points derived from PubMed articles. Experimental results show that PULI significantly outperforms existing baselines in both intervention precision and collaborative task utility, highlighting the potential of proactive LLMs as intelligent scientific assistants.", "area": "Human-AI", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Human-AI Collaboration", "Large Language Models", "Biomedical NLP", "Proactive LLM Assistant", "Biomedical Discovery"], "openreview_url": "https://openreview.net/forum?id=NvGW4WHVLO", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "RlhiIO5Ivm", "title": "EDUMATH: Generating Standards-aligned Educational Math Word Problems", "abstract": "Math word problems (MWPs) are critical K-12 educational tools, and customizing them to students' interests and ability levels can enhance learning. However, teachers struggle to find time to customize MWPs for students given large class sizes and increasing burnout. We propose that LLMs can support math education by generating MWPs customized to student interests and math education standards. We use a joint human expert-LLM judge approach to evaluate over 11,000 MWPs generated by open and closed LLMs and develop the first teacher-annotated dataset for standards-aligned educational MWP generation. We show the value of our data by using it to train a 12B open model that matches the performance of larger and more capable open models. We also use our teacher-annotated data to train a text classifier that enables a 30B open LLM to outperform existing closed baselines without any training. Next, we show our models' MWPs are more similar to human-written MWPs than those from existing models. We conclude by conducting the first study of customized LLM-generated MWPs with grade school students, finding they perform similarly on our models' MWPs relative to human-written MWPs but consistently prefer our customized MWPs.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["NLP Applications", "educational applications", "educational math word problem generation", "teacher/student evaluation"], "openreview_url": "https://openreview.net/forum?id=RlhiIO5Ivm", "contribution_types": ["Dataset"]}, {"id": "OTxIflA32D", "title": "From Isolated Scoring to Collaborative Ranking: A Comparison-Native Framework for LLM-Based Paper Evaluation", "abstract": "Large language models (LLMs) are currently applied to scientific paper evaluation by assigning an absolute score to each paper independently. However, since score scales vary across conferences, time periods, and evaluation criteria, models trained on absolute scores are prone to fitting narrow, context‑specific rules rather than developing robust scholarly judgment. To overcome this limitation, we propose shifting paper evaluation from isolated scoring to collaborative ranking. In particular, our framework explicitly integrates comparison into both data construction and model learning. We first propose a graph-based similarity ranking algorithm to facilitate the sampling of
