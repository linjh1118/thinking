rther construct GraphMind-Botnet, a LLM-driven botnet designed to evaluate the performance of existing social bot detection algorithms. \nExperiments on datasets derived from GraphMind-Botnet show that both text-based and graph-based detection models struggle to distinguish human users from bots. Our results highlight the critical role of social link construction in LLM-driven social network generation, while exposing fundamental weaknesses in existing bot detection mechanisms.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["LLM", "Social bot", "Multi-agent", "simulation"], "openreview_url": "https://openreview.net/forum?id=pKVPJj3cbV", "contribution_types": ["Engineering"]}, {"id": "HUYQUEdnWM", "title": "Reviewing the Reviewer: Elevating Peer Review Quality through LLM-Guided Feedback", "abstract": "Peer review is central to scientific quality, yet reliance on simple heuristics—\\textit{lazy thinking}—has lowered standards. Prior work treats lazy thinking detection as a single-label task, but review segments may exhibit multiple issues, including broader clarity problems, or \\textit{specificity} issues. Turning detection into actionable improvements requires guideline-aware feedback, which is currently missing. We introduce an LLM-driven framework that decomposes reviews into argumentative segments, identifies issues via a neurosymbolic module combining LLM features with traditional classifiers, and generates targeted feedback using issue-specific templates refined by a genetic algorithm. Experiments show our method outperforms zero-shot LLM baselines and improves review quality by up to 92.4\\%. We also release \\textsc{LazyReviewPlus}, a dataset of 1,309 sentences labeled for lazy thinking and specificity.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["peer review", "review quality", "issue detection", "feedback generation", "large language models"], "openreview_url": "https://openreview.net/forum?id=HUYQUEdnWM", "contribution_types": ["Engineering", "Dataset"]}, {"id": "4qj7PoKoyl", "title": "KE-Diffusion: Knowledge-Enhanced Diffusion for Image Captioning via Object-Level Semantic Conditioning", "abstract": "Image captioning systems face a long-standing trade-off between generation diversity, semantic fidelity, and computational efficiency. Autoregressive models often suffer from limited diversity and error accumulation, while recent diffusion-based approaches improve diversity at the cost of increased model complexity or insufficient semantic grounding. In this work, we propose KE-diffusion, a knowledge-enhanced lightweight diffusion model for image captioning that integrates object-level visual perception with semantic conditioning in a parameter-efficient manner. Instead of relying on global image embeddings or prefix-based conditioning, KE-diffusion constructs compact visual–semantic condition vectors from detected object regions and injects them directly into the reverse diffusion process via model-level feature concatenation. This design enables effective semantic guidance while preserving the efficiency and parallel generation advantages of diffusion models. Extensive experiments on MS-COCO and Flickr30k demonstrate that KE-diffusion consistently improves semantic accuracy and caption diversity over prior lightweight diffusion models. Additional analyses on cross-domain captioning and visualization further validate the robustness and interpretability of the proposed approach.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Image Captioning", "Diffusion Models", "Multimodal Generation", "Semantic Conditioning", "Knowledge-Enhanced Models", "Non-Autoregressive Generation"], "openreview_url": "https://openreview.net/forum?id=4qj7PoKoyl", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "61ENQ9OOUY", "title": "Reading the Air: Evaluating Field Intelligence of LLMs in Social Dynamics", "abstract": "Socially embedded LLM agents must not only interpret what is said, but also infer latent motives, track group-level atmosphere, and choose actions that remain normatively appropriate under uncertainty. We present GroupMind, a benchmark for evaluating Field Intelligence via a progressive three stage chain: Subtext Deciphering, Atmosphere Recognition, and Social Appropriateness. GroupMind contains 3,084 multi-turn, high-tension social interactions spanning seven scenario families, constructed with a sociology simulation pipeline that instantiates interaction topologies and applies LLM-assisted generation with consensus and human verification. We evaluate models under controlled factors of information visibility and conversational noise, and introduce Holistic Social Success Rate (HSR) to measure end-to-end reliability across the full cognition-to-action loop. Experiments on 20 LLMs reveal a consistent knowledge–action gap: strong subtask accuracy does not reliably translate into socially appropriate decisions, with the best model achieving only 70.0% HSR in the easiest setting and dropping to 55.2% under combined constraints. Code and data are available at https://anonymous.4open.science/r/Groupmind-EA56.", "area": "Dialogue and Interactive Systems", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Groupmind-EA56"], "keywords": ["Social Intelligence", "Large Language Models", "Theory of Mind"], "openreview_url": "https://openreview.net/forum?id=61ENQ9OOUY", "contribution_types": ["Analysis", "Dataset", "Data Analysis"]}, {"id": "9goazbqZY9", "title": "Boosting Multimodal Retrieval-Augmented Generation for Knowledge-Based VQA with One-pass Ladder Reranking", "abstract": "Evidence selection remains a major bottleneck in Multimodal retrieval-augmented generation (RAG) for Knowledge-Based visual question answering (VQA). Current rerankers typically score candidates in isolation or employ single-round selection, failing to model the inherently comparative nature of evidence ranking. As a result, they struggle with hard negatives candidates that are either visually near-duplicates of the query but textually irrelevant or textually plausible yet visually inconsistent with the image. To address these problems, we propose Multimodal One-pass Ladder Tournament, called MOLT, which reformulates reranking as a sequential ladder-style tournament. Instead of assigning absolute ranking scores, MOLT progressively filters distractors through explicit multimodal pairwise comparisons in a single decoding pass. To ensure robust learning, we introduce a two-stage training strategy: (1) supervised fine-tuning (SFT) initialized via distillation from a strong teacher model, followed by (2) reinforcement learning using Group Relative Policy Optimization (GRPO) with a composite reward that jointly optimizes output format compliance, step-wise logical consistency, and final selection accuracy. Experiments on two widely-used benchmarks show that MOLT achieves state-of-the-art performance, which outperforms compared methods by up to 7.3 percentage points. The code is available at https://anonymous.4open.science/r/molt.", "area": "Question Answering", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/molt"], "keywords": ["Knowledge-Based VQA", "Multimodal Retrieval-Augmented Generation"], "openreview_url": "https://openreview.net/forum?id=9goazbqZY9", "contribution_types": ["Engineering"]}, {"id": "vXP2nd6dr4", "title": "HW-GNN: Homophily-Aware Gaussian-Window Constraint Graph spectral network for Social Network Bot Detection", "abstract": "Social bots are increasingly polluting online platforms by spreading misinformation and engaging in coordinated manipulation, posing severe threats to cybersecurity. Graph Neural Networks (GNNs) have become mainstream for social bot detection due to their ability to integrate structural and attribute features, with spectral-based approaches demonstrating particular efficacy due to discriminative patterns in the spectral domain. However, current spectral GNN methods face two limitations: (1) their broad-spectrum fitting mechanisms degrade the focus on bot-specific spectral features, and (2) certain domain knowledge valuable for bot detection, e.g., low homophily correlates with high-frequency features, has not been fully incorporated into existing methods.\n\nTo address these challenges, we propose HWGNN, a novel homophily-aware graph spectral network with Gaussian window constraints. Our framework introduces two key innovations: (i) a Gaussian-window constrained spectral network that employs learnable Gaussian windows to highlight bot-related spectral features, and (ii) a homophily-aware adaptation mechanism that injects domain knowledge between homophily ratios and frequency features into the Gaussian window optimization process. Through extensive experimentation on multiple benchmark datasets, we demonstrate that HWGNN achieves state-of-the-art bot detection performance, outperforming existing methods with an average improvement of 4.6% in F1-score, while exhibiting strong plug-in compatibility with existing spectral GNNs.", "area": "Social NLP", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Social Bot Detection", "Graph Neural Networks", "Gaussian-Window Spectral Focusing", "Homophily-Aware Mechanism"], "openreview_url": "https://openreview.net/forum?id=vXP2nd6dr4", "contribution_types": ["Analysis", "Engineering", "Reproduction", "Theory"]}, {"id": "vhHbm4Su04", "title": "HyperRAG: Combining Retrieval-Augmented Generation and Hyperbolic Embeddings for Ontology-Based Phenotype Linking from Text", "abstract": "Extracting structured knowledge from unstructured text is a fundamental challenge in machine learning, particularly for concepts organized within complex hierarchical ontologies. In genomics, identifying phenotypes from clinical narratives is crucial for diagnostic precision, yet current methods struggle with contextual interpretation and subtle clinical descriptions.\nWe present HyperRAG, a workflow that combines semantic and hierarchical signals for ontology-based entity linking.\nBy integrating Large Language Models with Retrieval-Augmented Generation and a hybrid reranking strategy using both Euclidean (semantic) and hyperbolic (hierarchical) embeddings trained on Human Phenotype Ontology, our approach improves entity linking while ensuring ontological consistency.\nWe show that while hyperbolic embeddings alone improve hierarchical consistency, their main benefit emerges when used as a hierarchy-aware prior in a hybrid reranking scheme. Experiments on benchmark and real-world clinical datasets demonstrate improved recall, ranking quality, and ontological coherence compared to prior systems, particularly for implicit phenotype mentions. We further introduce a hierarchy-aware evaluation framework that reflects clinical relevance beyond exact-match metrics. All code, models, and datasets will be released upon publication.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Information retrieval", "Ontology", "Biomedical NLP", "Hyperbolic embeddings", "Evaluation framework"], "openreview_url": "https://openreview.net/forum?id=vhHbm4Su04", "contribution_types": ["Engineering", "Dataset"]}, {"id": "JoNsPyopj9", "title": "From Context to EDUs: Faithful and Structured Context Compression via Elementary Discourse Unit Decomposition", "abstract": "Managing long context is a bottleneck for large language models (LLMs), introducing high costs and noise. Existing compression methods often disrupt local coherence or rely on latent encodings subject to positional bias and API incompatibility. We propose the EDU-based Context Compressor, an explicit framework designed to preserve structure and detail. We reformulate compression as a structure-then-select process: First, LingoEDU parses text into an Elementary Discourse Unit (EDU) relation tree, anchored to source indices to prevent hallucination. Second, a lightweight module ranks and selects query-relevant sub-trees. To evaluate structural understanding, we introduce StructBench, a manually annotated dataset of 248 documents. Empirical results demonstrate that our method achieves SOTA structural prediction accuracy and significantly outperforms frontier LLMs while reducing costs. Furthermore, our structure-aware compression substantially enhances performance across downstream tasks ranging from long-context tasks to complex Deep Search scenarios.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Deep Search", "Context Compression", "Hallucination Mitigation"], "openreview_url": "https://openreview.net/forum?id=JoNsPyopj9", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset", "Data Analysis"]}, {"id": "i6JHh2f0Wa", "title": "COP: A Memory-Augmented Chain-of-Paradigms Framework for Inductive Reasoning", "abstract": "Large language models (LLMs) have achieved strong performance in text generation, yet their inductive reasoning processes often exhibit instability and limited generalization across tasks. In this work, we propose Chain of Paradigms (COP), a memory-augmented inductive reasoning framework that enables reusable high-level reasoning patterns to be stored, retrieved, and instantiated during inference. COP consists of a problem expander for extracting task-critical information, a lightweight paradigm buffer that maintains structured reasoning patterns, and a dynamic retrieval mechanism that selects relevant paradigms via semantic matching. These components form a closed-loop reasoning process that supports pattern reuse across tasks while mitigating erratic inference behaviors. We evaluate COP on the Big-Bench Hard (BBH) benchmark using exact match accuracy, inference cost, and cross-task pattern reuse metrics, with controlled comparisons against existing prompting and agent-based reasoning methods. Experimental results demonstrate consistent improvements in accuracy and robustness over strong baselines, while maintaining efficient inference. This work enhances the reliability of generative models in complex reasoning tasks, provides insights into aligning AI inference with human cognitive patterns, and contributes to interdisciplinary research at the intersection of cognitive psychology and AI alignment.", "area": "Linguistics", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Chain of Paradigms", "Human cognitive processes", "Memory-Augmented Framework", "Pattern Reuse", "Cognitive Modeling"], "openreview_url": "https://openreview.net/forum?id=i6JHh2f0Wa", "contribution_types": ["Engineering", "Dataset", "Data Analysis", "Theory"]}, {"id": "52V3GXjOcf", "title": "AfriqueLLM: How Data Mixing and Model Architecture Impact Continued Pre-training for African Languages", "abstract": "Large language models (LLMs) are increasingly multilingual, yet open models continue to underperform relative to proprietary systems, with the gap most pronounced for African languages. Continued pre-training (CPT) offers a practical route to language adaptation, but improvements on demanding capabilities such as mathematical reasoning often remain limited. This limitation is driven in part by the uneven domain coverage and missing task-relevant knowledge that characterize many low-resource language corpora. We present AfriqueLLM, a suite of open LLMs adapted to 20 African languages through CPT on 26B tokens. We perform a comprehensive empirical study across five base models spanning sizes and architectures, including Llama 3.1, Gemma 3, and Qwen 3, and systematically analyze how CPT data composition shapes downstream performance. In particular, we vary mixtures that include math, code, and synthetic translated data, and evaluate the resulting models on a range of multilingual benchmarks. Our results identify data composition as the primary driver of CPT gains. Adding math, code, and synthetic translated data yields consistent improvements, including on reasoning-oriented evaluations. Within a fixed architecture, larger models typically improve performance, but architectural choices dominate scale when comparing across model families. Moreover, strong multilingual performance in the base model does not reliably predict post-CPT outcomes; robust architectures coupled with task-aligned data provide a more dependable recipe. Finally, our best models improve long-context performance, including document-level translation.", "area": "Multilinguality and Language Diversity", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["African LLM", "Continue Pretrain", "Data Mixture"], "openreview_url": "https://openreview.net/forum?id=52V3GXjOcf", "contribution_types": ["Engineering", "Reproduction", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "C7QyAgKLlm", "title": "PD$^3$: A Framework for Project Duplication Detection via Adapted Multi-Agent Debate", "abstract": "Project duplication detection is critical for project quality assessment by preventing investing in newly proposed projects whose topics are already studied. Existing methods rely on word- and sentence-level comparison or solely apply large language models, lacking valuable insights generation and in-depth comprehension of core content and detection criteria. To address this, we propose **PD$^3$**, a framework for **P**roject **D**uplication **D**etection via adapted multi-agent **D**ebate. Inspired by real-world expert discussion and tournament formats, PD$^3$ employs a fair round-robin competition format in multi-agent debate to retrieve relevant projects and generates both qualitative and quantitative feedback for greater practicality. Over 800 real-world power projects spanning 22 specialized fields are used for evaluation, demonstrating 8.37% and 8.00% improvements in precision and accuracy in two key tasks. Furthermore, we develop and deploy ***Review Dingdang***, an online platform assisting power experts, which has already saved 13.44 million USD across 442 newly proposed projects. Codes are available in [this repository](https://anonymous.4open.science/r/Anonymous-Repo-F1DB/).", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Anonymous-Repo-F1DB"], "keywords": ["Project Duplication Detection", "Multi-Agent Debate", "Large Language Model"], "openreview_url": "https://openreview.net/forum?id=C7QyAgKLlm", "contribution_types": ["Engineering", "Reproduction"]}, {"id": "gRbreJtjST", "title": "AROMA: Augmented Reasoning Over a Multimodal Architecture for Virtual Cell Genetic Perturbation Modeling", "abstract": "Virtual cell modeling predicts molecular state changes under genetic perturbations in silico, and is essential for biological mechanism studies. However, existing approaches suffer from unconstrained reasoning, uninterpretable predictions, and retrieval signals that are weakly aligned with regulatory topology. To address these limitations, we propose AROMA, an Augmented Reasoning Over a Multimodal Architecture for virtual cell genetic perturbation modeling. AROMA integrates textual evidence, graph-topology information, and protein sequence features to model perturbation-target dependencies, and is trained with a two-stage optimization strategy to yield predictions that are both accurate and interpretable. We also construct two knowledge graphs and a perturbation reasoning dataset, PerturbReason, containing more than 498k samples, as reusable resources for the virtual cell domain. Experiments show that AROMA outperforms existing methods across multiple cell lines, and remains robust under zero-shot evaluation on an unseen cell line, as well as in knowledge-sparse, long-tail scenarios. Overall, AROMA demonstrates that combining knowledge-driven multimodal modeling with evidence retrieval provides a promising pathway toward more reliable and interpretable virtual cell perturbation prediction.  Model weights is available at an anonymous HuggingFace repository: https://huggingface.co/AnonymousModel/AROMA.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Virtual cell perturbation prediction", "Knowledge-graph grounded multimodal modeling", "Retrieval-augmented reasoning"], "openreview_url": "https://openreview.net/forum?id=gRbreJtjST", "contribution_types": ["Analysis", "Engineering", "Dataset"]}, {"id": "B8V3JsFGUT", "title": "SGPVT: Self-Generated Proximal Visual Tokens for Mitigating Proximal Collateral Damage in MLLM Unlearning", "abstract": "Machine unlearning in multimodal large language models (MLLMs) aims to remove specific concepts while preserving overall utility. However, existing approaches focus primarily on general utility metrics, overlooking the preservation of semantically related concepts. We present the first systematic analysis of this proximal collateral damage, revealing that forgetting vulnerability correlates strongly with visual embedding similarity in a smooth gradient across the semantic space. Based on this insight, we propose a novel unlearning framework that introduces Self-Generated Proximal Visual Tokens (SGPVTs), which are synthetically perturbed visual representations around the target concept. Our method employs an adaptive cosine-band curriculum with a dual-stream objective: forgetting the target via gradient ascent while distilling knowledge from a frozen teacher model into proximal tokens to prevent degradation. Extensive experiments demonstrate that our approach significantly outperforms existing methods in preserving semantically related concepts while achieving effective target unlearning, eliminating the need for manual retention set curation. Our source code will be released in the near future.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Machine unlearning", "Multimodal Large Language Model"], "openreview_url": "https://openreview.net/forum?id=B8V3JsFGUT", "contribution_types": ["Engineering", "Dataset"]}, {"id": "cjijGA6E2k", "title": "Disco-RAG: Discourse-Aware Retrieval-Augmented Generation", "abstract": "Retrieval-Augmented Generation (RAG) has emerged as an important means of enhancing the performance of large language models (LLMs) in knowledge-intensive tasks. However, most existing RAG strategies treat retrieved passages in a flat and unstructured way, which prevents the model from capturing structural cues and constrains its ability to synthesize knowledge from dispersed evidence across documents. To overcome these limitations, we propose Disco-RAG, a discourse-aware framework that explicitly injects discourse signals into the generation process. Our method constructs intra-chunk discourse trees to capture local hierarchies and builds inter-chunk rhetorical graphs to model cross-passage coherence. These structures are jointly integrated into a planning blueprint that conditions the generation. Experiments on question answering and long-document summarization benchmarks show the efficacy of our approach. Disco-RAG achieves state-of-the-art results on the benchmarks without fine-tuning. These findings underscore the important role of discourse structure in advancing RAG systems.", "area": "RAG", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/Discourse-RAG"], "keywords": ["Retrieval-Augmented Generation", "Discourse-aware Generation", "Rhetorical Structure Theory", "Discourse Structure"], "openreview_url": "https://openreview.net/forum?id=cjijGA6E2k", "contribution_types": ["Engineering"]}, {"id": "G1lnOSLaEv", "title": "When Cultures Meet: Multicultural Text-to-Image Generation", "abstract": "Text-to-image generation models have achieved strong performance in culturally homogeneous settings, yet their ability to generate multicultural scenes—where people and landmarks originate from different cultures—remains largely unexplored.\nWe introduce multicultural text-to-image generation as a new task and present the first benchmark designed to study this setting. Our dataset contains 9,000 images spanning five countries, three age groups, two genders, 25 historical landmarks, and five languages. Using this benchmark, we analyze the behavior of state-of-the-art text-to-image models across multiple dimensions, including alignment, image quality, aesthetics, knowledge, and fairness.\nAs one strategy for composing cultural and demographic information, we explore MosAIG, a Multi-Agent framework that enhances multicultural image generation by leveraging large language models with distinct cultural personas. Our analysis shows that richer prompt composition can improve image quality and cultural grounding compared to simple prompts, while also revealing substantial disparities across languages and demographic groups. We release our dataset and code at https://anonymous.4open.science/r/MosAIG", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MosAIG.6148", "https://anonymous.4open.science/r/MosAIG.", "https://anonymous.4open.science/r/MosAIG"], "keywords": ["multicultural", "text to image generation", "multilingual", "multi agent", "demographics", "benchmark"], "openreview_url": "https://openreview.net/forum?id=G1lnOSLaEv", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "navVaKAhs6", "title": "Slow-Vision, Fast-Language: Training-Free Efficient Inference for dMLLMs", "abstract": "Diffusion-based Multimodal Large Language Models (dMLLMs) represent a promising frontier in generative AI, yet their practical deployment is severely hindered by the computational burden of iterative denoising on high-resolution visual sequences. In this work, we identify a fundamental asymmetry: visual tokens exhibit high spatial redundancy and tend to aggregate semantically, whereas text tokens drive the dynamic evolution of reasoning. Challenging the coarse \"all-or-nothing\" approach of existing token pruning methods, we propose Slow-Vision, Fast-Language (SVFL), a training-free acceleration paradigm for dMLLMs. SVFL maintains the complete visual panorama in intermittent \"slow\" layers, allowing only specific visual details to be dynamically summoned by text attention for efficient interaction in frequent \"fast\" layers. Extensive experiments on the state-of-the-art dMLLM, LLaDA-V, demonstrate that SVFL achieves significant inference acceleration with negligible performance degradation. Furthermore, we verify the framework's universality on the autoregressive \\textbf{LLaVA-1.5}, confirming its effectiveness across diverse generative paradigms.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Multimodal diffusion Large Language Models，Efficient Inference，Training-free Methods"], "openreview_url": "https://openreview.net/forum?id=navVaKAhs6", "contribution_types": ["Analysis", "Efficiency"]}, {"id": "NH2xIXmQ4q", "title": "SpecMind: Cognitively Inspired, Interactive Multi-Turn Framework for Postcondition Inference", "abstract": "Specifications are vital for ensuring program correctness, yet writing them manually remains challenging and time-intensive. Recent large language model (LLM)-based methods have shown successes in generating specifications such as postconditions, but existing single-pass prompting often yields inaccurate results. In this paper, we present SpecMind, a novel framework for postcondition generation that treats LLMs as interactive and exploratory reasoners rather than one-shot generators. SpecMind employs feedback-driven multi-turn prompting approaches, enabling the model to iteratively refine candidate postconditions by incorporating implicit and explicit correctness feedback, while autonomously deciding when to stop. This process fosters deeper code comprehension and improves alignment with true program behavior via exploratory attempts. Our empirical evaluation shows that SpecMind significantly outperforms state-of-the-art approaches in both accuracy and completeness of generated postconditions.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["automated software engineering", "postcondition inference", "program specifications", "large language models", "multi-turn prompting", "interactive reasoning"], "openreview_url": "https://openreview.net/forum?id=NH2xIXmQ4q", "contribution_types": ["Analysis", "Engineering"]}, {"id": "RxoK5vnL8i", "title": "SEA-Guard: Culturally Grounded Multilingual Safeguard for Southeast Asia", "abstract": "Culturally aware safeguards are crucial for AI alignment in real-world settings, where safety extends beyond common sense and encompasses diverse local values, norms, and region-specific regulations. However, building large-scale, culturally grounded datasets is challenging due to limited resources and a scarcity of native annotators. Consequently, many safeguard models rely on machine translation of English datasets, often missing regional and cultural nuances. We present a novel agentic data-generation framework to scalably create authentic, region-specific safety datasets for Southeast Asia (SEA). On this foundation, we introduce the SEA-Guard family, the first multilingual safeguard models grounded in SEA cultural contexts. Evaluated across multiple benchmarks and cultural variants, SEA-Guard consistently outperforms existing safeguards at detecting regionally sensitive or harmful content while maintaining strong general safety performance.", "area": "Safety & Alignment", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["AI Safety", "Multilingual Safeguards", "Cultural Grounding", "Agentic Data Generation", "Southeast Asia"], "openreview_url": "https://openreview.net/forum?id=RxoK5vnL8i", "contribution_types": ["Engineering"]}, {"id": "SOXNHki2nE", "title": "Beyond Factual QA: Mentorship-Oriented Question Answering from Long-Form Multilingual Content", "abstract": "Question answering systems are typically evaluated on factual correctness, yet many real-world applications—such as education and career guidance—require mentorship: responses that provide reflection and guidance. Existing QA benchmarks rarely capture this distinction, particularly in multilingual and long-form settings.\nWe introduce MentorQA, the first multilingual dataset and evaluation framework for mentorship-focused question answering from long-form videos, comprising nearly 9,000 QA pairs from 180 hours of content across four languages. We define mentorship-focused evaluation dimensions that go beyond factual accuracy, capturing clarity, alignment, and learning value.\nUsing MentorQA, we compare Single-Agent, Dual-Agent, RAG, and Multi-Agent QA architectures under controlled conditions. Multi-Agent pipelines consistently produce higher-quality mentorship responses, with especially strong gains for complex topics and lower-resource languages. We further analyze the reliability of automated LLM-based evaluation, observing substantial variation in alignment with human judgments.\nOverall, this work establishes mentorship-focused QA as a distinct research problem and provides a multilingual benchmark for studying agentic architectures and evaluation design in educational AI. The dataset and evaluation framework are released at https://anonymous.4open.science/r/MentorQA/.", "area": "Question Answering", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/MentorQA"], "keywords": ["mentorship-focused QA", "multilingual question answering", "long-form content understanding", "educational AI", "multi-agent", "LLM-based evaluation"], "openreview_url": "https://openreview.net/forum?id=SOXNHki2nE", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Dataset", "Data Analysis"]}, {"id": "sctUVIWI1O", "title": "Stabilizing Latent Visual Reasoning with Multi-Step Visual-Thought Alignment", "abstract": "Vision-language models (VLMs) demonstrate strong capabilities in visual question answering (VQA), yet their reasoning remains confined to the text modality, limiting their alignment with inherently visual tasks. Latent visual reasoning emerges as a promising alternative, offering more efficient and flexible inference. However, existing approaches focus primarily on modeling latent visual cues, overlooking the importance of aligning latent reasoning with standard text decoding. In this work, we propose a supervised multi-step latent reasoning framework that scales implicit reasoning to VLMs. Our method introduces step-level supervision on latent hidden states via a freezing LLM decoder during training, bridging the modality gap and enriching semantic diversity. The LLM decoder is removed at inference to maintain native decoding efficiency. Experiments show that our latent visual reasoning approach matches the performance of explicit CoT finetuning on Qwen3-VL, while significantly reducing token usage.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Latent Visual Reasoning", "Multimodal LLM", "VQA"], "openreview_url": "https://openreview.net/forum?id=sctUVIWI1O", "contribution_types": ["Analysis", "Engineering"]}, {"id": "dUcYpuXYLr", "title": "From Synthesis to Clinical Assistance: A Strategy-Aware Agent Framework for Autism Intervention based on Real Clinical Dataset", "abstract": "The development of AI-assisted Early Intensive Behavioral Intervention (EIBI) for Autism Spectrum Disorder (ASD) is severely constrained by data scarcity. Furthermore, while Applied Behavior Analysis (ABA) serves as the gold standard for clinical intervention, general-purpose Large Language Models (LLMs) struggle to strictly adhere to its standardized procedures, often resulting in interactions that are linguistically fluent but strategically inconsistent. To address these challenges, we introduce ASDAgent, a strategy-aware framework designed to unify high-fidelity intervention dialogue synthesis and clinical decision support. ASDAgent incorporates two specialized components to solve distinct problems: (i) a DoctorAgent equipped with an Observe-Think-Act-Correct (O-T-A-C) reasoning loop, which resolves the issue of strategy collapse in LLMs by making ABA execution explicit and controllable; and (ii) a ChildAgent that utilizes probabilistic behavior modeling to mitigate data homogeneity, simulating diverse and non-deterministic ASD response patterns. Experiments demonstrate that dialogues generated by ASDAgent closely mirror the strategy distribution of human therapists (KL divergence: 0.083). In real autism intervention, ASDAgent achieves nearly 80\\% strategic consistency with human experts. Moreover, we show that synthetic data produced by ASDAgent effectively distills professional clinical knowledge into small language models (SLMs), significantly enhancing their therapeutic capabilities.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Data Synthesis", "Autism Intervention", "Agent"], "openreview_url": "https://openreview.net/forum?id=dUcYpuXYLr", "contribution_types": ["Engineering", "Dataset"]}, {"id": "L2467zu4sY", "title": "GoViG: Goal-Conditioned Visual Navigation Instruction Generation", "abstract": "We introduce Goal-Conditioned Visual Navigation Instruction Generation (GoViG), a new task that aims to generate contextually coherent navigation instructions solely from egocentric visual observations of initial and goal states. Unlike prior work relying on structured inputs, such as semantic annotations or environmental maps, GoViG exclusively leverages raw egocentric visual data, improving adaptability to unseen and unstructured environments. Our method addresses this task by decomposing it into two interconnected subtasks: (1) navigation visualization, predicting intermediate visual states bridging the initial and goal views; and (2) instruction generation, synthesizing coherent instructions grounded in observed and anticipated visuals. Both subtasks are integrated within an autoregressive multimodal LLM trained with tailored objectives to ensure spatial accuracy and linguistic clarity. Furthermore, we introduce two multimodal reasoning strategies, one-pass and interleaved reasoning, to mimic incremental human navigation cognition. To comprehensively evaluate our method, we propose the R2R-Goal dataset, combining diverse synthetic and real-world trajectories. Empirical results demonstrate significant performance improvements over state-of-the-art methods in BLEU-4 and CIDEr scores along with robust cross-domain generalization.", "area": "Natural Language Generation", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["navigation instruction generation"], "openreview_url": "https://openreview.net/forum?id=L2467zu4sY", "contribution_types": ["Dataset"]}, {"id": "pKIb8WHPU3", "title": "Veri-R1: Toward Precise and Faithful Claim Verification via Online Reinforcement Learning", "abstract": "Claim verification with large language models (LLMs) has recently attracted growing attention, due to their strong reasoning capabilities and transparent verification processes compared to traditional answer-only judgments. However, existing approaches to online claim verification, which requires iterative evidence retrieval and reasoning, still mainly rely on prompt engineering or pre-designed reasoning workflows, without unified training to improve necessary skills. Therefore, we introduce Veri-R1, an online reinforcement learning (RL) framework that enables an LLM to interact with a search engine and to receive reward signals that explicitly shape its planning, retrieval, and reasoning behaviors. The dynamic interaction between models and retrieval systems more accurately reflects real-world verification scenarios and fosters comprehensive verification skills. Empirical results show that Veri-R1 improves joint accuracy by up to 30% and doubles evidence score, often surpassing its larger-scale model counterparts. Ablation studies further reveal the impact of reward components, and the link between output logits and label accuracy. Our results highlight the effectiveness of online RL for precise and faithful claim verification, and provide a foundation for future research.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Claim Verification", "Reinforcement Learning"], "openreview_url": "https://openreview.net/forum?id=pKIb8WHPU3", "contribution_types": ["Analysis", "Engineering"]}, {"id": "9hA6iuXEYB", "title": "FormulaSPIN: Self-Play Fine-Tuning for Natural Language to Spreadsheet Formula Generation", "abstract": "Spreadsheet applications are used by hundreds of millions worldwide, yet writing formulas remains a significant barrier. Despite recent progress in Natural Language to Formula, existing approaches rely on static supervised data, which quickly saturates on limited annotations. In this paper, we introduce FORMULASPIN, a self-play framework that breaks the ceiling of supervised fine-tuning by enabling iterative self-improvement beyond the data constraint, exploiting formula generation's unique advantage: binary executability provides implicit supervision to distinguish semantic errors from valid alternatives. Our method frames training as a two-player game where the main player learns to prefer ground-truth formulas over those generated by its previous version, while execution feedback categorizes outputs into distinct granularities—enabling an adaptive curriculum that shifts from semantic correctness to stylistic refinement. To further scale test-time compute, we incorporate a semantic-level consensus polling mechanism that naturally handles multiple valid formulations. Experiments on multiple benchmarks demonstrate that FORMULASPIN achieves state-of-the-art performance, with 78.4% exact match and 84.2% execution accuracy on NL2FORMULA, matching models trained with 60K additional preference annotations while outperforming both traditional SFT (by 15.3%) and agent-like prompting methods leveraging GPT-4. These findings underscore self-play's potential to tackle scarce data tasks and open the door to extending it beyond executable domains.", "area": "Syntax/Parsing", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["self-play fine-tuning", "natural language to formula", "spreadsheet formula generation", "execution feedback", "curriculum learning", "test-time scaling"], "openreview_url": "https://openreview.net/forum?id=9hA6iuXEYB", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "dLyrUPecw9", "title": "Context Over Memory: Self-Supervised Faithfulness Optimization via Likelihood Displacement", "abstract": "Mitigating context-faithfulness hallucinations is crucial for grounding large language models (LLMs) in the provided context.\nHowever, most existing approaches require costly supervision and post-training, or impose significant inference burdens.\nTo overcome these limitations, we introduce Self-Supervised Faithfulness Optimization (SSFO), a self-supervised alignment approach for enhancing faithfulness. SSFO constructs preference data pairs by contrasting the model's outputs generated with context versus without context. Leveraging Direct Preference Optimization (DPO), SSFO aligns model faithfulness without incurring labeling costs or additional inference burdens. \nWe analyze this faithfulness alignment process and provide empirical evidence that it leverages a benign form of likelihood displacement, shifting probability mass from parametric-based tokens to context-aligned tokens.\nBased on this insight, we adapt the DPO loss using a weighting scheme that encourages likelihood displacement. Comprehensive evaluations show that SSFO significantly outperforms existing methods, achieving state-of-the-art results in faithfulness on multiple context-based question-answering datasets. Notably, SSFO exhibits strong generalization, improving cross-lingual faithfulness while preserving general instruction-following capabilities. The code is available at: https://anonymous.4open.science/r/SSFO", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SSFO"], "keywords": ["Faithfulness", "Preference Optimization", "Likelihood Displacement"], "openreview_url": "https://openreview.net/forum?id=dLyrUPecw9", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "ilVRfB8Uga", "title": "GEAR-UIE: Graph-Embedded Augmented Retrieval for Unified Information Extraction", "abstract": "RAG-based Unified Information Extraction (UIE) typically retrieves exemplars by semantic similarity, which can be syntactically misaligned and hurt in-context learning in complex or cross-domain inputs. To overcome this, we propose GEAR-UIE, a novel framework that introduces syntactic structure as a first-class retrieval signal for UIE. Our approach uniquely constructs a hybrid syntactic graph by integrating dependency and constituency parses, encodes it via Graphormer to obtain structure-aware embeddings, and retrieves semantically and structurally aligned candidates. These are further refined by a lightweight, LLM-preference-aligned reranker. Crucially, the entire pipeline operates without task-specific fine-tuning, enabling a frozen LLM to generate accurate, schema-constrained outputs. Extensive evaluation on 11 Chinese and English benchmarks across three core UIE tasks demonstrates that GEAR-UIE consistently outperforms strong baselines, achieving particularly substantial gains on structure-sensitive extraction tasks. Our code is anonymously available at https://anonymous.4open.science/r/GEAR-UIE.", "area": "Information Extraction and Retrieval", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/GEAR-UIE.", "https://anonymous.4open.science/r/GEAR-UIE"], "keywords": ["Information Extraction", "NLP Applications", "Language Modeling"], "openreview_url": "https://openreview.net/forum?id=ilVRfB8Uga", "contribution_types": ["Engineering", "Low-resource", "Efficiency", "Dataset"]}, {"id": "MGX3ht4TYp", "title": "Community-Aware Assessment of Social Textual Engagement and Resonance: A Human-Centric Perspective on User-Generated Content Evaluation", "abstract": "Traditional Video Quality Assessment (VQA) focuses narrowly on aesthetic fidelity, overlooking the complex social dynamics that define quality in User-Generated Content (UGC). In this work, we propose a paradigm shift from signal-centric metrics to human-centric resonance assessment. We introduce CASTER (Community-Aware Assessment of Social Textual Engagement and Resonance), a new task that evaluates whether a UGC item achieves positive community resonance based on its multimodal attributes rather than visual quality alone. To address this, we present MEDEA (Multimodal Engagement-Driven Evaluation Architecture), which introduces a novel Social Chain-of-Thought (Social-CoT) mechanism. Unlike traditional logical CoT, Social-CoT performs multimodal perspective-taking, instantiating diverse viewer personas to simulate collective cognitive and emotional reactions (i.e., the \"community mind\") before deriving a quality judgment. MEDEA is trained via a two-stage approach involving supervised fine-tuning and process-supervised reinforcement learning with Social Alignment Reward to ensure reasoning paths are grounded in authentic human social cognition. To support this task, we release CASTER-Bench, a comprehensive human-annotated benchmark covering diverse UGC categories. Experiments demonstrate that MEDEA significantly outperforms state-of-the-art baselines on CASTER-Bench while providing interpretable and empathetic reasoning paths that align with real community feedback.", "area": "Multimodal", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Vision Language Model", "Reasoning Model", "User-Generated Content", "Community-Aware Assessment"], "openreview_url": "https://openreview.net/forum?id=MGX3ht4TYp", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "fUgL97DOc4", "title": "Doc-CoB: Enhancing Document Understanding with Visual Chain-of-Boxes Reasoning", "abstract": "Document understanding aims to perform question answering and information extraction over document images, where the visual content is highly information-dense and most task queries depend on only a few relevant regions.\nHowever, existing methods either adopt a one-pass strategy that implicitly assumes all regions are equally important, or focus excessively on small regions at the cost of losing critical layout information, leading to unfaithful responses.\nFollowing the human reading pattern, we introduce Doc-CoB (Chain-of-Box), a simple-yet-effective mechanism that integrates coarse-to-fine visual reasoning into MLLM without modifying its architecture. Our method allows the model to autonomously select the set of layouts most relevant to the query, and then focus on them for further understanding.\nTo support this paradigm, we design two enabling tasks that improve box identification and box–query reasoning, facilitating layout-aware document understanding.\nWe also design an automatic pipeline, integrating a commercial MLLM with a layout analyzer, to generate 249k training samples with intermediate visual reasoning supervision.\nExtensive experiments on seven benchmarks with four popular models show that Doc-CoB significantly improves performance, demonstrating its effectiveness and wide applicability. All code, data, and models will be released.", "area": "NLP Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Document Understanding", "Multimodal Reasoning", "Multimodal Large Language Model"], "openreview_url": "https://openreview.net/forum?id=fUgL97DOc4", "contribution_types": ["Engineering", "Dataset"]}, {"id": "qmVhCXX6xv", "title": "DSR-SQL: Dual-Schema Reasoning for Text-to-SQL and  PI-MCE Optimized Schema Linking", "abstract": "Small open-source LLMs for Text-to-SQL face a critical dilemma: providing the full schema introduces overwhelming noise that distracts the model, while pruning the schema risks irreversible information loss due to the masking effect from erroneous linking. To resolve this trade-off systematically, we propose DSR-SQL, a dual-path reasoning framework. It concurrently generates candidate SQLs from both full and pruned schemas to capture structural precision and semantic completeness, followed by an intelligent module that merges or selects the optimal query based on execution feedback, effectively balancing recall and precision. Furthermore, DSR-SQL introduces a Permutation-Invariant Minimal Cross-Entropy (PI-MCE) loss to resolve training bias caused by the disorder of table selection outputs, significantly improving schema linking accuracy. Extensive experiments show that DSR-SQL significantly outperforms comparable baselines and some GPT-4-based methods, demonstrating that refined architectural design combined with targeted fine-tuning enables small LLMs to rival proprietary giants, facilitating low-cost, efficient, and privacy-preserving natural language interfaces.", "area": "Question Answering", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/DSR-SQL-C1C1Forinstance"], "keywords": ["Text-to-SQL", "Schema linking", "LLMs"], "openreview_url": "https://openreview.net/forum?id=qmVhCXX6xv", "contribution_types": ["Engineering"]}, {"id": "D8yen8OFFy", "title": "Lifting Optimized Binaries to Canonical Compiler IR via Structure-Aware Retrieval and Iterative Verification", "abstract": "Lifting stripped and highly optimized binaries to the canonical compiler intermediate representation (IR) enables program analysis when source code is unavailable. However, compiler optimizations severely distort control-flow and data-flow structure, making existing rule-based and LLM-based decompilation approaches brittle.\nWe present BRIDGE, a system that reliably lifts optimized binaries to analysis-friendly compiler IR. BRIDGE combines control-flow-aware retrieval-augmented generation with feedback-driven verification. It uses pseudo-probe instrumentation to align optimized binary fragments with normalized IR semantics, and then employs an iterative refinement loop guided by static analysis and runtime feedback to improve executability and semantic consistency.\nWe evaluate BRIDGE on HumanEval-Decompile and MBPP, lifting x86-64 and ARM64 binaries to LLVM IR. BRIDGE outperforms seven baselines, achieving an average of over 30% higher re-executability than the strongest general-purpose LLM baseline.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/BRIDGE-5E6A"], "keywords": ["Binary Lifting", "LLVM IR", "Retrieval-Augmented Generation", "LLMs", "Code Generation"], "openreview_url": "https://openreview.net/forum?id=D8yen8OFFy", "contribution_types": []}, {"id": "dELTpImn4L", "title": "FaithLens: Detecting and Explaining Faithfulness Hallucination", "abstract": "Recognizing whether outputs from large language models (LLMs) contain faithfulness hallucination is crucial for real-world applications, e.g., retrieval-augmented generation and summarization. In this paper, we introduce FaithLens, a cost-efficient and effective faithfulness hallucination detection model that can jointly provide binary predictions and corresponding explanations to improve trustworthiness. To achieve this, we first synthesize training data with explanations via advanced LLMs and apply a well-defined data filtering strategy to ensure label correctness, explanation quality, and data diversity. Subsequently, we fine-tune the model on these well-curated training data as a cold start and further optimize it with rule-based reinforcement learning, using rewards for both prediction correctness and explanation quality. Results on 12 diverse tasks show that the 8B-parameter FaithLens outperforms advanced models such as GPT-4.1 and o3. Also, FaithLens can produce high-quality explanations, delivering a distinctive balance of trustworthiness, efficiency, and effectiveness.", "area": "Special Theme (conference specific)", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Faithfulness Hallucination Detection"], "openreview_url": "https://openreview.net/forum?id=dELTpImn4L", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "zcnI0m5svW", "title": "Self-Guided Plan Extraction for Instruction-Following Tasks with Goal-Conditional Reinforcement Learning", "abstract": "We introduce SuperIgor, a framework for instruction-following tasks. Unlike prior methods that rely on predefined subtasks, SuperIgor enables a language model to generate and refine high-level plans through a self-learning mechanism, reducing the need for manual dataset annotation. Our approach involves iterative co-training: an RL agent is trained to follow the generated plans, while the language model adapts and modifies these plans based on RL feedback and preferences. This creates a feedback loop where both the agent and the planner improve jointly. We validate our framework in environments with rich dynamics and stochasticity. Results show that SuperIgor agents adhere to instructions more strictly than baseline methods, while also demonstrating strong generalization to previously unseen instructions.", "area": "Multimodal", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/SuperIgor-7A4F2RelatedWork112InstructionFollowingwithRL.Oneofthe", "https://anonymous.4open.science/r/SuperIgor-7A4F"], "keywords": ["Instruction Following", "Reinforcement Learning", "Multimodal RL"], "openreview_url": "https://openreview.net/forum?id=zcnI0m5svW", "contribution_types": ["Position"]}, {"id": "LV0k3DNBYY", "title": "AutoSynth: Automated Workflow Optimization for High-Quality Synthetic Dataset Generation via Monte Carlo Tree Search", "abstract": "Supervised fine-tuning (SFT) of large language models (LLMs) for specialized tasks requires high-quality training datasets, yet manual curation remains prohibitively expensive and time-consuming. While synthetic data generation offers a scalable alternative, its effectiveness depends on carefully designed generation workflows---complex, multi-stage processes integrating prompt engineering, programmatic logic, and model orchestration. Existing automated workflow optimization methods fail to address the cold start problem, as they require labeled datasets for reward modeling, particularly problematic for subjective, open-ended tasks where objective ground truth is unavailable. We introduce AutoSynth, a framework that automates workflow discovery and optimization without reference datasets by reframing the problem as a Monte Carlo Tree Search guided by a novel dataset-free hybrid reward signal. This signal enables meta-learning through two components: an LLM-as-judge evaluating sample quality against dynamically regenerated task-specific metrics, and another LLM-as-judge assessing workflow code and prompt quality. Experiments on subjective educational tasks reveal that while expert-designed workflows achieve higher human preference rates (96-99\\% win rates compared to AutoSynth's 40-51\\%), models trained on AutoSynth-generated data dramatically outperform baseline models (40-51\\% vs. 2-5\\% win rates) and surpass expert-designed workflows on certain metrics, suggesting the discovery of quality dimensions not fully captured by human evaluators. These results are achieved while reducing human effort from 5-7 hours to just 30 minutes (>90\\% reduction). AutoSynth addresses the critical cold start challenge in data-centric AI, providing a scalable, cost-effective method for developing specialized LLMs for subjective tasks lacking objective ground truth.", "area": "NLP Applications", "paper_type": "Short", "has_code": false, "code_links": [], "keywords": ["Large Language Models", "Synthetic data", "Monte Carlo Tree Search", "Automated Evaluation", "AI in Education"], "openreview_url": "https://openreview.net/forum?id=LV0k3DNBYY", "contribution_types": ["Engineering", "Low-resource"]}, {"id": "DYimo95MON", "title": "AHA:  Aligning Large Audio-Language Models for Reasoning Hallucinations via Counterfactual Hard Negatives", "abstract": "Although Large Audio-Language Models (LALMs) deliver state-of-the-art (SOTA) performance, they frequently suffer from hallucinations, \\textit{e.g.,} generating text not grounded in the audio input. We analyze these grounding failures and identify a distinct taxonomy: \\textbf{Event Omission}, \\textbf{False Event Identity}, \\textbf{Temporal Relation Error}, and \\textbf{Quantitative Temporal Error}. To address this, we introduce the \\textbf{AHA} (\\textbf{A}udio \\textbf{H}allucination \\textbf{A}lignment) framework. By leveraging \\textbf{counterfactual hard negative mining}, our pipeline constructs a high-quality preference dataset that forces models to distinguish strict acoustic evidence from linguistically plausible fabrications. Additionally, we establish \\textbf{AHA-Eval}, a diagnostic benchmark designed to rigorously test these fine-grained reasoning capabilities. We apply this data to align Qwen2.5-Omni. The resulting model, \\textbf{Qwen-Audio-AHA}, achieves a 13.7\\% improvement on AHA-Eval. Crucially, this benefit generalizes beyond our diagnostic set. Our model shows substantial gains on public benchmarks, including 1.3\\% on MMAU-Test and 1.6\\% on MMAR, outperforming latest SOTA methods.", "area": "Speech Processing and Spoken Language Understanding", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Post-training", "Large Audio Language Model", "Alignment", "Dataset", "Benchmark"], "openreview_url": "https://openreview.net/forum?id=DYimo95MON", "contribution_types": ["Dataset"]}, {"id": "ZFOzNnA6tM", "title": "Time-RA: Towards Time Series Reasoning for Anomaly Diagnosis with LLM Feedback", "abstract": "Time series anomaly detection (TSAD) has traditionally focused on binary classification and often lacks the fine-grained categorization and explanatory reasoning required for transparent decision-making. To address these limitations, we propose Time-series Reasoning for Anomaly (Time-RA), a novel task that reformulates TSAD from a discriminative into a generative, reasoning-intensive paradigm. To facilitate this, we introduce RATs40K, the first real-world large-scale multimodal benchmark with ~40,000 samples across 10 domains, integrating raw time series, textual context, and visual plots with structured reasoning annotations. Extensive benchmarking shows that while supervised fine-tuning and visual representations boost diagnostic accuracy and reasoning consistency, performance varies across complex scenarios. Notably, fine-tuned models demonstrate strong \"plug-and-play\" transferability, outperforming traditional baselines on unseen real-world datasets. Our work establishes a foundation for interpretable, multimodal time series analysis. All code and the RATs40K dataset are fully open-sourced to facilitate future research.", "area": "NLP Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/C6CD", "https://anonymous.4open.science/r"], "keywords": ["time series", "anomaly diagnosis", "LLM", "reasoning", "multimodality"], "openreview_url": "https://openreview.net/forum?id=ZFOzNnA6tM", "contribution_types": ["Dataset"]}, {"id": "ju6txWVDhx", "title": "AGGC: Adaptive Group Gradient Clipping for Stabilizing Large Language Model Training", "abstract": "To stabilize the training of Large Language Models (LLMs), gradient clipping is a nearly ubiquitous heuristic used to alleviate exploding gradients. However, traditional global norm clipping erroneously presupposes gradient homogeneity across different functional modules, leading to an adverse \\textbf{\"spill-over\"} effect where volatile parameters force unnecessary scaling on stable ones. To overcome this, we propose Adaptive Group-wise Gradient Clipping (AGGC). AGGC partitions parameters into groups based on functional types and regulates each according to its historical behavior using an Exponential Moving Average (EMA). Specifically, it constructs an adaptive interval to simultaneously mitigate gradient explosion and vanishing, while employing a time-dependent scheduling mechanism to balance exploration and convergence. Experiments on LLaMA 2-7B, Mistral-7B, and Gemma-7B models show that AGGC consistently outperforms LoRA and frequently surpasses Full Fine-Tuning. On the GSM8K benchmark, Mistral-7B fine-tuned with AGGC achieves an accuracy of 72.93\\%, exceeding LoRA’s 69.5\\%. AGGC also effectively stabilizes Reinforcement Learning with Verifiable Rewards (RLVR), enhancing the logic deduction of Qwen 2.5 and Llama 3.2 models. Experimental results demonstrate that AGGC effectively addresses the limitations of traditional gradient clipping methods, particularly in overcoming gradient heterogeneity, by utilizing a modular, adaptive clipping strategy to stabilize the training process. Due to its lightweight design, AGGC can be seamlessly integrated into existing post-training pipelines with negligible overhead.", "area": "LLM Efficiency", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AGGC-515B"], "keywords": ["Grad Clipping", "Training stability", "Large Language Model", "Post-Training"], "openreview_url": "https://openreview.net/forum?id=ju6txWVDhx", "contribution_types": ["Analysis", "Theory"]}, {"id": "6q2TzV7Vvd", "title": "AgentGC: Evolutionary Learning-based Lossless Compression for Genomics Data with LLM-driven Multiple Agent", "abstract": "Lossless compression has made significant advancements in Genomics Data (GD) storage, sharing and management. Current learning-based methods are non-evolvable with problems of low-level compression modeling, limited adaptability, and user-unfriendly interface. To this end, we propose AgentGC, the first evolutionary Agent-based GD Compressor, consisting of 3 layers with multi-agent named Leader and Worker. Specifically, the 1) User layer provides a user-friendly interface via Leader combined with LLM; 2) Cognitive layer, driven by the Leader, integrates LLM to consider joint optimization of algorithm-dataset-system, addressing the issues of low-level modeling and limited adaptability; and 3) Compression layer, headed by Worker, performs compression & decompression via a automated multi-knowledge learning-based compression framework. On top of AgentGC, we design 3 modes to support diverse scenarios: CP for compression-ratio priority, TP for throughput priority, and BM for balanced mode. Compared with 14 baselines on 9 datasets, the average compression ratios gains are 16.66%, 16.11%, and 16.33%, the throughput gains are 4.73x, 9.23x, and 9.15x, respectively.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/AgentGC-C0F7.AlgorithmDatasetHardware"], "keywords": ["Lossless Compression", "Data Compression", "Compression Agent", "Genomics Data Compression"], "openreview_url": "https://openreview.net/forum?id=6q2TzV7Vvd", "contribution_types": ["Engineering"]}, {"id": "9faYQYZrwM", "title": "From Domains to Instances: Dual-Granularity Data Synthesis for LLM Unlearning", "abstract": "Although machine unlearning is essential for removing private, harmful, or copyrighted content from LLMs, current benchmarks often fail to faithfully represent the true ``forgetting scope'' learned by the model. \nWe formalize two distinct unlearning granularities, domain-level and instance-level, and propose \\BiForget, an automated framework for synthesizing high-quality forget sets.\nUnlike prior work relying on \\emph{external} generators, \\BiForget exploits the target model per se to elicit data that matches its internal knowledge distribution through seed-guided and adversarial prompting. \nOur experiments across diverse benchmarks show that it achieves a superior balance of relevance, diversity, and efficiency. \nQuantitatively, in the Harry Potter domain, it improves relevance by ${\\sim}20$ and diversity by ${\\sim}$0.05 while \\emph{halving} the total data size compared to SOTAs. \nUltimately, it facilitates more robust forgetting and better utility preservation, providing a more rigorous foundation for evaluating LLM unlearning.", "area": "Ethics, Bias, and Fairness", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Unlearning", "Large Language Models"], "openreview_url": "https://openreview.net/forum?id=9faYQYZrwM", "contribution_types": ["Analysis", "Engineering", "Low-resource", "Efficiency", "Dataset"]}, {"id": "Q7tSFCQcE0", "title": "MedRECT: A Medical Reasoning Benchmark for Error Correction in Clinical Texts", "abstract": "Large language models (LLMs) show increasing promise in medical applications, but their ability to detect and correct errors in clinical texts, a prerequisite for safe deployment, remains under-evaluated, particularly beyond English. We introduce MedRECT, a cross-lingual benchmark (Japanese/English) that formulates medical error handling as three subtasks: error detection, error localization (sentence extraction), and error correction. MedRECT is built with a scalable, automated pipeline from the Japanese Medical Licensing Examinations (JMLE) and a curated English counterpart, yielding MedRECT-ja (663 texts) and MedRECT-en (458 texts) with comparable error/no-error balance. We evaluate 9 contemporary LLMs spanning proprietary, open-weight, and reasoning families. Key findings: (i) reasoning models substantially outperform standard architectures, with up to 13.5\\% relative improvement in error detection and 51.0\\% in sentence extraction; (ii) cross-lingual evaluation reveals 5-10\\% performance gaps from English to Japanese, with smaller disparities for reasoning models; (iii) LoRA fine-tuning yields asymmetric improvements in error correction performance (Japanese: +0.078, English: +0.168) while preserving reasoning capabilities; and (iv) our fine-tuned model exceeds human expert performance on structured medical error correction tasks. To our knowledge, MedRECT is the first comprehensive cross-lingual benchmark for medical error correction, providing a reproducible framework and resources for developing safer medical LLMs across languages.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/medrect"], "keywords": ["Medical NLP", "Cross-lingual Benchmarking", "Error Detection and Correction", "Clinical Reasoning"], "openreview_url": "https://openreview.net/forum?id=Q7tSFCQcE0", "contribution_types": ["Dataset"]}, {"id": "sbIyZoPKJW", "title": "DyPRAG: Dynamic Parametric Retrieval-Augmented Generation for On-the-Fly Knowledge Adaptation", "abstract": "Once Large Language Models (LLMs) complete their training, the intrinsic parametric knowledge encoded within the model becomes fixed. Retrieval-Augmented Generation (RAG) alleviates this by supplying external documents as context, but a fundamental tension remains: the model's parameters are unchanged, often leading to conflicts where the model's outdated internal parameters struggle to synergize with the fresh retrieved information. In this paper, we propose Dynamic Parametric RAG (DyPRAG), a novel framework that leverages a lightweight hypernetwork, termed parameter translator, to efficiently convert symbolic documents into parametric knowledge at inference-time. Specifically, the parameter translator maps documents directly into Low-Rank Adaptation (LoRA) weights for the Feed-Forward Networks (FFNs) of the LLM, enabling on-the-fly knowledge adaptation. Extensive experiments across diverse datasets demonstrate the superior effectiveness and generalization capability of DyPRAG. Crucially, our analysis confirms that DyPRAG harmonizes the model's internal and external knowledge sources, leading to a measurable reduction in knowledge conflicts and a more effective synthesis of information. Our code is available at https://anonymous.4open.science/r/DyPRAG-715.", "area": "RAG", "paper_type": "Long", "has_code": true, "code_links": ["https://anonymous.4open.science/r/DyPRAG-715.0301Introduction031LargeLanguageModels", "https://anonymous.4open.science/r/DyPRAG-715"], "keywords": ["Retrieval-Augmented Generation", "Inference-time Knowledge Adaptation", "Parametric Knowledge in LLMs"], "openreview_url": "https://openreview.net/forum?id=sbIyZoPKJW", "contribution_types": ["Analysis", "Engineering", "Efficiency"]}, {"id": "ZbYQ91Zw0t", "title": "SpiralThinker: Latent Reasoning through an Iterative Process with Text–Latent Interleaving", "abstract": "Recent advances in large reasoning models have been driven by reinforcement learning and test-time scaling, accompanied by growing interest in latent rather than purely textual reasoning. However, existing latent reasoning methods lack mechanisms to ensure stable reasoning dynamics in latent space and a systematic way to interleave implicit and explicit reasoning. We introduce SpiralThinker, a unified framework that performs iterative updates over latent representations while enabling interleaved reasoning across latent and textual steps. At its core, SpiralThinker employs a progressive alignment objective and structured annotations to stabilize latent reasoning and maintain coherence with textual reasoning. Across mathematical, logical, and commonsense reasoning tasks, SpiralThinker achieves state-of-the-art performance among latent reasoning baselines. Detailed analyses reveal that both iteration and alignment are indispensable, the numbers of latent tokens and iterations exhibit dataset-specific optima, and appropriate alignment proves critical for an effective iterative process. Overall, SpiralThinker bridges iterative computation and latent reasoning, demonstrating that aligned iterative updates can reliably steer reasoning in the latent space.", "area": "Math/Reasoning", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Latent Reasoning", "Iterative Computation", "Progressive Alignment"], "openreview_url": "https://openreview.net/forum?id=ZbYQ91Zw0t", "contribution_types": ["Engineering"]}, {"id": "efB6pS08MV", "title": "BalanceSFT: Improving LLM Function Calling with Balanced Training Signals and Data Hardness", "abstract": "While Supervised Fine-Tuning (SFT) is the prevailing method for equipping Large Language Models (LLMs) with function calling capabilities, its effectiveness is often compromised by two critical challenges: 1) **Imbalanced Training Signals**, where lengthy Chain-of-Thought (CoT) reasoning tokens dominate the training signals over concise function calls in the learning objective, and 2) **mbalanced Data Hardness**, characterized by a scarcity of hard training examples. To overcome these limitations, we propose Balanced Supervised Fine-tuning (**BalanceSFT**), a novel framework incorporates two key components: a Self-adjusted Signal Balancing (SSB) loss that employs a learnable hyperparameter to dynamically adjust the token contributions of CoT reasoning and function calls, together with a Hard Data Re-sampling (HDR) strategy that establishes a feedback loop to selectively generate new, high-quality complex data guided by model errors. Extensive experiments demonstrate the effectiveness of our proposed BalanceSFT framework. With BalanceSFT, a 7B model achieves function calling performance on par with state-of-the-art giants like GPT-5.2 and DeepSeek-V3.2. Our code, models, and dataset are open-sourced.", "area": "Language Models", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Function Call; Tool-use; AI Agents;"], "openreview_url": "https://openreview.net/forum?id=efB6pS08MV", "contribution_types": ["Engineering", "Dataset", "Data Analysis"]}, {"id": "k30IrbNYSG", "title": "TT-SI: Self-Improving LLM Agents with Test-Time Training", "abstract": "One paradigm of language model (LM) fine-tuning relies on creating large training datasets, under the assumption that high quantity and diversity will enable models to generalize to novel tasks after post‑training. In practice, gathering large sets of data is inefficient, and training on them is prohibitively expensive; worse, there is no guarantee that the resulting model will handle complex scenarios or generalize better. Moreover, existing techniques rarely assess whether a training sample provides novel information, resulting in unnecessary costs. In this work, we explore a new Test-Time Self-Improvement (TT-SI) algorithm to create more effective and generalizable agentic LMs on-the-fly. TT-SI can be summarized in three steps: (i) first it identifies the samples that model struggles with (self-awareness), (ii) then generates similar examples from detected uncertain samples (self-data augmentation), and (iii) uses these newly generated samples at test-time training (self-improvement). We further explore Test-Time Distillation (TT-D), which leverages a stronger supervisor for targeted data generation. Empirical evaluations across different agent benchmarks demonstrate that TT-SI improves the performance with +5.48% absolute accuracy gain on average across all benchmarks and surpasses other standard learning methods more efficiently. Our findings highlight the promise of TT-SI, demonstrating the potential of self-improvement algorithms at test-time as a new paradigm for building more capable agents toward self-evolution.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Test-Time Training", "Self-Improvement", "Self-Awareness", "LLM Agents"], "openreview_url": "https://openreview.net/forum?id=k30IrbNYSG", "contribution_types": ["Analysis", "Engineering", "Dataset", "Data Analysis"]}, {"id": "yrDc8AYupT", "title": "Communicating in Emergent Language with an Induced Morphological Phrasebook", "abstract": "We build rule-based emergent language (EL) agents using induced morphological phrasebooks and test their communicative performance in the EL environment with its neural network agents.  This contributes three things: First, it assesses the quality of the morphemes discovered by the induction algorithm in situ, which we find to be effective for communicating in the EL.  Second, it allows us to uncover morphosyntactic properties of EL through ablating the morpheme induction and the phrasebook algorithms, showing that the ELs rely on repetition as well as morpheme ordering to convey meaning.  Third, we find that the bijectivity of morphemes (measured via normalized pointwise mutual information), serves as a metric of compositionality that is more closely correlated with the ability of the phrasebook-agents to \"speak\" and \"hear\" an EL than existing metrics such as topographic similarity or bag-of-symbols disentanglement.", "area": "Phonology", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["emergent language", "morphology", "emergent communication", "compositionality"], "openreview_url": "https://openreview.net/forum?id=yrDc8AYupT", "contribution_types": ["Analysis"]}, {"id": "UIfcbZXHsr", "title": "RaFT-DM: A Residue-Aware Fusion Transformer with Domain-Wise Memory for Accurate Multi-Label Protein Function Prediction", "abstract": "Accurate protein function prediction via modeling protein sequences as long structured symbolic sequences is essential for understanding cellular mechanisms and guiding drug discovery. However, conventional deep learning models often use global pooling, which weakens domain-specific signals and fails to capture contextual dependencies across domains. Here, we propose $\\underline{\\textbf{R}}$esidue-$\\underline{\\textbf{a}}$ware $\\underline{\\textbf{F}}$usion $\\underline{\\textbf{T}}$ransformer with $\\underline{\\textbf{D}}$omain-wise $\\underline{\\textbf{M}}$emory ($\\textbf{RaFT-DM}$), a segment-aware multimodal modeling framework that introduces explicit memory over structured segments. RaFT-DM performs residue-level cross-attention between sequence and structure embeddings, and segments the fused representation using InterProScan-derived domain annotations. A BiLSTM initialized with a global token then captures segment-level contextual semantics, preserving local discriminative features while modeling inter-segment relationships. Experiments on standard benchmarks show that RaFT-DM consistently outperforms state-of-the-art baselines. By replacing global pooling with domain-aware modeling, RaFT-DM reduces missed recalls and misclassifications, enabling more accurate and interpretable predictions. The implementation of RaFT-DM is available at https://github.com/anonymous/RaFT-DM.", "area": "Clinical and Biomedical Applications", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Protein Function Prediction", "Protein Language Models", "Domain-aware Modeling", "Gene Ontology", "Graph Neural Networks"], "openreview_url": "https://openreview.net/forum?id=UIfcbZXHsr", "contribution_types": ["Analysis", "Engineering"]}, {"id": "Pvg8r73DEq", "title": "DeepPresenter: Environment-Grounded Reflection for Agentic Presentation Generation", "abstract": "Presentation generation requires deep content research, coherent visual design, and iterative refinement based on observation. \nHowever, existing presentation agents often rely on predefined workflows and fixed templates. \nTo address this, we present DeepPresenter, an agentic framework that adapts to diverse user intents, enables effective feedback-driven refinement, and generalizes beyond a scripted pipeline.\nSpecifically, DeepPresenter autonomously plans, renders, and revises intermediate slide artifacts to support long-horizon refinement with environmental observations.\nFurthermore, rather than relying on self-reflection over internal signals (e.g., reasoning traces), our environment-grounded reflection conditions the generation process on perceptual artifact states (e.g., rendered slides), enabling the system to identify and correct presentation-specific issues during execution.\nResults on the evaluation set covering diverse presentation-generation scenarios show that DeepPresenter achieves state-of-the-art performance, and the fine-tuned \\model remains highly competitive at substantially lower cost.", "area": "AI/LLM Agents", "paper_type": "Long", "has_code": false, "code_links": [], "keywords": ["Presentation Generation", "LLM Agents", "Multi-Agent Collaboration", "Environment-Grounded Reflection", "Trajectory Synthesis"], "openreview_url": "https://openreview.net/forum?id=Pvg8r73DEq", "contribution_types": ["Engineering", "Dataset"]}, {"id": "OQiuouhVPB", "title": "Stability Implies Redundancy: Delta Attention Selective Halting for Efficient Long-Context Prefilling", "abstract": "Prefilling computational costs pose a significant bottleneck for Large Language Models (LLMs) and Large Multimodal Models (LMMs) in long-context settings. While token pruning reduces sequence length, prior methods rely on heuristics that break compatibility with ha
