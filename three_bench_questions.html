<html lang="zh-CN" data-theme="dark">

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>预测基准 · 逐题看板</title><link rel="stylesheet" href="three_bench_questions_assets/style.css"><script src="three_bench_questions_assets/app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-icon">P</span><span>PREDICTION LAB <small>研究资料 · 三套基准</small></span></a><div class="topright"><span class="snapshot">2026.11.02 数据快照</span><button id="theme" aria-label="切换到浅色主题">☀ 浅色</button></div></header>
<main>
<section class="hero"><div><p class="eyebrow">THE QUESTION EXPLORER</p><h1>从一道真题，<span>看清预测任务。</span></h1><p class="lede">完整题面、参考答案、结算条件与评分细则，在同一个入口逐题查看。</p></div><div class="hero-note"><span class="live-dot"></span> 公开题库已落盘<small>原题保留原文 · 中文导览<br>不包含模型实测成绩</small></div></section>
<nav class="bench-tabs" role="tablist" aria-label="基准切换">
<button id="tab-ile" role="tab" aria-selected="true" aria-controls="panel-ile" data-bench="ile"><span class="tabnum">01</span><span><b>ILE</b><small>86 道金融研究任务</small></span><span class="tabarrow">↗</span></button>
<button id="tab-futurex" role="tab" aria-selected="false" aria-controls="panel-futurex" data-bench="futurex"><span class="tabnum">02</span><span><b>FutureX</b><small>1,903 历史题 + 80 当期题</small></span><span class="tabarrow">↗</span></button>
<button id="tab-forecastbench" role="tab" aria-selected="false" aria-controls="panel-forecastbench" data-bench="forecastbench"><span class="tabnum">03</span><span><b>ForecastBench</b><small>最新 500 题 · 全部 42 批次</small></span><span class="tabarrow">↗</span></button>
<button id="tab-scope" role="tab" aria-selected="false" aria-controls="panel-scope" data-bench="scope"><span class="tabnum">↧</span><span><b>数据与来源</b><small>下载范围 / 版本 / 口径</small></span></button>
</nav>
<div id="notice" role="status" aria-live="polite">正在读取题库…</div>
<section id="panel-ile" class="bench-panel" role="tabpanel" aria-labelledby="tab-ile"></section>
<section id="panel-futurex" class="bench-panel" role="tabpanel" aria-labelledby="tab-futurex" hidden></section>
<section id="panel-forecastbench" class="bench-panel" role="tabpanel" aria-labelledby="tab-forecastbench" hidden></section>
<section id="panel-scope" class="bench-panel" role="tabpanel" aria-labelledby="tab-scope" hidden></section>
<footer>仅用于研究资料浏览。参考答案与未来结算属于评测端材料，正式预测时须隔离。<span>资料截至下载快照；“待结算”不根据日期自动猜测。</span></footer>
</main></body></html>
