# GitHub Actions: 部署 _experiments/ 目录到 GitHub Pages
# 使用方法：把这个 .github/workflows/deploy.yml 放到目标仓库（如 linjh1118.github.io）
name: Deploy Experiments to Pages

on:
  push:
    branches: [main]  # 只在 main 分支触发
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate index.html
        run: python3 scripts/gen_index.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # 上传整个仓库，GitHub Pages 会从 root Serving

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
